# Learning OS v3 — CI validation (added 2026-08-03, ADR-003 S5).
# Runs the same validator the pre-commit hook runs locally, so a bad state
# can never live unnoticed on the remote. Weekly run adds --online (URL-rot
# audit over the sources registry — the job local runs skip).
name: validate

on:
  push:
    branches: ['**']
  pull_request: {}
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC ≈ 08:00 Berlin
  workflow_dispatch: {}

# Read-only: this workflow checks out both repositories and runs the local
# paired gate. It never pushes, tags, releases, or otherwise needs write
# access to anything — narrowing this is free safety, not a functional change.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repository
    steps:
      - name: Check out Core
        uses: actions/checkout@v4
        with:
          path: repository

      # The public manifest has a separately released UI consumer. Checking
      # its mirror only in the UI repository recreates the failure topology the
      # producer-owned manifest contract removed: Core can pass while shipping
      # a shape the UI cannot decode.
      #
      # Prefer a same-named consumer branch when one exists, otherwise use main.
      # This makes a two-repository change test the pair being reviewed without
      # reintroducing a permanent branch pin. The old static pin verified one
      # historical branch forever; the old unpinned form verified every Core
      # feature branch against UI main even when its matching UI branch existed.
      - name: Resolve the matching consumer branch
        id: consumer-ref
        env:
          REQUESTED_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads \
            https://github.com/Aram164/learningos-obsidian-ui.git \
            "refs/heads/$REQUESTED_REF" >/dev/null 2>&1; then
            echo "ref=$REQUESTED_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the paired UI consumer
        uses: actions/checkout@v4
        with:
          repository: Aram164/learningos-obsidian-ui
          ref: ${{ steps.consumer-ref.outputs.ref }}
          path: obsidian-ui

      # Named by SHA, not only by ref: a branch name can move between the
      # checkout above and anyone reading this log later. Printing the exact
      # commit is what lets a reviewer answer "which UI did this run actually
      # verify against?" without re-running anything.
      - name: Print the resolved UI ref and commit
        working-directory: obsidian-ui
        env:
          RESOLVED_UI_REF: ${{ steps.consumer-ref.outputs.ref }}
        run: |
          printf 'UI ref resolved: %s\n' "$RESOLVED_UI_REF"
          printf 'UI commit checked out: %s\n' "$(git rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Core development dependencies
        run: pip install -e ".[dev]"
      - name: Install UI dependencies
        working-directory: obsidian-ui
        run: npm ci --ignore-scripts

      # The exact local paired release gate — not a partial duplicate of it.
      # This installs both dependency sets above specifically because
      # `make system-check` ends by running the UI's own complete `npm run
      # check` (build, typecheck, contract gate, fixture suites, and the
      # real cross-process Gateway recovery harness against this Core), so
      # ordinary CI exercises the identical command a release does locally.
      - name: paired release gate (make system-check)
        run: make system-check
      - name: URL-rot audit (weekly only)
        if: github.event_name == 'schedule'
        run: python tools/validate.py --online
