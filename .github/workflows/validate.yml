# Learning OS v3 — CI validation (added 2026-08-03, ADR-003 S5).
# Runs the same validator the pre-commit hook runs locally, so a bad state
# can never live unnoticed on the remote. Weekly run adds --online (URL-rot
# audit over the sources registry — the job local runs skip).
name: validate

on:
  push:
    branches: ['**']
  pull_request: {}
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC ≈ 08:00 Berlin
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repository
    steps:
      - name: Check out Core
        uses: actions/checkout@v4
        with:
          path: repository

      # The Job dashboard schema has a separately released consumer. Checking
      # its mirror only in the UI repository recreates the failure topology the
      # producer-owned manifest contract removed: Core can pass while shipping
      # a shape the UI cannot decode.
      #
      # Prefer a same-named consumer branch when one exists, otherwise use main.
      # This makes a two-repository change test the pair being reviewed without
      # reintroducing a permanent branch pin. The old static pin verified one
      # historical branch forever; the old unpinned form verified every Core
      # feature branch against UI main even when its matching UI branch existed.
      - name: Resolve the matching consumer branch
        id: consumer-ref
        env:
          REQUESTED_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads \
            https://github.com/Aram164/learningos-obsidian-ui.git \
            "refs/heads/$REQUESTED_REF" >/dev/null 2>&1; then
            echo "ref=$REQUESTED_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the Job dashboard consumer
        uses: actions/checkout@v4
        with:
          repository: Aram164/learningos-obsidian-ui
          ref: ${{ steps.consumer-ref.outputs.ref }}
          path: obsidian-ui

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e ".[dev]"
      # Runs before the validator and the tests because it is the cheapest gate
      # and it catches the class of finding that previously only careful reading
      # found — dead imports, dead re-exports, bindings never read.
      - name: lint (ruff)
        run: ruff check tools tests
      - name: producer-side Core/UI contract gate
        working-directory: obsidian-ui
        run: npm run contract:check
      - name: validate (schemas + VALIDATION.md rules)
        run: python tools/validate.py
      # The Job tree is quarantined and never pushed, so this is a no-op here
      # and a real gate on the machine that has it. It runs in CI anyway so the
      # script itself stays executable — a checker that only ever runs on one
      # laptop is the failure mode §1.5 was written about.
      - name: check Job plan anchors, resources and concepts
        run: python tools/check_job_plans.py
      - name: URL-rot audit (weekly only)
        if: github.event_name == 'schedule'
        run: python tools/validate.py --online
      - name: tests
        run: python -m pytest -q
