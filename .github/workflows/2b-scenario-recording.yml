name: Package 2B scenario recording

on:
  push:
    branches: [remediation/2b-authority-keeper]
    paths:
      - .github/workflows/2b-scenario-recording.yml

permissions:
  contents: read

env:
  PYTEST_ADDOPTS: ""
  SCENARIOS: >-
    ai-action.delivery.apply or ai-action.delivery.preview or backup.manifest
    or capabilities.read or lineage.restamp or operator.bootstrap
    or concept.relations.change or cli.ui-capability

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Core
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Refresh the affected scenario recordings
        env:
          LOS_RECORD_SCENARIOS: '1'
        run: .venv/bin/python -m pytest -q tests/test_scenarios_effects.py -k "$SCENARIOS"
      - name: Compare against the generated recordings
        run: .venv/bin/python -m pytest -q tests/test_scenarios_effects.py -k "$SCENARIOS"
      - name: Export the exact recording delta
        run: |
          git diff --check -- tests/scenarios/recorded
          git diff --binary -- tests/scenarios/recorded > "$RUNNER_TEMP/2b-recordings.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/2b-recordings-core.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: 2b-scenario-recordings
          path: |
            ${{ runner.temp }}/2b-recordings.patch
            ${{ runner.temp }}/2b-recordings-core.sha
          if-no-files-found: error
