jobs:
  pytest-shards:
    runs-on: ubuntu-latest
    # The unsharded suite took 2h01m of pytest; legs are balanced to well
    # under 45 minutes, and a leg that hangs must die rather than queue.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [witness-0, witness-1, rest-0, rest-1, rest-2]
    defaults:
      run:
        working-directory: repository
    steps:
      - name: Validate the exact-SHA inputs before checking anything out
        id: inputs
        env:
          CORE_SHA_INPUT: ${{ github.event.inputs.core_sha }}
          UI_SHA_INPUT: ${{ github.event.inputs.ui_sha }}
        run: |
          core_sha="$CORE_SHA_INPUT"
          ui_sha="$UI_SHA_INPUT"
          echo "$core_sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "core_sha must be exactly 40 lowercase hex characters" >&2; exit 1; }
          echo "$ui_sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "ui_sha must be exactly 40 lowercase hex characters" >&2; exit 1; }
          echo "core_sha=$core_sha" >> "$GITHUB_OUTPUT"
          echo "ui_sha=$ui_sha" >> "$GITHUB_OUTPUT"

      - name: Check out Core at the exact SHA
        uses: actions/checkout@v4
        with:
          path: repository
          ref: ${{ steps.inputs.outputs.core_sha }}
          fetch-depth: 0

      - name: Check out UI at the exact SHA
        uses: actions/checkout@v4
        with:
          repository: Aram164/learningos-obsidian-ui
          path: obsidian-ui
          ref: ${{ steps.inputs.outputs.ui_sha }}
          fetch-depth: 0

      - name: Verify each checkout is exactly the requested commit and clean
        env:
          EXPECTED_CORE_SHA: ${{ steps.inputs.outputs.core_sha }}
          EXPECTED_UI_SHA: ${{ steps.inputs.outputs.ui_sha }}
        run: |
          set -eu
          core_actual="$(git -C repository rev-parse HEAD)"
          if [ "$core_actual" != "$EXPECTED_CORE_SHA" ]; then
            echo "Core checked out $core_actual, requested $EXPECTED_CORE_SHA" >&2
            exit 1
          fi
          test -z "$(git -C repository status --porcelain)" \
            || { echo "Core checkout is not clean" >&2; exit 1; }
          ui_actual="$(git -C obsidian-ui rev-parse HEAD)"
          if [ "$ui_actual" != "$EXPECTED_UI_SHA" ]; then
            echo "UI checked out $ui_actual, requested $EXPECTED_UI_SHA" >&2
            exit 1
          fi
          test -z "$(git -C obsidian-ui status --porcelain)" \
            || { echo "UI checkout is not clean" >&2; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The documented project environment is the repository venv: parser
      # diagnostics are characterized bytes pinned to this interpreter, and
      # the procedure transcripts invoke $LOS_REPO/.venv/bin/python.
      - name: Install Core development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Install UI dependencies
        working-directory: obsidian-ui
        run: npm ci --ignore-scripts

      # The procedure transcripts (tests/test_procedures.py, PLAN D11) run
      # under Scrut v0.5.0. The release archive is pinned by GitHub's
      # published SHA-256 and checked before use; the binary stays outside
      # the checkout, clear of the tree-contract test, and reaches the gate
      # as LOS_SCRUT_BIN.
      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v

      - name: Install Scrut v0.5.0 (pinned digest)
        run: |
          set -eu
          dir="$RUNNER_TEMP/scrut"
          mkdir -p "$dir"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$dir/scrut.tar.gz" \
            https://github.com/facebookincubator/scrut/releases/download/v0.5.0/scrut-v0.5.0-linux-x86_64.tar.gz
          echo "5c373d077a73dc4a5d4b43f3474e0f443dc72fb42f89b312ef55f934e6e6ba15  $dir/scrut.tar.gz" | sha256sum -c -
          tar -xzf "$dir/scrut.tar.gz" -C "$dir"
          bin="$(find "$dir" -type f -name scrut | head -n 1)"
          test -n "$bin"
          chmod 0755 "$bin"
          test "$("$bin" --version)" = "scrut 0.5.0"
          echo "LOS_SCRUT_BIN=$bin" >> "$GITHUB_ENV"

      - name: Resolve this shard's file list from the manifest
        id: pick
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          files="$(python3 -c '
          import json, os, sys
          manifest = json.loads(os.environ["SHARD_MANIFEST"])["legs"]
          shard = sys.argv[1]
          try:
              files = manifest[shard]
          except KeyError:
              raise SystemExit(f"shard {shard!r} is not in SHARD_MANIFEST")
          missing = sorted(f for f in files if not os.path.isfile(f))
          assert not missing, f"shard {shard}: files missing from tests/: {missing}"
          print("\n".join(files))
          ' "$SHARD")"
          count="$(printf '%s' "$files" | grep -c .)"
          printf 'shard %s: %s files\n' "$SHARD" "$count"
          {
            echo "files<<SHARD_FILES_EOF"
            printf '%s\n' "$files"
            echo "SHARD_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Same selection the unsharded gate pinned: deselect exactly the
      # `live_install` marker, nothing broader. The file list comes only
      # from the manifest; a leg never adds its own -k or -m filters.
      # --basetemp pins the session witness file and audit dir under
      # witness-out/ so the witness legs can upload them for the zz merge.
      - name: Run this shard of the suite
        env:
          PYTEST_ADDOPTS: '-m "not live_install"'
          LOS_RATCHET_BASE: origin/main
          SHARD: ${{ matrix.shard }}
          PICKED: ${{ steps.pick.outputs.files }}
        run: |
          set -eu
          mkdir -p ../junit-out
          # shellcheck disable=SC2086  # manifest paths contain no spaces
          .venv/bin/python -m pytest -q --basetemp=../pytesttmp \
            --junitxml="../junit-out/junit-$SHARD.xml" $PICKED

      - name: Upload this shard's JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.shard }}
          path: junit-out/
          if-no-files-found: error

      # The A9/A19 population artifacts (witness legs only): the session
      # witness file, its attribution sidecar, and the audit dir with its
      # cases.txt index. zz legs download exactly these, merge them, and
      # assert over the whole suite's population.
      - name: Upload the witness population (witness legs only)
        if: always() && startsWith(matrix.shard, 'witness')
        uses: actions/upload-artifact@v4
        with:
          name: witness-${{ matrix.shard }}
          path: |
            pytesttmp/**/sites.jsonl
            pytesttmp/**/sites.jsonl.attribution.json
            pytesttmp/**/operational-audit*
          if-no-files-found: error

  # The zz population files, over the merged witness population of the
  # producer legs. test_scenarios_zz_refusal_sites.py (~40 min unsplit,
  # the slowest file in the suite) is hash-split over the four legs;
  # test_scenarios_zz_operational_owners.py runs whole in zz-0.
  zz-shards:
    needs: [pytest-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [zz-0, zz-1, zz-2, zz-3]
    defaults:
      run:
        working-directory: repository
    steps:
      - name: Validate the exact-SHA inputs before checking anything out
        id: inputs
        env:
          CORE_SHA_INPUT: ${{ github.event.inputs.core_sha }}
          UI_SHA_INPUT: ${{ github.event.inputs.ui_sha }}
        run: |
          core_sha="$CORE_SHA_INPUT"
          ui_sha="$UI_SHA_INPUT"
          echo "$core_sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "core_sha must be exactly 40 lowercase hex characters" >&2; exit 1; }
          echo "$ui_sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "ui_sha must be exactly 40 lowercase hex characters" >&2; exit 1; }
          echo "core_sha=$core_sha" >> "$GITHUB_OUTPUT"
          echo "ui_sha=$ui_sha" >> "$GITHUB_OUTPUT"

      - name: Check out Core at the exact SHA
        uses: actions/checkout@v4
        with:
          path: repository
          ref: ${{ steps.inputs.outputs.core_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - name: Install Core development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - name: Install Scrut v0.5.0 (pinned digest)
        run: |
          set -eu
          dir="$RUNNER_TEMP/scrut"
          mkdir -p "$dir"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$dir/scrut.tar.gz" \
            https://github.com/facebookincubator/scrut/releases/download/v0.5.0/scrut-v0.5.0-linux-x86_64.tar.gz
          echo "5c373d077a73dc4a5d4b43f3474e0f443dc72fb42f89b312ef55f934e6e6ba15  $dir/scrut.tar.gz" | sha256sum -c -
          tar -xzf "$dir/scrut.tar.gz" -C "$dir"
          bin="$(find "$dir" -type f -name scrut | head -n 1)"
          test -n "$bin"
          chmod 0755 "$bin"
          test "$("$bin" --version)" = "scrut 0.5.0"
          echo "LOS_SCRUT_BIN=$bin" >> "$GITHUB_ENV"

      - name: Download the witness population
        uses: actions/download-artifact@v4
        with:
          pattern: witness-*
          path: witness-in

      # Deterministic merge (leg order = artifact name order): the witness
      # lines concatenate, the attribution sidecars re-key onto the merged
      # file, the audit logs union, and cases.txt keeps its entry set.
      - name: Merge the witness population
        run: |
          set -eu
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          # pytest's mktemp leaves a <name>current symlink beside each
          # real session dir; resolve-dedupe so nothing counts twice.
          src = Path("../witness-in")
          sites = sorted({p.resolve()
                          for p in src.glob("witness-*/**/sites.jsonl")})
          sidecars = sorted({p.resolve() for p in
                             src.glob("witness-*/**/sites.jsonl.attribution.json")})
          audits = sorted({p.resolve() for p in
                           src.glob("witness-*/**/operational-audit*")
                           if p.is_dir()})
          assert sites and sidecars and audits, (
              f"witness population incomplete: {len(sites)} witness files, "
              f"{len(sidecars)} sidecars, {len(audits)} audit dirs")
          assert len(sites) == len(sidecars) == len(audits)

          merged = Path("../merged")
          audit = merged / "audit"
          audit.mkdir(parents=True)
          with open(merged / "sites.jsonl", "wb") as out:
              for part in sites:
                  out.write(part.read_bytes())
          attribution = {}
          for part in sidecars:
              for key, pairs in json.loads(
                      part.read_text(encoding="utf-8")).items():
                  attribution.setdefault(key, []).extend(pairs)
          (merged / "attr.json").write_text(
              json.dumps(attribution, sort_keys=True), encoding="utf-8")
          cases = []
          for directory in audits:
              for log in sorted(directory.glob("*.jsonl")):
                  shutil.copy(log, audit / log.name)
              index = directory / "cases.txt"
              if index.is_file():
                  cases.extend(index.read_text(encoding="utf-8").split())
          (audit / "cases.txt").write_text(
              "\n".join(dict.fromkeys(cases)) + "\n", encoding="utf-8")
          print(f"merged {len(sites)} witness legs: "
                f"{sum(1 for _ in open(merged / 'sites.jsonl'))} witness lines, "
                f"{len(list(audit.glob('*.jsonl')))} audit logs")
          PY
          merged="$(cd ../merged && pwd)"
          {
            echo "LOS_PREMERGED_WITNESS=$merged/sites.jsonl"
            echo "LOS_PREMERGED_ATTRIBUTION=$merged/attr.json"
            echo "LOS_PREMERGED_AUDIT_DIR=$merged/audit"
          } >> "$GITHUB_ENV"

      - name: Resolve this leg's node shard from the manifest
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          spec="$(python3 -c '
          import json, os
          manifest = json.loads(os.environ["SHARD_MANIFEST"])["node_shards"]
          shard = os.environ["SHARD"]
          for fname, spec in manifest.items():
              legs = spec["legs"]
              if shard in legs:
                  stem = fname.rsplit("/", 1)[-1]
                  print(f"{stem}={legs.index(shard)}/{spec[\"count\"]}")
                  break
          else:
              raise SystemExit(f"zz leg {shard!r} has no node_shards entry")
          ')"
          printf 'node shard: %s\n' "$spec"
          echo "LOS_NODE_SHARDS=$spec" >> "$GITHUB_ENV"

      - name: Resolve this shard's file list from the manifest
        id: pick
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          files="$(python3 -c '
          import json, os, sys
          manifest = json.loads(os.environ["SHARD_MANIFEST"])["legs"]
          shard = sys.argv[1]
          try:
              files = manifest[shard]
          except KeyError:
              raise SystemExit(f"shard {shard!r} is not in SHARD_MANIFEST")
          missing = sorted(f for f in files if not os.path.isfile(f))
          assert not missing, f"shard {shard}: files missing from tests/: {missing}"
          print("\n".join(files))
          ' "$SHARD")"
          count="$(printf '%s' "$files" | grep -c .)"
          printf 'shard %s: %s files\n' "$SHARD" "$count"
          {
            echo "files<<SHARD_FILES_EOF"
            printf '%s\n' "$files"
            echo "SHARD_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run this zz shard of the suite
        env:
          PYTEST_ADDOPTS: '-m "not live_install"'
          LOS_RATCHET_BASE: origin/main
          SHARD: ${{ matrix.shard }}
          PICKED: ${{ steps.pick.outputs.files }}
        run: |
          set -eu
          mkdir -p ../junit-out
          # shellcheck disable=SC2086  # manifest paths contain no spaces
          .venv/bin/python -m pytest -q --basetemp=../pytesttmp \
            --junitxml="../junit-out/junit-$SHARD.xml" $PICKED

      - name: Upload this shard's JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.shard }}
          path: junit-out/
          if-no-files-found: error

  # The UI's own complete check (build, typecheck, contract gate, fixture
  # suites, and the real cross-process Gateway recovery harness against
  # this Core) — the same `npm run check` the local paired gate runs last.
  ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Validate the exact-SHA inputs before checking anything out
        id: inputs
        env:
          CORE_SHA_INPUT: ${{ github.event.inputs.core_sha }}
          UI_SHA_INPUT: ${{ github.event.inputs.ui_sha }}
        run: |
          core_sha="$CORE_SHA_INPUT"
          ui_sha="$UI_SHA_INPUT"
          echo "$core_sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "core_sha must be exactly 40 lowercase hex characters" >&2; exit 1; }
          echo "$ui_sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "ui_sha must be exactly 40 lowercase hex characters" >&2; exit 1; }
          echo "core_sha=$core_sha" >> "$GITHUB_OUTPUT"
          echo "ui_sha=$ui_sha" >> "$GITHUB_OUTPUT"

      - name: Check out Core at the exact SHA
        uses: actions/checkout@v4
        with:
          path: repository
          ref: ${{ steps.inputs.outputs.core_sha }}
          fetch-depth: 0

      - name: Check out UI at the exact SHA
        uses: actions/checkout@v4
        with:
          repository: Aram164/learningos-obsidian-ui
          path: obsidian-ui
          ref: ${{ steps.inputs.outputs.ui_sha }}
          fetch-depth: 0

      - name: Verify each checkout is exactly the requested commit and clean
        env:
          EXPECTED_CORE_SHA: ${{ steps.inputs.outputs.core_sha }}
          EXPECTED_UI_SHA: ${{ steps.inputs.outputs.ui_sha }}
        run: |
          set -eu
          core_actual="$(git -C repository rev-parse HEAD)"
          if [ "$core_actual" != "$EXPECTED_CORE_SHA" ]; then
            echo "Core checked out $core_actual, requested $EXPECTED_CORE_SHA" >&2
            exit 1
          fi
          test -z "$(git -C repository status --porcelain)" \
            || { echo "Core checkout is not clean" >&2; exit 1; }
          ui_actual="$(git -C obsidian-ui rev-parse HEAD)"
          if [ "$ui_actual" != "$EXPECTED_UI_SHA" ]; then
            echo "UI checked out $ui_actual, requested $EXPECTED_UI_SHA" >&2
            exit 1
          fi
          test -z "$(git -C obsidian-ui status --porcelain)" \
            || { echo "UI checkout is not clean" >&2; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install UI dependencies
        working-directory: obsidian-ui
        run: npm ci --ignore-scripts
      - name: UI check (npm run check)
        working-directory: obsidian-ui
        run: npm run check

  # The join point: nothing is green until the shards are proven to be
  # exactly the whole suite, the static gates pass, and every leg passed.
  gate:
    needs: [pytest-shards, zz-shards, ui-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: repository
    steps:
      - name: Validate the exact-SHA inputs before checking anything out
        id: inputs
        env:
          CORE_SHA_INPUT: ${{ github.event.inputs.core_sha }}
          UI_SHA_INPUT: ${{ github.event.inputs.ui_sha }}
        run: |
          core_sha="$CORE_SHA_INPUT"
          ui_sha="$UI_SHA_INPUT"
          echo "$core_sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "core_sha must be exactly 40 lowercase hex characters" >&2; exit 1; }
          echo "$ui_sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "ui_sha must be exactly 40 lowercase hex characters" >&2; exit 1; }
          echo "core_sha=$core_sha" >> "$GITHUB_OUTPUT"
          echo "ui_sha=$ui_sha" >> "$GITHUB_OUTPUT"
          echo "core_sha_short=${core_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "ui_sha_short=${ui_sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Check out Core at the exact SHA
        uses: actions/checkout@v4
        with:
          path: repository
          ref: ${{ steps.inputs.outputs.core_sha }}
          fetch-depth: 0

      - name: Check out UI at the exact SHA
        uses: actions/checkout@v4
        with:
          repository: Aram164/learningos-obsidian-ui
          path: obsidian-ui
          ref: ${{ steps.inputs.outputs.ui_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Core development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Install UI dependencies
        working-directory: obsidian-ui
        run: npm ci --ignore-scripts

      - name: Download every shard's JUnit results
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          merge-multiple: true
          path: junit-in

      # The completeness proof, run on every trigger: collect the whole
      # suite fresh, count <testcase> elements across all shard results,
      # and require set equality — no test lost, none duplicated, none
      # invented. Then the static gates the local paired gate runs before
      # pytest: lint, typecheck, validate, warning baseline.
      - name: Prove the shards are exactly the suite, then run static gates
        run: |
          set -eu
          .venv/bin/python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = json.loads(os.environ["SHARD_MANIFEST"])
          disk = sorted(p.name for p in Path("tests").glob("test_*.py"))
          from collections import Counter
          covered = Counter(f for leg in manifest["legs"].values()
                            for f in leg)
          for name, count in sorted(covered.items()):
              expected = (manifest.get("node_shards", {}).get(name, {})
                          .get("count", 1))
              assert count == expected, (
                  f"{name} appears in {count} legs, expected {expected}")
          assert sorted(covered) == disk, (
              f"SHARD_MANIFEST does not partition tests/: "
              f"missing={sorted(set(disk) - set(covered))} "
              f"extra={sorted(set(covered) - set(disk))}")

          out = subprocess.run(
              [".venv/bin/python", "-m", "pytest", "--collect-only", "-q",
               "-m", "not live_install"],
              capture_output=True, text=True, check=True)
          tail = out.stdout.strip().splitlines()[-1]
          # "8520/8521 tests collected (1 deselected) in 7.26s"
          collected = int(tail.split()[0].split("/")[0])
          ran = 0
          for path in sorted(Path("../junit-in").glob("junit-*.xml")):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  ran += 1
                  if list(case):
                      sys.exit(f"{path.name}: failing testcase "
                               f"{case.get('classname')}::{case.get('name')}")
          assert ran == collected, (
              f"shards ran {ran} tests; the full collection has {collected} "
              "(deselecting live_install) — a test was lost, duplicated "
              "or added")
          print(f"gate: {ran} tests across shards == full collection")
          PY
          .venv/bin/python -m ruff check tools tests
          .venv/bin/python tools/code_reachability.py
          .venv/bin/python -m mypy
          .venv/bin/python tools/validate.py --no-report
          .venv/bin/python tools/warning_baseline.py --check

      # The UI build always uses its own checked-out Git revision (never a
      # generic GITHUB_SHA, which here would be the *Core* checkout's SHA) —
      # build.mjs enforces this itself; nothing extra is set here.
      - name: Rebuild the UI once more to record the exact, now-verified pair
        working-directory: obsidian-ui
        run: npm run build:info

      - name: Generate the pair receipt
        env:
          CORE_SHA: ${{ steps.inputs.outputs.core_sha }}
          UI_SHA: ${{ steps.inputs.outputs.ui_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          .venv/bin/python tools/release_pair_receipt.py generate \
            --core-root . \
            --ui-root ../obsidian-ui \
            --core-sha "$CORE_SHA" \
            --ui-sha "$UI_SHA" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --live-install-scope not-run-live-install-deselected \
            --out ../release-pair-artifact/pair-receipt.json

      - name: Assemble the fixed upload layout
        working-directory: .
        run: |
          mkdir -p release-pair-artifact/plugin
          cp obsidian-ui/plugin/main.js release-pair-artifact/plugin/main.js
          cp obsidian-ui/plugin/styles.css release-pair-artifact/plugin/styles.css
          cp obsidian-ui/plugin/manifest.json release-pair-artifact/plugin/manifest.json
          cp obsidian-ui/plugin/build-info.json release-pair-artifact/plugin/build-info.json

      - name: Verify the assembled artifact against its own receipt
        run: |
          .venv/bin/python tools/release_pair_receipt.py verify \
            --receipt ../release-pair-artifact/pair-receipt.json \
            --artifact-dir ../release-pair-artifact

      - name: Upload learningos-pair-<core-12>-<ui-12>
        uses: actions/upload-artifact@v4
        with:
          name: "learningos-pair-${{ steps.inputs.outputs.core_sha_short }}-${{ steps.inputs.outputs.ui_sha_short }}"
          path: release-pair-artifact
          if-no-files-found: error
