perimeter_version: 1
roots:
  wrapper: .
  umbrella: LearningOS
applies_when_present:
- LearningOS/obsidian-ui
- LearningOS/workbench
- LearningOS/archive
material_suffixes:
- .pdf
- .epub
- .djvu
- .mobi
- .azw3
- .pptx
- .ppt
- .mp4
- .mkv
- .mov
- .m4v
- .webm
ephemera:
- .DS_Store
- .git
- .obsidian
- .venv
- .idea
- .smart-env
entries:
- path: .gitignore
  kind: file
  owner: operator
  purpose: tracks the knowledge system and excludes the heavy material tree.
- path: .claude
  kind: directory
  owner: agent-config
  purpose: Claude Code project configuration.
- path: .opencode
  kind: file
  class: contract
  authority: binding
  owner: agent-roles
  purpose: The 0x-alpha reviewer rule set. Instruction-bearing and binding on the
    reviewer, and governed by nothing else — the normative corpus cannot reach outside
    the repository.
- path: AGENTS.md
  kind: document
  class: contract
  authority: binding
  owner: agent-roles
  annotation: role division for Codex and other agents
  purpose: The role division for Codex and other agents. Loaded only when an agent
    starts from the wrapper root; repository/AGENTS.md names it as a required read
    precisely because an agent starting inside repository/ never sees it.
- path: tools
  kind: directory
  owner: agent-pipeline
  annotation: engineering orchestration; not a LearningOS product surface
  purpose: 'The coding-agent pipeline that drives Core and the UI together. It is
    declared here rather than under repository/tools/ for two reasons: it orchestrates
    both nested repositories, so it belongs at the level that contains both; and it
    checks Core out into per-issue worktrees handed to write-capable agents, so living
    inside Core would place the orchestrator''s own configuration inside every sandbox
    it creates. Not imported by learning_os, not exposed through los.py, never in
    the manifest.'
- path: LearningOS
  kind: directory
  owner: learningos
  purpose: the umbrella for every LearningOS component (ADR-014).
- path: Stratum
  kind: nested_repo
  owner: external
  annotation: independent external Git repository; never traversed
  purpose: An independent external Git repository, declared by ADR-014 and rendered
    in ARCHITECTURE §3.1. Keeps its own remotes and worktree. LearningOS never indexes,
    validates or manages it; never traversed.
- path: tpcx-ai-v2.0.0
  kind: directory
  owner: external
  annotation: the operator's own TPC-DS/AI vendor download; never traversed
  purpose: 'The TPCx-AI v2.0.0 benchmark kit (~1.0 GB), downloaded by the operator
    from tpc.org under their own one-time key. It is not LearningOS material and must
    never be filed into it: an earlier pass read it as loose material and buried it
    under LearningOS/archive/, which silently broke the venv inside it whose 1893
    shebangs carry this absolute path. Because the wrapper .gitignore excludes it,
    git recorded nothing and there was no commit to revert. Declared here so the perimeter
    stops reporting it as undeclared, and so the next reader learns it is hands-off
    rather than cleanup fodder. Never traversed, never validated, never relocated.'
- path: LearningOS/repository
  kind: nested_repo
  owner: learningos
  purpose: the authored repository of record.
- path: LearningOS/obsidian-ui
  kind: nested_repo
  owner: learningos
  purpose: the independent interface repository.
- path: LearningOS/materials
  kind: directory
  owner: materials
  file_policy: managed
  annotation: books, slides, videos, datasets — addressable as material://
  purpose: Course material — books, slides, videos, datasets. Every file is addressable
    as material:// through the managed ingest. This is the one directory a perimeter-level
    duplicate is measured against.
- path: LearningOS/projects
  kind: directory
  owner: projects
  purpose: active LearningOS-owned code repositories.
- path: LearningOS/workbench
  kind: directory
  owner: workbench
  purpose: disposable audits, strategy and scratch tooling (ADR-014).
- path: LearningOS/archive
  kind: directory
  owner: archive
  purpose: retired, recoverable, non-active artifacts.
- path: LearningOS/legacy
  kind: directory
  owner: legacy
  purpose: the frozen pre-v3 tree and the preserved former Job source (ADR-014).
- path: LearningOS/README.md
  kind: document
  class: reference
  authority: informative
  owner: learningos
- path: LearningOS/CLAUDE.md
  kind: symlink
  target: repository/system/CLAUDE.md
  owner: learningos
  purpose: the Claude adapter, reachable from the umbrella.
- path: LearningOS/Plans
  kind: symlink
  target: legacy/Plans
  owner: legacy
- path: LearningOS/.env
  kind: file
  owner: operator
  purpose: bounded review client credentials (ADR-014); never committed.
pending_disposition: []
