# The perimeter — the shape of the two levels above repository/.
#
# WHY THIS FILE EXISTS
# --------------------
# ADR-014 declares the umbrella's shape and nothing enforced it. The 2026-09-03
# audit found two invisibilities stacked on top of each other:
#
#   1. The umbrella level is in NO git index. The wrapper's .gitignore ignores
#      `LearningOS/` wholly, so `git ls-files LearningOS` returns nothing.
#   2. It is outside `repo.root`, so no validator rule ever looked there.
#
# Three loose PDFs, two audit documents and a patch directory accumulated there
# without anything noticing. Two of the PDFs are byte-identical duplicates of
# managed course material; one is the only copy in existence.
#
# WHY IT IS AUTHORED HERE, INSIDE THE REPOSITORY
# ----------------------------------------------
# Because this is the only level of the tree that is under version control. A
# declaration about an untracked directory has to live somewhere tracked or it
# shares the fate of what it governs.
#
# THE SPLIT WITH THE CORPUS
# -------------------------
# The normative corpus governs the repository of record. The perimeter governs
# what the repository is nested inside. Neither index reaches across
# `repo.root` with `../`: `corpus_files()` globs from the repository root and
# `Validator._rel()` assumes containment, so a `../AGENTS.md` row would break
# both, and every synthetic mini-repo with them. Two indexes, one boundary.
#
# READ FROM DISK, NEVER FROM GIT
# ------------------------------
# The wrapper ignores `LearningOS/` wholly and `*.pdf` globally. Git is blind
# to precisely the things this contract exists to see.

perimeter_version: 1

roots:
  wrapper: .            # semestercontext/
  umbrella: LearningOS

# The check applies only where all of these are present.
#
# A synthetic mini-repo builds `LearningOS/repository` and `LearningOS/materials`
# and nothing else — it is not this tree, and a perimeter error raised against
# it would be nonsense. This is the same shape as the corpus checker returning
# [] for a repository with no prose, and it is declared here rather than
# hardcoded so the discriminator is visible instead of implied.
applies_when_present:
  - LearningOS/obsidian-ui
  - LearningOS/workbench
  - LearningOS/archive

# Suffixes that mean "course material" — they belong under LearningOS/materials/
# and are addressable as material:// once the managed ingest has seen them.
material_suffixes:
  [".pdf", ".epub", ".djvu", ".mobi", ".azw3", ".pptx", ".ppt",
   ".mp4", ".mkv", ".mov", ".m4v", ".webm"]

# Present at both levels, owned by the host rather than by us.
ephemera: [".DS_Store", ".git", ".obsidian", ".venv", ".idea", ".smart-env"]

entries:

  # ---- wrapper root --------------------------------------------------------

  - path: .gitignore
    kind: file
    owner: operator
    purpose: tracks the knowledge system and excludes the heavy material tree.

  - path: .claude
    kind: directory
    owner: agent-config
    purpose: Claude Code project configuration.

  - path: .opencode
    kind: file
    class: contract
    authority: binding
    owner: agent-roles
    purpose: >-
      The 0x-alpha reviewer rule set. Instruction-bearing and binding on the
      reviewer, and governed by nothing else — the normative corpus cannot
      reach outside the repository.

  - path: AGENTS.md
    kind: document
    class: contract
    authority: binding
    owner: agent-roles
    annotation: role division for Codex and other agents
    purpose: >-
      The role division for Codex and other agents. Loaded only when an agent
      starts from the wrapper root; repository/AGENTS.md names it as a required
      read precisely because an agent starting inside repository/ never sees it.

  - path: tools
    kind: directory
    owner: agent-pipeline
    annotation: engineering orchestration; not a LearningOS product surface
    purpose: >-
      The coding-agent pipeline that drives Core and the UI together. It is
      declared here rather than under repository/tools/ for two reasons: it
      orchestrates both nested repositories, so it belongs at the level that
      contains both; and it checks Core out into per-issue worktrees handed to
      write-capable agents, so living inside Core would place the orchestrator's
      own configuration inside every sandbox it creates. Not imported by
      learning_os, not exposed through los.py, never in the manifest.

  - path: LearningOS
    kind: directory
    owner: learningos
    purpose: the umbrella for every LearningOS component (ADR-014).

  - path: Stratum
    kind: nested_repo
    owner: external
    annotation: independent external Git repository; never traversed
    purpose: >-
      An independent external Git repository, declared by ADR-014 and rendered
      in ARCHITECTURE §3.1. Keeps its own remotes and worktree. LearningOS
      never indexes, validates or manages it; never traversed.

  # ---- umbrella ------------------------------------------------------------

  - path: LearningOS/repository
    kind: nested_repo
    owner: learningos
    purpose: the authored repository of record.

  - path: LearningOS/obsidian-ui
    kind: nested_repo
    owner: learningos
    purpose: the independent interface repository.

  - path: LearningOS/materials
    kind: directory
    owner: materials
    file_policy: managed
    annotation: books, slides, videos, datasets — addressable as material://
    purpose: >-
      Course material — books, slides, videos, datasets. Every file is
      addressable as material:// through the managed ingest. This is the one
      directory a perimeter-level duplicate is measured against.

  - path: LearningOS/projects
    kind: directory
    owner: projects
    purpose: active LearningOS-owned code repositories.

  - path: LearningOS/workbench
    kind: directory
    owner: workbench
    purpose: disposable audits, strategy and scratch tooling (ADR-014).

  - path: LearningOS/archive
    kind: directory
    owner: archive
    purpose: retired, recoverable, non-active artifacts.

  - path: LearningOS/legacy
    kind: directory
    owner: legacy
    purpose: the frozen pre-v3 tree and the preserved former Job source (ADR-014).

  - path: LearningOS/README.md
    kind: document
    class: reference
    authority: informative
    owner: learningos

  - path: LearningOS/CLAUDE.md
    kind: symlink
    target: repository/system/CLAUDE.md
    owner: learningos
    purpose: the Claude adapter, reachable from the umbrella.

  - path: LearningOS/Plans
    kind: symlink
    target: legacy/Plans
    owner: legacy

  - path: LearningOS/.env
    kind: file
    owner: operator
    purpose: bounded review client credentials (ADR-014); never committed.

# ---- known strays, awaiting disposition -------------------------------------
#
# Recorded 2026-09-04. These are the audit's Finding 1, declared rather than
# silently tolerated: naming them is what makes them visible, and the checker
# treats a declared stray as known rather than raising an error that would turn
# every gate red before anything had been decided.
#
# This list is self-cleaning. `tests/test_perimeter.py` asserts every entry is
# still on disk, so a path that has been disposed of MUST be removed from here
# or the test fails. The list can only shrink.
#
# The umbrella level is in no git index, so every disposition is irreversible
# and none is performed on this file's say-so. Each entry states what must be
# proved first.

pending_disposition:

  - path: LearningOS/python-polars-the-definitive-guide.pdf
    disposition: delete
    evidence: >-
      sha256 8a8fdf9e…f318fe, byte-identical to
      LearningOS/materials/software/python/polars-definitive-guide/
      python-polars-the-definitive-guide.pdf (verified 2026-09-04).
    precondition: re-verify both hashes at execution time, then back up before deleting.

  - path: LearningOS/03_correlation_regression.pdf
    disposition: delete
    evidence: >-
      sha256 d035cdfb…cc066, byte-identical to LearningOS/materials/mathematics/
      probability-statistics/sad-ss26-lectures/lecture-slides/
      03_correlation_regression.pdf (verified 2026-09-04).
    precondition: re-verify both hashes at execution time, then back up before deleting.

  - path: LearningOS/mml-book.pdf
    disposition: ingest
    evidence: >-
      17.5 MB, sha256 3f87b70c…8911bc. NO managed copy exists — searched
      LearningOS/materials for mml-book and mathematics-for-machine* on
      2026-09-04 and found none. This is the only copy.
    precondition: >-
      MUST NOT be deleted. File it through the managed ingest, confirm it
      appears in records/materials-manifest.yaml with a checksum, confirm it
      resolves as material://, and only then remove the umbrella copy.

  - path: LearningOS/JOB-COLLAPSE-OPUS-AUDIT.md
    disposition: move
    target: LearningOS/workbench/
    precondition: none — a move at the umbrella level, reversible in practice.

  - path: LearningOS/JOB-COLLAPSE-GEMINI-DATA-MAP.md
    disposition: move
    target: LearningOS/workbench/

  - path: LearningOS/_tier1-patches
    disposition: shelve
    target: LearningOS/archive/retired-semester-root/
    evidence: >-
      push.log records the engineering-review-tier1 branch pushed and the
      patches landed; run.log ends in a green build. Applied, not pending.
    precondition: re-read state.txt before shelving; unapplied work is never shelved.

  - path: Atlas.implementation.plam.md
    disposition: move
    target: LearningOS/workbench/Atlas.implementation.plan.md
    precondition: fix the filename typo (plam → plan) in the same move.

  - path: LearningOS-ARCHITECTURE-AND-ATLAS-EXECUTION-PLAN-2026-09-05.md
    disposition: move
    target: LearningOS/workbench/
    precondition: preserve the user-facing execution-plan link until the execution closes.

  - path: LEARNINGOS-CRITICAL-SYSTEM-AUDIT-FINDINGS-2026-08-29.md
    disposition: move
    target: LearningOS/workbench/

  - path: LEARNINGOS-REMEDIATION-PLAN-2026-09-03.md
    disposition: move
    target: LearningOS/workbench/
