  # A skill is a runbook an operator follows instead of reading the spine, so
  # an unclassified one drifts exactly where nobody is looking: the 2026-09-05
  # audit (F14) found one calling a non-entrypoint "the operating contract",
  # demanding a warning gate OPERATOR does not set, and dropping the
  # qualification on which units owe a study map. They are adapters: they may
  # add mechanics and must never weaken the contract.

  - path: system/skills/lecture-unit-builder/SKILL.md
