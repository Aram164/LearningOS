schema_version: 1
contract: learningos-backup-roots
roots:
  core:
    trees:
      - knowledge
      - sources
      - records
      - projects
      - work
      - curriculum/modules
      - curriculum/programs
      - operations/transactions
      - operations/ai-actions
      - operations/legacy
      - system/contracts
      - system/schema
      - curriculum/quarantine/masters-planning/comparisons
      - curriculum/quarantine/masters-planning/promotions
    files:
      - curriculum/resume.yaml
      - curriculum/quarantine/index.yaml
      - curriculum/quarantine/masters-planning/catalog.yaml
  ui:
    trees:
      - src
      - tests
      - contracts
      - scripts
      - vault-config
      - bases
    files:
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.contract.json
      - build.mjs
      - build-styles.mjs
      - install.py
      - ecosystem-plugins.json
      # Recovery preserves the built plugin rather than rebuilding it, so a
      # restore needs neither npm nor a network. Which files that means is
      # deliberately not listed here: `plugin-assets.json` is the UI's own
      # declaration of what it ships, and `build_backup_manifest` admits
      # `plugin/<name>` for every asset the declaration names. That list was
      # once kept in three places and they drifted — the reason
      # `read_plugin_assets` exists — and a copy here would drift the same way.
      - plugin-assets.json
  materials:
    trees:
      - .
    files: []
excluded_names:
  - .DS_Store
  - .git
  - .flat
  - node_modules
  - generated
  - dist
  - coverage
