schema_version: 1
id: garden.shelve
title: Shelve with AI
description: Prepare a bounded Garden seed for discussion, then apply only an approved structured delivery.
target_kinds:
  - garden-note
interaction_mode: discussion
context_selection: exact
# implemented | planned — the service refuses anything not yet built instead of
# hard-coding the pilot's id, so the registry stays independently updatable.
status: implemented
supported_providers:
  - manual-bundle
  - claude
  - chatgpt
allowed_capabilities:
  - garden.add-transcription
  - garden.update
  - relationship.create
# Intentional forward-defense exclusions (Decision 2): keep these forbidden at the
# action-contract boundary even where no current capabilities.yaml entry owns them
# yet (`artifact.overwrite-original`).
forbidden_capabilities:
  - artifact.delete
  - artifact.overwrite-original
  - repository.read-external
  - repository.write-arbitrary
confidentiality_policy:
  external_repository_access: forbidden
