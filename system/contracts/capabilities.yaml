contract: learningos-capabilities
schema_version: 1
contract_version: 1
cli_protocol: 3
queries:
  job.dashboard:
    handler: job_dashboard
    result: job-dashboard-v2
    schema: system/schema/job-dashboard.schema.json
    invariants:
    - explicit access confirmation is required
    - read-only and in-memory only
    - absent from manifest, search, AI, and generated views
    - publishes a Job-specific optimistic-concurrency snapshot
  project.list:
    handler: project_list
    result: project-list
  project.inspect:
    handler: inspect
    result: record
commands:
  job.session.log:
    handler: job_session_log
    cli_command: job-session-log
    writes:
    - Job/workspace-job-deem/scratch/**
    invariants:
    - explicit access confirmation is required
    - the transaction is rooted at Job/ and cannot reach the canon
    - never offered to AI actions
  job.note.stamp:
    handler: job_note_stamp
    cli_command: job-note-stamp
    writes:
    - Job/notes/**
    invariants:
    - explicit access confirmation is required
    - only the living-note header is rewritten, never the body
    - never offered to AI actions
  job.note.save:
    handler: job_note_save
    cli_command: job-note-save
    writes:
    - Job/notes/**
    invariants:
    - explicit access confirmation and learner approval are required
    - stable note ids and existing frontmatter are preserved on revision
    - never offered to AI actions
  job.plan.save:
    handler: job_plan_save
    cli_command: job-plan-save
    writes:
    - Job/plans/**
    invariants:
    - explicit access confirmation and learner approval are required
    - structured plans shadow but never rewrite legacy Markdown plans
    - never offered to AI actions
  job.task.save:
    handler: job_task_save
    cli_command: job-task-save
    writes:
    - Job/operations/tasks.yaml
    invariants:
    - explicit access confirmation is required
    - tasks remain quarantined from the canonical work graph
    - never offered to AI actions
  job.track.progress:
    handler: job_track_progress
    cli_command: job-track-progress
    writes:
    - Job/operations/progress.yaml
    invariants:
    - explicit access confirmation is required
    - progress is machine-owned; the authored dashboard is never rewritten
    - never offered to AI actions
  capture.create:
    handler: capture
    cli_command: capture
    writes:
    - work/inbox/**
    invariants:
    - no automatic routing
    - original input is preserved
  garden.seed.create:
    handler: garden_seed_create
    cli_command: garden-seed-create
    writes:
    - knowledge/garden/**
    invariants:
    - no automatic classification or routing
    - original seed text is preserved
    - no AI is required
  module.plan.import:
    handler: module_plan_import
    cli_command: module-plan-import
    writes:
    - curriculum/modules/**
    - work/active/**
    invariants:
    - bounded to one module
    - preflight required
  note.revise:
    handler: note_revise
    cli_command: note-revise
    writes:
    - knowledge/notes/**
    invariants:
    - id and role remain stable
    - explicit approval
  note.evidence.add:
    handler: note_evidence
    cli_command: note-evidence
    writes:
    - knowledge/notes/**
    invariants:
    - note body is never modified
    - evidence is append-only
    - existing entries are never rewritten or removed
  unit.map.import:
    handler: unit_map_import
    cli_command: unit-map-import
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - bounded to one unit
  unit.note.append:
    handler: unit_note
    cli_command: unit-note
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - session-level append
    - failed save preserves caller draft
  unit.source-selection.set:
    handler: unit_source_selection
    cli_command: unit-source-selection
    writes:
    - curriculum/modules/**/units/**/unit.yaml
    invariants:
    - selection must match a rich route on the same unit
    - complete material menu is unchanged
    - a selection used by a study path cannot be removed implicitly
  stage.note.write:
    handler: stage_note
    cli_command: stage-note
    writes:
    - curriculum/modules/**/units/**/stages/**
    invariants:
    - compatibility capability only
  stage.progress.update:
    handler: stage_progress
    cli_command: stage-progress
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - one active stage
  stage.attachment.add:
    handler: stage_attach
    cli_command: stage-attach
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - source file is copied
    - never moved
  source.feedback.record:
    handler: source_feedback
    cli_command: source-feedback
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - feedback is contextual
    - source identity is unchanged
  detour.create:
    handler: detour_create
    cli_command: detour-create
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - return stage is explicit
  detour.resolve:
    handler: detour_resolve
    cli_command: detour-resolve
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - returns to originating stage
  review.prepare:
    handler: shelving_prepare
    cli_command: shelving-prepare
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - preparation never applies proposed canonical changes
  review.apply:
    handler: shelving_apply
    cli_command: shelving-apply
    writes:
    - knowledge/notes/**
    - knowledge/garden/**
    - curriculum/modules/**/units/**
    invariants:
    - explicit approval
    - selected proposal is atomic
  path.note.write:
    handler: path_note
    cli_command: path-note
    writes:
    - work/active/**
    invariants:
    - workspace-owned scratch only
  path.progress.update:
    handler: path_progress
    cli_command: path-progress
    writes:
    - work/active/**
    invariants:
    - one active stage
  path.attachment.add:
    handler: path_attach
    cli_command: path-attach
    writes:
    - work/active/**
    invariants:
    - source file is copied
    - never moved
  project.create:
    handler: project_create
    cli_command: project-create
    writes:
    - projects/registry/project-*.yaml
    invariants:
    - new id only
    - project schema v1
    - no module mutation
  project.update:
    handler: project_update
    cli_command: project-update
    writes:
    - projects/registry/project-*.yaml
    invariants:
    - id and type remain stable
    - revision guarded
internal_commands:
  project.migrate:
    handler: projects_migration_apply
    writes:
    - projects/**
    - curriculum/**
    - work/active/**
    invariants:
    - one compatibility module becomes one project
    - idempotent
  project.migrate.rollback:
    handler: projects_migration_rollback
    writes:
    - projects/**
    - curriculum/**
    - work/active/**
    invariants:
    - restores migration backup atomically
forbidden:
- direct interface filesystem writes
- writes under Job/ outside the job.* capabilities (ADR-010)
- partial application of a validated transaction
- deletion of transaction receipts
- repository.read-job
- repository.write-arbitrary
- artifact.delete
domain_capabilities:
  garden.add-transcription:
    writes:
    - knowledge/garden/transcriptions/
    invariants:
    - original-remains-immutable
    - provenance-is-ai-derived
  garden.update:
    writes:
    - operations/ai-actions/garden-state/
    allowed_fields:
    - title
    - state
  relationship.create:
    writes:
    - operations/ai-actions/relationships.yaml
