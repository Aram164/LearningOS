contract: learningos-capabilities
schema_version: 1
contract_version: 2
cli_protocol: 6
queries:
  ability.context:
    handler: ability_context
    cli_command: ability-context
    result: ability-context-v1
    schema: system/schema/ability-context.schema.json
    invariants:
    - snapshot-bound bounded global horizon with focused expansion
    - candidate abilities and bridges never affect readiness or evidence transfer
    - only reviewed equivalence with a current source digest can transfer confirmed evidence under stated conditions
    - contradictory and corrected work remains inspectable; stage completion grants nothing
  material.span:
    handler: material_span
    cli_command: material-span
    result: material-span-v1
    schema: system/schema/material-span.schema.json
    invariants:
    - one exact registered route yields common source identity, locator, type, availability, and observed digest
    - local extraction is on demand and bounded; remote sources are never fetched implicitly
    - unreadable or changed bytes remain explicit and no semantic judgment is inferred
  runtime.session:
    handler: runtime_session
    result: runtime-session-v1
    schema: system/schema/runtime-session.schema.json
    invariants:
    - read-only snapshot-bound proposal for one explicit requirement
    - sticky repair requires an explicit material event and the previous runtime packet, bound to its snapshot
    - target evidence and feasibility failures stay visible
  plan.edit-context:
    handler: plan_edit_context
    result: plan-edit-context
    invariants:
    - one unit's compact authored plan or one exact route and its stage overrides
    - snapshot-bound; shared descriptions occur once and expected revisions are explicit
    - an ordered batch of 1 to 20 distinct routes of one unit shares the unit snapshot and revision guards, preserves request order, and refuses atomically without a partial payload
  atlas.context:
    handler: atlas_context
    result: atlas-context
  operator.bootstrap:
    handler: bootstrap
    result: bootstrap
    invariants:
    - compact mode returns bounded summary pages with snapshot-bound continuation
    - brief mode returns one session-entry page with resume, counts, owed study maps, resumable stages, deadlines, domain glance, and runnable expands
    - full material routes remain available through inspect; no source or angle is removed
  note.content:
    handler: note_read
    result: note-content
    invariants:
    - reads only registered durable notes without following symlinks
    - exact content segments carry snapshot and byte hash; continuation refuses changed snapshots
  note.search:
    handler: search
    result: note-content-search
    invariants:
    - content mode searches complete registered durable notes and returns bounded line snippets
  material.context:
    handler: material_context
    cli_command: material-context
    result: material-context
    invariants:
    - read-only; touches no repository file
    - searches durable analysis notes plus the route assessments of approved unit syntheses
    - deterministic lexical AND matching; concept filter resolves declared ids and aliases; purpose and unit narrow
    - ranked by recorded stage use-evidence per source (positive feedback first, mismatch feedback last); ties keep stable order (notes by id, then assessments by unit and route)
    - use evidence is canonical study-map data under the snapshot guard; skipped is reported, never ranking
    - unit-scoped analysis notes follow current source-map routes, independently of synthesis approval
    - excerpts are bounded (8 note snippets, 3 assessment fields); default 5 items, at most 20
    - source freshness is observed live per result; review state and resolution are reported, never inferred
    - empty results describe the searched records only, never the absence of an explanation
    - continuation requires the snapshot and observations_sha256 guards; changed canonical data or observed material bytes refuse mixed pages, even when an assessment remains stale
  plan.template:
    handler: plan_template
    result: plan-template-v1
    schema: system/schema/plan-template.schema.json
    invariants:
    - read-only; generates a record and touches no repository file
    - always the current plan-template version, never a copy of an existing plan
    - the generated record is validated against its own domain schema before it is answered
    - curriculum requires unit_id and module_id
  project.list:
    handler: project_list
    result: project-list
  project.inspect:
    handler: inspect
    result: record
  health.report:
    handler: health_report
    result: health-report-v1
    schema: system/schema/health-report.schema.json
    invariants:
    - read-only and on demand; no watcher or daemon
    - reports owner and remedy for every check
  backup.manifest:
    handler: backup_manifest
    result: backup-manifest-v1
    schema: system/schema/backup-manifest.schema.json
    invariants:
    - hashes only producer-declared allowlisted roots
    - never follows symlinks or includes sibling directories implicitly
    - read-only and does not configure Time Machine
  legacy.archive.inspect:
    handler: legacy_archive_inspect
    result: legacy-archive-lock-v1
    schema: system/schema/legacy-archive-lock.schema.json
    invariants:
    - reads only exact reviewed safe paths; there is no recursive discovery
    - boundary-sensitive items are represented only by an aggregate count
    - read-only and deliberately invoked
  legacy.archive.status:
    handler: legacy_archive_status
    result: legacy-archive-status-v1
    schema: system/schema/legacy-archive-status.schema.json
    invariants:
    - reads the last approved lock without rescanning Legacy
    - absent from normal manifest and search
  masters-planning.dashboard:
    handler: masters_planning_dashboard
    result: masters-planning-dashboard-v1
    schema: system/schema/masters-planning-dashboard.schema.json
    invariants:
    - requires an explicit planning access gesture
    - reads only the sanitized catalog and approved comparisons
    - absent from normal manifest, search, workload, deadlines, recommendations, and ordinary AI
commands:
  ability.candidate.append:
    handler: ability_candidate_append
    cli_command: ability-candidate-append
    admission: direct-user-gesture
    admission_channels:
    - ui
    writes:
    - knowledge/ability-candidates.jsonl
    invariants:
    - appends a provenance-linked tentative connection between known abilities
    - never changes a reviewed bridge or contributes to readiness or evidence transfer
    - snapshot and candidate-ledger revision are guarded by a V2 receipt
  learner.ability-observation.append:
    handler: ability_observation_append
    cli_command: ability-observation-append
    admission: direct-user-gesture
    admission_channels:
    - ui
    writes:
    - work/active/*/ability-observations.jsonl
    invariants:
    - appends only a learner-confirmed precise claim linked to actual work and a confirmation pointer
    - ability identity must be active and reviewed; evidence binds to its claim, conditions, and criteria hash
    - corrections preserve prior observations and conflicting work stays visible
    - snapshot and workspace revision are guarded by a V2 receipt
  learner.observation.append:
    handler: observation_append
    cli_command: observation-append
    admission: direct-user-gesture
    writes:
    - work/active/*/observations.jsonl
    invariants:
    - append only to the registered active workspace's evidence ledger
    - requirement resolves within the workspace's declared module or unit scope
    - exact snapshot and workspace revision guarded; receipt and retry preserve historical evidence
    - learner observations never update concept or source semantics
  route.patch:
    handler: route_patch
    cli_command: route-patch
    writes:
    - curriculum/modules/*/source-map.yaml
    - curriculum/modules/*/units/*/unit.yaml
    - curriculum/modules/*/units/*/study-map.yaml
    invariants:
    - one exact route in one owning unit; only declared descriptive material fields
    - source selections and identical legacy mirrors synchronize; stage overrides are preserved
    - snapshot and all affected logical revisions are guarded, including maps changed by inheritance
    - full shadow validation and warning policy precede the ordinary receipt-producing transaction
  module.materials.compact:
    handler: module_materials_compact
    cli_command: module-materials-compact
    writes:
    - curriculum/modules/*/source-map.yaml
    - curriculum/modules/*/units/*/study-map.yaml
    invariants:
    - one module; exact route identity or unambiguous source/title/locator guards only
    - identical fields become explicit references; every expanded study map is unchanged
    - persisted route identities and compact maps commit together under the reviewed plan hash
    - ambiguous or independent resources remain inline; no ordering, progress or teaching judgment changes
  concept.relations.change:
    handler: concept_relations_change
    cli_command: concept-relations-change
    admission: direct-user-gesture
    admission_channels:
    - ui
    writes:
    - knowledge/concept-relations.yaml
    - knowledge/concept-relations/**
    invariants:
    - only explicitly supplied add, replace or remove operations; no inferred relations
    - exact previous rows, snapshot and registry revision guard changes
    - duplicates, unknown endpoints and prerequisite cycles fail atomically
  atlas.question.save:
    handler: atlas_question_save
    cli_command: atlas-question-save
    admission: direct-user-gesture
    writes:
    - knowledge/notes/**
    invariants:
    - learner wording and original target are preserved
    - open and resolved describe a personal question, never mastery or task completion
  capture.create:
    handler: capture
    cli_command: capture
    admission: direct-user-gesture
    writes:
    - work/inbox/**
    invariants:
    - no automatic routing
    - original input is preserved
    - external file input is bound to its exact bytes by SHA-256 before use
    - GatewayEnvelopeV2 content is inline or hash-bound and never comes from stdin
  ai-action.delivery.apply:
    handler: ai_action_apply_delivery
    cli_command: ai-action-apply-delivery
    writes:
    - operations/ai-actions/requests/**
    invariants:
    - GatewayEnvelopeV2 with approved-delivery authority is required
    - approval binds the imported delivery record and every referenced artifact by SHA-256
    - canonical destinations retain their narrow domain-capability write authorities
    - request completion and canonical writes commit atomically with one ReceiptV2
  garden.seed.create:
    handler: garden_seed_create
    cli_command: garden-seed-create
    admission: direct-user-gesture
    writes:
    - knowledge/garden/**
    invariants:
    - no automatic classification or routing
    - original seed text is preserved
    - no AI is required
  module.plan.import:
    handler: module_plan_import
    cli_command: module-plan-import
    writes:
    - curriculum/modules/**
    - work/active/**
    - sources/sources.yaml
    - sources/registry/**
    - curriculum/quarantine/masters-planning/catalog.yaml
    - curriculum/quarantine/masters-planning/promotions/**
    - operations/transactions/lineage.yaml
    invariants:
    - bounded to one module
    - preflight required
    - external plan files are bound to their exact bytes by SHA-256 before use
    - changed route-covers edges carry admitted evidence or refuse; admitted records persist atomically
  route.identity.migrate:
    handler: route_identity_migrate
    cli_command: route-identity-migrate
    writes:
    - curriculum/modules/**/source-map.yaml
    - curriculum/modules/**/units/**/unit.yaml
    invariants:
    - the dry-run plan is deterministic and problem-free
    - any ambiguity review is inline, complete, drift-guarded, and bound to the unresolved baseline plan and canonical snapshot
    - review decisions may bind, revise, split, or retire only exact existing same-unit/source routes; authoring and preserved ambiguity remain blocked
    - the approval binds the exact diff hash, snapshot, and affected artifact revisions
    - every changed file commits atomically with one receipt
  legacy.job-learning.migrate:
    handler: job_learning_migrate
    cli_command: job-learning-migrate
    writes:
    - curriculum/programs/program-job.yaml
    - curriculum/programs/program-job-boundary.yaml
    - curriculum/modules/module-job-git/**
    - curriculum/modules/module-job-engineering-tools/**
    - curriculum/modules/module-job-polars/**
    - curriculum/modules/module-job-python-engineering/**
    - curriculum/modules/module-job-rust-engineering/**
    - knowledge/concepts.yaml
    - knowledge/notes/data-systems/**
    - knowledge/attachments/note-pandas-polars-aggregation-contentions/**
    - sources/registry/software.yaml
    - records/materials-manifest.yaml
    - operations/migrations/job-quarantine-collapse-v1.yaml
    invariants:
    - one deterministic problem-free plan migrates the five exact legacy learning plans
    - source and destination bytes, the plan hash, the canonical snapshot, and every affected artifact revision are approval-bound
    - Stratum remains an external sibling codebase and appears only as optional prose learning anchors
    - no concept relations, source evaluations, completion, or mastery are inferred
    - the old boundary deletion and all ordinary program, module, map, note, probe, source, concept, and provenance writes commit atomically with one receipt
  note.analysis.save:
    handler: note_analysis_save
    cli_command: note-analysis-save
    writes:
    - knowledge/notes/**
    invariants:
    - handler owns authorship and review defaults; input can never self-promote to user-reviewed
    - body bytes are preserved verbatim and must match frozen_input_sha256
    - identical requests replay without a second note; id collision with different analysis refuses
    - saving preserves bytes; it never approves coverage, adopts plans, or records mastery
  note.revise:
    handler: note_revise
    cli_command: note-revise
    writes:
    - knowledge/notes/**
    invariants:
    - id and role remain stable
    - explicit approval
    - external replacement files are bound to their exact bytes by SHA-256 before use
  note.evidence.add:
    handler: note_evidence
    cli_command: note-evidence
    writes:
    - knowledge/notes/**
    invariants:
    - note body is never modified
    - evidence is append-only
    - existing entries are never rewritten or removed
  unit.plan.revise:
    handler: unit_plan_revise
    cli_command: unit-plan-revise
    writes:
    - curriculum/modules/**
    - work/active/**
    - sources/sources.yaml
    - sources/registry/**
    - operations/transactions/lineage.yaml
    invariants:
    - bounded to one existing unit
    - compact patch names only what changes; unrelated routes are carried forward internally
    - route add/update/remove operations use stable IDs and reject ambiguity
    - when the unit already has a material-synthesis dossier, route additions, removals and evidential changes require a replacement dossier validated against staged state; without an existing dossier no replacement is required
    - context-dependent changes require documented acknowledgments
    - artifact IDs cover exactly the semantic owners the revision touches
    - external revision files are bound to their exact bytes by SHA-256 before use
    - one transaction and one receipt cover the complete revision
  unit.map.import:
    handler: unit_map_import
    cli_command: unit-map-import
    admission: direct-user-gesture
    admission_channels:
    - ui
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - bounded to one unit
    - external map files are bound to their exact bytes by SHA-256 before use
  unit.note.append:
    handler: unit_note
    cli_command: unit-note
    admission: direct-user-gesture
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - session-level append
    - failed save preserves caller draft
    - every external attachment is bound to its exact bytes by SHA-256 before use
    - GatewayEnvelopeV2 carries note text inline and never reads it from stdin
  unit.source-selection.set:
    handler: unit_source_selection
    cli_command: unit-source-selection
    admission: direct-user-gesture
    writes:
    - curriculum/modules/**/units/**/unit.yaml
    invariants:
    - selection must match a rich route on the same unit
    - complete material menu is unchanged
    - a selection used by a study path cannot be removed implicitly
  unit.material-synthesis.publish:
    handler: unit_material_synthesis_publish
    cli_command: unit-material-synthesis-publish
    writes:
    - curriculum/modules/**/units/**/material-synthesis.yaml
    invariants:
    - every current rich route is assessed exactly once
    - current and prerequisite routes are deep-reviewed
    - whole-dossier approval and revision guards are required
  legacy.archive.lock.publish:
    handler: legacy_archive_lock_publish
    cli_command: legacy-archive-lock-publish
    writes:
    - operations/legacy/archive-lock.yaml
    invariants:
    - reviewed allowlist-only evidence
    - excluded boundary entries contain no paths or hashes
  masters-planning.catalog.update:
    handler: masters_planning_catalog_update
    cli_command: masters-planning-catalog-update
    writes:
    - curriculum/quarantine/masters-planning/catalog.yaml
    invariants:
    - academic-only sanitized input
    - prospective ids never masquerade as canonical ids
    - revision guarded and explicitly approved
  masters-planning.comparison.publish:
    handler: masters_planning_comparison_publish
    cli_command: masters-planning-comparison-publish
    writes:
    - curriculum/quarantine/masters-planning/comparisons/**
    invariants:
    - bounded to one selected candidate module
    - all selected sources are assessed exactly once
    - no scores, schedules, or time recommendations
  stage.note.write:
    handler: stage_note
    cli_command: stage-note
    writes:
    - curriculum/modules/**/units/**/stages/**
    invariants:
    - compatibility capability only
    - GatewayEnvelopeV2 carries note text inline and never reads it from stdin
  stage.progress.update:
    handler: stage_progress
    cli_command: stage-progress
    admission: direct-user-gesture
    writes:
    - curriculum/modules/**/units/**
    - curriculum/resume.yaml
    invariants:
    - one active stage
    - the resume pointer names the stage this action made current and commits in the same transaction
    - other units keep their own active study maps
  stage.attachment.add:
    handler: stage_attach
    cli_command: stage-attach
    admission: direct-user-gesture
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - source file is copied
    - never moved
    - the external attachment is bound to its exact bytes by SHA-256 before use
  source.feedback.record:
    handler: source_feedback
    cli_command: source-feedback
    admission: direct-user-gesture
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - feedback is contextual
    - source identity is unchanged
  source.intake.record:
    handler: source_intake_record
    cli_command: source-intake
    writes:
    - sources/sources.yaml
    - sources/registry/**
    invariants:
    - creates a metadata-only source or corrects intake-owned fields of an existing one
    - source identity is stable; evaluations, topics, material and every route, selection, note, feedback and observation are unchanged
    - a check run returns the field-level diff; apply is bound to that diff's hash, the snapshot and each record's revision
    - explicitly approved; one transaction and one receipt cover the batch
  detour.create:
    handler: detour_create
    cli_command: detour-create
    admission: direct-user-gesture
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - return stage is explicit
  detour.resolve:
    handler: detour_resolve
    cli_command: detour-resolve
    admission: direct-user-gesture
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - returns to originating stage
  review.prepare:
    handler: shelving_prepare
    cli_command: shelving-prepare
    admission: direct-user-gesture
    admission_channels:
    - ui
    writes:
    - curriculum/modules/**/units/**
    invariants:
    - preparation never applies proposed canonical changes
    - external proposal items are bound to their exact bytes by SHA-256 before use
  review.apply:
    handler: shelving_apply
    cli_command: shelving-apply
    admission: direct-user-gesture
    admission_channels:
    - ui
    writes:
    - knowledge/notes/**
    - knowledge/garden/**
    - curriculum/modules/**/units/**
    invariants:
    - explicit approval
    - selected proposal is atomic
  path.note.write:
    handler: path_note
    cli_command: path-note
    writes:
    - work/active/**
    invariants:
    - workspace-owned scratch only
    - GatewayEnvelopeV2 carries note text inline and never reads it from stdin
  path.progress.update:
    handler: path_progress
    cli_command: path-progress
    writes:
    - work/active/**
    invariants:
    - one active stage
  path.attachment.add:
    handler: path_attach
    cli_command: path-attach
    writes:
    - work/active/**
    invariants:
    - source file is copied
    - never moved
    - the external attachment is bound to its exact bytes by SHA-256 before use
  project.create:
    handler: project_create
    cli_command: project-create
    writes:
    - projects/registry/*
    invariants:
    - new id only
    - project schema v1
    - no module mutation
    - external project files are bound to their exact bytes by SHA-256 before use
  project.update:
    handler: project_update
    cli_command: project-update
    writes:
    - projects/registry/*
    invariants:
    - id and type remain stable
    - revision guarded
    - external project files are bound to their exact bytes by SHA-256 before use
internal_commands:
  project.migrate:
    handler: projects_migration_apply
    writes:
    - projects/**
    - curriculum/**
    - work/active/**
    invariants:
    - one compatibility module becomes one project
    - idempotent
  project.migrate.rollback:
    handler: projects_migration_rollback
    writes:
    - projects/**
    - curriculum/**
    - work/active/**
    invariants:
    - restores migration backup atomically
forbidden:
- direct interface filesystem writes
- partial application of a validated transaction
- deletion of transaction receipts
- repository.read-external
- repository.write-arbitrary
- artifact.delete
domain_capabilities:
  garden.add-transcription:
    writes:
    - knowledge/garden/transcriptions/
    invariants:
    - original-remains-immutable
    - provenance-is-ai-derived
  garden.update:
    writes:
    - operations/ai-actions/garden-state/
    allowed_fields:
    - title
    - state
  relationship.create:
    writes:
    - operations/ai-actions/relationships.yaml
  unit.material-synthesis.publish:
    writes:
    - curriculum/modules/**/units/**/material-synthesis.yaml
    invariants:
    - complete-current-route-coverage
    - approved-whole-unit-delivery
