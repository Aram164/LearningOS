schema_version: 1
contract: learningos-local-attachments
#
# Note attachments that stay canonical (ARCHITECTURE rule 3) but are kept out of
# Git: large or private scans that would otherwise dominate the published
# repository. Each lives at its usual knowledge/attachments/<note-id>/ path,
# a .gitignore rule covers it, and backups still carry it (the backup walk reads
# disk, not the index). The pin is the only record of what belongs there on a
# machine that lacks the file, so a present file must match it exactly.
#
# Checked by learning_os.contracts.local_attachments on every validation:
#   present and different -> ATTACH-LOCAL-CHANGED (error)
#   absent                -> ATTACH-LOCAL-ABSENT  (environmental warning; CI)
#   unowned, tracked, or not ignored -> errors
#
# The five handwritten SaD volumes were committed whole under the 2026-07-17
# attachment policy; they left the published history on 2026-10-02 (about
# 265 MB of a 295 MB pack). Re-pin deliberately if a scan is ever replaced.
