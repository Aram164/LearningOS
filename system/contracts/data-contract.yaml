# The repository's data-format contract.
#
# `contract_version` is the format canonical records are written in. The
# fingerprint is a sha256 over system/schema/*.schema.json — the schemas that
# govern stored records (capability payload schemas are excluded: they validate
# requests, not data at rest).
#
# `make check` fails when the schemas change and this file does not, so a schema
# edit cannot silently redefine what "valid" means for data already on disk.
# When that fires, the fix is a decision, not a rubber stamp:
#
#   1. does existing data still validate?  tests/fixtures/formats/ answers this
#   2. if not, write the migration under tools/migrations/
#   3. python tools/schema_contract.py --bump --note "…" [--migration …]
#   4. freeze the new shape as tests/fixtures/formats/v<N>/
#
# Rebuild with: python tools/schema_contract.py --bump
contract_version: 10
schema_fingerprint: sha256:8a87df03303ac60958595b979f1a974978679cb1987eb9f53be3786de49a2956
record_schemas: 24
history:
- version: 1
  adopted: '2026-08-07'
  note: baseline — the canonical record format as it stands at the v3 cutover (module-first
    curriculum, manifest v2, projects)
  migration: null
  fixture: tests/fixtures/formats/v1/
- version: 2
  adopted: '2026-08-08'
  note: 'study-map stage resources gained an optional scope_triage field (same enum
    as the stage''s own), so a required-now stage can rank its resources: do-this
    / if-stuck / depth / preserved. Additive and backward-compatible — absent means
    unranked, which is what every v1 record carries.'
  migration: null
  fixture: tests/fixtures/formats/v2/
- version: 3
  adopted: '2026-08-08'
  note: study-map stage resources gained an optional stable 'id' (resource identity),
    and source_feedback gained an optional 'resource_id' alongside the still-required
    source_id. Lets a judgment name one paper inside a bundled course instead of collapsing
    onto the whole bundle. Additive and backward-compatible — absent ids mean source_id
    + locator addressing, which is what every v1/v2 record carries.
  migration: null
  fixture: tests/fixtures/formats/v3/
- version: 4
  adopted: '2026-08-08'
  note: sources gained an optional 'topics' array over the closed vocabulary in sources/topics.yaml
    (ADR-009 topic facet). Independent of thematic_group_ids so one source can be
    classified along several dimensions. Additive and backward-compatible — absent
    means not yet classified, and population is on-use rather than a bulk backfill.
  migration: null
  fixture: tests/fixtures/formats/v4/
- version: 5
  adopted: '2026-08-12'
  note: units gained an optional knowledge_map of stable concept nodes, and module
    source routes may now carry lecture-specific material metadata (format, angle,
    covered nodes, depth, scope, and locator). Both changes are additive and legacy
    string routes remain valid, so no migration is required.
  migration: null
  fixture: tests/fixtures/formats/v5/
- version: 6
  adopted: '2026-08-15'
  note: 'Three additive schema extensions, all backward-compatible (no migration):
    (1) note.authorship gains ''operator-drafted'' — a note built by the operator
    from a scope source and not yet reasoned through by the learner, distinct from
    ''external'' (another author''s text) and never evidence of understanding; (2)
    module gains an optional structured ''drop'' record (date, attempt_made, semester,
    stated_by, reversible, intent, notes) so a drop is a first-class fact rather than
    prose in examination.notes — attempt_made is load-bearing, since an empty attempts
    array cannot itself say whether nothing was registered or the record is incomplete;
    (3) module-source-map unit_routes gain format ''exam''/''solutions'' (used differently
    from ''exercise''), depth ''unassessed'' and scope ''unevaluated'' — a source
    routed to a unit but never evaluated, so visibility debt is visible per-route
    instead of being flattened into ''optional''. Absent values mean exactly what
    they meant at v5.'
  migration: null
  fixture: tests/fixtures/formats/v6/
- version: 7
  adopted: '2026-08-19'
  note: Add producer-owned Job dashboard and structured Job plan schemas
  migration: null
  fixture: tests/fixtures/formats/v7/
- version: 8
