# Copy this file into the owning workspace's outputs/ directory and replace
# every placeholder. Do not use YAML anchors, aliases, or merge keys.
module_id: module-example

plan_contract:
  version: 1
  coverage_audit: work/active/workspace-example/outputs/example-coverage-audit.md
  checks:
    local_inventory_complete: true
    linked_inventory_complete: true
    materials_opened_and_content_checked: true
    current_and_prior_scope_reconciled: true
    duplicates_and_numbering_checked: true
    exclusions_and_unresolved_gaps_recorded: true

module_patch:
  # Include every final unit exactly once, including unchanged existing units.
  unit_order:
    - unit-example-l01

source_patches: []

source_map:
  type: module-source-map
  module_id: module-example
  sources:
    - source_id: source-example-course
      role: course-material
      why: "Current taught material is the scope authority."
      priority: 0
      unit_routes:
        - unit_id: unit-example-l01
          title: Current L01 lecture deck
          format: course-material
          angle: "Defines the taught scope and presents the lecturer's notation and examples."
          covers:
            - knowledge-example-l01-formulation
            - knowledge-example-l01-core-result
          depth: course-aligned
          scope: current
          locator: lecture-slides/01-example.pdf
    - source_id: source-example-book
      role: spine
      why: "Selected explanation after the current course pass."
      priority: 1
      unit_routes:
        - unit_id: unit-example-l01
          title: Example book — independent derivation
          format: book
          angle: "Re-derives the core result from first principles and supplies one worked example."
          covers:
            - knowledge-example-l01-core-result
          depth: derivation
          scope: complementary
          locator: "Chapter 1: exact sections"

units:
  - unit:
      id: unit-example-l01
      type: unit
      module_id: module-example
      kind: lecture
      title: Example Lecture 01
      order: 1
      scope: "Current L01 material: exact concepts actually taught."
      status: not-started
      knowledge_map:
        summary: "The lecture moves from the learning problem to its core result and application."
        nodes:
          - id: knowledge-example-l01-formulation
            title: Problem formulation
            summary: "State the inputs, target, assumptions, and objective."
          - id: knowledge-example-l01-core-result
            title: Core result
            summary: "Derive and interpret the lecture's central result."
            builds_on:
              - knowledge-example-l01-formulation
      scope_sources:
        - source_id: source-example-course
          authority: slides
          locator: lecture-slides/01-example.pdf
      # The complete menu lives in source_map.unit_routes. Keep this empty until
      # the learner actually chooses material; never preselect every available source.
      source_selections: []
      artifacts: {}
      workspace_ids:
        - workspace-example
    # study_map is optional. Add it only after the learner chooses material and
    # explicitly wants an ordered, progress-tracked path. Its resources must be
    # a subset of those choices; it never replaces the complete material menu.

workspace_updates:
  - id: workspace-example
    # These are final joins, not only the records newly added by this package.
    sources:
      - source-example-course
      - source-example-book
    unit_ids:
      - unit-example-l01
    sections:
      Current Scope: "One individual current unit per ordinary lecture."
      Next Action: "Open unit-example-l01, compare material angles, and choose what to study."
