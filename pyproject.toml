[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "learningos-core"
version = "3.2.0"
description = "Plain-file Learning OS core, contracts, validator, and gateway"
requires-python = ">=3.12"
dependencies = [
  "PyYAML",
  "jsonschema>=4",
  # material_slices, material_text and material_toc import it and tell the
  # operator "make setup" provides it; without this line it did not.
  "pypdf",
]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.16", "import-linter>=2.1", "mypy"]

[project.scripts]
los = "los:main"

[tool.setuptools]
package-dir = {"" = "tools"}
py-modules = ["los"]

[tool.setuptools.packages.find]
where = ["tools"]
include = ["learning_os*"]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
markers = [
  "full_repo: exercises the checked-in repository state rather than a synthetic fixture",
  "live_install: needs state only the live installation has (gitignored maintainer data, or the wrapper root above repository/); CI deselects it by name",
  "paired: exercises the live Core/UI boundary (reads the sibling checkout); the pre-push gate runs this set alone for UI-only changes",
  # Area groups (tests/group_map.py; applied at collection by conftest.py).
  "studyplan: curriculum, study maps, routes, units, plan revisions",
  "materials: materials farm, attachments, slices, summaries, ingestion",
  "synthesis: semantics, synthesis, dossiers, goals, runtime",
  "generation: generation, projections, views, derived state, search",
  "contracts: contracts, manifest, normative corpus, UI contract mirror",
  "gateway: gateways, CLI, capabilities, transactions, recovery, operations",
  "validation: validation, hygiene, perimeter, audits, architecture guards",
  "migrations: migrations and multi-year format compatibility",
]

# Linting (engineering review 2026-08-18, item 12; added 2026-08-21).
#
# The review's argument for a linter was not style. Three of the five Tier-1
# findings were things only reading finds — a dead module, a dead import, a
# variable bound and never used — and the fix for that class is a tool that
# reads every file every time rather than a person who read them once. The
# first run found 332 of them, including six dead re-exports in the loader
# facade that four modules were assumed to be consuming and none was.
[tool.ruff]
line-length = 100
extend-exclude = [".venv", "generated", "legacy", "**/__pycache__"]

[tool.ruff.lint]
# E501 (line-too-long) is deliberately NOT selected. 212 existing lines exceed
# 100 columns; re-wrapping working code by hand to satisfy a cosmetic rule is
# the kind of churn that makes a linter something people turn off. `line-length`
# above still governs `ruff format` if that is ever adopted, and the rules that
# are selected are the ones that find defects rather than opinions.
#
# `I` (import sorting) is the exception to that framing, and it is worth knowing
# what it cost: ruff's isort has no packed-wrap mode, so adopting it re-wrapped
# every multi-line import block in the codebase from the hand-packed several-
# names-per-line style to one name per line. Most of the adoption diff is that
# reformat rather than the eighteen real findings underneath it. It could not be
# split into its own commit because both changes land inside the same import
# blocks — so read that diff with `git show -w --stat` first, and expect the
# per-file detail to be mostly noise.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# `learning_os` and `los` live under tools/, so ruff cannot infer them.
known-first-party = ["learning_os", "los"]

[tool.importlinter]
root_package = "learning_os"

[[tool.importlinter.contracts]]
name = "A1 layers (PLAN D17)"
type = "layers"
containers = ["learning_os"]
exhaustive = true
unmatched_ignore_imports_alerting = "error"
layers = [
  "adapters : commands",
  "ops : ai_actions : masters_planning : material_synthesis",
  "rules : genout : semantics : search : health : abilities : learning_runtime : routes : evidence",
  "store : loading : loader : contracts : derived : diagnostics : transactions : fingerprint : githistory : pathing : revisions : validation_cache : warning_baseline : backup_manifest : legacy_archive : materials_resolution : material_slices : material_analysis : garden : manifest_identity : observations",
  "domain : digests : material_inventory : material_refs : route_identity : unit_notes : render : errors",
]
ignore_imports = [
  # recorded baseline exceptions, one per line: "learning_os.x.y -> learning_os.z"
  "learning_os.backup_manifest -> learning_os.genout",
  "learning_os.backup_manifest -> learning_os.rules",
  "learning_os.contracts.payloads -> learning_os.commands.support",
  "learning_os.diagnostics.resolver -> learning_os.evidence",
  "learning_os.evidence -> learning_os.ai_actions.binding",
  "learning_os.evidence -> learning_os.ai_actions.errors",
  "learning_os.evidence -> learning_os.ai_actions.storage",
  "learning_os.genout.manifest -> learning_os.ai_actions.projection",
  "learning_os.genout.manifest_derived -> learning_os.ai_actions.projection",
  "learning_os.genout.projection.records_curriculum -> learning_os.material_synthesis",
  "learning_os.genout.projection.records_library -> learning_os.material_synthesis",
  "learning_os.health -> learning_os.masters_planning",
  "learning_os.health -> learning_os.material_synthesis",
  "learning_os.rules.projects -> learning_os.ai_actions.support",
  "learning_os.semantics.scan -> learning_os.material_synthesis",
  "learning_os.transactions -> learning_os.evidence",
  "learning_os.validation_cache -> learning_os.rules",
  "learning_os.validation_cache -> learning_os.rules.advisories",
  "learning_os.validation_cache -> learning_os.rules.common",
  "learning_os.warning_baseline -> learning_os.rules",
  "learning_os.warning_baseline -> learning_os.rules.common",
]

[[tool.importlinter.contracts]]
name = "A1 transaction writer access (PLAN A2, D4)"
type = "forbidden"
source_modules = ["learning_os.rules", "learning_os.genout", "learning_os.semantics",
                  "learning_os.search", "learning_os.health", "learning_os.abilities",
                  "learning_os.learning_runtime", "learning_os.routes", "learning_os.domain"]
forbidden_modules = ["learning_os.transactions"]
ignore_imports = [
  "learning_os.genout -> learning_os.genout.manifest",
  "learning_os.genout.manifest -> learning_os.genout.projection",
  "learning_os.genout.projection -> learning_os.genout.projection.records_curriculum",
  "learning_os.genout.projection.records_curriculum -> learning_os.material_synthesis",
  "learning_os.health -> learning_os.masters_planning",
  "learning_os.health -> learning_os.material_synthesis",
  "learning_os.masters_planning -> learning_os.transactions",
  "learning_os.material_synthesis -> learning_os.transactions",
  "learning_os.rules.generated -> learning_os.genout",
  "learning_os.semantics.scan -> learning_os.material_synthesis",
]

[[tool.importlinter.contracts]]
name = "A1 transaction service protected (PLAN A1, D14)"
type = "protected"
protected_modules = ["learning_os.transactions"]
allowed_importers = ["learning_os.ops"]
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
  "learning_os.ai_actions.service -> learning_os.transactions",
  "learning_os.commands.capability -> learning_os.transactions",
  "learning_os.commands.lineage_restamp -> learning_os.transactions",
  "learning_os.commands.material -> learning_os.transactions",
  "learning_os.commands.support -> learning_os.transactions",
  "learning_os.masters_planning -> learning_os.transactions",
  "learning_os.material_synthesis -> learning_os.transactions",
]
