[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "learningos-core"
version = "3.2.0"
description = "Plain-file Learning OS core, contracts, validator, and gateway"
requires-python = ">=3.12"
dependencies = [
  "PyYAML",
  "jsonschema>=4",
  # material_slices, material_text and material_toc import it and tell the
  # operator "make setup" provides it; without this line it did not.
  "pypdf",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist>=3", "ruff>=0.16", "import-linter>=2.1", "mypy"]

[project.scripts]
los = "los:main"

[tool.setuptools]
package-dir = {"" = "tools"}
py-modules = ["los"]

[tool.setuptools.packages.find]
where = ["tools"]
include = ["learning_os*"]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
markers = [
  "full_repo: exercises the checked-in repository state rather than a synthetic fixture",
  "live_install: needs state only the live installation has (gitignored maintainer data, or the wrapper root above repository/); CI deselects it by name",
  "paired: exercises the live Core/UI boundary (reads the sibling checkout); the pre-push gate runs this set alone for UI-only changes",
  # Area groups (tests/group_map.py; applied at collection by conftest.py).
  "studyplan: curriculum, study maps, routes, units, plan revisions",
  "materials: materials farm, attachments, slices, summaries, ingestion",
  "synthesis: semantics, synthesis, dossiers, goals, runtime",
  "generation: generation, projections, views, derived state, search",
  "contracts: contracts, manifest, normative corpus, UI contract mirror",
  "gateway: gateways, CLI, capabilities, transactions, recovery, operations",
  "validation: validation, hygiene, perimeter, audits, architecture guards",
  "migrations: migrations and multi-year format compatibility",
]

# Migration boundaries remain strict while imported legacy modules retain their
# existing diagnostics. Every new production module must join this maintained
# list; test_arch_types compares it with the frozen pre-migration inventory.
[tool.mypy]
strict = true
follow_imports = "silent"
disallow_any_unimported = true
disallow_any_explicit = true
mypy_path = "tools"
cache_dir = "/dev/null"
files = [
  "tools/learning_os/domain/transaction.py",
  "tools/learning_os/app/claim_admission.py",
  "tools/learning_os/derive/semantics/claim_status.py",
  "tools/learning_os/derive/semantics/claim_audits.py",
  "tools/learning_os/domain/verbatim.py",
  "tools/learning_os/store/materials/pdf_text.py",
  "tools/learning_os/store/materials/anchors.py",
]

# Linting (engineering review 2026-08-18, item 12; added 2026-08-21).
#
# The review's argument for a linter was not style. Three of the five Tier-1
# findings were things only reading finds — a dead module, a dead import, a
# variable bound and never used — and the fix for that class is a tool that
# reads every file every time rather than a person who read them once. The
# first run found 332 of them, including six dead re-exports in the loader
# facade that four modules were assumed to be consuming and none was.
[tool.ruff]
line-length = 100
extend-exclude = [".venv", "generated", "legacy", "**/__pycache__"]

[tool.ruff.lint]
# E501 (line-too-long) is deliberately NOT selected. 212 existing lines exceed
# 100 columns; re-wrapping working code by hand to satisfy a cosmetic rule is
# the kind of churn that makes a linter something people turn off. `line-length`
# above still governs `ruff format` if that is ever adopted, and the rules that
# are selected are the ones that find defects rather than opinions.
#
# `I` (import sorting) is the exception to that framing, and it is worth knowing
# what it cost: ruff's isort has no packed-wrap mode, so adopting it re-wrapped
# every multi-line import block in the codebase from the hand-packed several-
# names-per-line style to one name per line. Most of the adoption diff is that
# reformat rather than the eighteen real findings underneath it. It could not be
# split into its own commit because both changes land inside the same import
# blocks — so read that diff with `git show -w --stat` first, and expect the
# per-file detail to be mostly noise.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# `learning_os` and `los` live under tools/, so ruff cannot infer them.
known-first-party = ["learning_os", "los"]

[tool.importlinter]
root_package = "learning_os"

[[tool.importlinter.contracts]]
name = "A1 layers (PLAN D17)"
type = "layers"
containers = ["learning_os"]
exhaustive = true
unmatched_ignore_imports_alerting = "error"
layers = [
  "adapters",
  "app",
  "derive",
  "store",
  "domain",
]
ignore_imports = [
  # recorded baseline exceptions, one per line: "learning_os.x.y -> learning_os.z"
]

[[tool.importlinter.contracts]]
name = "A1 transaction writer access (PLAN A2, D4)"
type = "forbidden"
source_modules = ["learning_os.derive.validation", "learning_os.derive.projection", "learning_os.derive.semantics",
                  "learning_os.derive.search", "learning_os.derive.health", "learning_os.derive.abilities",
                  "learning_os.derive.learning_runtime", "learning_os.derive.routes", "learning_os.domain"]
forbidden_modules = ["learning_os.store.transactions"]
ignore_imports = [
]

[[tool.importlinter.contracts]]
name = "A1 transaction service protected (PLAN A1, D14)"
type = "protected"
protected_modules = ["learning_os.store.transactions"]
allowed_importers = ["learning_os.app"]
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
]
