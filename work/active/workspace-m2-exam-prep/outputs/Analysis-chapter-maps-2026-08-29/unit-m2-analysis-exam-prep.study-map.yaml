    vault_path: material://source-analysis-skript/unser skript.pdf
    scope_triage: required-now
  - kind: read
    label: The deferral ledger — Kapitel 8 and every Exkurs, named once and left
    locator: 'unser skript.pdf Kapitel 8 Exkurse printed p. 226 (PDF p. 236) to the end; and the Exkurs
      sections in Chapters 3-7: §3.2 Landau-Notation printed p. 46 (PDF p. 56), §3.4 Lösung homogener
      Rekursionsgleichungen printed p. 52 (PDF p. 62), §4.5 Produktreihen printed p. 95 (PDF p. 105),
      §5.8 Potenzreihen printed p. 130 (PDF p. 140), §6.2 Ableitung von Potenzreihen printed p. 144 (PDF
      p. 154), §6.6 Numerisches Lösen von Gleichungen printed p. 153 (PDF p. 163), §6.9 Potenzreihen und
      Taylorentwicklungen printed p. 173 (PDF p. 183), §7.4 Numerische Integration printed p. 215 (PDF
      p. 225)'
    angle: One list of everything the course contract puts outside the exam, so a deferred section is
      never re-discovered as a gap.
    angle_detail: 'Handled lightly and deliberately: the script states that Exkurse are not exam-relevant,
      so none of these sections gets a session, a stage or a material menu, and none of the chapter sessions
      spends time on them. They are written down once, here, for two reasons only — so that meeting a
      power-series or Newton-method task in an external bank is recognised as out-of-scope rather than
      as a hole, and so that the decision is reversible in one place if the lecturer ever says otherwise.
      One of them has value elsewhere: §3.2''s Landau notation is the same O-notation Algorithmen 2 uses,
      and Labs/Schreyer p. 94 covers it if it is ever wanted for that reason rather than this one.'
    vault_path: material://source-analysis-skript/unser skript.pdf
    scope_triage: required-now
