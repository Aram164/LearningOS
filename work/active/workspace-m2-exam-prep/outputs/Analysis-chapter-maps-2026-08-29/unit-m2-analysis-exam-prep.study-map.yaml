  title: Deferred – Chapter 8 and the non-exam Exkurse
  status: pending
  objective: 'The explicit deferral ledger: script Chapter 8 in full, and every section labelled Exkurs.
    Held as a named boundary so a deferred topic is never re-discovered as a gap, and so the decision
    can be revisited if the lecturer changes scope.'
  done_when:
  - 'Reproduce without notes: The explicit deferral ledger: script Chapter 8 in full, and every section
    labelled Exkurs. Held as a named boundary so a deferred topic is never re-discovered as a gap, and
