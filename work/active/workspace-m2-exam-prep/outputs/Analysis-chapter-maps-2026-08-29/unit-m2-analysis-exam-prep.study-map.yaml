    angle: 'A different course''s exam culture: everything is a proof, and the language is English. Use
      for proof stamina, never as a scope signal.'
    angle_detail: Kept at the bottom of the retrieval menu deliberately. 18.100C is a real-analysis course
      with a metric-space and topology component this script does not have, so its questions routinely
      fall outside scope, and its style — prove everything — contradicts this script's explicit contract
      that proofs need not be reproduced. The one thing it is good for is practising sustained written
