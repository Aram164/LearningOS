- id: stage-m2-analysis-calibrate
  number: 1
  title: Calibrate the script-led method and the exam boundary
  status: pending
  objective: Read the course contract and fix the three depths it defines — Wiederholung required, Ausflug
    at overview depth, Exkurs out of scope — then run a cold diagnostic so the chapter sessions can be
    entered at the right level rather than uniformly from zero.
  done_when:
  - 'Reproduce without notes: Read the course contract and fix the three depths it defines — Wiederholung
    required, Ausflug at overview depth, Exkurs out of scope — then run a cold diagnostic so the chapter
    sessions can be entered at the right level rather than uniformly from zero.'
  exam_critical: true
  concepts:
  - concept-proof-technique
  scope_triage: required-now
  resources:
  - kind: read
    label: unser skript.pdf — the course contract and the chapter map
    locator: 'unser skript.pdf: Vorwort and the three-label contract pp. iv-vii (Wiederholung required,
      Ausflug at overview depth, Exkurs not exam-relevant, proofs need not be reproduced); Inhaltsverzeichnis
      pp. ii-iii; Bezeichnungen p. viii; Kapitel 8 Exkurse printed p. 226 (PDF p. 236) onward'
    angle: The document that decides what counts as in scope, at what depth, and therefore what every
      other route on every other session is for.
    angle_detail: 'Read pp. iv-vii once, deliberately, before Chapter 1. Three claims there govern the
      whole plan: Wiederholung sections are assumed known and are not re-taught; Ausflug sections should
      be understood and applied but are not an exam focus; Exkurs sections are explicitly not exam-relevant.
      And the sentence that shapes everything else — ''Die Beweise müssen Sie nicht können'' — with the
      positive form beside it: definitions, results and their application in concrete problems are what
      the exam asks for. Every ''reference-only'' label in this module traces back to that page.'
    vault_path: material://source-analysis-skript/unser skript.pdf
    scope_triage: required-now
  - kind: read
    label: kleine_beweise.pdf — the whole list, and its disclaimer
    locator: 'kleine_beweise.pdf (2 pp, SoSe 2025 Tutorium zur Prüfungsvorbereitung, Hannah Shorten and
      Noah-Joël Seegert): twenty results across Kapitel 3 to 7, with the printed caveat that the list
      was compiled by student assistants and ''steht in keinem uns bekannten Zusammenhang mit den Inhalten
      der Klausur'''
    angle: One page that answers the question the course contract leaves open — if proofs need not be
      reproduced, which ones are still worth understanding.
    angle_detail: 'Read once at calibration to see the shape of the answer: twenty results for a 225-page
      script, concentrated in Chapters 3 and 6. Then use it per chapter, where it is routed individually,
      to repair a failed application. The disclaimer is real and is why this is a calibration input rather
      than an authority — it is an experienced reader''s shortlist, not exam intelligence, and the plan
      treats it as the former.'
    vault_path: material://source-analysis-skript/kleine_beweise.pdf
    scope_triage: required-now
  - kind: reference
    label: Maths220 — Proofs in Calculus
    locator: Maths220_Proofs-in-Calculus.pdf (17 pp)
    angle: Seventeen pages on how a limit or convergence proof is actually written — the shape, not the
      content.
    angle_detail: 'Short enough to read at calibration and specific enough to be worth it: it is about
      the written form of the arguments this module keeps asking for, which is the gap between understanding
      a proof and producing one under time. Routed here rather than to a chapter because it is about the
      form of every chapter''s arguments at once.'
    scope_triage: helpful-now
  - kind: read
    label: Ableitinger Teil I and Teil III — the method behind a written solution
    locator: 'ableitinger.pdf Teil I: Kap. 3 ''Teilprozesse beim Aufgabenlösen'' p. 22 (P Problembewusstsein,
      K Klärung der Handlungsoptionen, Z Zugriff herstellen, A Anpassen/Prüfen der Passung, H Handwerk,
      T Tricks, B begleitende Kommentare) and §3.8 ''Die Teilprozesse in einer vollständigen Musterlösung''
      p. 30; Teil II §4.2 ''Hinweise zum Verfassen komprimierter Musterlösungen'' p. 38; Teil III Kap.
      10 ''Verfassen ausführlicher Musterlösungen'' p. 165 with the full write-ups in Kap. 12 p. 232'
    angle: The one source here that treats writing a solution as a skill with named parts, rather than
      as what happens after you know the answer.
    angle_detail: Read Teil I once at calibration. Its claim is that solving a task decomposes into seven
      sub-processes and that most teaching only ever shows the last one, which is why a student who follows
      every step of a model solution still cannot produce one. That is a precise description of the failure
      this plan's per-chapter Musterlösungen routes are meant to prevent, and §4.2 on writing *compressed*
      solutions is directly relevant to a three-hour paper. The per-chapter sections (§§6.1-6.10, §§7.1-7.3)
      are routed on the chapters themselves.
    vault_path: material://source-ableitinger-musterloesungen/ableitinger.pdf
    scope_triage: helpful-now
  - kind: read
    label: Ohlbach/Eisinger — the catalogue of proof patterns
    locator: Ohlbach-Eisinger_Design-Patterns-fuer-mathematische-Beweise.pdf Kap. 4 Einfache Beweismuster
      p. 29, Kap. 5 Komplexe Beweismuster p. 50. Located by the 2026-08-03 coverage audit; no contextual
      evaluation registered, so depth and scope stay unassessed (CLAUDE.md §4).
    angle: The German naming of the patterns — useful once at calibration so a task's shape can be recognised
      rather than rediscovered.
    angle_detail: 'Same light touch as Velleman: two chapters skimmed once, not a book to work. Its value
      at calibration is vocabulary — Kontraposition, Widerspruchsbeweis, Widerlegung durch Gegenbeispiel
      — because a task that says ''beweisen oder widerlegen Sie'' is asking for a named pattern and the
      naming makes the choice faster.'
    vault_path: material://source-ohlbach-eisinger-beweise/Ohlbach-Eisinger_Design-Patterns-fuer-mathematische-Beweise.pdf
    scope_triage: helpful-now
  - kind: read
    label: Velleman — proof strategies and the summary of techniques
    locator: Velleman_How-To-Prove-It.pdf Ch 3 Proofs p. 118 (§3.1 Proof Strategies p. 118); 'Summary
      of Proof Techniques' p. 555. Located by the 2026-08-03 coverage audit; no contextual evaluation
      registered, so depth and scope stay unassessed (CLAUDE.md §4).
    angle: A two-page summary of proof techniques at the back, which is the part worth having at calibration;
      the rest is a course.
    angle_detail: Routed lightly here on purpose. The induction chapters are on the Chapter 1 session
      where they belong; what belongs at calibration is p. 555, a single table of which technique the
      shape of a statement calls for. Reading the book is not part of this plan.
    vault_path: material://source-velleman-how-to-prove-it/Velleman_How-To-Prove-It.pdf
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-analysis-exam-prep/stages/stage-m2-analysis-calibrate/notes.md
  attachments: []
  source_feedback: []
