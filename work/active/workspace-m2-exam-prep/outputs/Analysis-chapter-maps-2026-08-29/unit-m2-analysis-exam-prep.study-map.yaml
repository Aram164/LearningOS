  - kind: read
    label: Unsolved German papers, held for timed sittings
    locator: 'Ulm_Analysis-fuer-Informatiker_Klausur-SS10_nur-Aufgaben.pdf (2 pp, 120 min, 100 points,
      8 tasks — tasks 2, 3, 4, 5, 6 and 8 are in scope; task 7 is multivariable and task 1 is partly number-system
      material); Leipzig_Analysis-fuer-Informatiker_Probeklausur.pdf (2 pp, 4 tasks: Mengen/Abbildungen/Induktion/reelle
      Zahlen, Folgen, Reihen, Stetigkeit — the closest single paper to Chapters 1-5)'
    angle: The only Analysis papers in the collection that have not been read with their solutions — they
      can be spent exactly once each, under exam conditions.
    angle_detail: 'Their value is entirely in being unseen, which is why they are routed here and to no
      chapter session: a paper opened during Chapter 3 revision is no longer a mock. Ulm is the better
      full rehearsal — 120 minutes, 100 points, and six of its eight tasks map onto script Chapters 3
      to 7 including two antiderivatives and an existence argument by IVT. Leipzig is the better coverage
      check for the first half. Note both are ''für Informatiker'' papers, which is the same audience
      as this module.'
    scope_triage: helpful-now
  - kind: read
    label: Stuttgart Probeklausur 1 — solved; only Aufgabe 3 is in scope
    locator: '''Aufgabe 3 ist gut.pdf'' (3 pp, Universität Stuttgart, ''Lösungen zur Probeklausur 1''):
      Aufgabe 1 Äquivalenzrelationen, Aufgabe 2 komplexe Zahlen (out of scope), Aufgabe 3 parts (a) define
      a Cauchy sequence, (b) negate the definition, (c) two limit computations'
    angle: One good task on Cauchy sequences and the negation of a definition — already solved, so it
      cannot serve as a timed mock.
    angle_detail: '⚠ Correction, 2026-08-29: the pre-existing route listed this file among the *unsolved*
      papers held for timed sittings. It is not unsolved — the file is titled ''Lösungen zur Probeklausur
      1'' and every task is worked. That matters for how the file is used, not for whether it is useful.
      As a solved task it belongs with the diagnosed-gap material rather than with Ulm and Leipzig; the
      negation half of Aufgabe 3 is the same skill Regensburg''s A2.2 tests and is worth working for that
      reason. Aufgabe 2 is complex numbers and outside this script.'
    scope_triage: helpful-now
  - kind: read
    label: MIT 18.100C exam set — English, proof-heavy, a different syllabus
    locator: MIT18100C_Final.pdf (7 pp) with MIT18100C_Final-Solutions.pdf (6 pp), MIT18100C_Midterm2.pdf
