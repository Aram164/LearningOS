  - kind: read
    label: Solved German Klausur tasks on continuity, IVT and compactness
    locator: 'Regensburg_...pdf A3 (four quickfire questions on which sets can be the continuous image
      of [0,1] — IVT and compactness together, with ''Häufige Fehler'' notes), A7 (no continuous f: [0,1]
      → R≥0 with f(0)=f(1)=0 takes every value exactly twice — Extremwertsatz plus IVT). Marburg_...pdf
      2. Klausur A9 (for which a is a piecewise function continuous), A10 (exactly one solution of 1 −
      x² = exp(x−1) on [0,1]), A11 (a maximum exists on [0,∞)), A12 (injectivity, image, and continuity
      of the inverse); Wiederholungsklausur A9, A10, A12. Paderborn_...pdf A3(a) (show x ↦ e^x + x + 1
      is bijective), A4(b) (is sin(1/(x−1)) extended by 0 continuous), A4(c) (a function sequence)'
    angle: The richest chapter in the external bank — and the tasks come in exactly the two shapes the
      HU WV set uses.
    angle_detail: 'Sort them into the two shapes before working any: ''is this piecewise function continuous,
      and for which parameter'' (Marburg 2.A9, WK A9, Paderborn A4(b)) and ''show a solution exists and
      is unique'' (Marburg 2.A10, WK A10, Paderborn A3(a)) — the second being WV1.4''s shape exactly,
      IVT for existence plus monotonicity for uniqueness. Regensburg A3 and A7 are a third, rarer shape:
      reasoning about what continuity forbids. All solved, so spend them on diagnosed gaps; the unsolved
      papers stay on the transfer unit.'
    scope_triage: helpful-now
