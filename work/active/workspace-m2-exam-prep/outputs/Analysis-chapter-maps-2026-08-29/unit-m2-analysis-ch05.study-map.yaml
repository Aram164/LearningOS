  title: Grenzwerte bei Funktionen (§5.1)
  status: pending
  objective: The limit of a function at an accumulation point, defined both directly and through the sequence
    criterion. Serie 08.4 asks for one limit proved both ways, which is the clearest signal of what the
    course wants here.
  done_when:
  - 'Reproduce without notes: The limit of a function at an accumulation point, defined both directly
    and through the sequence criterion. Serie 08.4 asks for one limit proved both ways, which is the clearest
    signal of what the course wants here.'
  - Work HU Serie 08.4, Serie 09 and Hausaufgaben WV1.2 and WV1.4 — the last calibrated practice, then
    the remaining 4, and record every miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-limits-continuity
  scope_triage: required-now
  resources:
  - kind: read
    label: unser skript.pdf Kapitel 5 — the scope authority
    locator: unser skript.pdf Kapitel 5, printed p. 98 (PDF p. 108)–printed p. 136 (PDF p. 146); §5.1
      Grenzwerte bei Funktionen printed p. 98 (PDF p. 108), §5.2 Uneigentliche und einseitige Grenzwerte
      printed p. 102 (PDF p. 112), §5.3 Stetige Funktionen printed p. 107 (PDF p. 117), §5.4 Zwischenwertsatz,
      Umkehrfunktion und Extrempunkte printed p. 111 (PDF p. 121), §5.5 Besonderheiten stetiger Funktionen
      auf abgeschlossenen, beschränkten Intervallen printed p. 121 (PDF p. 131), §5.6 Exponentialfunktion
      und Logarithmen printed p. 122 (PDF p. 132), §5.7 Gleichmäßige Konvergenz von Funktionenfolgen printed
      p. 129 (PDF p. 139). §5.8 is an Exkurs and is not worked here.
    angle: The chapter whose title says derivatives and whose content is continuity — and the last one
      with current HU exercises.
    angle_detail: 'Read §5.1 as the hinge of the whole script: it defines the limit of a function through
      sequences, which is why Chapter 3 had to come first and why a weak §3.5 shows up here. §§5.4-5.5
      are the three theorems the external papers ask to be *stated* with complete hypotheses — intermediate
      value, attained extrema, continuous inverse — and stating them precisely is worth more marks than
      any calculation in the chapter. §5.7 is two pages with no HU sheet behind it, which makes it the
      easiest thing in the chapter to arrive at the exam never having practised.'
    vault_path: material://source-analysis-skript/unser skript.pdf
    scope_triage: required-now
  - kind: practise
    label: HU Serie 08.4, Serie 09 and Hausaufgaben WV1.2 and WV1.4 — the last calibrated practice
    locator: 'Pd3szO-ana_inf_serie08.pdf: 8.4 Grenzwerte von Funktionen — compute the limits and prove
      one of them twice, once from Definition 5.5 and once from the Folgenkriterium Satz 5.6. ana_inf_serie09.pdf:
      9.1 Stetigkeit, 9.2 Eigenschaften von Grenzwerten von Funktionen, 9.3 HA (20 P) Grenzwerte von Funktionen
      und Stetigkeit. ana_inf_serieWV.pdf: WV1.2 (20 P), parts (a) define continuity at a point, (b) the
      function that is x on Q and −x elsewhere is continuous only at 0, (c) three limits built on it;
      WV1.4 (20 P), parts (a) state the Zwischenwertsatz with complete hypotheses, (b) a unique solution
