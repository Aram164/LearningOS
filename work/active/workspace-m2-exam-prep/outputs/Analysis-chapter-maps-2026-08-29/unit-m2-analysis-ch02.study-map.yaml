- id: stage-m2-analysis-ch02-intervalle-betrag
  number: 3
  title: Intervalle und Betragsfunktion (§2.3.1)
  status: pending
  objective: Interval notation and the absolute value as a distance, including the triangle inequality
    in the form the convergence definition uses.
  done_when:
  - 'Reproduce without notes: Interval notation and the absolute value as a distance, including the triangle
    inequality in the form the convergence definition uses.'
  - Work HU Serie 05, Hausaufgabe 5.4 — supremum, infimum, maximum, minimum with proof, then the remaining
