- id: stage-m2-analysis-ch02-koerperaxiome
  number: 1
  title: Wiederholung – Körperaxiome (§2.1)
  status: pending
  objective: 'The field axioms and the consequences drawn from them. Labelled Wiederholung: assumed from
    M1.2, restated here only to fix notation.'
  done_when:
  - 'Reproduce without notes: The field axioms and the consequences drawn from them. Labelled Wiederholung:
    assumed from M1.2, restated here only to fix notation.'
  - Work Bestimmt_Scan.pdf — handwritten field and order axioms, then the remaining 2, and record every
    miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-real-numbers
  scope_triage: required-now
  resources:
  - kind: read
    label: unser skript.pdf Kapitel 2 — the scope authority
    locator: unser skript.pdf Kapitel 2, printed p. 7 (PDF p. 17)–printed p. 40 (PDF p. 50); §2.1 Körperaxiome
      (Wiederholung) printed p. 8 (PDF p. 18), §2.2 Anordnung printed p. 9 (PDF p. 19), §2.3.1 Intervalle
      und Betrag printed p. 13 (PDF p. 23), §2.3.2 Supremum und Infimum printed p. 15 (PDF p. 25), §2.3.3
      Vollständigkeitsaxiom printed p. 16 (PDF p. 26), §2.3.4 Folgerungen printed p. 18 (PDF p. 28), §2.3.5
      Potenzen printed p. 22 (PDF p. 32), §2.3.6 Wurzeln printed p. 23 (PDF p. 33), §2.4 Ausflug – Maschinenzahlen
      printed p. 26 (PDF p. 36)
    angle: The chapter that installs the one axiom the rest of the script cannot do without, in the form
      this examiner states it.
    angle_detail: Read §2.3 as the chapter and the rest as its setting. Completeness is stated here in
      the supremum form, and every convergence theorem from Chapter 3 onward is either a direct consequence
      or reaches it through Bolzano-Weierstraß — so the exact statement, including which sets it applies
      to, is worth more than any amount of practice on §2.1. The §2.4 Ausflug on machine numbers is the
      chapter's Informatik payoff; the contract puts it at overview depth, and no other source on this
      menu covers it at all.
    vault_path: material://source-analysis-skript/unser skript.pdf
    scope_triage: required-now
  - kind: practise
    label: Bestimmt_Scan.pdf — handwritten field and order axioms
    locator: Bestimmt_Scan.pdf (12 pp; scanned, weak text layer)
    angle: Handwritten axiom manipulation of the kind §2.1 and §2.2 assume and never demonstrate.
    angle_detail: 'A short scanned set on deriving the order rules from the axioms. Its limitation is
      mechanical rather than mathematical: the text layer is weak, so it cannot be searched or excerpted,
      and it was flagged as such in the 2026-08-03 inventory. Worth a pass only if the axiom-level manipulation
      in §2.2 is genuinely unfamiliar; otherwise Forster §2/§3 does the same job with solutions you can
      search. The scan has no usable text layer: it cannot be searched or excerpted and has to be read
      as images.'
    scope_triage: helpful-now
  - kind: read
    label: Solved German Klausur tasks on order, suprema and bounded sets
    locator: 'Marburg_Analysis-I_3-Klausuren-mit-Loesungen.pdf: 1. Klausur A2 (make a ring totally ordered
      from a positivity set — the order axioms as axioms), A6 (for which n is a two-index set bounded,
      and what are its inf and sup); Regensburg_...pdf A2.1 (if every element of A is negative, must sup
      A be negative?) with its ''Häufige Fehler'' note that this was widely got wrong'
    angle: Exam-shaped supremum questions with solutions, including one that is graded commentary on the
      standard mistake.
    angle_detail: 'Regensburg''s A2.1 is worth more than its three points suggest: it is the sup-versus-max
      confusion set as a true/false with justification, and the printed ''Häufige Fehler'' records that
      students asserted sup A = 0 for every A ⊂ R_<0. That is the same error the HU Hausaufgabe 5.4 is
      built to expose. Marburg''s A6 is the closer match for a full written answer. Both are solved, so
      spend them on a diagnosed gap rather than as a test.'
    scope_triage: helpful-now
  - kind: practise
    label: Forster/Wessoly §§2, 3, 5, 6 — Körper, Anordnung, Vollständigkeit, Wurzeln
    locator: forster-wessoly.pdf Aufgaben §2 Die Körperaxiome p. 15, §3 Anordnungsaxiome p. 18, §5 Das
      Vollständigkeitsaxiom p. 23, §6 Wurzeln p. 24; Lösungen §2 p. 78, §3 p. 84, §5 p. 93, §6 p. 101
    angle: Section-for-section the closest external match to §§2.1-2.3.6, with solutions, in the German
      the exam is written in.
    angle_detail: 'The alignment here is unusually tight: Forster''s §2/§3/§5/§6 map onto the script''s
      §2.1/§2.2/§2.3.3/§2.3.6 almost one to one, including the same ordering of ideas. That makes this
      the default drill for the chapter and the reason it is listed before the English texts. The solutions
      are terse — they show the argument, not the search for it — so pair a first attempt with Fritzsche''s
      fuller write-up when one does not come out.'
    vault_path: material://source-forster-wessoly/forster-wessoly.pdf
    scope_triage: helpful-now
  - kind: practise
    label: Deitmar Kap. 2 — Die reellen Zahlen
    locator: deitmar.pdf Kap. 2 Die reellen Zahlen p. 19 (§2.1 Körper, §2.2 Anordnung p. 20, §2.3 Intervalle
      und beschränkte Mengen p. 21, §2.4 Dedekind-Vollständigkeit p. 22); Lösungen Kap. 22 p. 138
    angle: Fresh problems on the same four subsections, in reserve once Forster is spent.
    angle_detail: 'One difference worth knowing before opening it: Deitmar states completeness in the
      Dedekind-cut form while the script uses the supremum form. The two are equivalent and the exercises
      are unaffected, but a definition read here and reproduced in the exam would be in the wrong vocabulary.
      Use it for problems, not for the statement.'
    vault_path: material://source-deitmar-uebungsbuch/deitmar.pdf
    scope_triage: helpful-now
  - kind: read
    label: Grieser Kap. 2 und Kap. 5 — reelle Zahlen und Vollständigkeit
    locator: grieser.pdf Kap. 2 'Reelle, rationale und ganze Zahlen' p. 20 (§2.1 Die reellen Zahlen p.
      20, §2.3 vollständige Induktion p. 33, Übungen p. 40); Kap. 5 'Die Vollständigkeit der reellen Zahlen'
      p. 74 (§5.1 Das Supremumsaxiom p. 74, §5.2 Potenzen mit rationalen Exponenten p. 79, §5.3 Das Extremalprinzip
      p. 83, Übungen p. 87); Lösungen und Hinweise p. 329
    angle: 'The German second voice: same rigour as the English texts, with motivation, and exercises
      that carry both hints and solutions.'
    angle_detail: 'Grieser separates the number systems (Kap. 2) from completeness (Kap. 5) and puts combinatorics
      between them, so it is read by section rather than in order. Two things make it worth the detour
      on this chapter: §5.2 derives rational powers from the supremum axiom, which is the script''s §2.3.5-2.3.6
      done slowly; and the exercises come with Hinweise as well as Lösungen, so a stuck problem has an
      intermediate step between ''nothing'' and ''the answer''.'
    vault_path: material://source-grieser-analysis1/grieser.pdf
    scope_triage: helpful-now
  - kind: read
    label: Lebl — Real Numbers
    locator: 'realanal.pdf ''Real Numbers'' p. 23: Basic properties p. 23, The set of real numbers p.
      29, Absolute value and bounded functions p. 36, Intervals and the size of R p. 41'
    angle: The free English text whose section order tracks the script most closely — the structural second
      reading.
    angle_detail: 'Lebl builds R in the same sequence the script does: ordered field, then bounded sets
      and suprema, then completeness, then absolute value and intervals. That makes it useful in a way
      Abbott is not — you can read a script section and its Lebl counterpart side by side and the arguments
      line up. Volume II (realanal2.pdf) is multivariable and out of scope entirely.'
    vault_path: material://source-lebl-basic-analysis/realanal.pdf
    scope_triage: helpful-now
  - kind: read
    label: Labs/Schreyer — Die reellen Zahlen
    locator: 'Labs-Schreyer_Mathematik-fuer-Informatiker.pdf Teil II ''Analysis in einer Veränderlichen''
      p. 75: ''Die reellen Zahlen'' p. 79 (Die Körperaxiome p. 79, Ringe p. 81, Folgerungen aus den Körperaxiomen
      p. 81, Die Anordnungsaxiome p. 83, Irrationale Zahlen p. 85); ''Das Vollständigkeitsaxiom'' p. 95,
      ''Quadratwurzeln'' p. 100, ''Zur Existenz der reellen Zahlen'' p. 103. Located by the 2026-08-03
      coverage audit; no contextual evaluation registered, so depth and scope stay unassessed (CLAUDE.md
      §4).'
    angle: German, written for computer scientists, and structured like the script — the closest match
      in framing to the lecture itself.
    angle_detail: The 2026-08-03 audit routed this source to 'AN.0 prerequisite gap' because 669 pages
      made it look too broad to use. Opened, its Teil II is a complete one-variable Analysis in the same
      order as the script, and the Chapter 2 material is a well-marked 25-page span. Note that it puts
      the completeness axiom inside its Konvergenz chapter rather than with the field axioms — a different
      arrangement from the script, and a reason to take problems from it rather than structure.
    vault_path: material://source-labs-schreyer-mathe-informatiker/Labs-Schreyer_Mathematik-fuer-Informatiker.pdf
    scope_triage: helpful-now
  - kind: read
    label: Ross §§3-4 — the set R and the completeness axiom
    locator: Ross_Elementary-Analysis_2ed.pdf §3 The Set R of Real Numbers p. 25, §4 The Completeness
      Axiom p. 32, §5 The Symbols +∞ and −∞ p. 40; Selected Hints and Answers p. 376. Located by the 2026-08-03
      coverage audit; no contextual evaluation registered, so depth and scope stay unassessed (CLAUDE.md
      §4).
    angle: Proof-oriented and unusually explicit about which axiom is being used in which step.
    angle_detail: Ross numbers his sections rather than chapters and keeps them short, which makes him
      easy to enter at a point. §4 is the completeness axiom with the Archimedean property drawn out as
      an immediate consequence — the script's §2.3.4. The book has been unassessed against this exam since
      it was located; the locator is a fact, the judgement about whether it earns time here is not, and
      is left open deliberately.
    vault_path: material://source-ross-elementary-analysis/Ross_Elementary-Analysis_2ed.pdf
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-analysis-ch02/stages/stage-m2-analysis-ch02-koerperaxiome/notes.md
