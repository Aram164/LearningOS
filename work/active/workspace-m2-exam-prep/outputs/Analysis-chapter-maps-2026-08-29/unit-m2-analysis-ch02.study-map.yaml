      or reaches it through Bolzano-Weierstraß — so the exact statement, including which sets it applies
      to, is worth more than any amount of practice on §2.1. The §2.4 Ausflug on machine numbers is the
      chapter's Informatik payoff; the contract puts it at overview depth, and no other source on this
      menu covers it at all.
    vault_path: material://source-analysis-skript/unser skript.pdf
    scope_triage: required-now
  - kind: practise
    label: HU Serie 05, Hausaufgabe 5.4 — supremum, infimum, maximum, minimum with proof
    locator: 'ana_inf_serie05.pdf, Hausaufgabe 5.4 (HA, 10 Punkte): decide boundedness of B = {1/2^n +
      (-1)^m : n, m ∈ N_0} and determine sup, inf, max, min with proof. Related: Übungsaufgabe 7.1 (Heron)
      on ana_inf_serie07.pdf reaches §2.3.6.'
    angle: The only current HU task on this chapter, and it is graded — so it is the most reliable single
      signal of the expected depth.
    angle_detail: 'Read what the task actually asks: not ''compute the supremum'' but ''determine it and
      prove your answer'', with maximum and minimum asked separately so the sup-versus-max distinction
      has to be argued rather than assumed. Its own Tipp routes the solution through monotonicity and
