- id: stage-m2-analysis-ch01-zahlenmengen
  number: 1
  title: Zahlenmengen und Notation (§1.1)
  status: pending
  objective: The number sets N, Z, Q, R and the notation the script uses for them, together with the logical
    and set symbols fixed in the Bezeichnungen section. This is the vocabulary every later definition
    is written in.
  done_when:
  - 'Reproduce without notes: The number sets N, Z, Q, R and the notation the script uses for them, together
    with the logical and set symbols fixed in the Bezeichnungen section. This is the vocabulary every
    later definition is written in.'
  - Work Fritzsche §§1.1-1.2 — Mengen von Zahlen, Induktion, then the remaining 1, and record every miss
    with the step it failed at.
  exam_critical: true
  concepts:
  - concept-real-numbers
  scope_triage: required-now
  resources:
  - kind: read
    label: unser skript.pdf Kapitel 1 — the scope authority
    locator: unser skript.pdf Kapitel 1, printed p. 1 (PDF p. 11)–printed p. 6 (PDF p. 16); §1.1 Zahlenmengen
      printed p. 2 (PDF p. 12), §1.2 Vollständige Induktion printed p. 2 (PDF p. 12), §1.3 Wichtige Beziehungen
      in der Analysis printed p. 5 (PDF p. 15)
    angle: The chapter that defines what 'assumed known' means for this exam, in this examiner's notation.
    angle_detail: 'Six printed pages, and the whole chapter carries the Wiederholung label — under the
      course contract (script p. vii) that means the lecture does not re-teach it and expects it to be
      usable. So this route is read differently from every other spine route in the module: not as instruction
      but as a checklist of what has to already work. Its practical value is the notation: §1.3''s inequalities
      are cited by number throughout Chapters 3 to 7, and finding them here once is cheaper than reconstructing
      them mid-proof.'
    vault_path: material://source-analysis-skript/unser skript.pdf
    scope_triage: required-now
  - kind: practise
    label: Fritzsche §§1.1-1.2 — Mengen von Zahlen, Induktion
    locator: fritzsche.pdf §1.1 Mengen von Zahlen p. 9, §1.2 Induktion p. 17; Lösungen in Kap. 5 Anhang
      from p. 253
    angle: Explained German solutions at tutorial pace — the gentlest route on this session, and the one
      that shows the write-up, not just the answer.
    angle_detail: 'Fritzsche is a Trainingsbuch: each section opens with worked reasoning before the exercises,
      and the Anhang solutions are written out in full sentences rather than sketched. For a Wiederholung
      chapter that is the right shape — the risk here is not that induction is unknown but that the written
      argument is sloppy, and this is the source that models the written argument. §§1.5-1.6 (Vektoren,
      komplexe Zahlen, Polynome) go past the script and are left closed.'
    vault_path: material://source-fritzsche-trainingsbuch/fritzsche.pdf
    scope_triage: helpful-now
  - kind: read
    label: Solved German Klausur tasks on logic, sets and induction
    locator: 'Marburg_Analysis-I_3-Klausuren-mit-Loesungen.pdf: 1. Klausur A1 (set identities and inclusion-exclusion),
      A3 (induction sum formula), A4 (an inequality by completing a square); 2. Klausur A1 (n! ≤ (n/2)^n
      with proof), A2 (a complex modulus set); Wiederholungsklausur A1 (binomial identity), A2 (a product-to-sum
      identity by induction). Darmstadt_Analysis-I_Probeklausur_mit-Loesungen.pdf: A1 Aussagenlogik, A5
      rekursive Folgen und Induktion. Regensburg_...pdf: A1 (tautology, power set, an induction-like principle,
      transitivity) with its ''Häufige Fehler'' commentary'
    angle: Real German exam wording for exactly this chapter, with solutions — and the only place the
      graders' commentary on how it is got wrong is written down.
    angle_detail: 'This is the substitute for the missing HU sheet, and it is a good one: Chapter 1 material
      is over-represented in the external bank because most Analysis 1 courses open there. Two cautions.
      First, spend these on diagnosed gaps rather than as a test — the unsolved papers held for timed
      work live on the transfer unit, and a solved paper read early cannot be un-read. Second, Marburg''s
      Aufgabe 2 (ordered rings) and the complex-number tasks sit past this script''s boundary; work the
      parts that match §§1.1-1.3 and leave the rest. The Regensburg ''Häufige Fehler'' boxes are the single
      most useful thing in the folder for this chapter: they name the wrong moves rather than the right
      ones.'
    scope_triage: helpful-now
  - kind: read
    label: TUM Ferienkurs Analysis 1 — Kapitel 1 Grundlagen + Übungsaufgaben
    locator: 'TUM_Ferienkurs-Analysis-1_Skriptum.pdf: Kap. 1 Grundlagen PDF p. 5 (§1.1 Aussagenlogik,
      §1.2 Mengen und Quantoren, §1.4 Beweise PDF p. 9, §1.5 Funktionen und Abbildungen), Übungsaufgaben
      PDF p. 17; Anhang A ''Wichtige Hinweise zum Beweisen und Rechnen'' PDF p. 82'
    angle: A compressed German revision script with its own exercise set — built for exactly this situation,
      revising a whole Analysis 1 quickly.
    angle_detail: 'This is a Ferienkurs Skriptum, not a Klausur, which is why it is separated from the
      exam papers: it is meant to be read and worked, not spent once. It compresses Analysis 1 into 88
      pages, so it is the fastest complete second account available. Two caveats: it is written for physicists,
      so §1.6 (komplexe Zahlen) and §1.7 (Gruppen und Körper) reach past this script; and it carries QR
      codes to videos that were not checked. Anhang A is worth reading once regardless of chapter — it
      is a page on how to write the arguments this exam grades.'
    scope_triage: helpful-now
  - kind: reference
    label: Mengen und Abbildungen / Relationen handouts
    locator: Mengen-und-Abbildungen.pdf (22 pp), Relationen.pdf (9 pp) — targeted subsection only
    angle: Prerequisite repair for the set and mapping vocabulary the script assumes from M1 and never
      restates.
    angle_detail: 'These are short orientation handouts, not a course. They exist on this session for
      one reason: the script''s Bezeichnungen section lists the symbols without explaining them, and if
      image/preimage, injectivity or an equivalence relation is genuinely rusty, that shows up later as
      an inability to read a theorem statement rather than as a Chapter 1 problem. Open the subsection
      the diagnostic named and close the file again.'
    scope_triage: helpful-now
  - kind: practise
    label: Deitmar Kap. 1 — Grundlagen
    locator: deitmar.pdf Kap. 1 Grundlagen p. 12 (§1.1 Aussagen, §1.2 Mengen, §1.3 Abbildungen, §1.4 Vollständige
      Induktion p. 15); Lösungen Kap. 21 p. 130
    angle: A third solved bank, held in reserve for when Fritzsche and Forster are spent on this node.
    angle_detail: Deitmar's Übungsbuch covers far more than this module (Kap. 8-20 run to measure theory
      and complex analysis) and only Kap. 1-7 are in scope at all. Its value on Chapter 1 is volume of
      fresh problems with worked Lösungsvorschläge, at a difficulty between Fritzsche and Forster. Nothing
      here is a new explanation — reach for it when the technique needs more repetitions, not when it
      needs a different account.
    vault_path: material://source-deitmar-uebungsbuch/deitmar.pdf
    scope_triage: helpful-now
  - kind: read
    label: Labs/Schreyer — Logik, Beweismethoden, Mengen und Abbildungen
    locator: 'Labs-Schreyer_Mathematik-fuer-Informatiker.pdf Teil I Grundlagen p. 21: ''Logik und Beweismethoden''
      p. 25 (Beweis durch Widerspruch p. 29, Vollständige Induktion p. 30, Summen- und Produktzeichen
      p. 32), ''Mengen und Abbildungen'' p. 39, ''Äquivalenzrelationen und Kongruenzen'' p. 55. Located
      by the 2026-08-03 coverage audit; no contextual evaluation registered, so depth and scope stay unassessed
      (CLAUDE.md §4).'
    angle: A German mathematics-for-CS textbook whose Teil I is precisely the M1 prerequisite block this
      chapter assumes.
    angle_detail: 'Its 669 pages were previously the reason it was routed to ''AN.0 prerequisite gap''
      and nothing more. Opened at chapter level it turns out to be organised the way this script is: Teil
      I is the Grundlagen, Teil II is one-variable Analysis section by section. For Chapter 1 the relevant
      span is 30 pages, and it is in German with CS examples, which makes it a closer match to the lecture''s
      own framing than the English references on this menu.'
    vault_path: material://source-labs-schreyer-mathe-informatiker/Labs-Schreyer_Mathematik-fuer-Informatiker.pdf
    scope_triage: helpful-now
  - kind: read
    label: Velleman — Mathematical Induction and the proof strategies behind it
    locator: Velleman_How-To-Prove-It.pdf Ch 6 Mathematical Induction p. 335 (§6.1 Proof by Mathematical
      Induction, §6.2 More Examples p. 343, §6.3 Recursion p. 359, §6.4 Strong Induction p. 371); Ch 3
      Proofs p. 118 for the strategies; Ch 1-2 logic and sets p. 21; solutions to selected exercises p.
      483. Located by the 2026-08-03 coverage audit; no contextual evaluation registered, so its depth
      and scope are deliberately left unassessed (CLAUDE.md §4).
    angle: The book that teaches induction as a proof strategy rather than a formula, including the strong-induction
      and recursion variants the Hanoi task needs.
    angle_detail: 'Routed here for the first time at chapter level: before this pass it carried `proof-presentation`
      and a bare page count. §6.3 Recursion is the direct match for HU Serie 05.1, and §6.4 Strong Induction
      is what a recurrence with two previous terms actually requires — the script''s §3.4 case. It is
      English, 569 pages, and structured as a course, so it is a reference to enter at a named section,
      never a book to read through. Nobody has assessed it against this exam, which is recorded rather
      than guessed.'
    vault_path: material://source-velleman-how-to-prove-it/Velleman_How-To-Prove-It.pdf
    scope_triage: helpful-now
