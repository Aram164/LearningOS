- id: stage-sad-l07-geometric
  number: 4
  title: Geometric waiting times
  status: pending
  objective: 'The Geometric model counts trials until first success and has the memoryless property. Geometric
    waiting times are complementary preparation here: L07 has no dedicated section and Übungsblatt 3 Aufgabe
    2 tests other distributions. The registered Blatt 4 later uses Geometric(p=0.02) in Aufgabe 3(a)(4),
