      unit_id: unit-m2-sad-l06
      title: Ross — random-variable theory
      format: book
      angle: Proves the variance identity Var(X) = E[X²] − (E[X])², which is the computational form every
        exercise actually uses.
      covers:
      - knowledge-sad-l06-random-variable
      - knowledge-sad-l06-distribution-functions
      - knowledge-sad-l06-expectation
      - knowledge-sad-l06-variance-covariance
      depth: advanced-reference
      scope: complementary
      locator: Ch 4 Random Variables, pdf pp. 198-305 (§4.3 expected value; §4.4 expectation of a function
        of a random variable; §4.5 variance; §4.10 properties of the cumulative distribution function);
        Ch 7 §7.2 expectation of sums, pdf pp. 478-500
      angle_detail: The definition of variance is an expected squared deviation; almost every calculation
        uses the shortcut identity instead. Ross derives the identity from the definition rather than
        presenting it as an alternative formula, which is worth seeing once so that the shortcut is a
        theorem you can reconstruct rather than a rule you hope you remember. §4.4 is the general expectation-of-a-function
        rule that L06's transformations node needs; §4.10 gives the CDF its own properties list.
      vault_path: material://source-ross-first-course/ross.pdf
    - id: route-3bd7fda1a5087e4bff5edfbb
