  - source_id: source-bendersky-normal-equation
    role: derivation
    why: A short technical article deriving the normal equation from scratch, filling the one derivation
      gap in L03's regression sequence.
    priority: 5
    unit_routes:
    - id: route-869eeded8dda6eb8ab78ff9a
      unit_id: unit-m2-sad-l03
      title: Bendersky — derivation of the normal equation
      format: website
      depth: derivation
      scope: complementary
      locator: The complete article 'Derivation of the Normal Equation for linear regression' (eli.thegreenplace.net,
        2014); one calculus derivation, plus the author's follow-up post on the matrix derivatives it
        uses
      covers:
      - knowledge-sad-l03-multivariate
      - knowledge-sad-l03-simple-regression
      angle: Differentiates the matrix squared-error objective to obtain the normal equations.
      angle_detail: Follow the expansion of the squared norm, differentiate with respect to the parameter
        vector and set the gradient to zero. The inverse formula assumes XᵀX is invertible. This is a
        matrix-calculus derivation; it does not supply the orthogonal-projection proof.
      url: https://eli.thegreenplace.net/2014/derivation-of-the-normal-equation-for-linear-regression/
