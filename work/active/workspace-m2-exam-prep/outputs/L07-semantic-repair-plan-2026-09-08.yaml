        Forests Part 1 — Building, Using and Evaluating''; ''AdaBoost, Clearly Explained'' (≈15-20 min
        each)'
      angle_detail: The tree video computes the impurity of each candidate split and picks the winner,
        on screen, which is the L12 exam calculation. The random-forest video then isolates the two changes
        from a single tree — bootstrap the rows, restrict the columns at each split — and shows out-of-bag
        evaluation falling out for free. Separating those two changes is what stops 'random forest' from
        being a black box. The AdaBoost video handles the reweighting visually.
    - id: route-bd195adc3fd5927a2d5b8428
