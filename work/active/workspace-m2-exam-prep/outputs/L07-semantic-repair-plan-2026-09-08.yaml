      title: 3Blue1Brown — Bayes' theorem and the medical-test paradox
      format: video
      angle: Turns the base-rate problem into an area picture, so the answer is seen before it is computed.
      covers:
      - knowledge-sad-l01-classification
      - knowledge-sad-l01-base-rates
      depth: intuition
      scope: complementary
      locator: '''Bayes theorem, the geometry of changing beliefs'' (≈15 min); ''The medical test paradox,
