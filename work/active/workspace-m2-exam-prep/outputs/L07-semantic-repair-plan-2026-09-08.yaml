      title: unser skript.pdf Kapitel 6 — the scope authority
      format: course-material
      angle: The longest chapter in the script, and the first with no current HU exercise sheet behind
        it at all.
      angle_detail: 'Two things govern this session. First, the chapter is really one theorem and its
        consequences: §6.3''s mean value theorem is what makes the derivative say anything about the function,
        and monotonicity, extrema, l''Hospital and Taylor all descend from it. Second, the practice situation
        changes here: the local HU set stops at §5.5, so every drill on this menu is a substitute chosen
        by topic rather than calibrated to this examiner. That has been an open, unowned gap since the
        2026-08-03 audit, and it is the reason this session leans harder on IngMath2 and the German exercise
        books than any earlier one.'
