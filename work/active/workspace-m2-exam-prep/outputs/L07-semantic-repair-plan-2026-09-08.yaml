      depth: orientation
      scope: complementary
      locator: '''Naive Bayes, Clearly Explained''; ''Gaussian Naive Bayes, Clearly Explained'' (≈15 min
        each); ''Logistic Regression'' only as a contrast'
      angle_detail: Moving from multinomial to Gaussian Naive Bayes means the likelihood stops being a
        proportion and becomes a density evaluation, and the resulting number is no longer a probability.
        That shift is where L14's numeric-attribute node loses people. The video draws the fitted Normal
        per class per feature and reads values off it, which makes the substitution concrete. Watch the
        categorical video first even if you have seen it for L04.
    - id: route-42d0090fddb4b47c5e23a43d
