  - source_id: source-dekking-mips
    role: practice
    why: Broad bank of answer-backed probability and statistics exercises.
    priority: 7
    unit_routes:
    - id: route-f081f68ca3fa4261de929984
      unit_id: unit-m2-sad-l01
      title: Dekking — descriptive review and answer-backed exercises
      format: exercise
      angle: Descriptive statistics presented after probability, so mean and variance arrive as estimates
        of distribution features rather than as summary formulas.
      covers:
      - knowledge-sad-l01-location
      - knowledge-sad-l01-distributions
      - knowledge-sad-l01-sampling-context
      depth: practice
      scope: complementary
      locator: 'Ch 16 Exploratory data analysis: numerical summaries, pdf pp. 238-250 (centre p. 238;
        variability p. 240; empirical quantiles and IQR p. 241; boxplot p. 243; exercises p. 247); Ch
        15 histograms pdf pp. 216-218; full solutions App D pdf pp. 443-471'
      angle_detail: 'Dekking deliberately places EDA in Ch 15-16, two thirds of the way through the book,
        and the consequence is a different reading of the same formulas L01 shows on slide one: the sample
        mean is introduced as an estimator of E[X], the sample variance as an estimator of Var(X). Coming
        back to this after L09 is one of the most useful re-reads in the module, because it retroactively
        explains why L01''s descriptive tools were worth defining. On a first pass through L01, use it
        only for the exercises — the framing will not land yet.'
      vault_path: material://source-dekking-mips/dekking.pdf
