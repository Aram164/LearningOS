    - id: route-f6444d2615cac483d2060e85
      unit_id: unit-m2-sad-l08
      title: Blitzstein Chapters 5 and 10 — continuous variables and CLT
      format: book
      angle: Puts the LLN and the CLT in one chapter with the inequalities that bound them, so the two
        limit theorems are compared rather than met separately.
      covers:
      - knowledge-sad-l08-normal
      - knowledge-sad-l08-transform-sum
      - knowledge-sad-l08-clt
      depth: intuition
      scope: complementary
      locator: Ch 5 §5.1 probability density functions, pdf pp. 230-236; §5.4 Normal, pdf pp. 248-254;
        Ch 10 §10.1 inequalities, pdf pp. 475-483; §10.2 law of large numbers, pdf pp. 484-487; §10.3
        central limit theorem, pdf pp. 488-493; exercises §10.7 pdf pp. 503-513
      angle_detail: 'The single most common L08 misconception is that the CLT is a stronger version of
        the LLN. Ch 10 makes them adjacent sections making visibly different claims — the LLN about where
        the sample mean goes, the CLT about the shape of its fluctuation around that point — and the proximity
        does the teaching. §10.1 supplies Markov, Chebyshev and Jensen with proofs, which is where L06''s
        concentration node also points. §5.4 derives the standardisation identity rather than asserting
        it. No likelihood content: for L08''s MLE half use Dekking Ch 21.'
