        pdf pp. 453-574)
      angle_detail: L15 derives the gradients by hand for a small network. Murphy names the general algorithm
        that generalises it and explains why the reverse sweep is the efficient direction when there are
        many parameters and one scalar loss. That connection between the hand derivation and what PyTorch
        does is worth having, especially given the thesis workstream. Well beyond exam scope.
      vault_path: material://source-murphy-pml1/pml1.pdf
