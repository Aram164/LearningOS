      - knowledge-sad-l06-expectation
      - knowledge-sad-l06-variance-covariance
      - knowledge-sad-l06-concentration
      depth: advanced-reference
      scope: complementary
      locator: Ch 9 Basic rules for discrete random variables, pdf pp. 275-295; Ch 10 §§10.1-10.3 Continuous
        random variables, pdf pp. 296-324; Ch 11 §11.4 Covariance and correlation coefficient, pdf pp.
        325-342
      angle_detail: 'The chapter title is literal: the rules are enumerated and each is checked by a simulation
        whose code and output are shown. For a lecture whose content is a small set of algebraic identities
        (linearity, variance of a scaled variable, variance of a sum under independence), seeing each
        one confirmed numerically is a strong antidote to misremembering which of them needs independence.
        §11.4 gives covariance with the correlation coefficient bounded in [-1,1] and proved.'
      vault_path: material://source-tijms-understanding-probability/tijms.pdf
    - id: route-3d9cb15592efe429e13918f5
      unit_id: unit-m2-sad-l07
      title: Tijms — discrete-distribution modeling examples
      format: book
      angle: Ch 4 is an entire chapter of rare-event modelling — the Poisson's natural habitat — before
        the distribution is ever defined formally.
      covers:
      - knowledge-sad-l07-model-selection
      - knowledge-sad-l07-bernoulli-binomial
      - knowledge-sad-l07-hypergeometric
      - knowledge-sad-l07-geometric
      - knowledge-sad-l07-poisson
      depth: advanced-reference
      scope: complementary
      locator: Ch 9 Basic rules for discrete random variables, pdf pp. 275-295; Ch 4 Rare events and lotteries,
        pdf pp. 115-152
      angle_detail: Lottery coincidences, near-misses and clusters, worked out with counts and simulations.
        It is the most convincing answer available to why the Poisson deserves its own model rather than
        being a Binomial special case, which is what L07's model-selection node needs you to have internalised.
        Read it for the modelling judgment, not for formulas — the formal statements are in Ch 9.
      vault_path: material://source-tijms-understanding-probability/tijms.pdf
    - id: route-da63f6bf53a890934f68330a
      unit_id: unit-m2-sad-l08
      title: Tijms — LLN and CLT intuition
      format: book
      angle: Demonstrates the CLT by simulation across several different starting distributions, so the
        universality claim is seen rather than asserted.
      covers:
      - knowledge-sad-l08-clt
      - knowledge-sad-l08-approximation
      depth: advanced-reference
      scope: complementary
      locator: Ch 5 Probability and statistics, pdf pp. 153-217 (§5.8 the central limit theorem and random
        walks); Ch 10 §10.2 Important probability densities, pdf pp. 296-324
      angle_detail: The striking part of the CLT is that the starting distribution does not matter, and
        that is exactly the part a formula cannot convey. Tijms runs the same averaging experiment on
        visibly different distributions and shows the same Normal shape emerging each time. §5.9 on Benford's
        law and §5.10 are outside SaD scope but are short and make the point that a limit theorem is a
        claim about the world. No likelihood content.
      vault_path: material://source-tijms-understanding-probability/tijms.pdf
