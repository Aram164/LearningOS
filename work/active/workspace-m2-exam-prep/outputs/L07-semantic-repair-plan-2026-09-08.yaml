      unit_id: unit-m2-sad-exam-prep
      title: Blitzstein — conditioning and strategic counting
      format: book
      angle: Supplies story-based intuition for Bayes and the order/repetition counting decisions without
        becoming a second probability course.
      covers:
      - knowledge-sad-exam-probability
      depth: intuition
      scope: complementary
