    - id: route-da4850b15834791b4688a767
      unit_id: unit-m2-sad-l10
      title: ISLP Ch 13 - the multiple-testing slide worked out with labs and exercises
      format: book
      angle: L10's closing slides name family-wise error and false discoveries and stop; this chapter
        separates the two error-management questions, gives Bonferroni and Holm for FWER and Benjamini-Hochberg
        for FDR, and ends with a lab and exercise set - the only registered practice for the node.
      covers:
      - knowledge-sad-l10-multiple
      depth: practice
      scope: complementary
      locator: Chapter 13, pp. 563-602 (false discovery rate p. 564; family-wise error rate p. 571; Bonferroni
        and Holm p. 573; Benjamini-Hochberg p. 581; lab section 13.6 p. 589; exercises section 13.7 p.
        599)
      angle_detail: 'The most complete multiple-testing treatment on the shelf, and L10''s multiplicity
        node is one slide. The page map matters: family-wise error rate (p. 571) and Bonferroni/Holm (p.
        573) are the conservative classical corrections; false discovery rate (p. 564) and Benjamini-Hochberg
        (p. 581) are the modern alternative that controls a different quantity entirely. Understanding
        that FWER and FDR are different targets — not competing approximations of one target — is the
        conceptual point, and it is the kind of distinction a written exam question can turn on. Lab at
        p. 589, exercises at p. 599.'
      vault_path: material://source-islp/islp.pdf
    - id: route-24878d8caf588583f067be1c
      unit_id: unit-m2-sad-l09
      title: ISLP 5.2 - the bootstrap as a resampling estimate of standard error
      format: book
      angle: L09 introduces the bootstrap as a way to quantify uncertainty without a formula; this section
        builds the resampled standard error on a concrete estimator and then repeats it in a lab, which
        is the arithmetic the deck asserts.
      covers:
      - knowledge-sad-l09-bootstrap
      depth: practice
      scope: complementary
      locator: Section 5.2 the bootstrap, pp. 220-223; lab section 5.3, pp. 223-231; exercises section
        5.4, p. 232
      angle_detail: §5.2 (pp. 220-223) states the bootstrap in three pages with the resampling diagram,
        then the lab (pp. 223-231) runs it in code on a real estimator so the sampling distribution is
        produced rather than described. L09 presents the bootstrap as a procedure; seeing the resampled
        estimates accumulate into a histogram is what makes the standard-error claim believable. Exercises
        at p. 232. Read Dekking Ch 18 first for the principle, then this for the execution.
      vault_path: material://source-islp/islp.pdf
