      - knowledge-sad-l06-random-variable
      - knowledge-sad-l06-expectation
      - knowledge-sad-l06-variance-covariance
      - knowledge-sad-l06-sample-mean
      depth: orientation
      scope: complementary
      locator: Ch 3 §3.4 random variables, pdf pp. 115-124; §3.5 continuous distributions, pdf pp. 125-130
      angle_detail: '§3.4 defines E[X] by working out the expected revenue of a lottery-like setup and
        then naming the computation, which makes the linearity property feel like an accounting fact.
        That is a lighter entry than Blitzstein''s Ch 4 and enough for L06''s expectation node, but it
        stops well short: no LOTUS, no covariance, no Chebyshev. Use it to get started and switch to Blitzstein
        or Dekking for the transformation and concentration nodes.'
      vault_path: material://source-openintro-statistics/openintro.pdf
    - id: route-64c6506fd426173a5b124d5a
      unit_id: unit-m2-sad-l07
      title: OpenIntro Chapter 4 — common distributions
      format: book
      angle: Each distribution gets a stated checklist of conditions before its formula, which is the
        exact form of L07's model-selection question.
      covers:
      - knowledge-sad-l07-model-selection
      - knowledge-sad-l07-bernoulli-binomial
      - knowledge-sad-l07-poisson
      depth: orientation
      scope: complementary
      locator: Ch 4 §4.2 geometric distribution, pdf pp. 144-148; §4.3 binomial distribution, pdf pp.
        149-157; §4.4 negative binomial, pdf pp. 158-162; §4.5 Poisson distribution, pdf pp. 163-167
      angle_detail: §4.3 opens with four numbered conditions a situation must satisfy for a binomial model
        to apply, and the later sections follow the same pattern. L07's model-selection node is asking
        precisely for that checklist, and having it in list form is more usable under exam pressure than
        a prose description. Hypergeometric is thin here (it lives in §3.3 as 'sampling from a small population')
        — Fahrmeir §5.3 or Blitzstein §3.4 covers it properly.
      vault_path: material://source-openintro-statistics/openintro.pdf
    - id: route-ca94fdcfeca67be1c4c0bc4d
      unit_id: unit-m2-sad-l08
      title: OpenIntro Chapter 4 — Normal and sampling distributions
      format: book
      angle: Builds the CLT out of a simulation the reader can picture — repeated samples, one histogram
        of their means — before any statement of the theorem.
      covers:
      - knowledge-sad-l08-normal
      - knowledge-sad-l08-standardization
      - knowledge-sad-l08-clt
      - knowledge-sad-l08-approximation
      depth: orientation
      scope: complementary
      locator: Ch 4 §4.1 normal distribution, pdf pp. 133-143 (Z-scores, percentiles, 68-95-99.7 rule);
        Ch 5 §5.1 point estimates and sampling variability, pdf pp. 170-180 (the sampling distribution
        of the mean and the CLT statement)
      angle_detail: §5.1 shows the sampling distribution being constructed by repetition, so 'the distribution
        of the sample mean' becomes a concrete object rather than a phrase. That picture is what makes
        the standard error formula in L09 obviously about a distribution of means rather than of data.
        §4.1 drills z-score conversion in both directions with a table, which is the mechanical L08 skill.
        No likelihood content and no proof of the CLT — deliberately, since the course does not need one.
      vault_path: material://source-openintro-statistics/openintro.pdf
    - id: route-c53fea2ffaf7c83506f57ba8
      unit_id: unit-m2-sad-l09
      title: OpenIntro Chapter 5 — confidence intervals
      format: book
      angle: Introduces confidence intervals on a proportion first, where the standard error has no nuisance
        parameter to estimate.
      covers:
      - knowledge-sad-l09-standard-error
      - knowledge-sad-l09-z-interval
      - knowledge-sad-l09-t-interval
      depth: orientation
      scope: complementary
      locator: Ch 5 §5.1 point estimates and sampling variability, pdf pp. 170-180; §5.2 confidence intervals
        for a proportion, pdf pp. 181-188; Ch 7 §7.1 one-sample means with the t-distribution, pdf pp.
        251-261
      angle_detail: By starting with a proportion, §5.2 gets to a complete interval before the reader
        has to deal with an unknown sigma, so the interpretation of 'confident' can be discussed on its
        own. Then §7.1 introduces the t-distribution specifically as the correction needed once sigma
        is estimated — which is exactly the z-versus-t decision L09 asks you to make, presented as a consequence
        rather than a rule. The repeated-interval simulation picture in §5.2 is also the standard defence
        against the classic misinterpretation the exam likes to test.
      vault_path: material://source-openintro-statistics/openintro.pdf
    - id: route-335f1041911c33391d4a59b8
      unit_id: unit-m2-sad-l10
      title: OpenIntro Chapters 5–7 — tests by data type
      format: book
      angle: Teaches the p-value through randomisation before any reference distribution appears, and
        has the only real power section on the shelf.
      covers:
      - knowledge-sad-l10-test-model
      - knowledge-sad-l10-tails-pvalue
      - knowledge-sad-l10-z-t
      - knowledge-sad-l10-chi-square
      depth: orientation
      scope: complementary
      locator: Ch 5 §5.3 hypothesis testing for a proportion, pdf pp. 189-205; Ch 6 §6.3 testing for goodness
        of fit using chi-square, pdf pp. 229-239; §6.4 testing for independence in two-way tables, pdf
        pp. 240-248; Ch 7 §7.1 one-sample means with the t-distribution, pdf pp. 251-261; §7.4 power calculations,
        pdf pp. 278-284
      angle_detail: '§5.3 builds the null distribution by shuffling the data — the malaria-vaccine simulation
        from Ch 2 — so a p-value is first seen as a proportion of shuffles at least as extreme as the
        observed result. Once that is concrete, the z and t reference distributions are recognisable as
        shortcuts for the same quantity. §7.4 then does what almost nothing else here does: computes power
        and required sample size explicitly, rather than defining power and moving on. §§6.3-6.4 cover
        both chi-square variants that L10 names.'
      vault_path: material://source-openintro-statistics/openintro.pdf
  - source_id: source-sklearn-user-guide
    role: implementation
    why: The scikit-learn user guide — the reference that names, in code, every algorithm SaD L11-L15
      teaches.
    priority: 6
    unit_routes:
    - id: route-0572fd5f6c01003faa8226d6
      unit_id: unit-m2-sad-l11
      title: scikit-learn user guide §3.1 — cross-validation
      format: documentation
      depth: implementation
      scope: complementary
      locator: 'User guide §3.1 ''Cross-validation: evaluating estimator performance'' and §3.4 ''Metrics
        and scoring'', with the linked examples'
      covers:
      - knowledge-sad-l11-resampling
      - knowledge-sad-l11-evaluation
      angle: Enumerates the resampling schemes as named, runnable splitters — KFold, StratifiedKFold,
        GroupKFold — with the situation each exists for.
      angle_detail: 'L11 names cross-validation as one idea. The user guide shows it is a family, and
        each member exists because of a specific failure: stratified splits for class imbalance, group
        splits when observations are not independent, time-series splits when order matters. Knowing that
        the plain version has failure modes is the conceptual content; the diagrams in §3.1 make the differences
        immediate.'
    - id: route-0f00ed6b65da6c9fdd94757f
      unit_id: unit-m2-sad-l12
      title: scikit-learn user guide §1.10 and §1.11 — trees and ensembles
      format: documentation
      depth: implementation
      scope: complementary
      locator: 'User guide §1.10 ''Decision Trees'' (including §1.10.7 mathematical formulation of the
        impurity criteria) and §1.11 ''Ensembles: Gradient boosting, random forests, bagging, voting,
        stacking'''
      covers:
      - knowledge-sad-l12-tree-model
      - knowledge-sad-l12-entropy-id3
      - knowledge-sad-l12-pruning
      - knowledge-sad-l12-bagging-forest
      - knowledge-sad-l12-boosting
      - knowledge-sad-l12-stacking
      angle: States the impurity criteria as formulas beside the parameter that selects them, tying L12's
        theory directly to a knob.
      angle_detail: §1.10.7 writes out the Gini and entropy criteria and the regression variance criterion,
        and the surrounding text explains what each pruning parameter (max_depth, min_samples_leaf, ccp_alpha)
        does to the resulting tree. That mapping from concept to parameter is a strong memory aid, and
        §1.11 does the same for all four ensemble families L12 names — including stacking, which most
        books skip.
    - id: route-147346e35bd5be019bdccd69
      unit_id: unit-m2-sad-l13
      title: scikit-learn user guide §1.6 — nearest neighbours and search structures
      format: documentation
      depth: implementation
      scope: complementary
      locator: 'User guide §1.6.4 ''Nearest Neighbor Algorithms'': §1.6.4.2 K-D Tree; §1.6.4.3 Ball Tree;
        algorithm-choice discussion in §1.6.4'
      covers:
      - knowledge-sad-l13-neighbors
      - knowledge-sad-l13-aggregation
      - knowledge-sad-l13-metrics
      - knowledge-sad-l13-exact-indexing
      angle: Explains exact search structures and the practical conditions favoring tree search or brute
        force.
      angle_detail: The official guide describes KD-tree and ball-tree pruning, then compares algorithm
        choices by data size, dimension and query workload. Use this implementation perspective alongside
        Kelleher's kd-tree explanation. Section numbering checked against the official guide on 2026-09-07.
      url: https://scikit-learn.org/stable/modules/neighbors.html#nearest-neighbor-algorithms
    - id: route-d7cf7c94fb31a1141d0c7aab
      unit_id: unit-m2-sad-l14
      title: scikit-learn user guide §1.9 — naive Bayes variants
      format: documentation
      depth: implementation
      scope: complementary
      locator: 'User guide §1.9 ''Naive Bayes'': §1.9.1 Gaussian, §1.9.2 Multinomial, §1.9.3 Complement,
        §1.9.4 Bernoulli, §1.9.5 Categorical'
      covers:
      - knowledge-sad-l14-nb-recap
      - knowledge-sad-l14-smoothing
      - knowledge-sad-l14-numeric
      - knowledge-sad-l14-gaussian
      - knowledge-sad-l14-multinomial
      angle: Lists all five variants side by side with the data type each assumes — the cleanest statement
        of what changes between them.
      angle_detail: 'L14 covers the Gaussian and multinomial variants and mentions that others exist.
        Seeing all five in one table makes the pattern explicit: the classifier is fixed and only the
        likelihood term changes with the feature type. Once that is clear, the variants stop being separate
        algorithms to memorise. The smoothing parameter alpha is documented alongside, with the default
        and its effect.'
  - source_id: source-strang-calculus
    role: intuition
    why: Local gentle calculus chapters support Taylor and Riemann-integral intuition when video is unnecessary.
    priority: 6
    unit_routes:
    - id: route-an-ch05-strangcalculus
      unit_id: unit-m2-analysis-ch05
      title: Strang Ch 2.6-2.7 and Ch 6 — limits, continuity, exp and log
      format: book
      angle: 'Applied-first intuition: Strang reaches limits only after using them, which is the opposite
        of the script''s order and occasionally the more memorable one.'
      angle_detail: Strang puts limits in §2.6 — after two chapters of derivatives — precisely because
        he thinks the definition is easier once you have needed it. That makes this a reserve route rather
        than a parallel text, useful when the formal definition has been read several times without landing.
        Chapter 6 is the applied account of exp and log for §5.6.
      covers:
      - knowledge-m2-analysis-ch05-funktionsgrenzwerte
      - knowledge-m2-analysis-ch05-stetigkeit
      - knowledge-m2-analysis-ch05-exponentialfunktion
      depth: intuition
      scope: complementary
      locator: mitres_18_001_f17_ch02.pdf §2.6 Limits p. 123, §2.7 Continuous Functions p. 131; mitres_18_001_f17_ch06.pdf
        Exponentials and Logarithms (§6.2 The Exponential e^x p. 292, §6.4 Logarithms p. 310); matching
        guide_ch02.pdf and guide_ch06.pdf are secondary
    - id: route-an-ch06-strangcalculus
      unit_id: unit-m2-analysis-ch06
      title: Strang Ch 2-4 and §10.4 — derivatives, the MVT with l'Hôpital, the Taylor series
      format: book
      angle: Applied-first intuition, with §3.8 putting the mean value theorem and l'Hôpital in the same
        section — as consequence and application.
      angle_detail: 'Strang''s arrangement makes an argument the script leaves implicit: l''Hôpital is
        a corollary of the mean value theorem, and putting them in one section says so. §10.4 develops
        the Taylor series for the three functions it is usually wanted for. Reserve intuition, chosen
        per diagnosed block.'
      covers:
      - knowledge-m2-analysis-ch06-differenzierbarkeit
      - knowledge-m2-analysis-ch06-mittelwertsatz
      - knowledge-m2-analysis-ch06-trigonometrie
      - knowledge-m2-analysis-ch06-hospital
      - knowledge-m2-analysis-ch06-hoehere-ableitungen
      - knowledge-m2-analysis-ch06-taylor
      - knowledge-m2-analysis-ch06-interpolation
      depth: intuition
      scope: complementary
      locator: mitres_18_001_f17_ch02.pdf Derivatives (§2.1 The Derivative of a Function p. 87, §2.5 The
        Product and Quotient and Power Rules p. 116); mitres_18_001_f17_ch03.pdf Applications of the Derivative
        (§3.2 Maximum and Minimum Problems p. 143, §3.8 The Mean Value Theorem and l'Hôpital's Rule p.
        197); mitres_18_001_f17_ch04.pdf Derivatives by the Chain Rule (§4.3 Inverse Functions and Their
        Derivatives p. 216); mitres_18_001_f17_ch10.pdf §10.4 The Taylor Series for e^x, sin x, and cos
        x p. 452; matching guide_chNN.pdf are secondary
    - id: route-an-ch07-strangcalculus
      unit_id: unit-m2-analysis-ch07
      title: Strang Ch 5 and Ch 7 — Integrals and Techniques of Integration
      format: book
      angle: The two chapters the 2026-08-03 audit marked `selected` out of the whole Strang bundle —
        applied-first intuition for the chapter where it works best.
      angle_detail: 'Only chapters 5, 7 and 10 of Strang were selected; the rest of the bundle is reserve
        or multivariable and out of scope. §5.3 ''Summation versus Integration'' is the section worth
        the detour: it sets the Riemann sum against the finite sum explicitly, which is what makes §7.1''s
        partitions read as an approximation being refined rather than as notation.'
      covers:
      - knowledge-m2-analysis-ch07-riemann-integral
      - knowledge-m2-analysis-ch07-hauptsatz
      - knowledge-m2-analysis-ch07-uneigentliche-integrale
      depth: intuition
      scope: complementary
      locator: mitres_18_001_f17_ch05.pdf Integrals (§5.1 The Idea of the Integral p. 229, §5.3 Summation
