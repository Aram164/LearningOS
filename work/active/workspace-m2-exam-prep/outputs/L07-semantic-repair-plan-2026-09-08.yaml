      title: Geron Ch 1 - the ML vocabulary with failure cases attached
      format: book
      angle: L11 states supervised/unsupervised, over- and underfitting and the train/test split in single
        bullets; Geron spends thirty pages on that same vocabulary with concrete data-quality and sampling
        failures, so each term Leser asserts arrives with a worked counterexample.
      covers:
      - knowledge-sad-l11-tasks
      - knowledge-sad-l11-representation
      - knowledge-sad-l11-generalization
      depth: intuition
      scope: complementary
