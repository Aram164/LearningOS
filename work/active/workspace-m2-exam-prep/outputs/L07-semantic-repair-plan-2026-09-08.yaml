      angle_detail: L02 draws histograms and moves on. §15.4 introduces the empirical distribution function
        Fn and states that it converges to the true F — the formal content of the intuition that a bigger
        sample gives a better picture. That single idea is what later makes the bootstrap in L09 comprehensible
        rather than magical, so reading it now pays twice. §15.3 on kernel density estimates is outside
        SaD scope; skim it as context for why smoothed histograms exist.
      vault_path: material://source-dekking-mips/dekking.pdf
