      locator: §3.1.1, PDF pp. 80–82; §3.2–3.2.1, pp. 89–92; §3.3.3, pp. 109–117
      angle_detail: The newspaper coefficient changes after accounting for correlated radio spending.
        The same chapter explains residual plots, outliers, leverage and collinearity. Use coefficient
        estimation and interpretation now; the standard-error, t-test and interval sections are a later
        inference bridge. These references use physical PDF pages, not printed page numbers.
      vault_path: material://source-islp/islp.pdf
    - id: route-15a92bbc0ec66bf68eb86eac
      unit_id: unit-m2-sad-l11
      title: ISLP Chapter 2 — statistical-learning workflow
      format: book
      angle: Derives the bias-variance decomposition algebraically, which L11 states as a picture of two
        curves crossing.
      covers:
      - knowledge-sad-l11-tasks
      - knowledge-sad-l11-resampling
      - knowledge-sad-l11-objectives
      - knowledge-sad-l11-generalization
      depth: derivation
      scope: complementary
      locator: Ch 2 Statistical Learning, pdf pp. 25-77 (§2.1 what is statistical learning p. 26; §2.2
        assessing model accuracy, with the bias-variance decomposition, p. 37; §2.3 lab p. 48)
      angle_detail: §2.2 shows the expected test error splitting into three named terms — squared bias,
        variance and irreducible error — and the derivation is short enough to follow at first reading.
        That is the content behind L11's U-shaped test-error curve, and having the algebra makes the trade-off
        a consequence rather than an empirical observation. The chapter also draws the distinction between
        prediction and inference as two different reasons to fit a model, which reframes what the pipeline
        is for.
      vault_path: material://source-islp/islp.pdf
    - id: route-6b5698803acbdbd638a146b6
      unit_id: unit-m2-sad-l12
      title: ISLP §§8.1–8.2 — trees and ensembles
      format: book
      angle: Separates the two reasons ensembles help — variance reduction by averaging, bias reduction
        by sequential fitting — instead of listing methods.
      covers:
      - knowledge-sad-l12-tree-model
      - knowledge-sad-l12-regression
      - knowledge-sad-l12-pruning
      - knowledge-sad-l12-bagging-forest
      - knowledge-sad-l12-boosting
      depth: derivation
      scope: complementary
      locator: Ch 8 Tree-Based Methods, pdf pp. 338-372 (§8.1 the basics of decision trees p. 339; §8.2
        bagging, random forests, boosting and BART p. 351; Ch 8 lab p. 361)
      angle_detail: 'L12 presents bagging, random forests, boosting and stacking as a family of techniques.
        ISLP organises the same material around the mechanism: bagging and forests reduce variance by
        averaging decorrelated trees, boosting reduces bias by fitting each tree to the residual of the
        last. Once that split is clear, the differences between the methods stop being arbitrary details.
        §8.2 also explains why random forests decorrelate by restricting the feature subset, which the
        deck asserts.'
      vault_path: material://source-islp/islp.pdf
    - id: route-933228d740dc54b3653e1190
      unit_id: unit-m2-sad-l14
      title: ISLP §4.4.4 and lab — Naive Bayes in application
      format: book
