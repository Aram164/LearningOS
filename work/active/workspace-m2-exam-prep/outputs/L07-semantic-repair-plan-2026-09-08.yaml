      url: https://www.youtube.com/playlist?list=PLk4N6AFvLWe3xCHuOs0siWp0q2F43Cslh
      angle_detail: L01 introduces base rates through a medical-test example and asserts the counterintuitive
        answer. The first video builds a rectangle whose areas are the four cells of the joint distribution,
        and the posterior becomes a visible ratio of two areas — at which point the answer stops being
        surprising. The second video is the medical-test case itself and argues for thinking in odds and
        Bayes factors, which is a genuinely different representation from the lecture's. Watch before
        the algebra in L04, not after.
