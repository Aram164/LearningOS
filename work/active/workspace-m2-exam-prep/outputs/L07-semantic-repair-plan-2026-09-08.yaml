    - id: route-an-ch02-leblbasicanalysis
      unit_id: unit-m2-analysis-ch02
      title: Lebl — Real Numbers
      format: book
      angle: The free English text whose section order tracks the script most closely — the structural
        second reading.
      angle_detail: 'Lebl builds R in the same sequence the script does: ordered field, then bounded sets
        and suprema, then completeness, then absolute value and intervals. That makes it useful in a way
        Abbott is not — you can read a script section and its Lebl counterpart side by side and the arguments
        line up. Volume II (realanal2.pdf) is multivariable and out of scope entirely.'
      covers:
      - knowledge-m2-analysis-ch02-koerperaxiome
      - knowledge-m2-analysis-ch02-anordnung
      - knowledge-m2-analysis-ch02-intervalle-betrag
      - knowledge-m2-analysis-ch02-supremum-infimum
      - knowledge-m2-analysis-ch02-vollstaendigkeitsaxiom
      - knowledge-m2-analysis-ch02-folgerungen
      - knowledge-m2-analysis-ch02-potenzen-wurzeln
      depth: derivation
      scope: complementary
      locator: 'realanal.pdf ''Real Numbers'' p. 23: Basic properties p. 23, The set of real numbers p.
        29, Absolute value and bounded functions p. 36, Intervals and the size of R p. 41'
      vault_path: material://source-lebl-basic-analysis/realanal.pdf
    - id: route-an-ch03-leblbasicanalysis
      unit_id: unit-m2-analysis-ch03
      title: Lebl — Sequences and Series
      format: book
      angle: The structural twin of the script's §§3.5-3.7, in English, free, and with the same ordering.
      angle_detail: 'Where Abbott motivates, Lebl mirrors: the four sections listed here correspond almost
        exactly to the script''s convergence criteria, limit arithmetic, subsequences and Cauchy material,
        in that order. That makes it the route for a second pass over the same argument rather than a
        different account of it — useful when a script proof is followable but not yet reconstructable.'
      covers:
      - knowledge-m2-analysis-ch03-folgen
      - knowledge-m2-analysis-ch03-konvergenzkriterien
      - knowledge-m2-analysis-ch03-rechenregeln
      - knowledge-m2-analysis-ch03-bestimmte-divergenz
      depth: derivation
      scope: complementary
      locator: 'realanal.pdf ''Sequences and Series'' p. 51: Sequences and limits p. 51, Facts about limits
        of sequences p. 61, Limit superior, limit inferior, and Bolzano–Weierstrass p. 73, Cauchy sequences
        p. 84'
      vault_path: material://source-lebl-basic-analysis/realanal.pdf
    - id: route-an-ch04-leblbasicanalysis
      unit_id: unit-m2-analysis-ch04
      title: Lebl — Series and More on series
      format: book
      angle: 'The structural twin again: criteria in the same order as §4.2, in English, free.'
      angle_detail: Used the same way as on Chapter 3 — a second pass over the same argument rather than
        a different account. Its 'More on series' section carries absolute convergence and rearrangement,
        matching §4.3-§4.4.
      covers:
      - knowledge-m2-analysis-ch04-reihen
      - knowledge-m2-analysis-ch04-konvergenzkriterien
      - knowledge-m2-analysis-ch04-absolute-konvergenz
      depth: derivation
      scope: complementary
      locator: realanal.pdf Series p. 87, More on series p. 100 (inside 'Sequences and Series' p. 51)
      vault_path: material://source-lebl-basic-analysis/realanal.pdf
    - id: route-an-ch05-leblbasicanalysis
      unit_id: unit-m2-analysis-ch05
      title: Lebl — Continuous Functions and Sequences of Functions
      format: book
      angle: Section for section the closest structural match to §§5.1-5.5 and §5.7 anywhere on this menu.
      angle_detail: Six subsections that correspond to the script's five, in the same order, plus a separate
        chapter for uniform convergence whose first section is precisely §5.7 and whose second names what
        uniform convergence is *for* — interchanging limits. That framing is missing from the script's
        two pages and is the thing that makes the distinction memorable.
