    - id: route-dd5f555433ae41e4cd19802b
      unit_id: unit-m2-sad-l15
      title: 3Blue1Brown — the chain rule, which is all backpropagation is
      format: video
      depth: intuition
      scope: prerequisite
      locator: Essence of Calculus episode 4 ('Visualizing the chain rule and product rule')
      covers:
      - knowledge-sad-l15-backprop
      angle: Makes the chain rule a statement about how one small nudge propagates, which is exactly the
        quantity backpropagation computes.
      angle_detail: Backpropagation is the chain rule applied repeatedly, so if the chain rule is a symbolic
        manipulation rather than a claim about how a change in one quantity affects another downstream,
        the derivation cannot mean anything. This episode fixes that in fifteen minutes, and it is the
        natural companion to the neural-network playlist's episode 4, which assumes it.
    - id: route-an-ch05-3b1bessenceofcalculus
      unit_id: unit-m2-analysis-ch05
      title: 3Blue1Brown — the limits episode
      format: video
      angle: A short visual preview for when the *picture* of a limit is missing, not the technique.
      angle_detail: Ten to fifteen minutes, watched once, before rather than instead of the script. It
        shows the ε-δ picture geometrically, which is the one thing a written definition cannot do. It
        is not a source of rigour and should never be the thing an exam answer is reconstructed from.
        The l'Hôpital half of the same episode belongs to Chapter 6.
      covers:
      - knowledge-m2-analysis-ch05-funktionsgrenzwerte
      - knowledge-m2-analysis-ch05-einseitige-grenzwerte
      depth: intuition
      scope: complementary
      locator: 'Chapter 7, Essence of calculus: ''Limits, L''Hôpital''s rule, and epsilon delta definitions'''
    - id: route-an-ch06-3b1bessenceofcalculus
      unit_id: unit-m2-analysis-ch06
      title: 3Blue1Brown — the derivative, chain rule and Taylor series episodes
      format: video
      angle: The Taylor episode in particular gives the picture — successive derivatives matching at a
        point — that the formula alone does not.
      angle_detail: 'Short, watched once, before the script rather than instead of it. The Taylor episode
        is the one worth the time on this chapter: §6.8 introduces the polynomial and the remainder as
        formulas, and the visual account of why matching derivatives at a point produces a good local
        approximation is the missing motivation. No rigour, and nothing here should be reconstructed into
        an exam answer.'
      covers:
      - knowledge-m2-analysis-ch06-differenzierbarkeit
      - knowledge-m2-analysis-ch06-mittelwertsatz
      - knowledge-m2-analysis-ch06-trigonometrie
      - knowledge-m2-analysis-ch06-hospital
      - knowledge-m2-analysis-ch06-hoehere-ableitungen
      - knowledge-m2-analysis-ch06-taylor
      - knowledge-m2-analysis-ch06-interpolation
      depth: intuition
      scope: complementary
      locator: Chapter 2 'The paradox of the derivative'; Chapter 4 'Chain rule and product rule'; Chapter
        7 'Limits, L'Hôpital's rule, and epsilon delta definitions'; Chapter 11 'Taylor series'
    - id: route-an-ch07-3b1bessenceofcalculus
      unit_id: unit-m2-analysis-ch07
      title: 3Blue1Brown — integration and the fundamental theorem
      format: video
      angle: The visual argument for why differentiation and integration are inverse — the claim §7.2
        states and does not motivate.
      angle_detail: Fifteen minutes, watched once, before the script. The fundamental theorem is the single
        most surprising statement in the module and the one most often held as a rule rather than understood;
        this is the cheapest available fix for that. No rigour, and not a source to reconstruct an answer
        from.
      covers:
      - knowledge-m2-analysis-ch07-riemann-integral
      - knowledge-m2-analysis-ch07-hauptsatz
      - knowledge-m2-analysis-ch07-uneigentliche-integrale
      depth: intuition
      scope: complementary
      locator: 'Chapter 8, Essence of calculus: ''Integration and the fundamental theorem of calculus'''
