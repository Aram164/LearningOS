      angle_detail: Compact but complete — the deck covers what many courses spread over two lectures.
        ID3's information-gain computation is the examinable calculation; the ensemble section is mostly
        conceptual comparison. Because bagging, random forests, boosting and stacking all arrive on the
        last slides, they are easy to blur; Géron Ch 7 treats each as a separate technique with its own
