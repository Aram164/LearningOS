  - source_id: source-abbott-understanding-analysis
    role: optional-depth
    why: Readable English rigor for one stubborn concept; never read linearly during exam preparation.
    priority: 15
    unit_routes:
    - id: route-an-ch02-abbottunderstandinganaly
      unit_id: unit-m2-analysis-ch02
      title: Abbott Ch 1 — The Real Numbers
      format: book
      angle: The most readable argument in the collection for *why* completeness has to be an axiom at
        all, opened by the irrationality of √2.
      angle_detail: Abbott opens each chapter with a discussion section whose only job is to make the
        coming definition feel necessary, and Chapter 1's is the gap in Q that √2 falls through. If the
        completeness axiom reads as an arbitrary extra rule, this is the twenty pages that fix that, and
        it is English written for undergraduates rather than for specialists. It is more rigour than this
        exam asks for, so it is a reference to enter for one blocked idea, not a parallel text to read
        through.
      covers:
      - knowledge-m2-analysis-ch02-supremum-infimum
      - knowledge-m2-analysis-ch02-vollstaendigkeitsaxiom
      - knowledge-m2-analysis-ch02-folgerungen
      depth: derivation
      scope: complementary
      locator: abbott.pdf §1.2 Some Preliminaries p. 18, §1.3 The Axiom of Completeness p. 27, §1.4 Consequences
        of Completeness p. 33 (§§1.5-1.6 cardinality and Cantor are past the script)
      vault_path: material://source-abbott-understanding-analysis/abbott.pdf
    - id: route-an-ch03-abbottunderstandinganaly
      unit_id: unit-m2-analysis-ch03
      title: Abbott Ch 2 — Sequences and Series
      format: book
      angle: The clearest available answer to why the ε-N definition has the shape it does, rather than
        how to apply it.
      angle_detail: 'Abbott''s §2.2 spends its pages on the logical structure of the definition — the
        order of the quantifiers, and why the game of ''given ε, produce N'' is the right formalisation
        of approaching a value. That is the specific thing that makes the definition finally readable
        for most people, and no drill sheet supplies it. Rule from its record, unchanged: one book per
        stuck idea, not a parallel course.'
      covers:
      - knowledge-m2-analysis-ch03-folgen
      - knowledge-m2-analysis-ch03-konvergenzkriterien
      - knowledge-m2-analysis-ch03-rechenregeln
      - knowledge-m2-analysis-ch03-bestimmte-divergenz
      depth: derivation
      scope: complementary
      locator: abbott.pdf §2.2 The Limit of a Sequence p. 54, §2.3 The Algebraic and Order Limit Theorems
        p. 61, §2.4 The Monotone Convergence Theorem p. 68, §2.5 Subsequences and Bolzano-Weierstrass
        p. 74, §2.6 The Cauchy Criterion p. 78 (§2.7 onward is series — Chapter 4's session)
      vault_path: material://source-abbott-understanding-analysis/abbott.pdf
    - id: route-an-ch04-abbottunderstandinganaly
      unit_id: unit-m2-analysis-ch04
      title: Abbott §2.7 Properties of Infinite Series and the rearrangement discussion
      format: book
      angle: The book opens its whole sequences-and-series chapter on the rearrangement paradox, which
        makes the absolute-convergence hypothesis feel earned rather than technical.
      angle_detail: Abbott's §2.1 shows a conditionally convergent series being rearranged to a different
        sum before any theory is developed, and then spends the chapter earning the right to explain it.
        For the script's §4.3-§4.4 that is the ideal order — the script states absolute convergence as
        a definition and rearrangement as an Ausflug, which leaves the connection available but not felt.
        Four pages of reading for the discussion; the rest as needed.
      covers:
      - knowledge-m2-analysis-ch04-absolute-konvergenz
      - knowledge-m2-analysis-ch04-umordnungen
      - knowledge-m2-analysis-ch04-konvergenzkriterien
      depth: derivation
      scope: complementary
      locator: 'abbott.pdf §2.1 Discussion: Rearrangements of Infinite Series p. 51, §2.7 Properties of
        Infinite Series p. 83, §2.8 Double Summations and Products of Infinite Series p. 91 (matches the
        §4.5 Exkurs)'
      vault_path: material://source-abbott-understanding-analysis/abbott.pdf
    - id: route-an-ch05-abbottunderstandinganaly
      unit_id: unit-m2-analysis-ch05
      title: Abbott Ch 4 — Functional Limits and Continuity, plus §6.2 uniform convergence
      format: book
      angle: Its chapter opens on the Dirichlet function — which is the function WV1.2 is built from.
      angle_detail: The alignment here is unusually direct. WV1.2 sets f(x) = x on Q and −x elsewhere,
        a Dirichlet-type construction, and asks where it is continuous; Abbott opens Chapter 4 with Dirichlet
        and Thomae for exactly the purpose of showing what continuity can and cannot look like. §4.4 (compact
        sets) and §4.5 (IVT) map onto §§5.4-5.5. §6.2 is the uniform-convergence route. One blocked idea
        at a time, as always.
      covers:
      - knowledge-m2-analysis-ch05-funktionsgrenzwerte
      - knowledge-m2-analysis-ch05-einseitige-grenzwerte
      - knowledge-m2-analysis-ch05-stetigkeit
      - knowledge-m2-analysis-ch05-zwischenwertsatz
      - knowledge-m2-analysis-ch05-kompakte-intervalle
      - knowledge-m2-analysis-ch05-exponentialfunktion
      - knowledge-m2-analysis-ch05-gleichmaessige-konvergenz
      depth: derivation
      scope: complementary
      locator: 'abbott.pdf §4.1 Discussion: Examples of Dirichlet and Thomae p. 122, §4.2 Functional Limits
        p. 126, §4.3 Continuous Functions p. 133, §4.4 Continuous Functions on Compact Sets p. 140, §4.5
        The Intermediate Value Theorem p. 147, §4.6 Sets of Discontinuity p. 152; §6.2 Uniform Convergence
        of a Sequence of Functions p. 183'
      vault_path: material://source-abbott-understanding-analysis/abbott.pdf
    - id: route-an-ch06-abbottunderstandinganaly
      unit_id: unit-m2-analysis-ch06
      title: Abbott Ch 5 and §6.6 — The Derivative, Taylor Series
      format: book
      angle: Its chapter opens by asking whether derivatives must be continuous — a question that makes
        the mean value theorem's role visible.
      angle_detail: Abbott's §5.1 discussion ('Are Derivatives Continuous?') sets up why the derivative
        is a more delicate object than the difference quotient suggests, and §5.3 then treats the mean
        value theorems as the answer. That is the framing the script's §6.3 states without motivating.
        §6.6 is a rigorous Taylor treatment — more than this exam needs, but it is one of the four Taylor
        routes available and the only one that proves the remainder estimate carefully.
      covers:
      - knowledge-m2-analysis-ch06-differenzierbarkeit
      - knowledge-m2-analysis-ch06-mittelwertsatz
      - knowledge-m2-analysis-ch06-hospital
      - knowledge-m2-analysis-ch06-hoehere-ableitungen
      - knowledge-m2-analysis-ch06-taylor
      depth: derivation
      scope: complementary
      locator: abbott.pdf §5.2 Derivatives and the Intermediate Value Property p. 159, §5.3 The Mean Value
        Theorems p. 166, §5.4 A Continuous Nowhere-Differentiable Function p. 173; §6.6 Taylor Series
        p. 207
      vault_path: material://source-abbott-understanding-analysis/abbott.pdf
    - id: route-an-ch07-abbottunderstandinganaly
      unit_id: unit-m2-analysis-ch07
      title: Abbott Ch 7 — The Riemann Integral
      format: book
      angle: Opens by asking what an integral should be before defining one — which is what makes upper
        and lower sums look inevitable rather than arbitrary.
      angle_detail: The script's §7.1 introduces partitions and upper/lower sums as machinery. Abbott's
        §7.1 discussion asks first what properties an integral ought to have, so the machinery arrives
        as an answer. §7.3 (functions with discontinuities) is the sharpest available treatment of which
        functions are integrable, which is the script's integrability criterion. One blocked idea at a
        time.
      covers:
      - knowledge-m2-analysis-ch07-riemann-integral
      - knowledge-m2-analysis-ch07-hauptsatz
      - knowledge-m2-analysis-ch07-uneigentliche-integrale
      depth: derivation
      scope: complementary
      locator: 'abbott.pdf §7.1 Discussion: How Should Integration be Defined? p. 224, §7.2 The Definition
        of the Riemann Integral p. 227, §7.3 Integrating Functions with Discontinuities p. 233, §7.4 Properties
        of the Integral p. 237, §7.5 The Fundamental Theorem of Calculus p. 243'
      vault_path: material://source-abbott-understanding-analysis/abbott.pdf
