      vault_path: material://source-esl/esl.pdf
    - id: route-1f6f29865621dc40da790e50
      unit_id: unit-m2-sad-l12
      title: ESL - the ensemble chapters behind the L12 summary slide
      format: book
      angle: 'Supplies the derivations the deck summarises in four bullets: why AdaBoost fits an additive
        model under exponential loss, what random forests do to variance, and the model-averaging view
        that stacking belongs to.'
      covers:
      - knowledge-sad-l12-tree-model
      - knowledge-sad-l12-bagging-forest
      - knowledge-sad-l12-boosting
      - knowledge-sad-l12-stacking
      depth: advanced-reference
      scope: optional
      locator: Section 9.2 tree-based methods, p. 324; section 8.8 model averaging and stacking, p. 307;
        Chapter 10 boosting and additive trees, pp. 356-407; Chapter 15 random forests, pp. 606-623
      angle_detail: The research-level accounts behind L12's summary slides. §9.2 (p. 324) is CART stated
        properly; Ch 10 (pp. 356-407) develops boosting as forward stagewise additive modelling, which
        is where the algorithm actually comes from; Ch 15 (pp. 606-623) is the random-forest analysis
        including why decorrelation reduces variance. §8.8 (p. 307) covers stacking. Use it to settle
        a specific question — this is not a first-pass reading and each section assumes the ones before
        it.
      vault_path: material://source-esl/esl.pdf
    - id: route-c3f8a132a0b3033a3af33c8d
      unit_id: unit-m2-sad-l13
      title: ESL Ch 13 - nearest neighbours and the cost of searching them
      format: book
      angle: 'Section 13.5 is the closest registered treatment of the L13 indexing problem: it states
        the computational cost of exact nearest-neighbour search and the editing/condensing responses,
        though it does not cover kd-trees, M-trees or LSH.'
      covers:
      - knowledge-sad-l13-neighbors
      - knowledge-sad-l13-exact-indexing
      depth: advanced-reference
      scope: optional
      locator: Section 13.3 k-nearest-neighbor classifiers, p. 482; section 13.5 computational considerations,
        p. 499 (editing and condensing)
      angle_detail: §13.3 (p. 482) is the theoretical treatment of nearest neighbours, including the asymptotic
        error-rate result that bounds 1-NN's error by twice the Bayes rate — a striking fact L13 does
        not mention. §13.5 (p. 499) covers editing and condensing the training set to make search cheaper,
        which is the classical counterpart to the deck's indexing material and the closest any book here
        comes to it. Reference-only, but the L13 indexing half is otherwise unsupported.
      vault_path: material://source-esl/esl.pdf
    - id: route-98f4476be143898c5a500b3f
      unit_id: unit-m2-sad-clustering
      title: ESL 14.3 - cluster analysis as an objective, not an algorithm
      format: book
      angle: Frames clustering by its loss function and dissimilarity choice before any algorithm, which
        is the 'no single true clustering' point the UE7 slides make rhetorically.
      covers:
      - knowledge-sad-clustering-families
      - knowledge-sad-clustering-evaluation
      depth: advanced-reference
      scope: optional
      locator: Section 14.3 cluster analysis, pp. 520-546
      angle_detail: Read this before any algorithm, not after. ESL §14.3 defines clustering by its loss
        function and by the dissimilarity measure chosen, and only then derives the algorithms as ways
        of minimising that loss — which is the argument behind UE7's 'there is no single true clustering'.
        It is the most demanding route on this stage and assumes comfort with the notation; twenty-six
        pages, of which the first six carry the framing that matters here.
    - id: route-sad-l03-esl-projection
      unit_id: unit-m2-sad-l03
      title: ESL §3.2 — least squares as orthogonal projection
      format: book
      depth: derivation
      scope: complementary
      covers:
      - knowledge-sad-l03-multivariate
      - knowledge-sad-l03-scaling-weights
