      format: book
      angle: A German mathematics-for-CS textbook whose Teil I is precisely the M1 prerequisite block
        this chapter assumes.
      angle_detail: 'Its 669 pages were previously the reason it was routed to ''AN.0 prerequisite gap''
        and nothing more. Opened at chapter level it turns out to be organised the way this script is:
        Teil I is the Grundlagen, Teil II is one-variable Analysis section by section. For Chapter 1 the
        relevant span is 30 pages, and it is in German with CS examples, which makes it a closer match
        to the lecture''s own framing than the English references on this menu.'
