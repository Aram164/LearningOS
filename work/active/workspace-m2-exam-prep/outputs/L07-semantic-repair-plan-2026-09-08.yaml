      covers:
      - knowledge-sad-l14-nb-recap
      - knowledge-sad-l14-gaussian
      depth: derivation
      scope: complementary
      locator: Ch 4 Classification, pdf pp. 144-208 — §4.4.4 Naive Bayes and the Ch 4 lab (Naive Bayes
        on the Smarket data)
      angle_detail: '§4.4 develops LDA (shared covariance), QDA (per-class covariance) and then Naive
        Bayes (diagonal covariance — features conditionally independent) as three points on the same spectrum.
        That framing answers the question L14 leaves open: what is actually being given up by the naive
        assumption, and when does giving it up pay. The lab then runs all three on the same data so the
        trade-off is observed rather than argued.'
      vault_path: material://source-islp/islp.pdf
    - id: route-a04a07038b21e44d84b93c0b
      unit_id: unit-m2-sad-l15
