    - id: route-98b8fba3bc0fa33805b7c050
      unit_id: unit-m2-sad-clustering
      title: Marsland Ch 14 - k-means as competitive learning
      format: book
      angle: Reframes the k-means update as competitive learning and vector quantisation, which explains
        why initialisation decides the local optimum the UE7 slides warn about.
      covers:
      - knowledge-sad-clustering-kmeans
      - knowledge-sad-clustering-initialization
      depth: implementation
      scope: complementary
      locator: Chapter 14, pp. 302-325 (k-means p. 303; competitive learning p. 307; vector quantisation
