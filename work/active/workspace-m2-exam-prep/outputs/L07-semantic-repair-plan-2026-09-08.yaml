      angle: Explains what each summary measure hides, not only what it reports — the reason a lecture
        needs more than one of them.
      angle_detail: 'Zeltzer''s recurring move is to show two visibly different datasets with the same
        mean, or the same standard deviation, and ask what the summary failed to capture. That framing
        answers the question L02 provokes but does not address: why so many measures for one dataset.
        Useful before the Fahrmeir drill, because it gives the definitions a purpose.'
    - id: route-5c3e138d6b1230dcb502e951
      unit_id: unit-m2-sad-l09
      title: zedstatistics — confidence intervals
      format: video
      depth: intuition
      scope: complementary
      locator: zedstatistics video 'What are confidence intervals? Actually.'
      covers:
      - knowledge-sad-l09-standard-error
      - knowledge-sad-l09-z-interval
      - knowledge-sad-l09-t-interval
      angle: Opens with the standard misinterpretation stated plainly, then dismantles it — which is more
        memorable than stating the correct version first.
      angle_detail: 'Most treatments give the correct interpretation and warn against the wrong one in
        a footnote. Zeltzer inverts it: he states the tempting reading (''95% chance the parameter is
        in here''), shows with repeated sampling why it cannot be right, and only then gives the correct
        one. Since the misinterpretation is the examinable point, attacking it directly is the better
        route.'
    - id: route-9bba0280753490bc6058ad4e
      unit_id: unit-m2-sad-l10
      title: zedstatistics — hypothesis testing and p-values
      format: video
      depth: intuition
