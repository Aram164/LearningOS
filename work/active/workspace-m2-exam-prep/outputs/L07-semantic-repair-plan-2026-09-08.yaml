        Clearly Explained'''
      angle_detail: sigma and sigma/sqrt(n) look similar on a slide and mean entirely different things
        — the spread of the data versus the spread of an estimate. The video separates them with two visibly
        different histograms, and once separated the confidence-interval formula stops looking arbitrary.
        The bootstrapping video then shows the resampling loop being run, which is the procedural half
        of L09's bootstrap node.
