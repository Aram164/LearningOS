      - knowledge-sad-l01-distributions
      depth: practice
      scope: complementary
      locator: Ch 2 Aufgaben pdf pp. 12-30, Lösungen pdf pp. 31-56 (start with the Häufigkeits- and Lagemaß
        items)
      angle_detail: The Arbeitsbuch is the companion to the Fahrmeir textbook and shares its numbering
        exactly, so an exercise here always has a chapter of theory behind it at the same number. Its
        solutions are full derivations, which makes it the right place to check calculation habits — divisor
        choice, rounding, how a median is reported for even n — rather than to test yourself. For untimed
        self-testing prefer the SaD Übungen; for timed self-testing use the Klausur bank.
      vault_path: material://source-fahrmeir-arbeitsbuch/arbeitsbuch.pdf
    - id: route-6e401f2013246933cbcab7fe
