  - source_id: source-kroese-dsml
    role: reference
    why: Broader workflow, evaluation, tree, probability, and neural-network reference for the ML half.
    priority: 22
    unit_routes:
    - id: route-4bef9e4af486bc5c7c1517db
      unit_id: unit-m2-sad-l11
      title: Kroese — data-science workflow and evaluation
      format: book
      angle: States the whole supervised problem as risk minimisation first, so loss functions and generalization
        are one framework rather than two topics.
      covers:
      - knowledge-sad-l11-pipeline
      - knowledge-sad-l11-resampling
      - knowledge-sad-l11-evaluation
      - knowledge-sad-l11-generalization
      depth: derivation
      scope: complementary
      locator: Ch 2 Statistical Learning, pdf pp. 37-84 (risk, loss and the training/test split); Ch 1
        Importing, Summarizing and Visualizing Data, pdf pp. 19-36
      angle_detail: Kroese defines the learner's goal as minimising expected loss over an unknown distribution,
        then derives training error, test error and the need for a held-out set as consequences of not
        knowing that distribution. L11 introduces objectives and resampling as separate pipeline stages;
        this route shows they answer the same question. More mathematical than the other L11 options —
        expect measure-free but real probability notation.
      vault_path: material://source-kroese-dsml/kroese.pdf
    - id: route-8b4580c36cbf51ee7807a23e
      unit_id: unit-m2-sad-l12
      title: Kroese Chapter 8 — tree methods
      format: book
      angle: Gives the splitting criteria as impurity functions in a single framework, so entropy and
        Gini are two choices of one object.
      covers:
      - knowledge-sad-l12-tree-model
      - knowledge-sad-l12-regression
      - knowledge-sad-l12-bagging-forest
      - knowledge-sad-l12-boosting
      depth: derivation
      scope: complementary
      locator: Ch 8 Decision Trees and Ensemble Methods, pdf pp. 305-340
      angle_detail: Presenting information gain and the Gini index as different impurity measures plugged
        into the same greedy algorithm is more economical than learning them separately, and it makes
        clear that the algorithm does not depend on which is chosen. The ensemble half is compact and
        mathematical — it gives the variance-reduction argument for bagging in algebra rather than in
        words.
      vault_path: material://source-kroese-dsml/kroese.pdf
    - id: route-533d07e5753b0285a7d3b5fc
      unit_id: unit-m2-sad-l14
      title: Kroese — probability-based classifier selections
      format: book
      angle: Derives the Bayes-optimal classifier first, so Naive Bayes is visibly an approximation to
        a known ideal.
      covers:
      - knowledge-sad-l14-nb-recap
      - knowledge-sad-l14-numeric
      - knowledge-sad-l14-gaussian
      depth: derivation
      scope: complementary
      locator: Ch 7 Classification, pdf pp. 269-304 (the Bayes classifier and generative classifiers)
      angle_detail: The Bayes classifier — assign to the class with the highest true posterior — is the
        best possible classifier and is unavailable because the posterior is unknown. Kroese establishes
        that baseline before any practical method, which turns Naive Bayes into a specific, understandable
        approximation of it rather than a standalone algorithm. That framing is missing from L14 and makes
        the smoothing and independence assumptions easier to reason about.
      vault_path: material://source-kroese-dsml/kroese.pdf
    - id: route-407fecf00c9736189282c28a
      unit_id: unit-m2-sad-l15
      title: Kroese — neural-network reference
      format: book
      angle: Keeps the matrix calculus needed for backpropagation in an appendix you can consult while
        reading the chapter.
      covers:
      - knowledge-sad-l15-forward
      - knowledge-sad-l15-backprop
      - knowledge-sad-l15-training
      depth: derivation
      scope: complementary
      locator: Ch 9 Deep Learning, pdf pp. 341-372; App B Multivariate Differentiation and Optimization,
        pdf pp. 415-438
      angle_detail: Backpropagation is chain-rule bookkeeping over matrices, and the usual obstacle is
        not the idea but the notation for derivatives of vector-valued functions. Having App B in the
        same book, in the same notation, means the gradient steps in Ch 9 can be checked rather than accepted.
        Denser than the deck requires; useful if the derivation is what you want.
      vault_path: material://source-kroese-dsml/kroese.pdf
    - id: route-883509bbad7e137305f77039
      unit_id: unit-m2-sad-clustering
      title: Kroese — clustering reference
      format: book
      angle: Independent data-science treatment of clustering families, objectives, and practical evaluation;
        optional after the UE7 trace.
      covers:
      - knowledge-sad-clustering-families
      - knowledge-sad-clustering-kmeans
      - knowledge-sad-clustering-evaluation
      depth: advanced-reference
      scope: complementary
      locator: 'kroese.pdf Ch 4 ''Unsupervised Learning'' p. 139: Risk and Loss in Unsupervised Learning
        p. 140, Clustering via Mixture Models p. 153, Clustering via Vector Quantization p. 160, Hierarchical
        Clustering p. 165; the supervised/unsupervised distinction is set up at p. 38'
      angle_detail: An independent data-science treatment that arrives at clustering from the risk/loss
        framing (p. 140) rather than from an algorithm, then splits the families the way UE7 names them.
        Its mixture-model section (p. 153) is the one genuinely extra idea on this stage — clustering
        as density estimation rather than as partitioning — and is optional after the UE7 trace. Mathematically
        heavier than Géron, lighter than ESL.
    - id: route-sad-l03-kroese-regression
      unit_id: unit-m2-sad-l03
      title: Kroese §§5.2–5.3.1 — model, observed fit and training loss
      format: book
      depth: derivation
      scope: complementary
