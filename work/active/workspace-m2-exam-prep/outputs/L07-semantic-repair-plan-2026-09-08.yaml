  - source_id: source-cs229-notes
    role: derivation
    why: Selected derivations for trees/boosting, Naive Bayes, and neural networks; advanced material
      remains optional.
    priority: 23
    unit_routes:
    - id: route-c8fc9d587448ab88b808180a
      unit_id: unit-m2-sad-l04
      title: CS229 §4.2 — Naive Bayes event models
      format: course-material
      angle: Writes the Bernoulli word-presence model and its class-conditional parameter estimates compactly.
      covers:
      - knowledge-sad-l04-naive-bayes
      depth: advanced-reference
      scope: complementary
      locator: cs229-notes.pdf §4.2, physical PDF pp. 43–45; §4.2.1 starts p. 46
      angle_detail: It uses a binary feature for each vocabulary item, unlike a token-count multinomial
        model. Absent-word probabilities matter in the Bernoulli model; do not silently multiply only
        present-word terms.
      vault_path: material://source-cs229-notes/cs229-notes.pdf
    - id: route-2ecd41a999e0fd49db64c0c0
      unit_id: unit-m2-sad-l12
      title: CS229 — decision-tree and boosting derivations
      format: course-material
      angle: Derives boosting as a greedy stagewise fit to a loss function, which is where AdaBoost's
        exponential weights come from.
      covers:
      - knowledge-sad-l12-entropy-id3
      - knowledge-sad-l12-boosting
      depth: advanced-reference
      scope: complementary
      locator: The decision-trees and boosting notes (the separate 'Decision Trees' and 'Boosting' note
        PDFs on the course site)
      angle_detail: L12 presents AdaBoost's reweighting rule as a procedure. These notes show it falling
        out of minimising exponential loss one weak learner at a time, which explains both the specific
        weight formula and why boosting can overfit. Above exam level and worth reading only if the reweighting
        rule looked arbitrary.
      vault_path: material://source-cs229-notes/cs229-notes.pdf
    - id: route-accc9d7a034e6648a4e7ee65
      unit_id: unit-m2-sad-l14
      title: CS229 §4.2 — Naive Bayes derivation
      format: course-material
      angle: Distinguishes the multinomial from the Bernoulli event model explicitly, which L14 blurs.
      covers:
      - knowledge-sad-l14-nb-recap
      - knowledge-sad-l14-smoothing
      - knowledge-sad-l14-multinomial
      depth: advanced-reference
      scope: complementary
      locator: cs229-notes.pdf §4.2 Naive Bayes p. 43, §4.2.1 Laplace smoothing p. 46, §4.2.2 Event models
        for text classification p. 48
      angle_detail: '§4.2.2 is why this route exists on L14 rather than only on L04: it separates the
        multinomial event model from the Bernoulli one explicitly, and shows that they give different
        likelihoods for the same document. L14 extends the categorical classifier without naming which
        event model it is using, so this is the section that makes the distinction sayable — and it is
        the kind of distinction an exam question can turn on.'
      vault_path: material://source-cs229-notes/cs229-notes.pdf
    - id: route-ce599e1e41abe030047befab
      unit_id: unit-m2-sad-l15
      title: CS229 §7 — compact neural-network derivation
      format: course-material
      angle: Backpropagation written out as matrix derivative bookkeeping, in the most compact correct
        form available here.
      covers:
      - knowledge-sad-l15-forward
      - knowledge-sad-l15-backprop
      depth: advanced-reference
      scope: complementary
      locator: 'cs229-notes.pdf Part III §7 Deep learning p. 82: Neural networks p. 84, Backpropagation
        p. 93 (one-neuron p. 94, two-layer unpacked p. 95, two-layer in vector notation p. 98, multi-layer
        p. 100)'
      angle_detail: 'The backpropagation section is built as a ladder — one neuron, then a two-layer network
        written out index by index, then the same network in vector notation, then the general case —
        which is the most useful ordering available for checking that the matrix shapes are right. Compact
        and unmotivated by design: it is the reference to verify a derivation against once L15''s own
        account has been followed.'
      vault_path: material://source-cs229-notes/cs229-notes.pdf
    - id: route-sad-l03-cs229-regression
      unit_id: unit-m2-sad-l03
      title: CS229 notes — LMS and normal-equation derivations
      format: book
      depth: derivation
      scope: complementary
      covers:
      - knowledge-sad-l03-simple-regression
      - knowledge-sad-l03-multivariate
      - knowledge-sad-l03-gradient-descent
      locator: Chapter 1, physical PDF pp. 9–16; §1.3 Gaussian bridge, pp. 16–18
      angle: Derives the scalar update first, extends it to a whole sample and then derives the matrix
        solution.
      angle_detail: The same housing model supports both algorithms. Section 1.2 checks the matrix differentiation;
        §1.3 is a later probability bridge. The inverse formula assumes XᵀX is invertible.
      vault_path: material://source-cs229-notes/cs229-notes.pdf
