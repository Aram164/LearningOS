      vault_path: material://source-fahrmeir-statistik/statistik.pdf
    - id: route-7847d85f81696a1bf1a87cf2
      unit_id: unit-m2-sad-l09
      title: Fahrmeir Chapter 9 — parameter estimation
      format: book
      angle: 'Estimator quality before estimator recipes: bias, consistency and efficiency are defined
        and compared in §9.2 before any interval formula appears.'
      covers:
      - knowledge-sad-l09-estimator
      - knowledge-sad-l09-properties
      - knowledge-sad-l09-standard-error
      - knowledge-sad-l09-z-interval
      - knowledge-sad-l09-t-interval
      depth: derivation
      scope: complementary
      locator: Ch 9 §9.1 Punktschätzung, pdf pp. 383-385; §9.2 Eigenschaften von Schätzstatistiken, pdf
