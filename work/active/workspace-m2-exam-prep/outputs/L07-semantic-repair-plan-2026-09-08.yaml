  - source_id: source-professor-leonard
    role: first-exposure
    why: Optional 20-minute intuition unlock before the script for a genuinely new topic; never substitutes
      for the HU definitions or notation.
    priority: 1
    unit_routes:
    - id: route-an-ch03-professorleonard
      unit_id: unit-m2-analysis-ch03
      title: Professor Leonard — Calculus 2, sequences
      format: video
      angle: Slow blackboard teaching that does the computation in full where the script compresses it
        to a result. The angle is pace.
      angle_detail: 'Conditional, not scheduled: reach for it when a cold diagnostic shows a block on
        this chapter, take the one topic, and stop. The reason it earns a place at all is that the script''s
        §3.6 states limit rules and applies them in one or two lines, while this works every intermediate
        step aloud — which is what an actual gap in the algebra needs. It is a US calculus course, so
        it never reaches the ε-N material the HU sheets grade; for that, the route is Abbott or MIT 18.100A,
        not this.'
      covers:
      - knowledge-m2-analysis-ch03-folgen
      - knowledge-m2-analysis-ch03-konvergenzkriterien
      - knowledge-m2-analysis-ch03-rechenregeln
      depth: intuition
      scope: complementary
      locator: 'Calculus 2 Lecture 9.1: ''Convergence and Divergence of Sequences'''
    - id: route-an-ch04-professorleonard
      unit_id: unit-m2-analysis-ch04
      title: Professor Leonard — Calculus 2, series and convergence tests
      format: video
      angle: Every criterion worked at blackboard pace with full arithmetic — the pace angle again, applied
        to the chapter with the most mechanical content.
      angle_detail: 'Conditional and capped, as always. This chapter is where the pace angle is most defensible:
        the criteria are mechanical, the failure is usually in executing the estimate, and a US calculus
        course covers the ratio, root, comparison and alternating tests at exactly the computational level
        the script assumes. It will not cover absolute-versus-conditional convergence at §4.3''s depth.'
      covers:
      - knowledge-m2-analysis-ch04-reihen
      - knowledge-m2-analysis-ch04-konvergenzkriterien
      - knowledge-m2-analysis-ch04-absolute-konvergenz
      depth: intuition
      scope: complementary
      locator: 'Calculus 2 Lecture 9.3: ''Using the Integral Test for Convergence/Divergence of Series,
        P-Series'''
    - id: route-an-ch05-professorleonard
      unit_id: unit-m2-analysis-ch05
      title: Professor Leonard — Calculus 1, limits and continuity
      format: video
      angle: Blackboard pace on the computational half of the chapter — one-sided limits and the indeterminate
        forms, worked in full.
      angle_detail: Conditional on a diagnosed block, one topic at a time. It is a good fit for §5.2 specifically,
        where the work is case analysis and algebra rather than proof. It does not reach the sequence
        criterion, the compactness theorems or uniform convergence at the script's depth — for those the
        routes are Abbott, Lebl or MIT 18.100A.
      covers:
      - knowledge-m2-analysis-ch05-funktionsgrenzwerte
      - knowledge-m2-analysis-ch05-einseitige-grenzwerte
      - knowledge-m2-analysis-ch05-stetigkeit
      depth: intuition
      scope: complementary
      locator: 'Calculus 1 Lecture 1.1: ''An Introduction to Limits'''
    - id: route-an-ch06-professorleonard
      unit_id: unit-m2-analysis-ch06
      title: Professor Leonard — Calculus 1 derivative and Mittelwertsatz, Calculus 2 Taylor
      format: video
      angle: The chapter where a US calculus course covers the most of what is actually examined — at
        blackboard pace, with every step of the computation shown.
      angle_detail: 'Chapter 6 is the best fit for this source in the whole module: derivative rules,
        the mean value theorem, l''Hospital and Taylor polynomials are standard calculus-course content,
        taught computationally, which is the level §§6.1-6.8 mostly ask for. Still conditional on a diagnosed
        block and still one topic at a time — the pace angle is a repair tool, not a syllabus.'
      covers:
      - knowledge-m2-analysis-ch06-differenzierbarkeit
      - knowledge-m2-analysis-ch06-mittelwertsatz
      - knowledge-m2-analysis-ch06-trigonometrie
      - knowledge-m2-analysis-ch06-hospital
      - knowledge-m2-analysis-ch06-hoehere-ableitungen
      - knowledge-m2-analysis-ch06-taylor
      - knowledge-m2-analysis-ch06-interpolation
      depth: intuition
      scope: complementary
      locator: 'Calculus 1 Lecture 2.1: ''An Introduction to the Derivative''; Calculus 2 Lecture 10.10:
        ''Taylor and Maclaurin Series'''
    - id: route-an-ch07-professorleonard
      unit_id: unit-m2-analysis-ch07
      title: Professor Leonard — Calculus 1 definite integral and FTC, Calculus 2 techniques and improper
        integrals
      format: video
      angle: Blackboard pace on substitution and parts, where the failure is almost always execution rather
        than understanding.
      angle_detail: Conditional on a diagnosed block, one topic at a time. Integration technique is the
        part of the module where watching someone work through the algebra is genuinely the efficient
        repair, because the errors are arithmetic and bookkeeping. It will not cover the integrability
        criterion of §7.1 at the script's depth.
      covers:
      - knowledge-m2-analysis-ch07-riemann-integral
      - knowledge-m2-analysis-ch07-hauptsatz
      - knowledge-m2-analysis-ch07-uneigentliche-integrale
      depth: intuition
      scope: complementary
      locator: 'Calculus 1 Lecture 4.5: ''The Fundamental Theorem of Calculus''; Calculus 2 Lecture 7.1:
        ''Integration By Parts'''
