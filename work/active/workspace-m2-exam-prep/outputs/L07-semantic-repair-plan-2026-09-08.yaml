        — these two chapters only
      angle_detail: Held behind a gate on purpose. The book is 636 pages and could easily become a second
        probability course running in parallel with the exam lane, which is why the route is two chapters
        and stops. Open Ch 1 when a counting problem failed on the order/repetition decision rather than
        on arithmetic, and Ch 2 when a Bayes answer was right by formula and wrong by intuition; its story-first
