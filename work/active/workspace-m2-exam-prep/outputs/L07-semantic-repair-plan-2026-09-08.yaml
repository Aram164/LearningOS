        p. 56; testing and validating pp. 57-59; exercises p. 60)
      angle_detail: The vocabulary chapter, with the failure cases attached to the definitions rather
        than deferred. Overfitting (p. 54) and underfitting (p. 56) arrive with the diagnosis and the
        standard remedies, and testing/validating (pp. 57-59) explains why the split exists before L11's
        resampling node formalises it. Written for practitioners, so every term is introduced with the
        situation that made it necessary. The chapter exercises on pp. 60-61 are a fast check of whether
        the vocabulary has actually landed.
      vault_path: material://source-geron-handson/geron.pdf
    - id: route-a848504ea89949cfbedc08aa
      unit_id: unit-m2-sad-l11
      title: Geron Ch 2 - the pipeline executed end to end
      format: book
      angle: 'Turns the L11 pipeline slide into an executed sequence: building the test set before looking
        at the data, scaling features, composing transformation pipelines, and scoring with cross-validation
        - the leakage-avoidance ordering the deck asserts but never demonstrates.'
      covers:
      - knowledge-sad-l11-pipeline
      - knowledge-sad-l11-representation
      - knowledge-sad-l11-resampling
      depth: implementation
      scope: complementary
      locator: Chapter 2, pp. 63-111 (create a test set p. 80; feature scaling p. 98; transformation pipelines
        p. 99; better evaluation using cross-validation p. 102)
      angle_detail: 'The whole L11 pipeline executed once, end to end, on real housing data — the only
        route on this stage where the stages are performed rather than described. The specific pages matter:
        creating a test set (p. 80) shows the leakage trap L11 warns about, transformation pipelines (p.
        99) shows why preprocessing must be fitted on training data only, and cross-validation (p. 102)
        shows the resampling node in code. Doing this chapter once makes the deck''s pipeline diagram
        concrete in a way no amount of re-reading will.'
      vault_path: material://source-geron-handson/geron.pdf
    - id: route-081414547c6db9ae902f6ef8
      unit_id: unit-m2-sad-l11
      title: Geron Ch 3 - the evaluation metrics of L11 as drills
      format: book
      angle: The deck's ROC/AUC pair (slides 38-39) had no practice source in the module at all; this
