      vault_path: material://source-lebl-basic-analysis/realanal.pdf
    - id: route-an-ch07-leblbasicanalysis
      unit_id: unit-m2-analysis-ch07
      title: Lebl — The Riemann Integral, including improper integrals
      format: book
      angle: The closest structural twin again — and one of the few references with a dedicated improper
