  - source_id: source-cs229-2022-videos
    role: optional-depth
    why: Topic-matched video depth only; do not follow the whole course.
    priority: 24
    unit_routes:
    - id: route-0f4dd7d42e4f26f7e9730a91
      unit_id: unit-m2-sad-l12
      title: Stanford CS229 — tree/ensemble lecture selections
      format: course
      angle: A research-level lecturer explaining why trees are still used, which is context the deck
        does not attempt.
      covers:
      - knowledge-sad-l12-tree-model
      - knowledge-sad-l12-bagging-forest
      - knowledge-sad-l12-boosting
      depth: advanced-reference
      scope: complementary
      locator: Spring 2022 playlist, Lecture 11 'Decision Trees' and Lecture 12 'Boosting'
      angle_detail: 'The useful part is the framing: where trees sit relative to everything else in the
        course, what they are good at (heterogeneous tabular features, interpretability) and what they
        are bad at. That judgment is hard to get from a textbook and is the kind of thing a conceptual
        exam question rewards. The technical content is above SaD''s level in places; watch for the framing.'
    - id: route-c0b5823ea68abe2175956a82
      unit_id: unit-m2-sad-l14
      title: Stanford CS229 — generative-classifier lecture
      format: course
      angle: Sets up the generative-versus-discriminative distinction, which is the category Naive Bayes
        belongs to and which L14 never names.
      covers:
      - knowledge-sad-l14-nb-recap
      - knowledge-sad-l14-multinomial
      depth: advanced-reference
      scope: complementary
      locator: Spring 2022 playlist, Lecture 5 'Gaussian Discriminant Analysis and Naive Bayes'
      angle_detail: Modelling P(x|y) and P(y) and inverting with Bayes, versus modelling P(y|x) directly,
        is the single most clarifying distinction in classification — it explains why Naive Bayes needs
        smoothing and logistic regression does not, and why Naive Bayes can be trained on less data. L14
        works entirely inside the generative branch without saying so. One lecture, high return.
    - id: route-808f7b40861516f88124d45b
      unit_id: unit-m2-sad-l15
      title: Stanford CS229 — neural-network lecture
      format: course
      angle: Motivates depth by showing what a single layer cannot represent, before showing what more
        layers buy.
      covers:
      - knowledge-sad-l15-forward
      - knowledge-sad-l15-backprop
      - knowledge-sad-l15-training
      depth: advanced-reference
      scope: complementary
      locator: Spring 2022 playlist, Lecture 8 'Neural Networks I'
      angle_detail: The lecture spends real time on the representational question — what functions are
        and are not reachable — which is L15's universality node treated as a question rather than a stated
        theorem. Also useful for hearing how a practitioner describes the training loop, which the deck
        lists as practical choices.
