  - source_id: source-sad-ss26-lectures
    role: course-material
    why: The fifteen current SoSe 2026 decks are the non-negotiable lecture and exam scope.
    priority: 0
    unit_routes:
    - id: route-7cb7d44175d018bdebbdbd33
      unit_id: unit-m2-sad-l01
      title: Current L01 introduction deck
      format: course-material
      angle: The scope authority for L01 and the only place the course's own framing of the module appears.
      covers:
      - knowledge-sad-l01-data-questions
      - knowledge-sad-l01-location
      - knowledge-sad-l01-distributions
      - knowledge-sad-l01-sampling-context
      - knowledge-sad-l01-classification
      - knowledge-sad-l01-base-rates
      - knowledge-sad-l01-course-map
      depth: course-aligned
      scope: current
      locator: lecture-slides/01_introduction.pdf, 42 slides
      angle_detail: L01 begins with a study-duration dataset (PDF pp. 3-10), then works a medical-test
        table, classification measures and base-rate reasoning (pp. 12-24). These are L01's own topics
        and are revisited in L04/L11. The biomedical example (pp. 26-34) illustrates applications; pp.
        37-40 give the course overview and bibliography.
    - id: route-0f03e63079982eab2c3f883b
      unit_id: unit-m2-sad-l02
      title: Current L02 basic-concepts deck
      format: course-material
      angle: Fixes the exact vocabulary and calculation conventions the rest of the course and the exam
        use.
      covers:
      - knowledge-sad-l02-vocabulary
      - knowledge-sad-l02-scales
      - knowledge-sad-l02-frequencies
      - knowledge-sad-l02-location
      - knowledge-sad-l02-dispersion
      - knowledge-sad-l02-simpson
      - knowledge-sad-l02-sampling
      depth: course-aligned
      scope: current
      locator: lecture-slides/02_basics.pdf, 39 slides
      angle_detail: This is the deck to check whenever a definition is in dispute — including the variance
        divisor, which differs between textbooks and is settled here for this course. The Simpson's-paradox
        and sampling-bias slides at the end are conceptually the most demanding part and get the least
        time; OpenIntro §1.3 and §2.2 are the elaboration. Nothing in L02 requires probability, so it
        can be revised independently of everything after L03.
    - id: route-915c0c30301715706f857321
      unit_id: unit-m2-sad-l03
      title: Current L03 correlation and regression deck
      format: course-material
      angle: The course's own path from a scatterplot to the normal equation and gradient descent, in
        one sitting.
      covers:
      - knowledge-sad-l03-paired-data
      - knowledge-sad-l03-covariance
      - knowledge-sad-l03-interpretation
      - knowledge-sad-l03-simple-regression
      - knowledge-sad-l03-multivariate
      - knowledge-sad-l03-gradient-descent
      - knowledge-sad-l03-scaling-weights
      depth: course-aligned
      scope: current
      locator: lecture-slides/03_correlation_regression.pdf, 48 slides
      angle_detail: The current deck connects scatterplots and Pearson correlation to simple and multivariate
        regression. PDF pp. 24-27 develop the matrix solution; pp. 29-43 explain gradient descent and
        run numeric weight updates, including feature scaling. Supplementary matrix and optimization resources
        offer additional explanation and practice, rather than supplying an example absent from the deck.
    - id: route-1d4c3d5164052df9c540d079
      unit_id: unit-m2-sad-l04
      title: Current L04 probability and Naive Bayes deck
      format: course-material
      angle: Controls the probability notation for the whole module, and builds the categorical Naive
        Bayes classifier that L14 later extends.
      covers:
      - knowledge-sad-l04-framing
      - knowledge-sad-l04-events
      - knowledge-sad-l04-axioms
      - knowledge-sad-l04-conditional
      - knowledge-sad-l04-bayes
      - knowledge-sad-l04-independence
      - knowledge-sad-l04-naive-bayes
      depth: course-aligned
      scope: current
      locator: lecture-slides/04_probability.pdf, 59 slides
      angle_detail: The deck develops event spaces, axioms, conditioning, independence and categorical
        Naive Bayes. PDF p. 43 (printed slide 46) explicitly defines the partition and states total probability
        before Bayes; it omits the proof. Fahrmeir supplies a proof-oriented treatment. Distinguish this
        omitted proof from an omitted theorem statement.
    - id: route-5b6e78353200f05843a1f9a0
      unit_id: unit-m2-sad-l05
      title: Current L05 combinatorics deck
      format: course-material
      angle: Builds the counting grid through race rankings, card dealing and an explicit stars-and-bars
        construction.
      covers:
      - knowledge-sad-l05-decision-grid
      - knowledge-sad-l05-permutations
      - knowledge-sad-l05-variations
      - knowledge-sad-l05-combinations
      - knowledge-sad-l05-repetition
      - knowledge-sad-l05-counting-probability
      - knowledge-sad-l05-identities
      depth: course-aligned
      scope: current
      locator: lecture-slides/05_combinatorics.pdf, 34 slides
      angle_detail: The grid classifies order, repetition and selection size. The Gummibärchen argument
        on p. 25 derives combinations with repetition; p. 29 has an inconsistent lottery calculation,
        so use the coherent general formula on p. 30.
      vault_path: material://source-sad-ss26-lectures/lecture-slides/05_combinatorics.pdf
    - id: route-a2e6fc0559d93d22efbe732a
      unit_id: unit-m2-sad-l06
      title: Current L06 random-variables deck
      format: course-material
      angle: Connects outcome mappings, distribution functions and moments to the random sample mean and
        its concentration.
      covers:
      - knowledge-sad-l06-random-variable
      - knowledge-sad-l06-distribution-functions
      - knowledge-sad-l06-transformations
      - knowledge-sad-l06-expectation
      - knowledge-sad-l06-variance-covariance
      - knowledge-sad-l06-sample-mean
      - knowledge-sad-l06-concentration
      depth: course-aligned
      scope: current
      locator: lecture-slides/06_random_variables.pdf, 60 slides
      angle_detail: 'The current 60-page deck supplies the taught sequence. Use the stage-specific page
        guidance and formula caveats: pp. 15, 20–21, 29–30, 40–42 contain notation or interpretation problems.
        Covariance requires a complementary written derivation; the deck does not derive it here. No independent
        claim about examination scope is made.'
      vault_path: material://source-sad-ss26-lectures/lecture-slides/06_random_variables.pdf
    - id: route-66b70c94de7bc040921d186c
      unit_id: unit-m2-sad-l07
      title: Current L07 discrete-distributions deck
      format: course-material
      angle: Defines the identifying assumptions for the discrete models taught in the current deck and
        connects those assumptions to their PMFs, moments, examples, and relationships.
      covers:
      - knowledge-sad-l07-model-selection
      - knowledge-sad-l07-bernoulli-binomial
      - knowledge-sad-l07-hypergeometric
      - knowledge-sad-l07-poisson
      - knowledge-sad-l07-relationships
      depth: course-aligned
      scope: current
      locator: lecture-slides/07_discrete_distributions.pdf, 33 slides
      angle_detail: 'The deck presents model assumptions, PMFs, moments, worked examples, and relationships
        between its discrete models. The relationships are asserted; Blitzstein §3.9 and §4.8 provide
        complementary derivations. Use the condition statements as a model-selection checklist. Scope
        note: the current deck has no dedicated Geometric section; the Geometric stage is a complementary
        bridge to the explicitly routed Blatt 4 work. This route makes no independent claim about exam
        weighting.'
    - id: route-a82f4016ebbdab30e0351c91
      unit_id: unit-m2-sad-l08
      title: Current L08 Normal, CLT, and likelihood deck
      format: course-material
      angle: 'Two lectures in one deck: Normal calculations and the CLT, then likelihood and the derivation
        that turns maximum likelihood into least squares.'
      covers:
      - knowledge-sad-l08-normal
      - knowledge-sad-l08-standardization
      - knowledge-sad-l08-transform-sum
      - knowledge-sad-l08-clt
      - knowledge-sad-l08-approximation
      - knowledge-sad-l08-likelihood
      - knowledge-sad-l08-mle
      depth: course-aligned
      scope: current
      locator: lecture-slides/08_normal_distribution.pdf, 38 slides
      angle_detail: The Gaussian-error derivation at the end is the intellectual centre of the statistics
        half — it is where L03's least-squares choice is finally justified — and it arrives after the
        CLT material when attention is lowest. Budget a separate session for the likelihood slides. The
        LLN-versus-CLT slides are the other high-risk part; they are correct but terse. Dekking Ch 13-14
        and Ch 21 cover both halves in the same notation.
    - id: route-86a1ed6bed9d05cc93b50bad
      unit_id: unit-m2-sad-l09
      title: Current L09 estimation deck
      format: course-material
      angle: The exam-notation authority for estimator properties and the z/t/bootstrap interval formulas.
      covers:
      - knowledge-sad-l09-estimator
      - knowledge-sad-l09-properties
      - knowledge-sad-l09-standard-error
      - knowledge-sad-l09-z-interval
      - knowledge-sad-l09-t-interval
      - knowledge-sad-l09-bootstrap
      - knowledge-sad-l09-data-bias
      depth: course-aligned
      scope: current
      locator: lecture-slides/09_estimating.pdf, 45 slides
      angle_detail: The deck presents properties and intervals together, so the interval formulas can
        be learned without the sampling-distribution reasoning that justifies them — which works until
        a question varies the setup. Fahrmeir §9.2 separates the two deliberately. The final slides on
        statistical uncertainty versus biased data are conceptual, not computational, and are the kind
        of point that appears as a short written question.
    - id: route-37b273e6be586546e32355cb
      unit_id: unit-m2-sad-l10
      title: Current L10 hypothesis-testing deck
      format: course-material
      angle: The largest deck in the module and the complete course logic of testing, from null models
        to multiple testing.
      covers:
      - knowledge-sad-l10-test-model
      - knowledge-sad-l10-tails-pvalue
      - knowledge-sad-l10-errors-power
      - knowledge-sad-l10-z-t
      - knowledge-sad-l10-ci-duality
      - knowledge-sad-l10-chi-square
      - knowledge-sad-l10-nonparametric
      - knowledge-sad-l10-multiple
      depth: course-aligned
      scope: current
      locator: lecture-slides/10_testing.pdf, 65 slides
      angle_detail: 'Sixty-five slides introducing the entire testing vocabulary at once — null model,
        statistic, reference distribution, tails, p-value, both error types, power, z/t, chi-square, nonparametric
        alternatives, confidence-interval duality and multiplicity. The volume is the difficulty. Dekking''s
        two-chapter split (Ch 25 essentials, Ch 26 elaboration) is the standard way to take the same content
        in two passes. Duality and multiple testing are both exam-favoured and both sit at the end of
        the deck. Note explicit z-statistic erratum on printed slide 28: z formula missing sqrt(n).'
    - id: route-739f3af86a81ba6168a13cda
      unit_id: unit-m2-sad-l11
      title: Current L11 data-science introduction deck
      format: course-material
      angle: Defines the pipeline vocabulary — task, resampling, objective, metric, generalization — that
        L12 to L15 all assume.
      covers:
      - knowledge-sad-l11-pipeline
      - knowledge-sad-l11-tasks
      - knowledge-sad-l11-representation
      - knowledge-sad-l11-resampling
      - knowledge-sad-l11-objectives
      - knowledge-sad-l11-evaluation
      - knowledge-sad-l11-generalization
      depth: course-aligned
      scope: current
      locator: lecture-slides/11_datascience_intro.pdf, 49 slides
      angle_detail: 'This deck is the hinge of the module: everything before it is statistics, everything
        after is learning algorithms, and it supplies the shared frame. Its concepts are individually
        simple and collectively easy to hold vaguely, which is why the exercise-level routes on this stage
        (Géron Ch 2-3, ESL §7.10) matter more here than usual. Note that the deck''s evaluation metrics
        extend L01''s confusion matrix rather than re-deriving it.'
    - id: route-2dae8c065ede0f1bff7b14d7
      unit_id: unit-m2-sad-l12
      title: Current L12 tree-based learning deck
      format: course-material
      angle: 'The only current tree scope: preference bias, entropy/information gain/ID3, regression splitting,
        pruning, and the four ensemble families.'
