      angle_detail: 'Ch 8 is the only route here that gives a proof of the central limit theorem, and
        more usefully it arranges the results as an escalation: Chebyshev bounds the deviation crudely,
        the weak law turns that bound into convergence in probability, and the CLT then describes the
        exact limiting shape. That ordering is the answer to ''why do we need the CLT when we already
