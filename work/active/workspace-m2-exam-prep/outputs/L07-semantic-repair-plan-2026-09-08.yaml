      scope: complementary
      locator: '''Hypothesis Testing and the Null Hypothesis''; ''p-values, Clearly Explained''; ''How
        to Calculate p-values''; ''One- or Two-Tailed p-values'''
      angle_detail: 'Those three questions get conflated in a single lecture and each is a separate source
        of lost marks. Splitting them across four short videos means each can be checked independently:
        do I know what the number means, can I produce it, and did I choose the right tail count for this
        alternative. The one-or-two-tailed video in particular addresses the decision the exam most often
        penalises.'
