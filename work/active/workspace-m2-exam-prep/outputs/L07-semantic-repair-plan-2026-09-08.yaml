  - source_id: source-islp
    role: reference
    why: Ch 2 for workflow/evaluation, Ch 8 for trees/ensembles, Ch 4 for Naive Bayes, Ch 10 for neural
      nets.
    priority: 4
    unit_routes:
    - id: route-340dd98b7e8f177fce11b9f5
      unit_id: unit-m2-sad-l03
      title: ISLP Chapter 3 — statistical regression bridge
      format: book
      angle: Uses advertising data to show how a coefficient’s meaning changes when other predictors enter
        the model.
      covers:
      - knowledge-sad-l03-simple-regression
      - knowledge-sad-l03-multivariate
      - knowledge-sad-l03-scaling-weights
      depth: derivation
