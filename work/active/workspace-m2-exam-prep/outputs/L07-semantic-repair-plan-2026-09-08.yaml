        made it look too broad to use. Opened, its Teil II is a complete one-variable Analysis in the
        same order as the script, and the Chapter 2 material is a well-marked 25-page span. Note that
        it puts the completeness axiom inside its Konvergenz chapter rather than with the field axioms
