      angle: Defines the t and chi-square distributions constructively out of Normals, instead of introducing
        them as table lookups.
      angle_detail: L10 uses both as reference distributions and never says what they are. Three pages
        here define chi-square as a sum of squared standard Normals and t as a standard Normal divided
        by the root of an independent chi-square over its degrees of freedom. That is what makes 'degrees
        of freedom' a quantity rather than a column heading, and it explains why the t approaches the
        Normal as n grows. Background, not exam-bearing — read it once.
