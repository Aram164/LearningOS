    unit_routes:
    - id: route-fe46f2fec8e3b764ed5ee7a6
      unit_id: unit-m2-sad-l14
      title: Murphy §§9.3–9.4 — Gaussian and Multinomial Naive Bayes
      format: book
      angle: States the conditions under which Naive Bayes beats a discriminative model despite its false
        assumption.
      covers:
      - knowledge-sad-l14-gaussian
      - knowledge-sad-l14-multinomial
      depth: advanced-reference
      scope: complementary
      locator: §9.3 Naive Bayes classifiers and §9.4 generative vs discriminative classifiers (Part II
        Linear Models, pdf pp. 351-452)
      angle_detail: '§9.4 is the reason to come here: it explains that a wrong but low-variance model
        can beat a correct high-variance one when data is scarce, which is why a classifier built on an
        assumption everyone knows is false remains useful. That is the honest answer to the objection
        L14 invites and does not address. Reference-level writing — precise, compressed, and assuming
        a probability background beyond SaD''s.'
      vault_path: material://source-murphy-pml1/pml1.pdf
    - id: route-0e40ebef08584b95092d66e7
      unit_id: unit-m2-sad-l15
