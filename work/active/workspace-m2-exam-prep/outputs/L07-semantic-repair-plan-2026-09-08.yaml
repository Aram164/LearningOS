      - knowledge-sad-l15-forward
      - knowledge-sad-l15-backprop
      depth: orientation
      scope: complementary
      locator: '''Neural Networks Part 1 — Inside the Black Box''; ''Backpropagation Main Ideas''; ''Stochastic
        Gradient Descent, Clearly Explained'' (≈15-20 min each)'
      angle_detail: Part 1's central demonstration is that two hidden units with a soft activation can
        be weighted and added to produce a bent curve fitting the data, built up piece by piece on screen.
        That is L15's universality node made visible without any theorem. The backpropagation video then
        updates one weight at a time with the numbers shown, and the SGD video explains why the gradient
        is estimated on a batch rather than the full data — a practical point L15 lists without motivating.
