    - id: route-e6e54c18328cf55e09658980
      unit_id: unit-m2-sad-l06
      title: Pitman — random variables and expectation
      format: book
      angle: Introduces expectation as the long-run average of repeated draws, with the frequency picture
        kept alongside the formula throughout.
      covers:
      - knowledge-sad-l06-distribution-functions
      - knowledge-sad-l06-transformations
      - knowledge-sad-l06-expectation
      - knowledge-sad-l06-variance-covariance
      depth: advanced-reference
      scope: complementary
      locator: Ch 3 Random Variables, pdf pp. 148-268 (§3.2 Expectation p. 171; §3.3 Standard Deviation
        and Normal Approximation p. 194; §3.6 Symmetry p. 246)
      angle_detail: Pitman consistently draws the distribution as a bar chart and marks the mean as a
        balance point and the standard deviation as a width, then computes. Keeping the picture attached
        to the symbol is why this is a good route when E[X] and Var(X) feel like formulas to memorise
        rather than properties of a shape. §3.3 also introduces the Normal approximation right after standard
        deviation, so the reason anyone cares about sigma is visible immediately. Long chapter — for L06
        read §3.2 and §3.3 and stop.
      vault_path: material://source-pitman-probability/pitman.pdf
    - id: route-ebf16644b4d589e5cfa9dc54
      unit_id: unit-m2-sad-l07
      title: Pitman Chapters 2–3 — discrete distributions
      format: book
      angle: Reaches the Poisson twice — once as a limit of the Binomial, once as a distribution in its
        own right — several chapters apart.
      covers:
      - knowledge-sad-l07-bernoulli-binomial
      - knowledge-sad-l07-hypergeometric
      - knowledge-sad-l07-geometric
      - knowledge-sad-l07-poisson
      depth: advanced-reference
      scope: complementary
      locator: Ch 2 §2.1 The Binomial Distribution, pdf pp. 90-102; §2.4 Poisson Approximation, pdf pp.
        127-147; Ch 3 §3.4 Discrete Distributions, pdf pp. 217-230; §3.5 The Poisson Distribution, pdf
        pp. 231-245
      angle_detail: §2.4 derives the Poisson as what the Binomial becomes when n grows and p shrinks with
        np fixed, with the error of the approximation discussed; §3.5, much later, treats the Poisson
        as a first-class distribution with its own moments. Meeting it in both roles is the clearest way
        to hold L07's relationships node, which asserts the limit on one slide. §3.4 collects the discrete
        families with a comparison of their shapes.
      vault_path: material://source-pitman-probability/pitman.pdf
    - id: route-b255b45da1a3190feb0ed9e8
      unit_id: unit-m2-sad-l08
      title: Pitman — Normal and limit-theorem selections
      format: book
      angle: Splits the Normal approximation into a 'method' section and an optional 'derivation' section,
        so the mechanics and the proof are cleanly separable.
      covers:
      - knowledge-sad-l08-normal
      - knowledge-sad-l08-standardization
      - knowledge-sad-l08-clt
      depth: advanced-reference
      scope: complementary
      locator: 'Ch 2 §2.2 Normal Approximation: Method, pdf pp. 103-118; §2.3 Normal Approximation: Derivation
        (optional), pdf pp. 119-126; Ch 4 Continuous Distributions, pdf pp. 269-330'
      angle_detail: '§2.2 gives the recipe with the continuity correction and worked lookups — exactly
        what the exam needs — and §2.3 then derives it, marked optional by the author. That division lets
        you take only the first half now and come back for the second if the CLT''s origin nags. Pitman
        also introduces the Normal before continuous random variables in general, which is unusual and
        works well here: the shape is motivated by the approximation problem instead of appearing as one
        density among many.'
      vault_path: material://source-pitman-probability/pitman.pdf
