      title: Ross — named discrete distributions
      format: book
      angle: Derives every moment rather than tabulating it, so E[X] and Var(X) for each family can be
        reconstructed instead of recalled.
      covers:
      - knowledge-sad-l07-bernoulli-binomial
      - knowledge-sad-l07-hypergeometric
      - knowledge-sad-l07-geometric
      - knowledge-sad-l07-poisson
      - knowledge-sad-l07-relationships
      depth: advanced-reference
      scope: complementary
      locator: Ch 4 Random Variables, pdf pp. 198-305 (§4.6 the Bernoulli and binomial random variables;
        §4.7 the Poisson random variable; §4.8.1 geometric; §4.8.3 hypergeometric)
      angle_detail: Where Fahrmeir tabulates the moments and OpenIntro states them, Ross computes each
        one from the PMF, usually with a slick algebraic step worth learning on its own (the index shift
        in the binomial mean, the derivative trick for the geometric). If the exam permits no formula
        sheet, being able to rebuild one moment from its PMF is a genuine safety net. §4.7.1 also covers
        computing the distribution function without overflow, which is a numerical aside but explains
        the recursive forms that appear in software.
      vault_path: material://source-ross-first-course/ross.pdf
