      angle_detail: L10 introduces null model, statistic, tails, p-value, both error types, power, and
        duality inside one lecture, and the vocabulary load is the real difficulty. Dekking's split means
        Ch 25 gets you to a decision with only three of those ideas, and Ch 26 revisits the same example
