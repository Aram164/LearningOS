      locator: Ch 19 unbiased estimators, pdf pp. 291-303; Ch 20 efficiency and mean squared error, pdf
        pp. 304-316 (variance of an estimator p. 307; MSE p. 310; exercises p. 312); Ch 18 the bootstrap,
        pdf pp. 275-290 (bootstrap principle p. 275; empirical bootstrap p. 278; exercises p. 286); Ch
        23 confidence intervals for the mean, pdf pp. 344-363 (normal data p. 348; bootstrap confidence
        intervals p. 353); Ch 24 §24.1 the probability of success, pdf pp. 364-366
      angle_detail: L09 shows the bootstrap as a resampling recipe. Ch 18 states the bootstrap principle
        first — replace the unknown true distribution by the empirical one, then do exactly what you would
        have done — and only then gives the algorithm, which is what makes it transferable to a situation
        the recipe does not cover. §23.3 then builds a bootstrap confidence interval, closing the loop
        to the z/t intervals in §23.2 so the three interval methods sit side by side. Chapters 19 and
        20 separate unbiasedness from efficiency, which the lecture presents together.
