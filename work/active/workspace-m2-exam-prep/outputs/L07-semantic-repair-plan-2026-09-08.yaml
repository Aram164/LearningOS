      angle_detail: 'L02 is the lecture where the exam risk is arithmetic and convention rather than understanding:
        which measure is defined on which scale, how a class-grouped mean is computed, whether the variance
        divides by n or n-1 in this course. Volume is what fixes those, and this chapter has more solved
        items on exactly that material than anything else available. Work them with the solutions covered;
        the value is in the many small conventions, not in any single problem.'
      vault_path: material://source-fahrmeir-arbeitsbuch/arbeitsbuch.pdf
