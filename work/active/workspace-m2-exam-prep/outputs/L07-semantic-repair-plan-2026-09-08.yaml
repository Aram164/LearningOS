  - source_id: source-statquest
    role: intuition
    why: Exact short refreshers for distributions, CLT, MLE, intervals, tests, trees, Naive Bayes, and
      neural nets.
    priority: 18
    unit_routes:
    - id: route-e97efca7d5fa214453f7b0d0
      unit_id: unit-m2-sad-l01
      title: StatQuest — confusion matrix, sensitivity, and specificity
      format: video
      angle: Twenty minutes that fix the confusion matrix orientation problem — which axis is truth, which
        is prediction — for good.
      covers:
      - knowledge-sad-l01-classification
      depth: orientation
      scope: complementary
      locator: '''The Confusion Matrix, Clearly Explained'' and ''Sensitivity and Specificity, Clearly
        Explained'' (≈10 min each)'
      angle_detail: Nearly every mistake with precision, recall, sensitivity and specificity is a transposition
        error made under time pressure, not a conceptual failure. StatQuest's fix is a colour-coded table
        built up cell by cell, repeated until the layout is memorable. That is worth more for L01 than
        any written treatment, because the written ones assume you will not transpose it. Stop after these
        two; the channel's ROC video belongs to L11.
    - id: route-13f3ebff8cc9534c96100502
      unit_id: unit-m2-sad-l03
      title: StatQuest — Pearson’s correlation
      format: video
      angle: A dedicated video option for interpreting Pearson correlation.
      covers:
      - knowledge-sad-l03-covariance
      depth: orientation
