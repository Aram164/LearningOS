      title: Labs/Schreyer — Konvergenz, mit Landau-Notation und Quadratwurzeln am selben Ort
      format: book
      angle: The only source on this menu that puts sequences, Landau notation and square-root iteration
        in the same chapter — the same three things the script's Chapter 3 puts together.
      angle_detail: 'This is the discovery of the 2026-08-29 pass. The script''s Chapter 3 is unusual
