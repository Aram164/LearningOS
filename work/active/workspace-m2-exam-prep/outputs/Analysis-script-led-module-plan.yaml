units:
- unit:
    id: unit-m2-analysis-exam-prep
    type: unit
    module_id: module-hu-m2-statistik-analysis
    component_id: component-m2-analysis
    kind: exam-block
    title: Analysis - script-led exam preparation
    order: 100
    scope: 'Learner-selected authority: Hella Rabus, unser skript.pdf (Stand 4 February 2025), introduction
      and Chapters 1-7. Wiederholung sections are required; Ausflug sections are exam-light application
      context; Exkurs sections and Chapter 8 are deferred as non-exam material. Current local HU series
      05-09 and WV define the closest available exercise evidence. The script itself says proofs need
      not be memorized: definitions, theorem conditions/results, and application control the plan.'
    status: ready
    scope_sources:
    - source_id: source-analysis-skript
      authority: brief
      locator: 'unser skript.pdf: pp. iv-vii course contract, pp. ii-iii contents, Chapters 1-7; Stand
        04.02.2025'
    - source_id: source-analysis-skript
      authority: reference
      locator: ana_inf_serie05.pdf through serie09.pdf and ana_inf_serieWV.pdf; WiSe 2024/25 current local
        HU exercise evidence
    source_selections:
    - source_id: source-analysis-skript
      locator: unser skript.pdf Chapters 1-7 plus course series 05-09/WV and kleine_beweise disclaimer
      purpose: Primary scope, notation, theorem, example, application, and exam-style exercise authority
      stage_ids:
      - stage-m2-analysis-calibrate
      - stage-m2-analysis-an0
      - stage-m2-analysis-ana
