      attachments: []
      source_feedback: []
    - id: stage-m2-analysis-an0
      title: AN.0 - foundations and the real numbers
      status: pending
      objective: Rebuild only the prerequisites the script assumes, then make the real-number axioms,
        order, completeness, intervals, suprema/infima, powers, roots, and the computer-number excursion
        usable.
      done_when:
      - Define and use induction, intervals, absolute value, supremum, infimum, maximum, minimum, completeness,
        and the Archimedean consequence in the script's notation.
      - Solve the script examples and Serie 05 Aufgabe 5.4 without copying a proof; check boundary cases
        and distinguish supremum from maximum.
      - Summarize the Maschinenzahlen/Rundungsfehler Ausflug in five applied statements, without spending
        proof-drill time on it.
      - Pass a 15-minute closed-book gate containing one induction item, one sup/inf item, and one interval/absolute-value
        item.
      estimate_minutes: 210
      exam_critical: true
      concepts:
      - concept-real-numbers
      - concept-proof-technique
      scope_triage: required-now
      resources:
      - kind: read
        label: Main source - Chapters 1-2
        source_id: source-analysis-skript
        locator: 'unser skript.pdf: printed pp. 1-40 (PDF pp. 11-50); Exkurs none; §2.4 Ausflug at overview
          depth'
      - kind: practise
        label: Current HU sup/inf application
        source_id: source-analysis-skript
        locator: 'ana_inf_serie05.pdf: Aufgabe 5.4'
      - kind: reference
        label: Prerequisite repair only when notation or relations block the script
        source_id: source-analysis-grundlagen-handouts
        locator: 'Mengen-und-Abbildungen.pdf and Relationen.pdf: exact missing subsection only'
      - kind: practise
        label: Gentle solved companion after the HU task
