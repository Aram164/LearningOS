        locator: 'Kapitel 1 - Sprache der Analysis: matching problems only'
      working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-analysis-exam-prep/stages/stage-m2-analysis-an0/notes.md
      attachments: []
      source_feedback: []
    - id: stage-m2-analysis-ana
      title: AN.A - sequences and convergence
      status: pending
      objective: Use Chapter 3 as the spine for sequence definitions, epsilon-N work, accumulation points,
        subsequences, Cauchy sequences, monotone convergence, divergent sequences, and recursion applications.
      done_when:
      - State each Chapter 3 convergence criterion with all assumptions and select the right criterion
        for a new sequence.
      - Produce two correct epsilon-N arguments and calculate at least eight limits, including a root/rationalization,
        a recursive sequence, and a subsequence-based divergence argument.
      - Complete the current HU Serie 05-07 core tasks before opening external solutions.
      - Use kleine_beweise only to repair a failed theorem application, then explain the proof idea in
        three to five sentences rather than memorizing it.
      - Pass a 30-minute closed-book mixed sequence test and update the error ledger.
      estimate_minutes: 360
      exam_critical: true
      concepts:
      - concept-sequences-convergence
      - concept-proof-technique
      scope_triage: required-now
      resources:
      - kind: read
        label: Main source - Chapter 3
        source_id: source-analysis-skript
        locator: 'unser skript.pdf: printed pp. 41-79 (PDF pp. 51-89); §3.2 and §3.4 Exkurse reference-only;
          §3.3 and §3.8 Ausflüge at application depth'
