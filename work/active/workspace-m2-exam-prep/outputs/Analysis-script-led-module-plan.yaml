  - source_id: source-analysis-skript
    role: course-material
    why: 'Primary authority chosen by the learner: the 2025 HU script defines notation, chapter order,
      scope labels, theorem statements, examples, and the closest current HU exercise sets.'
    priority: 0
    unit_routes:
    - unit_id: unit-m2-analysis-exam-prep
      title: unser skript.pdf — the scope authority
      format: course-material
      angle: Hella Rabus's own script (Stand 04.02.2025) and the only thing that defines what is examinable.
        Its course contract (pp. iv-vii) states proofs need not be memorized — which is why definitions,
        theorem conditions/results and application drive every other choice on this menu. Wiederholung
        required; Ausflug is exam-light context; Exkurs and Chapter 8 are outside exam scope.
      covers:
      - knowledge-an-foundations
      - knowledge-an-sequences
      - knowledge-an-series
      - knowledge-an-limits-continuity
      - knowledge-an-exp-log-uniform
      - knowledge-an-differentiation
      - knowledge-an-taylor
      - knowledge-an-integration
      - knowledge-an-proof-presentation
      depth: course-aligned
      scope: current
      locator: unser skript.pdf Chapters 1-7 (contents pp. ii-iii, contract pp. iv-vii)
    - unit_id: unit-m2-analysis-exam-prep
      title: HU exercise series 05-09 + WV
      format: exercise
      angle: 'The only tasks calibrated to this script and this examiner, in HU notation. These come BEFORE
        any external bank — external sheets are other examiners asking differently. Known boundary: the
        local set stops at §5.5, so there is no HU sheet for differentiation, Taylor or integration; every
        Ch 6-7 drill on this menu is a substitute, and the 2026-08-03 audit recorded this as unresolved
        pending Moodle.'
      covers:
      - knowledge-an-foundations
      - knowledge-an-sequences
      - knowledge-an-series
      - knowledge-an-limits-continuity
      - knowledge-an-exam-transfer
      depth: practice
      scope: current
      locator: ana_inf_serie05.pdf (completeness, recursion, sup/inf), serie06 (epsilon-N, accumulation
        points), serie07 (Heron, monotone/recursive sequences), Pd3szO-ana_inf_serie08.pdf (series tests,
        function limits — Serie 08 exists only under this download-mangled name), serie09 (continuity,
        improper limits, continuous extension), ana_inf_serieWV.pdf (WV1.1-WV1.4, exam-format, 30-45 min
        per problem)
  - source_id: source-professor-leonard
    role: first-exposure
    why: Optional 20-minute intuition unlock before the script for a genuinely new topic; never substitutes
      for the HU definitions or notation.
    priority: 1
    unit_routes:
    - unit_id: unit-m2-analysis-exam-prep
      title: Professor Leonard — Calculus 1/2
      format: video
      angle: Slow blackboard teaching that does the computation in full where the script compresses to
        a result. The angle is pace. Reach for it when a cold diagnostic shows a block — a detour on one
        topic, not a parallel course.
      covers:
      - knowledge-an-sequences
      - knowledge-an-series
      - knowledge-an-limits-continuity
      - knowledge-an-differentiation
      - knowledge-an-taylor
      - knowledge-an-integration
      depth: intuition
      scope: complementary
      locator: 'Topic-matched selections: Calculus 1 (limits and continuity, the derivative, Mittelwertsatz,
        l''Hospital, the definite integral and FTC); Calculus 2 (integration techniques, improper integrals,
        sequences, series and convergence tests, Taylor and power series)'
  - source_id: source-3b1b-essence-of-calculus
    role: intuition
    why: Short visual previews for limits, derivatives, Taylor, and integration when the cold diagnostic
      exposes a missing mental picture.
    priority: 2
    unit_routes:
    - unit_id: unit-m2-analysis-exam-prep
      title: 3Blue1Brown — Essence of Calculus
      format: video
      angle: Geometric intuition, not technique. Shows why the limit, the derivative, the integral and
        the Taylor approximation are the shapes they are — useless for producing an epsilon-N argument.
        Watch, then return to the script.
      covers:
      - knowledge-an-limits-continuity
      - knowledge-an-differentiation
      - knowledge-an-taylor
      - knowledge-an-integration
      depth: intuition
      scope: complementary
      locator: 'Essence of Calculus episodes: derivative and chain rule, limits (with l''Hôpital), integration
        and the fundamental theorem, Taylor series'
  - source_id: source-fritzsche-trainingsbuch
    role: practice
    why: Gentle German worked companion after current HU tasks; Chapters 1-4 match the script sequence
      and explain solutions without becoming a second syllabus.
    priority: 3
    unit_routes:
    - unit_id: unit-m2-analysis-exam-prep
      title: Fritzsche Kap. 1 — Die Sprache der Analysis
      format: exercise
      angle: German drill with the solution reasoning written out, not just answers. Kapitel 1 is the
        prerequisite layer the script assumes — Zahlmengen, Induktion, Vollständigkeit, Funktionen. Use
        after an HU task you got wrong, when you need to see a correct write-up in the script’s vocabulary.
      covers:
      - knowledge-an-foundations
      - knowledge-an-proof-presentation
      depth: practice
      scope: complementary
      locator: fritzsche.pdf §§1.1-1.4 (pp. 9-38); Lösungen in Kap. 5 Anhang from p. 253
    - unit_id: unit-m2-analysis-exam-prep
      title: Fritzsche Kap. 2 — Der Grenzwertbegriff
      format: exercise
      angle: The same explained-solution drill for the convergence chain — Folgen, Reihen, Funktionsgrenzwerte
        — in one continuous sequence, so a series criterion is practised right after the sequence result
        it depends on.
      covers:
      - knowledge-an-sequences
      - knowledge-an-series
      - knowledge-an-limits-continuity
      depth: practice
      scope: complementary
      locator: fritzsche.pdf §2.1 Konvergenz p. 52, §2.2 Unendliche Reihen p. 68, §2.3 Grenzwerte von
        Funktionen p. 77; Lösungen from p. 253
    - unit_id: unit-m2-analysis-exam-prep
      title: Fritzsche Kap. 3 — Der Calculus
      format: exercise
      angle: 'Differentiation and integration taught as one chapter, which is exactly the script''s Ch
        6-7 pairing: derivative → Mittelwertsatz → Stammfunktion → Integrationsmethoden. Solution-backed
        German drill for the half of the syllabus the current HU sheets never reach.'
      covers:
      - knowledge-an-differentiation
      - knowledge-an-integration
      depth: practice
      scope: complementary
      locator: fritzsche.pdf §3.1 Differenzierbare Funktionen p. 116, §3.2 Der Mittelwertsatz p. 126,
        §3.3 Stammfunktionen und Integrale p. 148, §3.4 Integrationsmethoden p. 159; Lösungen from p.
