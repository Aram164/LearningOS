      source_feedback: []
    - id: stage-m2-analysis-anb
      title: AN.B - series and convergence criteria
      status: pending
      objective: Turn Chapter 4 into a decision process for necessary conditions, geometric/telescoping
        series, comparison, ratio, root, Leibniz, and absolute convergence.
      done_when:
