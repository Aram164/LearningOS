    stages:
    - id: stage-m2-analysis-calibrate
      title: Calibrate the script-led method and exam boundary
      status: pending
      objective: 'Use the agreed loop for every block: 10-minute cold diagnostic; at most 20 minutes of
        intuition support only if blocked; active pass through unser skript; solve the current HU tasks
        before external drills; repair only proofs that explain a failed application; finish with a closed-book
        retrieval test.'
      done_when:
      - 'Explain from memory how Wiederholung, Ausflug, and Exkurs change study priority: Wiederholung
        is required, Ausflug is exam-light application context, and Exkurs is not exam-relevant.'
      - Record that the script prioritizes definitions, theorem assumptions/results, and application;
        proofs are used for understanding and are not memorized as a default.
      - Read the disclaimer in kleine_beweise.pdf and treat it as a repair list, not an exam prediction.
      - Complete one 20-minute cold sample from ana_inf_serieWV.pdf and start an error ledger classified
        as definition, theorem-condition, method-choice, algebra, or time error.
      estimate_minutes: 60
      exam_critical: true
      concepts:
      - concept-proof-technique
      scope_triage: required-now
      resources:
      - kind: read
        label: Course contract, notation, and chapter map
        source_id: source-analysis-skript
        locator: 'unser skript.pdf: printed pp. iv-x and contents pp. ii-iii (PDF pp. 2-10)'
      - kind: read
        label: Tutor proof-list disclaimer and repair candidates
        source_id: source-analysis-skript
        locator: 'kleine_beweise.pdf: both pages'
      - kind: practise
        label: Cold exam-style sample before studying
        source_id: source-analysis-skript
        locator: 'ana_inf_serieWV.pdf: choose one subproblem from WV1.1-WV1.4'
