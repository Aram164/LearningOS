  sections:
    Objective: Prepare Statistik und Datenanalyse and Analysis as two independent learning modules with
      separate scope, stages, progress, and subject-only mocks. The single combined three-hour sitting
      and shared grade are handled only by `unit-m2-combined-exam-rehearsal`; the administrative facts
      remain solely in the owning M2 module record.
    Current Scope: '**Two independent subject lanes, one joint exam bridge (Aram, 2026-08-19).** Statistics
      and Analysis no longer form one merged study sequence. `unit-m2-sad-exam-prep` owns SaD.0→SaD.X;
      `unit-m2-analysis-exam-prep` owns calibrate→AN.X. Both may progress in parallel, but neither stage
      contains first-pass work from the other subject. Only after both subject-only transfer gates are
      met does `unit-m2-combined-exam-rehearsal` run the coverage blueprint, two full three-hour mocks,
      evidence-routed repair, and final taper.


      Every subject stage starts from a cold gate or uses the module-wide diagnostic. A clean gate permits
      a recorded skip; a failed gate chooses the smallest repair source. Current course material remains
      authority, exercises come before external banks, and optional books/videos are capped gap tools
      rather than second courses.


      **Administration remains shared:** registration, sitting, withdrawal, and grade facts are read only
      from `curriculum/modules/module-hu-m2-statistik-analysis/module.yaml`.'
