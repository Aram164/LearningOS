      scope: current
      locator: lecture-slides/09_estimating.pdf (45 pages)
    - unit_id: unit-m2-sad-l10
      title: Current L10 hypothesis-testing deck
      format: course-material
      angle: The complete course logic from null models and p-values through errors/power, z/t and categorical
        tests, nonparametric alternatives, confidence-interval duality, and multiple testing.
      covers:
      - knowledge-sad-l10-test-model
      - knowledge-sad-l10-tails-pvalue
      - knowledge-sad-l10-errors-power
      - knowledge-sad-l10-z-t
