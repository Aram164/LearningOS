    angle: Introduces confidence intervals on a proportion first, where the standard error has no nuisance
      parameter to estimate.
    angle_detail: By starting with a proportion, §5.2 gets to a complete interval before the reader has
      to deal with an unknown sigma, so the interpretation of 'confident' can be discussed on its own.
      Then §7.1 introduces the t-distribution specifically as the correction needed once sigma is estimated
      — which is exactly the z-versus-t decision L09 asks you to make, presented as a consequence rather
      than a rule. The repeated-interval simulation picture in §5.2 is also the standard defence against
      the classic misinterpretation the exam likes to test.
    vault_path: material://source-openintro-statistics/openintro.pdf
    scope_triage: helpful-now
