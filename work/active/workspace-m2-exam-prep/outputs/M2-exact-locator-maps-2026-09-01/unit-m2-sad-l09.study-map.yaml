  - kind: watch
    label: zedstatistics — confidence intervals
    locator: zedstatistics video 'What are confidence intervals? Actually.'
    angle: Opens with the standard misinterpretation stated plainly, then dismantles it — which is more
      memorable than stating the correct version first.
    angle_detail: 'Most treatments give the correct interpretation and warn against the wrong one in a
      footnote. Zeltzer inverts it: he states the tempting reading (''95% chance the parameter is in here''),
      shows with repeated sampling why it cannot be right, and only then gives the correct one. Since
      the misinterpretation is the examinable point, attacking it directly is the better route.'
    scope_triage: helpful-now
