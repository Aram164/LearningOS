    angle: Keeps the matrix calculus needed for backpropagation in an appendix you can consult while reading
      the chapter.
    angle_detail: Backpropagation is chain-rule bookkeeping over matrices, and the usual obstacle is not
      the idea but the notation for derivatives of vector-valued functions. Having App B in the same book,
