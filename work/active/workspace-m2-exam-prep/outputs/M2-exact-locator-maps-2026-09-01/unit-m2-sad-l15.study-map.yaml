    angle_detail: SaD compresses initialisation, learning rates, regularization and the practicalities
      of training into a handful of slides at the end of L15; AML gives them a lecture. Since both exams
      are in the same period, reading the AML deck covers SaD's training node and AML's own material simultaneously.
