  - kind: read
    label: Marsland Ch 3-4 - from the single neuron to backprop and universality
    locator: Chapter 3, pp. 60-91 and Chapter 4, pp. 92-131 (XOR p. 92; hidden layer p. 94; back-propagation
      p. 95; universal approximation p. 107)
    angle: Follows the exact L15 arc - perceptron, the XOR show-stopper, hidden layers, back-propagation
      - and is the only registered source that states the universal-approximation result the deck asserts
      on slide 36.
    angle_detail: 'Chapters 3 and 4 are the classical route into neural networks and they earn their place
      through the XOR example on p. 92: a problem a single layer provably cannot solve, followed immediately
      by the hidden layer that solves it (p. 94). That is L15''s activation node argued rather than asserted.
      Backpropagation (p. 95) is then derived and implemented, and universal approximation (p. 107) is
      stated with its caveats. Together this is the most complete L15 coverage on the shelf at course
