  - kind: read
    label: Nielsen Ch 4 — the visual proof of universal approximation
    locator: Neural Networks and Deep Learning, Ch 4 'A visual proof that neural nets can compute any
      function'
    angle: Constructs the approximation by hand — step functions built from sigmoid pairs, then summed
      into any shape.
    angle_detail: 'L15 states the universal approximation theorem. This chapter shows you how to build
      the approximation: push a sigmoid''s weight up until it becomes a step, pair two steps into a bump,
      then sum bumps to trace any curve. It is a construction rather than an existence proof, so it is
      genuinely convincing, and the interactive figures let you set the parameters yourself. The best
      hour available on L15''s universality node.'
    scope_triage: helpful-now
  - kind: read
    label: D2L — multilayer perceptrons and forward/backward propagation
    locator: Dive into Deep Learning, 'Multilayer Perceptrons', 'Implementation of Multilayer Perceptrons',
      and 'Forward Propagation, Backward Propagation, and Computational Graphs'
    angle: Implements the same network twice — from scratch and with a framework — so what the framework
      hides is explicit.
    angle_detail: The from-scratch implementation writes the forward pass and the gradients as ordinary
      array arithmetic; the concise implementation replaces them with two library calls. Seeing the pair
      is what makes the framework legible rather than magical, which matters beyond this exam given the
      thesis workstream. The forward/backward/computational-graph section draws the graph and annotates
      memory cost, explaining why activations must be stored during the forward pass.
    scope_triage: helpful-now
