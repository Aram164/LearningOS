stages:
- id: stage-sad-l15-neuron
  number: 1
  title: Artificial neurons and linear-model equivalence
  status: pending
  objective: A neuron computes an affine weighted sum followed by an activation; with the identity activation,
    a one-layer network is multivariate linear regression.
  done_when:
  - 'Reproduce without notes: A neuron computes an affine weighted sum followed by an activation; with
    the identity activation, a one-layer network is multivariate linear regression.'
  - Work Blatt 5, Aufgabe 2 — forward pass, softmax and cross-entropy, then the remaining 2, and record
    every miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-linear-regression
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L15 neural-networks deck
    locator: lecture-slides/15_neural_networks.pdf, 38 slides
    angle: Builds from a single neuron to backpropagation and closes with the CNN/RNN/Transformer outlook
      that connects SaD to AML.
    angle_detail: The deck's most useful move is starting from the observation that a single neuron with
      no activation is a linear model — which ties L15 back to L03 rather than presenting neural networks
      as a new subject. Backpropagation is stated as the chain rule applied layer by layer; the deck does
      not run a numeric example, which is the gap Karpathy's micrograd and 3Blue1Brown's episode 3 fill.
      The closing outlook slides are context, not exam material.
    scope_triage: required-now
  - kind: practise
    label: Blatt 5, Aufgabe 2 — forward pass, softmax and cross-entropy
    locator: exercise-slides/blatt-05.pdf, p. 3, Aufgabe 2(a)-(d)
    angle: 'The current by-hand neural-network task: matrix multiply, normalize outputs, calculate loss
      and interpret the decision rule.'
    angle_detail: 'This is a current assessed sheet: attempt it before opening the tutorial solution.
      It is scope evidence because it shows the chair''s own wording, data size and expected amount of
      working; it is not a replacement for the lecture derivation.'
    vault_path: material://source-sad-ss26-lectures/exercise-slides/blatt-05.pdf
    scope_triage: required-now
  - kind: practise
    label: UE6, slides 39-68 — neurons, forward pass, softmax and loss
    locator: exercise-slides/UE6.pdf, slides 39-68
    angle: Works the network as explicit matrices before discussing training, preventing the architecture
      from becoming a black box.
    angle_detail: 'This is the current worked tutorial for the named task. Use it after an unaided attempt:
      its value is the course''s calculation order and notation, while reading it first would turn an
      exam-relevant retrieval task into passive recognition.'
    vault_path: material://source-sad-ss26-lectures/exercise-slides/UE6.pdf
    scope_triage: required-now
  - kind: reference
    label: 2025 neural networks Part 1 — affine models, outputs and SGD
    locator: 14_neural_nets_part1.pdf, slides 8-89
    angle: Spends a full session on the one-layer network, softmax outputs and gradient-descent setup
      that 2026 compresses.
    angle_detail: Part 1 is the slower course-level bridge from affine transformations to a trainable
      classifier. It is especially useful when matrix shapes or the distinction between logits and probabilities
      is the problem. It predates the current deck, so it elaborates but never defines 2026 scope.
    vault_path: material://source-sad-2025-recordings/14_neural_nets_part1.pdf
    scope_triage: reference-only
  - kind: read
    label: Kelleher Chapter 7 — error-based learning and neural networks
    locator: Ch 7 Error-based Learning, pdf pp. 351-424 (the multi-layer network and backpropagation sections)
    angle: Arrives at neural networks by extending the linear model of L03 rather than by starting over
      — the same route L15's first slides take.
    angle_detail: Because Kelleher's Ch 7 is one continuous argument from simple linear regression to
      multi-layer networks, the continuity L15 asserts on its opening slide (a neuron without an activation
      is a linear model) is the chapter's actual structure. Reading it in order makes backpropagation
      feel like the same gradient descent applied through more layers, which is the correct impression
      and not the one a standalone treatment gives.
    vault_path: material://source-kelleher-fmlpda/kelleher.pdf
    scope_triage: helpful-now
  - kind: read
    label: ISLP §§10.1–10.2 — gentle neural-network introduction
    locator: Ch 10 Deep Learning, pdf pp. 406-462 (§10.1 single layer neural networks p. 407; §10.2 multilayer
      neural networks p. 409; Ch 10 lab p. 439)
    angle: Written for readers who already know linear regression, so every neural-network idea is introduced
      as a modification of something familiar.
    angle_detail: '§10.1 literally begins by writing a single-layer network as a linear model with a nonlinear
      transformation of derived features, which is L15''s own opening claim made precise. For a reader
      coming from L03 rather than from a deep-learning course, this is the least disorienting introduction
      on the shelf. It is also the shallowest: no backpropagation derivation, and the training discussion
      is brief. Pair with Marsland Ch 4 or Nielsen Ch 2 for the gradient work.'
    vault_path: material://source-islp/islp.pdf
    scope_triage: helpful-now
  - kind: read
    label: Nielsen Ch 1-2 — one network, built and then differentiated
    locator: Neural Networks and Deep Learning, Ch 1 'Using neural nets to recognize handwritten digits'
      and Ch 2 'How the backpropagation algorithm works'
    angle: Reduces backpropagation to four equations, states them, then proves each — the most learnable
      decomposition of the algorithm available.
    angle_detail: Ch 2's device is to name four equations (the output-layer error, the error recursion
      backwards through a layer, and the two parameter-gradient formulas) and treat everything else as
      consequence. That gives you four things to remember instead of a derivation to reproduce, and each
      is short enough to check. Ch 1 first builds the network on a real digit-recognition task so the
      abstractions have a referent. Free, and Ch 4's visual proof of universal approximation is the best
      available treatment of L15's universality node.
    scope_triage: helpful-now
  - kind: read
    label: MIT 6.036 — neural network units
    locator: MIT 6.036 Fall 2020 OCW, Unit 7 'Neural Networks' and Unit 8 'Backpropagation', with their
      exercises
    angle: Small numeric forward and backward passes with instant grading — the fastest way to find out
      whether the mechanics are right.
    angle_detail: The L15 failure mode is believing you can do a forward pass until you try one and get
      the shapes wrong. These exercises are sized for that check and grade immediately, so an error is
      caught in seconds rather than at the end of a written derivation. Pair with the SaD Übungen, which
      set the same kind of task in the course's own notation.
    scope_triage: helpful-now
  - kind: read
    label: Prince Ch 3-4 — shallow and deep networks, illustrated
    locator: Understanding Deep Learning, Ch 3 'Shallow Neural Networks' and Ch 4 'Deep Neural Networks',
      including the linked chapter notebooks
    angle: Shows a ReLU network as a function made of linear pieces, and counts how many pieces depth
      buys — a concrete answer to why depth helps.
    angle_detail: Prince's figures draw the input space partitioned into linear regions and show the count
      growing with depth far faster than with width. That converts 'deeper networks are more expressive'
      from a slogan into a countable claim, which is what L15's universality and outlook nodes are reaching
      for. The illustrations are the best in any book on this shelf, and the PDF is free from the author's
      site.
    scope_triage: helpful-now
  - kind: watch
    label: StatQuest — neural networks and backpropagation
    locator: '''Neural Networks Part 1 — Inside the Black Box''; ''Backpropagation Main Ideas''; ''Stochastic
      Gradient Descent, Clearly Explained'' (≈15-20 min each)'
    angle: Shows activation functions being scaled and summed into an arbitrary curve — the mechanical
      basis of universal approximation.
    angle_detail: Part 1's central demonstration is that two hidden units with a soft activation can be
      weighted and added to produce a bent curve fitting the data, built up piece by piece on screen.
      That is L15's universality node made visible without any theorem. The backpropagation video then
      updates one weight at a time with the numbers shown, and the SGD video explains why the gradient
      is estimated on a batch rather than the full data — a practical point L15 lists without motivating.
    scope_triage: helpful-now
  - kind: practise
    label: MIT 6.034 quizzes — neural-network tracing
    locator: MIT6_034F10_quiz3_2010.pdf, Fall 2010 Quiz 3, Problem 2 Parts A-C 'Neural Networks'
    angle: Small networks traced numerically under exam conditions, including weight updates.
    angle_detail: 'The same procedural virtue as the tree questions: execute the computation, show the
      state. For L15 that means a forward pass with given weights, a loss, and one update step — which
      is the realistic scope of a neural-network exam question in a combined three-hour paper.'
    scope_triage: helpful-now
  - kind: watch
    label: 3Blue1Brown — Neural Networks playlist
    locator: 'Episodes 1-4: ''But what is a neural network?'', ''Gradient descent, how neural networks
      learn'', ''What is backpropagation really doing?'', ''Backpropagation calculus'' (≈15-20 min each)'
    angle: Episode 3 shows backpropagation as each training example 'voting' on how every weight should
      change — the intuition before the calculus.
    angle_detail: 'The four episodes are deliberately staged: what the network computes, what the loss
      surface looks like, what backpropagation is doing conceptually, and only then the chain-rule algebra
      in episode 4. Watching 1-3 before reading any derivation is the highest-return hour available for
      L15, because the derivation is bookkeeping once the picture exists. Episode 4 maps directly onto
      the deck''s gradient slides.'
    scope_triage: helpful-now
  - kind: read
    label: Geron Ch 10 - MLP shapes and outputs made concrete
    locator: Chapter 10, pp. 303-350
    angle: 'Gives the L15 forward pass an executable form: layer widths, parameter counts, activation
      choice and the output/loss pairing for regression, binary and multiclass targets that the deck states
      as a table.'
    angle_detail: 'Forty-eight pages that make network shapes concrete: how many parameters a given architecture
      has, what the output layer must look like for binary, multiclass and regression targets, and how
      the loss must match the output. That is precisely what L15''s forward-pass and output nodes cover,
      and precisely what the SaD Übungen ask you to compute. Working through the shapes here is direct
      exam preparation.'
    vault_path: material://source-geron-handson/geron.pdf
    scope_triage: helpful-now
  - kind: read
    label: Marsland Ch 3-4 - from the single neuron to backprop and universality
    locator: Chapter 3, pp. 60-91 and Chapter 4, pp. 92-131 (XOR p. 92; hidden layer p. 94; back-propagation
      p. 95; universal approximation p. 107)
    angle: Follows the exact L15 arc - perceptron, the XOR show-stopper, hidden layers, back-propagation
      - and is the only registered source that states the universal-approximation result the deck asserts
      on slide 36.
    angle_detail: 'Chapters 3 and 4 are the classical route into neural networks and they earn their place
      through the XOR example on p. 92: a problem a single layer provably cannot solve, followed immediately
      by the hidden layer that solves it (p. 94). That is L15''s activation node argued rather than asserted.
      Backpropagation (p. 95) is then derived and implemented, and universal approximation (p. 107) is
      stated with its caveats. Together this is the most complete L15 coverage on the shelf at course
      level.'
    scope_triage: helpful-now
  - kind: read
    label: Brandon Rohrer — friendly neural-network explanation
    locator: The 'How neural networks work' article and companion video on e2eml.school
    angle: Builds a tiny network out of explicit arithmetic with no calculus at all.
    angle_detail: Every quantity is a small number and every step is an addition or a multiplication,
      which removes the notation barrier entirely. Useful as a first contact or as a reset if the gradients
      have become symbol-pushing. The trade-off is that it stops well before anything examinable — follow
      it with 3Blue1Brown episode 4 or Marsland Ch 4.
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l15/stages/stage-sad-l15-neuron/notes.md
  attachments: []
  source_feedback: []
