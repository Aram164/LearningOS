  - kind: watch
    label: 3Blue1Brown — the chain rule, which is all backpropagation is
    locator: Essence of Calculus episode 4 ('Visualizing the chain rule and product rule')
    angle: Makes the chain rule a statement about how one small nudge propagates, which is exactly the
      quantity backpropagation computes.
    angle_detail: Backpropagation is the chain rule applied repeatedly, so if the chain rule is a symbolic
      manipulation rather than a claim about how a change in one quantity affects another downstream,
      the derivation cannot mean anything. This episode fixes that in fifteen minutes, and it is the natural
      companion to the neural-network playlist's episode 4, which assumes it.
    scope_triage: helpful-now
  - kind: reference
    label: 2025 neural networks Part 2 — loss landscape, gradients and depth
