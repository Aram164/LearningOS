- id: stage-sad-l15-universality
  number: 7
  title: Expressiveness and universal approximation
  status: pending
  objective: Sufficiently wide nonlinear networks can approximate broad function classes, but the theorem
    does not guarantee efficient learning, good generalization, or a practical architecture.
  done_when:
  - 'Reproduce without notes: Sufficiently wide nonlinear networks can approximate broad function classes,
    but the theorem does not guarantee efficient learning, good generalization, or a practical architecture.'
  exam_critical: true
  concepts:
  - concept-universal-approximation
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L15 neural-networks deck
    locator: lecture-slides/15_neural_networks.pdf, 38 slides
    angle: Builds from a single neuron to backpropagation and closes with the CNN/RNN/Transformer outlook
      that connects SaD to AML.
    angle_detail: The deck's most useful move is starting from the observation that a single neuron with
      no activation is a linear model — which ties L15 back to L03 rather than presenting neural networks
      as a new subject. Backpropagation is stated as the chain rule applied layer by layer; the deck does
      not run a numeric example, which is the gap Karpathy's micrograd and 3Blue1Brown's episode 3 fill.
      The closing outlook slides are context, not exam material.
    scope_triage: required-now
  - kind: reference
    label: 2025 neural networks Part 2 — loss landscape, gradients and depth
    locator: 15_neural_nets_part2.pdf, slides 2-223
    angle: Provides the course's most detailed treatment of cross-entropy, gradient computation, nonlinear
      depth and XOR.
    angle_detail: 'Part 2 follows one loss landscape through partial derivatives and weight updates before
      showing why hidden nonlinearities solve problems a one-layer classifier cannot. It is much longer
      than the current lecture: use only the section matching a recorded gap, and check terminology against
      the 2026 deck.'
    vault_path: material://source-sad-2025-recordings/15_neural_nets_part2.pdf
    scope_triage: reference-only
  - kind: read
    label: Nielsen Ch 4 — the visual proof of universal approximation
    locator: Neural Networks and Deep Learning, Ch 4 'A visual proof that neural nets can compute any
      function'
    angle: Constructs the approximation by hand — step functions built from sigmoid pairs, then summed
      into any shape.
    angle_detail: 'L15 states the universal approximation theorem. This chapter shows you how to build
      the approximation: push a sigmoid''s weight up until it becomes a step, pair two steps into a bump,
      then sum bumps to trace any curve. It is a construction rather than an existence proof, so it is
      genuinely convincing, and the interactive figures let you set the parameters yourself. The best
      hour available on L15''s universality node.'
    scope_triage: helpful-now
  - kind: read
    label: Prince Ch 3-4 — shallow and deep networks, illustrated
    locator: Understanding Deep Learning, Ch 3 'Shallow Neural Networks' and Ch 4 'Deep Neural Networks',
      including the linked chapter notebooks
    angle: Shows a ReLU network as a function made of linear pieces, and counts how many pieces depth
      buys — a concrete answer to why depth helps.
    angle_detail: Prince's figures draw the input space partitioned into linear regions and show the count
      growing with depth far faster than with width. That converts 'deeper networks are more expressive'
      from a slogan into a countable claim, which is what L15's universality and outlook nodes are reaching
      for. The illustrations are the best in any book on this shelf, and the PDF is free from the author's
      site.
    scope_triage: helpful-now
  - kind: reference
    label: Goodfellow Ch 6 — deep feedforward networks
    locator: 'Deep Learning online book, Ch 6 ''Deep Feedforward Networks'': §6.1 XOR, §6.2 gradient-based
      learning, §6.3 hidden units, and §6.5 back-propagation'
    angle: Explains why the output unit and the loss function must be chosen together, deriving each pairing
      from maximum likelihood.
    angle_detail: '§6.2 is the section worth the visit: sigmoid with cross-entropy, softmax with categorical
      cross-entropy, and linear with squared error are not conventions but consequences of writing the
      negative log-likelihood for the corresponding output distribution. L15''s output-layer node presents
      the pairings as facts. This also explains the vanishing-gradient problem that arises when the wrong
      pairing is used. Reference-level density; read the section, not the chapter.'
    scope_triage: reference-only
  - kind: read
    label: Marsland Ch 3-4 - from the single neuron to backprop and universality
    locator: Chapter 3, pp. 60-91 and Chapter 4, pp. 92-131 (XOR p. 92; hidden layer p. 94; back-propagation
      p. 95; universal approximation p. 107)
    angle: Follows the exact L15 arc - perceptron, the XOR show-stopper, hidden layers, back-propagation
      - and is the only registered source that states the universal-approximation result the deck asserts
      on slide 36.
    angle_detail: 'Chapters 3 and 4 are the classical route into neural networks and they earn their place
      through the XOR example on p. 92: a problem a single layer provably cannot solve, followed immediately
      by the hidden layer that solves it (p. 94). That is L15''s activation node argued rather than asserted.
      Backpropagation (p. 95) is then derived and implemented, and universal approximation (p. 107) is
      stated with its caveats. Together this is the most complete L15 coverage on the shelf at course
      level.'
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l15/stages/stage-sad-l15-universality/notes.md
  attachments: []
  source_feedback: []
