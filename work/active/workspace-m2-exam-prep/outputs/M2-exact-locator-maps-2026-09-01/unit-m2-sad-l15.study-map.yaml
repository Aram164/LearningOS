    scope_triage: helpful-now
  - kind: reference
    label: Goodfellow Ch 6 — deep feedforward networks
    locator: 'Deep Learning online book, Ch 6 ''Deep Feedforward Networks'': §6.1 XOR, §6.2 gradient-based
      learning, §6.3 hidden units, and §6.5 back-propagation'
    angle: Explains why the output unit and the loss function must be chosen together, deriving each pairing
      from maximum likelihood.
    angle_detail: '§6.2 is the section worth the visit: sigmoid with cross-entropy, softmax with categorical
      cross-entropy, and linear with squared error are not conventions but consequences of writing the
      negative log-likelihood for the corresponding output distribution. L15''s output-layer node presents
      the pairings as facts. This also explains the vanishing-gradient problem that arises when the wrong
      pairing is used. Reference-level density; read the section, not the chapter.'
    scope_triage: reference-only
  - kind: reference
    label: AML L08–L09 — feedforward networks and training
    locator: lecture-slides/VL 08-feedforward-neural-network.pdf and VL 09-training-neural-networks.pdf
    angle: The AML treatment of the same networks, with a whole deck devoted to training rather than a
      summary slide.
    angle_detail: SaD compresses initialisation, learning rates, regularization and the practicalities
      of training into a handful of slides at the end of L15; AML gives them a lecture. Since both exams
      are in the same period, reading the AML deck covers SaD's training node and AML's own material simultaneously.
      AML L09 owns the neural-network regularization material and does not cover batch normalization —
      a distinction already recorded in this repository's wiring notes.
    scope_triage: reference-only
  - kind: practise
    label: Cornell CS4780 HW9 — neural networks and ReLU
    locator: 2018Fall/HW9 and 2018Spring/HW9 (neural networks and ReLU), with the published solutions
    angle: Forward and backward passes computed by hand on small networks, with the answers to check against.
    angle_detail: Hand computation is the only reliable test of whether backpropagation is understood,
      and these sets provide it at the right scale — networks small enough to finish, large enough to
      require the bookkeeping. The ReLU problems also make the non-differentiability at zero explicit,
      which the deck passes over.
    scope_triage: helpful-now
