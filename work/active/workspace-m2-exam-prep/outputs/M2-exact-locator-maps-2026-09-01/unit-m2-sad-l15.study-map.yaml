      framing; §9 Gradient Descent printed p. 53
    angle: Compact backprop reference with explicit matrix shapes at every step.
    angle_detail: 'The network appears twice in these notes, once as nonlinear regression (§3.3) and once
      as classification (§8.3), and reading both is the point: it is the same architecture with a different
      output layer and a different loss, which is precisely the pairing L15 asserts. Every step carries
      explicit matrix shapes, so this is the reference to reach for when a derivation is right in principle
      and does not conform.'
    vault_path: material://source-csc411-notes/csc411.pdf
    scope_triage: reference-only
  - kind: reference
    label: AML L08–L09 — feedforward networks and training
    locator: lecture-slides/VL 08-feedforward-neural-network.pdf and VL 09-training-neural-networks.pdf
    angle: The AML treatment of the same networks, with a whole deck devoted to training rather than a
