  - kind: read
    label: Kelleher Chapter 7 — error-based learning and neural networks
    locator: Ch 7 Error-based Learning, pdf pp. 351-424 (the multi-layer network and backpropagation sections)
    angle: Arrives at neural networks by extending the linear model of L03 rather than by starting over
      — the same route L15's first slides take.
    angle_detail: Because Kelleher's Ch 7 is one continuous argument from simple linear regression to
      multi-layer networks, the continuity L15 asserts on its opening slide (a neuron without an activation
      is a linear model) is the chapter's actual structure. Reading it in order makes backpropagation
      feel like the same gradient descent applied through more layers, which is the correct impression
      and not the one a standalone treatment gives.
    vault_path: material://source-kelleher-fmlpda/kelleher.pdf
    scope_triage: helpful-now
  - kind: watch
    label: Karpathy — micrograd, backpropagation spelled out
    locator: '''The spelled-out intro to neural networks and backpropagation: building micrograd'' (≈2h25m);
      the derivative and backward-pass segments are the first half'
    angle: Writes an autograd engine line by line, so the chain rule becomes a local rule attached to
      each operation.
    angle_detail: The insight the video delivers is that backpropagation is not a formula for a network
      — it is a small local rule per operation, composed by the graph. Once each node knows how to pass
      gradient to its inputs, networks of any shape work with no new mathematics. That reframing is what
      makes L15's derivation feel inevitable rather than intricate. Long, and requires following along
      in code to get the benefit; treat it as an afternoon, not a lookup.
    scope_triage: helpful-now
  - kind: read
    label: Nielsen Ch 1-2 — one network, built and then differentiated
    locator: Neural Networks and Deep Learning, Ch 1 'Using neural nets to recognize handwritten digits'
      and Ch 2 'How the backpropagation algorithm works'
    angle: Reduces backpropagation to four equations, states them, then proves each — the most learnable
      decomposition of the algorithm available.
    angle_detail: Ch 2's device is to name four equations (the output-layer error, the error recursion
      backwards through a layer, and the two parameter-gradient formulas) and treat everything else as
      consequence. That gives you four things to remember instead of a derivation to reproduce, and each
      is short enough to check. Ch 1 first builds the network on a real digit-recognition task so the
      abstractions have a referent. Free, and Ch 4's visual proof of universal approximation is the best
      available treatment of L15's universality node.
    scope_triage: helpful-now
  - kind: read
    label: D2L — multilayer perceptrons and forward/backward propagation
    locator: Dive into Deep Learning, 'Multilayer Perceptrons', 'Implementation of Multilayer Perceptrons',
      and 'Forward Propagation, Backward Propagation, and Computational Graphs'
    angle: Implements the same network twice — from scratch and with a framework — so what the framework
      hides is explicit.
    angle_detail: The from-scratch implementation writes the forward pass and the gradients as ordinary
      array arithmetic; the concise implementation replaces them with two library calls. Seeing the pair
      is what makes the framework legible rather than magical, which matters beyond this exam given the
      thesis workstream. The forward/backward/computational-graph section draws the graph and annotates
      memory cost, explaining why activations must be stored during the forward pass.
    scope_triage: helpful-now
  - kind: read
    label: MML Ch 5 — vector calculus and backpropagation
    locator: 'mml-book.pdf Ch 5 Vector Calculus p. 145: §5.4 Gradients of Matrices p. 161, §5.5 Useful
      Identities for Computing Gradients p. 164, §5.6 Backpropagation and Automatic Differentiation p.
      165'
    angle: Supplies the matrix-derivative identities backpropagation uses, which every other L15 route
      assumes you already have.
    angle_detail: §5.5 is a page of matrix-derivative identities, and it is the page every other L15 route
      silently assumes you already have — Nielsen, CS229 and the deck all take these for granted while
      using them. Read §5.4 and §5.5 as reference rather than as study, and §5.6 only if the computational-graph
      view of backpropagation is wanted alongside the equation view.
    scope_triage: helpful-now
  - kind: read
    label: MIT 6.036 — neural network units
    locator: MIT 6.036 Fall 2020 OCW, Unit 7 'Neural Networks' and Unit 8 'Backpropagation', with their
      exercises
    angle: Small numeric forward and backward passes with instant grading — the fastest way to find out
      whether the mechanics are right.
    angle_detail: The L15 failure mode is believing you can do a forward pass until you try one and get
      the shapes wrong. These exercises are sized for that check and grade immediately, so an error is
      caught in seconds rather than at the end of a written derivation. Pair with the SaD Übungen, which
      set the same kind of task in the course's own notation.
    scope_triage: helpful-now
  - kind: reference
    label: Goodfellow Ch 6 — deep feedforward networks
    locator: 'Deep Learning online book, Ch 6 ''Deep Feedforward Networks'': §6.1 XOR, §6.2 gradient-based
      learning, §6.3 hidden units, and §6.5 back-propagation'
    angle: Explains why the output unit and the loss function must be chosen together, deriving each pairing
      from maximum likelihood.
    angle_detail: '§6.2 is the section worth the visit: sigmoid with cross-entropy, softmax with categorical
      cross-entropy, and linear with squared error are not conventions but consequences of writing the
      negative log-likelihood for the corresponding output distribution. L15''s output-layer node presents
      the pairings as facts. This also explains the vanishing-gradient problem that arises when the wrong
      pairing is used. Reference-level density; read the section, not the chapter.'
    scope_triage: reference-only
  - kind: watch
    label: StatQuest — neural networks and backpropagation
    locator: '''Neural Networks Part 1 — Inside the Black Box''; ''Backpropagation Main Ideas''; ''Stochastic
      Gradient Descent, Clearly Explained'' (≈15-20 min each)'
    angle: Shows activation functions being scaled and summed into an arbitrary curve — the mechanical
      basis of universal approximation.
    angle_detail: Part 1's central demonstration is that two hidden units with a soft activation can be
      weighted and added to produce a bent curve fitting the data, built up piece by piece on screen.
      That is L15's universality node made visible without any theorem. The backpropagation video then
      updates one weight at a time with the numbers shown, and the SGD video explains why the gradient
      is estimated on a batch rather than the full data — a practical point L15 lists without motivating.
    scope_triage: helpful-now
  - kind: read
    label: Kroese — neural-network reference
    locator: Ch 9 Deep Learning, pdf pp. 341-372; App B Multivariate Differentiation and Optimization,
