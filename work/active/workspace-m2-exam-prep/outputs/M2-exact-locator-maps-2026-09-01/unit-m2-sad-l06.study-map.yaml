- id: stage-sad-l06-random-variable
  number: 1
  title: Random variables and realizations
  status: pending
  objective: A random variable maps outcomes to numbers; the variable, a realized value, and the underlying
    random experiment are distinct objects.
  done_when:
  - 'Reproduce without notes: A random variable maps outcomes to numbers; the variable, a realized value,
    and the underlying random experiment are distinct objects.'
  - Work UE4, slides 18-34 — random variables, moments and LLN, and record every miss with the step it
    failed at.
  exam_critical: true
  concepts:
  - concept-random-variable
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L06 random-variables deck
    locator: lecture-slides/06_random_variables.pdf, 60 slides
    angle: The scope authority for random-variable language, and the deck that introduces PMF, density
      and CDF in a single pass.
    angle_detail: Sixty slides covering random variables, all three distribution functions, transformations,
      expectation, variance, covariance, the sample mean, Chebyshev and the law of large numbers. The
      single-pass treatment of PMF versus density is where most confusion starts — Fahrmeir separates
      them by chapter and is the standard repair. Chebyshev and the LLN at the end are the bridge into
      L08 and are examinable in their own right.
    scope_triage: required-now
  - kind: practise
    label: UE4, slides 18-34 — random variables, moments and LLN
    locator: exercise-slides/UE4.pdf, slides 18-34
    angle: Uses one discrete and one mixed random variable to connect the definitions to empirical convergence.
    angle_detail: 'This is the current worked tutorial for the named task. Use it after an unaided attempt:
      its value is the course''s calculation order and notation, while reading it first would turn an
      exam-relevant retrieval task into passive recognition.'
    vault_path: material://source-sad-ss26-lectures/exercise-slides/UE4.pdf
    scope_triage: required-now
  - kind: reference
    label: 2025 random-variables and expected-values pair
    locator: 06_expected_values.pptx-1.pdf
    angle: A prior-year deck devoted specifically to expected values, in more detail than the 2026 pass.
    angle_detail: Because 2025 split this material differently, expectation gets a whole deck rather than
      a section, which makes it a slower and more worked-through treatment of L06's central node. One
      of the more useful prior-year files for that reason.
    scope_triage: reference-only
  - kind: read
    label: Fahrmeir Chapters 5–7 — random variables and moments
    locator: Ch 5 §5.1 Zufallsvariablen, pdf pp. 243-246; §5.2 Verteilungen und Parameter diskreter ZV,
      pdf pp. 247-269; Ch 6 §6.1 Definition und Verteilung, pdf pp. 289-300; §6.2 Lageparameter, Quantile,
      Varianz, pdf pp. 301-309; Ch 7 §7.1 Gesetz der großen Zahlen, pdf pp. 330-336; Ch 8 §8.5 Kovarianz
      und Korrelation, pdf pp. 368-374
    angle: Keeps discrete and continuous random variables in separate chapters, so PMF and density are
      never conflated the way a single merged treatment can.
    angle_detail: 'L06 introduces PMF, density and CDF together in one pass. Fahrmeir separates them by
      chapter, which is slower but makes the one exam-relevant distinction unmissable: P(X=x) is a probability
      in Ch 5 and is identically zero in Ch 6, where only intervals have probability. §8.5 supplies the
      covariance definition L06 needs and connects it back to the descriptive covariance of Ch 3, so the
      same symbol is not learned twice. §7.1 is the German statement of Tschebyscheff and the Gesetz der
      großen Zahlen; read it here rather than in an English text if the exam wording matters.'
    vault_path: material://source-fahrmeir-statistik/statistik.pdf
    scope_triage: helpful-now
  - kind: read
    label: Blitzstein Chapters 3–4 and 10 — RVs and expectation
    locator: Ch 3 pdf pp. 120-165 (§3.2 distributions and PMFs p. 123; §3.6 CDFs p. 137; §3.7 functions
      of random variables p. 140; §3.8 independence of r.v.s p. 146); Ch 4 pdf pp. 166-229 (§4.1 definition
      of expectation p. 166; §4.2 linearity p. 169; §4.5 LOTUS p. 187; §4.6 variance p. 188); Ch 7 §7.3
      covariance and correlation, pdf pp. 343-348
    angle: Insists on the distinction between a random variable and its distribution, and proves linearity
      of expectation without independence.
    angle_detail: Two things here are worth the reading time. First, §3.1-3.2 hammer that a random variable
      is a function on the sample space while its distribution is a separate object — the confusion behind
      most wrong answers about transformations, and something L06 states once. Second, §4.2 proves that
      E[X+Y] = E[X] + E[Y] holds whether or not X and Y are independent, and shows why that is surprising;
      the lecture asserts linearity, and knowing it needs no independence is what makes it a tool. §4.5
      (LOTUS) is the rule for E[g(X)] that the transformations node depends on. Skip the MGF sections
      in Ch 6 — out of scope.
    vault_path: material://source-blitzstein-hwang/blitzstein.pdf
    scope_triage: helpful-now
  - kind: read
    label: MIT 6.041SC — random variables, expectation and variance lectures
    locator: Lectures 5-7 (discrete random variables, expectation, multiple random variables) with recitations
      and tutorials
    angle: Insists on the distinction between a random variable and a numerical value throughout, with
      notation discipline the deck does not enforce.
    angle_detail: The course is unusually strict about writing X for the variable and x for a value, and
      about what it means to condition a random variable on an event. That discipline is what makes later
      manipulations safe, and it is the habit most often missing when students find transformations confusing.
      Recorded lectures make it easy to see the distinction being applied rather than merely stated.
    scope_triage: helpful-now
  - kind: read
    label: OpenIntro Chapter 4 — distribution bridge
    locator: Ch 3 §3.4 random variables, pdf pp. 115-124; §3.5 continuous distributions, pdf pp. 125-130
    angle: Ten pages on random variables with expectation and variance introduced through an expected-profit
      calculation rather than through a definition.
    angle_detail: '§3.4 defines E[X] by working out the expected revenue of a lottery-like setup and then
      naming the computation, which makes the linearity property feel like an accounting fact. That is
      a lighter entry than Blitzstein''s Ch 4 and enough for L06''s expectation node, but it stops well
      short: no LOTUS, no covariance, no Chebyshev. Use it to get started and switch to Blitzstein or
      Dekking for the transformation and concentration nodes.'
    vault_path: material://source-openintro-statistics/openintro.pdf
    scope_triage: helpful-now
  - kind: reference
    label: Ross — random-variable theory
    locator: Ch 4 Random Variables, pdf pp. 198-305 (§4.3 expected value; §4.4 expectation of a function
      of a random variable; §4.5 variance; §4.10 properties of the cumulative distribution function);
      Ch 7 §7.2 expectation of sums, pdf pp. 478-500
    angle: Proves the variance identity Var(X) = E[X²] − (E[X])², which is the computational form every
      exercise actually uses.
    angle_detail: The definition of variance is an expected squared deviation; almost every calculation
      uses the shortcut identity instead. Ross derives the identity from the definition rather than presenting
      it as an alternative formula, which is worth seeing once so that the shortcut is a theorem you can
      reconstruct rather than a rule you hope you remember. §4.4 is the general expectation-of-a-function
      rule that L06's transformations node needs; §4.10 gives the CDF its own properties list.
    vault_path: material://source-ross-first-course/ross.pdf
    scope_triage: reference-only
  - kind: reference
    label: Harvard Stat 110 Units 3–4 — RVs and expectation
    locator: Lectures 5-9 (random variables and their distributions, expectation, indicator random variables,
      LOTUS, variance)
    angle: Builds expectation around indicator variables, a technique that makes several otherwise hard
      computations trivial.
    angle_detail: The 'fundamental bridge' — that the expectation of an indicator is the probability of
      its event — plus linearity without independence lets you compute means of complicated counts by
      decomposition. L06 never mentions it, but once seen it is the fastest route through a large class
      of exercises, and it makes linearity feel like a tool rather than an identity. Lectures run 45-50
      minutes each; this is a five-lecture commitment, so choose it only if L06 is a topic you intend
      to be strong on.
    scope_triage: reference-only
  - kind: reference
    label: Regensburg-Löh pp. 2-5 — rigorous probability-space reference
    locator: Regensburg-Loeh_WTheorie-Statistik_Klausur_mit-Loesungen.pdf, pp. 2-5, Aufgaben 1-2
    angle: Shows the measure-theoretic formulation behind random variables and convergence, far beyond
      the course's computational level.
    angle_detail: 'This is not normal L06 practice: sigma-algebras and proof questions assume a rigorous
      probability course. It is retained so the owned file is visible and can answer a formal-definition
      question, but it should never displace Fahrmeir, Blitzstein or the current exercises.'
    vault_path: material://source-sad-klausuren-extern/Regensburg-Loeh_WTheorie-Statistik_Klausur_mit-Loesungen.pdf
    scope_triage: reference-only
  - kind: watch
    label: Kurzes Tutorium Statistik — Zufallsvariablen and Erwartungswert
    locator: '''Zufallsvariablen''; ''Erwartungswert''; ''Varianz'''
    angle: The German names and notation for L06's objects, with the symbols the Klausur prints.
    angle_detail: E(X) versus μ, Var(X) versus σ², and the German phrasing of the linearity rules. Short
      and purely terminological — the concepts should come from Blitzstein or Dekking, but the words should
      come from here if the exam wording has ever cost you time.
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l06/stages/stage-sad-l06-random-variable/notes.md
