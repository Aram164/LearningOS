    label: StatQuest — expected values and probability distributions
    locator: '''Expected Values, Main Ideas''; ''Expected Values for Continuous Variables''; ''The Main
      Ideas behind Probability Distributions'' (≈10-15 min each)'
    angle: Handles the discrete-to-continuous transition visually — the histogram narrowing into a density
      — which is where L06's PMF/PDF distinction is usually lost.
    angle_detail: 'The two expected-value videos are deliberately a pair: the same quantity computed as
      a weighted sum, then as an integral, with the bars of the histogram shrinking on screen between
      them. That animation is the single most useful thing here, because it makes the sum-to-integral
      move a continuous change rather than two unrelated formulas. Watch them in order.'
    scope_triage: helpful-now
