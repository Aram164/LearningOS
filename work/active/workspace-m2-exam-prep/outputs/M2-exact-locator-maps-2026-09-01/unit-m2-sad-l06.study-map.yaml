  - kind: reference
    label: 2025 random-variables and expected-values pair
    locator: 06_expected_values.pptx-1.pdf
    angle: A prior-year deck devoted specifically to expected values, in more detail than the 2026 pass.
    angle_detail: Because 2025 split this material differently, expectation gets a whole deck rather than
      a section, which makes it a slower and more worked-through treatment of L06's central node. One
      of the more useful prior-year files for that reason.
    scope_triage: reference-only
  - kind: read
    label: Fahrmeir Chapters 5–7 — random variables and moments
    locator: Ch 5 §5.1 Zufallsvariablen, pdf pp. 243-246; §5.2 Verteilungen und Parameter diskreter ZV,
      pdf pp. 247-269; Ch 6 §6.1 Definition und Verteilung, pdf pp. 289-300; §6.2 Lageparameter, Quantile,
      Varianz, pdf pp. 301-309; Ch 7 §7.1 Gesetz der großen Zahlen, pdf pp. 330-336; Ch 8 §8.5 Kovarianz
      und Korrelation, pdf pp. 368-374
    angle: Keeps discrete and continuous random variables in separate chapters, so PMF and density are
      never conflated the way a single merged treatment can.
    angle_detail: 'L06 introduces PMF, density and CDF together in one pass. Fahrmeir separates them by
      chapter, which is slower but makes the one exam-relevant distinction unmissable: P(X=x) is a probability
      in Ch 5 and is identically zero in Ch 6, where only intervals have probability. §8.5 supplies the
      covariance definition L06 needs and connects it back to the descriptive covariance of Ch 3, so the
      same symbol is not learned twice. §7.1 is the German statement of Tschebyscheff and the Gesetz der
      großen Zahlen; read it here rather than in an English text if the exam wording matters.'
    vault_path: material://source-fahrmeir-statistik/statistik.pdf
    scope_triage: helpful-now
  - kind: practise
    label: Arbeitsbuch Chapters 5–7 — RV and moment drills
    locator: Ch 5 Aufgaben pdf pp. 96-104, Lösungen pdf pp. 105-123; Ch 6 Aufgaben pdf pp. 124-133, Lösungen
      pdf pp. 134-157; Ch 7 Aufgaben pdf pp. 158-160, Lösungen pdf pp. 161-164
    angle: Expectation and variance computed from a given distribution, over and over, in both the discrete
      and continuous chapters.
    angle_detail: 'Three chapters of solved items whose common shape is: here is a PMF or density, produce
      E[X], Var(X), and a transformed variable''s moments. That repetition is the point — L06''s linearity
      and transformation rules are only usable once applying them is automatic. Ch 7''s items are the
      Tschebyscheff and LLN calculations, which are short and worth doing because they are the easiest
      marks in this part of the exam.'
    vault_path: material://source-fahrmeir-arbeitsbuch/arbeitsbuch.pdf
    scope_triage: helpful-now
  - kind: read
    label: Grinstead & Snell Ch 6 — expected value and variance
    locator: Official PDF, Ch 6 'Expected Value and Variance', §§6.1-6.3, PDF pp. 233-292
    angle: Separates the discrete and continuous cases into their own sections while keeping one chapter,
      so the parallel between sum and integral stays visible.
    angle_detail: Splitting by chapter (as Fahrmeir does) makes the PMF/PDF distinction unmissable but
      hides the analogy; merging them (as L06 does) shows the analogy but blurs the distinction. This
      chapter's three-section structure gets both — the definitions are stated separately and then compared
      directly. Good middle route if Fahrmeir felt slow and the deck felt fast.
    scope_triage: helpful-now
  - kind: read
    label: Blitzstein Chapters 3–4 and 10 — RVs and expectation
    locator: Ch 3 pdf pp. 120-165 (§3.2 distributions and PMFs p. 123; §3.6 CDFs p. 137; §3.7 functions
      of random variables p. 140; §3.8 independence of r.v.s p. 146); Ch 4 pdf pp. 166-229 (§4.1 definition
      of expectation p. 166; §4.2 linearity p. 169; §4.5 LOTUS p. 187; §4.6 variance p. 188); Ch 7 §7.3
      covariance and correlation, pdf pp. 343-348
    angle: Insists on the distinction between a random variable and its distribution, and proves linearity
      of expectation without independence.
    angle_detail: Two things here are worth the reading time. First, §3.1-3.2 hammer that a random variable
      is a function on the sample space while its distribution is a separate object — the confusion behind
      most wrong answers about transformations, and something L06 states once. Second, §4.2 proves that
      E[X+Y] = E[X] + E[Y] holds whether or not X and Y are independent, and shows why that is surprising;
      the lecture asserts linearity, and knowing it needs no independence is what makes it a tool. §4.5
      (LOTUS) is the rule for E[g(X)] that the transformations node depends on. Skip the MGF sections
      in Ch 6 — out of scope.
    vault_path: material://source-blitzstein-hwang/blitzstein.pdf
    scope_triage: helpful-now
  - kind: read
    label: MIT 6.041SC — random variables, expectation and variance lectures
    locator: Lectures 5-7 (discrete random variables, expectation, multiple random variables) with recitations
      and tutorials
    angle: Insists on the distinction between a random variable and a numerical value throughout, with
      notation discipline the deck does not enforce.
    angle_detail: The course is unusually strict about writing X for the variable and x for a value, and
      about what it means to condition a random variable on an event. That discipline is what makes later
      manipulations safe, and it is the habit most often missing when students find transformations confusing.
      Recorded lectures make it easy to see the distinction being applied rather than merely stated.
    scope_triage: helpful-now
  - kind: read
    label: OpenIntro Chapter 4 — distribution bridge
    locator: Ch 3 §3.4 random variables, pdf pp. 115-124; §3.5 continuous distributions, pdf pp. 125-130
    angle: Ten pages on random variables with expectation and variance introduced through an expected-profit
      calculation rather than through a definition.
    angle_detail: '§3.4 defines E[X] by working out the expected revenue of a lottery-like setup and then
      naming the computation, which makes the linearity property feel like an accounting fact. That is
      a lighter entry than Blitzstein''s Ch 4 and enough for L06''s expectation node, but it stops well
      short: no LOTUS, no covariance, no Chebyshev. Use it to get started and switch to Blitzstein or
      Dekking for the transformation and concentration nodes.'
    vault_path: material://source-openintro-statistics/openintro.pdf
    scope_triage: helpful-now
  - kind: practise
    label: Dekking — random-variable exercises
    locator: Ch 4 discrete random variables, pdf pp. 52-66; Ch 5 continuous random variables, pdf pp.
      67-80; Ch 7 expectation and variance, pdf pp. 98-111 (change-of-variable formula p. 103; variance
      p. 105; exercises p. 108); Ch 9 joint distributions, pdf pp. 124-143; Ch 13 §13.2 Chebyshev's inequality,
      pdf pp. 191-192
    angle: States the change-of-variable formula as its own numbered result, which is the rule L06's transformation
      node needs and states only in passing.
    angle_detail: §7.3 gives E[g(X)] = Σ g(x)p(x) the status of a named theorem with a proof sketch, and
      every later expectation computation in the book cites it. L06 uses the same rule when it computes
      moments of transformed variables but never isolates it, so it is easy to treat each computation
      as a new trick. Ch 13's Chebyshev section is three pages and directly serves the concentration node,
      with the LLN following immediately in §13.3 so the connection is visible.
    vault_path: material://source-dekking-mips/dekking.pdf
    scope_triage: helpful-now
  - kind: read
    label: MIT 18.05 — random variables, expectation, and variance
    locator: 'Classes: Reading and In-class Materials: the ''Discrete Random Variables; Expectation and
      Variance'' and ''Continuous Random Variables'' readings; Problem Sets 2-3 with solutions'
    angle: Uses R simulations alongside the algebra, so every claimed identity is also demonstrated numerically.
    angle_detail: The course's design principle is that a probabilistic claim should be checked by simulation
      before it is trusted, and the R code is published. For L06's rules — linearity, variance under scaling,
      the behaviour of a sample mean — running the simulation is a fast way to find out whether you have
      remembered the rule correctly, and it takes minutes. Also introduces quantiles carefully, which
      the lecture uses without defining.
    scope_triage: helpful-now
  - kind: reference
    label: Pitman — random variables and expectation
    locator: Ch 3 Random Variables, pdf pp. 148-268 (§3.2 Expectation p. 171; §3.3 Standard Deviation
      and Normal Approximation p. 194; §3.6 Symmetry p. 246)
    angle: Introduces expectation as the long-run average of repeated draws, with the frequency picture
      kept alongside the formula throughout.
    angle_detail: Pitman consistently draws the distribution as a bar chart and marks the mean as a balance
      point and the standard deviation as a width, then computes. Keeping the picture attached to the
      symbol is why this is a good route when E[X] and Var(X) feel like formulas to memorise rather than
      properties of a shape. §3.3 also introduces the Normal approximation right after standard deviation,
      so the reason anyone cares about sigma is visible immediately. Long chapter — for L06 read §3.2
      and §3.3 and stop.
    vault_path: material://source-pitman-probability/pitman.pdf
    scope_triage: reference-only
  - kind: reference
    label: Tijms — random variables by experiment and simulation
    locator: Ch 9 Basic rules for discrete random variables, pdf pp. 275-295; Ch 10 §§10.1-10.3 Continuous
      random variables, pdf pp. 296-324; Ch 11 §11.4 Covariance and correlation coefficient, pdf pp. 325-342
    angle: States each rule for expectation and variance as a numbered 'basic rule' and then immediately
      tests it against a simulation.
    angle_detail: 'The chapter title is literal: the rules are enumerated and each is checked by a simulation
      whose code and output are shown. For a lecture whose content is a small set of algebraic identities
      (linearity, variance of a scaled variable, variance of a sum under independence), seeing each one
      confirmed numerically is a strong antidote to misremembering which of them needs independence. §11.4
      gives covariance with the correlation coefficient bounded in [-1,1] and proved.'
    vault_path: material://source-tijms-understanding-probability/tijms.pdf
    scope_triage: reference-only
  - kind: reference
    label: Ross — random-variable theory
    locator: Ch 4 Random Variables, pdf pp. 198-305 (§4.3 expected value; §4.4 expectation of a function
      of a random variable; §4.5 variance; §4.10 properties of the cumulative distribution function);
      Ch 7 §7.2 expectation of sums, pdf pp. 478-500
    angle: Proves the variance identity Var(X) = E[X²] − (E[X])², which is the computational form every
      exercise actually uses.
    angle_detail: The definition of variance is an expected squared deviation; almost every calculation
      uses the shortcut identity instead. Ross derives the identity from the definition rather than presenting
      it as an alternative formula, which is worth seeing once so that the shortcut is a theorem you can
      reconstruct rather than a rule you hope you remember. §4.4 is the general expectation-of-a-function
      rule that L06's transformations node needs; §4.10 gives the CDF its own properties list.
    vault_path: material://source-ross-first-course/ross.pdf
    scope_triage: reference-only
  - kind: practise
    label: Schaum — random-variable and moment drills
    locator: Ch 5 Random Variables, pdf pp. 76-106
    angle: Expectation, variance and standard deviation computed from tabulated distributions, dozens
      of times, with every arithmetic step shown.
    angle_detail: Thirty pages of the same operation on different tables. That is exactly right for L06,
      where the concepts are few and the exam risk is a slip in the arithmetic or in reading the distribution
      table. Also covers joint distributions and independence of random variables at the end of the chapter,
      which supports L06's covariance node.
    vault_path: material://source-schaums-probability/schaums-probability.pdf
    scope_triage: helpful-now
  - kind: reference
    label: Harvard Stat 110 Units 3–4 — RVs and expectation
    locator: Lectures 5-9 (random variables and their distributions, expectation, indicator random variables,
      LOTUS, variance)
    angle: Builds expectation around indicator variables, a technique that makes several otherwise hard
      computations trivial.
    angle_detail: The 'fundamental bridge' — that the expectation of an indicator is the probability of
      its event — plus linearity without independence lets you compute means of complicated counts by
      decomposition. L06 never mentions it, but once seen it is the fastest route through a large class
      of exercises, and it makes linearity feel like a tool rather than an identity. Lectures run 45-50
      minutes each; this is a five-lecture commitment, so choose it only if L06 is a topic you intend
      to be strong on.
    scope_triage: reference-only
  - kind: practise
    label: Leuphana-Merz pp. 5-10 — random-variable and moment items
    locator: Leuphana-Merz_Statistik-2_Uebungsbuch-mit-Klausur.pdf, pp. 5-10, Aufgabenblatt 1 random-variable
      items
    angle: Adds short expectation and variance calculations in German exam notation.
    angle_detail: Use these for speed only after PMF/CDF and moment definitions are stable. The book's
      theoretical framing is broader than L06, so the locator intentionally limits the route to the first
      exercise block.
    vault_path: material://source-sad-klausuren-extern/Leuphana-Merz_Statistik-2_Uebungsbuch-mit-Klausur.pdf
    scope_triage: helpful-now
  - kind: watch
    label: jbstatistics — expected value and variance calculations
    locator: '''Expected Value and Variance of a Discrete Random Variable'' and the companion variance
      video (≈10 min each)'
    angle: Computes E[X] and Var(X) from a probability table step by step, in the layout an exam answer
      uses.
    angle_detail: The videos build the working column by column — x, P(x), x·P(x), x²·P(x) — which is
      exactly the table you should be drawing under exam conditions. Copying that layout is a small procedural
      habit that reliably prevents arithmetic slips, and no book on the shelf shows it as clearly.
    scope_triage: helpful-now
  - kind: watch
    label: Kurzes Tutorium Statistik — Zufallsvariablen and Erwartungswert
    locator: '''Zufallsvariablen''; ''Erwartungswert''; ''Varianz'''
    angle: The German names and notation for L06's objects, with the symbols the Klausur prints.
    angle_detail: E(X) versus μ, Var(X) versus σ², and the German phrasing of the linearity rules. Short
      and purely terminological — the concepts should come from Blitzstein or Dekking, but the words should
      come from here if the exam wording has ever cost you time.
    scope_triage: helpful-now
