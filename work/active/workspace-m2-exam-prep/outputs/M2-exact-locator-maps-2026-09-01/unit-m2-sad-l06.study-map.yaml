    scope_triage: helpful-now
  - kind: practise
    label: Dekking — random-variable exercises
    locator: Ch 4 discrete random variables, pdf pp. 52-66; Ch 5 continuous random variables, pdf pp.
      67-80; Ch 7 expectation and variance, pdf pp. 98-111 (change-of-variable formula p. 103; variance
      p. 105; exercises p. 108); Ch 9 joint distributions, pdf pp. 124-143; Ch 13 §13.2 Chebyshev's inequality,
      pdf pp. 191-192
    angle: States the change-of-variable formula as its own numbered result, which is the rule L06's transformation
      node needs and states only in passing.
    angle_detail: §7.3 gives E[g(X)] = Σ g(x)p(x) the status of a named theorem with a proof sketch, and
      every later expectation computation in the book cites it. L06 uses the same rule when it computes
      moments of transformed variables but never isolates it, so it is easy to treat each computation
      as a new trick. Ch 13's Chebyshev section is three pages and directly serves the concentration node,
      with the LLN following immediately in §13.3 so the connection is visible.
    vault_path: material://source-dekking-mips/dekking.pdf
    scope_triage: helpful-now
  - kind: read
    label: MIT 18.05 — random variables, expectation, and variance
    locator: 'Classes: Reading and In-class Materials: the ''Discrete Random Variables; Expectation and
      Variance'' and ''Continuous Random Variables'' readings; Problem Sets 2-3 with solutions'
    angle: Uses R simulations alongside the algebra, so every claimed identity is also demonstrated numerically.
    angle_detail: The course's design principle is that a probabilistic claim should be checked by simulation
      before it is trusted, and the R code is published. For L06's rules — linearity, variance under scaling,
      the behaviour of a sample mean — running the simulation is a fast way to find out whether you have
      remembered the rule correctly, and it takes minutes. Also introduces quantiles carefully, which
      the lecture uses without defining.
    scope_triage: helpful-now
  - kind: reference
    label: Pitman — random variables and expectation
    locator: Ch 3 Random Variables, pdf pp. 148-268 (§3.2 Expectation p. 171; §3.3 Standard Deviation
      and Normal Approximation p. 194; §3.6 Symmetry p. 246)
    angle: Introduces expectation as the long-run average of repeated draws, with the frequency picture
      kept alongside the formula throughout.
    angle_detail: Pitman consistently draws the distribution as a bar chart and marks the mean as a balance
      point and the standard deviation as a width, then computes. Keeping the picture attached to the
      symbol is why this is a good route when E[X] and Var(X) feel like formulas to memorise rather than
      properties of a shape. §3.3 also introduces the Normal approximation right after standard deviation,
      so the reason anyone cares about sigma is visible immediately. Long chapter — for L06 read §3.2
      and §3.3 and stop.
    vault_path: material://source-pitman-probability/pitman.pdf
    scope_triage: reference-only
  - kind: reference
    label: Tijms — random variables by experiment and simulation
    locator: Ch 9 Basic rules for discrete random variables, pdf pp. 275-295; Ch 10 §§10.1-10.3 Continuous
      random variables, pdf pp. 296-324; Ch 11 §11.4 Covariance and correlation coefficient, pdf pp. 325-342
    angle: States each rule for expectation and variance as a numbered 'basic rule' and then immediately
      tests it against a simulation.
    angle_detail: 'The chapter title is literal: the rules are enumerated and each is checked by a simulation
      whose code and output are shown. For a lecture whose content is a small set of algebraic identities
      (linearity, variance of a scaled variable, variance of a sum under independence), seeing each one
      confirmed numerically is a strong antidote to misremembering which of them needs independence. §11.4
      gives covariance with the correlation coefficient bounded in [-1,1] and proved.'
    vault_path: material://source-tijms-understanding-probability/tijms.pdf
    scope_triage: reference-only
  - kind: reference
    label: Ross — random-variable theory
    locator: Ch 4 Random Variables, pdf pp. 198-305 (§4.3 expected value; §4.4 expectation of a function
