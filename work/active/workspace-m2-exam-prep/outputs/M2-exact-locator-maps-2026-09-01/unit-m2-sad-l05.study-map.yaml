    vault_path: material://source-blitzstein-hwang/blitzstein.pdf
    scope_triage: helpful-now
  - kind: reference
    label: Ross — combinatorial analysis
    locator: Ch 1 Combinatorial Analysis, pdf pp. 14-45 (§1.2 the basic principle of counting; §1.3 permutations;
      §1.4 combinations; §1.5 multinomial coefficients; §1.6 the number of integer solutions of equations)
    angle: The multinomial coefficient and the integer-solutions problem, both of which L05's grid implies
      but does not develop.
    angle_detail: §1.5 generalises the binomial coefficient to partitions into more than two groups —
      the case that appears when a question asks for arrangements of a word with repeated letters, which
      L05's 'permutations with indistinguishable objects' node is exactly about. §1.6 is the stars-and-bars
      argument stated as counting integer solutions, which is the honest form of the 'combinations with
      repetition' cell in the grid. Together these two sections cover the two grid cells that most often
      go wrong, in about fifteen pages.
    vault_path: material://source-ross-first-course/ross.pdf
    scope_triage: reference-only
  - kind: practise
    label: Schaum — combinatorics drills
    locator: Ch 2 Techniques of Counting, pdf pp. 18-39
    angle: Twenty-two pages that are almost entirely solved counting problems — the highest drill density
      for L05 on the shelf.
    angle_detail: L05 is the lecture where practice volume beats explanation, because the difficulty is
