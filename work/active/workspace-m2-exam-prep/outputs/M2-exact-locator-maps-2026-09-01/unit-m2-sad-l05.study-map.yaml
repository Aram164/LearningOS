      cell names. The identities and Stirling slides at the end are stated without justification; Blitzstein
      §1.5''s story proofs are where they become memorable rather than memorised.'
    scope_triage: required-now
  - kind: read
    label: Grinstead & Snell Ch 3 — combinatorics
    locator: Official PDF, Ch 3 'Combinatorics', §§3.1-3.3, PDF pp. 83-140
    angle: Proves the binomial identities L05 lists, and uses card shuffling as a running example that
      makes the counting concrete.
    angle_detail: '§3.2 does not merely state Pascal''s identity and the binomial theorem — it proves
      them and then uses them, which is what L05''s identities node needs and does not supply. The card-shuffling
      section is unusual and useful: it applies the counting machinery to a physical process, so the abstractions
      acquire a referent. Free and open-access, with a large exercise set.'
    scope_triage: helpful-now
  - kind: read
    label: Blitzstein Chapter 1 — strategic counting
    locator: Ch 1 pdf pp. 18-61 (§1.3 naive definition of probability p. 23; §1.4 how to count p. 25;
      §1.5 story proofs p. 37; §1.6 non-naive definition p. 38; exercises §1.9 p. 50)
