detours: []
shelving:
  state: none
stages:
- id: stage-sad-l05-decision-grid
  number: 1
  title: The combinatorics decision grid
  status: pending
  objective: First decide whether order matters, whether replacement/repetition is allowed, and whether
    all n objects or only k are used; the formula follows from those choices.
  done_when:
  - 'Reproduce without notes: First decide whether order matters, whether replacement/repetition is allowed,
    and whether all n objects or only k are used; the formula follows from those choices.'
  - Work Blatt 2, Aufgabe 1 — counting inside finite probability, then the remaining 5, and record every
    miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-combinatorics
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L05 combinatorics deck
    locator: lecture-slides/05_combinatorics.pdf, 34 slides
    angle: The decision grid — order × replacement × selection size — which is the organising device the
      exam expects you to apply.
    angle_detail: 'The deck''s contribution is the grid itself rather than the individual formulas, which
      are standard. Read it as a classification procedure: identify the cell, then apply the formula that
      cell names. The identities and Stirling slides at the end are stated without justification; Blitzstein
      §1.5''s story proofs are where they become memorable rather than memorised.'
    scope_triage: required-now
  - kind: practise
    label: Blatt 2, Aufgabe 1 — counting inside finite probability
    locator: exercise-slides/blatt-02.pdf, p. 1, Aufgabe 1(a)-(e)
    angle: Hides the counting case inside cards, repeated dice and dependent portfolio events, which tests
      identification rather than formula recall.
    angle_detail: 'This is a current assessed sheet: attempt it before opening the tutorial solution.
      It is scope evidence because it shows the chair''s own wording, data size and expected amount of
      working; it is not a replacement for the lecture derivation.'
    vault_path: material://source-sad-ss26-lectures/exercise-slides/blatt-02.pdf
    scope_triage: required-now
  - kind: practise
    label: UE4, slides 4-8 — worked finite-counting solutions
    locator: exercise-slides/UE4.pdf, slides 4-8
    angle: Makes the numerator/denominator counting decisions explicit for the current sheet's disguised
      cases.
    angle_detail: 'This is the current worked tutorial for the named task. Use it after an unaided attempt:
      its value is the course''s calculation order and notation, while reading it first would turn an
      exam-relevant retrieval task into passive recognition.'
    vault_path: material://source-sad-ss26-lectures/exercise-slides/UE4.pdf
    scope_triage: required-now
  - kind: read
    label: Fahrmeir Chapter 4 — combinatorics and finite probability
    locator: Ch 4 §4.3 Zufallsstichproben und Kombinatorik, pdf pp. 214-220; Aufgaben pdf pp. 239-241
    angle: Six pages that put counting where SaD puts it — inside sampling — instead of treating combinatorics
      as its own subject.
    angle_detail: 'This is deliberately the shortest combinatorics treatment on the shelf, and that is
      its value: Fahrmeir introduces the counting cases only as the sizes of sample spaces for Ziehen
      mit/ohne Zurücklegen and mit/ohne Berücksichtigung der Reihenfolge, which is precisely how L05''s
      decision grid is organised. If the grid is what will not stick, read this rather than a full combinatorics
      chapter, because it never leaves the sampling frame. For volume of drill and the harder identity
      questions go to Blitzstein Ch 1 or Schaum''s Ch 2 instead.'
    vault_path: material://source-fahrmeir-statistik/statistik.pdf
    scope_triage: helpful-now
  - kind: practise
    label: Arbeitsbuch Chapter 4 — combinatorics applications
    locator: Ch 4 Aufgaben pdf pp. 83-88, Lösungen pdf pp. 89-95 (the Ziehen mit/ohne Zurücklegen items)
    angle: Counting embedded in probability questions rather than as pure counting exercises — which is
      how L05 is examined.
    angle_detail: 'The exam rarely asks ''how many arrangements'' on its own; it asks for a probability
      whose computation happens to require a count. These items are all of that second kind, so they train
      the step students actually lose marks on: deciding whether order and replacement matter before reaching
      for a formula. Thin on pure identities and Stirling — Blitzstein §1.4 covers those.'
    vault_path: material://source-fahrmeir-arbeitsbuch/arbeitsbuch.pdf
    scope_triage: helpful-now
  - kind: read
    label: Blitzstein Chapter 1 — strategic counting
    locator: Ch 1 pdf pp. 18-61 (§1.3 naive definition of probability p. 23; §1.4 how to count p. 25;
      §1.5 story proofs p. 37; §1.6 non-naive definition p. 38; exercises §1.9 p. 50)
    angle: 'Story proofs: counting identities argued by describing two ways to count the same set, with
      no algebra at all.'
    angle_detail: §1.5 is the reason to come here for L05 rather than to any German text. A story proof
      establishes an identity — the symmetry of binomial coefficients, Vandermonde, the hockey stick —
      by naming a set and counting it twice, and once seen the identities stop being things to memorise.
      That directly serves L05's identities node, which the deck states without justification. §1.4 also
      makes the sampling table (ordered/unordered × with/without replacement) explicit, which is the same
      four-way grid the lecture draws. The strongest exercise set on the shelf for this material.
    vault_path: material://source-blitzstein-hwang/blitzstein.pdf
    scope_triage: helpful-now
  - kind: practise
    label: Dekking — counting and finite-probability exercises
    locator: Ch 4 §4.3 the Bernoulli and binomial distributions, pdf pp. 56-58; Ch 2 §2.4 products of
      sample spaces, pdf pp. 29-30; exercises pdf pp. 62-66
    angle: Deliberately thin on counting — read it to see how far you can get with product sample spaces
      instead of combinatorial formulas.
    angle_detail: 'This book barely has a combinatorics section, and knowing that is useful: it builds
      the binomial coefficient where it is needed, out of the product sample space in §2.4, rather than
      teaching counting as a prerequisite subject. If L05''s grid feels like arbitrary memorisation, seeing
      a serious book do without most of it reframes the grid as a shortcut rather than as the content.
      For actual counting practice go to Blitzstein §1.4 or Schaum''s Ch 2 — this route is orientation.'
    vault_path: material://source-dekking-mips/dekking.pdf
    scope_triage: helpful-now
  - kind: read
    label: MIT 18.05 — counting and finite probability
    locator: 'Classes: Reading and In-class Materials, Class 1 ''Counting and Sets'' reading and slides;
      Problem Set 1 with solutions'
    angle: Treats counting as one week of prerequisite technique, which is a useful calibration of how
      much of L05 is genuinely hard.
    angle_detail: 18.05 spends a single class on counting before moving to probability, and its problem
      set is correspondingly compact. Reading it tells you which parts of L05's grid a strong applied
      course considers routine and which it considers worth practising — helpful when deciding how much
      time this lecture deserves. Not a substitute for Blitzstein Ch 1 if the grid itself is the problem.
    scope_triage: helpful-now
  - kind: reference
    label: Tijms — counting through probability models
    locator: Ch 7 Foundations of probability theory, pdf pp. 235-254 (finite sample spaces and the Laplace
      model)
    angle: Counting kept subordinate to the sample-space model, with birthday- and lottery-style problems
      as the worked cases.
    angle_detail: Tijms treats combinatorial questions as questions about the size of a well-chosen sample
      space, and his worked cases — coincidences, lotteries, matching problems — are the ones whose answers
      are counterintuitive enough to be memorable. Useful as a second pass after the mechanics are in
      place from L05's grid, less useful as a first exposure because he does not tabulate the cases.
    vault_path: material://source-tijms-understanding-probability/tijms.pdf
    scope_triage: reference-only
  - kind: practise
    label: Schaum — combinatorics drills
    locator: Ch 2 Techniques of Counting, pdf pp. 18-39
    angle: Twenty-two pages that are almost entirely solved counting problems — the highest drill density
      for L05 on the shelf.
    angle_detail: L05 is the lecture where practice volume beats explanation, because the difficulty is
      pattern recognition across many superficially different word problems. This chapter supplies that
      volume and nothing else. Work them in mixed order and force yourself to name the grid cell (ordered/unordered,
      with/without replacement) before computing — the chapter is organised by technique, which otherwise
      gives the answer away.
    vault_path: material://source-schaums-probability/schaums-probability.pdf
    scope_triage: helpful-now
  - kind: reference
    label: Harvard Stat 110 — strategic counting
    locator: Lecture 1 (sample spaces, naive definition, counting) and Lecture 2 (story proofs, non-naive
      definition); Strategic Practice 1 with solutions
    angle: Contains the story-proof demonstrations performed live, which is where that technique is easiest
      to pick up.
    angle_detail: A story proof is a way of arguing, and watching one being constructed is more instructive
      than reading a finished one — the moment where he chooses what set to count twice is the whole method.
      Two lectures cover all of L05's counting content at a level above the lecture's own, with the identities
      node handled properly.
    scope_triage: reference-only
  - kind: practise
    label: Leuphana-Merz pp. 5-10 — combinatorial probability items
    locator: Leuphana-Merz_Statistik-2_Uebungsbuch-mit-Klausur.pdf, pp. 5-10, Aufgabenblatt 1 counting
      items
    angle: Uses counting as the hidden first step of a probability problem rather than naming the formula.
    angle_detail: 'This is identification practice: decide the finite sample space and the relevant count
      before computing a probability. It does not replace the lecture''s complete order/replacement decision
      grid, so use it only after that grid can be reproduced.'
    vault_path: material://source-sad-klausuren-extern/Leuphana-Merz_Statistik-2_Uebungsbuch-mit-Klausur.pdf
    scope_triage: helpful-now
  - kind: watch
    label: jbstatistics — permutations and combinations
    locator: The 'Permutations and Combinations' video series (3 videos, ≈10 min each)
    angle: Derives the combination formula from the permutation formula on screen, rather than presenting
      both as given.
    angle_detail: nCr = nPr / r! is the relationship that makes the two halves of L05's grid one idea
      rather than two formulas, and seeing the division performed — dividing out the orderings you decided
      not to distinguish — is what makes it stick. Short series, appropriate as a first exposure before
      the Schaum's drill.
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l05/stages/stage-sad-l05-decision-grid/notes.md
  attachments: []
  source_feedback: []
- id: stage-sad-l05-permutations
  number: 2
  title: Permutations and indistinguishable objects
  status: pending
  objective: Ordering all objects gives n!; repeated or indistinguishable groups divide away permutations
    that do not create a new arrangement.
  done_when:
  - 'Reproduce without notes: Ordering all objects gives n!; repeated or indistinguishable groups divide
    away permutations that do not create a new arrangement.'
  - Work Schaum — combinatorics drills, and record every miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-combinatorics
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L05 combinatorics deck
    locator: lecture-slides/05_combinatorics.pdf, 34 slides
    angle: The decision grid — order × replacement × selection size — which is the organising device the
