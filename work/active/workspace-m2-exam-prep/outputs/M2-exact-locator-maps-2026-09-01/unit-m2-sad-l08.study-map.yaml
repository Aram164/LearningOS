- id: stage-sad-l08-likelihood
  number: 6
  title: Probability versus likelihood
  status: pending
  objective: A probability distribution varies data with parameters fixed; a likelihood treats observed
    data as fixed and compares parameter values by how well they explain it.
  done_when:
  - 'Reproduce without notes: A probability distribution varies data with parameters fixed; a likelihood
    treats observed data as fixed and compares parameter values by how well they explain it.'
  exam_critical: true
  concepts:
  - concept-maximum-likelihood
  - concept-probability
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L08 Normal, CLT, and likelihood deck
    locator: lecture-slides/08_normal_distribution.pdf, 38 slides
    angle: 'Two lectures in one deck: Normal calculations and the CLT, then likelihood and the derivation
      that turns maximum likelihood into least squares.'
    angle_detail: The Gaussian-error derivation at the end is the intellectual centre of the statistics
      half — it is where L03's least-squares choice is finally justified — and it arrives after the CLT
      material when attention is lowest. Budget a separate session for the likelihood slides. The LLN-versus-CLT
      slides are the other high-risk part; they are correct but terse. Dekking Ch 13-14 and Ch 21 cover
      both halves in the same notation.
    scope_triage: required-now
  - kind: reference
    label: MIT 18.650 Lectures 4–5 — maximum likelihood
    locator: Lectures 4-5 (maximum likelihood estimation, the method of moments); graduate-level treatment,
      use for a diagnosed gap only
    angle: 'The formal estimation-theory framing of likelihood: identifiability, the Fisher information,
      asymptotic normality of the MLE.'
    angle_detail: 'This is a mathematical-statistics course and sits well above SaD. It is routed here
      for one situation only: the L08 slides derive the MLE for a specific model and you want to know
      what the general theory guarantees — that the estimator is consistent and asymptotically Normal,
      and under what conditions. Reading it will not help with the exam, and it will cost hours. Reference-only
      by design.'
    scope_triage: reference-only
  - kind: watch
    label: StatQuest — CLT, likelihood, and maximum likelihood
    locator: '''The Central Limit Theorem, Clearly Explained''; ''Probability is not Likelihood''; ''Maximum
      Likelihood, Clearly Explained'' (≈12 min each)'
    angle: '''Probability is not Likelihood'' isolates L08''s hardest distinction into a single dedicated
      video.'
    angle_detail: 'The likelihood-versus-probability confusion is the reason L08''s second half is hard,
      and it is a distinction about which quantity is held fixed, not about any formula. This video does
      nothing else for eight minutes: same curve, same expression, read twice. Watch it before reading
      Dekking Ch 21 and the chapter becomes straightforward. The CLT video uses the same repeated-sampling
      animation OpenIntro describes in text.'
    scope_triage: helpful-now
