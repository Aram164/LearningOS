  objective: The derivative as a limit of difference quotients, differentiability implying continuity,
    and the calculation rules including chain rule and the derivative of an inverse function.
  done_when:
  - 'Reproduce without notes: The derivative as a limit of difference quotients, differentiability implying
    continuity, and the calculation rules including chain rule and the derivative of an inverse function.'
  - Work Fritzsche §3.1, §3.2 und §4.2 — Differenzierbarkeit, Mittelwertsatz, Taylorentwicklung, then
    the remaining 3, and record every miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-chain-rule
  - concept-differentiation
  scope_triage: required-now
  resources:
  - kind: read
    label: unser skript.pdf Kapitel 6 — the scope authority
    locator: unser skript.pdf Kapitel 6, printed p. 137 (PDF p. 147)–printed p. 190 (PDF p. 200); §6.1
      Differenzierbarkeit und Ableitungen printed p. 137 (PDF p. 147), §6.3 Mittelwertsatz printed p.
      145 (PDF p. 155), §6.4 Ausflug Sinus, Kosinus, Tangens printed p. 148 (PDF p. 158), §6.5 Regel von
      l'Hospital printed p. 151 (PDF p. 161), §6.7 Höhere Ableitungen printed p. 165 (PDF p. 175), §6.8
      Taylorpolynome und Taylorreihen printed p. 168 (PDF p. 178), §6.10 Ausflug numerische Interpolation
      printed p. 174 (PDF p. 184). §§6.2, 6.6 and 6.9 are Exkurse and are not worked here.
    angle: The longest chapter in the script, and the first with no current HU exercise sheet behind it
      at all.
    angle_detail: 'Two things govern this session. First, the chapter is really one theorem and its consequences:
      §6.3''s mean value theorem is what makes the derivative say anything about the function, and monotonicity,
      extrema, l''Hospital and Taylor all descend from it. Second, the practice situation changes here:
      the local HU set stops at §5.5, so every drill on this menu is a substitute chosen by topic rather
      than calibrated to this examiner. That has been an open, unowned gap since the 2026-08-03 audit,
      and it is the reason this session leans harder on IngMath2 and the German exercise books than any
      earlier one.'
    vault_path: material://source-analysis-skript/unser skript.pdf
    scope_triage: required-now
  - kind: read
    label: kleine_beweise.pdf — the six Chapter 6 proofs the tutors named
    locator: 'kleine_beweise.pdf, section ''Kapitel 6: Differentialrechnung II'': Lemma 6.3 (differentiable
      ⇒ continuous), Satz 6.4 (Rechenregeln der Differenziation), Lemma 6.11 (f''(x₀) = 0 is necessary
      for an extremum), Korollar 6.13 written out explicitly via 6.12 (Satz von Rolle), Korollar 6.14
      (zero derivative ⇒ constant), Satz 6.15 (monotonicity and the first derivative)'
    angle: The longest per-chapter list in the handout — six results, and together they are the chain
      from the definition to the monotonicity test.
    angle_detail: 'Read the six in order and they are one argument: differentiability gives continuity,
      the rules let you compute, a vanishing derivative is necessary at an extremum, Rolle follows, the
      mean value theorem follows from Rolle, and monotonicity follows from that. That is the chapter.
      Since no HU sheet reaches Chapter 6, this handout is the closest thing to a statement of expected
      depth for it — with the authors'' standing disclaimer that it has no known relation to exam contents.'
    vault_path: material://source-analysis-skript/kleine_beweise.pdf
    scope_triage: required-now
  - kind: watch
    label: Professor Leonard — Calculus 1 derivative and Mittelwertsatz, Calculus 2 Taylor
    locator: 'Calculus 1 Lecture 2.1: ''An Introduction to the Derivative''; Calculus 2 Lecture 10.10:
      ''Taylor and Maclaurin Series'''
    angle: The chapter where a US calculus course covers the most of what is actually examined — at blackboard
      pace, with every step of the computation shown.
    angle_detail: 'Chapter 6 is the best fit for this source in the whole module: derivative rules, the
      mean value theorem, l''Hospital and Taylor polynomials are standard calculus-course content, taught
      computationally, which is the level §§6.1-6.8 mostly ask for. Still conditional on a diagnosed block
      and still one topic at a time — the pace angle is a repair tool, not a syllabus.'
    scope_triage: helpful-now
  - kind: watch
    label: 3Blue1Brown — the derivative, chain rule and Taylor series episodes
    locator: Chapter 2 'The paradox of the derivative'; Chapter 4 'Chain rule and product rule'; Chapter
      7 'Limits, L'Hôpital's rule, and epsilon delta definitions'; Chapter 11 'Taylor series'
    angle: The Taylor episode in particular gives the picture — successive derivatives matching at a point
      — that the formula alone does not.
    angle_detail: 'Short, watched once, before the script rather than instead of it. The Taylor episode
      is the one worth the time on this chapter: §6.8 introduces the polynomial and the remainder as formulas,
      and the visual account of why matching derivatives at a point produces a good local approximation
      is the missing motivation. No rigour, and nothing here should be reconstructed into an exam answer.'
    scope_triage: helpful-now
