  - kind: practise
    label: Aufgabensammlung-M1 Aufgabe 1 — five sequences of different types in one task
    locator: 'Aufgabensammlung-M1_Loesung.pdf (7 pp), Aufgabe 1: decide convergence and find the limit
      for n^((−1)^n), the n-th root of 1 + 1/n, a sum, a product and cos(nπ)'
    angle: One mixed task where the work is choosing a different tool for each of five sequences — a method-choice
      drill rather than a technique drill.
    angle_detail: 'Small, and useful for a specific purpose: every other route on this node groups problems
      by the technique that solves them, which quietly removes the decision the exam actually tests. Here
      the five parts need five different arguments — unbounded divergence, sandwich, a closed sum, a telescoping
      product, and a two-accumulation-point argument — with no signposting. The solution names the sandwich
      lemma and Gauß''s sum formula at the point it uses them.'
    scope_triage: helpful-now
  - kind: read
    label: Solved German Klausur tasks on sequences, recursion and Cauchy
    locator: 'Marburg_Analysis-I_3-Klausuren-mit-Loesungen.pdf: 1. Klausur A7 (two quotient sequences
      with competing exponentials), A8 (a recursive sequence — show it converges, then find the limit);
      2. Klausur A3 (three limits incl. √(k²+3k) − k), A4 (recursive, with well-definedness asked first),
