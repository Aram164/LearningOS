    an executed comparison of values and dtype.
  - 'Case 5 demonstrated both ways: the naive single-context lowering produces plausible wrong numbers and raises
    nothing, while case 4 raises — and you can say why case 5 is the more dangerous of the two.'
  - The property that prevents case 5 from shipping is named and its check point identified in the translator.
  - 'The read-set boundary settled: which of the five lambda forms admit static analysis, what the translator does
    past that boundary, and why `Expr.meta.root_names()` has no pandas equivalent.'
  - The six Task 4 operations classified, including the one that looks like fallback but has a native expression
    and the one that looks native but does not survive the pinned version.
  - '`classify(assign_entries)` implemented, reproducing the hand-computed layer counts and REFUSING rather than
    assuming an empty read set on a non-analyzable entry.'
  - '`s2d-check.py` passes (24 assertions).'
