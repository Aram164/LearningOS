  - 'The operator-ambiguity case answered: you can say what decides whether `-` is set difference or arithmetic,
    and what the same overloading does to `|` and `&`.'
  - One expression written once and applied unchanged to narrow, wide, drifted and no-numeric schemas, with the
    empty-selection behaviour recorded for both `select` and `with_columns`.
  - '`translate_select_dtypes(include, exclude)` total over single dtype, list, string alias and both-given forms,
    raising on unsupported forms rather than selecting nothing.'
  - The Boolean/Categorical class question answered with an executed result on both sides rather than assumed.
  - A schema-change test passes without editing the expression, and the materialized-name-list version is demonstrated
    to fail it.
  - '`s2b-check.py` passes (22 assertions).'
