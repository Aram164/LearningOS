- id: stage-polars-expr-assignmap-lowering
  number: 4
  title: Translate pandas assign into native expression trees
  status: pending
  objective: Lower foldable pandas assign operations into a single Polars with_columns expression list while preserving
    sequential visibility and recognizing when opaque fallback is required.
  done_when:
