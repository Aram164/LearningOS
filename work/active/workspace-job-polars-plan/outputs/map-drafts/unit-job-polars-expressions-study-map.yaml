    angle: The book's account of boolean composition and the conditional, which it treats together.
    angle_detail: pp. 274-275 is short and does not mention that an unselected branch is still validated, nor that
      mismatched branch types are coerced to a supertype. Read it for the shape of the API, then treat the sheet's
      Task 5 as the specification. Ch 13 pp. 387-389 covers the horizontal helpers as aggregations, which is the
      framing that makes the empty-subset error make sense.
    scope_triage: required-now
