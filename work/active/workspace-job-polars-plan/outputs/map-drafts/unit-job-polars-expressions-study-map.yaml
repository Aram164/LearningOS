    label: Polars folds
    locator: §'Basic example', §'Conditional fold', and the accumulator/initial-value discussion
    angle: Explains the accumulator, which is where the fold's output dtype comes from - the stage's quietest trap.
    angle_detail: 'The page shows folds working and does not dwell on the seed''s type. Read it holding one question:
      over two Int64 columns, what dtype does `pl.fold(0, ...)` produce? The answer is not Int64, and a translation
      that seeds with a bare literal silently narrows every horizontal sum it emits.'
    scope_triage: required-now
    url: https://docs.pola.rs/user-guide/expressions/folds/
