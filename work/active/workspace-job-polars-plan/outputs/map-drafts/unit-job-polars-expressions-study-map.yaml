    kind: read
    label: polars.when
    locator: Branch validity, expression inputs, literals, and chained when/then/otherwise
    angle: The API reference for the conditional, read for what it does not say about branch typing.
    angle_detail: It documents the chaining and the literal handling. The two behaviours you need — that an unselected
      branch is still evaluated for validity, and that branches of different types are unified to a supertype rather
      than rejected — are visible only by execution, which is Task 5.
    scope_triage: required-now
    url: https://docs.pola.rs/api/python/stable/reference/expressions/api/polars.when.html
