  title: Expression grammar, contexts, aliases, and sibling visibility
  status: pending
  objective: 'Treat a Polars expression as a value you can inspect rather than a statement you run: predict output
    width, height and schema for a tree before executing it, and derive the sibling-visibility rule that decides
    how a pandas assign chain lowers into one with_columns context or several.'
  done_when:
  - The four sibling-visibility cases run, and you can state what `with_columns` evaluates against versus what `assign`
    evaluates against, plus the lowering consequence for each.
  - Output width and height predicted correctly for all eight context cases, including the two that raise and why
    `sum()` broadcasts where `head(2)` is refused.
  - For three expressions of your own you can answer 'which columns, from which inputs' WITHOUT executing, using
    `meta.output_name`, `meta.root_names` and `collect_schema`.
  - Eight assign pipelines translated and classified native / staged / fallback, each with an executed comparison
    of values and dtype.
  - Twenty operations classified projection / map / metadata / fallback closed-book, with every misclassification
    kept and annotated.
  - '`s2a-check.py` passes (27 assertions).'
