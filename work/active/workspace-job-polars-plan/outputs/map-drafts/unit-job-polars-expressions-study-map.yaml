- id: stage-polars-expr-horizontal-conditional
  number: 3
  title: Horizontal logic, folds, conditionals, and literals
  status: pending
  objective: Compose row-wise boolean/count expressions safely across dynamic column sets, including Kleene logic
    and Polars' requirement that every when/then branch be independently valid.
  done_when:
  - Both Kleene truth tables filled in for the five-row fixture, with the two cells where a definite answer survives
    an unknown operand identified and explained.
  - The `ignore_nulls` question settled against the pinned build rather than the live documentation, and the places
    where null handling IS controllable in 1.36.0 recorded.
  - '`fold` and `sum_horizontal` compared on the same null-bearing data, with the skipna=True / skipna=False mapping
    stated and the accumulator-dtype rule recorded.'
  - The empty-subset case run, its exception message read, and a decision recorded for what an empty subset means
    at the operation boundary.
  - All six when/then/otherwise cases classified, including the silent Int64-to-String supertype coercion and the
    constant-predicate exception to branch validity.
  - The three dropna predicates implemented over a dynamic subset with no Python row loop, tested against all-null,
    partially-null, NaN-not-null, empty-subset and out-of-range thresh inputs.
  - The pandas/Polars dropna divergence recorded as a named harness case with the null-versus-NaN decision written
    down.
  - '`s2c-check.py` passes (32 assertions).'
  exam_critical: false
  concepts:
  - concept-python
  - concept-map-family
  - concept-dataframe-semantics
  scope_triage: required-now
  resources:
  - id: resource-polars-horizontal-sheet
    kind: practise
    label: Stage exercise sheet - Kleene tables, fold seeds, branch validity, dropna core
    locator: attachments/s2c-exercises.md - Fixture F4, then Tasks 1-6
    angle: Supplies the verified truth tables the dropna lowering is derived from, plus the version fact the docs
      get wrong here.
    angle_detail: 'Task 2 is the concrete instance of this module''s abstract warning about live documentation:
      `ignore_nulls` is not a keyword `any_horizontal` accepts in 1.36.0, and the sheet asserts the TypeError. Task
      3 puts `fold` and `sum_horizontal` on the same null-bearing data and they disagree, which is the skipna mapping.
      Task 5''s case 5d is the silent one: an Int64 branch and a String branch unify to String and the numbers arrive
      stringified, with no error.'
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-expressions/stages/stage-polars-expr-horizontal-conditional/attachments/s2c-exercises.md
  - id: resource-polars-horizontal-sheet-check
    kind: practise
    label: Answer-key self-check - 32 assertions including the dropna divergence
    locator: attachments/s2c-check.py - run after Tasks 1-5, then again after Task 6
    angle: Pins the Kleene tables and the exact row-count divergence between the two dropna implementations.
    angle_detail: It asserts that the Polars predicate keeps two rows where pandas keeps one, and that the difference
      is exactly the NaN row. Keeping this runnable is how you notice if a later refactor of the predicate quietly
      adopts pandas semantics — the counts move and the test says so.
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-expressions/stages/stage-polars-expr-horizontal-conditional/attachments/s2c-check.py
  - id: resource-polars-horizontal-dropna-core
    kind: practise
    label: Derive the dropna predicate core
    locator: Sheet Task 6 - how='any', how='all', and thresh over a dynamic subset
    angle: 'The stage''s payload: the predicate Session 3''s DROPNA lowering is built from.'
    angle_detail: Implement `thresh` as a non-null count compared to n, not as a chain of any/all — the chain reintroduces
      the fold seed problem and breaks on an empty subset. The fixture deliberately contains a real NaN that is
      not a null, and that single row is what makes pandas and Polars return different row counts for `how='any'`.
      Decide which semantics `dropna` has at the boundary and record it; `how='all'` agrees either way and will
      hide the choice.
    scope_triage: required-now
