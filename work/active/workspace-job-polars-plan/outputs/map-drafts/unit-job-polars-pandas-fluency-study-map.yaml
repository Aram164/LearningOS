- id: stage-polars-02-the-parity-harness-differential-testing-from-day
  number: 2
  title: Build the cumulative differential parity harness
  status: pending
  objective: Build the differential harness every later session deposits into, with a report that keeps values,
    dtype/schema, cardinality, row order, missing-value representation, warnings and exceptions as seven separate
    findings — and with declared null, order and tolerance policies rather than defaults nobody chose.
  done_when:
  - '`compare(pandas_fn, polars_fn, case)` returns a report whose seven fields are independently readable, and whose
    type cannot be used in an `if` — no `__bool__`.'
  - One side raising produces a populated report naming the side, the exception type and the message; both sides
    raising records both types, because differing exception types are themselves a finding.
  - Warnings are captured per side, so a pandas FutureWarning with no Polars analogue is recorded rather than swallowed.
  - The null policy is a named value passed in, with a written justification covering NaN-vs-null sums, all-null
    means, and the three-valued `is_nan()` result — plus a statement of which divergence class your default hides.
  - Row order is normalized only for operations declared to promise none, as data (`ORDER_PROMISE`), each entry
    backed by an executed pair rather than by the documentation's wording.
  - All twelve seed cases run, with wrong predictions left in the file as comments; at least four classify as semantic,
    and case 8 carries a per-case tolerance rather than a global one.
  - The three deliberate breaks from Task 5 each have a regression case asserting the finding is now reported.
  - '`s02-check.py` passes (43 assertions), and Stage 1''s Task 5 table is fully backfilled through the deposit
    protocol so running the harness reproduces every Stage 1 finding.'
  exam_critical: false
  concepts:
  - concept-python
  - concept-dataframe-semantics
  - concept-dispatch
  scope_triage: required-now
  resources:
  - id: resource-polars-02-sheet
    kind: practise
    label: Stage exercise sheet - the report contract, three policies, and twelve verified seed cases
    locator: attachments/s02-exercises.md - Tasks 1-6; the seed table is the deliverable
    angle: Names the twelve cases the harness must classify correctly on day one, with each divergence executed
      and recorded.
    angle_detail: 'The seed cases are not illustrations: they are chosen so four separate axes fire, and the key
      records what each library actually did. Three cells repay a second reading — `n_unique` counting null as a
      value (off by one on every column with a missing entry), pandas concatenating strings under `sum` while Polars
      refuses (the same plan changes its answer on one backend and fails loudly on the other), and the ten-0.1 sum
      differing in the last bit (which is why tolerance is a per-case declaration, never a global one).'
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-pandas-fluency/stages/stage-polars-02-the-parity-harness-differential-testing-from-day/attachments/s02-exercises.md
  - id: resource-polars-02-sheet-check
    kind: practise
    label: Seed-case self-check - 43 assertions across all twelve cases
    locator: attachments/s02-check.py - run before you trust a case, and again whenever the lockfile moves
    angle: 'Turns the seed table into a tripwire: if a library changes, every downstream parity conclusion is on
      notice.'
    angle_detail: 'Asserts all twelve divergences plus the null-policy table, and refuses to run outside 3.0.2 /
      1.36.0. Keep it runnable for the rest of the module: it is the cheapest available answer to ''did the environment
      move under my conclusions?'', which is the question that otherwise invalidates nine sessions of notes silently.'
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-pandas-fluency/stages/stage-polars-02-the-parity-harness-differential-testing-from-day/attachments/s02-check.py
  - kind: read
    label: Local material — pandas↔Polars contention probes
    id: resource-polars-02-05-local-material-contention-probes
    locator: check_all.py (the three-layer runner) and verify.py (per-claim assertions)
    vault_path: knowledge/attachments/note-pandas-polars-aggregation-contentions
    scope_triage: required-now
    angle: Your own working probe suite - the shape this harness should converge on, already built once.
    angle_detail: 'Read `check_all.py` first: it refuses to run unless the versions match, runs independent layers,
      and reports counts per layer instead of one boolean — three properties your harness needs on day one. Then
      read `verify.py` for how a single semantic claim becomes an assertion with a name. The difference in scope
      is worth noticing: those probes verify claims in a document, while this harness compares two libraries live,
      so its report needs the seven fields that a claim-checker does not.'
  - kind: reference
    label: Official reference — docs.pola.rs — testing
    id: resource-polars-02-01-official-reference-polars-testing
    locator: assert_frame_equal / assert_series_equal parameters, and the parametric `dataframes` strategy
    url: https://docs.pola.rs/api/python/stable/reference/testing.html
    scope_triage: reference-only
    angle: Gives the tolerance and check_* switches your report needs as *fields*, not as its verdict.
    angle_detail: 'Read it for the parameter list — `check_dtypes`, `check_row_order`, `rtol`/`atol` — and note
      that each switch you would set corresponds to one field of your own report. Its limit is structural: these
      are assertions, so they raise on the first difference and discard the rest. Use them inside a field, never
      as the comparison. The parametric strategies section is what you return to when hand-written cases run out
      in Session 10.'
  - kind: reference
    label: Official reference — pandas.pydata.org — testing
    id: resource-polars-02-02-official-reference-pandas-testing
    locator: 'assert_frame_equal parameters: check_dtype, check_like, check_index_type, check_exact, rtol/atol'
    url: https://pandas.pydata.org/docs/reference/testing.html
    scope_triage: reference-only
    angle: The pandas half of the same switch list, and the source of the index-comparison question.
    angle_detail: '`check_like` and `check_index_type` have no Polars counterpart because there is no index to compare
      — so deciding what to do with them *is* the normalization policy for Task 3. Build one comparison profile
      per operation; a single blanket profile is how case 8 and the sort-order divergence both disappear.'
  - kind: read
    label: Required core — pytest parametrization
    id: resource-polars-02-03-required-core-pytest-parametrize
    locator: §'Parametrizing fixtures and test functions' and §'Basic pytest.mark.parametrize'
    url: https://docs.pytest.org/en/stable/how-to/parametrize.html
    scope_triage: required-now
    angle: How the twelve cases become twelve reported failures instead of one aborted run.
    angle_detail: 'The mechanical point that matters here: with `parametrize`, a case that raises is one red test
      and the other eleven still report. Write the case table as data and let the decorator expand it — the harness
      grows by one row per session for nine more sessions, so the cost of a hand-written test per case compounds.
      `pytest.param(..., id=...)` is what gives a divergence its stable name for the deposit protocol.'
  - id: resource-polars-02-book-testing
    kind: read
    label: Polars internals - comparing DataFrames and Series
    locator: Ch 18 §Tests in Polars → 'Comparing DataFrames and Series' pp. 559-561, then §Common Anti-patterns
      pp. 562-564
    angle: The book's only treatment of equality testing, and it is on exactly this stage's subject.
    angle_detail: 'The migration routed Chs. 1/3/4 to Stage 1 and left this stage with no book route at all, which
      was a gap: pp. 559-561 walk through the assert helpers and the tolerance arguments from the library authors''
      side. Read the anti-patterns section straight after — ''Using Python Code in your Polars Queries'' is the
      failure mode your harness will tempt you into when a case is awkward to express as an expression.'
    scope_triage: helpful-now
    source_id: source-polars-definitive-guide
    vault_path: material://source-polars-definitive-guide/python-polars-the-definitive-guide.pdf
  - kind: practise
    label: Closing axis pass - classify this session's divergences and deposit one case each
    id: resource-polars-02-99-axis-pass
    locator: Sheet Task 6 (deposit protocol), run at the end of every stage in this module
    scope_triage: required-now
    angle: The habit that makes the harness cumulative rather than a Session 1 artifact nobody reruns.
    angle_detail: 'Three rules, written into the harness README: a divergence found this session becomes a named
      case this session; the case name records the axis and the finding stage; the whole suite runs at the end of
      every stage, not just the new case. The third rule is the one that catches a later session''s normalization
      quietly silencing an earlier finding.'
  - kind: reference
    label: Optional depth — Hypothesis quickstart
    id: resource-polars-02-04-optional-depth-hypothesis-quickstart
    locator: §'Quick start' and the shrinking example
    url: https://hypothesis.readthedocs.io/en/latest/quickstart.html
    scope_triage: deferred
    angle: Deferred until hand-written cases stop finding anything - which happens in Session 10, not here.
    angle_detail: Twelve deliberate cases beat generated ones at this stage, because you are still learning what
      to look at. Read this when a generated fixture would explore dtype/null/size combinations you would not think
      to write; the shrinking behaviour is the part worth understanding, since a shrunk counterexample is what becomes
      a named harness case.
