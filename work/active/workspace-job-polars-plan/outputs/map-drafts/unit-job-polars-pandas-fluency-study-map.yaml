    angle: The one task that must pass before any other observation on this module means anything.
    angle_detail: pandas is pinned in pyproject.toml; polars is not, so its version comes from the lockfile and
      can move under you on the next resolve. Write the probe that prints both and fails loudly on a mismatch, and
      import it from the harness in Stage 2 — a parity suite that runs against unknown versions produces confident
