    angle_detail: '§Concepts to Unlearn takes the index, axes, slicing, eagerness and ''relaxedness'' one at a time
      — the five assumptions that generate most of the eight axes. §Syntax to Forget pp. 94-98 is a side-by-side
      operation table, which is the fastest way to build the Task 5 list. Its limit: it argues for Polars rather
