- id: stage-polars-01-two-data-models-and-the-eight-divergence-axes
  number: 1
  title: Backend contract, version lock, and divergence axes
  status: pending
  objective: Pin pandas 3.0.2 and Polars 1.36.0 as the executable oracle pair, then derive the divergence axes from
    three operations of your own before reading them, so the axis list becomes a checklist you can apply to an unseen
    operation rather than eight phrases you can recite.
  done_when:
  - The version probe runs and prints 3.0.2 / 1.36.0; every later claim on this module is scoped to that pair.
  - Tasks 1-3 of the stage exercise sheet completed with the observation tables filled in, and `s01-check.py` passing
    (22 assertions) so the sheet's key is confirmed against your own environment.
  - 'The Task 4 derivation done cold: your own list of possible divergences for merge / groupby.agg / assign written
    down BEFORE reading the eight axes, plus a one-line explanation for every axis you did not reach.'
  - Fifteen API differences classified syntax-only / semantic / performance-only / unsupported, where every syntax-only
    row carries an executed pair proving values, dtype, cardinality, order and missing-value behaviour all agree
    — an unproven row stays semantic.
  - At least one row in that table is a difference you had believed was cosmetic.
  exam_critical: false
