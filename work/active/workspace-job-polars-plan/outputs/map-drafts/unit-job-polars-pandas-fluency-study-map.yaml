  - id: resource-polars-01-polars-first
    kind: practise
    label: Polars-first drill set - five drills, no pandas anywhere
    locator: attachments/u1-polars-first.md - Drills 1-5; Drill 4 is the one to take away
    angle: 'The half of Session 1 that is not about pandas: what Polars is, learned from Polars.'
    angle_detail: 'Session 1''s two stages are about the contract, which teaches Polars as ''the thing that is not
      pandas''. This is the other half. Drill 3 learns the API by its namespaces rather than its functions — given
      an unfamiliar task you should be able to name the namespace before searching, which is what actually makes
      a large API usable. Drill 4 is the deep one: an expression is a value, so it can be stored in a variable,
      returned by a function and built by a comprehension. Every later capability — selectors, `over`, lazy optimization,
      the meta namespace — follows from it.'
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-pandas-fluency/stages/stage-polars-01-two-data-models-and-the-eight-divergence-axes/attachments/u1-polars-first.md
