- id: stage-polars-selection-dropna
  number: 4
  title: DROPNA from selectors and horizontal expressions
  status: pending
  objective: Implement pandas dropna behavior by combining runtime subset resolution, null/NaN predicates, horizontal
    logic, and threshold counting instead of assuming drop_nulls is equivalent.
  done_when:
  - 'The missing-value toolkit exercised: null_count, is_nan, drop_nulls with a selector subset, fill_null, fill_null
    strategies, fill_nan - and the design principle stated (null and NaN each have their own verb).'
  - '`fill_null(0)` shown NOT to touch a NaN, and the reason given without reference to pandas.'
  - The normalization sandwich derived - fill_nan(None) then drop_nulls - and shown to reproduce pandas dropna exactly,
    with a statement of why the reverse order answers a different question.
