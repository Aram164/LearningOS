- id: stage-polars-selection-duplicates
  number: 3
  title: DROP_DUPLICATES versus unique
  status: pending
  objective: Translate pandas duplicate-removal semantics into Polars unique parameters while making keep, subset,
    order, and unsupported cases explicit.
  done_when:
  - Ten distinctness queries written from intent, including 'rows whose key occurs once' without a group_by and
    join.
  - '`unique()` run twice and its actual ordering promise stated - weaker than what any single run shows.'
  - The full keep/subset mapping table completed by execution, with keep=False resolved to keep='none' and keep='any'
    identified as having no pandas counterpart plus a statement of what it buys.
  - '`maintain_order=True` present on every mapped row, and the consequence of omitting it stated: values agree,
    order does not, and a sort-before-compare harness reports a clean pass.'
  - 'The two duplicate masks distinguished: pandas `duplicated()` marks 2nd-and-later, Polars `is_duplicated()`
    marks all occurrences, and `~is_first_distinct()` is the actual counterpart.'
  - Nulls, NaNs, empty frames and a List column in the subset each run, with the List case recorded as policy rather
    than normalized away.
  - '`map_drop_duplicates_params` extracted and unit-tested with no frame operation, total over the pandas signature,
    refusing unsupported combinations at mapping time.'
  - '`s3c-check.py` passes (24 assertions).'
  exam_critical: false
  concepts:
  - concept-python
  - concept-selection-family
  - concept-dataframe-semantics
  scope_triage: required-now
  resources:
  - id: resource-polars-duplicates-sheet
    kind: practise
    label: Stage exercise sheet - distinctness natively, the mapping table, and the two masks
    locator: attachments/s3c-exercises.md - Part A, then Part B Task B2
    angle: Isolates the near-identical method pair that means different things and agrees whenever there is nothing
      to find.
    angle_detail: 'pandas `duplicated()` and Polars `is_duplicated()` have matching names, matching return shapes,
      and matching results on any frame without duplicates. They differ on exactly the rows the operation exists
      for: pandas marks the repeats, Polars marks every row that has one. The real counterpart is `~is_first_distinct()`,
      and a filter written with the wrong one drops the rows it meant to keep while reading correctly.'
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-selection-backend/stages/stage-polars-selection-duplicates/attachments/s3c-exercises.md
  - id: resource-polars-duplicates-check
    kind: practise
    label: Answer-key self-check - 24 assertions including both duplicate masks
    locator: attachments/s3c-check.py - run after the mapping table
    angle: Asserts that ~is_first_distinct equals pandas duplicated AND that is_duplicated does not.
    angle_detail: 'The negative assertion is the important one: it pins the difference rather than only the correct
      mapping, so a later ''simplification'' that swaps in the same-named method fails the test. It also confirms
      that nulls count as values for dedup on both sides, which is a deliberate departure from SQL that both libraries
      make and neither advertises.'
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-selection-backend/stages/stage-polars-selection-duplicates/attachments/s3c-check.py
  - id: resource-selection-duplicates-matrix
    kind: practise
    label: Duplicate-removal compatibility matrix
    locator: Sheet Part B Tasks B1-B3 - all keep/subset/order/null combinations, quoted as row labels
    angle: Quotes every result as a list of unique row labels, so an order divergence cannot hide behind equal values.
    angle_detail: The fixture gives every row a unique `w`, so 'which rows survived' is answerable exactly. That
      matters for keep='last' versus keep='first', where the sets of surviving *keys* are identical and only the
      rows differ — a comparison on key values alone would call the two identical.
    scope_triage: required-now
  - id: resource-polars-unique
    kind: read
    label: Polars DataFrame.unique
    locator: subset, keep ('any'/'first'/'last'/'none'), maintain_order - and the default of maintain_order
    angle: Four keep values against pandas' three, and a default that makes no ordering promise at all.
    angle_detail: '`keep=''any''` is the extra one: it tells the engine that any representative will do, which lets
      it skip the bookkeeping first and last require. It is the fastest and it is never a correct translation of
      pandas, which always promises first — so it belongs in your vocabulary for native queries and not in the mapping
      table.'
    scope_triage: required-now
    url: https://docs.pola.rs/api/python/stable/reference/dataframe/api/polars.DataFrame.unique.html
  - id: resource-pandas-drop-duplicates
    kind: read
    label: pandas DataFrame.drop_duplicates
    locator: subset, keep ('first'/'last'/False), inplace, ignore_index - and the ordering guarantee
    angle: Establishes that pandas promises input order, which is the guarantee the Polars default does not make.
    angle_detail: 'The parameter list is the easy half. The half that matters is what the page says about the order
      of the result: pandas keeps the surviving rows in their original relative order, always. That is a promise
      a translation inherits, and it is why `maintain_order=True` is not optional in the mapping.'
    scope_triage: required-now
    url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.drop_duplicates.html
