- id: stage-polars-17-arrow-interop-chunks-and-conversion-costs
  number: 3
  title: Arrow interop, chunks, and conversion costs
  status: pending
  objective: 'Replace the phrase ''zero-copy'' with measurements and assertions: read a Polars frame as Arrow data,
    prove a conversion is copy-free with allow_copy=False rather than claiming it, and find the default conversion
    that silently degrades three of five column types.'
  done_when:
  - The Arrow type of each of five representative columns recorded, with large_string and large_list explained and
    the Categorical's index width read off its Arrow type.
  - Chunking shown to survive the Arrow boundary, and the consequence for rechunk-before-export stated.
  - Four conversions timed on a million rows, ranked, and the ranking explained by what each has to build - not
    by what was expected.
  - 'Zero-copy proved rather than asserted: to_numpy(allow_copy=False) succeeds on a null-free Int64 column and
    raises RuntimeError once one null is present, with the unguarded call shown to promote to float64.'
  - 'The default to_pandas() degradation recorded as a harness case: Int64-with-null becomes float64, List and Struct
    become object, and the round trip does not preserve the schema - while the pyarrow-backed one does.'
  - 'The residual difference noticed even on the round trip that works: the Categorical''s index width changes from
    uint32 to int64 through the pandas boundary.'
  - Three pandas-Polars conversion sites found in the read-only Stratum checkout, each assessed for silent schema
    degradation, with no edits made to that repository.
  - A microbenchmark that separates compute time from conversion time, timed repeatedly with a median reported,
    and the frame size at which conversion stops mattering stated for this machine.
  - A boundary map where every crossing carries a MEASURED cost, and crossings caused by a UDF fallback are marked
    as such.
  - '`s8c-check.py` passes (22 assertions).'
  exam_critical: false
  concepts:
  - concept-python
  - concept-dataframe-semantics
  scope_triage: required-now
  resources:
  - id: resource-polars-s8c-sheet
    kind: practise
    label: Stage exercise sheet - Arrow types, zero-copy as an assertion, the conversion that degrades
    locator: attachments/s8c-exercises.md - Fixture F9, then Part A Task A4 and Part B Task B1
    angle: Replaces the phrase 'zero-copy' with a flag that fails when the claim is false.
    angle_detail: 'Task A4 is the method worth taking away: `to_numpy(allow_copy=False)` succeeds on a null-free
      Int64 column and raises RuntimeError the moment one null is present — and the unguarded call quietly returns
