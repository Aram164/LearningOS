    angle_detail: 'Task A2 is the strongest exercise here: turning `comm_subexpr_elim` off and diffing the plan
      makes the pass visible as an absence, which is more convincing than seeing it fire. The habit consequence
      is worth stating — a repeated subexpression is hoisted automatically, so naming an intermediate ''to avoid
