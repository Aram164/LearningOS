- id: stage-polars-16-udfs-fallbacks-and-native-expression-rewrites
  number: 2
  title: UDF fallbacks and native expression rewrites
  status: pending
  objective: 'Treat a UDF as an optimizer problem rather than a Python-speed problem: learn the five rungs from
    native expression to row-wise callable, measure what each costs, and build the rule that decides when a fallback
    is correct and still wrong.'
  done_when:
  - The same operation implemented at all five rungs - native expression, NumPy ufunc, map_batches, map_elements,
    map_elements over a struct - with a statement of what each costs and buys.
  - 'The map_batches length trap confirmed: returning a differently-sized Series silently changes the frame''s height
    and does not raise.'
  - PolarsInefficientMapWarning captured, its suggested rewrite read, and the caveat recorded - the suggestion is
    derived from bytecode and is about shape, not semantic equivalence, particularly around nulls.
  - 'return_dtype behaviour settled: inference when omitted, and SchemaError when the declared dtype contradicts
    the returned value.'
  - 'The optimizer consequence measured rather than repeated: two plans compared, one native and one through map_elements,
    with a statement of what the optimizer can still do either side of the boundary.'
  - Five pandas apply/map tasks translated twice each - literal UDF and idiomatic native - with timings on a frame
    of about a million rows.
  - The dictionary-lookup case solved with replace_strict, and the grouped-apply case recognised as an over() window
    rather than a UDF.
  - An elimination ledger with a SEMANTICS column, not only a speed column.
  - Ten captured functions classified to a rung or to unsupported, applying the rule that the question is whether
    the operation has an expression equivalent, not whether Python code appears.
  - A written condition under which the lowering should refuse rather than fall back, and who decides.
  - '`s8b-check.py` passes (18 assertions).'
  exam_critical: false
  concepts:
  - concept-python
  - concept-map-family
  - concept-dispatch
  scope_triage: required-now
  resources:
  - id: resource-polars-s8b-sheet
    kind: practise
    label: Stage exercise sheet - the five rungs, the length trap, and the elimination ledger
    locator: attachments/s8b-exercises.md - Part A first; Part B's five tasks are the deliverable
    angle: Reframes UDFs as an optimizer-visibility problem, then makes you measure the claim rather than repeat
      it.
    angle_detail: 'The trap in Part A is `map_batches` returning a Series of a different length: the frame''s height
      changes and nothing raises, because no length contract is enforced. Part B''s five tasks are chosen so the
      answers differ — a dictionary lookup has a native form most people miss (`replace_strict`), a grouped apply
      is an `over()` window in disguise, and one of the five is a genuine fallback that should be named as such
      rather than forced.'
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-lazy-udf-interop/stages/stage-polars-16-udfs-fallbacks-and-native-expression-rewrites/attachments/s8b-exercises.md
  - id: resource-polars-s8b-check
    kind: practise
    label: Answer-key self-check - 18 assertions across the rungs
    locator: attachments/s8b-check.py
    angle: Asserts that the length trap does NOT raise, which is the only way to record an absent error.
    angle_detail: It captures PolarsInefficientMapWarning and checks that the printed rewrite is the expected native
      expression, so the library's own linter output is pinned. It also confirms the grouped-apply rewrite against
      pandas' answer, which is the equivalence claim the elimination ledger depends on.
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-lazy-udf-interop/stages/stage-polars-16-udfs-fallbacks-and-native-expression-rewrites/attachments/s8b-check.py
  - kind: reference
    label: Official reference — docs.pola.rs — user defined python functions
    id: resource-polars-13-03-official-reference-docs-pola-rs-user-d
    locator: §'User-defined Python functions' - map_elements vs map_batches, and the 'avoid if possible' guidance
    url: https://docs.pola.rs/user-guide/expressions/user-defined-python-functions/
    scope_triage: required-now
    angle: The maintainers' own ranking of the rungs, including the reasoning this stage is built on.
    angle_detail: 'The page is unusually direct about not using these functions, and the reason it gives is the
      one that matters: the engine cannot see inside them. Read that as the optimizer argument rather than the speed
      argument — Task A4 measures it — because the speed argument alone would suggest a fast UDF is fine, and the
      optimizer argument says otherwise.'
  - kind: reference
    label: Official reference — docs.pola.rs — polars.Expr.map_elements.html
    id: resource-polars-13-04-official-reference-docs-pola-rs-polars
    locator: Expr.map_elements - return_dtype, the null-handling note, and the strategy parameter
    url: https://docs.pola.rs/api/python/stable/reference/expressions/api/polars.Expr.map_elements.html
    scope_triage: reference-only
    angle: The parameter that turns a silent inference into a declared contract.
    angle_detail: 'Read the `return_dtype` entry and the note on how nulls are passed to your function. The second
      is the one that breaks equivalence: a native expression propagates missingness without calling anything, while
      a Python callable may be handed None and return something — so a rewrite that looks equivalent on complete
      data is not equivalent on real data.'
  - kind: reference
    label: Optional depth — docs.pola.rs — polars.Expr.map_batches.html
    id: resource-polars-13-07-optional-depth-docs-pola-rs-polars-exp
    locator: Expr.map_batches - is_elementwise, returns_scalar, and the absence of a length contract
    url: https://docs.pola.rs/api/python/stable/reference/expressions/api/polars.Expr.map_batches.html
    scope_triage: helpful-now
    angle: 'Promoted: the length trap in Part A is a direct consequence of what this page does not promise.'
    angle_detail: There is no enforcement that the returned Series has the input's length, which is why returning
      `x.head(1)` silently reshapes the frame. Read the `is_elementwise` flag too — telling the optimizer that your
      batch function is elementwise is how you get some of the passes back, and lying about it is how you get a
      wrong plan.
  - kind: read
    label: Required core — python-polars-the-definitive-guide.pdf
    id: resource-polars-13-01-required-core-python-polars-the-defini
    locator: Ch 17 §Applying a Function to Elements pp. 504-506, to Series pp. 507-508, to Groups pp. 508-510, to
      an Expression pp. 511-512
    vault_path: material://source-polars-definitive-guide/python-polars-the-definitive-guide.pdf
    scope_triage: required-now
    source_id: source-polars-definitive-guide
    angle: The book organises UDFs by granularity, which is exactly the rung ladder this stage builds.
    angle_detail: Four sections, four granularities, in the order the sheet uses them. Read pp. 508-510 on group
      application carefully and then ask whether the example needs a UDF at all — most grouped applies are `over()`
      windows, which is Task B1 case 5. Early-release edition; confirm the callable names against 1.36.0, since
      this area has been renamed before.
  - kind: reference
    label: Official reference — pandas.pydata.org — basics.html
    id: resource-polars-13-05-official-reference-pandas-pydata-org-b
    locator: §'Function application' - the apply/agg/transform/map split
    url: https://pandas.pydata.org/docs/user_guide/basics.html#function-application
    scope_triage: reference-only
    angle: pandas' four application methods, which map onto Polars' rungs unevenly.
    angle_detail: Worth one pass to see that pandas' split is by *what is returned* (scalar, same-shape, elementwise)
      while Polars' is by *what is passed in* (column, batch, element, row). Because the two taxonomies cut the
      space differently, a per-method translation table is the wrong shape — classify by operation, which is Part
      C.
  - kind: read
    label: Local material — 03.12-Performance-Eval-and-Query.ipynb
    id: resource-polars-13-02-local-material-03-12-performance-eval
    source_id: source-pydata-handbook
    locator: §'When to Use These Functions' - the frame-size discussion
    vault_path: material://source-pydata-handbook/PythonDataScienceHandbook/notebooks/03.12-Performance-Eval-and-Query.ipynb
    scope_triage: reference-only
    angle: pandas' own guidance on when its optimizations stop being worth it, which is a template for your ledger.
    angle_detail: 'The useful part is the framing: the answer is a frame size, not a rule. Your elimination ledger
      should reach the same shape — below some size, the UDF is fine and the rewrite is not worth the risk of changing
      semantics. Pre-3.0 numbers; take the method, not the thresholds.'
  - kind: practise
    label: Axis pass — classify every divergence found this session against the eight axes, then add one harness
      case per divergence and re-run the whole harness.
    id: resource-polars-16-99-axis-pass
    locator: Sheet Part B Task B2, then deposit into the Session 1 harness
    scope_triage: required-now
    angle: 'The deposits here are equivalence cases: the rewrite must match the UDF on data that includes nulls.'
    angle_detail: Every native rewrite in the elimination ledger is a claim that two implementations agree. Commit
      each as a harness case with a null-bearing fixture, since that is precisely where a bytecode-derived suggestion
      and the original callable diverge.
