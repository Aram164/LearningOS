  title: Lazy plans and optimizer literacy
  status: pending
  objective: 'Read the plan the engine actually runs: make each of the eight documented optimizer passes visible
    in a query you wrote, turn one off and watch the plan change, profile a query to find where the time really
    goes, and understand what changes when the default engine becomes streaming.'
  done_when:
  - At least five of the eight documented passes demonstrated with a specific plan line, and for any that could
    not be made visible, a statement of what was tried and what that says about the pass's preconditions.
  - The claim that a pass fired is backed ONLY by plan text - including checking whether simplify_expression actually
    removes `col('a') + 0` before saying it does.
  - 'CSE demonstrated in both directions: the hoisted __POLARS_CSER_ node present by default and absent under QueryOptFlags(comm_subexpr_elim=False),
    with the shared subtree appearing once versus twice.'
  - The QueryOptFlags field list enumerated, and the two CSE flags noticed where the documentation lists one.
  - 'The currency fact recorded: collect(no_optimization=True) is deprecated since 1.30.0 in favour of the optimizations=
    parameter.'
  - A query profiled with .profile(), the most expensive node named, and the query then changed to make a different
    node dominate.
  - The same query run under engine='in-memory' and engine='streaming' with identical results, plus the 2.0 note
    on streaming becoming the default and row order no longer being guaranteed.
  - An eager pandas pipeline and its lazy Polars mirror compared by materializations rather than by benchmark, with
    at least one intermediate pandas builds that Polars never does.
  - pandas eval/query correctly characterised as expression-level evaluation rather than query planning.
  - A two-layer diagram with a rely / duplicate / avoid-interfering decision for each of the eight passes, including
    at least one 'avoid interfering'.
  - '`s8a-check.py` passes (22 assertions).'
  exam_critical: false
