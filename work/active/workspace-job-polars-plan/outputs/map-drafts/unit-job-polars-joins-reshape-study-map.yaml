- id: stage-polars-14-concatenation-and-reshaping
  number: 3
  title: Concatenation and reshaping
  status: pending
  objective: Learn the five Polars concat modes as a set and the reshaping verbs natively, establish where pandas'
    permissive defaults differ from Polars' strict ones, and carry out an explicit currency pass on the part of
    the API that is moving fastest in this module.
  done_when:
  - All five concat modes run and tabulated, with the pandas-equivalent mode identified and a reason given for why
    Polars made the strict one the default.
  - '`align` understood as a join-and-union rather than a concatenation, and named as the thing usually wanted when
    someone reaches for axis=1.'
  - Eight reshaping operations written from intent, including unnest and partition_by.
  - 'The lazy boundary explained: a pivot''s output schema depends on the data, so LazyFrame.pivot requires the
    output columns declared up front.'
  - The concat default divergence recorded as a harness case - Polars raises ShapeError naming both columns where
    pandas silently unions into a wider frame of nulls.
  - vertical versus vertical_relaxed settled against the Session 4 supertype rule, and pandas identified as the
    relaxed one.
  - Horizontal concat run and its 1.36 padding behaviour recorded, together with the note that 2.0 makes it an error
    and moves padding to how='horizontal_extend'.
  - pivot on repeated (index, on) pairs run with and without aggregate_function, and mapped onto pandas' pivot/pivot_table
    split.
  - The melt deprecation warning captured verbatim, and three 2.0 migration notes written - melt removal, horizontal
    concat, and the streaming default's effect on row order.
  - The unpivot custom-naming behaviour pinned in the harness BY COLUMN CONTENT rather than by column name, with
    a re-check scheduled for the 2.0 move.
  - '`s7c-check.py` passes (24 assertions).'
  exam_critical: false
  concepts:
  - concept-python
  - concept-join-family
  - concept-projection-family
  scope_triage: required-now
  resources:
  - id: resource-polars-s7c-sheet
    kind: practise
    label: Stage exercise sheet - five concat modes, reshaping verbs, and a currency pass
    locator: attachments/s7c-exercises.md - Part A, then Part C in full
    angle: 'Carries the module''s explicit currency section: three API changes verifiable today, one behaviour to
      pin rather than explain.'
    angle_detail: 'Part C is the part that keeps this stage from expiring. It captures the `melt` deprecation warning
      verbatim, records the three 2.0 changes that reach into your own code, and ends on a result you should pin
      without explaining: `unpivot(variable_name=''var'', value_name=''val'')` returns columns ordered [''i'',''val'',''var'']
      in which the column named `val` holds the variable names and the column named `var` holds the values. The
      default naming is unaffected and pandas'' melt attaches the names as expected. Assert it by content, avoid
