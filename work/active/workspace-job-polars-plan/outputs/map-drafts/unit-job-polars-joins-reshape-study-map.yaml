- id: stage-polars-13-joins-ii-build-a-pandas-polars-join-compatibilit
  number: 2
  title: Build a pandas-Polars join compatibility layer
  status: pending
  objective: Build a standalone pandas-Polars join compatibility layer from blank - config, two executors, and a
    parity suite - so that every field in it exists because a measured divergence demanded it, and every boundary
    you decline to support is declined in writing.
  done_when:
  - Ten native joins written from intent first, including semi/anti for existence checks, validate for a cardinality
    contract, and join_asof/join_where.
  - A JoinConfig defined from blank, importing nothing from Stratum, where every field is justified by a named Stage
    1 finding.
  - At least sixteen parity cases built, covering shared/differing/multiple keys, overlapping columns, duplicate
    keys on each side, null keys, no matches, empty frames, two dtype-mismatch cases, and every join kind.
  - The empty-frame case checked for dtypes rather than only row count, since both libraries agree it is empty and
    can disagree about its schema.
  - 'The Int64/UInt64 key case decided: the Session 4 supertype rule sends the comparison through Float64, so keys
    above 2^53 can collide - recorded as unsupported or as a required explicit cast, not silently joined.'
  - A comparison helper that sorts only for join kinds with no order contract, with the contractual ones named and
    evidenced.
  - The suffix/coalesce algorithm reproduced closed-book, including the case where a caller-supplied suffix collides
    with an existing column.
  - Seven boundary decisions written - index joins, cross-with-predicate, indicator, validate, non-equi, key dtype
    mismatch, sort - with no blanks.
  - '`s7b-check.py` passes (20 assertions).'
  exam_critical: false
  concepts:
  - concept-python
  - concept-join-family
  - concept-dispatch
  - concept-dataframe-semantics
  scope_triage: required-now
  resources:
  - id: resource-polars-s7b-sheet
    kind: practise
    label: Stage exercise sheet - JoinConfig from blank, sixteen parity cases, seven boundaries
    locator: attachments/s7b-exercises.md - Part B Task B1 without opening any Stratum file
    angle: Requires every config field to be justified by a measured finding, so the layer cannot be copied into
      existence.
    angle_detail: 'The two cases that decide the design are 9 and 10. Case 9: an empty frame joined to a non-empty
      one has a schema, and the two libraries can agree it is empty while disagreeing about its dtypes — a comparison
      that short-circuits on row count never sees it. Case 10: an Int64 key against a UInt64 key resolves through
      Float64 by the Session 4 supertype rule, so ids above 2^53 can collide. That one should almost certainly be
      refused rather than joined.'
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-joins-reshape/stages/stage-polars-13-joins-ii-build-a-pandas-polars-join-compatibilit/attachments/s7b-exercises.md
