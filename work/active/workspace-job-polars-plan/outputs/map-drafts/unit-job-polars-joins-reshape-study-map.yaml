    angle_detail: Promoted from optional depth because Part A exercises both. `join_asof` has a pandas counterpart
      in `merge_asof`; `join_where` does not, and its pandas equivalent is a cross join followed by a filter — which
      is a different cost profile, not just a different spelling. Worth knowing before you tell a caller that a
