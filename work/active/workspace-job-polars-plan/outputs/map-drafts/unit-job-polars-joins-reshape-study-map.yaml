    angle_detail: It also pins the pandas contradiction — merge matches null keys while `Series == Series` says
      two nulls are unequal — as two assertions side by side, which is the clearest way to hold a fact that sounds
      wrong when stated in prose.
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-joins-reshape/stages/stage-polars-12-joins-i-relational-semantics-and-key-cardinality/attachments/s7a-check.py
