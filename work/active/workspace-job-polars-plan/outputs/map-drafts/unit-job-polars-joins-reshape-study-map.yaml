    url: https://github.com/PacktPublishing/Polars-Cookbook
    angle: The one local-book alternative that targets 1.x rather than an early-release edition, and it is runnable.
    angle_detail: 'Yuki Kakegawa''s Polars Cookbook (Packt), foreword by Marco Gorelli, a Polars core contributor.
      The book is ''over 60 practical recipes ... using Python Polars 1.x'' — so unlike the Definitive Guide PDF
