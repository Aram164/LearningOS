- id: stage-polars-12-joins-i-relational-semantics-and-key-cardinality
  number: 1
  title: Relational joins and key cardinality
  status: pending
  objective: 'Derive join row counts from key multiplicity before writing any join, then establish the four places
    the two libraries disagree about what a join means: null-key matching, suffix policy, key-column coalescing,
    and validation errors.'
  done_when:
  - Row counts for all seven join kinds predicted from key multiplicity BEFORE running, and each derivation explained
    - including why semi and anti are filters rather than row-combining operations.
  - 'The Polars-only kinds exercised: semi, anti, join_asof, join_where, with a statement of what pandas needs extra
    steps for.'
  - 'A join plan read: the INNER JOIN node, both PLAN ON sections, and which columns each side''s scan reads.'
  - The null-key divergence recorded as a harness case - pandas matches null keys by default, Polars does not -
    with the Polars keyword that switches it named.
  - 'The contradiction noted and explained: pandas'' merge matches nulls while its element-wise comparison says
    two nulls are unequal.'
  - Both suffix rules recorded (Polars suffixes only the right, pandas suffixes both) and a written decision on
    which naming a compatibility layer produces.
  - 'The full-join key trap confirmed by execution: without coalesce=True the k column is missing every right-only
    key, while pandas'' outer merge coalesces by default.'
  - Both validate=1:1 exception types recorded, with a decision on re-raise versus translate.
  - Eight pandas merge/join calls normalized to JoinOp fields on paper, with unsupported features named rather than
    approximated.
  - '`s7a-check.py` passes (29 assertions).'
  exam_critical: false
  concepts:
  - concept-python
  - concept-join-family
  - concept-dataframe-semantics
  scope_triage: required-now
  resources:
  - id: resource-polars-s7a-sheet
    kind: practise
    label: Stage exercise sheet - cardinality first, then the four silent divergences
    locator: attachments/s7a-exercises.md - Part A Task A1 before anything else
    angle: Lands on the full join whose key column is missing every right-only key - the module's most dangerous
      default so far.
    angle_detail: 'Part B works through four divergences that all change results without raising. The one to read
      twice is B3: `A.join(B, on=''k'', how=''full'')` produces `k` AND `k_right`, and the `k` column holds [''a'',''b'',None]
      while the real key set is {a,b,c} — the right-only key lives only in `k_right`. pandas'' outer merge coalesces
      by default, so a translated query silently changes which keys are visible. `coalesce=True` repairs it.'
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-joins-reshape/stages/stage-polars-12-joins-i-relational-semantics-and-key-cardinality/attachments/s7a-exercises.md
