      than defaults.
    angle_detail: It asserts that a caller-supplied suffix which collides with an existing column raises DuplicateError
      in Polars and MergeError in pandas — the case neither library documents prominently and every compatibility
      layer eventually hits. It also builds pandas' `indicator=True` out of a coalesced full join and a when/then
