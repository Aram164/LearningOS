units:
- unit:
    id: unit-job-polars-pandas-fluency
    type: unit
    module_id: module-job-polars
    kind: topic
    title: Session 1 - Backend contracts and parity harness
    order: 1
    scope: Specify observable pandas behavior at the operation boundary, target Polars 1.36.0, and create
      the cumulative executable harness used by every later session.
    status: ready
    knowledge_map:
      summary: Specify observable pandas behavior at the operation boundary, target Polars 1.36.0, and
        create the cumulative executable harness used by every later session.
      nodes:
      - id: knowledge-polars-version-contract
        title: Pinned backend contract
        summary: Separate version facts, documented guarantees, executable observations, and Stratum policy.
        concept_ids:
        - concept-dataframe-semantics
        - concept-logical-ir
        - concept-dispatch
      - id: knowledge-polars-divergence-axes
        title: Eight divergence axes
        summary: Classify index, missingness, dtype, ordering, shape, context, key-cardinality, and failure
          differences.
        concept_ids:
        - concept-dataframe-semantics
        - concept-logical-ir
        - concept-dispatch
        builds_on:
        - knowledge-polars-version-contract
      - id: knowledge-polars-parity-harness
        title: Differential parity harness
        summary: Record comparable values, schemas, order, exceptions, warnings, and justified normalization.
        concept_ids:
        - concept-dataframe-semantics
        - concept-logical-ir
        - concept-dispatch
        builds_on:
