  path: curriculum/modules/module-hu-aml/source-map.yaml
  provenance: operator
detours: []
shelving:
  state: none
stages:
- id: stage-aml-l10-motivation
  number: 1
  title: Spatial structure and weight sharing
  status: pending
  objective: Why flattening images is inefficient and how locality, translation structure, and shared
    filters address it.
  done_when:
  - 'Reproduce without notes: Why flattening images is inefficient and how locality, translation structure,
    and shared filters address it.'
  exam_critical: true
  concepts:
  - concept-convolutional-networks
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L10 lecture deck
    source_id: source-aml-ss26-lectures
    locator: lecture-slides/VL 10-cnn.pdf
    angle: The 2026 scope authority for cross-correlation, filters, padding/stride/channel arithmetic,
      pooling, complete CNNs, and the LeNet-to-ResNet architecture lineage.
    vault_path: material://source-aml-ss26-lectures/lecture-slides/VL 10-cnn.pdf
    scope_triage: required-now
  - kind: read
    label: ISLP convolutional-neural-network section
    source_id: source-islp
    locator: islp.pdf §10.3 Convolutional Neural Networks, pdf pp. 413-419 (§10.3.1 convolution layers
      p. 414, §10.3.2 pooling p. 417, §10.3.3 architecture p. 417, §10.3.4 data augmentation p. 418)
    angle: A gentle full CNN pass through convolutional layers, pooling, architecture, and data augmentation;
      ideal before deeper shape and architecture references.
    vault_path: material://source-islp/islp.pdf
    scope_triage: helpful-now
  - kind: reference
    label: ESL early weight-sharing example
    source_id: source-esl
    locator: 'esl.pdf §11.7 Example: A Convolutional Neural Network for Digit Classification, pdf pp.
      423-425'
    angle: LeCun ZIP-code networks show the historical origin of local connectivity and weight sharing,
      but ESL has no modern full CNN treatment.
    vault_path: material://source-esl/esl.pdf
    scope_triage: reference-only
  - kind: read
    label: Murphy convolution and classic CNN architectures
    source_id: source-murphy-pml1
    locator: pml1.pdf §14.1 Introduction, pdf p. 497; §14.2 Common layers, pdf pp. 498-508 (convolution
      §14.2.1 p. 498; pooling §14.2.2 p. 505); §14.3 Common architectures, pdf pp. 509-515
    angle: 'The deepest aligned book source: exact output arithmetic plus one-to-one LeNet, AlexNet, GoogLeNet,
      and ResNet coverage.'
    vault_path: material://source-murphy-pml1/pml1.pdf
    scope_triage: helpful-now
  - kind: watch
    label: CS229 CNN segments
    source_id: source-cs229-2022-videos
    locator: CNN overview segments
    angle: Broad deep-learning context only; use the course deck, EECS 498, or CS231n for detailed CNN
      arithmetic.
    scope_triage: helpful-now
  - kind: watch
    label: StatQuest convolutional-network intuition
    source_id: source-statquest
    locator: CNN explainer selections
    angle: Short visual intuition for filters, feature maps, and CNN structure; not a substitute for hand
      shape arithmetic.
    scope_triage: helpful-now
  - kind: read
    label: Géron 3rd ed. Ch 14 — why not simply flatten the image
    source_id: source-geron-handson
    locator: geron-copy2.pdf (3rd ed.) Ch 14 'The Architecture of the Visual Cortex' pdf p. 620, 'Convolutional
      Layers' pdf p. 621
    angle: Answers the deck's opening question from the visual-cortex analogy and then in parameter counts,
      which is the argument the motivation slide compresses to one line.
    vault_path: material://source-geron-handson/geron.pdf
    scope_triage: helpful-now
  - kind: read
    label: Géron 3rd ed. Ch 14 exercises — the motivation asked back
    source_id: source-geron-handson
    locator: geron-copy2.pdf (3rd ed.) Ch 14 Exercises pdf p. 694 (Q1 CNN versus fully connected DNN,
      Q2 three 3×3 stride-2 'same' convolutional layers)
    angle: Q1 asks for the CNN-versus-dense argument in your own words and Q2 is a three-layer 3×3 stride-2
      'same' shape and parameter count; the only local drill that tests the motivation node rather than
      the arithmetic alone.
    vault_path: material://source-geron-handson/geron.pdf
    scope_triage: helpful-now
  - kind: reference
    label: Deep Learning book Ch 9 — convolutional networks
    source_id: source-goodfellow-dl
    locator: Ch 9 Convolutional Networks
    angle: The canonical conceptual treatment of convolution, sparse interactions, parameter sharing,
      equivariance, pooling, and CNN variants.
    scope_triage: reference-only
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-l10/stages/stage-aml-l10-motivation/notes.md
  attachments: []
  source_feedback: []
