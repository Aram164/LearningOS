      source_selections:
      - {source_id: source-islp, locator: "Ch 2 selections", purpose: "Learning task, generalization, data-split framing"}
      - {source_id: source-mit-6036, locator: "Introduction, representations, generalization", purpose: "Structured independent introduction"}
      - {source_id: source-domingos-useful-things, locator: "Complete essay", purpose: "Optional conceptual framing"}
