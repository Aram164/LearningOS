      order: 1
      scope: Current 2026 L01 deck; ML definitions and course orientation, historical milestones as a concept map, datasets/features/labels, learning tasks, train/test reasoning, MNIST/Iris examples, and the linear-algebra/tooling prerequisite shelf.
      status: ready
      scope_sources:
      - {source_id: source-aml-ss26-lectures, authority: slides, locator: "lecture-slides/VL 01-Introduction.pdf (69 pages)"}
