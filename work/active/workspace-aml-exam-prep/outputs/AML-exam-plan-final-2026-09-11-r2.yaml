- id: stage-aml-sitting-gate
  number: 1
  title: 'AML.G — sitting gate: registration, duration and permitted aids (11 September)'
  status: active
  estimate_minutes: 45
  objective: Close the administrative gate the old plan never carried. The 2.-PZ Anmeldung window closed
    on 10 September, one day before this plan begins, and COORDINATION.md records missing it as costing
    the exam outright. Nothing below is worth an hour until the registration is confirmed and the second-sitting
    duration and permitted aids are read from a current notice instead of inferred from the first sitting.
  done_when:
  - Confirm in AGNES that the 2. Termin registration completed inside its window (window dates live
    in the owning module record), and record the confirmation — or the exact failure — in this stage's
    working note.
  - 'Reconcile the two durations now on record: the owning module record books 09:00-12:00 and the Übung
    10 first-sitting rule says 120 minutes. Record which one a current second-sitting notice confirms,
    and keep 120 minutes as the rehearsal baseline only while the question stays open.'
  - 'Record the permitted aids for the second sitting from a current notice: handwritten A4 sheet and
    calculator are first-sitting facts until re-confirmed.'
  - If the registration did not complete, stop this plan the same day and escalate. The Ruecktritt deadline
    is 2026-09-23 and every stage below is void without the sitting.
