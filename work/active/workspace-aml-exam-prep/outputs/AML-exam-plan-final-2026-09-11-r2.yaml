- id: stage-aml-calibration
  number: 2
  title: AML.0 — cold L01-L11 calibration and error ledger (11-13 September)
  status: pending
  estimate_minutes: 300
  objective: Buy the triage before spending any repair time. Eleven topics are unworked and nineteen days
    remain against a parallel M2 track, so the plan cannot promise all of L02-L11 and must not pretend
    to. One 120-minute closed-book pass over every announced topic produces the error ledger, and the
    ledger — not the calendar — decides how deep each later stage goes and what is deliberately left.
  done_when:
  - Inside one 120-minute sitting, attempt at least one representative unseen item from every L02-L11
    mock closed-book, plus the L01 problem-formulation vocabulary from memory.
  - Classify every miss as definition, model-or-method choice, derivation, arithmetic-or-shape, interpretation,
    or time.
  - Mark each of L02-L04, L05-L07 and L08-L11 full-pass, repair-only or cold-skip from recorded evidence.
    A clean gate permits a recorded skip and is never called mastery.
  - Record the baseline score, the slowest three question types, and the ranked repair order that stages
    3-5 will follow.
  - Append one LearnerObservation per attempted topic to work/active/workspace-aml-exam-prep/observations.jsonl,
    so the triage is carried by the runtime rather than by memory.
