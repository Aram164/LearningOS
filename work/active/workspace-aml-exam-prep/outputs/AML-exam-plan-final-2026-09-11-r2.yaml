  status: pending
  estimate_minutes: 330
  objective: Run a second independent full-course paper to test whether the mock-1 repairs transfer under
    time pressure and whether the A4 sheet is actually usable, then close or explicitly accept every remaining
    red topic. This is the last stage that may open a source.
