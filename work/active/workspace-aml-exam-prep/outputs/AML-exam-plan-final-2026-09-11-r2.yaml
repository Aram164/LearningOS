- id: stage-aml-neural-transformer-loop
  number: 5
  title: AML.3 — L08 to L09 to L10 to L11 in dependency order (20-23 September)
  status: pending
  estimate_minutes: 540
  objective: 'Work the late-course arc in strict dependency order: forward pass, backpropagation, CNNs,
    then Transformers. These four lectures carry the operator-drafted artifacts, which become evidence
    only through learner calculations and closed-book mocks — never by being read.'
  done_when:
  - 'L08: compute a complete forward pass with shapes and parameter counts, choose correct output heads,
    and calculate binary and multiclass metrics.'
  - 'L09: backpropagate through the shared example, explain regularization and gradient pathologies, and
    verify one hand gradient against the deck''s autograd example. L09 owns neural-network regularization
    and does not cover batch normalization.'
  - 'L10: compute convolution outputs, padding, stride and channel shapes and parameter counts, then state
    the course-level contribution of LeNet, AlexNet, GoogLeNet and ResNet.'
  - 'L11: compute simplified and Q/K/V attention, trace the Transformer block, connect language-model
    cross-entropy back to L05, and treat slides 73-81 as learn-anyway safety material while their scope
    stays unresolved.'
  - For each lecture, work the exercise bank and sit the mock closed-book; open the material menu only
    on a miss and record the source choice before use.
  - Append a LearnerObservation per lecture, tagging which of the four the ledger still leaves red.
  exam_critical: true
  concepts:
  - concept-neural-network
  - concept-softmax
  - concept-backpropagation
  - concept-convolutional-networks
  - concept-residual-connection
  - concept-attention
  - concept-transformer
  - concept-positional-encoding
