- id: stage-aml-linear-optimization-repair
  number: 4
  title: AML.2 — L05-L07 classification and optimization (17-19 September)
  status: pending
  estimate_minutes: 420
  objective: Make the logistic-loss derivation, optimizer mechanics, perceptron updates and kernel calculations
    executable on paper before the neural arc opens. This is the cluster the exam rewards for derivation
    rather than recall, so the evidence here is written from a blank page.
  done_when:
  - Derive binary cross-entropy from the Bernoulli likelihood and write the vectorized logistic gradient
    from memory.
  - Trace batch, stochastic and mini-batch updates, and explain learning-rate, scaling, convexity, Adam
    and Newton tradeoffs at the lecture's depth.
  - Run primal and dual perceptron updates, compute a Gram or kernel value, and explain XOR, RBF bandwidth
    and one-vs-rest without importing SVM concepts, which L07 does not cover.
  - Complete the ledger-selected bank items and mocks for L05-L07, then update the error ledger and the
    A4-sheet ledger.
  - Append a LearnerObservation per derivation attempted, recording assistance used.
  exam_critical: true
