      - knowledge-aml-l09-backprop
      - knowledge-aml-l09-regularization
      - knowledge-aml-l09-stopping
      depth: intuition
      scope: complementary
      locator: islp.pdf §10.7 Fitting a Neural Network, pdf pp. 434-438; §10.8 Interpolation and Double
        Descent, pdf pp. 439-441
    - id: route-96b3bc3586d74e35b541bcb5
      unit_id: unit-aml-l10
      title: ISLP convolutional-neural-network section
