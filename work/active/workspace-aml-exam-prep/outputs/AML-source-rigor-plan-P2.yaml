  - source_id: source-esl
    role: optional-depth
    why: Graduate-depth statistical learning; selected only after the course/ISLP pass and never as the
      first neural-network source.
    priority: 10
    unit_routes:
    - id: route-f57ab8d5f480edd3bc6cf623
      unit_id: unit-aml-l02
      title: 'ESL flexibility spectrum: least squares to k-NN'
      format: book
      angle: Places least squares and k-NN on one flexibility axis, making the L02-to-L03 bridge explicit.
      covers:
      - knowledge-aml-l02-algorithm
      - knowledge-aml-l02-dimensionality
      depth: derivation
      scope: optional
      locator: esl.pdf §2.3.2 Nearest-Neighbor Methods, pdf pp. 33-34; §2.3.3 From Least Squares to Nearest
        Neighbors, pdf p. 35
      angle_detail: Read this when the apparent opposition between parametric regression and instance-based
        prediction is still fuzzy. ESL uses the two methods as endpoints of a flexibility spectrum and
        makes their inductive assumptions comparable; it is mathematical context, not an implementation
        recipe or the 2026 lecturer's scope authority.
    - id: route-0086c6cff5d3c462f714408f
      unit_id: unit-aml-l02
      title: ESL k-NN variance term
      format: book
      angle: Derives the k-NN variance term sigma-squared over k instead of leaving the bias-variance
        claim qualitative.
      covers:
      - knowledge-aml-l02-bias-variance
      depth: derivation
      scope: optional
      locator: esl.pdf §2.9 Model Selection and the Bias-Variance Tradeoff, pdf pp. 56-57
      angle_detail: This fragment earns its own route because it supplies the formula behind the lecture's
        qualitative statement that increasing k reduces variance. Use it to reproduce the sigma-squared-over-k
        argument; move to the separate ESL decomposition route for the full MSE identity and to the course
        deck for examined notation.
    - id: route-0e95ad858b8e59f63b8fe519
      unit_id: unit-aml-l02
      title: ESL bias-variance decomposition
      format: book
      angle: Gives the rigorous MSE decomposition and a worked comparison of k-NN with linear regression.
      covers:
      - knowledge-aml-l02-bias-variance
      depth: derivation
      scope: optional
      locator: esl.pdf §7.2 Bias, Variance, and Model Complexity, pdf pp. 238-241; §7.3 The Bias-Variance
        Decomposition, pdf pp. 242-247 (§7.3.1 example p. 245)
      angle_detail: This is the proof-depth route for Bias squared plus Variance plus irreducible noise,
        with k-NN and linear regression compared inside the same framework. It assumes comfort with expectations
        and squared error, goes beyond the deck's derivation depth, and does not teach the k-NN search
        algorithm.
    - id: route-7e3161b4c0b53524a0ce4dfa
      unit_id: unit-aml-l02
      title: ESL cross-validation rationale
      format: book
      angle: Explains why k-fold cross-validation estimates generalization error, complementing procedural
        sources.
      covers:
      - knowledge-aml-l02-validation
      depth: derivation
      scope: optional
      locator: esl.pdf §7.10 Cross-Validation, pdf pp. 260-264
      angle_detail: Use this after you can run a train-validation-test split but cannot justify why cross-validation
        is a reasonable estimator. ESL emphasizes the statistical rationale and its bias, complementing
        procedural code sources; it is not the place to memorize the lecturer's workflow or choose a library
        API.
    - id: route-83427e17512bd5e78ca4603e
      unit_id: unit-aml-l02
      title: ESL applied nearest-neighbour classification
      format: book
      angle: Shows prototype and nearest-neighbour classifiers with decision-boundary examples.
      covers:
      - knowledge-aml-l02-algorithm
      - knowledge-aml-l02-dimensionality
      depth: derivation
      scope: optional
      locator: esl.pdf §13.3 Prototypes and Nearest-Neighbors, pdf pp. 482-491
      angle_detail: This later chapter turns nearest neighbours into a classifier with visible decision
        regions and prototype comparisons. It is useful for geometric intuition after the L02 algorithm
        is known, but its broader classification setting and notation extend beyond what the current k-NN
        deck examines.
    - id: route-0c5b2516f89b5265bb3c86e2
      unit_id: unit-aml-l03
      title: ESL least-squares statistical depth
