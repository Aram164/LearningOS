units:
- unit:
    id: unit-aml-l10
    type: unit
    module_id: module-hu-aml
    kind: lecture
    title: AML Lecture 10 — Convolutional Neural Networks
    order: 10
    scope: Current 2026 L10 deck; convolution versus cross-correlation, filters, padding/stride/output
      shapes, multi-channel computation, parameter counts, pooling, complete CNNs, and the LeNet/AlexNet/GoogLeNet/ResNet
      architecture lineage.
    status: ready
    knowledge_map:
      summary: The lecture replaces dense image processing with local shared filters, builds complete
        convolutional networks through exact shape arithmetic, and uses landmark architectures to explain
        major design ideas.
      nodes:
      - id: knowledge-aml-l10-motivation
        title: Spatial structure and weight sharing
        summary: Why flattening images is inefficient and how locality, translation structure, and shared
          filters address it.
      - id: knowledge-aml-l10-convolution
        title: Convolution and cross-correlation
        summary: Sliding filters, elementwise multiply-and-sum, mathematical convolution versus the DL
          convention, and feature maps.
        builds_on:
        - knowledge-aml-l10-motivation
      - id: knowledge-aml-l10-shapes
        title: Padding, stride, channels, and shapes
        summary: Output-size formula, multi-channel filters, multiple feature maps, receptive fields,
          and parameter counting.
        builds_on:
        - knowledge-aml-l10-convolution
      - id: knowledge-aml-l10-pooling
        title: Pooling
        summary: Max/average pooling, spatial downsampling, invariance intuition, and shape changes.
        builds_on:
        - knowledge-aml-l10-shapes
      - id: knowledge-aml-l10-network
        title: Complete CNN architecture
        summary: Conv-activation-pool stacks, flattening/classifier heads, end-to-end shapes, and design
          tradeoffs.
        builds_on:
        - knowledge-aml-l10-shapes
        - knowledge-aml-l10-pooling
      - id: knowledge-aml-l10-architectures
        title: LeNet, AlexNet, GoogLeNet, and ResNet
        summary: The course-level contribution of each architecture, including depth, inception modules,
          and residual connections.
        builds_on:
        - knowledge-aml-l10-network
    scope_sources:
    - source_id: source-aml-ss26-lectures
      authority: slides
      locator: lecture-slides/VL 10-cnn.pdf (70 pages)
    - source_id: source-aml-ss26-lectures
      authority: reference
      locator: older-lecture-slides/10-cnn_e88d2bb6a525f5e7dc6e15044f252d21.pdf
    source_selections: []
    artifacts:
      ultimate_reference: note-aml-l10-cnn
      exercise_bank: note-aml-l10-exercise-bank
      mock_exam: note-aml-l10-mock-exam
    workspace_ids:
    - workspace-aml-exam-prep
    current_study_map: study-map-aml-l10
