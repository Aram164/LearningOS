  - source_id: source-islp
    role: spine
    why: Gentle statistical-learning spine; Ch 2 for framing, Ch 10 for neural networks/CNNs/RNNs, and
      scoped chapters for L02–L07.
    priority: 1
    unit_routes:
    - id: route-21f9795d5af805470f6b7aa8
      unit_id: unit-aml-l01
      title: ISLP Chapter 2 — statistical learning
      format: book
      angle: A gentle, example-driven explanation of prediction, inference, supervised/unsupervised tasks,
        model flexibility, train/test error, and the vocabulary behind problem formulation.
      covers:
      - knowledge-aml-l01-formulation
      - knowledge-aml-l01-generalization
      depth: intuition
      scope: complementary
      locator: islp.pdf §2.1 What Is Statistical Learning?, pdf pp. 25-36; §2.2 Assessing Model Accuracy,
        pdf pp. 37-48 (bias-variance §2.2.2 p. 41; classification setting §2.2.3 p. 44)
    - id: route-9654e119999a435926afd588
      unit_id: unit-aml-l02
      title: ISLP bias-variance and classification setting
      format: book
      angle: The gentlest entry to the U-shaped test-error curve and its regression/classification distinction.
      covers:
      - knowledge-aml-l02-bias-variance
      depth: intuition
      scope: complementary
      locator: islp.pdf §2.2.2 The Bias-Variance Trade-Off, pdf pp. 41-43; §2.2.3 The Classification Setting,
        pdf pp. 44-48
      angle_detail: Start here when the U-shaped test-error curve is not yet intuitive. ISLP separates
        regression from classification and explains the flexibility trade-off with lighter algebra than
        ESL; it prepares the lecture but does not provide the exact L02 algorithm trace or course notation.
    - id: route-70fa847b6d98c5b1c15f1b67
      unit_id: unit-aml-l02
      title: ISLP linear regression versus k-NN
      format: book
      angle: Compares the parametric linear fit and flexible k-NN directly on the same prediction problem.
      covers:
      - knowledge-aml-l02-algorithm
      - knowledge-aml-l02-bias-variance
      depth: intuition
      scope: complementary
      locator: islp.pdf §3.5 Comparison of Linear Regression with K-Nearest Neighbors, pdf pp. 120-124
      angle_detail: 'This short comparison is the cleanest bridge from L02 to L03: the same prediction
        setting exposes where a rigid linear model or a flexible neighbourhood model wins. Use it to explain
        model assumptions, not as a source for implementation details, distance scaling, or validation
        procedure.'
    - id: route-27f0b891c4075763371fc04b
      unit_id: unit-aml-l02
      title: ISLP k-NN implementation lab
      format: code
      angle: Turns the classifier into an executable lab and makes the decision rule observable in code.
      covers:
      - knowledge-aml-l02-algorithm
      depth: implementation
      scope: complementary
      locator: islp.pdf §4.7.6 K-Nearest Neighbors, pdf pp. 192-195
      angle_detail: Run this lab when you want to see the classification rule operate on real data and
        compare predicted classes. Its value is executable feedback rather than additional theory; the
        lab's Python workflow is complementary and may not match the lecturer's exact variable names or
        exam presentation.
    - id: route-7721480f8976c20d5fa0b4eb
      unit_id: unit-aml-l02
      title: ISLP validation for choosing k
      format: book
      angle: Provides the resampling machinery needed to choose k without touching the test set.
      covers:
      - knowledge-aml-l02-validation
      depth: intuition
      scope: complementary
      locator: islp.pdf §5.1 Cross-Validation, pdf pp. 210-219 (§5.1.3 k-fold p. 214; §5.1.4 bias-variance
        p. 216)
      angle_detail: Use these sections to turn the lecture's validation warning into an actual selection
        protocol for k. They distinguish validation-set, leave-one-out, and k-fold estimates and discuss
        their bias-variance behavior; the route is broader than the exam's required procedure and should
        not replace the course deck's split discipline.
    - id: route-d3bb781518afd9298b86e667
      unit_id: unit-aml-l03
      title: ISLP Chapter 3 — linear regression
      format: book
      angle: A readable statistical account of simple/multiple regression and fit assessment; it adds
        interpretation and diagnostics beyond the deck's derivation-first treatment.
      covers:
      - knowledge-aml-l03-problem
      - knowledge-aml-l03-loss
      - knowledge-aml-l03-solution
      depth: intuition
      scope: complementary
      locator: islp.pdf §3.1 Simple Linear Regression, pdf pp. 79-88; §3.2 Multiple Linear Regression,
        pdf pp. 89-99
    - id: route-9b7338b2096b7f03eef6d176
      unit_id: unit-aml-l04
      title: ISLP polynomial regression, Ridge, and Lasso
      format: book
      angle: A gentle route from multiple regression to polynomial basis functions and shrinkage geometry;
        skip splines/subset selection because they exceed the lecture.
      covers:
      - knowledge-aml-l04-multivariate
      - knowledge-aml-l04-basis
      - knowledge-aml-l04-overfitting
      - knowledge-aml-l04-ridge
      - knowledge-aml-l04-lasso
      depth: intuition
      scope: complementary
      locator: islp.pdf §3.2 Multiple Linear Regression, pdf pp. 89-99; §2.2.2 The Bias-Variance Trade-Off,
        pdf pp. 41-43; §§6.2.1-6.2.2 Ridge Regression and the Lasso, pdf pp. 248-259; §7.1 Polynomial
        Regression and Step Functions, pdf pp. 298-313
    - id: route-b5479427410717e42df4b6af
      unit_id: unit-aml-l05
      title: ISLP logistic-regression sections
      format: book
      angle: A gentle interpretation through probabilities, odds, and log-odds, with MLE coefficient fitting;
        lighter on the full vectorized cross-entropy derivation than the deck.
      covers:
      - knowledge-aml-l05-classification
      - knowledge-aml-l05-sigmoid
      - knowledge-aml-l05-likelihood
      depth: intuition
      scope: complementary
      locator: islp.pdf §4.3 Logistic Regression, pdf pp. 147-155 (logistic model §4.3.1 p. 148; multiple
        logistic regression §4.3.4 p. 151)
    - id: route-f0ccf205ed8c7df0ef0c8687
      unit_id: unit-aml-l06
      title: ISLP neural-network optimization selection
      format: book
      angle: ISLP has no standalone classical gradient-descent chapter; §10.7 is useful only as a compact
        training/SGD review after the lecture, not as the primary L06 explanation.
      covers:
      - knowledge-aml-l06-batch-gd
      - knowledge-aml-l06-stochastic
      depth: orientation
      scope: optional
      locator: islp.pdf §10.7 Fitting a Neural Network, pdf pp. 434-438 (backpropagation §10.7.1 p. 435;
        regularization and SGD §10.7.2 p. 436)
    - id: route-250a1234665348201198e7ef
      unit_id: unit-aml-l07
      title: ISLP one-versus-all and kernel enrichment
      format: book
      angle: §9.4.2 is an exact one-page match for one-vs-rest. The kernel material is taught through
        SVMs, so §9.3.2 is enrichment only and must not redefine the lecture as an SVM unit.
      covers:
      - knowledge-aml-l07-kernels
