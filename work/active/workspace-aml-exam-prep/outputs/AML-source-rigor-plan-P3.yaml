    - id: route-987303d08d29f8315ce9a8e6
      unit_id: unit-aml-l08
      title: ISLP feedforward-network introduction
      format: book
      angle: The gentlest book-length account of network notation, forward passes, parameter counting,
        and output construction; good when the deck moves too quickly through shapes.
      covers:
      - knowledge-aml-l08-forward
