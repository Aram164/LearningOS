      locator: islp.pdf §10.1 Single Layer Neural Networks, pdf pp. 407-408; §10.2 Multilayer Neural Networks,
        pdf pp. 409-412
    - id: route-9479853098e251427bc92b4a
      unit_id: unit-aml-l09
      title: ISLP training, regularization, and double descent
      format: book
      angle: Covers backprop/SGD at a gentle level and is unusually well aligned on weight decay, dropout,
