    stages:
    - id: stage-aml-calibration
      title: AML.0 — cold L01–L11 calibration (19–22 August)
      status: active
      objective: Before further reading, run a 120-minute closed-book diagnostic across all eleven announced topics
        and turn the result into an error ledger that decides full-pass, repair-only or cold-skip treatment for
        every later cluster.
      done_when:
      - Recall the L01 problem-formulation vocabulary for ten minutes, then attempt at least one representative
        unseen item from every L02–L11 mock without opening an answer key.
      - Classify every miss as definition, model-or-method choice, derivation, arithmetic-or-shape, interpretation,
        or time.
      - Mark L02–L04, L05–L07 and each of L08–L11 full-pass, repair-only or cold-skip from recorded evidence;
        a clean gate permits a recorded skip but is not called mastery.
      - Record the baseline score and the slowest three question types, then choose the first repair cluster.
      exam_critical: true
      concepts:
      - concept-logistic-regression
      - concept-gradient-descent
      - concept-perceptron
      - concept-neural-network
      - concept-backpropagation
      - concept-convolutional-networks
      - concept-transformer
