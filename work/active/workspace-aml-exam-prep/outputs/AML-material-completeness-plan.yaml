source_map:
  type: module-source-map
  module_id: module-hu-aml
  sources:
  - source_id: source-aml-ss26-lectures
    role: course-material
    why: Current L01-L11 decks define the 2026 scope. The primer, bonus sheets and Übung 02-11 provide course-aligned
      practice; older L01-L10 variants are prior-year alternatives, and the older L11 RNN deck is superseded and
      out of the 2026 exam scope.
    priority: 0
    unit_routes:
    - unit_id: unit-aml-l01
      title: Current L01 lecture deck
      format: course-material
      angle: The scope authority for 2026. It introduces the historical concept map, ML definitions, learning
        tasks, dataset notation, course expectations, and the examples the lecturer can examine.
      covers:
      - knowledge-aml-l01-history
      - knowledge-aml-l01-formulation
      - knowledge-aml-l01-data
      - knowledge-aml-l01-generalization
      depth: course-aligned
      scope: current
      locator: lecture-slides/VL 01-Introduction.pdf
    - unit_id: unit-aml-l01
      title: Linear-algebra primer
      format: course-material
      angle: A 36-page diagnostic for vectors, matrices, products, dimensions, and differentiation; use it to
        identify prerequisite gaps, not as a second full lecture.
      covers:
      - knowledge-aml-l01-prerequisites
      - knowledge-aml-l01-data
      depth: course-aligned
      scope: prerequisite
      locator: Primer_Linear_Algebra.pdf
    - unit_id: unit-aml-l01
      title: Older L01 lecture variant
      format: course-material
      angle: A prior-year version useful only for alternate examples or explanations omitted from the current
        deck.
      covers:
      - knowledge-aml-l01-history
      - knowledge-aml-l01-formulation
      depth: advanced-reference
      scope: prior-year
      locator: older-lecture-slides/01-Introduction_2da1f48f12009c6454c7265ad76c6a19.pdf
    - unit_id: unit-aml-l02
      title: Current L02 lecture deck
      format: course-material
      angle: 'The 2026 scope authority: vector embeddings, 1-NN/k-NN, lazy-learning cost, bias-variance, cross-validation,
        Lp distances, scaling, and sensitivity to irrelevant features.'
      covers:
      - knowledge-aml-l02-representation
      - knowledge-aml-l02-algorithm
      - knowledge-aml-l02-distance
      - knowledge-aml-l02-dimensionality
      - knowledge-aml-l02-bias-variance
      - knowledge-aml-l02-validation
      depth: course-aligned
      scope: current
      locator: lecture-slides/VL 02-nearest-neighbor.pdf
    - unit_id: unit-aml-l02
      title: Übung 02 — k-NN search with vector embeddings
      format: exercise
      angle: 'The current applied companion: CLIP embeddings, Stanford Dogs, NumPy, neighbour search, scaling,
        and validation tasks turn the lecture geometry into executable work.'
      covers:
      - knowledge-aml-l02-representation
      - knowledge-aml-l02-algorithm
      - knowledge-aml-l02-distance
      - knowledge-aml-l02-validation
