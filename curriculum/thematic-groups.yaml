# The subject taxonomy (ADR-007). Groups are chosen to stay true for a
# decade, not a semester: no group names an era, a module or a format.
# Subgroups live in the shelves under sources/collections/.
thematic_groups:
  - id: thematic-group-mathematics
    title: Mathematics
    description: >-
      Probability and statistics, analysis and calculus, linear algebra,
      discrete mathematics and proof craft.
    order: 10
  - id: thematic-group-optimization
    title: Optimization & Learning Theory
    description: >-
      Convex, numerical and combinatorial optimization; statistical learning
      theory and kernel methods — the bridge between mathematics and
      learning.
    order: 20
  - id: thematic-group-machine-learning
    title: Machine Learning
    description: >-
      Statistical and classical ML, deep learning, reinforcement learning,
      vision, and intuition-building explainers.
    order: 30
  - id: thematic-group-ml-systems
    title: ML Systems
    description: >-
      Training and serving at scale, ML compilation, performance and
      parallelism, and data management for ML.
    order: 40
  - id: thematic-group-data-systems
    title: Data Systems
    description: >-
      Databases, distributed systems, provenance and lineage, reliability
      and benchmarking.
    order: 50
  - id: thematic-group-algorithms
    title: Algorithms & Computation
    description: >-
      Algorithms and data structures, complexity and computability,
      parameterized and approximation algorithms, experimental algorithmics.
    order: 60
  - id: thematic-group-software
    title: Software & Languages
    description: >-
      Python craft and idiom, CPython internals, software engineering
      practice, languages and compilers, tooling and environment.
    order: 70
  - id: thematic-group-method-admin
    title: Method & Administration
    description: >-
      Research method, degree regulations, and dataset catalogues — small,
      but everything needs a home or it becomes invisible.
    order: 80
