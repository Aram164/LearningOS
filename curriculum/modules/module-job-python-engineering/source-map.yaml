- source_id: source-uv-docs
  role: reference
  why: Current project and environment workflow; related maturin reading is labelled by publisher.
  priority: 1
  unit_routes:
  - id: route-python-tooling-uv-docs-1
    unit_id: unit-job-python-engineering-fluency
    title: uv - Working on projects
    format: documentation
    angle: The current project workflow absent from the old packaging stage.
    angle_detail: Read the guide. Commands are examples, not instructions to change Stratum or create
      a new project.
    covers:
    - knowledge-python-tooling
    depth: orientation
    scope: current
    locator: 'Page "uv - Working on projects": Project structure; managing dependencies; running commands;
      building distributions for context'
    url: https://docs.astral.sh/uv/guides/projects/
  - id: route-python-tooling-uv-docs-2
    unit_id: unit-job-python-engineering-fluency
    title: uv - Locking and syncing
    format: documentation
    angle: Why the lockfile, declared dependencies and environment are different things.
    angle_detail: Read how --locked, --frozen and extras affect reproducibility; avoid blindly copying
      the tutorial's sync command into a work repository.
    covers:
    - knowledge-python-tooling
    depth: orientation
    scope: current
    locator: 'Page "uv - Locking and syncing": Locking and syncing; automatic lock/sync; extras and dependency
      groups; exact versus inexact sync'
    url: https://docs.astral.sh/uv/concepts/projects/sync/
- source_id: source-typing-docs
  role: reference
  why: Current version-aware annotation guidance.
  priority: 1
  unit_routes:
  - id: route-python-type-hints-typing-docs-1
    unit_id: unit-job-python-engineering-fluency
    title: Modernizing superseded typing features
    format: documentation
    angle: Reconciles book-era typing with current recommendations and a 3.11 minimum.
    angle_detail: Read newer syntax for recognition only when its minimum is above 3.11. The future annotations
      import changes annotation handling, not runtime checking.
    covers:
    - knowledge-python-type-hints
    depth: orientation
    scope: current
    locator: 'Page "Modernizing superseded typing features": Introduction, built-in generics, union syntax,
      TypeAlias and TypeVar notes; check the stated minimum version for each feature'
    url: https://typing.python.org/en/latest/guides/modernizing.html
  - id: route-python-type-hints-typing-docs-2
    unit_id: unit-job-python-engineering-fluency
    title: Typing - Generics
    format: documentation
    angle: A version-aware companion to the book's Generic examples.
    angle_detail: Reference only; no variance proofs or checker setup.
    covers:
    - knowledge-python-type-hints
    depth: orientation
    scope: current
    locator: 'Page "Typing - Generics": Generic classes and TypeVar; distinguish Python 3.11 forms from
      3.12+ syntax'
    url: https://typing.python.org/en/latest/reference/generics.html
  - id: route-python-interfaces-dispatch-typing-docs-1
    unit_id: unit-job-python-engineering-fluency
    title: Typing - Protocols
    format: documentation
    angle: Current guidance for describing an interface without imposing inheritance.
    angle_detail: Read the ordinary examples. Advanced protocol variance and runtime introspection are
      outside scope.
    covers:
    - knowledge-python-interfaces-dispatch
    depth: orientation
    scope: current
    locator: 'Page "Typing - Protocols": Simple user-defined protocols; protocol members; structural subtyping'
    url: https://typing.python.org/en/latest/reference/protocols.html
