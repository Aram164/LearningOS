  - id: route-python-functions-scope-fp-1
    unit_id: unit-job-python-engineering-fluency
    title: Fluent Python 2e - Functions, scope and closures
    format: book
    angle: The main explanation and worked examples for functions, scope and closures.
    angle_detail: 'Read the specified pages and the explicit stop/skip boundaries. Examples are reading
      material, not assigned tasks. Ch 9: p338 begin at Variable Scope Rules. On p340 stop before Comparing
      Bytecodes; skip the whole sidebar through p341. Read the closure prose and examples on pp342-343
      and only the diagram on p344 if helpful: skip Inspecting the returned averager object, __code__,
      __closure__, co_freevars and cells. Resume at The nonlocal Declaration p345; on p347 stop before
      Implementing a Simple Decorator. No disassembly.'
    covers:
    - knowledge-python-functions-scope
    depth: orientation
    scope: complementary
    locator: 'Fluent Python 2e, PDF pp. 262-279, 338-340, 342-343, 345-347. Ch 9: p338 begin at Variable
      Scope Rules. On p340 stop before Comparing Bytecodes; skip the whole sidebar through p341. Read
      the closure prose and examples on pp342-343 and only the diagram on p344 if helpful: skip Inspecting
      the returned averager object, __code__, __closure__, co_freevars and cells. Resume at The nonlocal
      Declaration p345; on p347 stop before Implementing a Simple Decorator. No disassembly.'
