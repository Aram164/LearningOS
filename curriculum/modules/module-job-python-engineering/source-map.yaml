    unit_id: unit-job-python-engineering-fluency
    title: Fluent Python 2e - Everyday data structures and expressions
    format: book
    angle: The main explanation and worked examples for everyday data structures and expressions.
    angle_detail: 'Read the specified pages and the explicit stop/skip boundaries. Examples are reading
      material, not assigned tasks. Ch 2: stop before Pattern Matching with Sequences on p68; on p80 stop
      before Using + and * with Sequences. Ch 3: skip the short implementation discussion under Practical
      Consequences of How dict Works on p132; read only observable set/hash behaviour, not storage mechanics.'
    covers:
    - knowledge-python-everyday-data
    depth: orientation
    scope: complementary
    locator: 'Fluent Python 2e, PDF pp. 55-67, 77-80, 86-88, 108-110, 113-124, 131-140. Ch 2: stop before
      Pattern Matching with Sequences on p68; on p80 stop before Using + and * with Sequences. Ch 3: skip
      the short implementation discussion under Practical Consequences of How dict Works on p132; read
      only observable set/hash behaviour, not storage mechanics.'
    vault_path: material://source-fluent-python/fluent-python.pdf
  - id: route-python-names-mutation-fp-1
    unit_id: unit-job-python-engineering-fluency
    title: Fluent Python 2e - Names, identity and mutation
    format: book
    angle: The main explanation and worked examples for names, identity and mutation.
    angle_detail: 'Read the specified pages and the explicit stop/skip boundaries. Examples are reading
      material, not assigned tasks. Ch 6: stop before del and Garbage Collection on p249. Ch 2 pp80-85
      supplies nested-list aliasing and augmented assignment; no reference-count or recycling material.'
