    vault_path: material://source-fluent-python/fluent-python.pdf
  - id: route-python-type-hints-fp-1
    unit_id: unit-job-python-engineering-fluency
    title: Fluent Python 2e - Type hints
    format: book
    angle: The main explanation and worked examples for type hints.
    angle_detail: Read the specified pages and the explicit stop/skip boundaries. Examples are reading
      material, not assigned tasks. Use the explanations and annotation examples; installing/running a
      type checker is optional. Skip the outdated annotation-runtime forecast on pp567-570; use the official
      modernisation guide instead. On p574 stop before Variance. Use TypeVar/Generic forms compatible
      with Python 3.11, not the 3.12 type-parameter syntax.
    covers:
    - knowledge-python-type-hints
    depth: orientation
    scope: complementary
    locator: Fluent Python 2e, PDF pp. 284-326, 571-574. Use the explanations and annotation examples;
      installing/running a type checker is optional. Skip the outdated annotation-runtime forecast on
      pp567-570; use the official modernisation guide instead. On p574 stop before Variance. Use TypeVar/Generic
      forms compatible with Python 3.11, not the 3.12 type-parameter syntax.
    vault_path: material://source-fluent-python/fluent-python.pdf
  - id: route-python-interfaces-dispatch-fp-1
    unit_id: unit-job-python-engineering-fluency
    title: Fluent Python 2e - Interfaces and dispatch
    format: book
    angle: The main explanation and worked examples for interfaces and dispatch.
    angle_detail: Read the specified pages and the explicit stop/skip boundaries. Examples are reading
      material, not assigned tasks. Stop before virtual subclass registration on p490; no custom subclass
      hooks or metaclasses. Read Protocol as interface documentation first; runtime checks do not prove
      all type contracts.
    covers:
    - knowledge-python-interfaces-dispatch
    depth: orientation
    scope: complementary
    locator: Fluent Python 2e, PDF pp. 462-470, 472-488, 496-506, 354-358. Stop before virtual subclass
      registration on p490; no custom subclass hooks or metaclasses. Read Protocol as interface documentation
      first; runtime checks do not prove all type contracts.
    vault_path: material://source-fluent-python/fluent-python.pdf
