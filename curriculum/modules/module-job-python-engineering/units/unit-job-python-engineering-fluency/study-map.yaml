- id: stage-python-contribution-loop
  number: 5
  title: Phase 4 - the recurring contribution loop
  status: pending
  objective: Run the loop that actually produces intentional contributions, weekly, starting in week one
    rather than at the end. Read real merged changes, write your own review before asking an agent, then
    land small patches under the receiving project's own conventions. This stage recurs and is never marked
    complete after a single pass.
  done_when:
  - 'One merged change in a mature Python repository reviewed in full before any AI: problem restatement,
    call-path map, test assessment, correctness and compatibility risks, and prioritized comments.'
  - That review then compared against an agent's, classifying unique, overlapping, false-positive, and
    missed findings with evidence for each.
  - Stratum's contributing workflow followed for one small change on a local branch, including the commit
    tag convention and an issue reference where one applies.
  - One question or proposal written for a maintainer that cites the paper or the code and states what
    you already checked, rather than asking to be told what to do.
  - The loop has run at least four times before this stage is reconsidered, and the ledger of what was
    proposed, accepted, and rejected is kept.
  estimate_minutes: 120
  exam_critical: false
