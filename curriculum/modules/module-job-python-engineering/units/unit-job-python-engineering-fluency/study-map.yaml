    packaged Python system; use AI only after a working no-AI baseline and treat its output as untrusted
    review input.
  done_when:
  - Before code, a no-AI engineering brief defines user/problem, examples, non-goals, data and API contracts,
    invariants, errors, observability, concurrency choice, test matrix, and acceptance criteria.
  - A no-AI vertical slice and core architecture work from a blank repository before any agent reviews
    implementation.
  - The system passes unit, integration, property-oriented, failure-injection, and installed-artifact
    tests; type checks and quality checks are clean or every exception is justified.
  - The package has consumer documentation, an architecture note, decision records, changelog, reproducible
    environment/build instructions, structured failure evidence, and a reviewable commit history.
  - Performance claims separate construction, I/O, planning, and execution with repeated evidence; concurrency
    is included only if the workload justifies it.
  - After the baseline, an AI review may be used. Every suggestion is accepted or rejected with a reason,
    every accepted change is understood line by line, and at least one convincing but incorrect suggestion
    is caught by your tests or reasoning.
  - A self-review and one external-style review identify correctness, API, compatibility, security/privacy,
    operability, and maintenance risks.
  - Seven days later, the core data model, one critical path, and its tests are rebuilt or explained closed-book
    without AI.
  - Only after completion, a read-only comparison with Stratum and the staged open-source repositories
    records deliberate similarities, differences, and remaining questions.
