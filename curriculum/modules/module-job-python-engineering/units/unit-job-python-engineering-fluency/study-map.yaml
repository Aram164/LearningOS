- id: stage-python-optimizer-theory-and-rewrite-soundness
  number: 3
  title: Phase 2 - logical plans, rewrite soundness, and cost
  status: pending
  objective: 'Learn why a system like Stratum has the shape it has: a declarative abstraction, a logical
    plan, rewrite rules, lowering to physical operators, and cost-based implementation selection. The
    output is a rule table you could defend in a design discussion, not code. Without this, a rewrite
    proposal can only imitate the shape of the rewrites already in the tree.'
  done_when:
  - The Stratum paper read closely enough to state in your own words what it claims, what it actually
    measures, and which of its stated open directions are still open.
  - Six rewrites written up, each with its precondition, the invariant it preserves, and a concrete counterexample
    that breaks it when the precondition is dropped.
  - 'The logical and physical split explained: what a logical operator may assume, what lowering decides,
    and why implementation selection is a separate cost question.'
  - Common subexpression elimination explained as a semantic argument about when two nodes are interchangeable,
    not as a hash-key trick.
  - At least two claims in the write-up marked as uncertain and carried to the paper or a maintainer rather
    than resolved by guessing.
  estimate_minutes: 240
  exam_critical: false
  concepts:
  - concept-python
  scope_triage: required-now
  resources:
  - kind: read
    label: 'stratum: A System Infrastructure for Massive Agent-Centric ML Workloads'
    id: resource-python-p2-01-stratum-paper-architecture
    locator: Sections 3 to 4.3, Our Vision through Runtime Optimizations, pdf pp. 3-5
    url: https://arxiv.org/abs/2603.03589
    angle: The only document that states the system's intent in the authors' own words; everything else
      in the repository is a consequence of it.
    scope_triage: required-now
  - kind: read
    label: stratum paper, the authors' own open problems
    id: resource-python-p2-02-stratum-paper-open-directions
    locator: Section 5 Challenges and Key Directions, pdf pp. 5-6
    url: https://arxiv.org/abs/2603.03589
    angle: A published list of what is unsolved, which is where a contribution can be intentional rather
      than decorative.
    scope_triage: required-now
  - kind: read
    label: 'Spark SQL: Relational Data Processing in Spark'
    id: resource-python-p2-03-catalyst
    locator: Section 4 Catalyst Optimizer, 4.1 Trees through 4.4 Extension Points, pdf pp. 5-8
    url: https://people.csail.mit.edu/matei/papers/2015/sigmod_spark_sql.pdf
    angle: The compact canonical account of trees, rules, logical optimization, and physical planning
      that Stratum's optimizer package assumes you already have.
    scope_triage: required-now
  - kind: read
    label: skrub DataOps reference
    id: resource-python-p2-04-skrub-dataops
    locator: '''DataOps'' and ''The skb accessor exposes all DataOps methods and attributes'''
    url: https://skrub-data.org/stable/reference/data_ops.html
    angle: Separates the abstraction Stratum inherits from skrub, which is not yours to change, from the
      parts Stratum actually owns.
    scope_triage: required-now
  - kind: read
    label: Stratum's own stated intent in the sibling checkout
    id: resource-python-p2-05-stratum-intent-docs
    locator: README.md 'Design Principles'; CONTRIBUTING.md; stratum/optimizer/rewrite_ideas.md
    angle: Maintainer-written intent and an explicit ideas list, which is requirements gathering rather
      than implementation copying.
    scope_triage: helpful-now
  - kind: practise
    label: Write the rewrite rule table
    id: resource-python-p2-06-rule-table
    locator: Six rewrites, each with precondition, preserved invariant, and a counterexample that breaks
      it when the precondition is dropped. Derive each from the semantics, not from an implementation.
    scope_triage: required-now
    angle: The deliverable that converts reading into something you can argue from.
  - kind: practise
    label: Sketch the cost question for one operation family
    id: resource-python-p2-07-cost-model-sketch
    locator: For one family, write what a selector would need to know to choose an implementation, what
      is cheap to measure, what has to be estimated, and what happens when the estimate is wrong.
    scope_triage: required-now
  - kind: read
    label: Read-only comparison after the rule table exists
    id: resource-python-p2-08-stratum-rewrite-anchors
    locator: stratum/optimizer/_algebraic_rewrites.py; stratum/optimizer/_numeric_rewrites.py; stratum/optimizer/_op_cse.py;
      stratum/optimizer/physical/_lowering.py; stratum/optimizer/physical/_impl_selection.py
    angle: Opened only after the table is written, to find where your derivation and the tree disagree
      and which of the two is wrong.
    scope_triage: helpful-now
  attachments: []
  source_feedback: []
  working_note: curriculum/modules/module-job-python-engineering/units/unit-job-python-engineering-fluency/stages/stage-python-optimizer-theory-and-rewrite-soundness/notes.md
- id: stage-python-rewriter-tests-and-benchmark-evidence
  number: 4
  title: Phase 3 - one rewriter, its tests, and honest measurement
  status: pending
  objective: 'Build one small rewriter end to end and make it produce evidence: a DAG utility with real
    invariants, an adversarial suite that is provably sensitive, and a benchmark harness that reports
    spread instead of a single number. The contract is written before the code every time.'
  done_when:
  - A DAG utility with topological ordering, sub-DAG cloning with stop and replacement boundaries, and
    an invariant checker covering reciprocal edges, duplicate inputs, reachability, and cycle refusal,
    with at least 25 named cases.
  - One rewrite pass built on it, its contract written before the code and compared against the implementation
    once the tests pass.
  - 'Mutation testing proves the suite is sensitive: four deliberate incorrect rewires are each caught
    by a named test.'
  - A reusable benchmark harness separates construction, planning, and execution, repeats each measurement,
    and reports spread rather than one number.
  - Exactly one optimization is made and defended with that harness, including the case where the measurement
    says the optimization is not worth it.
  - 'One agent-generated implementation reviewed as an untrusted patch: the defect found without hints,
    and why it looked convincing recorded.'
  estimate_minutes: 360
  exam_critical: false
  concepts:
  - concept-python
  scope_triage: required-now
  resources:
  - kind: read
    label: Python graphlib topological sorter
    id: resource-python-p3-01-graphlib
    locator: TopologicalSorter, static and incremental use, and CycleError
    url: https://docs.python.org/3/library/graphlib.html
    scope_triage: reference-only
  - kind: read
    label: Open-source reading lab, NetworkX DAG algorithms
    id: resource-python-p3-02-networkx-dag
    locator: topological_generations and is_directed_acyclic_graph, then the matching tests
    url: https://github.com/networkx/networkx/blob/main/networkx/algorithms/dag.py
    angle: A mature implementation of the exact operations you just built, useful for comparing ordering
      guarantees and mutation assumptions rather than style.
    scope_triage: required-now
  - kind: read
    label: Open-source reading lab, Hypothesis
    id: resource-python-p3-03-hypothesis
    locator: One small strategy or shrinking behaviour, starting from a test and tracing only the implementation
      it exercises
    url: https://github.com/HypothesisWorks/hypothesis
    scope_triage: helpful-now
  - kind: practise
    label: Build the DAG utility and its invariant checker from blank
    id: resource-python-p3-04-dag-utility
    locator: Derive Kahn's algorithm on paper first and hand-run it on a diamond, a chain, a disconnected
      branch, and a cycle. Then implement, and state what ordering is and is not guaranteed.
    scope_triage: required-now
  - kind: practise
    label: Mutation-test the checker
    id: resource-python-p3-05-mutation-sensitivity
    locator: Introduce four incorrect rewires and record which named test caught each. A mutation that
      nothing catches is a missing test, not a passing suite.
    scope_triage: required-now
    angle: Proves the suite has power, which is the difference between tests that pass and tests that
      would catch a real regression.
  - kind: practise
    label: Build the benchmark harness before making any optimization
    id: resource-python-p3-06-benchmark-harness
    locator: Separate construction, planning, and execution. Repeat every measurement, report spread,
      state what is held fixed, and write down why a single wall-clock number on a laptop is not evidence.
    scope_triage: required-now
    angle: The harness is the deliverable; the optimization is only what it is used on.
  - kind: practise
    label: Review a plausible but wrong implementation
    id: resource-python-p3-07-untrusted-patch
    locator: Only after your own version passes, ask an agent for two subtly flawed implementations. Without
      hints, find each defect through contract review and targeted tests, and record why it looked convincing.
    scope_triage: required-now
  - kind: read
    label: Read-only Stratum anchors for graph surgery and measurement
    id: resource-python-p3-08-stratum-graph-anchors
    locator: stratum/optimizer/_op_utils.py clone_sub_dag, topological_iterator_bfs and dfs, validate_dag,
      rewrite_pass; stratum/optimizer/_optimize.py pass orchestration; stratum/utils/_utils.py start_time
      and log_time; stratum/runtime/_buffer_pool.py
    scope_triage: helpful-now
