    route_id: route-python-type-hints-fp-1
    kind: read
    label: Fluent Python 2e - Type hints
    source_id: source-fluent-python
    locator: Fluent Python 2e, PDF pp. 284-326, 571-574. Use the explanations and
      annotation examples; installing/running a type checker is optional. Skip the
      outdated annotation-runtime forecast on pp567-570; use the official modernisation
      guide instead. On p574 stop before Variance. Use TypeVar/Generic forms compatible
      with Python 3.11, not the 3.12 type-parameter syntax.
    angle: The main explanation and worked examples for type hints.
    angle_detail: Read the specified pages and the explicit stop/skip boundaries.
      Examples are reading material, not assigned tasks. Use the explanations and
      annotation examples; installing/running a type checker is optional. Skip the
      outdated annotation-runtime forecast on pp567-570; use the official modernisation
      guide instead. On p574 stop before Variance. Use TypeVar/Generic forms compatible
