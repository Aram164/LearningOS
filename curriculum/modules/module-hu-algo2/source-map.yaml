  unit_routes:
  - unit_id: unit-algo2-exam-prep
    title: CLRS — mapped Algo 2 chapters
    format: book
    angle: The precise proof-and-algorithm reference behind six HU topics; read only the chapter named
      by the current stage.
    covers:
    - knowledge-algo2-amortized-analysis
    - knowledge-algo2-b-trees
    - knowledge-algo2-fibonacci-heaps
    - knowledge-algo2-shortest-paths
    - knowledge-algo2-maximum-flow
    - knowledge-algo2-computational-geometry
    depth: derivation
    scope: current
    locator: Ch. 17–19, 24–26, and 33 as stage-mapped
    vault_path: material://source-clrs/clrs-de.pdf
- source_id: source-ottmann-widmayer
  role: spine
  why: Course-assigned German text for splay trees, bipartite matching, and FFT.
  priority: 1
  unit_routes:
  - unit_id: unit-algo2-exam-prep
    title: Ottmann/Widmayer — mapped sections
    format: book
    angle: Provides the assigned second account in German; use §5.4 for splay, §9.8 for matching, and
      §1.2 for FFT.
    covers:
    - knowledge-algo2-splay-trees
    - knowledge-algo2-bipartite-matching
    - knowledge-algo2-fft
    depth: derivation
    scope: current
    locator: §1.2, §3.3, §5.4, §9.8
    vault_path: material://source-ottmann-widmayer/ow.pdf
- source_id: source-kleinberg-tardos
  role: spine
  why: Course-assigned source for Gale–Shapley and its optimality results.
  priority: 1
  unit_routes:
  - unit_id: unit-algo2-exam-prep
    title: Kleinberg/Tardos — Stable Matching
    format: book
    angle: A compact proof-oriented telling of Gale–Shapley, stability, and proposer optimality.
    covers:
    - knowledge-algo2-stable-matching
    depth: derivation
    scope: current
    locator: Section 1.1
    vault_path: material://source-kleinberg-tardos/Kleinberg-Tardos_Algorithm-Design.pdf
- source_id: source-pagh-cuckoo-hashing
  role: spine
  why: The course-assigned short primary paper for cuckoo hashing.
  priority: 1
  unit_routes:
  - unit_id: unit-algo2-exam-prep
    title: Pagh — Cuckoo Hashing for Undergraduates
    format: paper
    angle: Separates worst-case lookup, expected insertion, and amortized expected dynamic guarantees
