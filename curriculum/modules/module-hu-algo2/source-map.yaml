type: module-source-map
module_id: module-hu-algo2
sources:
- source_id: source-algo2-hu-materials
  role: course-material
  why: The twelve current HU decks define scope; the bundled assigned papers, stable-matching sheet, and
    authored viva drills stay beside them.
  priority: 0
  unit_routes:
  - unit_id: unit-algo2-exam-prep
    title: HU AlgoDat II — complete local course bundle
    format: course-material
    angle: Primary authority for terminology, theorem statements, and what the oral can ask. Topic stages
      open the exact deck; this route opens the complete bundle.
    covers:
    - knowledge-algo2-phase0
    - knowledge-algo2-fast-multiplication
    - knowledge-algo2-amortized-analysis
    - knowledge-algo2-b-trees
    - knowledge-algo2-fibonacci-heaps
    - knowledge-algo2-splay-trees
    - knowledge-algo2-cuckoo-hashing
    - knowledge-algo2-shortest-paths
    - knowledge-algo2-maximum-flow
    - knowledge-algo2-bipartite-matching
    - knowledge-algo2-stable-matching
    - knowledge-algo2-computational-geometry
    - knowledge-algo2-fft
    - knowledge-algo2-oral-delivery
    depth: course-aligned
    scope: current
    locator: Twelve decks, assigned papers, one exercise sheet, and viva drills
    vault_path: material://source-algo2-hu-materials
- source_id: source-dms-grundwerkzeuge
  role: spine
  why: Course-assigned German text for Karatsuba and hashing.
  priority: 1
  unit_routes:
  - unit_id: unit-algo2-exam-prep
    title: DMS — Chapters 1 and 4
    format: book
    angle: Matches the course's German vocabulary and gives the assigned derivation for Karatsuba plus
      the hashing foundation.
    covers:
    - knowledge-algo2-fast-multiplication
    - knowledge-algo2-cuckoo-hashing
    depth: derivation
    scope: current
    locator: Kapitel 1 and 4
    vault_path: material://source-dms-grundwerkzeuge/dms.pdf
- source_id: source-clrs
