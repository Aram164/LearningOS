knowledge_map:
  summary: Twelve topics in one methodological arc. The course opens and closes on the same question -
    how fast can we multiply - reaching O(n^log2(3)) via Karatsuba in lecture 1 and O(n log n) via the
    FFT in lecture 12. Between them sit two families. The data-structure family is gated by amortized
    analysis, which is itself a topic and which Fibonacci heaps and splay trees both presuppose; B-trees
    and cuckoo hashing stand apart, one optimizing disk accesses and the other giving the course's only
    worst-case constant lookup. The graph family runs shortest paths, then maximum flow, which bipartite
    matching reduces to; stable matching is a different problem despite the adjacency, and computational
    geometry is self-contained apart from its determinant primitive. Three distinct kinds of guarantee
    appear and are routinely confused - deterministic worst case, amortized over a sequence, and expected
    over random hash functions - and cuckoo hashing's dynamic variant needs two of the three words at
    once. Phase 0 nodes are prerequisites the decks assume and never re-teach.
  nodes:
  - id: knowledge-algo2-phase0
    title: Phase 0 - assumed prerequisites
    summary: Asymptotics and elementary operations, recurrences and the master theorem, ADT Dictionary
      and BSTs, ADT Priority Queue and heaps, hashing with chaining plus expected-value probability, graphs
      and Dijkstra, complex roots of unity, determinants and orientation, and proof presentation out loud.
      Every item is named by a deck's own Erinnerung or Wiederholung slide, not inferred. Run as diagnostics
      first - most should pass and be skipped.
  - id: knowledge-algo2-fast-multiplication
    title: T01 - Schnellere Multiplikation
    summary: Number representation and addition cost, the school method and its tight 3n^2 bound, the
      recursive split, Karatsuba's three-multiplication identity, both recurrences, and the master theorem
      giving O(n^log2(3)). The decisive point is 3 versus 4 as the branching factor. Toom-k as Ausblick.
    builds_on:
    - knowledge-algo2-phase0
  - id: knowledge-algo2-amortized-analysis
    title: T02 - Amortisierte Analyse
    summary: Aggregate analysis, the accounting method and the potential method, each carried through
      the same two examples - the multipop stack and the k-bit binary counter. The potential theorem and
      the distinction between its sufficient conditions and the actual requirement. Deterministic, not
      average-case. Load-bearing for two later topics.
    builds_on:
    - knowledge-algo2-phase0
  - id: knowledge-algo2-b-trees
    title: T03 - B-Bäume
    summary: Motivated entirely by secondary-storage access costs. Minimal degree t, the height bound
      log_t((n+1)/2), search by disk accesses, splitting with the median moving up, single-pass insertion
      that splits on the way down, growth at the root, and the deletion cases under the at-least-t-keys
      invariant. B+ and B*.
    builds_on:
    - knowledge-algo2-phase0
  - id: knowledge-algo2-fibonacci-heaps
    title: T04 - Fibonacci-Heaps
    summary: Lazy structure of unordered min-heap-ordered trees with a root list and marking. Potential
      t(H) + 2m(H); insert, min, union and decreasekey amortized O(1), extractmin and delete O(log n),
      worst case O(n). Consolidation by degree, cut and cascading cut, and the degree bound via size(x)
      >= F_{k+2} >= phi^k.
    builds_on:
    - knowledge-algo2-amortized-analysis
  - id: knowledge-algo2-splay-trees
    title: T05 - Splay-Bäume
    summary: Self-adjusting BSTs with no balance information. The splay operation with zig, zig-zig and
      zig-zag, where rotating the grandparent first is what distinguishes it from move-to-root. Rank potential,
      the 3(r(t) - r(p)) + 1 lemma, and O(log n) amortized. Dynamic optimality remains open.
    builds_on:
    - knowledge-algo2-amortized-analysis
  - id: knowledge-algo2-cuckoo-hashing
    title: T06 - Cuckoo Hashing
    summary: Two hash functions and two permitted positions, giving search and delete in worst-case O(1)
      - the course's only such guarantee. Insert by eviction, analysed through the cuckoo graph and a
      path lemma; rehashing costs O(n) but occurs with probability O(1/r). The dynamic variant is amortized
      expected O(1).
    builds_on:
    - knowledge-algo2-phase0
  - id: knowledge-algo2-shortest-paths
    title: T07 - Kürzeste Wege
    summary: What breaks with negative weights. Relaxation and optimal substructure, Bellman-Ford in Theta(nm)
      with n-1 passes plus negative-cycle detection by telescoping, and Johnson's all-pairs method via
      per-vertex reweighting that leaves cycle lengths unchanged. Dijkstra and BFS are assumed from AlgoDat
      I.
    builds_on:
    - knowledge-algo2-phase0
  - id: knowledge-algo2-maximum-flow
    title: T08 - Maximaler Fluss
    summary: Flow networks, why naive greedy fails, and the residual network whose backward edges restore
      the ability to undo. Ford-Fulkerson at O(F*m), which is not polynomial; Edmonds-Karp at O(|V|*|A|^2)
      by always taking a shortest residual path. Cuts, the three equivalences, max-flow min-cut and how
      to extract the cut. Variant reductions and Menger.
    builds_on:
    - knowledge-algo2-shortest-paths
  - id: knowledge-algo2-bipartite-matching
    title: T09 - Bipartites Matching
    summary: Maximal versus maximum, alternating and augmenting paths, and Berge's theorem with its vertex-disjoint
      count. Hopcroft-Karp works in phases over maximal SAP-packings; O(sqrt(n)) phases at O(m) each gives
      O(m*sqrt(n)). Also solvable by reduction to maximum flow. General graphs need blossoms.
    builds_on:
    - knowledge-algo2-maximum-flow
  - id: knowledge-algo2-stable-matching
    title: T10 - Stable Matching
    summary: A different problem from T09 - always perfect, optimizing stability against preferences rather
      than cardinality. Instability requires a mutual incentive to deviate. Gale-Shapley terminates in
      at most n^2 iterations and is always stable; every execution yields the same matching, optimal for
      every proposer and pessimal for every receiver.
    builds_on:
    - knowledge-algo2-phase0
  - id: knowledge-algo2-computational-geometry
    title: T11 - Algorithmische Geometrie
    summary: Orientation by the sign of a determinant, chosen to avoid division and trigonometry, and
      segment intersection from it. The sweep-line method, where only newly adjacent pairs need testing.
      Convex hull with the Omega(n log n) bound by reduction from sorting, Jarvis at O(n*h) and Graham
      at O(n log n). Closest pair, where pre-sorting once turns O(n log^2 n) into O(n log n).
    builds_on:
    - knowledge-algo2-phase0
  - id: knowledge-algo2-fft
    title: T12 - Schnelle Fourier-Transformation
    summary: Polynomial representations and their differing operation costs, the recursive split p(x)
      = g(x^2) + x*u(x^2), and why complex roots of unity are needed for the halving to repeat. The FFT
      in O(n log n), the inverse via the Vandermonde matrix and the summation lemma, and fast multiplication
      of polynomials and integers - closing the question lecture 1 opened.
    builds_on:
    - knowledge-algo2-fast-multiplication
  - id: knowledge-algo2-oral-delivery
    title: Oral delivery and exam transfer
    summary: Converting knowledge into a 30-minute viva - five-minute summaries per topic, follow-up question
      trees, board work narrated while drawing, and the cross-topic threads an examiner samples. The one
      genuinely different skill, and the one with no written substitute.
    builds_on:
    - knowledge-algo2-fft
    - knowledge-algo2-bipartite-matching
    - knowledge-algo2-stable-matching
    - knowledge-algo2-computational-geometry
    - knowledge-algo2-b-trees
    - knowledge-algo2-fibonacci-heaps
    - knowledge-algo2-splay-trees
    - knowledge-algo2-cuckoo-hashing
