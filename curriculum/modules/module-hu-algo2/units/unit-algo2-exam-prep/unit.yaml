scope: 'Algorithmen und Datenstrukturen II (Kratsch, HU Berlin, SoSe 2026), examined as a 30-minute oral
  by Zoom. Scope is the twelve current-run lecture decks (608 slides, 2026-03-30 to 2026-06-30), verified
  2026-08-16 against the official lecture schedule: every scheduled topic has its deck and every deck''s
  page count reconciles with the schedule''s slide ranges. Each deck names its own Literatur on slide
  2 and every named book is held locally, so external reading is prescribed rather than chosen. Two known
  gaps, both recorded as absent rather than reconstructed - the Organisation deck (1st lecture, 8 April)
  is NOT held, and there are NO HU Übungsblätter for any topic except stable matching. Übungen are ungraded
  (module record), but this leaves the oral with no examiner-calibrated practice, which is why the per-topic
  viva drills carry the diagnostic load.'
