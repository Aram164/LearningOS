  - id: route-bs-privileges
    unit_id: unit-bs-os-structure
    title: Privileggrenzen mit Schutzbedarf begründen - ältere BS-Folien
    format: course-material
    angle: Das Zustandsdiagramm macht die Schutzgrenze sichtbar; Ring 0/3 ist ein zusätzliches historisches
      x86-Beispiel und IRQL eine andere Achse.
    angle_detail: Das Zustandsdiagramm macht die Schutzgrenze sichtbar; Ring 0/3 ist ein zusätzliches
