  - id: route-bs-syscall-boundary
    unit_id: unit-bs-os-structure
    title: Einen Systemaufruf über die Vertrauensgrenze verfolgen - ältere BS-Folien
    format: course-material
    angle: Der read-Stub und der Kerneintritt zeigen Aufrufnummer, Argumentregister, getrennte Stacks
      und Ergebnisübergabe im historischen INT-Modell.
    angle_detail: Der read-Stub und der Kerneintritt zeigen Aufrufnummer, Argumentregister, getrennte
      Stacks und Ergebnisübergabe im historischen INT-Modell. Älterer Foliensatz (Mai 2006); von Aram
      als Arbeitsgrundlage gewählt. Aktuelle Lehr- und Prüfungsabdeckung ist nicht abgeglichen.
