  - id: route-bs-linux-example
    unit_id: unit-bs-os-structure
    title: Das historische Linux-Beispiel rekonstruieren - ältere BS-Folien
    format: course-material
    angle: Der durchgehende alte IA-32/Linux-Code verbindet int 0x80, sys_alarm, Fehlerumsetzung und die
      Grenzen registerbasierter Parameterübergabe. Keine Anleitung für heutige Kernel.
    angle_detail: Der durchgehende alte IA-32/Linux-Code verbindet int 0x80, sys_alarm, Fehlerumsetzung
      und die Grenzen registerbasierter Parameterübergabe. Keine Anleitung für heutige Kernel. Älterer
      Foliensatz (Mai 2006); von Aram als Arbeitsgrundlage gewählt. Aktuelle Lehr- und Prüfungsabdeckung
      ist nicht abgeglichen.
    covers:
