  unit_routes:
  - id: route-bs-os-hardware
    unit_id: unit-bs-os-structure
    title: Betriebssystem und Hardware zusammendenken - ältere BS-Folien
    format: course-material
    angle: Gerätecontroller, CPU und Speicher als kooperierende Komponenten erklären; Bus/Switch und überlappende
      CPU-/I/O-Arbeit im Modell der Folien unterscheiden.
    angle_detail: Gerätecontroller, CPU und Speicher als kooperierende Komponenten erklären; Bus/Switch
      und überlappende CPU-/I/O-Arbeit im Modell der Folien unterscheiden. Älterer Foliensatz (Mai 2006);
