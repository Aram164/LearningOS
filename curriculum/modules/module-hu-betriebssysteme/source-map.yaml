  - id: route-bs-memory
    unit_id: unit-bs-os-structure
    title: Speicher schützen und Adressen übersetzen - ältere BS-Folien
    format: course-material
    angle: Die drei aufeinanderfolgenden Bilder zeigen Bereichsprüfung, zusätzliche Adressindirektion
      und die Abbildung von Seitennummer p auf Rahmen f bei unverändertem Offset d.
    angle_detail: Die drei aufeinanderfolgenden Bilder zeigen Bereichsprüfung, zusätzliche Adressindirektion
