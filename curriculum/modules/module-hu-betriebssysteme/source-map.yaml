  - id: route-bs-interrupts
    unit_id: unit-bs-os-structure
    title: Interrupt, Trap und Rückkehr auseinanderhalten - ältere BS-Folien
    format: course-material
    angle: Die Ablaufgrafik trennt Interrupt-Dispatcher und Gerätehandler; das IRQL-Beispiel liefert eine
