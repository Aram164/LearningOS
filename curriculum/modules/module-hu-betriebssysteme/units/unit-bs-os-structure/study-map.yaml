- id: stage-bs-linux-example
  number: 6
  title: Das historische Linux-Beispiel rekonstruieren
  status: pending
  objective: Wrapper, Aufrufnummer, Dispatchtabelle und Serviceroutine am alten alarm-Beispiel zusammensetzen;
    Parameterübergabe und Nutzerpuffer erklären.
  done_when:
  - Rekonstruiere alarm() über Wrapper, system_call und Tabelle bis sys_alarm; finde die Fehlerumsetzung
    auf -1 und errno.
  - Vergleiche Register-, Tabellen- und Stackparameter; begründe am Puffer von write(fd, buf, count),
    weshalb ein übergebener Zeiger die Daten nicht vertrauenswürdig macht; bearbeite A7.
