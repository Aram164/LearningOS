- id: stage-bs-os-structures
  number: 7
  title: Betriebssystemstrukturen vergleichen und anwenden
  status: pending
  objective: Monolithische, geschichtete und Mikrokernel-Strukturen anhand von Aufrufgrenzen, Isolation
    und Kosten vergleichen; die NT-Einordnung der Folien begründen.
  done_when:
  - Vergleiche die Platzierung eines Dateisystemdienstes in den drei Strukturen; begründe Fehlerausbreitung
    und Kosten ohne pauschale Siegerbehauptung.
  - Erkläre anhand S.42-44, weshalb NT laut Folien kein akademisch reiner Mikrokernel ist; bearbeite A8
    und anschließend den separaten Selbsttest.
  - Nutze S.46 zur freien Begriffswiederholung; markiere DMA und synchrone/asynchrone I/O als im Deck
    nur genannte Begriffe mit offenem Erklärbedarf.
  exam_critical: false
