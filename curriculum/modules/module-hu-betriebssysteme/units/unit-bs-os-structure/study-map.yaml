- id: stage-bs-syscall-boundary
  number: 5
  title: Einen Systemaufruf über die Vertrauensgrenze verfolgen
  status: pending
  objective: Bibliotheksaufruf, Systemaufruf und Geräteinterrupt unterscheiden; den kontrollierten Kerneintritt
    samt Prüfung und Rückkehr verfolgen.
  done_when:
  - Verfolge read(fd, buf, size) vom Nutzerprogramm über Stub und Kerneintritt bis zur Rückkehr; benenne
    jede Übergabe.
  - Erkläre, weshalb Aufrufnummer und Parameter trotz kontrolliertem Eintritt geprüft werden müssen und
    ein Bibliotheksaufruf allein keinen Moduswechsel garantiert; bearbeite A6.
