id: unit-bs-os-structure
type: unit
module_id: module-hu-betriebssysteme
kind: lecture
title: BS 02 - Operating System Basics (ältere Folien)
order: 1
scope: Der ausdrücklich von Aram gewählte ältere Foliensatz 02_structure.pdf, PDF-S.1-46 (Mai 2006). Inhaltliche
  Arbeit S.2-44, S.45 Schlusskarikatur, S.46 Vokabelkontrolle. Keine Behauptung über den aktuellen Lehr-
  oder Prüfungsumfang; spätere Foliensätze bleiben zurückgestellt.
status: ready
knowledge_map:
  summary: Von Betriebssystemaufgaben und Hardware über Interrupts, Speicherschutz und Privilegien zum
    Systemaufruf und zu Entwurfsgrenzen des Kernels.
  nodes:
  - id: knowledge-bs-os-hardware
    title: Betriebssystem und Hardware zusammendenken
    summary: Abstraktion, Ressourcenverwaltung und Schutz mit CPU, Speicher und Gerätecontrollern verbinden.
  - id: knowledge-bs-interrupts
    title: Interrupt, Trap und Rückkehr auseinanderhalten
    summary: Asynchrones Geräteereignis und synchrone Trap unterscheiden; Zustandssicherung, Dispatch,
      Handler und Rückkehr nachzeichnen.
    builds_on:
    - knowledge-bs-os-hardware
  - id: knowledge-bs-memory
    title: Speicher schützen und Adressen übersetzen
    summary: Base-/Limit-Schutz vom Übersetzen virtueller Adressen mit MMU und Seitentabelle unterscheiden.
    builds_on:
    - knowledge-bs-os-hardware
  - id: knowledge-bs-privileges
    title: Privileggrenzen mit Schutzbedarf begründen
    summary: User-/Kernel-Modus und kontrollierte Hardwareübergänge erklären; privilegierte Operationen
      von normalen Instruktionen abgrenzen.
    builds_on:
    - knowledge-bs-memory
    - knowledge-bs-interrupts
  - id: knowledge-bs-syscall-boundary
    title: Einen Systemaufruf über die Vertrauensgrenze verfolgen
    summary: Bibliotheksaufruf, Systemaufruf und Geräteinterrupt unterscheiden; den kontrollierten Kerneintritt
      samt Prüfung und Rückkehr verfolgen.
    builds_on:
    - knowledge-bs-privileges
    - knowledge-bs-interrupts
  - id: knowledge-bs-linux-example
    title: Das historische Linux-Beispiel rekonstruieren
    summary: Wrapper, Aufrufnummer, Dispatchtabelle und Serviceroutine am alten alarm-Beispiel zusammensetzen;
      Parameterübergabe und Nutzerpuffer erklären.
    builds_on:
    - knowledge-bs-syscall-boundary
  - id: knowledge-bs-os-structures
    title: Betriebssystemstrukturen vergleichen und anwenden
    summary: Monolithische, geschichtete und Mikrokernel-Strukturen anhand von Aufrufgrenzen, Isolation
      und Kosten vergleichen; die NT-Einordnung der Folien begründen.
    builds_on:
    - knowledge-bs-syscall-boundary
    - knowledge-bs-privileges
