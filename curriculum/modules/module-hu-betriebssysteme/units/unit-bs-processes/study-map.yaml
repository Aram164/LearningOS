- id: stage-bs-process-state
  number: 3
  title: Prozesszustände und Scheduler-Ebenen einordnen
  status: pending
  objective: Zustandsübergänge präemptiv gegen kooperativ unterscheiden; Job-, Ready- und I/O-Warteschlangen
    sowie Long-, Medium- und Short-term-Scheduler auseinanderhalten.
  done_when:
  - Klassifiziere Timer-Interrupt, yield(), block() und exit() im präemptiven und im kooperativen Modell.
  - Verfolge einen Prozess durch Ready-, Running- und I/O-Wartezustände und benenne, welcher Scheduler-Typ
    jeweils entscheidet.
