- id: stage-bs-windows-processes
  number: 6
  title: Windows-Prozesse und Threads vergleichen
  status: pending
  objective: Prozess als Ressourcencontainer gegen Thread als Ausführungseinheit stellen; Subsysteme,
    Per-Thread-Daten, Jobs und AppDomains von den Unix-Begriffen abgrenzen.
  done_when:
  - Stelle in einer Tabelle gegenüber, was in Windows Prozess und Thread jeweils besitzen (Adressraum,
    Stacks, TLS, Scheduling-Zustand).
  - Nutze S.88 zur freien Begriffswiederholung und markiere COW und Zombie, falls sie ohne die Unix-Stufen
    nicht sicher sitzen.
