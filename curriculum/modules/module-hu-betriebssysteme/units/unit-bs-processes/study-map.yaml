- id: stage-bs-ipc
  number: 5
  title: IPC mit Signalen und Pipes anwenden
  status: pending
  objective: Signalbehandlung mit Default, Ignorieren und eigenem Handler wählen; Pipes inklusive Puffer-Blockade
    und Named Pipes als Koordinationsmittel erklären.
  done_when:
  - Entscheide für SIGINT, SIGKILL und SIGUSR1, welche Empfangsoptionen möglich sind, und skizziere einen
    eigenen Handler.
  - Erkläre am cat/wc-Beispiel, warum ein voller Pipe-Puffer den Produzenten blockiert und wann Named
    Pipes nötig sind.
