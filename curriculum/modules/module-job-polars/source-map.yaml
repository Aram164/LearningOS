- source_id: source-modern-polars
  role: first-exposure
  why: Free side-by-side book of idiomatic pandas and Polars, maintained against Polars 1.41 and pandas
    3.0; the closest material to this module's goal.
  priority: 0
  unit_routes:
  - id: route-modern-polars-s01
    unit_id: unit-job-polars-pandas-fluency
    title: Modern Polars - Indexing (Or Lack Thereof)
    format: website
    angle: The same real analysis written in idiomatic pandas and Polars, focused on what the index does
      and what replaces it.
    angle_detail: Uses a real flights dataset, not toy frames, and pairs every step. The author openly
      prefers Polars, so read its verdicts as opinion and its code as evidence. Targets Polars 1.41.2,
      so it predates 2.0.
    covers:
    - knowledge-polars-divergence-axes
    depth: implementation
    scope: current
    locator: Chapter 1, 'Indexing (Or Lack Thereof)'
    url: https://kevinheavey.github.io/modern-polars/indexing.html
  - id: route-modern-polars-s02
    unit_id: unit-job-polars-expressions
    title: Modern Polars - Method Chaining
    format: website
    angle: Shows the style that makes both libraries readable, and what pandas needs lambdas for where
      Polars uses expressions.
    angle_detail: Good on style and on why assign and with_columns feel alike but are not. It teaches
      no expression semantics, which the book and user guide cover.
    covers:
    - knowledge-polars-expr-contexts
    depth: implementation
    scope: current
    locator: Chapter 2, 'Method Chaining'
    url: https://kevinheavey.github.io/modern-polars/method_chaining.html
  - id: route-modern-polars-s05
    unit_id: unit-job-polars-order-text-time
    title: Modern Polars - Timeseries
    format: website
    angle: Date handling, resampling and rolling windows side by side on real data.
    angle_detail: Stronger than the book on the pandas comparison, weaker on the string namespace, which
      it barely touches.
    covers:
    - knowledge-polars-text-temporal
    depth: implementation
    scope: current
    locator: Chapter 5, 'Timeseries'
    url: https://kevinheavey.github.io/modern-polars/timeseries.html
  - id: route-modern-polars-s07
    unit_id: unit-job-polars-joins-reshape
    title: Modern Polars - Reshaping and Tidy Data
    format: website
    angle: Melt, pivot and joins side by side, on the same data in both libraries.
    angle_detail: Shows both libraries' reshaping idioms on one worked problem, which the book's Polars-only
      chapter cannot.
    covers:
    - knowledge-polars-reshape
    depth: implementation
    scope: current
    locator: Chapter 4, 'Reshaping and Tidy Data'
    url: https://kevinheavey.github.io/modern-polars/tidy.html
  - id: route-modern-polars-s08
