    unit_id: unit-job-polars-pandas-fluency
    title: Polars user guide - Getting started
    format: documentation
    angle: The shortest official path from nothing to a working pipeline.
    angle_detail: Always matches the current release, which the book cannot. Reading it first means your
      first Polars is 2.0 Polars. It stops short of any comparison with pandas.
    covers:
    - knowledge-polars-divergence-axes
    depth: orientation
    scope: current
    locator: User guide, section 'Getting started', whole page
    url: https://docs.pola.rs/user-guide/getting-started/
  - id: route-polars-docs-upgrade2
    unit_id: unit-job-polars-pandas-fluency
    title: Polars 2.0 release post and upgrade guide
    format: documentation
    angle: What changed in the version you are actually running, and so which older material to distrust.
    angle_detail: Read the release post once now. Use the upgrade guide later as the way to judge any
      tutorial written before October 2026. Do not study its tables.
    covers:
    - knowledge-polars-version-contract
    - knowledge-polars-divergence-axes
    depth: orientation
    scope: current
    locator: '''Release of Polars 2.0'' post; upgrade guide §''Behavior changes'''
    url: https://pola.rs/posts/release-polars-2
