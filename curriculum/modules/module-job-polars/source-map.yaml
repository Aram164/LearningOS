  unit_routes:
  - id: route-modern-polars-s01
    unit_id: unit-job-polars-pandas-fluency
    title: Modern Polars - Indexing (Or Lack Thereof)
    format: website
    angle: The same real analysis written in idiomatic pandas and Polars, focused on what the index does
      and what replaces it.
    angle_detail: Uses a real flights dataset, not toy frames, and pairs every step. The author openly
      prefers Polars, so read its verdicts as opinion and its code as evidence. Targets Polars 1.41.2,
      so it predates 2.0.
    covers:
    - knowledge-polars-divergence-axes
    depth: implementation
    scope: current
    locator: Chapter 1, 'Indexing (Or Lack Thereof)'
    url: https://kevinheavey.github.io/modern-polars/indexing.html
  - id: route-modern-polars-s02
    unit_id: unit-job-polars-expressions
    title: Modern Polars - Method Chaining
    format: website
    angle: Shows the style that makes both libraries readable, and what pandas needs lambdas for where
      Polars uses expressions.
    angle_detail: Good on style and on why assign and with_columns feel alike but are not. It teaches
      no expression semantics, which the book and user guide cover.
    covers:
    - knowledge-polars-expr-contexts
    depth: implementation
    scope: current
    locator: Chapter 2, 'Method Chaining'
    url: https://kevinheavey.github.io/modern-polars/method_chaining.html
  - id: route-modern-polars-s05
    unit_id: unit-job-polars-order-text-time
    title: Modern Polars - Timeseries
    format: website
    angle: Date handling, resampling and rolling windows side by side on real data.
    angle_detail: Stronger than the book on the pandas comparison, weaker on the string namespace, which
      it barely touches.
    covers:
    - knowledge-polars-text-temporal
    depth: implementation
    scope: current
    locator: Chapter 5, 'Timeseries'
    url: https://kevinheavey.github.io/modern-polars/timeseries.html
  - id: route-modern-polars-s07
    unit_id: unit-job-polars-joins-reshape
    title: Modern Polars - Reshaping and Tidy Data
    format: website
    angle: Melt, pivot and joins side by side, on the same data in both libraries.
    angle_detail: Shows both libraries' reshaping idioms on one worked problem, which the book's Polars-only
      chapter cannot.
    covers:
    - knowledge-polars-reshape
    depth: implementation
    scope: current
    locator: Chapter 4, 'Reshaping and Tidy Data'
    url: https://kevinheavey.github.io/modern-polars/tidy.html
  - id: route-modern-polars-s08
    unit_id: unit-job-polars-lazy-udf-interop
    title: Modern Polars - Performance and Scaling
    format: website
    angle: A practical view of lazy queries and scanning, compared with what pandas does for the same
      job.
    angle_detail: Its timings are from one machine and an older release; use it for the method, not the
      numbers.
    covers:
    - knowledge-polars-lazy-plans
    depth: implementation
    scope: complementary
    locator: Chapter 3, 'Performance'; Chapter 6, 'Scaling'
    url: https://kevinheavey.github.io/modern-polars/performance.html
- source_id: source-narwhals-concepts
  role: reference
  why: Short, precise pages written by people whose job is making pandas and Polars code agree.
  priority: 1
  unit_routes:
  - id: route-narwhals-s01
    unit_id: unit-job-polars-pandas-fluency
    title: Narwhals - What about the pandas Index?
    format: documentation
    angle: A compact account of how to write code that behaves the same with and without an index.
    angle_detail: Narwhals is itself a compatibility layer, so this is the same problem Stratum faces,
      stated in one page. You do not need to use Narwhals.
    covers:
    - knowledge-polars-divergence-axes
    depth: orientation
    scope: complementary
    locator: Concepts, 'What about the pandas Index?'
    url: https://narwhals-dev.github.io/narwhals/concepts/pandas_index/
  - id: route-narwhals-s03
    unit_id: unit-job-polars-schema-missing-types
    title: Narwhals - Null/NaN handling
    format: documentation
    angle: The clearest short table of null and NaN across pandas and Polars.
    angle_detail: Covers the behaviour, not why. Read after the Polars missing-data page.
    covers:
    - knowledge-polars-missing-model
    depth: orientation
    scope: complementary
    locator: Concepts, 'Null/NaN handling'
    url: https://narwhals-dev.github.io/narwhals/concepts/null_handling/
  - id: route-narwhals-s05
    unit_id: unit-job-polars-order-text-time
    title: Narwhals - Order-dependence
    format: documentation
    angle: Names exactly which operations depend on row order, which is what a lazy engine cannot assume.
    angle_detail: Short and general. It frames the rule that the Polars 2.0 streaming default now makes
      practical.
    covers:
    - knowledge-polars-ordering
    depth: orientation
    scope: complementary
    locator: Concepts, 'Order-dependence'
    url: https://narwhals-dev.github.io/narwhals/concepts/order_dependence/
- source_id: source-pandas-docs
  role: spine
  why: The authority for pandas behaviour. Replaces the 2016 handbook and the 2017 cheat sheet, which
    predate pandas 3.0.
  priority: 0
  unit_routes:
  - id: route-pandas-docs-s01
    unit_id: unit-job-polars-pandas-fluency
    title: pandas 3.0 release notes and migration guide
    format: documentation
    angle: 'The pandas you are modelling is new too: str dtype, Copy-on-Write, inferred datetime units.'
