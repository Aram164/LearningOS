- source_id: source-polars-benchmark
  role: practice
  why: 22 real analytical queries written by the Polars team in both pandas and Polars. Stratum's own
    PDS tests are ported from these files.
  priority: 0
  unit_routes:
  - id: route-polars-benchmark-s06
    unit_id: unit-job-polars-aggregation-windows
    title: PDS queries Q1 and Q6
    format: code
    angle: A real aggregation query in both libraries, on one screen.
    angle_detail: Q1 is computed columns plus grouped aggregates; Q6 is a filtered total. Read the pandas
      file, write the Polars yourself, then compare. The repo pins pandas 2.3.3 and Polars 1.41.2, so
      its pandas side predates 3.0.
    covers:
    - knowledge-polars-aggregation
    depth: practice
    scope: complementary
    locator: queries/pandas/q1.py and queries/polars/q1.py; q6.py
    url: https://github.com/pola-rs/polars-benchmark/tree/main/queries
  - id: route-polars-benchmark-s07
    unit_id: unit-job-polars-joins-reshape
    title: PDS queries Q3, Q5, Q13 and Q4
    format: code
    angle: Multi-table joins, a left join with counts, and a semi join, in both libraries.
    angle_detail: Q3 and Q5 are chains of inner joins, Q13 is a left join, Q4 is a semi join that pandas
      has to spell out. Same reading method as the aggregation queries.
    covers:
    - knowledge-polars-join-semantics
    depth: practice
    scope: complementary
    locator: queries/pandas/q3.py, q5.py, q13.py, q4.py and the same names under queries/polars/
    url: https://github.com/pola-rs/polars-benchmark/tree/main/queries
  - id: route-polars-benchmark-s11
    unit_id: unit-job-polars-capstone-transition
    title: PDS query ladder Q10, Q12, Q16, Q18, Q21, Q22
    format: code
    angle: Harder queries for writing Polars cold from a pandas original.
    angle_detail: Q12 conditional aggregates, Q16 anti join with string filters, Q18 semi join after a
      threshold, Q21 and Q22 long pipelines. Stratum's tests under tests/application/pds hold small fixtures
      for these; read them, do not edit them.
    covers:
    - knowledge-polars-capstone
    depth: practice
    scope: current
    locator: queries/pandas/q10.py, q12.py, q16.py, q18.py, q21.py, q22.py and the same names under queries/polars/
    url: https://github.com/pola-rs/polars-benchmark/tree/main/queries
