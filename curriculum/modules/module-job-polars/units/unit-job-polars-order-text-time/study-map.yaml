  objective: Establish which row orders are guaranteed, which are incidental, and which are undefined
    in each library, so that a parity test never passes or fails for reasons of order alone.
  done_when:
  - A sort contract covering ties, nulls, multi-key sorts and descending mixes, stating the pandas default
    and the Polars default side by side.
  - A classification of at least ten operations as order-guaranteed, order-incidental, or order-undefined
    in each library, with the evidence that settled each one.
  - Every divergence found is classified against the eight axes and has a failing case committed to the
    parity harness.
  exam_critical: false
  concepts:
  - concept-python
  - concept-dataframe-semantics
  scope_triage: required-now
