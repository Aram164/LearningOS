  status: pending
  objective: 'Treat a Polars expression as a value you can compose: predict the columns, height and schema
    it produces before running it, and see why pandas assign, which runs in sequence, does not map onto
    one with_columns.'
  done_when:
  - The four sibling-visibility cases run, and you can say what with_columns evaluates against and what
    assign evaluates against.
  - Output width and height predicted for the eight context cases, including why sum() broadcasts where
    head(2) is refused.
  - The 28 Polars-first expressions written from intent, and their check passes.
  - Eight assign pipelines translated, each compared on values and dtype.
