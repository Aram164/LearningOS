    kind: read
    label: 'Python Polars: The Definitive Guide'
    locator: Ch 10 §Introducing Selectors pp. 283-284, §Selecting Based on Data Type pp. 287-289, §Combining
      Selectors pp. 291-293
    angle: The book's three-page treatment of selector composition, which is the only part of Ch 10 this
      stage needs.
    angle_detail: 'pp. 291-293 on combining selectors is the passage that matters: it shows the set operations
      without mentioning that the same operators mean arithmetic against a scalar. Read it, then run the
      sheet''s Task 1 trap — the gap between the two is the finding.'
