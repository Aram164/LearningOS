      on.
    angle_detail: 'pp. 186-193 is the passage worth reading twice: an expression is a description of a
      computation, so it has properties before it has results. Ch 8''s four operation categories (element-wise,
      summarize-to-one, summarize-to-one-or-more, extend) are exactly the categories that decide whether
