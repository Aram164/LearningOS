    kind: practise
    label: Answer-key self-check - 22 assertions including the stale-name-list proof
    locator: attachments/s2b-check-p2.py - run after Tasks 1-3
    angle: Encodes the drift property as a test, so the materialized shortcut fails visibly rather than
      plausibly.
    angle_detail: The last assertion builds the tempting version — a Python list comprehension over `df.schema`
      — and shows it selecting nothing on the drifted schema. Keep it in your own test file when you write
      the real translation; it is the regression that catches the shortcut being reintroduced.
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-expressions/stages/stage-polars-expr-selectors-expansion/attachments/s2b-check-p2.py
  - id: resource-polars-selector-schema-drift
    kind: practise
    label: Selector schema-drift lab
    locator: Sheet Tasks 2 and 4 - one expression against narrow, wide, drifted and no-numeric schemas
    angle: 'The property test for the whole stage: an expression that stops working when the schema moves
      has failed.'
    angle_detail: The drifted schema retypes `a` from Int64 to Float64 and adds a numeric column, so a
      dtype selector legitimately picks a different set — intended behaviour and a risk at once. Record
      which of your selections want to follow the schema and which want a fixed set, because the two need
      different code and the failure mode of confusing them is silent.
    scope_triage: required-now
