  - id: resource-note-columnselectorop
    kind: read
    label: Stratum ColumnSelectorOp note
    locator: Node shape, fit-time schema resolution, and the stored selected_columns field
    angle: Your own note on where Stratum resolves a selector - the design question this stage is evidence
      for.
    angle_detail: 'The note records that selection resolves at fit time and stores the resulting column
      list. Read it against Task 2: storing resolved names is exactly the materialization the sheet shows
