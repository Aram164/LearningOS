  - id: resource-polars-selectors-sheet
    kind: practise
    label: Stage exercise sheet - selector set algebra, drift, strictness
    locator: attachments/s2b-exercises-p2.md - Fixture F3, then Tasks 1-4
    angle: Turns 'selectors are declarative' into four executed properties, including the one that silently
      computes.
    angle_detail: Task 1 ends on `cs.numeric() - 1`, which is not a set difference at all but element-wise
      subtraction applied to every numeric column — legal, silent, and a selection quietly turned into
      a computation. Task 3 settles strictness with `require_all`, and Task 4 asks for the `select_dtypes`
      translation with the Boolean/Categorical class boundary answered by execution.
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-expressions/stages/stage-polars-expr-selectors-expansion/attachments/s2b-exercises-p2.md
