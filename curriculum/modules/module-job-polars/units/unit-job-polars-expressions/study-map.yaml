- id: stage-polars-expr-selectors-expansion
  knowledge_node_id: knowledge-polars-expr-expansion
  number: 2
  title: Selectors and expression expansion
  status: pending
  objective: Select columns by name and dtype without materializing schema-specific Python lists, and
    predict the expanded output columns before execution.
  done_when:
  - The selector expressions predicted and checked with cs.expand_selector.
  - You can say what decides whether - is set difference or arithmetic, and what 2.0 changed about | and
    & next to pl.col.
  - One expression applied unchanged to several schemas, including one with no matching column.
  - pandas select_dtypes compared on the same frames, including the new str dtype.
  exam_critical: false
  concepts:
  - concept-python
  - concept-map-family
  - concept-projection-family
  scope_triage: required-now
  resources:
  - id: resource-polars-expression-expansion
    kind: read
    label: Polars expression expansion
    locator: §'Selectors' and §'Debugging selectors' - specifically the operator-ambiguity warning
    angle: The only source that states the operator overloading explicitly, and it is the stage's central
      hazard.
    angle_detail: 'Read the debugging section first, not last: it introduces `cs.expand_selector` as the
      way to see what a selector resolves to, which is the tool every task here uses. The ambiguity note
      is short and easy to skim past — the sheet turns it into an executed result so it cannot be skimmed.'
    scope_triage: required-now
    url: https://docs.pola.rs/user-guide/expressions/expression-expansion/
