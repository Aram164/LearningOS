    angle: Pins the Kleene tables and the exact row-count divergence between the two dropna implementations.
    angle_detail: It asserts that the Polars predicate keeps two rows where pandas keeps one, and that
      the difference is exactly the NaN row. Keeping this runnable is how you notice if a later refactor
      of the predicate quietly adopts pandas semantics — the counts move and the test says so.
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-expressions/stages/stage-polars-expr-horizontal-conditional/attachments/s2c-check-p2.py
  - id: resource-polars-horizontal-dropna-core
    kind: practise
    label: Derive the dropna predicate core
    locator: Sheet Task 6 - how='any', how='all', and thresh over a dynamic subset
    angle: 'The stage''s payload: the predicate Session 4''s DROPNA translation is built from.'
    angle_detail: Implement `thresh` as a non-null count compared to n, not as a chain of any/all — the
      chain reintroduces the fold seed problem and breaks on an empty subset. The fixture deliberately
      contains a real NaN that is not a null, and that single row is what makes pandas and Polars return
      different row counts for `how='any'`. Decide which semantics `dropna` has at the boundary and record
      it; `how='all'` agrees either way and will hide the choice.
    scope_triage: required-now
  - id: resource-polars-when
    kind: read
    label: polars.when
    locator: Branch validity, expression inputs, literals, and chained when/then/otherwise
    angle: The API reference for the conditional, read for what it does not say about branch typing.
    angle_detail: It documents the chaining and the literal handling. The two behaviours you need — that
      an unselected branch is still evaluated for validity, and that branches of different types are unified
      to a supertype rather than rejected — are visible only by execution, which is Task 5.
    scope_triage: reference-only
    url: https://docs.pola.rs/api/python/stable/reference/expressions/api/polars.when.html
