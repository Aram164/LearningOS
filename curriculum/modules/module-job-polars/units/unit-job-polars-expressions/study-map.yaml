- id: stage-polars-expr-horizontal-conditional
  knowledge_node_id: knowledge-polars-expr-horizontal
  number: 3
  title: Horizontal logic, folds, conditionals, and literals
  status: pending
  objective: Compose row-wise boolean/count expressions safely across dynamic column sets, including Kleene
    logic and Polars' requirement that every when/then branch be independently valid.
  done_when:
  - Both Kleene truth tables filled in and the two surprising cells explained.
  - fold and sum_horizontal compared on data with nulls.
  - The when/then/otherwise cases predicted, including the silent Int64 to String supertype.
  - A dropna-style filter written with no Python loop, for how='any', how='all' and thresh.
  exam_critical: false
  concepts:
  - concept-python
  - concept-map-family
  - concept-dataframe-semantics
  scope_triage: required-now
  resources:
  - id: resource-polars-folds
    kind: read
    label: Polars folds
    locator: §'Basic example', §'Conditional fold', and the accumulator/initial-value discussion
    angle: Explains the accumulator, which is where the fold's output dtype comes from - the stage's quietest
      trap.
    angle_detail: 'The page shows folds working and does not dwell on the seed''s type. Read it holding
      one question: over two Int64 columns, what dtype does `pl.fold(0, ...)` produce? The answer is not
      Int64, and a translation that seeds with a bare literal silently narrows every horizontal sum it
      emits.'
    scope_triage: required-now
    url: https://docs.pola.rs/user-guide/expressions/folds/
  - material_ref:
      route_id: route-polars-definitive-guide-s02
      inherit:
      - vault_path
      - source_id
    id: resource-polars-book-horizontal
    kind: read
    label: 'Python Polars: The Definitive Guide'
    locator: Ch 9 §Boolean Algebra Operations pp. 264-265 and §When, Then, Otherwise pp. 274-275; Ch 13
      §Row-Wise Aggregations pp. 387-389
    angle: The book's account of boolean composition and the conditional, which it treats together.
    angle_detail: pp. 274-275 is short and does not mention that an unselected branch is still validated,
      nor that mismatched branch types are coerced to a supertype. Read it for the shape of the API, then
      treat the sheet's Task 5 as the specification. Ch 13 pp. 387-389 covers the horizontal helpers as
      aggregations, which is the framing that makes the empty-subset error make sense.
    scope_triage: required-now
    route_id: route-polars-definitive-guide-s02
    angle_review:
      kind: refinement
      reviewed_by: Claude Opus 5.5 under Aram's plan request
      reviewed_on: '2026-11-02'
      rationale: 'Reviewed the route ''Polars book - Session 2 route'' against the stage ''Horizontal
        logic, folds, conditionals, and literals'': the row narrows the route to this stage''s purpose.
        This relation review asserts no new source observation or learner achievement.'
      fingerprint: sha256:e1f85f371c07227c4d32ab2a42546a329e8501337089fb261da067b4c6565023
  - id: resource-polars-horizontal-sheet
    kind: practise
    label: Stage exercise sheet - Kleene tables, fold seeds, branch validity, dropna core
    locator: attachments/s2c-exercises-p2.md - Fixture F4, then Tasks 1-6
    angle: Supplies the verified truth tables the dropna translation is derived from, plus the version
      fact the docs get wrong here.
    angle_detail: 'Task 2 is the concrete instance of this module''s abstract warning about live documentation:
      `ignore_nulls` is not a keyword `any_horizontal` accepts in 2.0, and the sheet asserts the TypeError.
      Task 3 puts `fold` and `sum_horizontal` on the same null-bearing data and they disagree, which is
