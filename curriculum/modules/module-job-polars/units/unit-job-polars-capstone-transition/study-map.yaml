- id: stage-polars-version-transition-lab
  knowledge_node_id: knowledge-polars-version-transition
  number: 4
  title: 'Optional: version transition lab'
  status: pending
  objective: 'Deferred 2026-11-02: its reason has gone, because Stratum already moved to Polars 2.0. Keep
    the production study target on Polars 1.36.0 while rehearsing a controlled upgrade assessment for
    ordering, streaming, concat, explode, casting/coercion, and selector changes.'
  done_when:
  - Run the capstone suite unchanged under the candidate version in an isolated environment.
  - Produce a behavior delta table; no newer behavior is copied into the 1.36 contract without a Stratum
    dependency change.
  - Classify each delta as API rename, documented semantic change, regression, or newly supported capability.
  exam_critical: false
  concepts:
  - concept-python
  - concept-dataframe-semantics
  - concept-dispatch
  scope_triage: deferred
  resources:
  - id: resource-polars-upgrade-2
    kind: read
    label: Polars 2.0 upgrade guide
    locator: Streaming default; ordering; concat strictness; explode; casting/coercion; selectors
    angle: Isolates future semantic changes from today's locked backend target.
    angle_detail: Read only after the 1.36 capstone passes; use the guide to choose delta probes, not
      as authority for current Stratum behavior. The live page may describe a newer release, so execute
      each claim against Polars 1.36.0 or pandas 3.0.2 before treating it as backend policy.
    scope_triage: deferred
    url: https://docs.pola.rs/releases/upgrade/2/
    source_id: source-polars-docs
    route_id: route-g8-polars-capstone-transition-03adf69a07
  - id: resource-pandas-3-release
    kind: reference
    label: pandas 3.0 release notes
    locator: String dtype, Copy-on-Write, joins, GroupBy and compatibility changes
    angle: Explains the major-version oracle changes relevant to Stratum's pinned pandas 3.0.2.
    angle_detail: Confirm the lockfile patch release with probes; avoid importing post-3.0.2 behavior
      from stable docs. The live page may describe a newer release, so execute each claim against Polars
      1.36.0 or pandas 3.0.2 before treating it as backend policy.
    scope_triage: reference-only
    url: https://pandas.pydata.org/docs/whatsnew/v3.0.0.html
  - id: resource-version-delta-matrix
    kind: practise
    label: Backend version delta matrix
    locator: Exercise 2 - run the same parity corpus in isolated baseline and candidate environments
    angle: Produces executable evidence instead of familiarity from reading.
    angle_detail: No production policy changes here; the output is an upgrade decision input with reproducible
      environments and exact failing cases.
    scope_triage: required-now
  working_note: curriculum/modules/module-job-polars/units/unit-job-polars-capstone-transition/stages/stage-polars-version-transition-lab/notes.md
