    kind: practise
    label: Capstone stress report
    locator: Exercise 1 - generated run plus named counterexample ledger
    angle: Produces executable evidence instead of familiarity from reading.
    angle_detail: The report lists versions, seed/profile, invariants, failures, classifications, and
      permanent regression IDs.
    scope_triage: required-now
  working_note: curriculum/modules/module-job-polars/units/unit-job-polars-capstone-transition/stages/stage-polars-capstone-property-stress/notes.md
