- id: stage-polars-capstone-property-stress
  knowledge_node_id: knowledge-polars-property-stress
  number: 3
  title: 'Optional: property and stress testing'
  status: pending
  objective: 'Deferred 2026-11-02: testing technique, not fluency. Stress the capstone across schema,
    missingness, cardinality, order, and failure boundaries, then turn every found counterexample into
    a durable named regression.'
  done_when:
  - Generated tests span empty/wide frames, duplicate keys, mixed null/NaN, boundary sizes, and relevant
    dtypes.
  - Every failure is classified as implementation bug, unsupported pandas surface, intentional divergence,
    or invalid test oracle.
  - The final support matrix and normalization policy agree with the executable suite.
  exam_critical: false
  concepts:
  - concept-python
  - concept-dataframe-semantics
  - concept-dispatch
  scope_triage: deferred
  resources:
  - id: resource-polars-testing-capstone
    kind: read
    label: Polars testing reference
    locator: Frame/series asserts plus parametric strategies and profiles
    angle: Provides the capstone's native assertions and generated inputs.
    angle_detail: Pin strategy behavior and retain shrunk counterexamples as ordinary fixtures. The live
      page may describe a newer release, so execute each claim against Polars 1.36.0 or pandas 3.0.2 before
      treating it as backend policy.
    scope_triage: required-now
    url: https://docs.pola.rs/api/python/stable/reference/testing.html
    source_id: source-polars-docs
    route_id: route-g8-polars-capstone-transition-f4cc532998
  - id: resource-pandas-testing-capstone
    kind: read
    label: pandas testing reference
    locator: assert_frame_equal comparison controls
    angle: Makes the oracle comparison policy reviewable.
    angle_detail: Use operation-specific profiles instead of silently dropping index, dtype, or order
      differences. The live page may describe a newer release, so execute each claim against Polars 1.36.0
      or pandas 3.0.2 before treating it as backend policy.
    scope_triage: required-now
    url: https://pandas.pydata.org/docs/reference/api/pandas.testing.assert_frame_equal.html
    source_id: source-pandas-docs
    route_id: route-g8-polars-capstone-transition-96df9fa680
