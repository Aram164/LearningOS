  title: Write Polars from pandas originals
  status: pending
  objective: 'Show fluency: take PDS queries you have not read, write Polars from the pandas file without
    looking anything up where you can, and compare with the official Polars version. Then explain from
    memory where pandas intuition breaks.'
  done_when:
  - Q10, Q12, Q16 and Q18 written in Polars from the pandas originals, and each compared with the official
    version.
  - For each, you note every lookup you needed. The count should fall as you go.
  - A ten-minute closed-book walkthrough of where pandas intuition breaks, from your differences sheet.
