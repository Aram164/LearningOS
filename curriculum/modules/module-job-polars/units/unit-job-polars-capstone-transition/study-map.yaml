- id: stage-polars-capstone-one-pipeline
  knowledge_node_id: knowledge-polars-capstone
  number: 2
  title: Rewrite one full ML pipeline
  status: pending
  objective: Take one real ML pipeline from pandas to Polars end to end, from reading to a model score,
    and explain every place the two differ.
  done_when:
  - The make_orders pipeline runs in Polars in your own scratch file, from CSV to a fitted model.
  - The score agrees with the pandas version, or you can explain why it does not.
  - Each difference you hit is already in your sheet, or you add it now.
  exam_critical: false
  concepts:
  - concept-dataframe-semantics
  - concept-python
  scope_triage: required-now
  resources:
  - id: resource-stratum-orders-capstone
    kind: reference
    label: The pipeline to rewrite
    locator: Stratum/tests/application/test_frame_ops_pipeline.py, make_orders and the pipeline built
      from it
    angle: A realistic pipeline covering filters, derived columns, projection, encoding and a model.
    angle_detail: 'Copy the idea into your own scratch file, never the other way. Read-only: never edit,
      add or run anything that writes inside Stratum.'
    scope_triage: required-now
  - id: resource-capstone-pipeline
    kind: reference
    label: Rewrite and compare
    locator: Exercise 1
    angle: Everything in the module used at once.
    angle_detail: Read a CSV, filter, derive, split, encode, fit and score, in Polars. Then compare with
      pandas on the same split.
    scope_triage: required-now
