- id: stage-polars-ml-features
  knowledge_node_id: knowledge-polars-ml-features
  number: 1
  title: Feature columns
  status: pending
  objective: 'Turn a raw table into feature columns in both libraries: derived columns, date parts, dtype-based
    selection, imputation, and group statistics fitted on training rows only.'
  done_when:
  - You rewrote the feature steps of make_orders in Polars, and they agree with pandas.
  - A group statistic fitted on train rows and joined onto test rows, with a decision for unseen categories.
  - You can say why fill_null misses the NaN from 0/0, and what that does to a feature.
  exam_critical: false
  concepts:
  - concept-dataframe-semantics
  - concept-map-family
  - concept-projection-family
  scope_triage: required-now
  resources:
  - material_ref:
      route_id: route-skrub-s09
      inherit:
      - source_id
      - url
    id: resource-skrub-selectors
    kind: read
    label: skrub - Selectors
    locator: '''Skrub Selectors'' and ''Selecting based on dtype or data properties'''
    angle: How an ML pipeline picks columns by type rather than by name.
    angle_detail: Compare with Polars selectors from Session 2 and pandas select_dtypes. Run on a Polars
      frame yourself.
    scope_triage: required-now
    route_id: route-skrub-s09
    angle_review:
      kind: refinement
      reviewed_by: Claude Opus 5.5 under Aram's plan request
      reviewed_on: '2026-11-02'
      rationale: 'Reviewed the route ''skrub - selectors, TableVectorizer, DataOps'' against the stage
        ''Feature columns'': the row narrows the route to this stage''s purpose. This relation review
        asserts no new source observation or learner achievement.'
      fingerprint: sha256:39f0826fbde17cb11c6c7175d3efa24cfcc9a9563be3fecacbe11664ab8e8ccd
  - kind: reference
    label: Polars selectors reference
    id: resource-polars-selectors-api
    locator: Reference page
    url: https://docs.pola.rs/api/python/stable/reference/selectors.html
    scope_triage: reference-only
    angle: Look-up for dtype-based column selection.
    angle_detail: Reference only.
  - id: resource-stratum-orders-pipeline
    kind: reference
    label: A real feature pipeline
    locator: Stratum/tests/application/test_frame_ops_pipeline.py, make_orders and the pipeline built
      from it
    angle: Filter, assign, date parts and dtype split, exactly what this stage practises.
    angle_detail: 'Read it as the worked example, then write the same steps in your own scratch file.
      Read-only: never edit, add or run anything that writes inside Stratum.'
    scope_triage: required-now
  - id: resource-ml-features-1
    kind: reference
    label: Rewrite the feature steps in Polars
    locator: Exercise 1
    angle: Fluency on the operations pipelines really use.
    angle_detail: Filter, derived total, month and weekday from a parsed date, select by dtype. Compare
      with pandas. Watch the weekday numbering.
    scope_triage: required-now
  - id: resource-ml-features-2
    kind: reference
    label: Fit a group statistic without leaking
    locator: Exercise 2
    angle: The classic pipeline bug, in dataframe form.
    angle_detail: Compute a per-category mean on train rows only, join to test, and decide what an unseen
      category gets. Compare with an over() on all rows, and say which leaks.
    scope_triage: required-now
  - id: resource-ml-features-3
    kind: reference
    label: Impute after a division
    locator: Exercise 3
    angle: Where the null and NaN difference hits features.
    angle_detail: Compute a/b with a 0/0 row, then impute. Do it in both libraries and explain the difference.
      This is the gap Stratum's FIXME(#216) records.
    scope_triage: required-now
  working_note: curriculum/modules/module-job-polars/units/unit-job-polars-ml-pipeline/stages/stage-polars-ml-features/notes.md
  attachments: []
  source_feedback: []
- id: stage-polars-ml-splits
  knowledge_node_id: knowledge-polars-ml-splits
  number: 2
  title: Splits and row alignment
  status: pending
  objective: Keep X and y paired without an index, and see what pandas label alignment does for you, and
    to you, that Polars does not.
  done_when:
  - A train/test split done on a Polars frame with scikit-learn indices.
  - The same split done natively with with_row_index, sample and an anti join.
  - You can show a pandas assignment that aligns by label where the same Polars code pairs by position
    or raises.
  exam_critical: false
  concepts:
  - concept-dataframe-semantics
  - concept-selection-family
  scope_triage: required-now
  resources:
  - kind: reference
    label: scikit-learn - Cross-validation
    id: resource-sklearn-cv
    locator: §'Computing cross-validated metrics' and §'Cross validation iterators'
    url: https://scikit-learn.org/stable/modules/cross_validation.html
    scope_triage: required-now
    angle: 'What the splitters hand you: positions, not labels.'
    angle_detail: That is why a splitter works on a Polars frame at all.
  - kind: reference
    label: scikit-learn - Common pitfalls
    id: resource-sklearn-pitfalls
    locator: §'Data leakage'
    url: https://scikit-learn.org/stable/common_pitfalls.html
    scope_triage: helpful-now
    angle: Why feature statistics must be fitted inside the split.
    angle_detail: Short. Read before Exercise 2 of the previous stage if the idea is new.
  - id: resource-stratum-split
    kind: reference
    label: Stratum's split
    locator: Stratum/stratum/optimizer/logical/_split_ops.py, class SplitOp, method process
    angle: 'iloc on pandas, plain indexing on Polars: the difference in two lines.'
    angle_detail: 'Read-only: never edit, add or run anything that writes inside Stratum.'
    scope_triage: required-now
  - id: resource-ml-splits-1
    kind: reference
    label: Split a Polars frame two ways
    locator: Exercise 1
    angle: Both the scikit-learn route and the native route.
    angle_detail: train_test_split or KFold indices on a Polars frame, then with_row_index, sample and
      an anti join. Check that no row is lost or duplicated.
    scope_triage: required-now
  - id: resource-ml-splits-2
    kind: reference
    label: Break X and y on purpose
    locator: Exercise 2
    angle: Makes the alignment difference impossible to forget.
    angle_detail: In pandas, filter X, leave y, assign a Series with a shuffled index and read the result.
      Write the same in Polars. Add the result to your differences sheet.
    scope_triage: required-now
  - id: resource-ml-splits-3
    kind: reference
    label: Same seed, different rows
    locator: Exercise 3
    angle: Reproducibility across libraries is not a thing to assume.
    angle_detail: Sample with one seed in both libraries and compare. Then say what a test may and may
      not assert.
    scope_triage: required-now
  working_note: curriculum/modules/module-job-polars/units/unit-job-polars-ml-pipeline/stages/stage-polars-ml-splits/notes.md
  attachments: []
  source_feedback: []
