- id: stage-polars-02-the-parity-harness-differential-testing-from-day
  number: 2
  title: 'The parity harness: differential testing from day one'
  status: pending
  objective: Build the small cross-backend test harness that every later stage deposits into, so a divergence
    is recorded as an executable failing case the week it is discovered rather than as a note nobody re-runs.
  done_when:
  - A runnable harness that takes a pandas callable and a Polars callable, applies both to a shared case,
    and reports value, dtype, schema, row-order and exception differences separately rather than as one
    boolean.
  - A written normalization policy naming which differences are normalized before comparison and which
    must fail the test, with a justification per entry.
  - At least twelve seed cases covering empty frames, all-null columns, duplicate keys, mixed-type columns,
    and a column of every dtype the two libraries disagree about.
  - Every divergence found is classified against the eight axes and has a failing case committed to the
    parity harness.
  estimate_minutes: 105
  exam_critical: false
  concepts:
  - concept-python
  scope_triage: required-now
  resources:
  - kind: reference
    label: Official reference — docs.pola.rs — testing
    id: resource-polars-02-01-official-reference-polars-testing
    locator: assert_frame_equal, assert_series_equal, and their tolerance options
    url: https://docs.pola.rs/api/python/stable/reference/testing.html
    scope_triage: reference-only
  - kind: reference
    label: Official reference — pandas.pydata.org — testing
    id: resource-polars-02-02-official-reference-pandas-testing
    locator: assert_frame_equal and the check_dtype/check_like/check_index_type switches
    url: https://pandas.pydata.org/docs/reference/testing.html
    scope_triage: reference-only
  - kind: read
    label: Required core — pytest parametrization
    id: resource-polars-02-03-required-core-pytest-parametrize
    locator: Data-driven cases and stacked parametrize decorators
    url: https://docs.pytest.org/en/stable/how-to/parametrize.html
    scope_triage: required-now
  - kind: reference
    label: Optional depth — Hypothesis quickstart
    id: resource-polars-02-04-optional-depth-hypothesis-quickstart
    locator: Property-based generation, for the stages where hand-written cases run out
    url: https://hypothesis.readthedocs.io/en/latest/quickstart.html
    scope_triage: deferred
  - kind: read
    label: Local material — pandas↔Polars contention probes
    id: resource-polars-02-05-local-material-contention-probes
    locator: semantics.py and verify.py
    vault_path: knowledge/attachments/note-pandas-polars-aggregation-contentions
    scope_triage: required-now
    angle: Reference shape for a probe before writing a new one.
  - kind: practise
    label: 'Write the comparison helper: separate reports for values, dtypes, schema, row order, and raised
      exceptions. One boolean is not a result.'
    id: resource-polars-02-06-write-the-comparison-helper
    locator: Exercise 1
    scope_triage: required-now
  - kind: practise
    label: 'Decide and write down the null policy: is a pandas NaN equal to a Polars null for comparison
      purposes? Justify the answer, then encode it.'
    id: resource-polars-02-07-decide-and-write-the-null-policy
    locator: Exercise 2
    scope_triage: required-now
  - kind: practise
    label: 'Decide and write down the order policy: normalize row order only where the operation genuinely
      promises none, and record which operations those are.'
    id: resource-polars-02-08-decide-and-write-the-order-policy
    locator: Exercise 3
    scope_triage: required-now
  - kind: practise
    label: Build the twelve seed cases. Predict each result before running it and keep the wrong predictions
      in the file as comments.
    id: resource-polars-02-09-build-the-twelve-seed-cases
    locator: Exercise 4
    scope_triage: required-now
  - kind: practise
    label: 'Deliberately break the harness: make it pass on a pair that differs semantically, then fix
      the check that let it through.'
    id: resource-polars-02-10-deliberately-break-the-harness
    locator: Exercise 5
    scope_triage: required-now
  - kind: practise
    label: Axis pass — classify every divergence found this session against the eight axes, then add one
      harness case per divergence and re-run the whole harness.
    id: resource-polars-02-99-axis-pass
    locator: Closing pass, every session
    scope_triage: required-now
