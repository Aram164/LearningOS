- id: stage-polars-02-the-parity-harness-differential-testing-from-day
  knowledge_node_id: knowledge-polars-parity-harness
  number: 3
  title: 'Optional: build a differential parity harness'
  status: pending
  objective: 'Deferred 2026-11-02: backend engineering rather than fluency, and Stratum already has compatibility
    tests (see Session 10). Exercise files here still target Polars 1.36. Build the differential harness
    every later session deposits into, with a report that keeps values, dtype/schema, cardinality, row
    order, missing-value representation, warnings and exceptions as seven separate findings — and with
    declared null, order and tolerance policies rather than defaults nobody chose.'
  done_when:
  - '`compare(pandas_fn, polars_fn, case)` returns a report whose seven fields are independently readable,
    and whose type cannot be used in an `if` — no `__bool__`.'
  - One side raising produces a populated report naming the side, the exception type and the message;
    both sides raising records both types, because differing exception types are themselves a finding.
  - Warnings are captured per side, so a pandas FutureWarning with no Polars analogue is recorded rather
    than swallowed.
  - The null policy is a named value passed in, with a written justification covering NaN-vs-null sums,
    all-null means, and the three-valued `is_nan()` result — plus a statement of which divergence class
    your default hides.
  - Row order is normalized only for operations declared to promise none, as data (`ORDER_PROMISE`), each
    entry backed by an executed pair rather than by the documentation's wording.
  - All twelve seed cases run, with wrong predictions left in the file as comments; at least four classify
    as semantic, and case 8 carries a per-case tolerance rather than a global one.
  - The three deliberate breaks from Task 5 each have a regression case asserting the finding is now reported.
  - '`s02-check.py` passes (43 assertions), and Stage 1''s Task 5 table is fully backfilled through the
    deposit protocol so running the harness reproduces every Stage 1 finding.'
  exam_critical: false
  concepts:
  - concept-python
  - concept-dataframe-semantics
  - concept-dispatch
  scope_triage: deferred
  resources:
  - id: resource-polars-02-sheet
    kind: practise
    label: Stage exercise sheet - the report contract, three policies, and twelve verified seed cases
    locator: attachments/s02-exercises.md - Tasks 1-6; the seed table is the deliverable
    angle: Names the twelve cases the harness must classify correctly on day one, with each divergence
      executed and recorded.
    angle_detail: 'The seed cases are not illustrations: they are chosen so four separate axes fire, and
      the key records what each library actually did. Three cells repay a second reading — `n_unique`
      counting null as a value (off by one on every column with a missing entry), pandas concatenating
      strings under `sum` while Polars refuses (the same plan changes its answer on one backend and fails
      loudly on the other), and the ten-0.1 sum differing in the last bit (which is why tolerance is a
      per-case declaration, never a global one).'
