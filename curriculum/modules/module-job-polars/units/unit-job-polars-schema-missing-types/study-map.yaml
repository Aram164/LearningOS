      cannot hide it.
    angle_detail: It checks that pandas' default grouping sums to 1 while the Polars grouping sums to
      3, and that `dropna=False` reconciles them. It also pins all three answers to 'are two missing values
      equal', which is the question Session 7's join stage has to have settled before it starts.
    scope_triage: required-now
