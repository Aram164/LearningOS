- id: stage-polars-06-nulls-nans-and-the-missing-value-model
  number: 3
  title: Nulls, NaNs, and the missing-value model
  status: pending
  objective: 'Settle the missing-value model end to end: what an unknown value does to arithmetic, comparison
    and membership, where each library instead treats missing as an ordinary value, and which two defaults
    the two libraries set in opposite directions.'
  done_when:
  - The seven three-valued-logic expressions predicted and run, including `is_in([1, None])` NOT matching
    a null row, and the general rule stated.
  - '`eq_missing` identified as the deliberate exception to that rule, with a statement of which operations
    need it (dedup, null-matching joins) and which must not use it.'
  - 'The four placement operations run - group_by, unique, sort, n_unique - and the distinction articulated:
    three-valued logic governs computed answers, while placement operations must place every row somewhere.'
  - 'The grouping default divergence recorded as a harness case: pandas groupby DROPS null-key rows by
    default, Polars keeps them - with the translation rule for a captured groupby that never mentions
    dropna.'
  - The sort placement divergence attached to the missing-value model rather than to the sort operation.
  - The three answers to 'are two missing values equal' collected - pandas False, Polars null, eq_missing
    True - and the one a join should use decided.
  - A five-entry missing-value policy naming a mechanism for each, with the fill_nan(None) normalization
    applied at exactly one point in the pipeline.
  - '`s4c-check.py` passes (28 assertions).'
  exam_critical: false
  concepts:
  - concept-python
  - concept-dataframe-semantics
  - concept-map-family
  scope_triage: required-now
  resources:
  - id: resource-polars-s4c-sheet
    kind: practise
    label: Stage exercise sheet - three-valued logic, placement operations, and two flipped defaults
    locator: attachments/s4c-exercises.md - Part A, then Part B Task B1
    angle: Separates where missing means unknown from where it is treated as an ordinary value, then finds
      the two defaults set in opposite directions.
    angle_detail: 'Part A''s trap is `is_in([1, None])`: putting None in the list does not make a null
      row match, because membership is a comparison and comparing to unknown is unknown. Part A2 then
      shows group_by, unique, sort and n_unique all treating missing as a value — not an inconsistency,
      since a placement operation must place every row. Part B is the one that changes results: pandas
      groupby discards null-key rows by default and Polars keeps them, so a literal translation loses
      rows while the totals stay plausible.'
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-schema-missing-types/stages/stage-polars-06-nulls-nans-and-the-missing-value-model/attachments/s4c-exercises.md
