- id: stage-polars-07-type-promotion-coercion-and-strictness
  number: 2
  title: Type promotion, coercion, and strictness
  status: pending
  objective: Work out what each library does to a dtype when you are not looking — pandas widening silently
    against Polars computing a supertype or refusing — and write the promotion table that lets you predict
    the output schema of any operation.
  done_when:
  - The ten-pair supertype table completed by execution, and the rule stated in one sentence.
  - 'The Int64+UInt64 row explained from the rule: no integer type holds both ranges, so the supertype
    is Float64 and exactness is lost above 2^53 - reachable from an ordinary join between a UInt64 and
    an Int64 key.'
  - 'Strictness settled: the default, what strict=False produces (null, not a clamped or wrapped value),
    and the float-to-int rule (truncation toward zero).'
  - 'The headline divergence recorded as a harness case: pandas astype(''int8'') on 300 returns 44 silently,
    Polars raises - with a written Stratum policy on reproduce / raise / translate.'
  - Arithmetic overflow shown to agree (both wrap to -128), so the divergences are located in the policy
    layer rather than in the arithmetic.
  - Division result dtypes recorded as syntax-only on executed evidence.
  - A coercion policy table with one row per supported astype target, every row resolved to a chosen behaviour
    with a reason - no row left as 'depends'.
  - '`s4b-check.py` passes (27 assertions).'
  exam_critical: false
  concepts:
  - concept-python
  - concept-dataframe-semantics
  scope_triage: required-now
  resources:
  - id: resource-polars-s4b-sheet
    kind: practise
    label: Stage exercise sheet - the supertype rule, its edge, and the cast that lies
    locator: attachments/s4b-exercises.md - Task A1 table first, then Part B
    angle: Derives the promotion rule from ten executed pairs and lands on the one row where it stops
      being lossless.
    angle_detail: 'Int8+UInt8 gives Int16 and Int32+UInt32 gives Int64, so signed-plus-unsigned widens
      one size. At 64 bits there is nothing to widen into and the supertype becomes Float64 — exact only
      to 2^53, and reachable from an ordinary join between a UInt64 id and an Int64 one. Part B is the
      headline: pandas `astype(''int8'')` on 300 returns 44, the low byte, with no error; Polars refuses.
      A translation that ''fixes'' the Polars error by falling back produces a plausible wrong number
      where it had a loud failure.'
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-schema-missing-types/stages/stage-polars-07-type-promotion-coercion-and-strictness/attachments/s4b-exercises.md
  - id: resource-polars-s4b-check
    kind: practise
    label: Answer-key self-check - 27 assertions including the 2^53 edge
    locator: attachments/s4b-check.py
    angle: Asserts both that 44 is 300 mod 256 and that the Float64 supertype really cannot separate 2^53
      from 2^53+1.
    angle_detail: 'The second assertion is the one to keep: it demonstrates the precision loss directly
      rather than describing it, and it runs the Int64+UInt64 addition to confirm the promotion actually
      goes through Float64 rather than being a documentation claim.'
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-schema-missing-types/stages/stage-polars-07-type-promotion-coercion-and-strictness/attachments/s4b-check.py
