- id: stage-polars-03-construction-i-o-schema-and-chunks
  number: 1
  title: Construction, I/O, schema, and chunks
  status: pending
  objective: 'Decide where a schema comes from instead of inheriting one from an inference heuristic:
    declare, adjust or infer it deliberately, read a lazy scan''s schema before touching data, and establish
    what each library''s CSV reader does with dates, mixed columns and the string ''NA''.'
  done_when:
  - Six constructions run and the three ways a schema is decided named - declared, adjusted per column,
    inferred - plus the one input where Polars refuses to guess.
  - 'The trap confirmed: declaring a schema on convertible data casts rather than rejects, so a declaration
    is also a cast instruction.'
  - '`scan_csv(...).collect_schema()` used to get a schema without reading, and the plan line showing
    the scan narrowed by a later select identified.'
  - 'Chunk behaviour measured, not asserted: n_chunks after concat, after rechunk, and a timed comparison
    on a 100-append frame, with a statement of when rechunk pays for itself.'
  - The CSV inference table completed for dates, a mixed column and 'NA', with pandas' default missing-string
    list identified as inventing missingness and promoting the column to float.
  - 'The late-type-change file run with defaults on both sides, and the result recorded: pandas succeeds
    silently, Polars raises ComputeError - plus a decision on infer_schema_length versus ignore_errors
    at the boundary.'
  - A three-entry schema-contract decision record for the operation boundary.
  - '`s4a-check.py` passes (26 assertions).'
  exam_critical: false
  concepts:
  - concept-python
  - concept-dataframe-semantics
  scope_triage: required-now
  resources:
