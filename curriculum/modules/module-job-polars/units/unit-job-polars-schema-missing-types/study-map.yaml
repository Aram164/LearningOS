    kind: practise
    label: Stage exercise sheet - declare vs infer, CSV inference, chunks
    locator: attachments/s4a-exercises.md - Part A, then Part B Task B2
    angle: Lands on the case where the two readers disagree about whether text is missing, and the one
      where Polars refuses rather than guesses.
    angle_detail: 'Part B''s ''NA'' row is one file producing two dtypes and two value sets with no diagnostic
      from either library. Task B2 is the surprise: with a column that turns from integers to text at
      row 201, pandas reads the whole file and succeeds, while Polars raises ComputeError because its
      inference window is 100 rows. That is the opposite of the usual direction, and the escape hatch
      most people reach for — `ignore_errors=True` — silently converts the offending values to nulls.'
    scope_triage: required-now
    vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-schema-missing-types/stages/stage-polars-03-construction-i-o-schema-and-chunks/attachments/s4a-exercises.md
