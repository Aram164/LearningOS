    label: Aggregation
    locator: Stratum/stratum/optimizer/physical/_aggregation_execs.py, class PolarsAggregateOp, method
      process
    angle: Five lines, each reproducing one pandas default from Session 6.
    angle_detail: 'The densest example of the module''s goal in the codebase. Read-only: never edit, add
      or run anything that writes inside Stratum.'
    scope_triage: required-now
  - id: resource-stratum-read-translate
    kind: reference
    label: Column methods
    locator: 'Stratum/stratum/optimizer/physical/_polars_translate.py, section ''column methods'': _polars_fillna,
      _polars_isna, _polars_notna, _polars_where, _polars_map'
    angle: Null and NaN, type promotion and missing lookups, with honest FIXME notes.
    angle_detail: 'The FIXME(#216) comments record real gaps between the backends. Reproducing one in
      a scratch file is the best test of Session 3. Read-only: never edit, add or run anything that writes
      inside Stratum.'
    scope_triage: required-now
  - id: resource-stratum-read-conversion
    kind: reference
    label: Crossing between libraries
    locator: Stratum/stratum/optimizer/physical/_conversion.py, whole file
    angle: How an index-free library hands data to an index-based one.
    angle_detail: 'Connects Session 9''s boundary to why row order and index lineage matter. Read-only:
      never edit, add or run anything that writes inside Stratum.'
    scope_triage: required-now
  - id: resource-stratum-read-tests
    kind: reference
    label: How Stratum tests parity
    locator: Stratum/tests/optimizer/physical/compatibility/test_missing_comparison.py, then test_sort_values.py
