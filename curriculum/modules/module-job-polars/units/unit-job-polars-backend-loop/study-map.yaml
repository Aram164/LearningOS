  done_when:
  - 'For PolarsAggregateOp.process you can say why each of these is there: fill_nan(None), the null-key
    filter, maintain_order, the final sort with nulls_last, and pl.len().'
  - For _polars_fillna, _polars_isna and _polars_map you can say which pandas behaviour each models, and
    reproduce the FIXME(#216) gap in your own scratch file.
  - You can say why polars-to-pandas conversion is only admitted with a default index.
  - You have read one compatibility test and can say what it would catch.
  - 'Nothing inside Stratum has changed: git status there is as you left it.'
  exam_critical: false
