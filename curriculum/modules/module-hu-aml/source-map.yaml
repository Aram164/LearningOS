- source_id: source-islp
  role: spine
  why: Gentle statistical-learning spine; Ch 2 for framing, Ch 10 for neural networks/CNNs/RNNs, and scoped
    chapters for L02–L07.
  priority: 1
  unit_routes:
  - unit_id: unit-aml-l01
    title: ISLP Chapter 2 — statistical learning
    format: book
    angle: A gentle, example-driven explanation of prediction, inference, supervised/unsupervised tasks,
      model flexibility, train/test error, and the vocabulary behind problem formulation.
    covers:
    - knowledge-aml-l01-formulation
    - knowledge-aml-l01-generalization
    depth: intuition
    scope: complementary
    locator: Chapter 2, especially §§2.1–2.2
  - unit_id: unit-aml-l02
    title: ISLP k-NN, flexibility, and validation selections
    format: book
    angle: The clearest gentle reading for the U-shaped test-error curve, k-NN versus linear models, bias-variance,
      and choosing k by validation.
    covers:
    - knowledge-aml-l02-algorithm
    - knowledge-aml-l02-bias-variance
    - knowledge-aml-l02-validation
    depth: intuition
    scope: complementary
    locator: §§2.2.2–2.2.3, §3.5, §4.7.6, §5.1 including §5.1.4
  - unit_id: unit-aml-l03
    title: ISLP Chapter 3 — linear regression
    format: book
    angle: A readable statistical account of simple/multiple regression and fit assessment; it adds interpretation
      and diagnostics beyond the deck's derivation-first treatment.
    covers:
    - knowledge-aml-l03-problem
    - knowledge-aml-l03-loss
    - knowledge-aml-l03-solution
    depth: intuition
    scope: complementary
    locator: §§3.1–3.3
