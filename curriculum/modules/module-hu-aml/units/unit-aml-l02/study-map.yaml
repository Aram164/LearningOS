- id: stage-03-biasvariance-over-underfitting
  title: Bias–variance & over/underfitting
  status: pending
  objective: Small k = high variance (overfit), large k = high bias (underfit); the U-shaped test error.
  done_when:
  - Explain and apply Bias–variance & over/underfitting without relying on the study map.
  exam_critical: false
  scope_triage: required-now
  resources:
  - kind: watch
    label: 🎥 **CS4780 — Bias/Variance Tradeoff** (playlist; [notes](http://www.cs.cornell.edu/courses/cs4780/2018fa/lectures/lecturenote12.html))
  - kind: read
    label: 📖 **ISLP** §2.2.2 "The Bias-Variance Trade-Off"
    source_id: source-islp
  - kind: read
    label: 📖 **ESL** (free PDF) §2.9 "Model Selection and the Bias–Variance Tradeoff" — optional depth
  - kind: read
    label: 📖 **Murphy PML1** — the "Bias-variance tradeoff" section (Ch 4, ERM/generalization) — optional
    source_id: source-murphy-pml1
  - kind: reference
    label: 🔗 StatQuest bias-variance single (embedded in the reference docs); Brandon Rohrer's regularization/bias-variance
      posts
    source_id: source-statquest
  - kind: read
    label: 🔗 **Scott Fortmann-Roe — "Understanding the Bias-Variance Tradeoff"** ⭐ — [link](https://scott.fortmann-roe.com/docs/BiasVariance.html)
      — the canonical essay, and it works the decomposition **through k-NN** (exactly §8 here).
  - kind: reference
    label: '🔗 **Pedro Domingos — "A Few Useful Things to Know About Machine Learning"** ⭐ (CACM 2012)
      — [pdf](https://homes.cs.washington.edu/~pedrod/papers/cacm12.pdf) — the famous overview: overfitting,
      bias–variance, the curse of dimensionality, "more data beats a cleverer algorithm." Read once across
      L02–L04.'
  - kind: read
    label: 📖 **CS229 Lecture Notes §8.1 "Bias-variance tradeoff"** — `…/Bücher/CS229 Lecture Notes.pdf`
      (p.105) — frames it through the **linear-vs-degree-5-polynomial** example and defines **bias = the
      test error you'd still have even with infinite training data**; §8.1.1 has the `Bias²+Var+σ²` decomposition.
      (No k-NN, but the concept is identical.)
    source_id: source-cs229-notes
  - kind: read
    label: 📝 Reference §8 — incl. §8.1.1 (decoding the slide wording) and **§8.1.2 (flexibility → variance
      → overfitting; variance = how much predictions move when you retrain on different samples)**
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-l02/stages/stage-03-biasvariance-over-underfitting/notes.md
  attachments: []
  source_feedback: []
  estimate_minutes: 60
