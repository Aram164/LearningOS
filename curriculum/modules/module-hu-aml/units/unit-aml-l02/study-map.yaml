    label: ISLP linear regression versus k-NN
    source_id: source-islp
    locator: islp.pdf §3.5 Comparison of Linear Regression with K-Nearest Neighbors, pdf pp. 120-124
    angle: Compares the parametric linear fit and flexible k-NN directly on the same prediction problem.
    angle_detail: 'This short comparison is the cleanest bridge from L02 to L03: the same prediction setting
      exposes where a rigid linear model or a flexible neighbourhood model wins. Use it to explain model
      assumptions, not as a source for implementation details, distance scaling, or validation procedure.'
    scope_triage: helpful-now
  - kind: read
    label: ISLP k-NN implementation lab
    source_id: source-islp
    locator: islp.pdf §4.7.6 K-Nearest Neighbors, pdf pp. 192-195
    angle: Turns the classifier into an executable lab and makes the decision rule observable in code.
    angle_detail: Run this lab when you want to see the classification rule operate on real data and compare
      predicted classes. Its value is executable feedback rather than additional theory; the lab's Python
      workflow is complementary and may not match the lecturer's exact variable names or exam presentation.
    scope_triage: helpful-now
  - kind: read
    label: 'ESL flexibility spectrum: least squares to k-NN'
    source_id: source-esl
