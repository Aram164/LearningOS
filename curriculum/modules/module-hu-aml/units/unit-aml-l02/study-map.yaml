      Neighbors, pdf p. 35
    angle: Places least squares and k-NN on one flexibility axis, making the L02-to-L03 bridge explicit.
    angle_detail: Read this when the apparent opposition between parametric regression and instance-based
      prediction is still fuzzy. ESL uses the two methods as endpoints of a flexibility spectrum and makes
      their inductive assumptions comparable; it is mathematical context, not an implementation recipe
      or the 2026 lecturer's scope authority.
    scope_triage: helpful-now
