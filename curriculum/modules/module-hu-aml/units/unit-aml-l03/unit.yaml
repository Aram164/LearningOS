id: unit-aml-l03
type: unit
module_id: module-hu-aml
kind: lecture
title: AML Lecture 03 — Linear Regression
order: 3
scope: Current 2026 L03 deck; regression with one predictor, hypothesis and parameter notation, residuals
  and mean-squared error, the closed-form optimum, differentiation, linear-algebra refreshers, vectorization,
  and the design-matrix representation.
status: ready
knowledge_map:
  summary: The lecture develops the complete one-variable least-squares model and then rewrites it in
    vector/matrix language so the same machinery scales to later lectures.
  nodes:
  - id: knowledge-aml-l03-problem
    title: Regression problem and hypothesis
    summary: Real-valued targets, a line parameterized by intercept and slope, predictions, and residuals.
  - id: knowledge-aml-l03-loss
    title: Mean-squared-error objective
    summary: Squared residuals, averaging conventions, differentiability, and what minimizing MSE means
      geometrically.
    builds_on:
    - knowledge-aml-l03-problem
  - id: knowledge-aml-l03-solution
    title: Closed-form least-squares solution
    summary: Partial derivatives set to zero, the optimal slope/intercept formulas, and their assumptions.
    builds_on:
    - knowledge-aml-l03-loss
  - id: knowledge-aml-l03-linear-algebra
    title: Linear-algebra refresher
    summary: Vectors, transposes, dot products, matrix-vector/matrix-matrix products, shapes, and inverses.
  - id: knowledge-aml-l03-vectorization
    title: Vectorization and design matrix
    summary: Adding the intercept feature, stacking examples, and expressing prediction and loss as matrix
      operations.
    builds_on:
    - knowledge-aml-l03-problem
    - knowledge-aml-l03-linear-algebra
  - id: knowledge-aml-l03-probabilistic
    title: Probabilistic interpretation
    summary: Optional bridge showing why Gaussian noise plus maximum likelihood produces the squared-error
      objective.
    builds_on:
    - knowledge-aml-l03-loss
