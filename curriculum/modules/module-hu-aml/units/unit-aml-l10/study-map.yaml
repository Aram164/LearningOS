id: study-map-aml-l10
type: study-map
plan_template_version: 1
unit_id: unit-aml-l10
status: not-started
current_stage: stage-aml-l10-motivation
source_plan:
  path: curriculum/modules/module-hu-aml/source-map.yaml
  provenance: operator
detours: []
shelving:
  state: none
stages:
- id: stage-aml-l10-motivation
  number: 1
  title: Spatial structure and weight sharing
  status: pending
  objective: Why flattening images is inefficient and how locality, translation structure, and shared filters
    address it.
  done_when:
  - 'Reproduce without notes: Why flattening images is inefficient and how locality, translation structure, and
    shared filters address it.'
  exam_critical: true
  concepts:
  - concept-convolutional-networks
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L10 lecture deck
    source_id: source-aml-ss26-lectures
    locator: lecture-slides/VL 10-cnn.pdf
    vault_path: material://source-aml-ss26-lectures/lecture-slides/VL 10-cnn.pdf
    scope_triage: required-now
    angle: The 2026 scope authority for cross-correlation, filters, padding/stride/channel arithmetic, pooling,
      complete CNNs, and the LeNet-to-ResNet architecture lineage.
  - kind: read
    label: ISLP convolutional-neural-network section
    source_id: source-islp
    locator: §10.3, pp. 406–415
    scope_triage: helpful-now
    angle: A gentle full CNN pass through convolutional layers, pooling, architecture, and data augmentation;
      ideal before deeper shape and architecture references.
  - kind: reference
    label: ESL early weight-sharing example
    source_id: source-esl
    locator: §11.7
    scope_triage: reference-only
    angle: LeCun ZIP-code networks show the historical origin of local connectivity and weight sharing, but ESL
      has no modern full CNN treatment.
  - kind: read
    label: Murphy convolution and classic CNN architectures
    source_id: source-murphy-pml1
    locator: §§14.1–14.3
    scope_triage: helpful-now
    angle: 'The deepest aligned book source: exact output arithmetic plus one-to-one LeNet, AlexNet, GoogLeNet,
      and ResNet coverage.'
  - kind: reference
    label: CS229 convolutional-network overview
    source_id: source-cs229-notes
    locator: CNN overview selections
    scope_triage: helpful-now
    angle: A broad neural-network reference only; use CS231n or Murphy for exact convolution arithmetic and architecture
      depth.
  - kind: watch
    label: CS229 CNN segments
    source_id: source-cs229-2022-videos
    locator: CNN overview segments
    scope_triage: helpful-now
    angle: Broad deep-learning context only; use the course deck, EECS 498, or CS231n for detailed CNN arithmetic.
  - kind: watch
    label: StatQuest convolutional-network intuition
    source_id: source-statquest
    locator: CNN explainer selections
    scope_triage: helpful-now
    angle: Short visual intuition for filters, feature maps, and CNN structure; not a substitute for hand shape
      arithmetic.
  - kind: read
    label: Géron 3rd ed. Ch 14 — why not simply flatten the image
    source_id: source-geron-handson
    locator: geron-copy2.pdf (3rd ed.) Ch 14 'The Architecture of the Visual Cortex' pdf p. 620, 'Convolutional
      Layers' pdf p. 621
    scope_triage: helpful-now
    angle: Answers the deck's opening question from the visual-cortex analogy and then in parameter counts, which
      is the argument the motivation slide compresses to one line.
  - kind: read
    label: Géron 3rd ed. Ch 14 exercises — the motivation asked back
    source_id: source-geron-handson
    locator: geron-copy2.pdf (3rd ed.) Ch 14 Exercises pdf p. 694 (Q1 CNN versus fully connected DNN, Q2 three
      3×3 stride-2 'same' convolutional layers)
    scope_triage: helpful-now
    angle: Q1 asks for the CNN-versus-dense argument in your own words and Q2 is a three-layer 3×3 stride-2 'same'
      shape and parameter count; the only local drill that tests the motivation node rather than the arithmetic
      alone.
  - kind: reference
    label: Deep Learning book Ch 9 — convolutional networks
    source_id: source-goodfellow-dl
    locator: Ch 9 Convolutional Networks
    scope_triage: reference-only
    angle: The canonical conceptual treatment of convolution, sparse interactions, parameter sharing, equivariance,
      pooling, and CNN variants.
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-l10/stages/stage-aml-l10-motivation/notes.md
  attachments: []
  source_feedback: []
