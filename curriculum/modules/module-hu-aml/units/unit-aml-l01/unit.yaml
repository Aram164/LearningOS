id: unit-aml-l01
type: unit
module_id: module-hu-aml
kind: lecture
title: AML Lecture 01 — Introduction & ML Problem Formulation
order: 1
scope: Current 2026 L01 deck; ML definitions and course orientation, historical milestones as a concept
  map, datasets/features/labels, learning tasks, train/test reasoning, MNIST/Iris examples, and the linear-algebra/tooling
  prerequisite shelf.
status: ready
knowledge_map:
  summary: The lecture moves from the historical motivation for machine learning to the vocabulary needed
    to formulate a learning problem, then identifies the mathematical and tooling prerequisites used later.
  nodes:
  - id: knowledge-aml-l01-history
    title: Historical concept map
    summary: Perceptrons, XOR, backpropagation, CNNs, LSTMs, and Transformers as landmarks that explain
      why later model families exist rather than as a chronology to memorize.
  - id: knowledge-aml-l01-formulation
    title: Learning-problem formulation
    summary: Examples, features, labels, hypotheses, learning algorithms, losses, and the distinction
      between classification, regression, supervised, and unsupervised learning.
  - id: knowledge-aml-l01-data
    title: Data representation
    summary: Datasets as matrices and vectors, illustrated through MNIST, Iris, and embeddings.
    builds_on:
    - knowledge-aml-l01-formulation
  - id: knowledge-aml-l01-generalization
    title: Generalization and evaluation
    summary: Why training performance is not evidence of future performance and why train/test separation
      belongs in the problem definition.
    builds_on:
    - knowledge-aml-l01-formulation
    - knowledge-aml-l01-data
  - id: knowledge-aml-l01-prerequisites
    title: Mathematical and tooling prerequisites
    summary: Vectors, matrices, dot products, shapes, derivatives, Python, NumPy, and notebooks as the
      working language assumed by later lectures.
