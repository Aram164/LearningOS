  - kind: read
    label: ISLP Chapter 2 — statistical learning
    source_id: source-islp
    locator: Chapter 2, especially §§2.1–2.2 — A gentle, example-driven explanation of prediction, inference,
      supervised/unsupervised tasks, model flexibility, train/test error, and the vocabulary behind problem
      formulation.
    scope_triage: helpful-now
  - kind: read
    label: Kroese ML workflow framing
    source_id: source-kroese-dsml
    locator: Introductory ML and evaluation selections — An independent data-science view of models, data,
      evaluation, and workflow; useful as a terminology cross-check.
    scope_triage: helpful-now
  - kind: read
    label: MIT 6.036 introduction and representations
    source_id: source-mit-6036
    locator: Introduction and representations units — A structured independent course entry with representations,
      task families, overfitting, and generalization checks.
    scope_triage: helpful-now
  - kind: read
    label: Rohrer model workflow and data splitting
    source_id: source-rohrer-e2eml
    locator: Chapters 3–4 — Calm long-form intuition for choosing a loss, splitting data, and seeing ML
      as an end-to-end workflow.
    scope_triage: helpful-now
  - kind: read
    label: Géron end-to-end ML project overview
    source_id: source-geron-handson
    locator: Chapter 2 selected workflow sections — An applied workflow view of framing, data preparation,
      training, evaluation, and iteration; useful for seeing the introductory vocabulary in practice.
    scope_triage: helpful-now
  - kind: read
    label: Caltech Learning From Data orientation problems
    source_id: source-caltech-lfd
    locator: Introductory homework selections — Solved learning-theory problems that sharpen hypotheses,
      generalization, and the distinction between fitting and learning.
    scope_triage: helpful-now
  - kind: read
    label: Kelleher et al. — predictive-analytics framing
    source_id: source-kelleher-fmlpda
    locator: Introductory chapters — An introductory, worked-example view of learning problems and the
      families of predictive models; useful when the lecture overview feels too compressed.
    vault_path: material://source-kelleher-fmlpda/kelleher.pdf
    scope_triage: helpful-now
  - kind: read
    label: Domingos — high-level map of machine learning
    source_id: source-domingos-useful-things
    locator: Entire essay — A concise practitioner essay on representation, data, generalization, evaluation,
      and the difference between fitting and learning.
    scope_triage: helpful-now
  - kind: read
    label: SaD L11 — data-science workflow and evaluation bridge
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/L11 — Data science intro (especially slides 23–38) — The neighbouring HU course
      supplies the practical train/test, loss, metrics, pipeline, inductive-bias, and bias-variance frame
      assumed by AML.
    scope_triage: helpful-now
