- id: stage-aml-l01-history
  number: 1
  title: Historical concept map
  status: pending
  objective: Perceptrons, XOR, backpropagation, CNNs, LSTMs, and Transformers as landmarks that explain
    why later model families exist rather than as a chronology to memorize.
  done_when:
  - 'Reproduce without notes: Perceptrons, XOR, backpropagation, CNNs, LSTMs, and Transformers as landmarks
    that explain why later model families exist rather than as a chronology to memorize.'
  exam_critical: true
  concepts:
  - concept-backpropagation
  - concept-convolutional-networks
  - concept-perceptron
  - concept-recurrent-networks
  - concept-transformer
  - concept-xor-problem
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L01 lecture deck
    source_id: source-aml-ss26-lectures
    locator: lecture-slides/VL 01-Introduction.pdf — The scope authority for 2026. It introduces the historical
      concept map, ML definitions, learning tasks, dataset notation, course expectations, and the examples
      the lecturer can examine.
    vault_path: material://source-aml-ss26-lectures/lecture-slides/VL 01-Introduction.pdf
    scope_triage: required-now
  - kind: reference
    label: Older L01 lecture variant
    source_id: source-aml-ss26-lectures
    locator: older-lecture-slides/01-Introduction_2da1f48f12009c6454c7265ad76c6a19.pdf — A prior-year
      version useful only for alternate examples or explanations omitted from the current deck.
    vault_path: material://source-aml-ss26-lectures/older-lecture-slides/01-Introduction_2da1f48f12009c6454c7265ad76c6a19.pdf
    scope_triage: reference-only
  - kind: watch
    label: 3Blue1Brown — What is a neural network?
    source_id: source-3b1b-neural-networks
    locator: Video 1 — A visual preview that makes the later neural-network milestones concrete; it is
      not a substitute for the L01 history or formulation sections.
    scope_triage: helpful-now
  - kind: read
    label: Géron 3rd ed. Ch 10 — from biological to artificial neurons
    source_id: source-geron-handson
    locator: geron-copy2.pdf (3rd ed., Oct 2022) Ch 10 'From Biological to Artificial Neurons' pdf pp.
      380–389, 'The Perceptron' pdf p. 384 — Retells the deck's landmark chain — perceptron, the XOR objection,
      backpropagation, the winters — as one causal story, which is what a concept map is for; not a chronology
      to memorize.
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-l01/stages/stage-aml-l01-history/notes.md
  attachments: []
  source_feedback: []
