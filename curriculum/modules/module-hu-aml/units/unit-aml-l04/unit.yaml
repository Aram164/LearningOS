id: unit-aml-l04
type: unit
module_id: module-hu-aml
kind: lecture
title: AML Lecture 04 — Non-linear Regression
order: 4
scope: Current 2026 L04 deck; multivariate regression, design matrices and the normal equation, polynomial
  basis expansion, overfitting and model complexity, cross-validation, Ridge/L2 and Lasso/L1 regularization,
  closed-form Ridge, and shrinkage/sparsity geometry.
status: not-started
knowledge_map:
  summary: The lecture generalizes linear regression across variables and nonlinear feature maps, then
    controls the resulting flexibility with validation and regularization.
  nodes:
  - id: knowledge-aml-l04-multivariate
    title: Multivariate linear regression
    summary: Multiple predictors, augmented design matrices, vectorized prediction, gradients, and dimensions.
  - id: knowledge-aml-l04-normal-equation
    title: Normal equation
    summary: The matrix closed form, invertibility and singularity, and when direct solution differs from iterative optimization.
    builds_on:
    - knowledge-aml-l04-multivariate
  - id: knowledge-aml-l04-basis
    title: Polynomial basis expansion
    summary: Nonlinear functions learned by transforming inputs while retaining a model linear in its parameters.
    builds_on:
    - knowledge-aml-l04-multivariate
  - id: knowledge-aml-l04-overfitting
    title: Complexity and overfitting
    summary: Flexible polynomial features, train/test behaviour, bias-variance, and validation-based model choice.
    builds_on:
    - knowledge-aml-l04-basis
  - id: knowledge-aml-l04-ridge
    title: Ridge and L2 regularization
    summary: Penalized MSE, lambda, coefficient shrinkage, intercept treatment, and the closed-form Ridge solution.
    builds_on:
    - knowledge-aml-l04-overfitting
  - id: knowledge-aml-l04-lasso
    title: Lasso and L1 regularization
    summary: L1 geometry, sparse coefficients, feature selection behaviour, and comparison with Ridge.
    builds_on:
    - knowledge-aml-l04-overfitting
