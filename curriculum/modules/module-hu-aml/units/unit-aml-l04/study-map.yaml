- id: stage-01-multivariate-regression-the-normal-equation
  title: Multivariate regression & the normal equation
  status: pending
  objective: 'Many features at once: `h_𝐰(x) = w₁x₁ + … + wₙxₙ + w₀ = 𝐰·𝐱` (a hyper-plane); the **closed-form**
    solution `𝐰 = (XᵀX)⁻¹Xᵀ𝐲`, when `XᵀX` is singular, and `pinv`.'
  done_when:
  - Explain and apply Multivariate regression & the normal equation without relying on the study map.
  exam_critical: true
  scope_triage: required-now
  resources:
  - kind: watch
    label: 🎥 **Andrew Ng — "Linear Regression with multiple variables"** (Lecture 02-01 — *the video you
      linked*, [watch](https://www.youtube.com/watch?v=ViTUqw8kXPQ&list=PLiPvV5TNogxIS4bHQVW4pMkj4CHA8COdX&index=4))
      → then **"Normal Equation"** and **"Normal Equation Noninvertibility"** (same 02-xx section). These
      are the *core* L04 videos — the one you found is the right starting point.
  - kind: reference
    label: 🔗 **Eli Bendersky — "Derivation of the Normal Equation"** ⭐ — [link](https://eli.thegreenplace.net/2014/derivation-of-the-normal-equation-for-linear-regression/)
      — derives `𝐰 = (XᵀX)⁻¹Xᵀ𝐲` in *exactly* Ng's notation; fills the proof AML leaves out.
  - kind: read
    label: 📖 **ISLP §3.2 "Multiple Linear Regression"** — readable now (you did Ch 3 for L03). · **Toronto
      CSC411 Ch 2** (concise).
    source_id: source-islp
  - kind: read
    label: 📝 Reference §1–§5 (multivariate, gradient, normal equation, singular `XᵀX`, NE vs GD).
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-l04/stages/stage-01-multivariate-regression-the-normal-equation/notes.md
  attachments: []
  source_feedback: []
  estimate_minutes: 90
- id: stage-02-non-linear-polynomial-regression
  title: Non-linear / polynomial regression
  status: pending
  objective: 'Going non-linear by **adding computed/polynomial features** (x → x, x², x³, …) to a linear
    model — **a curve in x is a straight line in feature space, so it''s still ordinary linear regression**
    (same loss, same normal equation; you only widen `X`). *AML stops here: no splines, GAMs, or local
    regression.*'
  done_when:
  - Explain and apply Non-linear / polynomial regression without relying on the study map.
  exam_critical: true
  scope_triage: required-now
  resources:
  - kind: watch
    label: 🎥 **Andrew Ng — "Features and Polynomial Regression"** ⭐ (a course we *already have* — [Coursera
      ML playlist](https://www.youtube.com/playlist?list=PLiPvV5TNogxIS4bHQVW4pMkj4CHA8COdX), Week 2)
      — the canonical, gentle "just add x² as a feature" walkthrough; the most on-point video for this
      topic.
  - kind: read
    label: 📖 **MIT 6.036 (AML spine) — the *Features* unit** (Lecture 3) covers feature transformations
      incl. **polynomial features** and the overfitting they cause, with auto-graded exercises — [course](https://openlearninglibrary.mit.edu/courses/course-v1:MITx+6.036+1T2019/course/).
  - kind: reference
    label: '🔗 **scikit-learn — "Underfitting vs. Overfitting"** ⭐ — [interactive demo](https://scikit-learn.org/stable/auto_examples/model_selection/plot_underfitting_overfitting.html)
      — **the single best *visual* for polynomial regression**: degree 1 (underfit) → 4 (just right) →
      15 (wild overfit), with runnable code. *(Reused in Step 3.)*'
  - kind: read
    label: 📖 **ISLP §7.1 Polynomial Regression (p.290) — *this section only.*** Light extension of Ch
      3. **Skip §7.3 Basis Functions / §7.4 Splines (beyond L04).**
    source_id: source-islp
  - kind: read
    label: 📖 **Toronto CSC411 §3 "Nonlinear Regression"** — best-scoped book match.
    source_id: source-csc411-notes
  - kind: read
    label: 📕 *Skip for now:* **ESL Ch 5** is graduate-level (splines/wavelets) — well beyond L04.
  - kind: read
    label: 📝 Reference §6–§8.
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-l04/stages/stage-02-non-linear-polynomial-regression/notes.md
  attachments: []
  source_feedback: []
  estimate_minutes: 60
- id: stage-03-overfitting-biasvariance
  title: Overfitting & bias–variance
  status: pending
  objective: '*(Comes before regularization — regularization is the **fix** for the overfitting you see
    here.)* More features always lower *train* error; the *test* error is U-shaped in model flexibility
    / polynomial degree.'
  done_when:
  - Explain and apply Overfitting & bias–variance without relying on the study map.
  exam_critical: true
  scope_triage: required-now
  resources:
  - kind: practise
    label: 🔗 **scikit-learn — "Underfitting vs. Overfitting"** ⭐ — [interactive example](https://scikit-learn.org/stable/auto_examples/model_selection/plot_underfitting_overfitting.html)
      — polynomial degree 1 / 4 / 15 with train vs test curves and code. Directly previews the Übungsblatt
      2 task.
  - kind: read
    label: 📖 **ISLP §2.2.2 "The Bias-Variance Trade-Off"** — you already read it for L02; re-skim through
      the *polynomial-degree* lens.
    source_id: source-islp
  - kind: reference
    label: 🔗 **Pedro Domingos — "A Few Useful Things to Know About Machine Learning"** ⭐ — [pdf](https://homes.cs.washington.edu/~pedrod/papers/cacm12.pdf)
      — its "overfitting has many faces" and "more data beats a cleverer algorithm" sections are the perfect
      L04 framing (if you read it for L02, just re-read those two parts).
  - kind: read
    label: 📝 Cross-link `lect02 KNN-classifier/AML_L02_Ultimate_Reference.md` §8 (incl. §8.1.1); Reference
      §9–§10.
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-l04/stages/stage-03-overfitting-biasvariance/notes.md
