- id: stage-04-regularization-ridge-lasso
  title: 'Regularization: Ridge & Lasso'
  status: pending
  objective: Penalizing weight size (L2 = Ridge `λΣwⱼ²`, L1 = Lasso `λΣ|wⱼ|`) to control overfitting;
    the λ knob; never penalize `w₀`. **The intuition:** a wiggly overfit curve needs *big* weights to
    make sharp turns; penalizing weight size forces a *smoother* curve. Ridge shrinks all weights; Lasso
    zeros some out. *(Reference §11–§14 has the through-line + both the geometric and the gradient "why
    L1 zeros weights".)*
  done_when:
  - 'Explain and apply Regularization: Ridge & Lasso without relying on the study map.'
  exam_critical: true
  scope_triage: required-now
  resources:
  - kind: watch
    label: '🎥 **StatQuest — the regularization trilogy** ⭐⭐ (watch in order — this is the intuition the
      slides skip):'
    source_id: source-statquest
  - kind: reference
    label: '[*Regularization Part 1: Ridge (L2)*](https://www.youtube.com/watch?v=Q81RR3yKn30) — shrink
      the slope to **desensitize** the fit.'
  - kind: reference
    label: '[*Regularization Part 2: Lasso (L1)*](https://www.youtube.com/watch?v=NGf0voTMlcs) — same
      idea, but it can drive a weight **to exactly 0**.'
  - kind: read
    label: '[*Ridge vs Lasso, Visualized!!!*](https://www.youtube.com/watch?v=Xm2C_gTAl8c) — animates
      the **diamond-vs-circle** (Reference §14).'
  - kind: watch
    label: '🎥 **Andrew Ng — Coursera ML, the full regularization set** ⭐ (a course we *already have*,
      and the most on-point): **"The Problem of Overfitting" → "Cost Function" (the regularized cost)
      → "Regularized Linear Regression" → "Regularized Logistic Regression"** — Week 3 of the [playlist](https://www.youtube.com/playlist?list=PLiPvV5TNogxIS4bHQVW4pMkj4CHA8COdX).
      The gentlest, exactly AML''s level.'
  - kind: watch
    label: 🎥 **Stanford CS229 2022 (AML spine) — Lecture 10 "Bias-Variance & Regularization"** ([playlist](https://www.youtube.com/playlist?list=PLoROMvodv4rNyWOpJg_Yh4NSqI4Z4vOYy))
      — the rigorous version; frames **Ridge = MAP**. Heavier than Ng.
    source_id: source-cs229-notes
  - kind: read
    label: 📖 **MIT 6.036 (AML spine) — the *Regression* chapter** derives **ridge regression** (`J_ridge
      = MSE + λ‖θ‖²`) with auto-graded exercises — [course](https://openlearninglibrary.mit.edu/courses/course-v1:MITx+6.036+1T2019/course/)
      · [notes](https://introml.mit.edu/notes/regression.html).
  - kind: read
    label: 🔗 **Brandon Rohrer Ch 18 — Regularization** ⭐ — [link](https://brandonrohrer.com/regularization.html)
      (the index tags this *to L04*).
  - kind: read
    label: 🔗 **scikit-learn user guide §1.1.2 Ridge / §1.1.3 Lasso** — [Linear Models](https://scikit-learn.org/stable/modules/linear_model.html)
      — authoritative, free, the math + the `+λI` closed form.
  - kind: read
    label: 📖 **ISLP §6.2.1 Ridge + §6.2.2 Lasso (p.240)** — matches AML exactly. *(Skip §6.1 subset selection.)*
      · **Toronto CSC411 §3.2** (p.11).
    source_id: source-islp
  - kind: watch
    label: '📖 **CS229 Lecture Notes §9.1 "Regularization"** ⭐ (p.125) — **the cleanest L04 treatment**:
      the regularized loss `Jλ = J + λR(θ)`, **L2 = weight decay** (with the `θ ← (1−λη)θ − η∇J` gradient
      derivation — *why* the weights shrink), and **L1 = ‖θ‖₁ = Lasso/sparsity**. Companion to your video
      spine. *(Feature-maps view of polynomial features: §5.1–5.2.)*'
    source_id: source-cs229-notes
  - kind: read
    label: 📕 *Optional depth:* **ESL §3.4 Shrinkage** (rigorous) · **Murphy PML1** ridge (in Ch 11, dense).
    source_id: source-murphy-pml1
  - kind: read
    label: 📝 Reference §11–§15 (Ridge, Lasso, L1/L2 geometry, Lₚ norms).
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-l04/stages/stage-04-regularization-ridge-lasso/notes.md
  attachments: []
  source_feedback: []
  estimate_minutes: 90
