- id: stage-01-the-gradient-the-gd-algorithm
  title: The gradient & the GD algorithm
  status: pending
  objective: Local search (step opposite the derivative); the **gradient** = vector of partials; `𝐰 ←
    𝐰 − α∇L(𝐰)`. The vectorized gradient `∇L = (1/m)Xᵀ(h_𝐰(X) − 𝐲)` is the **same** for linear (`h=X𝐰`)
    and logistic (`h=σ(X𝐰)`).
  done_when:
  - Explain and apply The gradient & the GD algorithm without relying on the study map.
  exam_critical: false
  scope_triage: required-now
  resources:
  - kind: watch
    label: 🎥 **Andrew Ng — "Gradient Descent" → "Gradient Descent Intuition" → "Gradient Descent For Linear
      Regression"** (Week 1).
  - kind: watch
    label: '🎥 **CS4780 #16 — Gradient Descent** — https://www.youtube.com/watch?v=o6FfdP2uYh4 · 📝 [written
      notes](http://www.cs.cornell.edu/courses/cs4780/2018fa/lectures/lecturenote07.html).'
  - kind: watch
    label: '🎥 **3B1B — Neural Networks #2** "Gradient descent, how networks learn" ([playlist](https://www.youtube.com/playlist?list=PLZHQObOWTQDNU6R1_67000Dx_ZCJB-3pi)).'
    source_id: source-3b1b-linear-algebra
  - kind: reference
    label: '🔗 **Stanford CS231n — "Optimization: Stochastic Gradient Descent"** ⭐ — [notes](https://cs231n.github.io/optimization-1/)
      — the "walking downhill blindfolded" framing, the gradient as the slope, step-size effects, and
      SGD; course-quality and free.'
  - kind: watch
    label: '📖 **CS229 Lecture Notes §1.1 "LMS algorithm"** ⭐ — `…/Bücher/CS229 Lecture Notes.pdf` (p.9)
      — **the written companion to your CS229 video spine**: derives **batch GD**, the LMS update `θ :=
      θ + α(y − hθ(x))·x` (magnitude ∝ error), and **stochastic gradient descent**, in the lectures''
      exact notation. The best book match for L06.'
    source_id: source-cs229-notes
  - kind: read
    label: '📖 **Murphy PML1 Ch 8 §8.1–8.3** (Optimization: local/global, convex, smooth) — `…/Bücher/probabilistic
      ML.pdf` · **MML Ch 7** ([free](https://mml-book.github.io/)) · **Toronto CSC411 "Gradient Descent"**.'
  - kind: read
    label: 📝 Reference §1–§7.
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-l06/stages/stage-01-the-gradient-the-gd-algorithm/notes.md
  attachments: []
  source_feedback: []
  estimate_minutes: 60
- id: stage-02-convexity-the-learning-rate
  title: Convexity & the learning rate
  status: pending
  objective: Convex loss → one global optimum (linear & logistic both convex); `α` too large → overshoot/diverge,
    too small → slow; **monitor the loss curve over epochs**.
  done_when:
  - Explain and apply Convexity & the learning rate without relying on the study map.
