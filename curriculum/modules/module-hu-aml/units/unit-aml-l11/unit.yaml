id: unit-aml-l11
type: unit
module_id: module-hu-aml
kind: lecture
title: AML Lecture 11 — Transformers
order: 11
scope: Current 2026 L11 deck; words and tokens, static and contextual embeddings, language-modelling motivation,
  simplified and Q/K/V multi-head attention, positional information, Transformer blocks with residual
  connections and layer normalization, cross-entropy training, and the bonus parallelization/causal-masking
  section. RNNs, GRUs and LSTMs are not in the 2026 lecture.
status: ready
knowledge_map:
  summary: The lecture starts from next-token prediction, turns tokens into contextual representations
    through attention, assembles the Transformer block, and returns to language-model training with the
    same cross-entropy objective introduced in L05.
  nodes:
  - id: knowledge-aml-l11-language-task
    title: Language modelling as next-token prediction
    summary: A sequence probability is factorized into conditional next-token probabilities; the model
      predicts a distribution over the vocabulary at each position.
  - id: knowledge-aml-l11-tokenization
    title: Words, tokens, types, and instances
    summary: Text is converted into token identities; vocabulary, token instances, sequence length and
      subword choices determine the model's discrete input representation.
    builds_on:
    - knowledge-aml-l11-language-task
  - id: knowledge-aml-l11-embeddings
    title: Static and contextual embeddings
    summary: Embedding lookup maps token identities to vectors, while contextual embeddings let the same
      token acquire a different representation from surrounding tokens.
    builds_on:
    - knowledge-aml-l11-tokenization
  - id: knowledge-aml-l11-attention
    title: Simplified self-attention
    summary: Dot-product similarities become softmax weights whose weighted sum mixes token representations;
      the deck's first worked example deliberately omits learned Q/K/V projections.
    builds_on:
    - knowledge-aml-l11-embeddings
  - id: knowledge-aml-l11-qkv
    title: Queries, keys, values, and multi-head attention
    summary: Learned projections create queries, keys and values; scaled dot products produce attention
      weights, and multiple heads learn different interaction patterns.
    builds_on:
    - knowledge-aml-l11-attention
  - id: knowledge-aml-l11-position
    title: Positional information
    summary: Because attention itself is permutation-insensitive, positional representations inject order
      before tokens enter the block.
    builds_on:
    - knowledge-aml-l11-embeddings
  - id: knowledge-aml-l11-block
    title: Transformer block
    summary: Multi-head attention and a position-wise feedforward network are wrapped with residual connections
      and layer normalization; shapes and information flow connect back to L08-L10.
    builds_on:
    - knowledge-aml-l11-qkv
    - knowledge-aml-l11-position
  - id: knowledge-aml-l11-training
    title: Language-model outputs and cross-entropy training
    summary: Block outputs become vocabulary logits and softmax probabilities, and cross-entropy trains
      the model to predict the observed next token.
    builds_on:
    - knowledge-aml-l11-block
    - knowledge-aml-l11-language-task
  - id: knowledge-aml-l11-parallelization
    title: 'Bonus: matrix attention and causal masking'
    summary: The bonus section expresses attention as a matrix operation, scales by the key dimension
      and masks future positions; it is retained as learn-anyway safety material while exam scope remains
      ambiguous.
    builds_on:
    - knowledge-aml-l11-qkv
    - knowledge-aml-l11-training
