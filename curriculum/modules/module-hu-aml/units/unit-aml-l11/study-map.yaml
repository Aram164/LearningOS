- id: stage-aml-l11-language-task
  number: 1
  title: Language modelling as next-token prediction
  status: pending
  objective: A sequence probability is factorized into conditional next-token probabilities; the model
    predicts a distribution over the vocabulary at each position.
  done_when:
  - 'Reproduce without notes: A sequence probability is factorized into conditional next-token probabilities;
    the model predicts a distribution over the vocabulary at each position.'
  exam_critical: true
  concepts:
  - concept-language-modelling
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L11 Transformers lecture deck
    source_id: source-aml-ss26-lectures
    locator: 'lecture-slides/VL 11-transformers.pdf (81 pages) — The 2026 scope authority: words and tokens,
      embeddings, contextual representations, simplified attention, Q/K/V multi-head attention, positional
      information, Transformer blocks, language modelling, and the bonus parallelization/masking section.'
    scope_triage: required-now
  - kind: reference
    label: Murphy §15.7 — language modelling as the training objective
    source_id: source-murphy-pml1
    locator: §15.7 Language models and unsupervised representation learning pp. 537–546 (non-generative
      models p. 538, generative causal LLMs p. 542) — Connects the block's outputs back to next-token
      prediction and the same cross-entropy introduced in L05; read for the objective, not for the LLM
      survey.
    scope_triage: reference-only
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-l11/stages/stage-aml-l11-language-task/notes.md
  attachments: []
  source_feedback: []
- id: stage-aml-l11-tokenization
  number: 2
  title: Words, tokens, types, and instances
  status: pending
  objective: Text is converted into token identities; vocabulary, token instances, sequence length and
    subword choices determine the model's discrete input representation.
  done_when:
  - 'Reproduce without notes: Text is converted into token identities; vocabulary, token instances, sequence
    length and subword choices determine the model''s discrete input representation.'
  exam_critical: true
  concepts: []
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L11 Transformers lecture deck
    source_id: source-aml-ss26-lectures
    locator: 'lecture-slides/VL 11-transformers.pdf (81 pages) — The 2026 scope authority: words and tokens,
      embeddings, contextual representations, simplified attention, Q/K/V multi-head attention, positional
      information, Transformer blocks, language modelling, and the bonus parallelization/masking section.'
    scope_triage: required-now
  - kind: read
    label: Géron 3rd ed. Ch 16 — tokens and the vocabulary, in code
    source_id: source-geron-handson
    locator: 'geron-copy2.pdf (3rd ed.) Ch 16 pdf pp. 750–762 (TextVectorization and the character vocabulary)
      — Builds the token vocabulary the deck assumes: text to ids to sequences, with the length and vocabulary
      choices made explicit. Character-level here; subword tokenizers are named in the footnotes, not
      taught.'
    scope_triage: helpful-now
  - kind: read
    label: Jurafsky & Martin Chapter 8 — Transformers
    source_id: source-jurafsky-slp3
    locator: Chapter 8 — Transformers (January 6, 2026 draft) — Expands the lecture's token, embedding,
      attention, multi-head, positional, block and language-model equations without switching model family
      or notation.
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-l11/stages/stage-aml-l11-tokenization/notes.md
  attachments: []
  source_feedback: []
- id: stage-aml-l11-embeddings
  number: 3
  title: Static and contextual embeddings
  status: pending
  objective: Embedding lookup maps token identities to vectors, while contextual embeddings let the same
    token acquire a different representation from surrounding tokens.
  done_when:
  - 'Reproduce without notes: Embedding lookup maps token identities to vectors, while contextual embeddings
    let the same token acquire a different representation from surrounding tokens.'
  exam_critical: true
  concepts: []
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L11 Transformers lecture deck
    source_id: source-aml-ss26-lectures
    locator: 'lecture-slides/VL 11-transformers.pdf (81 pages) — The 2026 scope authority: words and tokens,
      embeddings, contextual representations, simplified attention, Q/K/V multi-head attention, positional
      information, Transformer blocks, language modelling, and the bonus parallelization/masking section.'
    scope_triage: required-now
  - kind: read
    label: Murphy §20.5 — where static embeddings come from
    source_id: source-murphy-pml1
    locator: §20.5 Word embeddings pp. 705–712 (latent semantic analysis p. 705, word2vec p. 707, GloVe
      p. 710, word analogies p. 710) — The deck states that embedding lookup maps tokens to vectors; this
      section is how those vectors are learned, which is the contrast that makes 'contextual' mean something.
    scope_triage: helpful-now
  - kind: read
    label: Géron 3rd ed. Ch 16 — embeddings, static then contextual
    source_id: source-geron-handson
    locator: geron-copy2.pdf (3rd ed.) Ch 16 'Reusing Pretrained Embeddings and Language Models' pdf pp.
      763–769 — Shows the lookup table and then what changes when representations are produced by a pretrained
      model instead — the deck's static-versus-contextual distinction made executable.
    scope_triage: helpful-now
  - kind: read
    label: Jurafsky & Martin Chapter 8 — Transformers
    source_id: source-jurafsky-slp3
    locator: Chapter 8 — Transformers (January 6, 2026 draft) — Expands the lecture's token, embedding,
      attention, multi-head, positional, block and language-model equations without switching model family
      or notation.
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-l11/stages/stage-aml-l11-embeddings/notes.md
  attachments: []
  source_feedback: []
- id: stage-aml-l11-attention
  number: 4
  title: Simplified self-attention
  status: pending
  objective: Dot-product similarities become softmax weights whose weighted sum mixes token representations;
    the deck's first worked example deliberately omits learned Q/K/V projections.
  done_when:
  - 'Reproduce without notes: Dot-product similarities become softmax weights whose weighted sum mixes
    token representations; the deck''s first worked example deliberately omits learned Q/K/V projections.'
  exam_critical: true
  concepts:
  - concept-attention
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L11 Transformers lecture deck
    source_id: source-aml-ss26-lectures
    locator: 'lecture-slides/VL 11-transformers.pdf (81 pages) — The 2026 scope authority: words and tokens,
      embeddings, contextual representations, simplified attention, Q/K/V multi-head attention, positional
      information, Transformer blocks, language modelling, and the bonus parallelization/masking section.'
    scope_triage: required-now
  - kind: read
    label: Murphy §15.4 — attention as a soft dictionary lookup
    source_id: source-murphy-pml1
    locator: '§15.4 Attention pp. 518–525 (attention as soft dictionary lookup p. 519, parametric attention
      p. 521) — Gives the interpretation the deck''s first worked example leaves implicit: attention weights
      are a softmax over similarity scores, i.e. a differentiable dictionary lookup, before any learned
      projection appears.'
    scope_triage: helpful-now
  - kind: read
    label: Murphy §15.5 — the Transformer assembled step by step
    source_id: source-murphy-pml1
    locator: §15.5 Transformers pp. 526–532 (self-attention p. 526, multi-headed attention p. 527, positional
      encoding p. 528, putting it all together p. 529, comparing transformers, CNNs and RNNs p. 531) —
      Follows the deck's own order — self-attention, then Q/K/V and multiple heads, then positional encoding,
      then the assembled block — in equations, and closes with the comparison against CNNs and RNNs that
      the lecture only gestures at.
    scope_triage: helpful-now
  - kind: read
    label: Géron 3rd ed. Ch 16 — attention, then the original Transformer
    source_id: source-geron-handson
    locator: 'geron-copy2.pdf (3rd ed.) Ch 16 ''Attention Mechanisms'' pdf p. 772, ''Attention Is All
      You Need: The Original Transformer Architecture'' pdf p. 776, ''Positional encodings'' pdf pp. 779–780
      (Equation 16-2) — Walks the same path as the lecture and then writes a positional-encoding layer
      from scratch, including the sine/cosine equation the deck shows without deriving.'
    scope_triage: helpful-now
  - kind: read
    label: Géron 3rd ed. Ch 16 exercises 5 and 6
    source_id: source-geron-handson
    locator: 'geron-copy2.pdf (3rd ed.) Ch 16 Exercises pdf pp. 794–795, questions 5 and 6 — Two closed-book
      retrieval items on scope: what an attention mechanism is and how it helps, and which layer of the
      transformer matters most and why. Q8–Q9 are RNN coding tasks and are out of the 2026 scope.'
    scope_triage: helpful-now
  - kind: read
    label: D2L Chapter 11 — attention and transformers, with exercises
    source_id: source-d2l
    locator: '11.1 Queries, Keys, and Values; 11.3 Attention Scoring Functions; 11.5 Multi-Head Attention;
      11.6 Self-Attention and Positional Encoding; 11.7 The Transformer Architecture — each with an Exercises
      subsection. 11.4 Bahdanau attention is RNN-era and 11.8–11.9 (vision, large-scale pretraining) are
      outside the 2026 scope. Verified 2026-08-22. — The only source on the menu that puts a worked exercise
      set behind every L11 node: queries/keys/values, scoring functions, multi-head, self-attention with
      positional encoding, and the assembled architecture, each section ending in Exercises.'
    scope_triage: helpful-now
  - kind: read
    label: Jurafsky & Martin Chapter 8 — Transformers
    source_id: source-jurafsky-slp3
    locator: Chapter 8 — Transformers (January 6, 2026 draft) — Expands the lecture's token, embedding,
      attention, multi-head, positional, block and language-model equations without switching model family
      or notation.
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-l11/stages/stage-aml-l11-attention/notes.md
  attachments: []
  source_feedback: []
