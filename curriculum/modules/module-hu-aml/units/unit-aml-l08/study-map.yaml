- id: stage-aml-l08-xor-stacking
  number: 1
  title: XOR and layered representation
  status: pending
  objective: Hidden units build intermediate features so multiple linear boundaries compose into a nonlinear classifier.
  done_when:
  - 'Reproduce without notes: Hidden units build intermediate features so multiple linear boundaries compose into
    a nonlinear classifier.'
  - Work Bonusblatt 04 — neural-network tasks, then the remaining 1, and record every miss with the step it failed
    at.
  exam_critical: true
  concepts:
  - concept-neural-network
  - concept-xor-problem
  scope_triage: required-now
  resources:
