    label: Kelleher et al. Ch 7 — neural networks as error-based learning
    source_id: source-kelleher-fmlpda
    locator: Ch 7 Error-based Learning
    vault_path: material://source-kelleher-fmlpda/kelleher.pdf
    scope_triage: helpful-now
    angle: A gentle bridge from linear prediction to neurons, layered models, activations, and error surfaces
      using worked toy examples.
  - kind: read
    label: SaD L15 — perceptron-to-MLP bridge
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/L15 — Neural networks
    scope_triage: helpful-now
