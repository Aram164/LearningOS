    label: Deep Learning book Ch 6 — feedforward networks
    source_id: source-goodfellow-dl
    locator: Ch 6 Deep Feedforward Networks
    scope_triage: reference-only
    angle: The canonical theory reference for layered computation, hidden units, universal approximation, output
      units, and architecture design; deeper than the lecture.
  - kind: read
    label: D2L Chapters 5–6 — executable MLPs
    source_id: source-d2l
    locator: Chapters 5–6
    scope_triage: helpful-now
    angle: An interactive PyTorch route from perceptrons and multilayer networks to concise implementations, output
