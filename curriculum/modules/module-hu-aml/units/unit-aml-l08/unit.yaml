id: unit-aml-l08
type: unit
module_id: module-hu-aml
kind: lecture
title: AML Lecture 08 — Feedforward Neural Networks
order: 8
scope: Current 2026 L08 deck; XOR via stacking, feedforward computation and shapes, activations/expressiveness,
  regression/binary/multiclass/multilabel output layers, softmax, and accuracy/precision/recall/F1 with
  micro/macro/weighted averaging.
status: ready
knowledge_map:
  summary: The lecture shows how stacked affine transformations plus nonlinear activations overcome XOR,
    how to compute a complete forward pass, and how output layers and metrics change with the prediction
    task.
  nodes:
  - id: knowledge-aml-l08-xor-stacking
    title: XOR and layered representation
    summary: Hidden units build intermediate features so multiple linear boundaries compose into a nonlinear
      classifier.
  - id: knowledge-aml-l08-forward
    title: Forward propagation and shapes
    summary: Layer equations, weights, biases, activations, batch dimensions, parameter counts, and the
      shared worked example.
    builds_on:
    - knowledge-aml-l08-xor-stacking
  - id: knowledge-aml-l08-activations
    title: Activations and expressiveness
    summary: Why stacked linear layers collapse, and how sigmoid, tanh, ReLU, and related nonlinearities
      change capacity.
    builds_on:
    - knowledge-aml-l08-forward
  - id: knowledge-aml-l08-output
    title: Output layers by task
    summary: Identity outputs for regression, sigmoid for binary/multilabel prediction, and softmax for
      multiclass probabilities.
    builds_on:
    - knowledge-aml-l08-forward
  - id: knowledge-aml-l08-softmax
    title: Softmax and multiclass scores
    summary: Normalized exponentials, differentiable argmax intuition, probability interpretation, and
      class prediction.
    builds_on:
    - knowledge-aml-l08-output
  - id: knowledge-aml-l08-metrics
    title: Classification metrics
    summary: Confusion-matrix counts, accuracy, precision, recall, F1, and micro/macro/weighted multiclass
      averaging.
    builds_on:
    - knowledge-aml-l08-output
