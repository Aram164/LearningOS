- id: stage-aml-neural-transformer-loop
  number: 4
  title: AML.3 — L08→L09→L10→L11 full loop (6–13 September)
  status: pending
  objective: 'Work the unverified late-course arc in strict dependency order: forward pass, backpropagation,
    CNNs, then Transformers. The operator-drafted notes become evidence only through learner calculations
    and closed-book mocks.'
  done_when:
  - 'L08: compute a complete forward pass with shapes and parameter counts, choose correct output heads,
    and calculate binary and multiclass metrics.'
  - 'L09: backpropagate through the shared example, explain regularization and gradient pathologies, and
    verify one hand gradient against the deck''s PyTorch/autograd example.'
  - 'L10: compute convolution outputs, padding/stride/channel shapes and parameter counts, then distinguish
    the course-level contribution of LeNet, AlexNet, GoogLeNet and ResNet.'
  - 'L11: compute simplified and Q/K/V attention, trace the Transformer block, connect language-model
    cross-entropy to L05, and treat slides 73–81 as learn-anyway safety material.'
  - For each lecture, work the exercise bank and sit the 75-minute mock closed-book; use the unit material
    menu only for misses and record any source choice before use.
  exam_critical: true
  concepts:
  - concept-neural-network
  - concept-softmax
  - concept-backpropagation
  - concept-convolutional-networks
  - concept-residual-connection
  - concept-attention
  - concept-transformer
  scope_triage: required-now
