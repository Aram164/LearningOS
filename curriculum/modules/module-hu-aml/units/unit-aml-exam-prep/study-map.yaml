    locator: note-aml-l08-* through note-aml-l11-* (references, exercise banks and mock exams only)
    scope_triage: required-now
  - kind: practise
    label: Übung 09–11 — worked forward passes, backprop and CNN arithmetic
    source_id: source-aml-ss26-lectures
    locator: exercise-slides/Übung 09.pdf (feedforward), Übung 10.pdf (computation graphs and autodiff),
