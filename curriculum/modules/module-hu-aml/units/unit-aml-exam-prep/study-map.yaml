- id: stage-aml-calibration
  title: AML.0 — cold L01–L11 calibration (19–22 August)
  status: active
  objective: Before further reading, run a 120-minute closed-book diagnostic across all eleven announced
    topics and turn the result into an error ledger that decides full-pass, repair-only or cold-skip treatment
    for every later cluster.
  done_when:
  - Recall the L01 problem-formulation vocabulary for ten minutes, then attempt at least one representative
    unseen item from every L02–L11 mock without opening an answer key.
  - Classify every miss as definition, model-or-method choice, derivation, arithmetic-or-shape, interpretation,
    or time.
  - Mark L02–L04, L05–L07 and each of L08–L11 full-pass, repair-only or cold-skip from recorded evidence;
    a clean gate permits a recorded skip but is not called mastery.
  - Record the baseline score and the slowest three question types, then choose the first repair cluster.
  estimate_minutes: 120
  exam_critical: true
  concepts:
  - concept-logistic-regression
  - concept-gradient-descent
  - concept-perceptron
  - concept-neural-network
  - concept-backpropagation
  - concept-convolutional-networks
  - concept-transformer
  scope_triage: required-now
  resources:
  - kind: read
    label: Übung 10 slides 2–3 — exam rules and L01–L11 Themen list
    source_id: source-aml-ss26-lectures
    locator: exercise-slides/Übung 10.pdf, slides 2–3
    scope_triage: required-now
  - kind: practise
    label: Representative items from the ten per-lecture mocks
    locator: note-aml-l02-mock-exam through note-aml-l11-mock-exam; use unopened questions only
    scope_triage: required-now
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-exam-prep/stages/stage-aml-calibration/notes.md
  attachments: []
  source_feedback: []
- id: stage-aml-foundations-repair
  title: AML.1 — L02–L04 foundations repair (23–29 August)
  status: pending
  objective: Repair only the diagnosed k-NN, regression, vectorization, basis-expansion and regularization
    gaps; skip clean topics with the calibration evidence attached.
  done_when:
  - For every failed L02–L04 node, reproduce the relevant deck calculation or derivation and complete
    the matching exercise-bank items without notes.
  - Sit the 75-minute lecture mock for each cluster marked full-pass; use a shortened cold retest for
    repair-only clusters and record any justified skip.
  - Explain the model, objective, fitted parameters, validation choice and main failure mode for k-NN,
    linear regression, polynomial regression, Ridge and Lasso.
  - Move recurring formulas or decision rules—not whole explanations—to the A4-sheet ledger.
  estimate_minutes: 360
  exam_critical: true
  concepts:
  - concept-gradient-descent
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L02–L04 decks
    source_id: source-aml-ss26-lectures
    locator: VL 02-nearest-neighbor.pdf; VL 03-linear-regression.pdf; VL 04-non-linear-regression.pdf
    scope_triage: required-now
  - kind: practise
    label: L02 artifact set
    locator: note-aml-l02-knn-bias-variance; note-aml-l02-exercise-bank; note-aml-l02-mock-exam
    scope_triage: required-now
  - kind: practise
    label: L03–L04 artifact sets
    locator: note-aml-l03-linear-regression / exercise-bank / mock-exam; note-aml-l04-nonlinear-regression
      / exercise-bank / mock-exam
    scope_triage: required-now
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-exam-prep/stages/stage-aml-foundations-repair/notes.md
  attachments: []
  source_feedback: []
- id: stage-aml-linear-optimization-repair
  title: AML.2 — L05–L07 classification and optimization (30 August–5 September)
  status: pending
  objective: Make the logistic-loss derivation, optimizer mechanics, perceptron updates and kernel calculations
    executable on paper before entering the neural-network arc.
  done_when:
  - Derive binary cross-entropy from Bernoulli likelihood and write the vectorized logistic gradient from
    memory.
  - Trace batch, stochastic or mini-batch updates and explain learning-rate, scaling, convexity, Adam
    and Newton tradeoffs at the lecture's depth.
  - Run primal and dual perceptron updates, compute a Gram/kernel value and explain XOR, RBF bandwidth
    and one-vs-rest without importing SVM concepts.
  - Complete the evidence-routed banks and mocks for L05–L07, then update the error ledger and A4-sheet
    ledger.
  estimate_minutes: 420
  exam_critical: true
  concepts:
  - concept-logistic-regression
  - concept-cross-entropy
  - concept-gradient-descent
  - concept-perceptron
  - concept-kernel-trick
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L05–L07 decks and Übung 08
    source_id: source-aml-ss26-lectures
    locator: VL 05-logistic-regression.pdf through VL 07-linear-classifiers.pdf; exercise-slides/Übung
      08.pdf
    scope_triage: required-now
  - kind: practise
    label: L05–L07 reference, bank and mock sets
    locator: note-aml-l05-*; note-aml-l06-*; note-aml-l07-* (references, exercise banks and mock exams
      only)
    scope_triage: required-now
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-exam-prep/stages/stage-aml-linear-optimization-repair/notes.md
  attachments: []
  source_feedback: []
- id: stage-aml-neural-transformer-loop
  title: AML.3 — L08→L09→L10→L11 full loop (6–13 September)
  status: pending
  objective: 'Work the unverified late-course arc in strict dependency order: forward pass, backpropagation,
    CNNs, then Transformers. The operator-drafted notes become evidence only through learner calculations
    and closed-book mocks.'
  done_when:
  - 'L08: compute a complete forward pass with shapes and parameter counts, choose correct output heads,
    and calculate binary and multiclass metrics.'
  - 'L09: backpropagate through the shared example, explain regularization and gradient pathologies, and
    verify one hand gradient against the deck''s PyTorch/autograd example.'
  - 'L10: compute convolution outputs, padding/stride/channel shapes and parameter counts, then distinguish
    the course-level contribution of LeNet, AlexNet, GoogLeNet and ResNet.'
  - 'L11: compute simplified and Q/K/V attention, trace the Transformer block, connect language-model
    cross-entropy to L05, and treat slides 73–81 as learn-anyway safety material.'
  - For each lecture, work the exercise bank and sit the 75-minute mock closed-book; use the unit material
    menu only for misses and record any source choice before use.
  estimate_minutes: 900
  exam_critical: true
  concepts:
  - concept-neural-network
  - concept-softmax
  - concept-backpropagation
  - concept-convolutional-networks
  - concept-residual-connection
  - concept-attention
  - concept-transformer
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L08–L11 decks and Übung 09–11
    source_id: source-aml-ss26-lectures
    locator: VL 08-feedforward-neural-network.pdf through VL 11-transformers.pdf; Übung 09–11.pdf
    scope_triage: required-now
  - kind: practise
    label: L08–L11 reference, bank and mock sets
    locator: note-aml-l08-* through note-aml-l11-* (references, exercise banks and mock exams only)
    scope_triage: required-now
  - kind: reference
    label: Jurafsky Chapter 8 only if the L11 diagnostic remains red
    source_id: source-jurafsky-slp3
    locator: Chapter 8 — Transformers
    url: https://web.stanford.edu/~jurafsky/slp3/
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-exam-prep/stages/stage-aml-neural-transformer-loop/notes.md
  attachments: []
  source_feedback: []
