- id: stage-03-cross-entropy-loss-mle
  title: Cross-entropy loss & MLE
  status: pending
  objective: 'Why not MSE (non-convex); the loss from **maximum likelihood**: product of per-sample likelihoods
    → log → sum → negate → **binary cross-entropy** `L(𝐰)=−(1/m)Σ[y·ln h + (1−y)·ln(1−h)]`.'
  done_when:
  - Explain and apply Cross-entropy loss & MLE without relying on the study map.
  exam_critical: true
  scope_triage: required-now
  resources:
  - kind: watch
    label: 🎥 **Andrew Ng — "Cost Function"** (logistic) + **CS229 Lecture 3** (the MLE/GLM derivation,
      [playlist](https://www.youtube.com/playlist?list=PLoROMvodv4rMiGQp3WXShtMGgzqpfVfbU)).
    source_id: source-cs229-notes
  - kind: watch
    label: 🔗 **StatQuest** — *Logistic Regression* + *Maximum Likelihood* singles ([video index](https://statquest.org/video-index/))
      — clearest log-loss intuition.
    source_id: source-statquest
  - kind: read
    label: 🔗 **scikit-learn user guide §1.1.11 Logistic regression** — [link](https://scikit-learn.org/stable/modules/linear_model.html#logistic-regression)
      — authoritative, free.
  - kind: read
    label: 📖 **ISLP §4.3.2** (estimating the coefficients — MLE) · **Murphy PML1 §10.2.3** (MLE, dense,
      optional) · *optional depth:* **ESL §4.4**.
  - kind: watch
    label: 📖 **CS229 Lecture Notes §2.1 (logistic regression) + §3.2.2 (logistic via GLM)** (p.20, p.30)
      — the sigmoid + the log-likelihood gradient `(y − hθ(x))·x` (same "signed-error × feature" skeleton
      as L03), and the **GLM derivation of *why* the sigmoid is the right function**; §2.3 adds Newton's
      method. The written companion to the **CS229 Lecture 3** video above.
    source_id: source-cs229-notes
  - kind: read
    label: 📝 Reference §11–§14.
  working_note: curriculum/modules/module-hu-aml/units/unit-aml-l05/stages/stage-03-cross-entropy-loss-mle/notes.md
