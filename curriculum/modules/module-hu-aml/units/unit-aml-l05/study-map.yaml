- id: stage-04-the-gradient-convexity-regularization
  title: The gradient, convexity & regularization
  status: pending
  objective: '`∂L/∂wⱼ = (1/m)Σ(h−y)xⱼ` — same "signed-error × feature" form as linear regression; cross-entropy
    is **convex** but has **no closed form** → gradient descent (**L06**). On separable data weights blow
    up → **L2-regularized logistic regression** (exclude `w₀`).'
  done_when:
  - Explain and apply The gradient, convexity & regularization without relying on the study map.
  exam_critical: true
  scope_triage: required-now
  resources:
