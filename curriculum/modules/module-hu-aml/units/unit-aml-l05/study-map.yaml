  title: From classification to the sigmoid hypothesis
  status: pending
  objective: Why linear regression + threshold fails (outliers); the **sigmoid** `σ(z)=1/(1+e⁻ᶻ)` squashes
    the score into `[0,1]`; `h_𝐰(x)=σ(𝐰·𝐱)=P(y=1∣x)`.
  done_when:
