id: unit-aml-l05
type: unit
module_id: module-hu-aml
kind: lecture
title: AML Lecture 05 — Logistic Regression
order: 5
scope: Current 2026 L05 deck; binary classification, failure of thresholded linear regression, linear
  decision boundaries, the sigmoid/logit model, basis-expanded nonlinear boundaries, Bernoulli likelihood,
  cross-entropy, the vectorized gradient, convexity, and the absence of a closed-form optimum.
status: ready
knowledge_map:
  summary: The lecture builds logistic regression from a geometric classifier and a probabilistic model,
    then derives the loss and gradient that will be optimized in L06.
  nodes:
  - id: knowledge-aml-l05-classification
    title: Binary classification problem
    summary: Positive/negative classes, discrete outputs, and why ordinary linear regression plus a threshold
      is unstable.
  - id: knowledge-aml-l05-boundary
    title: Linear decision boundary
    summary: The separator w·x=0, score signs, threshold geometry, and basis expansion for curved boundaries.
    builds_on:
    - knowledge-aml-l05-classification
  - id: knowledge-aml-l05-sigmoid
    title: Sigmoid, probability, and log-odds
    summary: Squashing linear scores to [0,1], probabilistic interpretation, thresholds, odds, and logits.
    builds_on:
    - knowledge-aml-l05-boundary
  - id: knowledge-aml-l05-likelihood
    title: Bernoulli likelihood
    summary: Probability of observed labels, products over examples, log-likelihood, and maximum-likelihood
      estimation.
    builds_on:
    - knowledge-aml-l05-sigmoid
  - id: knowledge-aml-l05-cross-entropy
    title: Cross-entropy loss
    summary: Negative log-likelihood, the combined binary loss, why MSE is unsuitable here, and vectorization.
    builds_on:
    - knowledge-aml-l05-likelihood
  - id: knowledge-aml-l05-gradient
    title: Gradient and optimization handoff
    summary: dL/dw = Xᵀ(σ(Xw)-y)/m, convexity, no closed form, and the bridge to gradient descent.
    builds_on:
    - knowledge-aml-l05-cross-entropy
