type: module-source-map
module_id: module-hu-icop
sources:
- source_id: source-icop-hu-ws2627
  role: course-material
  why: Current organization and linear-programming slides supplied by Aram; the screenshot preserves Moodle
    further-reading names.
  when: 'Confirmed by Aram on 2026-10-22: the entire 129-page LP chapter, divided into sessions. Course
    definitions and proofs remain authoritative.'
  priority: 1
  unit_routes:
  - id: route-icop-l01-deck-forms
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Model an LP and translate its forms
    format: course-material
    angle: Course notation and the actual shortest-path modeling task fix the meaning of each formulation.
    angle_detail: Read the deck framing on pages 1-5; work pages 6-23. Kratsch canonical means min c^T
      x with Ax<=b and x>=0; standard means Ax=b and x>=0. Do not carry names across textbooks without
      checking the equations. Read the indicated physical PDF pages; the complete deck remains the scope
      authority.
    covers:
    - knowledge-icop-l01-forms
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 1-23
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-geometry
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — See constraints and objectives geometrically
    format: course-material
    angle: Course geometric definitions and segment arguments connect local and global LP optimality.
    angle_detail: Recall the existing convexity idea through note-aml-l06-gradient-descent §7; add the
      LP-specific proof and polyhedral structure here. Convexity does not imply a unique optimizer; do
      not assume uniqueness when an objective is constant along a face. Read the indicated physical PDF
      pages; the complete deck remains the scope authority.
    covers:
    - knowledge-icop-l01-geometry
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 24-40
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-bases
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Connect vertices, extreme points and feasible bases
    format: course-material
    angle: Course proofs establish the vertex/extreme-point/BFS equivalence and support reduction.
    angle_detail: 'Distinguish independent support columns from a full m-column basis; a degenerate BFS
      may have fewer than m positive coordinates. Answer the question on slide 55: standard-form nonempty
      feasible polyhedra have vertices; arbitrary LP polyhedra need not. Read the indicated physical PDF
      pages; the complete deck remains the scope authority.'
    covers:
    - knowledge-icop-l01-bases
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 41-62
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-pivots
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Derive and carry out a simplex pivot
    format: course-material
    angle: Course matrix derivation connects reduced costs and the ratio test to a feasible edge move.
    angle_detail: Use the matrix derivation first; Blum §8.2 PDF pages 244-245 is optional tableau support.
      Carry one small LP forward into the duality sessions instead of starting a new numerical example
      every time. Read the indicated physical PDF pages; the complete deck remains the scope authority.
    covers:
    - knowledge-icop-l01-pivots
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 63-81
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-phase-one
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Find a starting basis and handle failure cases
    format: course-material
    angle: Course auxiliary-LP construction and bit-cost discussion handle the missing starting basis.
    angle_detail: Revisit slide 67 before applying nondegeneracy claims; explain the zero artificial-variable
      cleanup or redundant-row case. Klee-Minty and the Hirsch discussion are context on slides 90-91.
      Detailed smoothed analysis and interior-point papers remain deferred. Read the indicated physical
      PDF pages; the complete deck remains the scope authority.
    covers:
    - knowledge-icop-l01-phase-one
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 82-91
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-standard-duality
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Prove bounds and standard-form duality
    format: course-material
    angle: Course optimal-basis certificate proves weak and strong duality in standard form.
    angle_detail: Use Cornell L14 then L15 for examples and L16 for the simplex-to-duality connection.
      Keep the optimal-basis/nonnegative-reduced-cost qualification when discussing degenerate solutions.
      Read the indicated physical PDF pages; the complete deck remains the scope authority.
    covers:
    - knowledge-icop-l01-standard-duality
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 92-102
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-general-duality
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Derive dual signs and diagnose primal-dual status
    format: course-material
    angle: Course transformations derive general sign rules and the complete primal-dual status table.
    angle_detail: Cornell L8 supports transformations; MIT Shor L13 is an optional second perspective.
      Explain why an unbounded primal forces dual infeasibility, while primal infeasibility alone does
      not force dual unboundedness. Read the indicated physical PDF pages; the complete deck remains the
      scope authority.
    covers:
    - knowledge-icop-l01-general-duality
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 103-115
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-slackness
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Use complementary slackness as an optimality certificate
    format: course-material
    angle: Course gap decomposition proves the full complementary-slackness theorem.
    angle_detail: Cornell L17 supplies examples; its packet does not prove the converse explicitly, so
      complete the proof from Kratsch/Blum. Read the chapter summary on slide 125 and identify how modeling,
      geometry, bases, simplex and dual certificates connect. Read the indicated physical PDF pages; the
      complete deck remains the scope authority.
    covers:
    - knowledge-icop-l01-slackness
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 116-125
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-oral-review
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Integrate the chapter and rehearse the oral exam
    format: course-material
    angle: Course outlook and further exercises test transfer after the chapter; oral criteria come from
      the organization deck.
    angle_detail: Read organization slides 15-16 for the oral expectations; use your own blackboard notes
      where available (organization slide 12 says the PDFs omit sketches). Slide 126 is an outlook only.
      The further exercises on slides 128-129 provide practice; organization slide 16 does not make their
      solutions exam content. Read the indicated physical PDF pages; the complete deck remains the scope
      authority.
    covers:
    - knowledge-icop-l01-oral-review
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 126-129
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-organization
    unit_id: unit-icop-l01-linear-programming
    title: ICOP oral-exam expectations and missing board sketches
    format: course-material
    angle: Defines the actual oral format and separates lecture exercises from further transfer exercises.
    angle_detail: 'Organization slides 12 and 15-16: the PDF omits some blackboard sketches; exam is 30
      minutes with definitions, facts, methods and main proof ideas. Further transfer-exercise solutions
