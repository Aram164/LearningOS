    unit_id: unit-icop-l01-linear-programming
    title: 'Stanford CS261 L7 — Linear Programming: Introduction and Applications'
    format: video
    angle: Shows the modeling reach of LP through flows, absolute-error regression and linear classification.
    angle_detail: Auxiliary variables turn absolute values and hinge losses into linear constraints, connecting
      optimization to familiar machine-learning models. The geometric opening explains feasibility and
      corner solutions before the applications. Choose this for breadth and modeling transfer after the
      HU basics. Content is checked against the instructor’s lecture notes; it does not supply the chapter’s
      detailed simplex derivation.
    covers:
    - knowledge-icop-l01-forms
    - knowledge-icop-l01-geometry
    depth: intuition
    scope: optional
    locator: 'Stanford CS261 (Winter 2016), Lecture 7: Linear Programming: Introduction and Applications'
    url: https://theory.stanford.edu/~tim/w16/w16.html
  - id: route-icop-l01-stanford-8
    unit_id: unit-icop-l01-linear-programming
    title: Stanford CS261 L8 — Linear Programming Duality (Part 1)
    format: video
    angle: Interprets the dual as the best bound obtainable by weighting constraints, then connects the
      construction to maximum flow and cuts.
    angle_detail: A small numerical LP motivates the recipe and weak duality before the flow example gives
      the multipliers a combinatorial meaning. The notes also explain sign conventions for different forms.
      Choose this when duality rules are usable but their interpretation is missing; the general strong-duality
      and slackness discussion continues in L9.
    covers:
    - knowledge-icop-l01-standard-duality
    - knowledge-icop-l01-general-duality
    depth: intuition
    scope: optional
    locator: 'Stanford CS261 (Winter 2016), Lecture 8: Linear Programming Duality (Part 1)'
    url: https://theory.stanford.edu/~tim/w16/w16.html
  - id: route-icop-l01-stanford-9
    unit_id: unit-icop-l01-linear-programming
    title: Stanford CS261 L9 — Linear Programming Duality (Part 2)
    format: video
    angle: Connects complementary slackness to the Hungarian algorithm and explains strong duality through
      separating hyperplanes and Farkas’ lemma.
    angle_detail: The physical picture treats dual multipliers as balancing constraint forces, while matching
      turns the optimality conditions into an algorithmic invariant. This adds a geometric and combinatorial
      perspective beyond HU’s simplex-basis proof. Use it for conceptual depth after the core certificates;
      its separation argument introduces additional theory. Content is checked against the instructor’s
      notes.
    covers:
    - knowledge-icop-l01-standard-duality
    - knowledge-icop-l01-slackness
    depth: intuition
    scope: optional
    locator: 'Stanford CS261 (Winter 2016), Lecture 9: Linear Programming Duality (Part 2)'
    url: https://theory.stanford.edu/~tim/w16/w16.html
  - id: route-icop-l01-stanford-10
    unit_id: unit-icop-l01-linear-programming
    title: Stanford CS261 L10 — The Minimax Theorem & Algorithms for Linear Programming
    format: video
    angle: Derives the minimax theorem for zero-sum games from LP duality and compares the main approaches
      to solving LPs.
    angle_detail: Mixed strategies become primal and dual programs with the same game value. The algorithm
      survey contrasts simplex along the boundary, ellipsoid methods using separation, and interior-point
      methods. Choose this after the chapter to see what strong duality achieves beyond certificates and
      to contextualize HU’s outlook. The notes give a survey, not an additional required algorithm implementation.
    covers:
    - knowledge-icop-l01-oral-review
    depth: intuition
    scope: optional
    locator: 'Stanford CS261 (Winter 2016), Lecture 10: The Minimax Theorem & Algorithms for Linear Programming'
    url: https://theory.stanford.edu/~tim/w16/w16.html
