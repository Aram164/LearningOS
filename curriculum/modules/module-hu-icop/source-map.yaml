type: module-source-map
module_id: module-hu-icop
sources:
- source_id: source-icop-hu-ws2627
  role: course-material
  why: Current organization and linear-programming slides supplied by Aram; the screenshot preserves Moodle
    further-reading names.
  when: 'Confirmed by Aram on 2026-10-22: the entire 129-page LP chapter, divided into sessions. Course
    definitions and proofs remain authoritative.'
  priority: 1
  unit_routes:
  - id: route-icop-l01-deck-forms
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Model an LP and translate its forms
    format: course-material
    angle: Builds the language of LPs, then shows how sign changes, variable splitting and slack variables
      connect different formulations.
    angle_detail: The chapter moves from optimization and feasibility to matrix notation and the course’s
      canonical and standard forms. The shortest-path exercise makes you supply the model yourself. Use
      this for the exact HU conventions and for explaining why each transformation preserves solutions;
      Shor and Cornell supply concrete models to compare with it.
    covers:
    - knowledge-icop-l01-forms
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 1-23
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-geometry
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — See constraints and objectives geometrically
    format: course-material
    angle: Explains why linear constraints form a convex polyhedron and why sliding an objective hyperplane
      reveals global optima.
    angle_detail: Halfspaces lead to convexity, local-to-global optimality, supporting hyperplanes, faces
      and vertices. The emphasis is the argument behind the picture, including why a nonzero objective
      excludes an interior optimum. Cornell L2 supplies a drawn numerical example; return here to state
      the geometric definitions and prove the claims.
    covers:
    - knowledge-icop-l01-geometry
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 24-40
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-bases
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Connect vertices, extreme points and feasible bases
    format: course-material
    angle: 'Turns a geometric corner into an algebraic object: independent support columns and a basic
      feasible solution.'
    angle_detail: The vertex/extreme-point/BFS equivalence and support-reduction proof explain why finitely
      many candidate bases suffice for a finite optimum. Gaussian elimination then makes those candidates
      computable. This is the proof spine; Cornell L3 repairs the linear algebra and L4 shows bases in
      use. Keep the nonnegative standard-form setting of the vertex theorem explicit.
    covers:
    - knowledge-icop-l01-bases
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 41-62
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-pivots
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Derive and carry out a simplex pivot
    format: course-material
    angle: 'Derives a simplex move from the current basis: reduced costs choose a direction and the ratio
      test preserves feasibility.'
    angle_detail: The matrix identities explain both stopping with an optimum and following an improving
      unbounded ray. Basis exchange connects the calculation to moving along an edge. Use Cornell L4–5
      to see the arithmetic unfold and Blum for tableau updates. The deck’s strict-improvement argument
      assumes nondegeneracy; a changed basis need not otherwise mean a changed point.
    covers:
    - knowledge-icop-l01-pivots
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 63-81
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-phase-one
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Find a starting basis and handle failure cases
    format: course-material
    angle: Constructs a starting feasible basis with an auxiliary LP, then separates feasibility, arithmetic
      cost and pivot-count complexity.
    angle_detail: Artificial variables give a trivial initial basis; an auxiliary optimum of zero recovers
      feasibility, while a positive value proves infeasibility. The final pages discuss rational bit lengths
      and exponentially long simplex runs. Blum fills in zero-artificial-variable cleanup and cycling;
      Cornell L6–7 provides a worked alternative construction and the handoff to the original objective.
    covers:
    - knowledge-icop-l01-phase-one
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 82-91
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-standard-duality
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Prove bounds and standard-form duality
    format: course-material
    angle: Develops dual solutions as bounds, then extracts an equal-value certificate from a simplex
      basis with nonnegative reduced costs.
    angle_detail: For the equality-form minimization primal, dual multipliers are unrestricted and column
      inequalities bound its costs from below. Weak duality validates any feasible certificate; the optimal-basis
      construction supplies strong duality in the chapter’s simplex setting. Cornell L14–16 makes this
      connection numerical. Check reduced costs when constructing the certificate, especially at a degenerate
      optimum.
    covers:
    - knowledge-icop-l01-standard-duality
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 92-102
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-general-duality
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Derive dual signs and diagnose primal-dual status
    format: course-material
    angle: Derives dual signs from primal transformations and uses weak and strong duality to classify
      possible primal–dual outcomes.
    angle_detail: Slack variables explain multiplier signs; splitting a free variable explains the corresponding
      dual equality. Dualizing twice recovers the original problem. The status table distinguishes finite
      optima, unboundedness and infeasibility, and the shortest-path example reconnects duality to modeling.
      Blum expands the transformations; Shor offers a different conceptual route. Infeasibility alone
      does not determine the other side’s status.
    covers:
    - knowledge-icop-l01-general-duality
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 103-115
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-slackness
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Use complementary slackness as an optimality certificate
    format: course-material
    angle: Proves complementary slackness by expressing the primal–dual objective gap as a sum of nonnegative
      products.
    angle_detail: Zero gap becomes a precise link between positive variables and tight constraints, yielding
      an optimality test for feasible pairs. Both directions of the theorem matter; tightness alone does
      not imply a positive multiplier. Cornell L17 demonstrates how to recover the other optimizer, while
      this section supplies the complete proof and the chapter’s closing conceptual summary.
    covers:
    - knowledge-icop-l01-slackness
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 116-125
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-deck-oral-review
    unit_id: unit-icop-l01-linear-programming
    title: Kratsch — Integrate the chapter and rehearse the oral exam
    format: course-material
    angle: Extends the chapter through new modeling and proof problems, alongside a short outlook on other
      optimization methods.
    angle_detail: The final exercises ask about an inscribed ball, almost-integral vertices, infeasibility
      certificates and simplex tableaux. They expose whether you can transfer the chapter’s ideas beyond
      familiar examples. Ellipsoid and interior-point methods appear as outlook topics. Use the organization
      deck to set oral-exam expectations; the further-exercise solutions are not themselves specified
      as exam content.
    covers:
    - knowledge-icop-l01-oral-review
    depth: course-aligned
    scope: current
    locator: ico_linearprogramming.pdf, pdf pp. 126-129
    vault_path: material://source-icop-hu-ws2627/ico_linearprogramming.pdf
  - id: route-icop-l01-organization
    unit_id: unit-icop-l01-linear-programming
    title: ICOP oral-exam expectations and missing board sketches
    format: course-material
    angle: 'Sets the target for preparation: definitions, results, methods and central proof ideas explained
      in a 30-minute oral examination.'
    angle_detail: These slides also explain that the PDFs omit some blackboard sketches and distinguish
      lecture exercises from further transfer exercises. Use them to decide what you must be able to say
      and reconstruct, then use the LP deck for the mathematics. They describe assessment expectations
      rather than teaching LP techniques.
    covers:
    - knowledge-icop-l01-oral-review
    depth: orientation
    scope: current
    locator: ico_organization.pdf, pdf pp. 12-16
    vault_path: material://source-icop-hu-ws2627/ico_organization.pdf
- source_id: source-korte-vygen
  role: spine
  why: The lecturer identifies Korte & Vygen fifth edition (2012) as the main book (organization slide
    6).
  when: Reference-only shelf; Chapter 3 is recommended after the linear-programming chapter (LP slide
    2).
  priority: 2
  unit_routes:
  - id: route-icop-l01-kv-review
    unit_id: unit-icop-l01-linear-programming
    title: Korte & Vygen — Chapter 3 overview after the LP chapter
    format: book
    angle: Condenses LP into a polyhedral theory connecting faces, simplex, duality, separation and convex-hull
      descriptions.
    angle_detail: The chapter adds a wider view through minimal faces, implementation and revised simplex,
      Farkas-type alternatives, and polytopes as convex hulls of vertices. Read it after Kratsch to connect
      results that the sessions develop separately. Its unrestricted-variable maximization convention
      and dense proofs require translation; it is an English consolidation and extension, rather than
      a slow first explanation.
    covers:
    - knowledge-icop-l01-oral-review
    - knowledge-icop-l01-geometry
    - knowledge-icop-l01-pivots
    - knowledge-icop-l01-standard-duality
    depth: advanced-reference
    scope: optional
    locator: 'Chapter 3: Linear Programming, pdf pp. 70-90'
    vault_path: material://source-korte-vygen/korte-vygen-combinatorial-optimization-5e.pdf
- source_id: source-blum-algorithmen-datenstrukturen
  role: reference
  why: The linear-programming slides explicitly follow Chapter 8 of Blum, second edition (LP slide 2).
  when: Matching written derivation alongside the current slides; stop before dual simplex at the bottom
    of PDF page 255.
  priority: 3
  unit_routes:
  - id: route-icop-l01-blum-forms
    unit_id: unit-icop-l01-linear-programming
    title: Blum — Model an LP and translate its forms
    format: book
    angle: Connects LP notation to matching, maximum-flow and vertex-cover models before deriving the
      course’s normal-form transformations.
    angle_detail: The examples show what variables and constraints represent and where integrality is
      an extra requirement. Free-variable splitting, slack variables and sign changes then lead to the
      same canonical and standard forms used by Kratsch. Choose this when the deck’s transformations feel
      formal but their modeling meaning is still unclear.
    covers:
    - knowledge-icop-l01-forms
    depth: derivation
    scope: complementary
    locator: 'Chapter 8 §8.1, pdf pp. 229-232: Model an LP and translate its forms'
    vault_path: material://source-blum-algorithmen-datenstrukturen/blum-algorithmen-und-datenstrukturen-2e.pdf
  - id: route-icop-l01-blum-geometry
    unit_id: unit-icop-l01-linear-programming
    title: Blum — See constraints and objectives geometrically
    format: book
    angle: 'Develops the geometric vocabulary in German: convex combinations, halfspaces, affine dimension,
      supporting hyperplanes and faces.'
    angle_detail: Figures and continuous prose link inequalities to polyhedra and distinguish vertices,
      edges, facets and redundant constraints. This helps unpack the deck’s compressed terminology and
      prepares the algebraic vertex characterization. Cornell L2 is the better companion for following
      a concrete feasible-region drawing; Kratsch carries the local-to-global optimality argument.
    covers:
    - knowledge-icop-l01-geometry
    depth: derivation
    scope: complementary
    locator: 'Chapter 8 §8.1, pdf pp. 232-234: See constraints and objectives geometrically'
    vault_path: material://source-blum-algorithmen-datenstrukturen/blum-algorithmen-und-datenstrukturen-2e.pdf
  - id: route-icop-l01-blum-bases
    unit_id: unit-icop-l01-linear-programming
    title: Blum — Connect vertices, extreme points and feasible bases
    format: book
    angle: Explains the bridge from independent positive-support columns to feasible bases, then relates
      vertices to recession directions.
    angle_detail: Theorem 8.1 proves the support criterion; solving Bx_B=b turns it into basis enumeration.
      Directions and the fundamental LP theorem explain the alternative between an optimal vertex and
      decreasing cost along a ray. Read for a continuous derivation of the finite-search idea, keeping
      the HU standard-form boundary explicit rather than extending the vertex claim to arbitrary polyhedra.
    covers:
    - knowledge-icop-l01-bases
    depth: derivation
    scope: complementary
    locator: 'Chapter 8 §8.1, pdf pp. 234-238: Connect vertices, extreme points and feasible bases'
    vault_path: material://source-blum-algorithmen-datenstrukturen/blum-algorithmen-und-datenstrukturen-2e.pdf
  - id: route-icop-l01-blum-pivots
    unit_id: unit-icop-l01-linear-programming
    title: Blum — Derive and carry out a simplex pivot
    format: book
    angle: Expands the simplex derivation into explicit coefficient updates and two tableau representations.
    angle_detail: Starting from x_B=B⁻¹b−B⁻¹Nx_N, the text derives reduced costs, the ratio test, unboundedness
      and the optimality criterion. It then shows how a pivot updates the equations and tableaux. Use
      it to explain where the arithmetic rules come from after Cornell’s worked examples; the opening
      development assumes a known feasible, nondegenerate basis.
    covers:
    - knowledge-icop-l01-pivots
    depth: derivation
    scope: complementary
    locator: 'Chapter 8 §8.2, pdf pp. 238-245: Derive and carry out a simplex pivot'
    vault_path: material://source-blum-algorithmen-datenstrukturen/blum-algorithmen-und-datenstrukturen-2e.pdf
  - id: route-icop-l01-blum-phase-one
    unit_id: unit-icop-l01-linear-programming
    title: Blum — Find a starting basis and handle failure cases
    format: book
    angle: Fills in Phase I’s implementation details, especially zero artificial basic variables, redundant
      equations and degeneracy.
    angle_detail: After the auxiliary objective reaches zero, artificial basis columns are pivoted out
      or removed with a redundant row. The text then shows how zero-length pivots allow cycling and develops
      a lexicographic rule to prevent it. This is the most useful written repair when the HU feasibility
      argument leaves the transition to a usable Phase-II basis unclear.
    covers:
    - knowledge-icop-l01-phase-one
    depth: derivation
    scope: complementary
    locator: 'Chapter 8 §8.2, pdf pp. 245-249: Find a starting basis and handle failure cases'
    vault_path: material://source-blum-algorithmen-datenstrukturen/blum-algorithmen-und-datenstrukturen-2e.pdf
  - id: route-icop-l01-blum-standard-duality
    unit_id: unit-icop-l01-linear-programming
    title: Blum — Prove bounds and standard-form duality
    format: book
    angle: Builds the dual from the same basis-cost identity used by simplex, making multipliers a consequence
      of the algorithm.
    angle_detail: The vector πᵀ=c_BᵀB⁻¹ converts the reduced-cost inequalities into dual feasibility,
      while the common objective value supplies the optimality certificate. Weak and strong duality emerge
      from this construction. Use the prose alongside Cornell L16’s row-operation example to connect the
      symbolic formula to a calculation; verify nonnegative reduced costs for the chosen basis.
    covers:
    - knowledge-icop-l01-standard-duality
    depth: derivation
    scope: complementary
    locator: 'Chapter 8 §8.3, pdf pp. 249-251: Prove bounds and standard-form duality'
    vault_path: material://source-blum-algorithmen-datenstrukturen/blum-algorithmen-und-datenstrukturen-2e.pdf
  - id: route-icop-l01-blum-general-duality
    unit_id: unit-icop-l01-linear-programming
    title: Blum — Derive dual signs and diagnose primal-dual status
    format: book
    angle: Derives general dual rules by tracking the columns introduced by slack variables and free-variable
      splitting.
    angle_detail: The side-by-side primal–dual table follows from the transformations rather than a mnemonic.
      A second transformation proves that the dual of the dual recovers the primal, and small examples
      establish which status pairs can occur. Choose this when equality rows, unrestricted variables or
      infeasibility make a memorized sign table unreliable.
    covers:
    - knowledge-icop-l01-general-duality
    depth: derivation
    scope: complementary
    locator: 'Chapter 8 §8.3, pdf pp. 251-254: Derive dual signs and diagnose primal-dual status'
    vault_path: material://source-blum-algorithmen-datenstrukturen/blum-algorithmen-und-datenstrukturen-2e.pdf
  - id: route-icop-l01-blum-slackness
    unit_id: unit-icop-l01-linear-programming
    title: Blum — Use complementary slackness as an optimality certificate
    format: book
    angle: Gives a compact complete proof that feasible primal–dual solutions are optimal exactly when
      their complementary products vanish.
    angle_detail: The proof separates row slack and column slack into nonnegative sums whose total equals
      the objective gap. It explains why positive variables force tight partner constraints and why equality
      rows contribute automatically. Use it to finish the argument after Cornell’s examples. Stop before
      the dual-simplex development at the bottom of PDF page 255.
    covers:
    - knowledge-icop-l01-slackness
    depth: derivation
    scope: complementary
    locator: 'Chapter 8 §8.3, pdf pp. 254-255: Use complementary slackness as an optimality certificate'
    vault_path: material://source-blum-algorithmen-datenstrukturen/blum-algorithmen-und-datenstrukturen-2e.pdf
  - id: route-icop-l01-blum-oral-review
    unit_id: unit-icop-l01-linear-programming
    title: Blum — Integrate the chapter and rehearse the oral exam
    format: book
    angle: Combines formulation, simplex, dual construction and complementary slackness in exercises that
      require a complete solution chain.
    angle_detail: Exercise 8.15 uses mixed variable signs and constraint types; 8.16 asks you to solve
      a primal, derive its dual and recover the dual solution through slackness. These expose gaps between
      isolated techniques. Use them for untimed synthesis before the spoken mock exam; the page gives
      problems rather than a worked answer guide.
    covers:
    - knowledge-icop-l01-oral-review
    depth: practice
    scope: complementary
    locator: 'Chapter 8 §8.5, exercises 8.15-8.16, pdf pp. 266-266: Integrate the chapter and rehearse
      the oral exam'
    vault_path: material://source-blum-algorithmen-datenstrukturen/blum-algorithmen-und-datenstrukturen-2e.pdf
