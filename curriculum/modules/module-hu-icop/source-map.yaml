- source_id: source-mit-18200-2024
  role: first-exposure
  why: Shor L12 supplies concrete LP models before the HU formal treatment; L13 is an alternative explanation
    for duality.
  when: Selected support only where explicitly placed; all other lecture options remain reference-only.
  priority: 8
  unit_routes:
  - id: route-icop-l01-mit12
    unit_id: unit-icop-l01-linear-programming
    title: Shor L12 — Introduction to Linear Programming
    format: video
    angle: Introduces LP through diet and bake-sale models, giving variables, constraints and objective
      values a concrete meaning.
    angle_detail: Shor moves from those examples to standard and canonical forms and an introduction to
      duality. This is a useful first encounter before the HU shortest-path task, especially if matrix
      notation arrives before the modeling idea feels natural. Translate the actual equations when comparing
      form names. The topic description is verified; no precise viewing segment is prescribed.
    covers:
    - knowledge-icop-l01-forms
    depth: orientation
    scope: complementary
    locator: 'MIT 18.200 Lecture 12: Introduction to Linear Programming'
    url: https://ocw.mit.edu/courses/18-200-principles-of-discrete-applied-mathematics-spring-2024/resources/18200-lecture-12-version-2_mp4/
  - id: route-icop-l01-mit13
    unit_id: unit-icop-l01-linear-programming
    title: Shor L13 — Duality in Linear Programming
    format: video
    angle: Offers a physical interpretation of strong duality and connects LP certificates to König’s
      matching theorem.
    angle_detail: The lecture also covers duals of arbitrary LPs and complementary slackness. Its contribution
      is a second conceptual route from sign rules to a combinatorial min–max result, beyond the HU simplex-basis
      proof. Use it when you can manipulate the formulas but want to understand their broader meaning.
      These topics are verified from the official lecture description.
    covers:
    - knowledge-icop-l01-standard-duality
    - knowledge-icop-l01-general-duality
    - knowledge-icop-l01-slackness
    depth: intuition
    scope: optional
    locator: 'MIT 18.200 Lecture 13: Duality in Linear Programming'
    url: https://ocw.mit.edu/courses/18-200-principles-of-discrete-applied-mathematics-spring-2024/resources/18200-lecture-13-version-2_mp4/
- source_id: source-cornell-topaloglu-lp
  role: intuition
  why: Worked examples and algebraic explanations support geometry, simplex and duality; course packet
    and notes make the intended content inspectable.
  when: Selected support only where explicitly placed; all other lecture options remain reference-only.
  priority: 9
  unit_routes:
  - id: route-icop-l01-cornell-1
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L1 — Formulating a Linear Program and Excel's Solver
    format: video
    angle: Models server allocation and advertising decisions, translating a practical objective and resource
      limits into an LP.
    angle_detail: The examples distinguish input data from decision variables, combine capacity inequalities
      with demand equalities, and introduce indexed notation. Excel Solver makes the model executable.
      Use this when formulating the problem is harder than manipulating an existing matrix; the software
      demonstration is optional for the HU shortest-path modeling task.
    covers:
    - knowledge-icop-l01-forms
    depth: intuition
    scope: complementary
    locator: 'Cornell Fundamentals of Linear Programming, Lecture 1: Formulating a Linear Program and
      Excel''s Solver'
    url: https://people.orie.cornell.edu/huseyin/lp_course/lp_course.html
  - id: route-icop-l01-cornell-notes-1
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L1 — handwritten notes
    format: course-material
    angle: Keeps the server and advertising formulations in a compact written form so you can check what
      every coefficient means.
    angle_detail: Use the completed handwritten calculations to reconstruct variables, resource limits
      and indexed constraints without following the video’s pace. The value is the translation from a
      story to equations; it does not replace the course’s proof that normal-form transformations preserve
      the represented problem.
    covers:
    - knowledge-icop-l01-forms
    depth: course-aligned
    scope: complementary
    locator: Cornell Lecture 1 handwritten notes, pdf pp. 1-7
    url: https://people.orie.cornell.edu/huseyin/lp_course/lecture_1.pdf
  - id: route-icop-l01-cornell-2
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L2 — Geometry of Linear Programming
    format: video
    angle: Builds a feasible polygon for a CPU-and-memory allocation problem, then moves revenue lines
      until they touch its optimum.
    angle_detail: The worked picture connects each inequality to a halfplane, explains a nonbinding resource
      constraint, and changes the objective to reveal an entire optimal edge. Choose it when the geometric
      vocabulary is familiar but you cannot yet see what the equations do. Kratsch supplies the general
      convexity and local-to-global proofs.
    covers:
    - knowledge-icop-l01-geometry
    depth: intuition
    scope: complementary
    locator: 'Cornell Fundamentals of Linear Programming, Lecture 2: Geometry of Linear Programming'
    url: https://people.orie.cornell.edu/huseyin/lp_course/lp_course.html
  - id: route-icop-l01-cornell-notes-2
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L2 — handwritten notes
    format: course-material
    angle: Collects the feasible-region sketches and objective-line calculations for the CPU-and-memory
      example.
    angle_detail: Trace which side of each line is feasible, identify the optimal intersection and compare
      the changed objective with multiple optima. These drawings make it easier to reconstruct the geometric
      argument on paper after watching, while the HU deck remains the source for general definitions and
      proofs.
    covers:
    - knowledge-icop-l01-geometry
    depth: course-aligned
    scope: complementary
    locator: Cornell Lecture 2 handwritten notes, pdf pp. 1-5
    url: https://people.orie.cornell.edu/huseyin/lp_course/lecture_2.pdf
  - id: route-icop-l01-cornell-3
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L3 — Useful Linear Algebra Concepts
    format: video
    angle: 'Refreshes the matrix operations needed for simplex: multiplication, inverses, linear systems
      and elementary row operations.'
    angle_detail: Examples show how row operations preserve an equation system and how an augmented identity
      matrix produces an inverse. Use this if B⁻¹b or a tableau pivot is the obstacle. It prepares the
      calculations; the HU proof connecting vertices, extreme points and basic feasible solutions still
      needs separate study.
    covers:
    - knowledge-icop-l01-bases
    depth: intuition
    scope: complementary
    locator: 'Cornell Fundamentals of Linear Programming, Lecture 3: Useful Linear Algebra Concepts'
    url: https://people.orie.cornell.edu/huseyin/lp_course/lp_course.html
  - id: route-icop-l01-cornell-notes-3
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L3 — handwritten notes
    format: course-material
    angle: Provides worked matrix and row-operation calculations to repair the algebra behind basis solutions.
    angle_detail: Reproduce the inversion and equivalent-system steps, then return to solving A_Bx_B=b
      in the HU session. The notes are useful for checking arithmetic and dimensions; they are not a substitute
      for proving the vertex/extreme-point/BFS equivalence.
    covers:
    - knowledge-icop-l01-bases
    depth: course-aligned
    scope: complementary
    locator: Cornell Lecture 3 handwritten notes, pdf pp. 1-6
    url: https://people.orie.cornell.edu/huseyin/lp_course/lecture_3.pdf
  - id: route-icop-l01-cornell-4
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L4 — Introduction to the Simplex Method
    format: video
    angle: Introduces simplex by improving the CPU-and-memory model through elementary row operations
      rather than starting with inverse-matrix formulas.
    angle_detail: Slack variables expose a starting solution; objective coefficients suggest an entering
      variable and nonnegativity gives the ratio test. Each pivot makes a new set of basic columns visible.
      Choose this to see how an abstract basis becomes an actual calculation, then match its objective
      row to Kratsch’s reduced-cost identity.
    covers:
    - knowledge-icop-l01-bases
    - knowledge-icop-l01-pivots
    depth: intuition
    scope: complementary
    locator: 'Cornell Fundamentals of Linear Programming, Lecture 4: Introduction to the Simplex Method'
    url: https://people.orie.cornell.edu/huseyin/lp_course/lp_course.html
  - id: route-icop-l01-cornell-notes-4
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L4 — handwritten notes
    format: course-material
    angle: Shows the successive equation systems, basic variables and limiting ratios in the first complete
      simplex example.
    angle_detail: Cover the next system and recompute each row operation, checking feasibility and the
      new objective value. This is the written bridge between Cornell’s numerical method and the HU matrix
      derivation; it illustrates basic solutions without supplying the full HU geometric equivalence proof.
    covers:
    - knowledge-icop-l01-bases
    - knowledge-icop-l01-pivots
    depth: course-aligned
    scope: complementary
    locator: Cornell Lecture 4 handwritten notes, pdf pp. 1-6
    url: https://people.orie.cornell.edu/huseyin/lp_course/lecture_4.pdf
  - id: route-icop-l01-cornell-5
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L5 — A Second Example on the Simplex Method
    format: video
    angle: Works a second simplex example so the entering-variable, ratio-test and stopping decisions
      recur on a different system.
    angle_detail: The larger calculation tests whether you can track the basic variables and objective
      row beyond the first familiar example. Use it after L4 by predicting each pivot before it is shown.
      It adds computational fluency; the symbolic reason that nonnegative reduced costs certify optimality
      comes from Kratsch or Blum.
    covers:
    - knowledge-icop-l01-pivots
    depth: intuition
    scope: complementary
    locator: 'Cornell Fundamentals of Linear Programming, Lecture 5: A Second Example on the Simplex Method'
    url: https://people.orie.cornell.edu/huseyin/lp_course/lp_course.html
  - id: route-icop-l01-cornell-notes-5
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L5 — handwritten notes
    format: course-material
    angle: Retains the second example’s successive pivots as a calculation you can reconstruct independently.
    angle_detail: Use the intermediate systems to check your entering and leaving variables, row elimination
      and final optimality decision. It is particularly useful when the first example is recognizable
      but a fresh tableau still causes errors. Derive the general stopping criterion separately from the
      HU basis identity.
    covers:
    - knowledge-icop-l01-pivots
    depth: course-aligned
    scope: complementary
    locator: Cornell Lecture 5 handwritten notes, pdf pp. 1-7
    url: https://people.orie.cornell.edu/huseyin/lp_course/lecture_5.pdf
  - id: route-icop-l01-cornell-6
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L6 — Phase-1 Linear Program to Construct a Feasible Solution to a Linear Program
    format: video
    angle: Constructs a feasible starting point by solving an auxiliary problem with one artificial variable.
    angle_detail: The example begins with negative right-hand sides and minimizes the artificial variable
      until the original constraints become feasible. This gives a concrete alternative to HU’s one-artificial-variable-per-equation
      construction. Compare why zero auxiliary cost proves feasibility in both; follow L7 for the return
      to the original objective.
    covers:
    - knowledge-icop-l01-phase-one
    depth: intuition
    scope: complementary
    locator: 'Cornell Fundamentals of Linear Programming, Lecture 6: Phase-1 Linear Program to Construct
      a Feasible Solution to a Linear Program'
    url: https://people.orie.cornell.edu/huseyin/lp_course/lp_course.html
  - id: route-icop-l01-cornell-notes-6
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L6 — handwritten notes
    format: course-material
    angle: Records the single-artificial-variable construction and the pivots that drive its auxiliary
      objective to zero.
    angle_detail: Follow the initially infeasible slack solution into a feasible auxiliary system, then
      check how zero artificial value yields an original feasible point. These worked equations help distinguish
      the purpose of Phase I from objective optimization. The construction differs from the equality-form
      auxiliary LP used by HU.
    covers:
    - knowledge-icop-l01-phase-one
    depth: course-aligned
    scope: complementary
    locator: Cornell Lecture 6 handwritten notes, pdf pp. 1-7
    url: https://people.orie.cornell.edu/huseyin/lp_course/lecture_6.pdf
  - id: route-icop-l01-cornell-7
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L7 — Solving a Linear Program Starting with the Feasible Solution from the Phase-1
      Linear Program
    format: video
    angle: 'Shows the often-missed handoff from Phase I to Phase II: restore the original objective and
      eliminate its basic-variable coefficients.'
    angle_detail: A feasible constraint system is carried over from the auxiliary problem, but its old
      objective cannot simply be reused. Row operations put the real objective into the current basis
      before improvement continues. Choose this when Phase I makes sense but restarting simplex does not;
      Blum treats remaining artificial basic variables and redundant rows.
    covers:
    - knowledge-icop-l01-phase-one
    depth: intuition
    scope: complementary
    locator: 'Cornell Fundamentals of Linear Programming, Lecture 7: Solving a Linear Program Starting
      with the Feasible Solution from the Phase-1 Linear Program'
    url: https://people.orie.cornell.edu/huseyin/lp_course/lp_course.html
  - id: route-icop-l01-cornell-notes-7
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L7 — handwritten notes
    format: course-material
    angle: Works through rebuilding the original objective in the basis returned by Phase I, then continues
      the pivots.
    angle_detail: Compare the auxiliary and original objective rows while the feasible constraint system
      is retained. Reconstructing the elimination explains why a feasible starting point alone is not
      yet a ready tableau for the original objective. Use Blum for the separate cleanup case where a zero
      artificial variable remains basic.
    covers:
    - knowledge-icop-l01-phase-one
    depth: course-aligned
    scope: complementary
    locator: Cornell Lecture 7 handwritten notes, pdf pp. 1-10
    url: https://people.orie.cornell.edu/huseyin/lp_course/lecture_7.pdf
  - id: route-icop-l01-cornell-8
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L8 — Linear Programs in General Form
    format: video
    angle: Reduces general LPs to a common form by changing objectives, constraint directions and variable
      representations.
    angle_detail: Nonpositive variables are negated, free variables are split, and equality or inequality
      rows are converted to the chosen convention. Use it to cross-check the mechanics of a transformation
      and recover the original solution. It supports the later dual-sign derivation, but does not itself
      develop the full general-duality theorem.
    covers:
    - knowledge-icop-l01-forms
    - knowledge-icop-l01-general-duality
    depth: intuition
    scope: complementary
    locator: 'Cornell Fundamentals of Linear Programming, Lecture 8: Linear Programs in General Form'
    url: https://people.orie.cornell.edu/huseyin/lp_course/lp_course.html
  - id: route-icop-l01-cornell-notes-8
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L8 — handwritten notes
    format: course-material
    angle: Gives a short transformation reference for objective direction, mixed constraints and variable
      signs.
    angle_detail: Work through how a nonpositive or free variable changes every affected coefficient,
      then compare the resulting equations with HU’s convention. This is a convenient check during modeling
      and before dualizing a general LP; derive the corresponding multiplier restrictions from Kratsch
      or Blum.
    covers:
    - knowledge-icop-l01-forms
    - knowledge-icop-l01-general-duality
    depth: course-aligned
    scope: complementary
    locator: Cornell Lecture 8 handwritten notes, pdf pp. 1-3
    url: https://people.orie.cornell.edu/huseyin/lp_course/lecture_8.pdf
  - id: route-icop-l01-cornell-9
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L9 — Unbounded Linear Programs, Multiple Optima and Degeneracy
    format: video
    angle: 'Separates three different simplex phenomena through examples: an unbounded improving ray,
      multiple optima and degenerate pivots.'
    angle_detail: The objective row and ratio test distinguish unlimited improvement from zero-cost movement;
      a zero basic variable explains a basis change without progress. Use this to diagnose what a calculation
      means instead of treating every unusual pivot as failure. Blum supplies the lexicographic treatment
      of cycling, while HU discusses pivot-count complexity.
    covers:
    - knowledge-icop-l01-phase-one
    depth: intuition
    scope: complementary
    locator: 'Cornell Fundamentals of Linear Programming, Lecture 9: Unbounded Linear Programs, Multiple
      Optima and Degeneracy'
    url: https://people.orie.cornell.edu/huseyin/lp_course/lp_course.html
  - id: route-icop-l01-cornell-notes-9
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L9 — handwritten notes
    format: course-material
    angle: Places the unboundedness, alternative-optimum and degeneracy calculations side by side for
      comparison.
    angle_detail: Check which example has no finite step limit, which permits movement with unchanged
      cost, and which changes the basis at the same point. The intermediate systems help keep geometric
      unboundedness, zero reduced cost and zero basic value distinct. These examples diagnose behavior;
      they do not provide a complete anti-cycling proof.
    covers:
    - knowledge-icop-l01-phase-one
    depth: course-aligned
    scope: complementary
    locator: Cornell Lecture 9 handwritten notes, pdf pp. 1-9
    url: https://people.orie.cornell.edu/huseyin/lp_course/lecture_9.pdf
  - id: route-icop-l01-cornell-14
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L14 — Introduction to Duality
    format: video
    angle: Motivates duality by asking how to bound the error of a feasible solution before optimization
      has finished.
    angle_detail: Weighted combinations of primal constraints produce upper bounds; choosing the tightest
      such combination becomes another LP. This makes dual variables meaningful before the formal transposition
      recipe. Choose it if a dual currently feels like an arbitrary second problem. L15 proves the bound
      and L16 connects it to simplex.
    covers:
    - knowledge-icop-l01-standard-duality
    depth: intuition
    scope: complementary
    locator: 'Cornell Fundamentals of Linear Programming, Lecture 14: Introduction to Duality'
    url: https://people.orie.cornell.edu/huseyin/lp_course/lp_course.html
  - id: route-icop-l01-cornell-notes-14
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L14 — handwritten notes
    format: course-material
    angle: Builds upper bounds by multiplying and adding primal rows, then writes the best-bound problem
      as the dual.
    angle_detail: Reconstruct how each multiplier changes both objective coefficients and the bound’s
      right-hand side. The calculation explains one dual variable per primal constraint more concretely
      than a sign table. Use it to motivate the certificate, then translate its maximization convention
      to HU’s standard-form minimization pair.
    covers:
    - knowledge-icop-l01-standard-duality
    depth: course-aligned
    scope: complementary
    locator: Cornell Lecture 14 handwritten notes, pdf pp. 1-9
    url: https://people.orie.cornell.edu/huseyin/lp_course/lecture_14.pdf
  - id: route-icop-l01-cornell-15
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L15 — Weak Duality
    format: video
    angle: Proves weak duality as a chain of inequalities between feasible primal and dual objective values.
    angle_detail: The worked argument shows exactly where feasibility and nonnegative coefficients enter,
      then explains why equal feasible values certify both solutions. Use it to get the inequality direction
      right and separate checking a certificate from finding one. The existence of an equal-value optimal
      dual is the additional strong-duality question in L16.
    covers:
    - knowledge-icop-l01-standard-duality
    depth: intuition
    scope: complementary
    locator: 'Cornell Fundamentals of Linear Programming, Lecture 15: Weak Duality'
    url: https://people.orie.cornell.edu/huseyin/lp_course/lp_course.html
  - id: route-icop-l01-cornell-notes-15
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L15 — handwritten notes
    format: course-material
    angle: Writes out the weak-duality inequality and the equal-objective optimality argument for a numerical
      primal–dual pair.
    angle_detail: Annotate each inequality with the constraint or sign that justifies it. This helps catch
      reversed bounds and omitted feasibility checks. It also clarifies the distinction between verifying
      that two feasible points are optimal and proving that an optimal partner must exist.
    covers:
    - knowledge-icop-l01-standard-duality
    depth: course-aligned
    scope: complementary
    locator: Cornell Lecture 15 handwritten notes, pdf pp. 1-9
    url: https://people.orie.cornell.edu/huseyin/lp_course/lecture_15.pdf
  - id: route-icop-l01-cornell-16
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L16 — Strong Duality
    format: video
    angle: Explains why the final simplex objective row already contains an optimal dual solution.
    angle_detail: A worked primal is pivoted to optimality, then the final row is reconstructed as a combination
      of the original rows. Its coefficients give dual multipliers, dual slacks and equal objective values.
      Choose this to connect Kratsch’s yᵀ=c_BᵀA_B⁻¹ formula to ordinary elimination; the example makes
      the certificate visible inside the algorithm.
    covers:
    - knowledge-icop-l01-standard-duality
    depth: intuition
    scope: complementary
    locator: 'Cornell Fundamentals of Linear Programming, Lecture 16: Strong Duality'
    url: https://people.orie.cornell.edu/huseyin/lp_course/lp_course.html
  - id: route-icop-l01-cornell-notes-16
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L16 — handwritten notes
    format: course-material
    angle: Displays the primal pivots and the row-combination calculation that recovers the dual optimum.
    angle_detail: Track the coefficients of the original slack columns through the final objective row,
      then check dual feasibility and equal costs explicitly. These equations are the numerical counterpart
      of the HU optimal-basis certificate and a useful bridge between simplex mechanics and strong duality.
    covers:
    - knowledge-icop-l01-standard-duality
    depth: course-aligned
    scope: complementary
    locator: Cornell Lecture 16 handwritten notes, pdf pp. 1-9
    url: https://people.orie.cornell.edu/huseyin/lp_course/lecture_16.pdf
  - id: route-icop-l01-cornell-17
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L17 — Complementary Slackness
    format: video
    angle: Uses complementary slackness to recover an optimal partner from a known primal solution.
    angle_detail: 'Positive variables and nonzero multipliers force selected partner constraints tight,
      reducing the search to a smaller equation system. The worked proof shows sufficiency by equality
      of feasible objective values. Use the examples for calculation, then Kratsch or Blum for both directions
      of the theorem: the Cornell packet leaves necessity unproved.'
    covers:
    - knowledge-icop-l01-slackness
    depth: intuition
    scope: complementary
    locator: 'Cornell Fundamentals of Linear Programming, Lecture 17: Complementary Slackness'
    url: https://people.orie.cornell.edu/huseyin/lp_course/lp_course.html
  - id: route-icop-l01-cornell-notes-17
    unit_id: unit-icop-l01-linear-programming
    title: Cornell L17 — handwritten notes
    format: course-material
    angle: Works the zero-product conditions into equations that determine an optimal dual partner.
    angle_detail: The handwritten algebra shows how primal and dual feasibility plus vanishing products
      force equal objectives. Use it to practice finding a certificate rather than only checking one.
      For the complete if-and-only-if proof, return to the HU/Blum nonnegative-gap decomposition; the
      companion packet does not explicitly prove the converse.
    covers:
    - knowledge-icop-l01-slackness
    depth: course-aligned
    scope: complementary
    locator: Cornell Lecture 17 handwritten notes, pdf pp. 1-6
    url: https://people.orie.cornell.edu/huseyin/lp_course/lecture_17.pdf
- source_id: source-stanford-cs261-2016
  role: reference
