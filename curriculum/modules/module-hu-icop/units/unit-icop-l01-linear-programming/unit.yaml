id: unit-icop-l01-linear-programming
type: unit
module_id: module-hu-icop
kind: lecture
title: ICOP Chapter 1 — Linear Programming
order: 1
scope: Aram confirmed the whole Kratsch LP chapter, ico_linearprogramming.pdf physical pages 1-129, on
  2026-10-22. This is one chapter unit with nine study sessions, not a claim that it was taught in one
  classroom meeting. Blackboard notes have not been supplied.
status: ready
knowledge_map:
  summary: Model -> convex polyhedron -> feasible basis -> simplex -> primal-dual bounds -> complementary
    slackness, followed by integration.
  nodes:
  - id: knowledge-icop-l01-forms
    title: Model an LP and translate its forms
    summary: Formulate variables, objective and constraints; convert LP forms without changing the represented
      problem.
  - id: knowledge-icop-l01-geometry
    title: See constraints and objectives geometrically
    summary: Connect linear inequalities, convex feasible sets and supporting hyperplanes to global optimality.
    builds_on:
    - knowledge-icop-l01-forms
    concept_ids:
    - concept-convexity
  - id: knowledge-icop-l01-bases
    title: Connect vertices, extreme points and feasible bases
    summary: Turn the geometric vertex condition into independent columns and computable basic feasible
      solutions.
    builds_on:
    - knowledge-icop-l01-geometry
  - id: knowledge-icop-l01-pivots
    title: Derive and carry out a simplex pivot
    summary: Derive reduced costs, an entering direction and the ratio test from the current basis.
    builds_on:
    - knowledge-icop-l01-bases
  - id: knowledge-icop-l01-phase-one
    title: Find a starting basis and handle failure cases
    summary: Construct Phase I and distinguish infeasibility, degeneracy, cycling and running-time claims.
    builds_on:
    - knowledge-icop-l01-pivots
  - id: knowledge-icop-l01-standard-duality
    title: Prove bounds and standard-form duality
    summary: Construct the standard-form dual, prove weak duality and obtain a strong-duality certificate
      from an optimal basis.
    builds_on:
    - knowledge-icop-l01-phase-one
  - id: knowledge-icop-l01-general-duality
    title: Derive dual signs and diagnose primal-dual status
    summary: Derive general dual rules from transformations and classify the possible primal/dual outcomes.
    builds_on:
    - knowledge-icop-l01-standard-duality
  - id: knowledge-icop-l01-slackness
    title: Use complementary slackness as an optimality certificate
    summary: Derive complementary slackness from the primal-dual gap and use it to construct/check an
      optimal partner.
    builds_on:
    - knowledge-icop-l01-general-duality
  - id: knowledge-icop-l01-oral-review
    title: Integrate the chapter and rehearse the oral exam
    summary: Give concise spoken definitions, algorithm explanations and proof ideas, then test transfer
      on a fresh LP.
    builds_on:
    - knowledge-icop-l01-slackness
