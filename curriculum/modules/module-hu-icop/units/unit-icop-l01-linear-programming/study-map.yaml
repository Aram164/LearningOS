- id: stage-icop-l01-geometry
  number: 2
  title: Session 2 — See constraints and objectives geometrically
  status: pending
  objective: Connect linear inequalities, convex feasible sets and supporting hyperplanes to global optimality.
    Recall the existing convexity idea through note-aml-l06-gradient-descent §7; add the LP-specific proof
    and polyhedral structure here. Convexity does not imply a unique optimizer; do not assume uniqueness
    when an objective is constant along a face.
  done_when:
  - Draw a two-variable feasible region and objective level lines; distinguish infeasibility, an unbounded
    objective and a finite optimum.
  - Prove halfspaces and their intersections are convex, then prove that an LP local optimum is global.
  - Explain supporting hyperplanes, faces, vertices, edges and facets; state when the no-interior-optimum
    argument needs a nonzero objective.
  exam_critical: true
  concepts:
  - concept-convexity
  scope_triage: required-now
