- id: stage-icop-l01-pivots
  number: 4
  title: Session 4 — Derive and carry out a simplex pivot
  status: pending
  objective: Derive reduced costs, an entering direction and the ratio test from the current basis. Use
    the matrix derivation first; Blum §8.2 PDF pages 244-245 is optional tableau support. Carry one small
    LP forward into the duality sessions instead of starting a new numerical example every time.
  done_when:
  - Derive x_B=A_B^-1(b-A_N x_N) and the reduced-cost expression; explain the optimality test.
  - Perform one feasible pivot on a small LP, identify the entering/leaving variables, and explain the
    geometric edge and objective improvement.
  - Construct or recognize an improving unbounded ray; state the nondegeneracy assumption behind strict
    improvement and no repeated vertex.
  exam_critical: true
