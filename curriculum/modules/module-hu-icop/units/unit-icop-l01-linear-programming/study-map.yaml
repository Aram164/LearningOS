- id: stage-icop-l01-slackness
  number: 8
  title: Session 8 — Use complementary slackness as an optimality certificate
  status: pending
  objective: Derive complementary slackness from the primal-dual gap and use it to construct/check an
    optimal partner. Cornell L17 supplies examples; its packet does not prove the converse explicitly,
    so complete the proof from Kratsch/Blum. Read the chapter summary on slide 125 and identify how modeling,
    geometry, bases, simplex and dual certificates connect.
  done_when:
  - State complementary slackness with both primal and dual feasibility, and prove both directions using
    the nonnegative gap decomposition.
  - Solve an original small LP, recover a dual candidate from the active/slack constraints, then verify
    all dual constraints and equal objective values.
  - Explain how positive variables and loose inequalities restrict an optimal partner; distinguish necessary
    equalities from a full feasibility check.
