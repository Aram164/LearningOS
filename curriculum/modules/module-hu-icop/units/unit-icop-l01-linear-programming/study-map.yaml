- id: stage-icop-l01-phase-one
  number: 5
  title: Session 5 — Find a starting basis and handle failure cases
  status: pending
  objective: Construct Phase I and distinguish infeasibility, degeneracy, cycling and running-time claims.
    Revisit slide 67 before applying nondegeneracy claims; explain the zero artificial-variable cleanup
    or redundant-row case. Klee-Minty and the Hirsch discussion are context on slides 90-91. Detailed
    smoothed analysis and interior-point papers remain deferred.
  done_when:
  - Build min sum h with Ax+h=b and x,h>=0 after adjusting row signs; prove optimum zero iff the original
    LP is feasible.
  - Answer the questions on slide 87, including why Phase I cannot be unbounded below and how a feasible
    original basis is recovered.
  - Explain the determinant/Cramer-rule bit-size argument on slide 89 and distinguish pivot cost from
    potentially exponential pivot count.
  exam_critical: true
  concepts: []
