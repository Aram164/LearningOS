- id: stage-icop-l01-bases
  number: 3
  title: Session 3 — Connect vertices, extreme points and feasible bases
  status: pending
  objective: 'Turn the geometric vertex condition into independent columns and computable basic feasible
    solutions. Distinguish independent support columns from a full m-column basis; a degenerate BFS may
    have fewer than m positive coordinates. Answer the question on slide 55: standard-form nonempty feasible
    polyhedra have vertices; arbitrary LP polyhedra need not.'
  done_when:
  - For a small standard-form system, solve all candidate bases A_B x_B=b and reject singular or infeasible
    candidates.
  - Explain all directions of the vertex/extreme-point/basic-feasible-solution equivalence using the deck
    proof.
  - Reconstruct the support-reduction argument for an optimal vertex and explain why exhaustive basis
    enumeration is exponential.
  exam_critical: true
  concepts: []
