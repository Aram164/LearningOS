- id: stage-icop-l01-forms
  number: 1
  title: Session 1 — Model an LP and translate its forms
  status: pending
  objective: Formulate variables, objective and constraints; convert LP forms without changing the represented
    problem. Read the deck framing on pages 1-5; work pages 6-23. Kratsch canonical means min c^T x with
    Ax<=b and x>=0; standard means Ax=b and x>=0. Do not carry names across textbooks without checking
    the equations.
  done_when:
  - Formulate the shortest-path LP on slide 23 for a small directed graph, and explain each variable and
    constraint.
  - Convert it to both Kratsch canonical and standard form; reconstruct an original feasible solution
    and its objective from the transformed variables.
  - Explain unrestricted-variable splitting, slack variables, and max/min sign changes without notes.
  exam_critical: true
