- id: stage-icop-l01-standard-duality
  number: 6
  title: Session 6 — Prove bounds and standard-form duality
  status: pending
  objective: Construct the standard-form dual, prove weak duality and obtain a strong-duality certificate
    from an optimal basis. Use Cornell L14 then L15 for examples and L16 for the simplex-to-duality connection.
    Keep the optimal-basis/nonnegative-reduced-cost qualification when discussing degenerate solutions.
  done_when:
  - Derive max y^T b subject to y^T A<=c^T for the standard-form minimization primal, explaining why y
    is unrestricted.
  - Prove weak duality and verify a feasible primal/dual pair with equal objectives; explain exactly what
    the equality certifies.
  - Explain the strong-duality proof using y^T=c_B^T A_B^-1 and nonnegative reduced costs at an optimal
    basis.
  exam_critical: true
  concepts: []
  scope_triage: required-now
