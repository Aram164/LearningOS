    angle_detail: 'Three chapters of solved items whose common shape is: here is a PMF or density, produce E[X],
      Var(X), and a transformed variable''s moments. That repetition is the point — L06''s linearity and transformation
      rules are only usable once applying them is automatic. Ch 7''s items are the Tschebyscheff and LLN calculations,
      which are short and worth doing because they are the easiest marks in this part of the exam.'
  - unit_id: unit-m2-sad-l07
    title: Arbeitsbuch Chapter 5 — distribution drills
    format: exercise
    angle: 'Model-identification drill: each item describes a situation and leaves you to name the distribution
      before computing anything.'
    covers:
    - knowledge-sad-l07-model-selection
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-hypergeometric
    - knowledge-sad-l07-poisson
    depth: practice
    scope: complementary
    locator: Ch 5 Aufgaben pdf pp. 96-104, Lösungen pdf pp. 105-123 (the Verteilungsmodell items)
    angle_detail: The examinable difficulty in L07 is choosing between Binomial, Hypergeometrisch, Geometrisch
      and Poisson from a word problem — once chosen, the arithmetic is a formula lookup. These items are written
      so that the choice is the work, and the solutions justify the choice rather than jumping to the formula.
      Do them mixed rather than in blocks; solving ten Binomial questions in a row trains nothing about identification.
  - unit_id: unit-m2-sad-l08
    title: Arbeitsbuch Chapters 6–7 — Normal and CLT drills
    format: exercise
    angle: Normal-table lookups and CLT approximations worked to the digit, including the continuity correction.
    covers:
    - knowledge-sad-l08-standardization
    - knowledge-sad-l08-clt
    - knowledge-sad-l08-approximation
    depth: practice
    scope: complementary
    locator: Ch 6 Aufgaben pdf pp. 124-133, Lösungen pdf pp. 134-157; Ch 7 Aufgaben pdf pp. 158-160, Lösungen
      pdf pp. 161-164
    angle_detail: 'Two mechanical skills decide the L08 questions: reading Φ in both directions, and knowing when
      a Binomial may be replaced by a Normal and what the ±0.5 correction does to the answer. Both are drilled
      here with full arithmetic, so a wrong answer can be traced to the exact step. Ch 7''s approximation items
      are the ones to prioritise if time is short.'
  - unit_id: unit-m2-sad-l09
    title: Arbeitsbuch Chapter 9 — estimation drills
    format: exercise
    angle: Confidence intervals computed under all three regimes — known sigma, unknown sigma, proportions — with
      the choice justified each time.
    covers:
    - knowledge-sad-l09-properties
    - knowledge-sad-l09-standard-error
    - knowledge-sad-l09-z-interval
    - knowledge-sad-l09-t-interval
    depth: practice
    scope: complementary
    locator: Ch 9 Aufgaben pdf pp. 180-187, Lösungen pdf pp. 188-199
    angle_detail: The recurring L09 exam failure is using z where t belongs, or the wrong standard-error formula
      for a proportion. These solutions state the regime check before every computation, so the habit being trained
      is the check rather than the substitution. Also includes sample-size determination items, which the lecture
      treats lightly but which are cheap marks when they appear.
  - unit_id: unit-m2-sad-l10
    title: Arbeitsbuch Chapters 10–11 — testing drills
    format: exercise
    angle: 'Complete test write-ups in German exam form: hypotheses, statistic, critical value, decision, sentence.'
    covers:
