- source_id: source-3b1b-bayes-theorem
  role: intuition
  why: The L01 medical-test example is exactly the base-rate picture these videos animate; visual support for
    why sensitivity and posterior probability come apart when the positive class is rare.
  priority: 32
  unit_routes:
  - unit_id: unit-m2-sad-l01
    title: 3Blue1Brown — Bayes' theorem and the medical-test paradox
    format: video
    angle: Turns the base-rate problem into an area picture, so the answer is seen before it is computed.
    covers:
    - knowledge-sad-l01-classification
    - knowledge-sad-l01-base-rates
    depth: intuition
    scope: complementary
    locator: '''Bayes theorem, the geometry of changing beliefs'' (≈15 min); ''The medical test paradox, and redesigning
      Bayes'' rule'' (≈21 min)'
    url: https://www.youtube.com/playlist?list=PLk4N6AFvLWe3xCHuOs0siWp0q2F43Cslh
    angle_detail: L01 introduces base rates through a medical-test example and asserts the counterintuitive answer.
      The first video builds a rectangle whose areas are the four cells of the joint distribution, and the posterior
      becomes a visible ratio of two areas — at which point the answer stops being surprising. The second video
      is the medical-test case itself and argues for thinking in odds and Bayes factors, which is a genuinely
      different representation from the lecture's. Watch before the algebra in L04, not after.
  - unit_id: unit-m2-sad-l04
    title: 3Blue1Brown — the geometry behind conditional probability and Bayes
    format: video
    angle: The three-minute proof recovers the formula from the same picture — read it after the geometry, never
      instead of it.
    covers:
    - knowledge-sad-l04-conditional
    - knowledge-sad-l04-bayes
    depth: intuition
    scope: complementary
    locator: '''Bayes theorem, the geometry of changing beliefs'' (≈15 min); ''The quick proof of Bayes'' theorem''
      (≈3 min); optionally ''The medical test paradox'''
    url: https://www.youtube.com/playlist?list=PLk4N6AFvLWe3xCHuOs0siWp0q2F43Cslh
    angle_detail: 'The pairing is the point: the long video makes the result obvious geometrically and the short
      one shows that the algebraic identity is just that picture written down. Doing them in that order means
      L04''s formula arrives as a summary of something already understood. Reversing the order wastes both. Neither
      video covers total probability as a separate result — for that, Fahrmeir §4.6.'
