- source_id: source-domingos-useful-things
  role: optional-depth
  why: One concise reading on generalization, overfitting, data, and inductive bias for the L11 framing.
  priority: 33
  unit_routes:
  - unit_id: unit-m2-sad-l11
    title: Domingos — A Few Useful Things to Know About Machine Learning
    format: paper
    angle: Nine pages of practitioner judgment — that generalization is the goal, that data beats cleverness,
      that overfitting has many faces.
    covers:
    - knowledge-sad-l11-representation
    - knowledge-sad-l11-objectives
    - knowledge-sad-l11-generalization
    depth: intuition
