type: module-source-map
module_id: module-hu-m2-statistik-analysis
sources:
- source_id: source-analysis-skript
  role: course-material
  why: 'Primary authority chosen by the learner: the 2025 HU script defines notation, chapter order, scope labels,
    theorem statements, examples, and the closest current HU exercise sets.'
  priority: 0
  unit_routes:
  - unit_id: unit-m2-analysis-exam-prep
    title: unser skript.pdf — the scope authority
    format: course-material
    angle: Hella Rabus's own script (Stand 04.02.2025) and the only thing that defines what is examinable. Its
      course contract (pp. iv-vii) states proofs need not be memorized — which is why definitions, theorem conditions/results
      and application drive every other choice on this menu. Wiederholung required; Ausflug is exam-light context;
      Exkurs and Chapter 8 are outside exam scope.
    covers:
    - knowledge-an-foundations
    - knowledge-an-sequences
    - knowledge-an-series
    - knowledge-an-limits-continuity
    - knowledge-an-exp-log-uniform
    - knowledge-an-differentiation
    - knowledge-an-taylor
    - knowledge-an-integration
    - knowledge-an-proof-presentation
    depth: course-aligned
    scope: current
    locator: unser skript.pdf Chapters 1-7 (contents pp. ii-iii, contract pp. iv-vii)
  - unit_id: unit-m2-analysis-exam-prep
    title: HU exercise series 05-09 + WV
    format: exercise
    angle: 'The only tasks calibrated to this script and this examiner, in HU notation. These come BEFORE any
      external bank — external sheets are other examiners asking differently. Known boundary: the local set stops
      at §5.5, so there is no HU sheet for differentiation, Taylor or integration; every Ch 6-7 drill on this
      menu is a substitute, and the 2026-08-03 audit recorded this as unresolved pending Moodle.'
    covers:
    - knowledge-an-foundations
    - knowledge-an-sequences
    - knowledge-an-series
    - knowledge-an-limits-continuity
    - knowledge-an-exam-transfer
    depth: practice
    scope: current
    locator: ana_inf_serie05.pdf (completeness, recursion, sup/inf), serie06 (epsilon-N, accumulation points),
      serie07 (Heron, monotone/recursive sequences), Pd3szO-ana_inf_serie08.pdf (series tests, function limits
      — Serie 08 exists only under this download-mangled name), serie09 (continuity, improper limits, continuous
      extension), ana_inf_serieWV.pdf (WV1.1-WV1.4, exam-format, 30-45 min per problem)
  - unit_id: unit-m2-combined-exam-rehearsal
    title: Analysis scope and correction authority
    format: course-material
    angle: Provides the Analysis coverage boundary, notation, theorem conditions, and exact correction source
      after a combined mock.
    covers:
    - knowledge-m2-joint-blueprint
    - knowledge-m2-joint-simulation
    depth: course-aligned
    scope: current
    locator: unser skript.pdf Chapters 1-7, course contract, and matching HU exercise
- source_id: source-sad-ss26-lectures
  role: course-material
  why: The fifteen current SoSe 2026 decks are the non-negotiable lecture and exam scope.
  priority: 0
  unit_routes:
  - unit_id: unit-m2-sad-l01
    title: Current L01 introduction deck
    format: course-material
    angle: The scope authority for L01 and the only place the course's own framing of the module appears.
    covers:
    - knowledge-sad-l01-data-questions
    - knowledge-sad-l01-location
    - knowledge-sad-l01-distributions
    - knowledge-sad-l01-sampling-context
    - knowledge-sad-l01-classification
    - knowledge-sad-l01-base-rates
    - knowledge-sad-l01-course-map
    depth: course-aligned
    scope: current
    locator: lecture-slides/01_introduction.pdf, 42 slides
    angle_detail: 'Everything in L01 is demonstrated on a single study-duration dataset, which is the deck''s
      pedagogical device and also its limitation: each idea appears once, in one context, and is not revisited.
      Treat it as the definition of what is in scope and the source of the notation, and use the supporting routes
      on this stage for the second and third encounters the deck does not provide. The classification-metrics
      and base-rate slides at the end preview L04 and L11 rather than belonging to L01''s own material.'
  - unit_id: unit-m2-sad-l02
    title: Current L02 basic-concepts deck
    format: course-material
    angle: Fixes the exact vocabulary and calculation conventions the rest of the course and the exam use.
    covers:
    - knowledge-sad-l02-vocabulary
    - knowledge-sad-l02-scales
    - knowledge-sad-l02-frequencies
    - knowledge-sad-l02-location
    - knowledge-sad-l02-dispersion
    - knowledge-sad-l02-simpson
    - knowledge-sad-l02-sampling
    depth: course-aligned
    scope: current
    locator: lecture-slides/02_basics.pdf, 39 slides
    angle_detail: This is the deck to check whenever a definition is in dispute — including the variance divisor,
      which differs between textbooks and is settled here for this course. The Simpson's-paradox and sampling-bias
      slides at the end are conceptually the most demanding part and get the least time; OpenIntro §1.3 and §2.2
      are the elaboration. Nothing in L02 requires probability, so it can be revised independently of everything
      after L03.
  - unit_id: unit-m2-sad-l03
    title: Current L03 correlation and regression deck
    format: course-material
    angle: The course's own path from a scatterplot to the normal equation and gradient descent, in one sitting.
    covers:
    - knowledge-sad-l03-paired-data
    - knowledge-sad-l03-covariance
    - knowledge-sad-l03-interpretation
    - knowledge-sad-l03-simple-regression
    - knowledge-sad-l03-multivariate
    - knowledge-sad-l03-gradient-descent
    - knowledge-sad-l03-scaling-weights
    depth: course-aligned
    scope: current
    locator: lecture-slides/03_correlation_regression.pdf, 48 slides
    angle_detail: 'The deck covers an unusual amount of ground for one lecture: descriptive correlation, simple
      least squares, the multivariate design matrix, the closed-form normal equation and an iterative optimiser.
      The compression is real, and the two places it shows are the matrix notation (assumed) and gradient descent
      (stated, not run). Géron Ch 4 and 3Blue1Brown''s linear-algebra episodes are the routes that repair those
      two specifically. Everything here is examinable.'
  - unit_id: unit-m2-sad-l04
    title: Current L04 probability and Naive Bayes deck
    format: course-material
    angle: Controls the probability notation for the whole module, and builds the categorical Naive Bayes classifier
      that L14 later extends.
    covers:
    - knowledge-sad-l04-framing
    - knowledge-sad-l04-events
    - knowledge-sad-l04-axioms
    - knowledge-sad-l04-conditional
    - knowledge-sad-l04-bayes
    - knowledge-sad-l04-independence
    - knowledge-sad-l04-naive-bayes
    depth: course-aligned
    scope: current
    locator: lecture-slides/04_probability.pdf, 59 slides
    angle_detail: 'The largest deck in the statistics half and the one with the widest span: framing puzzles,
      axioms, conditioning, Bayes, independence, then a full classifier. Its one known gap is slide 46, which
      states Bayes with the total-probability expansion already substituted into the denominator, so the partition
      step is invisible — Fahrmeir §4.6 supplies it and a repository note records the proof. The Naive Bayes construction
      at the end has no exact equivalent in any book here; the deck is authoritative for it.'
  - unit_id: unit-m2-sad-l05
    title: Current L05 combinatorics deck
    format: course-material
    angle: The decision grid — order × replacement × selection size — which is the organising device the exam
      expects you to apply.
    covers:
    - knowledge-sad-l05-decision-grid
    - knowledge-sad-l05-permutations
    - knowledge-sad-l05-variations
    - knowledge-sad-l05-combinations
    - knowledge-sad-l05-repetition
    - knowledge-sad-l05-counting-probability
    - knowledge-sad-l05-identities
    depth: course-aligned
    scope: current
    locator: lecture-slides/05_combinatorics.pdf, 34 slides
    angle_detail: 'The deck''s contribution is the grid itself rather than the individual formulas, which are
      standard. Read it as a classification procedure: identify the cell, then apply the formula that cell names.
      The identities and Stirling slides at the end are stated without justification; Blitzstein §1.5''s story
      proofs are where they become memorable rather than memorised.'
  - unit_id: unit-m2-sad-l06
    title: Current L06 random-variables deck
    format: course-material
    angle: The scope authority for random-variable language, and the deck that introduces PMF, density and CDF
      in a single pass.
    covers:
    - knowledge-sad-l06-random-variable
    - knowledge-sad-l06-distribution-functions
    - knowledge-sad-l06-transformations
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    - knowledge-sad-l06-sample-mean
    - knowledge-sad-l06-concentration
    depth: course-aligned
    scope: current
    locator: lecture-slides/06_random_variables.pdf, 60 slides
    angle_detail: Sixty slides covering random variables, all three distribution functions, transformations, expectation,
      variance, covariance, the sample mean, Chebyshev and the law of large numbers. The single-pass treatment
      of PMF versus density is where most confusion starts — Fahrmeir separates them by chapter and is the standard
      repair. Chebyshev and the LLN at the end are the bridge into L08 and are examinable in their own right.
  - unit_id: unit-m2-sad-l07
    title: Current L07 discrete-distributions deck
    format: course-material
    angle: Defines the identification conditions for the four discrete families, which is what the exam tests
      rather than the formulas.
    covers:
    - knowledge-sad-l07-model-selection
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-hypergeometric
    - knowledge-sad-l07-geometric
    - knowledge-sad-l07-poisson
    - knowledge-sad-l07-relationships
    depth: course-aligned
    scope: current
    locator: lecture-slides/07_discrete_distributions.pdf, 33 slides
    angle_detail: Short deck, high exam density. Each distribution gets its conditions, PMF, moments and a worked
      example, and the final slides state the limit relationships between them. The relationships are asserted;
      Blitzstein §3.9 and §4.8 prove them. If time is short before the exam, the conditions slides are the ones
      to know cold — the formulas are recoverable, the identification is not.
  - unit_id: unit-m2-sad-l08
    title: Current L08 Normal, CLT, and likelihood deck
    format: course-material
    angle: 'Two lectures in one deck: Normal calculations and the CLT, then likelihood and the derivation that
      turns maximum likelihood into least squares.'
    covers:
    - knowledge-sad-l08-normal
    - knowledge-sad-l08-standardization
    - knowledge-sad-l08-transform-sum
    - knowledge-sad-l08-clt
    - knowledge-sad-l08-approximation
    - knowledge-sad-l08-likelihood
    - knowledge-sad-l08-mle
    depth: course-aligned
    scope: current
    locator: lecture-slides/08_normal_distribution.pdf, 38 slides
    angle_detail: The Gaussian-error derivation at the end is the intellectual centre of the statistics half —
      it is where L03's least-squares choice is finally justified — and it arrives after the CLT material when
      attention is lowest. Budget a separate session for the likelihood slides. The LLN-versus-CLT slides are
      the other high-risk part; they are correct but terse. Dekking Ch 13-14 and Ch 21 cover both halves in the
      same notation.
  - unit_id: unit-m2-sad-l09
    title: Current L09 estimation deck
    format: course-material
    angle: The exam-notation authority for estimator properties and the z/t/bootstrap interval formulas.
    covers:
    - knowledge-sad-l09-estimator
    - knowledge-sad-l09-properties
    - knowledge-sad-l09-standard-error
    - knowledge-sad-l09-z-interval
    - knowledge-sad-l09-t-interval
    - knowledge-sad-l09-bootstrap
    - knowledge-sad-l09-data-bias
    depth: course-aligned
    scope: current
    locator: lecture-slides/09_estimating.pdf, 45 slides
    angle_detail: The deck presents properties and intervals together, so the interval formulas can be learned
      without the sampling-distribution reasoning that justifies them — which works until a question varies the
      setup. Fahrmeir §9.2 separates the two deliberately. The final slides on statistical uncertainty versus
      biased data are conceptual, not computational, and are the kind of point that appears as a short written
      question.
  - unit_id: unit-m2-sad-l10
    title: Current L10 hypothesis-testing deck
    format: course-material
    angle: The largest deck in the module and the complete course logic of testing, from null models to multiple
      testing.
    covers:
    - knowledge-sad-l10-test-model
    - knowledge-sad-l10-tails-pvalue
    - knowledge-sad-l10-errors-power
    - knowledge-sad-l10-z-t
    - knowledge-sad-l10-ci-duality
    - knowledge-sad-l10-chi-square
    - knowledge-sad-l10-nonparametric
    - knowledge-sad-l10-multiple
    depth: course-aligned
    scope: current
    locator: lecture-slides/10_testing.pdf, 65 slides
    angle_detail: Sixty-five slides introducing the entire testing vocabulary at once — null model, statistic,
      reference distribution, tails, p-value, both error types, power, z/t, chi-square, nonparametric alternatives,
      confidence-interval duality and multiplicity. The volume is the difficulty. Dekking's two-chapter split
      (Ch 25 essentials, Ch 26 elaboration) is the standard way to take the same content in two passes. Duality
      and multiple testing are both exam-favoured and both sit at the end of the deck.
  - unit_id: unit-m2-sad-l11
    title: Current L11 data-science introduction deck
    format: course-material
    angle: Defines the pipeline vocabulary — task, resampling, objective, metric, generalization — that L12 to
      L15 all assume.
    covers:
    - knowledge-sad-l11-pipeline
    - knowledge-sad-l11-tasks
    - knowledge-sad-l11-representation
    - knowledge-sad-l11-resampling
    - knowledge-sad-l11-objectives
    - knowledge-sad-l11-evaluation
    - knowledge-sad-l11-generalization
    depth: course-aligned
    scope: current
    locator: lecture-slides/11_datascience_intro.pdf, 49 slides
    angle_detail: 'This deck is the hinge of the module: everything before it is statistics, everything after
      is learning algorithms, and it supplies the shared frame. Its concepts are individually simple and collectively
      easy to hold vaguely, which is why the exercise-level routes on this stage (Géron Ch 2-3, ESL §7.10) matter
      more here than usual. Note that the deck''s evaluation metrics extend L01''s confusion matrix rather than
      re-deriving it.'
  - unit_id: unit-m2-sad-l12
    title: Current L12 tree-based learning deck
    format: course-material
    angle: 'The only current tree scope: preference bias, entropy/information gain/ID3, regression splitting,
      pruning, and the four ensemble families.'
    covers:
    - knowledge-sad-l12-tree-model
    - knowledge-sad-l12-entropy-id3
    - knowledge-sad-l12-regression
    - knowledge-sad-l12-pruning
    - knowledge-sad-l12-bagging-forest
    - knowledge-sad-l12-boosting
    - knowledge-sad-l12-stacking
    depth: course-aligned
    scope: current
    locator: lecture-slides/12_tree_based.pdf, 36 slides
    angle_detail: Compact but complete — the deck covers what many courses spread over two lectures. ID3's information-gain
      computation is the examinable calculation; the ensemble section is mostly conceptual comparison. Because
      bagging, random forests, boosting and stacking all arrive on the last slides, they are easy to blur; Géron
      Ch 7 treats each as a separate technique with its own reason to exist.
  - unit_id: unit-m2-sad-l13
    title: Current L13 similarity-based learning deck
    format: course-material
    angle: Scope authority for k-NN and, unusually for an introductory course, for exact and approximate similarity
      indexes.
    covers:
    - knowledge-sad-l13-neighbors
    - knowledge-sad-l13-aggregation
    - knowledge-sad-l13-metrics
    - knowledge-sad-l13-minkowski
    - knowledge-sad-l13-special-measures
    - knowledge-sad-l13-exact-indexing
    - knowledge-sad-l13-lsh
    depth: course-aligned
    scope: current
    locator: lecture-slides/13_similarity_based.pdf, 32 slides
    angle_detail: 'The distance-measure and k-NN half is standard and well covered elsewhere. The indexing half
      — exact search structures and locality-sensitive hashing — is not: it is a database-systems topic that appears
      here because the chair teaches it, and almost no ML textbook on this shelf covers LSH at all. For that part
      the deck is effectively the only source, which makes it unusually important to read closely rather than
      supplement.'
  - unit_id: unit-m2-sad-l14
    title: Current L14 probability-based learning deck
    format: course-material
    angle: Extends L04's categorical classifier to smoothing, numeric attributes and Gaussian/multinomial variants,
      then opens Bayesian networks.
    covers:
    - knowledge-sad-l14-nb-recap
    - knowledge-sad-l14-smoothing
    - knowledge-sad-l14-numeric
    - knowledge-sad-l14-gaussian
    - knowledge-sad-l14-multinomial
    - knowledge-sad-l14-bayes-net
    - knowledge-sad-l14-markov
    depth: course-aligned
    scope: current
    locator: lecture-slides/14_probability_based.pdf, 29 slides
    angle_detail: The shortest deck in the second half, and its last third — Bayesian networks, factorization,
      Markov blankets — is genuinely different material introduced quickly. The Naive Bayes extensions are examinable
      computations; the network material is more likely to be examined conceptually. Marsland Ch 16 is the only
      route here that treats the network half at comparable length.
  - unit_id: unit-m2-sad-l15
    title: Current L15 neural-networks deck
    format: course-material
    angle: Builds from a single neuron to backpropagation and closes with the CNN/RNN/Transformer outlook that
      connects SaD to AML.
    covers:
    - knowledge-sad-l15-neuron
    - knowledge-sad-l15-activation
    - knowledge-sad-l15-output
    - knowledge-sad-l15-forward
    - knowledge-sad-l15-backprop
    - knowledge-sad-l15-training
    - knowledge-sad-l15-universality
    - knowledge-sad-l15-outlook
    depth: course-aligned
    scope: current
    locator: lecture-slides/15_neural_networks.pdf, 38 slides
    angle_detail: The deck's most useful move is starting from the observation that a single neuron with no activation
      is a linear model — which ties L15 back to L03 rather than presenting neural networks as a new subject.
      Backpropagation is stated as the chain rule applied layer by layer; the deck does not run a numeric example,
      which is the gap Karpathy's micrograd and 3Blue1Brown's episode 3 fill. The closing outlook slides are context,
      not exam material.
  - unit_id: unit-m2-sad-clustering
    title: L11 supervised/unsupervised framing
    format: course-material
    angle: Supplies the current lecture definition of unsupervised learning that UE7's clustering topic instantiates;
      it is a framing bridge, not a missing clustering lecture.
    covers:
    - knowledge-sad-clustering-unsupervised
    depth: course-aligned
    scope: complementary
    locator: lecture-slides/11_datascience_intro.pdf supervised/unsupervised section
  - unit_id: unit-m2-sad-exam-prep
    title: Current SaD L01-L15 scope spine
    format: course-material
    angle: Provides the exact 2026 definitions, notation, examples, and topic boundaries for every Statistics
      review stage.
    covers:
    - knowledge-sad-exam-calibration
    - knowledge-sad-exam-descriptive
    - knowledge-sad-exam-regression
    - knowledge-sad-exam-probability
    - knowledge-sad-exam-random-variables
    - knowledge-sad-exam-inference
    - knowledge-sad-exam-workflow
    - knowledge-sad-exam-trees
    - knowledge-sad-exam-similarity
    - knowledge-sad-exam-probabilistic-ml
    - knowledge-sad-exam-neural
    - knowledge-sad-exam-transfer
    depth: course-aligned
    scope: current
    locator: lecture-slides/01_introduction.pdf through 15_neural_networks.pdf
  - unit_id: unit-m2-combined-exam-rehearsal
    title: SaD current-scope correction index
    format: course-material
    angle: Corrects the Statistics half after a combined mock; it does not define the Analysis half or official
      combined weighting.
    covers:
    - knowledge-m2-joint-blueprint
    - knowledge-m2-joint-simulation
    depth: course-aligned
    scope: current
    locator: L01-L15 deck contents and exact matching deck for each error
- source_id: source-professor-leonard
  role: first-exposure
  why: Optional 20-minute intuition unlock before the script for a genuinely new topic; never substitutes for
    the HU definitions or notation.
  priority: 1
  unit_routes:
  - unit_id: unit-m2-analysis-exam-prep
    title: Professor Leonard — Calculus 1/2
    format: video
    angle: Slow blackboard teaching that does the computation in full where the script compresses to a result.
      The angle is pace. Reach for it when a cold diagnostic shows a block — a detour on one topic, not a parallel
      course.
    covers:
    - knowledge-an-sequences
    - knowledge-an-series
    - knowledge-an-limits-continuity
    - knowledge-an-differentiation
    - knowledge-an-taylor
    - knowledge-an-integration
    depth: intuition
    scope: complementary
    locator: 'Topic-matched selections: Calculus 1 (limits and continuity, the derivative, Mittelwertsatz, l''Hospital,
      the definite integral and FTC); Calculus 2 (integration techniques, improper integrals, sequences, series
      and convergence tests, Taylor and power series)'
- source_id: source-sad-uebungen
  role: practice
  why: Current Blatt/UE decks are the closest available guide to expected computations and German wording.
  priority: 1
  unit_routes:
  - unit_id: unit-m2-sad-l01
    title: Blatt 1 and UE2 — data and feature foundations
    format: exercise
    angle: The course's own first exercises — the only material that shows how this chair phrases a question.
    covers:
    - knowledge-sad-l01-data-questions
    - knowledge-sad-l01-location
    - knowledge-sad-l01-sampling-context
    depth: practice
    scope: current
    locator: exercise-slides/Blatt1.pdf; exercise-slides/UE2.pdf, introductory section
    angle_detail: 'Exercise sheets are scope evidence second only to the deck: a topic that appears here is examinable,
      and the phrasing is the closest available match to the Klausur''s. The tutorial slides (UE*) show worked
      solutions, so sheet and tutorial should be used in that order — attempt, then watch. Start every lecture''s
      practice here before touching any external bank.'
  - unit_id: unit-m2-sad-l02
    title: Blatt 1 and UE2 — descriptive-statistics calculations
    format: exercise
    angle: Descriptive-statistics questions in the chair's own phrasing, with the tutorial's worked solutions.
    covers:
    - knowledge-sad-l02-scales
    - knowledge-sad-l02-frequencies
    - knowledge-sad-l02-location
    - knowledge-sad-l02-dispersion
    - knowledge-sad-l02-sampling
    depth: practice
    scope: current
    locator: exercise-slides/Blatt1.pdf; exercise-slides/UE2.pdf
    angle_detail: 'The value is calibration rather than volume: these show how much working is expected and which
      conventions the chair applies (rounding, divisor, how a boxplot is to be drawn). Fahrmeir''s Arbeitsbuch
      supplies the volume once the conventions are known.'
  - unit_id: unit-m2-sad-l03
    title: UE2 and Blatt 2 — correlation and regression practice
    format: exercise
    angle: Shows whether regression is examined by hand computation or by interpretation — which the deck alone
      does not reveal.
    covers:
    - knowledge-sad-l03-paired-data
    - knowledge-sad-l03-covariance
    - knowledge-sad-l03-simple-regression
    - knowledge-sad-l03-scaling-weights
    depth: practice
    scope: current
    locator: exercise-slides/UE2.pdf, correlation and regression section; exercise-slides/blatt-02.pdf
    angle_detail: L03 covers far more than can be examined by hand in a combined three-hour paper, so the exercises
      are the evidence of where the emphasis actually falls. Read them before deciding how much time to spend
      on the matrix and gradient-descent material.
  - unit_id: unit-m2-sad-l04
    title: Blatt 2 and UE3 — probability and Bayes tasks
    format: exercise
    angle: The chair's own conditional-probability and Bayes questions, including how the Naive Bayes construction
      is asked.
    covers:
    - knowledge-sad-l04-events
    - knowledge-sad-l04-axioms
    - knowledge-sad-l04-conditional
    - knowledge-sad-l04-bayes
    - knowledge-sad-l04-naive-bayes
    depth: practice
    scope: current
    locator: exercise-slides/blatt-02.pdf; exercise-slides/UE3.pdf, probability section
    angle_detail: Naive Bayes has no textbook equivalent that matches this deck, so these exercises are the only
      reliable guide to what a classifier question looks like here — whether it asks for a computation over a
      small table or for the assumption to be stated and justified.
  - unit_id: unit-m2-sad-l05
    title: Blatt 2 and UE3 — combinatorics decisions
    format: exercise
    angle: Counting as the chair asks it, which is consistently inside a probability question rather than alone.
    covers:
    - knowledge-sad-l05-decision-grid
    - knowledge-sad-l05-permutations
    - knowledge-sad-l05-variations
    - knowledge-sad-l05-combinations
    - knowledge-sad-l05-counting-probability
    depth: practice
    scope: current
    locator: exercise-slides/blatt-02.pdf, the counting tasks; exercise-slides/UE3.pdf, the counting walkthrough
    angle_detail: Confirms the pattern the external banks also show, and shows which grid cells actually appear.
      Use it to prioritise the Schaum's Ch 2 drill rather than working that chapter uniformly.
  - unit_id: unit-m2-sad-l06
    title: Übungsblatt 3 and UE4 — random variables and moments
    format: exercise
    angle: Expectation and variance computed in the chair's layout, with the tutorial's full working.
    covers:
    - knowledge-sad-l06-distribution-functions
    - knowledge-sad-l06-transformations
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    - knowledge-sad-l06-concentration
    depth: practice
    scope: current
    locator: exercise-slides/Übung-3.pdf; exercise-slides/UE4.pdf
    angle_detail: L06's exam questions are mostly table-driven computations, and these show the expected table
