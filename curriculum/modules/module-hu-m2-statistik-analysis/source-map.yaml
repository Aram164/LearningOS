- source_id: source-kurzes-tutorium-statistik
  role: intuition
  why: German vocabulary and compact exam-style statistics explanations.
  priority: 20
  unit_routes:
  - unit_id: unit-m2-sad-l01
    title: Kurzes Tutorium Statistik — Lagemaße und Streuung
    format: video
    angle: German-language vocabulary for L01's descriptive measures — the words the Klausur will actually use.
    covers:
    - knowledge-sad-l01-location
    depth: orientation
    scope: complementary
    locator: Die Videos 'Lagemaße' und 'Streuungsmaße' (je ≈10 Min)
    angle_detail: The lecture is delivered in English but examined in a German programme, and the exam vocabulary
      (Lagemaß, Streuungsmaß, Merkmalsausprägung, Häufigkeit) is not always introduced on the slides. These videos
      are short and use the terms consistently, which is the cheapest way to close that gap. Content is at Abitur/first-semester
      level — use it for language, not for depth.
  - unit_id: unit-m2-sad-l02
    title: Kurzes Tutorium Statistik — Grundbegriffe and Skalenniveaus
    format: video
    angle: The Skalenniveau hierarchy in German, with the admissible-operations rule stated for each level.
    covers:
    - knowledge-sad-l02-vocabulary
    - knowledge-sad-l02-scales
    - knowledge-sad-l02-location
    - knowledge-sad-l02-dispersion
    depth: orientation
    scope: complementary
    locator: '''Statistische Grundbegriffe''; ''Skalenniveaus''; ''Lagemaße'' und ''Streuungsmaße'''
    angle_detail: Which statistics are permissible on nominal, ordinal, intervall- and verhältnisskalierte data
      is a standard German exam question and is a vocabulary question as much as a conceptual one. These videos
      give the hierarchy and the rule in the exact terms used, in under half an hour total.
  - unit_id: unit-m2-sad-l04
    title: Kurzes Tutorium Statistik — Zufallsexperiment and Bayes basics
    format: video
    angle: Works Bayes through the Vierfeldertafel, in German, which is the presentation German exams use.
    covers:
    - knowledge-sad-l04-events
    - knowledge-sad-l04-axioms
    - knowledge-sad-l04-conditional
    - knowledge-sad-l04-bayes
    depth: orientation
    scope: complementary
    locator: '''Zufallsexperiment und Ereignisse''; ''Bedingte Wahrscheinlichkeit''; ''Satz von Bayes'''
    angle_detail: The four-field table is the standard German exam apparatus for conditional probability, and
      these videos build and read one directly. Combined with the Fahrmeir Arbeitsbuch solutions this covers the
      format completely. Do not use them for the Naive Bayes construction — that is the lecture's own and has
      no German-language equivalent here.
  - unit_id: unit-m2-sad-l06
    title: Kurzes Tutorium Statistik — Zufallsvariablen and Erwartungswert
    format: video
    angle: The German names and notation for L06's objects, with the symbols the Klausur prints.
    covers:
    - knowledge-sad-l06-random-variable
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    depth: orientation
    scope: complementary
    locator: '''Zufallsvariablen''; ''Erwartungswert''; ''Varianz'''
    angle_detail: E(X) versus μ, Var(X) versus σ², and the German phrasing of the linearity rules. Short and purely
      terminological — the concepts should come from Blitzstein or Dekking, but the words should come from here
      if the exam wording has ever cost you time.
  - unit_id: unit-m2-sad-l07
    title: Kurzes Tutorium Statistik — discrete distributions
    format: video
    angle: Names the German distribution vocabulary and the Ziehen-mit/ohne-Zurücklegen phrasing that identifies
      each model in an exam question.
    covers:
    - knowledge-sad-l07-model-selection
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-hypergeometric
    - knowledge-sad-l07-poisson
    depth: orientation
    scope: complementary
    locator: '''Binomialverteilung''; ''Hypergeometrische Verteilung''; ''Poissonverteilung'''
    angle_detail: German exam questions signal the intended distribution through fixed phrases — 'mit Zurücklegen',
      'ohne Zurücklegen', 'in einem festen Zeitintervall'. These videos use exactly those phrases while deriving
      each model, which turns the phrase into a reliable trigger. That mapping is not available in any of the
      English sources.
  - unit_id: unit-m2-sad-l08
    title: Kurzes Tutorium Statistik — Normalverteilung and ZGS
    format: video
    angle: Reads the German z-table layout, which is arranged differently from the tables in the English texts.
    covers:
    - knowledge-sad-l08-normal
    - knowledge-sad-l08-standardization
    - knowledge-sad-l08-clt
    depth: orientation
    scope: complementary
    locator: '''Normalverteilung''; ''Standardnormalverteilung''; ''Zentraler Grenzwertsatz'''
    angle_detail: The Standardnormalverteilung table you will be given is the German layout, and practising lookups
      against an American table is a small but real mismatch. These videos use the German one and read it in both
      directions. Fahrmeir p. 631 is the same table in print.
  - unit_id: unit-m2-sad-l09
    title: Kurzes Tutorium Statistik — Konfidenzintervalle
    format: video
    angle: German terminology for interval estimation — Konfidenzniveau, Vertrauensbereich, Schätzfunktion.
    covers:
    - knowledge-sad-l09-standard-error
    - knowledge-sad-l09-z-interval
    - knowledge-sad-l09-t-interval
    depth: orientation
    scope: complementary
    locator: Die Videos 'Konfidenzintervall' und 'Konfidenzintervall berechnen'
    angle_detail: 'L09''s German vocabulary is denser than most: erwartungstreu, konsistent, effizient, Stichprobenumfang,
      Konfidenzniveau. Having heard the words used in a worked calculation makes the exam phrasing readable at
      speed. Fahrmeir §9.4 is the print equivalent with more depth.'
  - unit_id: unit-m2-sad-l10
    title: Kurzes Tutorium Statistik — Hypothesentests
    format: video
    angle: States the Fehler 1./2. Art distinction in German with the standard table, which is a near-certain
      exam item.
    covers:
    - knowledge-sad-l10-test-model
    - knowledge-sad-l10-tails-pvalue
    - knowledge-sad-l10-z-t
    depth: orientation
    scope: complementary
    locator: '''Hypothesentest''; ''p-Wert''; ''Fehler 1. und 2. Art'''
    angle_detail: Type I and type II errors are asked in almost every German statistics exam and are asked in
      German. The two-by-two table (Entscheidung × Wahrheit) is the answer format, and these videos build it.
      Short; watch alongside the Fahrmeir Arbeitsbuch Ch 10 solutions for the written form.
