- source_id: source-ross-first-course
  role: optional-depth
  why: Proof-heavy depth for L04–L08 only; never a first pass for this exam.
  priority: 13
  unit_routes:
  - unit_id: unit-m2-sad-l04
    title: Ross — formal probability foundations
    format: book
    angle: 'The reference treatment: axioms stated formally, every derived rule proved from them, and independence
      given a full section with counterexamples.'
    covers:
    - knowledge-sad-l04-axioms
    - knowledge-sad-l04-conditional
    - knowledge-sad-l04-bayes
    - knowledge-sad-l04-independence
    depth: advanced-reference
    scope: complementary
    locator: Ch 2 Axioms of Probability, pdf pp. 46-99 (§2.3 axioms; §2.5 sample spaces having equally likely
      outcomes); Ch 3 Conditional Probability and Independence, pdf pp. 100-197 (§3.3 Bayes's Formula; §3.4 Independent
      Events; §3.5 P(·|F) is a Probability)
    angle_detail: 'Ross is the standard rigorous first course, and its value here is completeness rather than
      gentleness. Two things it has that the softer sources do not: §3.4 works through why pairwise independence
      does not imply mutual independence, with an explicit counterexample — the distinction L04''s independence
      node states and the exam can probe; and §3.5 proves that conditioning on a fixed event yields a genuine
      probability measure, which is the formal fact behind every ''just condition and continue'' move. Use it
      to settle a question, not to learn the topic from cold.'
  - unit_id: unit-m2-sad-l05
    title: Ross — combinatorial analysis
    format: book
    angle: The multinomial coefficient and the integer-solutions problem, both of which L05's grid implies but
      does not develop.
    covers:
    - knowledge-sad-l05-permutations
    - knowledge-sad-l05-variations
    - knowledge-sad-l05-combinations
    - knowledge-sad-l05-counting-probability
    depth: advanced-reference
    scope: complementary
    locator: Ch 1 Combinatorial Analysis, pdf pp. 14-45 (§1.2 the basic principle of counting; §1.3 permutations;
      §1.4 combinations; §1.5 multinomial coefficients; §1.6 the number of integer solutions of equations)
    angle_detail: §1.5 generalises the binomial coefficient to partitions into more than two groups — the case
      that appears when a question asks for arrangements of a word with repeated letters, which L05's 'permutations
      with indistinguishable objects' node is exactly about. §1.6 is the stars-and-bars argument stated as counting
      integer solutions, which is the honest form of the 'combinations with repetition' cell in the grid. Together
      these two sections cover the two grid cells that most often go wrong, in about fifteen pages.
  - unit_id: unit-m2-sad-l06
    title: Ross — random-variable theory
    format: book
    angle: Proves the variance identity Var(X) = E[X²] − (E[X])², which is the computational form every exercise
      actually uses.
    covers:
    - knowledge-sad-l06-random-variable
    - knowledge-sad-l06-distribution-functions
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    depth: advanced-reference
    scope: complementary
    locator: Ch 4 Random Variables, pdf pp. 198-305 (§4.3 expected value; §4.4 expectation of a function of a
      random variable; §4.5 variance; §4.10 properties of the cumulative distribution function); Ch 7 §7.2 expectation
      of sums, pdf pp. 478-500
    angle_detail: The definition of variance is an expected squared deviation; almost every calculation uses the
      shortcut identity instead. Ross derives the identity from the definition rather than presenting it as an
      alternative formula, which is worth seeing once so that the shortcut is a theorem you can reconstruct rather
      than a rule you hope you remember. §4.4 is the general expectation-of-a-function rule that L06's transformations
      node needs; §4.10 gives the CDF its own properties list.
  - unit_id: unit-m2-sad-l07
    title: Ross — named discrete distributions
    format: book
    angle: Derives every moment rather than tabulating it, so E[X] and Var(X) for each family can be reconstructed
      instead of recalled.
    covers:
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-hypergeometric
    - knowledge-sad-l07-geometric
    - knowledge-sad-l07-poisson
    - knowledge-sad-l07-relationships
    depth: advanced-reference
    scope: complementary
    locator: Ch 4 Random Variables, pdf pp. 198-305 (§4.6 the Bernoulli and binomial random variables; §4.7 the
      Poisson random variable; §4.8.1 geometric; §4.8.3 hypergeometric)
    angle_detail: Where Fahrmeir tabulates the moments and OpenIntro states them, Ross computes each one from
      the PMF, usually with a slick algebraic step worth learning on its own (the index shift in the binomial
      mean, the derivative trick for the geometric). If the exam permits no formula sheet, being able to rebuild
      one moment from its PMF is a genuine safety net. §4.7.1 also covers computing the distribution function
      without overflow, which is a numerical aside but explains the recursive forms that appear in software.
  - unit_id: unit-m2-sad-l08
    title: Ross — Normal distribution and limit theorems
    format: book
    angle: Proves the CLT, and states Chebyshev, the weak law and the CLT as a single graded sequence of limit
      theorems.
    covers:
    - knowledge-sad-l08-normal
    - knowledge-sad-l08-transform-sum
    - knowledge-sad-l08-clt
    depth: advanced-reference
    scope: complementary
    locator: Ch 5 Continuous Random Variables, pdf pp. 306-378 (§5.4 normal random variables; §5.7 the distribution
      of a function of a random variable); Ch 8 Limit Theorems, pdf pp. 617-660 (§8.2 Chebyshev's inequality and
      the weak law; §8.3 the central limit theorem)
    angle_detail: 'Ch 8 is the only route here that gives a proof of the central limit theorem, and more usefully
      it arranges the results as an escalation: Chebyshev bounds the deviation crudely, the weak law turns that
      bound into convergence in probability, and the CLT then describes the exact limiting shape. That ordering
      is the answer to ''why do we need the CLT when we already have Chebyshev'', which the lecture does not address.
      Above SaD''s required level — read it if the LLN/CLT distinction is still unstable after Dekking Ch 13-14.'
