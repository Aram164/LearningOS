  priority: 8
  unit_routes:
  - unit_id: unit-m2-sad-l04
    title: MIT 18.05 — probability notes and solved problems
    format: course
    angle: Reading, in-class problems and solved problem set for the same topic, published together — a complete
      study loop rather than one artifact.
    covers:
    - knowledge-sad-l04-events
    - knowledge-sad-l04-conditional
