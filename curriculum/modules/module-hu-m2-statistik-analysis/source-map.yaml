- source_id: source-karpathy-micrograd
  role: implementation
  why: Karpathy's spelled-out backpropagation video, building an autograd engine from nothing.
  priority: 5
  unit_routes:
  - unit_id: unit-m2-sad-l15
    title: Karpathy — micrograd, backpropagation spelled out
    format: video
    depth: implementation
    scope: complementary
    locator: '''The spelled-out intro to neural networks and backpropagation: building micrograd'' (≈2h25m); the
      derivative and backward-pass segments are the first half'
    covers:
    - knowledge-sad-l15-backprop
    - knowledge-sad-l15-forward
    - knowledge-sad-l15-training
    angle: Writes an autograd engine line by line, so the chain rule becomes a local rule attached to each operation.
    angle_detail: The insight the video delivers is that backpropagation is not a formula for a network — it is
      a small local rule per operation, composed by the graph. Once each node knows how to pass gradient to its
      inputs, networks of any shape work with no new mathematics. That reframing is what makes L15's derivation
      feel inevitable rather than intricate. Long, and requires following along in code to get the benefit; treat
      it as an afternoon, not a lookup.
- source_id: source-nielsen-nndl
  role: first-exposure
