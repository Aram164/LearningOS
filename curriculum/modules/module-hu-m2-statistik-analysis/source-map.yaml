      are the best in any book on this shelf, and the PDF is free from the author's site.
- source_id: source-zedstatistics
  role: intuition
  why: A statistics-focused YouTube channel with a distinctive habit of showing the wrong answer first, which
    suits the descriptive and inference lectures.
  priority: 7
  unit_routes:
  - unit_id: unit-m2-sad-l02
    title: zedstatistics — descriptive statistics and data types
    format: video
    depth: intuition
    scope: complementary
    locator: The descriptive-statistics videos (measures of centre, measures of spread, types of data), ≈10-15
      min each
    covers:
    - knowledge-sad-l02-scales
    - knowledge-sad-l02-location
    - knowledge-sad-l02-dispersion
    angle: Explains what each summary measure hides, not only what it reports — the reason a lecture needs more
      than one of them.
    angle_detail: 'Zeltzer''s recurring move is to show two visibly different datasets with the same mean, or
      the same standard deviation, and ask what the summary failed to capture. That framing answers the question
      L02 provokes but does not address: why so many measures for one dataset. Useful before the Fahrmeir drill,
      because it gives the definitions a purpose.'
  - unit_id: unit-m2-sad-l09
    title: zedstatistics — confidence intervals
    format: video
    depth: intuition
    scope: complementary
    locator: The confidence-interval videos (interpretation, construction, and the t-distribution), ≈15-20 min
      each
    covers:
    - knowledge-sad-l09-standard-error
    - knowledge-sad-l09-z-interval
    - knowledge-sad-l09-t-interval
    angle: Opens with the standard misinterpretation stated plainly, then dismantles it — which is more memorable
      than stating the correct version first.
    angle_detail: 'Most treatments give the correct interpretation and warn against the wrong one in a footnote.
      Zeltzer inverts it: he states the tempting reading (''95% chance the parameter is in here''), shows with
      repeated sampling why it cannot be right, and only then gives the correct one. Since the misinterpretation
      is the examinable point, attacking it directly is the better route.'
  - unit_id: unit-m2-sad-l10
    title: zedstatistics — hypothesis testing and p-values
    format: video
    depth: intuition
    scope: complementary
    locator: The hypothesis-testing and p-value videos, ≈15-25 min each
    covers:
    - knowledge-sad-l10-test-model
    - knowledge-sad-l10-tails-pvalue
    - knowledge-sad-l10-errors-power
    angle: Treats the p-value as a conditional probability and keeps naming what it is conditioned on, which is
      where most confusion lives.
    angle_detail: '''Probability of data this extreme GIVEN the null is true'' — the conditioning clause is the
      whole content, and it is the clause that gets dropped when the definition is recited. The videos repeat
      it every time the quantity is used, which is a small pedagogical choice with a large effect. Pairs well
      with OpenIntro §5.3''s randomisation construction.'
- source_id: source-bishop-prml
  role: reference
  why: Pattern Recognition and Machine Learning — the classical Bayesian reference behind L14.
  priority: 8
  unit_routes:
  - unit_id: unit-m2-sad-l14
    title: Bishop Ch 8 — graphical models and conditional independence
    format: book
    depth: advanced-reference
    scope: complementary
    locator: Ch 8 'Graphical Models' §8.1 Bayesian networks, §8.2 conditional independence (including d-separation),
      §8.3.6 the Markov blanket
    covers:
    - knowledge-sad-l14-bayes-net
    - knowledge-sad-l14-markov
    - knowledge-sad-l14-nb-recap
    angle: Gives the graphical criterion (d-separation) for reading conditional independence off a network, which
      L14 states only for the naive case.
    angle_detail: L14 introduces Bayesian networks and asserts that the graph encodes conditional independence.
      §8.2 supplies the actual rule for reading it — which paths block information and which do not — with the
      three canonical three-node cases worked through. That is the difference between recognising a network and
      being able to use one. §8.3.6 defines the Markov blanket precisely, which L14's last slides name. Free PDF
      from Microsoft Research; reference-level and demanding.
