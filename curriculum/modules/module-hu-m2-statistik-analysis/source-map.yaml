  - unit_id: unit-m2-sad-l15
    title: Nielsen Ch 4 — the visual proof of universal approximation
    format: book
    depth: intuition
    scope: complementary
    locator: Ch 4 'A visual proof that neural nets can compute any function' (complete chapter, interactive figures)
    covers:
    - knowledge-sad-l15-universality
    - knowledge-sad-l15-activation
    angle: Constructs the approximation by hand — step functions built from sigmoid pairs, then summed into any
      shape.
    angle_detail: 'L15 states the universal approximation theorem. This chapter shows you how to build the approximation:
      push a sigmoid''s weight up until it becomes a step, pair two steps into a bump, then sum bumps to trace
      any curve. It is a construction rather than an existence proof, so it is genuinely convincing, and the interactive
      figures let you set the parameters yourself. The best hour available on L15''s universality node.'
