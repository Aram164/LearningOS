- source_id: source-schaums-probability
  role: practice
  why: Additional worked calculations for L04–L08 when course and Fahrmeir exercises are exhausted.
  priority: 14
  unit_routes:
  - unit_id: unit-m2-sad-l04
    title: Schaum — probability and Bayes worked problems
    format: exercise
    angle: 'Pure volume: dozens of short solved problems per chapter, sorted by difficulty, with no exposition
      to read around them.'
    covers:
    - knowledge-sad-l04-axioms
    - knowledge-sad-l04-conditional
    - knowledge-sad-l04-bayes
    - knowledge-sad-l04-independence
    depth: practice
    scope: complementary
    locator: Ch 3 Introduction to Probability, pdf pp. 40-55; Ch 4 Conditional Probability and Independence, pdf
      pp. 56-75 (every problem carries a full worked solution)
    angle_detail: Schaum's is a problem book with the theory compressed into a two-page summary at each chapter
      head. That makes it the wrong first exposure and the right thing to open when the concept is understood
      and the calculation is not yet automatic — the state most students are in a week before the Klausur. The
      problems are short enough to do in batches of ten, and every one is solved in full. This is a scanned older
      edition, so notation occasionally differs from the lecture's; treat the deck as authoritative where they
      disagree.
  - unit_id: unit-m2-sad-l05
    title: Schaum — combinatorics drills
    format: exercise
    angle: Twenty-two pages that are almost entirely solved counting problems — the highest drill density for
      L05 on the shelf.
    covers:
    - knowledge-sad-l05-decision-grid
    - knowledge-sad-l05-permutations
    - knowledge-sad-l05-variations
    - knowledge-sad-l05-combinations
    - knowledge-sad-l05-counting-probability
    depth: practice
    scope: complementary
    locator: Ch 2 Techniques of Counting, pdf pp. 18-39
    angle_detail: L05 is the lecture where practice volume beats explanation, because the difficulty is pattern
      recognition across many superficially different word problems. This chapter supplies that volume and nothing
      else. Work them in mixed order and force yourself to name the grid cell (ordered/unordered, with/without
      replacement) before computing — the chapter is organised by technique, which otherwise gives the answer
      away.
  - unit_id: unit-m2-sad-l06
    title: Schaum — random-variable and moment drills
    format: exercise
    angle: Expectation, variance and standard deviation computed from tabulated distributions, dozens of times,
      with every arithmetic step shown.
    covers:
    - knowledge-sad-l06-distribution-functions
    - knowledge-sad-l06-transformations
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    depth: practice
    scope: complementary
    locator: Ch 5 Random Variables, pdf pp. 76-106
    angle_detail: Thirty pages of the same operation on different tables. That is exactly right for L06, where
      the concepts are few and the exam risk is a slip in the arithmetic or in reading the distribution table.
      Also covers joint distributions and independence of random variables at the end of the chapter, which supports
      L06's covariance node.
  - unit_id: unit-m2-sad-l07
    title: Schaum — discrete-distribution drills
    format: exercise
    angle: Puts the three named distributions in one chapter with mixed problems, so identification is forced
      rather than given away by the section heading.
    covers:
    - knowledge-sad-l07-model-selection
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-hypergeometric
    - knowledge-sad-l07-geometric
    - knowledge-sad-l07-poisson
    depth: practice
    scope: complementary
    locator: Ch 6 Binomial, Normal and Poisson Distributions, pdf pp. 107-127
    angle_detail: Because the binomial, Normal and Poisson share a chapter here, the end-of-chapter problems are
      mixed, and mixed problems are the only ones that actually train L07's model-selection node — a block of
      ten binomial questions trains substitution, not choice. Includes the binomial-to-Normal and binomial-to-Poisson
      approximation problems that L08 also needs.
  - unit_id: unit-m2-sad-l08
    title: Schaum — Normal and CLT drills
    format: exercise
    angle: Normal-table drill with the approximation conditions and the continuity correction applied problem
      by problem.
    covers:
    - knowledge-sad-l08-standardization
    - knowledge-sad-l08-transform-sum
    - knowledge-sad-l08-clt
    - knowledge-sad-l08-approximation
    depth: practice
    scope: complementary
    locator: Ch 6 Binomial, Normal and Poisson Distributions, pdf pp. 107-127 (the Normal approximation problems)
    angle_detail: The mechanical half of L08 — convert to z, read the table, apply the ±0.5 correction, check
      that np and n(1−p) are large enough — is trained here at volume and nowhere else on the shelf as cheaply.
      No CLT theory and no likelihood; this route is calculation practice only, and should be paired with Dekking
      Ch 13-14 for the reasoning.
