    depth: implementation
    scope: complementary
    locator: Chapter 6, pp. 203-216
    angle_detail: Fourteen pages that grow a tree, visualise it, and then prune it by constraining depth and leaf
      size — the practical form of L12's pruning node, which the deck states as a principle. Because the trees
      are drawn at each stage, the effect of each constraint on the decision boundary is visible rather than described.
      Also demonstrates the instability of trees to small data changes, which is the motivation for the ensembles
      in the next chapter.
  - unit_id: unit-m2-sad-l12
