- source_id: source-mit-18650
  role: optional-depth
  why: Rigorous MLE, parametric inference, testing, goodness-of-fit, and regression-inference extensions.
  priority: 16
  unit_routes:
  - unit_id: unit-m2-sad-l08
    title: MIT 18.650 Lectures 4–5 — maximum likelihood
    format: course
    angle: 'The formal estimation-theory framing of likelihood: identifiability, the Fisher information, asymptotic
      normality of the MLE.'
    covers:
    - knowledge-sad-l08-likelihood
    - knowledge-sad-l08-mle
    depth: advanced-reference
    scope: complementary
    locator: Lectures 4-5 (maximum likelihood estimation, the method of moments); graduate-level treatment, use
      for a diagnosed gap only
    angle_detail: 'This is a mathematical-statistics course and sits well above SaD. It is routed here for one
      situation only: the L08 slides derive the MLE for a specific model and you want to know what the general
      theory guarantees — that the estimator is consistent and asymptotically Normal, and under what conditions.
      Reading it will not help with the exam, and it will cost hours. Reference-only by design.'
  - unit_id: unit-m2-sad-l09
    title: MIT 18.650 Lectures 3–5 — parametric inference
    format: course
    angle: Says what 'efficient' means precisely, via the Cramér-Rao bound that SaD's efficiency node alludes
      to without naming.
    covers:
    - knowledge-sad-l09-estimator
    - knowledge-sad-l09-properties
    - knowledge-sad-l09-standard-error
    depth: advanced-reference
    scope: complementary
    locator: Lectures 3-5 (parametric estimation, confidence intervals, the delta method); graduate-level, reference
      only
    angle_detail: 'L09 says one estimator can be more efficient than another and leaves efficiency comparative.
      18.650 gives the absolute version: there is a variance floor for unbiased estimators, and an estimator attaining
      it is efficient in a precise sense. That is satisfying and entirely optional — nothing in the M2 exam requires
      it. Come here only if the comparative statement bothered you.'
  - unit_id: unit-m2-sad-l10
    title: MIT 18.650 Lectures 7–12 — tests and goodness-of-fit
    format: course
    angle: Derives why the standard tests take the form they do, via the Neyman-Pearson lemma that no SaD material
      mentions.
    covers:
    - knowledge-sad-l10-test-model
    - knowledge-sad-l10-errors-power
    - knowledge-sad-l10-z-t
    - knowledge-sad-l10-chi-square
    depth: advanced-reference
    scope: complementary
    locator: Lectures 7-12 (hypothesis testing, the Neyman-Pearson framework, chi-square and goodness-of-fit tests);
      graduate-level, reference only
    angle_detail: SaD hands you a catalogue of tests and their statistics. Neyman-Pearson answers the question
      the catalogue provokes — where did these particular statistics come from, and in what sense are they the
      best available — by showing that the likelihood ratio is the optimal test statistic for a simple hypothesis
      pair. Genuinely interesting and genuinely out of scope; six lectures.
  - unit_id: unit-m2-sad-l14
    title: MIT 18.650 Bayesian-statistics lectures — context only
    format: course
    angle: Places Naive Bayes inside the Bayesian inference framework it borrows its name from.
    covers:
    - knowledge-sad-l14-nb-recap
    depth: advanced-reference
    scope: complementary
    locator: 'Lectures 17-18 (Bayesian inference: priors, posteriors, and the Bayesian-frequentist contrast);
      reference only'
    angle_detail: L14's classifier applies Bayes' rule to features but is otherwise a frequentist procedure with
      plug-in estimates. These lectures set out what a genuinely Bayesian treatment would be — a prior over parameters,
      a posterior, and prediction by integration — which clarifies exactly how much of 'Bayes' the classifier
      actually uses. Useful for conceptual hygiene, not for the exam.
