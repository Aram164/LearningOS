    angle_detail: 'The evaluation chapter as a drill: confusion matrix (p. 118), precision/recall trade-off (p.
      121), ROC and AUC (pp. 117, 126), and then the multiclass and multilabel extensions (pp. 128, 134) that
      L11 names but does not work through. The precision-recall trade-off curve is the part worth the most attention
      — it makes the threshold an explicit decision rather than a hidden default, which is the conceptual content
      behind class-imbalance questions.'
  - unit_id: unit-m2-sad-l12
    title: Geron Ch 6 - trees you can grow and prune
    format: book
    angle: 'Executes the L12 induction story: impurity-driven splits, the regression criterion, and the regularisation
