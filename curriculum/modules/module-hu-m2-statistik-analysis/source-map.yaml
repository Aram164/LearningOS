- source_id: source-kelleher-fmlpda
  role: spine
  why: Course-named primary text; Chapters 4–7 map directly to trees, similarity, probability-based learning,
    and neural nets.
  priority: 3
  unit_routes:
  - unit_id: unit-m2-sad-l03
    title: Kelleher Chapter 7 — error surfaces and gradient descent
    format: book
    angle: Draws the error surface as a landscape and walks gradient descent across it, which is the picture L03's
      optimiser slides assume.
    covers:
    - knowledge-sad-l03-gradient-descent
    - knowledge-sad-l03-scaling-weights
    depth: intuition
    scope: complementary
    locator: Ch 7 Error-based Learning, pdf pp. 351-424 (the error surface and gradient-descent sections)
    angle_detail: Kelleher's treatment of least squares is unusual in starting from the shape of the error function
      over the parameter space — a bowl, with the fitted line at its bottom — before any update rule. Once that
      surface is in view, gradient descent is obviously a descent and the learning rate is obviously a step size,
      which is the intuition L03 states in words. The chapter also covers multivariable weights consistently with
      the deck's notation.
  - unit_id: unit-m2-sad-l11
    title: Kelleher — predictive-analytics workflow framing
    format: book
    angle: Frames the whole pipeline as a business problem being converted into an analytics problem — the step
      before L11's pipeline starts.
    covers:
    - knowledge-sad-l11-pipeline
    - knowledge-sad-l11-tasks
    - knowledge-sad-l11-representation
    - knowledge-sad-l11-objectives
    - knowledge-sad-l11-evaluation
    depth: orientation
    scope: complementary
    locator: Ch 1 Machine Learning for Predictive Data Analytics, pdf pp. 36-56; Ch 2 Data to Insights to Decisions,
      pdf pp. 57-91; Ch 8 Evaluation, pdf pp. 425-490
    angle_detail: 'Ch 2 is about deciding what to predict at all: converting a stated goal into a target feature,
      choosing the analytics base table, and confronting the fact that the available data may not support the
      question. L11 begins one step later, with the data already framed. That earlier step is where most real
      projects fail and it is the part of the pipeline the lecture treats as given. Ch 8 then covers evaluation
      designs — hold-out, cross-validation, the choice of metric per task — at more length than the deck.'
  - unit_id: unit-m2-sad-l12
    title: Kelleher Chapter 4 — information-based learning
    format: book
    angle: Runs one ID3 example completely, computing every entropy and every gain by hand across all splits.
    covers:
    - knowledge-sad-l12-tree-model
    - knowledge-sad-l12-entropy-id3
    - knowledge-sad-l12-pruning
    - knowledge-sad-l12-bagging-forest
    - knowledge-sad-l12-boosting
    depth: course-aligned
    scope: complementary
    locator: Ch 4 Information-based Learning, pdf pp. 156-214 (§4.2.3 the ID3 algorithm; the entropy and information-gain
      worked example)
    angle_detail: L12 states the information-gain formula and shows a resulting tree. Kelleher computes the entropy
      of the target, then the remainder for each candidate feature, then the gain, then recurses — with the arithmetic
      printed at every node. That is exactly the calculation an exam will ask for on a small table, and doing
      it once with a fully worked reference is worth more than reading the formula ten times. The chapter also
      covers the gain-ratio correction for many-valued features, which the deck mentions in passing.
  - unit_id: unit-m2-sad-l13
    title: Kelleher Chapter 5 — similarity-based learning
    format: book
    angle: Shows the decision boundary of a nearest-neighbour classifier as a Voronoi tessellation, which explains
      k's role geometrically.
    covers:
    - knowledge-sad-l13-neighbors
    - knowledge-sad-l13-aggregation
    - knowledge-sad-l13-metrics
    - knowledge-sad-l13-minkowski
    - knowledge-sad-l13-special-measures
    depth: course-aligned
    scope: complementary
    locator: Ch 5 Similarity-based Learning, pdf pp. 215-281 (§5.2.2 the nearest-neighbour algorithm; the feature-space
      and normalisation sections)
    angle_detail: 'The Voronoi picture makes two L13 facts visible at once: why 1-NN produces jagged boundaries
      that follow noise, and why increasing k smooths them. Kelleher also treats feature normalisation as part
      of the algorithm rather than as preprocessing, which matches L13''s insistence that distance is meaningless
      across unscaled features. Does not cover indexing or LSH — for that half of L13 the deck is effectively
      alone.'
  - unit_id: unit-m2-sad-l14
    title: Kelleher Chapter 6 — probability-based learning
    format: book
    angle: Covers Naive Bayes and Bayesian networks in one chapter, so the classifier is visibly the simplest
      network rather than a separate method.
    covers:
    - knowledge-sad-l14-nb-recap
    - knowledge-sad-l14-smoothing
    - knowledge-sad-l14-numeric
    - knowledge-sad-l14-gaussian
    depth: course-aligned
    scope: complementary
    locator: Ch 6 Probability-based Learning, pdf pp. 282-350 (§6.4.2 the Naive Bayes model; the smoothing and
      continuous-feature sections)
    angle_detail: L14 introduces Naive Bayes and then, separately, Bayesian networks, and the connection between
      them is asserted late. Kelleher builds the network formalism first and derives Naive Bayes as the network
      in which every feature depends only on the class — at which point the 'naive' assumption is a graph statement
      rather than an algebraic convenience. That is the cleanest available account of L14's structure. Smoothing
      and the continuous-feature handling are worked with numbers.
  - unit_id: unit-m2-sad-l15
    title: Kelleher Chapter 7 — error-based learning and neural networks
    format: book
    angle: Arrives at neural networks by extending the linear model of L03 rather than by starting over — the
      same route L15's first slides take.
    covers:
    - knowledge-sad-l15-neuron
    - knowledge-sad-l15-activation
    - knowledge-sad-l15-forward
    - knowledge-sad-l15-backprop
    - knowledge-sad-l15-training
    depth: course-aligned
    scope: complementary
    locator: Ch 7 Error-based Learning, pdf pp. 351-424 (the multi-layer network and backpropagation sections)
    angle_detail: Because Kelleher's Ch 7 is one continuous argument from simple linear regression to multi-layer
      networks, the continuity L15 asserts on its opening slide (a neuron without an activation is a linear model)
      is the chapter's actual structure. Reading it in order makes backpropagation feel like the same gradient
      descent applied through more layers, which is the correct impression and not the one a standalone treatment
      gives.
  - unit_id: unit-m2-sad-exam-prep
    title: Kelleher — SaD machine-learning companion
    format: book
    angle: Provides course-named explanations for workflow, trees, similarity, probabilistic learning, and neural
      networks at the SaD level.
    covers:
    - knowledge-sad-exam-regression
    - knowledge-sad-exam-workflow
    - knowledge-sad-exam-trees
    - knowledge-sad-exam-similarity
    - knowledge-sad-exam-probabilistic-ml
    - knowledge-sad-exam-neural
    depth: course-aligned
    scope: complementary
    locator: Workflow selections and Chapters 4-7, topic matched
  - unit_id: unit-m2-sad-l14
    title: Kelleher Ch 6 exercises - Gaussian Naive Bayes worked on data
    format: exercise
    angle: L14 slides 14-18 introduce continuous features and density estimation but the current UE6 sheet stops
      at the discrete classifier; exercise 3 asks for a naive Bayes model that uses probability density functions
      with normally distributed features and then a prediction from it, which is the only registered drill for
      the Gaussian variant.
    covers:
    - knowledge-sad-l14-gaussian
    depth: practice
    scope: complementary
    locator: 'Section 6.7 exercises, pp. 344-350 (exercise 3: naive Bayes with normally distributed descriptive
      features)'
    angle_detail: 'The Gaussian Naive Bayes exercise on pp. 344-350 — exercise 3 in particular — is the worked
      numeric-attribute case L14 needs and the chapter body only sketches: fit a Normal per class per feature,
      evaluate the densities at the query point, multiply, compare. Having the full solution means the arithmetic
      can be checked step by step, which matters because the density values are not probabilities and the intermediate
      numbers look wrong the first time.'
