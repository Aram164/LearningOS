- source_id: source-ng-coursera
  role: first-exposure
  why: The classic introductory ML course; still the gentlest available treatment of gradient descent and the
    bias-variance material.
  priority: 7
  unit_routes:
  - unit_id: unit-m2-sad-l03
    title: Ng — linear regression and gradient descent lectures
    format: course
    depth: intuition
    scope: complementary
    locator: 'Week 1-2: the linear regression with one variable and multiple variables lectures (cost function,
      gradient descent, learning rate, feature scaling)'
    covers:
    - knowledge-sad-l03-gradient-descent
    - knowledge-sad-l03-scaling-weights
    - knowledge-sad-l03-simple-regression
    angle: Spends a whole lecture on the learning rate alone — too large, too small, and how to tell which you
      have.
    angle_detail: L03 introduces gradient descent with the update rule and a remark that the step size matters.
      Ng devotes separate segments to diagnosing a bad learning rate from the cost curve, and to why feature scaling
      changes how many steps are needed. Those are the two practical facts that make gradient descent usable rather
      than merely definable, and they are the content of L03's scaling-weights node.
  - unit_id: unit-m2-sad-l11
    title: Ng — bias, variance and the evaluation workflow lectures
    format: course
    depth: intuition
    scope: complementary
    locator: 'Week 6: the ''Advice for applying machine learning'' lectures (train/validation/test split, learning
      curves, diagnosing bias vs variance)'
    covers:
    - knowledge-sad-l11-generalization
    - knowledge-sad-l11-resampling
    - knowledge-sad-l11-evaluation
    angle: Turns bias and variance into a diagnostic procedure — read the learning curves, then decide what to
      change.
    angle_detail: 'L11 defines underfitting, overfitting and the bias-variance trade-off. Ng''s week 6 makes them
      actionable: if training and validation error are both high you have bias and more data will not help; if
      they diverge you have variance and more data will. That if-then structure is the most retainable form of
      this material and is exactly what a conceptual exam question about the trade-off is testing.'
