      this stage where the stages are performed rather than described. The specific pages matter: creating a test
      set (p. 80) shows the leakage trap L11 warns about, transformation pipelines (p. 99) shows why preprocessing
      must be fitted on training data only, and cross-validation (p. 102) shows the resampling node in code. Doing
