      reading and slides; Problem Set 2 with its published solutions'
    angle_detail: 18.05 publishes, per class, a reading, the slides used on it, the in-class problems and the
      solutions, plus a problem set with worked answers. That means one topic can be learned, practised and checked
      without leaving the page — the thing a lecture deck alone cannot give you. Its treatment of the base-rate
      fallacy is unusually direct and matches L04's opening framing slides. Written for students who have had
      multivariable calculus, so the register sits above OpenIntro and below Ross.
  - unit_id: unit-m2-sad-l05
    title: MIT 18.05 — counting and finite probability
    format: course
    angle: Treats counting as one week of prerequisite technique, which is a useful calibration of how much of
      L05 is genuinely hard.
    covers:
    - knowledge-sad-l05-decision-grid
    - knowledge-sad-l05-combinations
    - knowledge-sad-l05-counting-probability
    depth: practice
    scope: complementary
    locator: 'Classes: Reading and In-class Materials, Class 1 ''Counting and Sets'' reading and slides; Problem
      Set 1 with solutions'
    angle_detail: 18.05 spends a single class on counting before moving to probability, and its problem set is
      correspondingly compact. Reading it tells you which parts of L05's grid a strong applied course considers
      routine and which it considers worth practising — helpful when deciding how much time this lecture deserves.
      Not a substitute for Blitzstein Ch 1 if the grid itself is the problem.
  - unit_id: unit-m2-sad-l06
    title: MIT 18.05 — random variables, expectation, and variance
    format: course
    angle: Uses R simulations alongside the algebra, so every claimed identity is also demonstrated numerically.
    covers:
    - knowledge-sad-l06-distribution-functions
    - knowledge-sad-l06-transformations
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    depth: practice
    scope: complementary
    locator: 'Classes: Reading and In-class Materials: the ''Discrete Random Variables; Expectation and Variance''
      and ''Continuous Random Variables'' readings; Problem Sets 2-3 with solutions'
    angle_detail: The course's design principle is that a probabilistic claim should be checked by simulation
      before it is trusted, and the R code is published. For L06's rules — linearity, variance under scaling,
      the behaviour of a sample mean — running the simulation is a fast way to find out whether you have remembered
      the rule correctly, and it takes minutes. Also introduces quantiles carefully, which the lecture uses without
      defining.
  - unit_id: unit-m2-sad-l07
    title: MIT 18.05 — discrete-distribution problems
    format: course
    angle: Introduces each discrete family with an explicit R function name beside its formula, tying the mathematics
      to a computation you can run.
    covers:
    - knowledge-sad-l07-model-selection
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-hypergeometric
    - knowledge-sad-l07-geometric
    - knowledge-sad-l07-poisson
    depth: practice
    scope: complementary
    locator: 'Classes: Reading and In-class Materials, the ''Discrete Random Variables'' readings covering Bernoulli,
      binomial, geometric and Poisson; Problem Set 2 with solutions'
    angle_detail: 'Every distribution arrives with its dbinom/pbinom-style counterpart, so a hand computation
      can be checked immediately. That is a small thing that removes a large class of silent errors when practising,
      and it also means the model-selection question can be tested empirically: simulate the described situation,
      compare the histogram with the candidate PMF.'
  - unit_id: unit-m2-sad-l08
    title: MIT 18.05 — Normal and CLT notes/exams
    format: course
    angle: The only route here whose likelihood reading is written specifically to separate likelihood from probability,
      in one page.
    covers:
    - knowledge-sad-l08-normal
    - knowledge-sad-l08-standardization
    - knowledge-sad-l08-clt
    - knowledge-sad-l08-approximation
    depth: practice
    scope: complementary
    locator: 'Classes: Reading and In-class Materials: the ''Central Limit Theorem and the Law of Large Numbers''
      reading and the ''Maximum Likelihood Estimates'' reading; the published exam questions and solutions on
      the Exams page'
    angle_detail: L08's likelihood node turns on one distinction — the same expression read as a function of the
      data versus as a function of the parameter — and 18.05's MLE reading opens with exactly that before any
      optimisation. Combined with the CLT/LLN reading, this covers both halves of L08 with the same notation.
      The Exams page then supplies solved questions of both kinds under timed conditions, which is the closest
      thing on the shelf to an English-language SaD mock.
  - unit_id: unit-m2-sad-l09
    title: MIT 18.05 — estimation and confidence intervals
    format: course
    angle: Teaches bootstrap confidence intervals as a first-class method beside the analytic ones, with runnable
      code.
    covers:
    - knowledge-sad-l09-estimator
    - knowledge-sad-l09-standard-error
    - knowledge-sad-l09-z-interval
    - knowledge-sad-l09-t-interval
    depth: practice
    scope: complementary
    locator: 'Classes: Reading and In-class Materials, the ''Bootstrapping'' reading and the ''Confidence Intervals''
      readings I-III; the corresponding problem sets with solutions'
    angle_detail: Most courses mention the bootstrap; this one builds intervals with it and compares them against
      the z and t intervals on the same data. Seeing the three agree — and seeing where they disagree — is what
      turns L09's bootstrap node from a curiosity into a method with a place. The reading also separates the frequentist
      confidence interval from the Bayesian probability interval explicitly, which prevents the most common interpretation
      error.
  - unit_id: unit-m2-sad-l10
    title: MIT 18.05 — hypothesis-testing notes and solved exams
    format: course
    angle: Splits NHST across three consecutive readings, and closes with an explicit critique of p-values that
      the lecture only gestures at.
    covers:
    - knowledge-sad-l10-test-model
    - knowledge-sad-l10-tails-pvalue
    - knowledge-sad-l10-errors-power
    - knowledge-sad-l10-z-t
    - knowledge-sad-l10-chi-square
    depth: practice
    scope: complementary
    locator: 'Classes: Reading and In-class Materials: the ''Null Hypothesis Significance Testing'' readings (I,
      II, III) and the chi-square reading; the Exams page for solved test questions'
    angle_detail: Reading I sets up the machinery, II adds the error types and power, III covers the multiple-test
      and replication problems including a frank discussion of what a p-value does not tell you. That third part
      is the intellectual content behind L10's multiple-testing node, and it is what makes the difference between
      reciting the false-discovery definition and understanding why the topic is in the lecture at all. Solved
      timed questions on the Exams page.
