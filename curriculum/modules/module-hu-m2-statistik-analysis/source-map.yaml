- source_id: source-stat110
  role: optional-depth
  why: Cherry-pick Units 3–6 for RVs, expectation, distributions, Normal, and CLT; never run as a second full
    course.
  priority: 15
  unit_routes:
  - unit_id: unit-m2-sad-l04
    title: Harvard Stat 110 — conditioning and Bayes lectures
    format: course
    angle: Blitzstein lecturing his own book — the same argument delivered twice, in print and on video.
    covers:
    - knowledge-sad-l04-conditional
    - knowledge-sad-l04-bayes
    - knowledge-sad-l04-independence
    depth: advanced-reference
    scope: complementary
    locator: Lectures 2-4 (conditional probability, Bayes' rule, independence) with the matching sections of the
      Stat 110 strategic-practice sheets and their solutions
    angle_detail: 'This is the video companion to Blitzstein & Hwang, so choosing between them is a format decision
      rather than a content decision: the definitions, notation and examples line up section by section. The lectures
      add the thing the book cannot — hearing which step he considers the difficult one, and watching him refuse
      to write the algebra until the story is clear. The strategic-practice sheets are graded from routine to
      hard with full solutions.'
  - unit_id: unit-m2-sad-l05
    title: Harvard Stat 110 — strategic counting
    format: course
    angle: Contains the story-proof demonstrations performed live, which is where that technique is easiest to
      pick up.
    covers:
    - knowledge-sad-l05-decision-grid
    - knowledge-sad-l05-combinations
    - knowledge-sad-l05-counting-probability
    depth: advanced-reference
    scope: complementary
    locator: Lecture 1 (sample spaces, naive definition, counting) and Lecture 2 (story proofs, non-naive definition);
      Strategic Practice 1 with solutions
    angle_detail: A story proof is a way of arguing, and watching one being constructed is more instructive than
      reading a finished one — the moment where he chooses what set to count twice is the whole method. Two lectures
      cover all of L05's counting content at a level above the lecture's own, with the identities node handled
      properly.
  - unit_id: unit-m2-sad-l06
    title: Harvard Stat 110 Units 3–4 — RVs and expectation
    format: course
    angle: Builds expectation around indicator variables, a technique that makes several otherwise hard computations
      trivial.
    covers:
    - knowledge-sad-l06-random-variable
    - knowledge-sad-l06-transformations
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    depth: advanced-reference
    scope: complementary
    locator: Lectures 5-9 (random variables and their distributions, expectation, indicator random variables,
      LOTUS, variance)
    angle_detail: The 'fundamental bridge' — that the expectation of an indicator is the probability of its event
      — plus linearity without independence lets you compute means of complicated counts by decomposition. L06
      never mentions it, but once seen it is the fastest route through a large class of exercises, and it makes
      linearity feel like a tool rather than an identity. Lectures run 45-50 minutes each; this is a five-lecture
      commitment, so choose it only if L06 is a topic you intend to be strong on.
  - unit_id: unit-m2-sad-l07
    title: Harvard Stat 110 Units 3–4 — discrete distributions
    format: course
    angle: Each distribution is given a one-sentence 'story' that determines when it applies — the compressed
      form of the model-selection skill.
    covers:
    - knowledge-sad-l07-model-selection
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-hypergeometric
    - knowledge-sad-l07-geometric
    - knowledge-sad-l07-poisson
    depth: advanced-reference
    scope: complementary
    locator: Lectures 6-8 (Bernoulli, binomial, hypergeometric, geometric, Poisson) plus the published 'Table
      of Distributions' handout
    angle_detail: Blitzstein's stories ('a hypergeometric counts the successes when you sample without replacement
      from a finite population containing a known number of successes') are short enough to memorise and complete
      enough to decide a modelling question. Learning the five stories is a far better use of an hour than learning
      the five PMFs, because the PMF follows from the story and the identification does not. The published distribution-summary
      sheet tabulates all of them with moments.
  - unit_id: unit-m2-sad-l08
    title: Harvard Stat 110 Units 5–6 — Normal and CLT
    format: course
    angle: Derives the Normal's normalising constant and standardisation rather than asserting them.
    covers:
    - knowledge-sad-l08-normal
    - knowledge-sad-l08-transform-sum
    - knowledge-sad-l08-clt
    depth: advanced-reference
    scope: complementary
    locator: Lectures 14-16 (continuous distributions and the Normal) and Lectures 19-20 (law of large numbers,
      central limit theorem)
    angle_detail: The Gaussian integral trick and the change of variables that turns any Normal into a standard
      Normal are both done on the board. Neither is examinable in SaD, but the second one is the reason the z-table
      works for every Normal, and knowing that removes the temptation to memorise separate procedures. The LLN/CLT
      lectures compare the two theorems explicitly, in the same framing the book uses in Ch 10.
