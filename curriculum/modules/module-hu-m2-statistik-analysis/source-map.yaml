    angle_detail: 'The ensemble chapter with each family given its own section and its own reason: bagging (p.
      221) and out-of-bag evaluation (p. 223), AdaBoost and gradient boosting (p. 228), stacking with a blender
      (p. 236). L12 presents all four on its closing slides, where they blur together; here each is built and
      evaluated separately on the same problem, so the differences are measured. Out-of-bag evaluation in particular
