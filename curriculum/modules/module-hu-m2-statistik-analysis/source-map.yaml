- source_id: source-fahrmeir-statistik
  role: spine
  why: Course-compatible notation and complete descriptive, probability, estimation, and testing coverage.
  priority: 3
  unit_routes:
  - unit_id: unit-m2-sad-l01
    title: Fahrmeir Chapter 2 — descriptive-statistics reference
    format: book
    angle: The German textbook vocabulary for exactly the descriptive tools L01 demonstrates, so the exam words
      and the lecture words match.
    covers:
    - knowledge-sad-l01-location
    - knowledge-sad-l01-distributions
    - knowledge-sad-l01-sampling-context
    depth: derivation
    scope: complementary
    locator: Ch 2 §2.1 Verteilungen und ihre Darstellungen, pdf pp. 47-66; §2.2 Beschreibung von Verteilungen,
      pdf pp. 67-90
    angle_detail: 'L01 shows mean/median/mode and a histogram on one study-duration dataset and moves on; Fahrmeir
      gives the same objects their examinable German names and definitions — Häufigkeitsverteilung, Lagemaße,
      Streuungsmaße, Quantil, Boxplot — with a worked example per definition. Read it for naming and notation,
      not for new ideas: everything here is L01 content stated more slowly and in the language the Klausur is
      written in. It assumes no probability at all, so it is safe this early.'
  - unit_id: unit-m2-sad-l02
    title: Fahrmeir Chapter 2 — univariate descriptive statistics
    format: book
    angle: 'The definitional authority for L02: every scale, frequency, location and dispersion measure defined
      once, in German, with the divisor conventions spelled out.'
    covers:
    - knowledge-sad-l02-scales
    - knowledge-sad-l02-frequencies
    - knowledge-sad-l02-location
    - knowledge-sad-l02-dispersion
    depth: derivation
    scope: complementary
    locator: Ch 2 complete, pdf pp. 46-125 (§2.1 Darstellungen p. 47; §2.2 Lage und Streuung p. 67; §2.3 Konzentrationsmaße
      p. 91; §2.4 Dichtekurven und Normalverteilung p. 101; Aufgaben p. 123)
    angle_detail: 'This is the chapter L02 is compressing. It settles the two things the deck leaves implicit:
      which measures are admissible on which Skalenniveau (nominal/ordinal/metrisch, §2.1-2.2), and the n versus
      n-1 divisor question for the variance, which Fahrmeir states as a definition rather than leaving it to inference.
      §2.3 (Lorenzkurve, Gini) is beyond SaD scope — skip it unless a concentration measure appears in an exercise.
      §2.4 previews the Normal density as a smoothed histogram, which is the picture L08 later assumes you already
      have.'
  - unit_id: unit-m2-sad-l03
    title: Fahrmeir Chapter 3 — multivariate description and regression
    format: book
    angle: Correlation and least squares derived from the descriptive side only — no random variables, no inference,
      which is exactly L03's standpoint.
    covers:
    - knowledge-sad-l03-paired-data
    - knowledge-sad-l03-covariance
    - knowledge-sad-l03-interpretation
    - knowledge-sad-l03-simple-regression
    depth: derivation
    scope: complementary
    locator: Ch 3 §3.4 Zusammenhangsmaße bei metrischen Merkmalen, pdf pp. 151-163; §3.5 Korrelation und Kausalität,
      pdf pp. 164-167; §3.6 Regression, pdf pp. 168-182; Aufgaben pdf pp. 189-192
    angle_detail: Most books introduce regression after probability and immediately talk about errors as random
      variables. Fahrmeir Ch 3 is still in the descriptive half of the book, so the Kleinste-Quadrate line is
      derived as a purely geometric fit to a scatterplot — the same standpoint as L03, which also has no probability
      yet. §3.5 is the short, sharp treatment of Scheinkorrelation and confounding that the lecture states in
      one slide. It does NOT cover multivariate regression in matrix form or gradient descent; for those parts
      of L03 use ISLP §3.2 and Géron Ch 4.
  - unit_id: unit-m2-sad-l04
    title: Fahrmeir Chapter 4 — probability foundations
    format: book
    angle: Splits total probability and Bayes into two separately numbered sections, which is the derivation order
      L04's slide 46 skips.
    covers:
    - knowledge-sad-l04-events
    - knowledge-sad-l04-axioms
    - knowledge-sad-l04-conditional
    - knowledge-sad-l04-bayes
    - knowledge-sad-l04-independence
    depth: derivation
    scope: complementary
    locator: Ch 4 §§4.1-4.2 Wahrscheinlichkeitsbegriff, pdf pp. 194-213; §4.4 Bedingte Wahrscheinlichkeiten, pdf
      pp. 221-223; §4.5 Unabhängigkeit, pdf pp. 224-227; §4.6 Totale Wahrscheinlichkeit, pdf pp. 228-229; §4.7
      Satz von Bayes, pdf pp. 230-234; Aufgaben pdf pp. 239-241
    angle_detail: 'The 2026 deck states Bayes with the total-probability expansion already substituted into the
      denominator, so the step where the partition enters is invisible. Fahrmeir gives §4.6 (Satz von der totalen
      Wahrscheinlichkeit) its own statement and proof, then derives §4.7 (Bayes) from it, which is the missing
      half. It also gives the German phrasing of Unabhängigkeit as a product rule rather than as a conditional
      statement — worth reading because the Klausur can ask for either. Stops before Naive Bayes: the classifier
      construction is L04''s own, and no book on this shelf matches it exactly.'
  - unit_id: unit-m2-sad-l05
    title: Fahrmeir Chapter 4 — combinatorics and finite probability
    format: book
    angle: Six pages that put counting where SaD puts it — inside sampling — instead of treating combinatorics
      as its own subject.
    covers:
    - knowledge-sad-l05-decision-grid
    - knowledge-sad-l05-combinations
    - knowledge-sad-l05-counting-probability
    depth: derivation
    scope: complementary
    locator: Ch 4 §4.3 Zufallsstichproben und Kombinatorik, pdf pp. 214-220; Aufgaben pdf pp. 239-241
    angle_detail: 'This is deliberately the shortest combinatorics treatment on the shelf, and that is its value:
      Fahrmeir introduces the counting cases only as the sizes of sample spaces for Ziehen mit/ohne Zurücklegen
      and mit/ohne Berücksichtigung der Reihenfolge, which is precisely how L05''s decision grid is organised.
      If the grid is what will not stick, read this rather than a full combinatorics chapter, because it never
      leaves the sampling frame. For volume of drill and the harder identity questions go to Blitzstein Ch 1 or
      Schaum''s Ch 2 instead.'
  - unit_id: unit-m2-sad-l06
    title: Fahrmeir Chapters 5–7 — random variables and moments
    format: book
    angle: Keeps discrete and continuous random variables in separate chapters, so PMF and density are never conflated
      the way a single merged treatment can.
    covers:
    - knowledge-sad-l06-random-variable
    - knowledge-sad-l06-distribution-functions
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    - knowledge-sad-l06-concentration
    depth: derivation
    scope: complementary
    locator: Ch 5 §5.1 Zufallsvariablen, pdf pp. 243-246; §5.2 Verteilungen und Parameter diskreter ZV, pdf pp.
      247-269; Ch 6 §6.1 Definition und Verteilung, pdf pp. 289-300; §6.2 Lageparameter, Quantile, Varianz, pdf
      pp. 301-309; Ch 7 §7.1 Gesetz der großen Zahlen, pdf pp. 330-336; Ch 8 §8.5 Kovarianz und Korrelation, pdf
      pp. 368-374
    angle_detail: 'L06 introduces PMF, density and CDF together in one pass. Fahrmeir separates them by chapter,
      which is slower but makes the one exam-relevant distinction unmissable: P(X=x) is a probability in Ch 5
      and is identically zero in Ch 6, where only intervals have probability. §8.5 supplies the covariance definition
      L06 needs and connects it back to the descriptive covariance of Ch 3, so the same symbol is not learned
      twice. §7.1 is the German statement of Tschebyscheff and the Gesetz der großen Zahlen; read it here rather
      than in an English text if the exam wording matters.'
  - unit_id: unit-m2-sad-l07
    title: Fahrmeir Chapter 5 — discrete distributions
    format: book
    angle: Presents each discrete model as a modelling decision — what generating situation forces this distribution
      — rather than as a formula sheet.
    covers:
    - knowledge-sad-l07-model-selection
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-hypergeometric
    - knowledge-sad-l07-geometric
    - knowledge-sad-l07-poisson
    depth: derivation
    scope: complementary
    locator: Ch 5 §5.3 Spezielle diskrete Verteilungsmodelle, pdf pp. 270-282; Zusammenfassung pdf pp. 283-284;
      Aufgaben pdf pp. 286-287
    angle_detail: Thirteen pages covering Binomial, Hypergeometrisch, Geometrisch and Poisson, each opened with
      the Situation that produces it (fixed n and independence; drawing without replacement from a finite urn;
      waiting for the first success; rare events in continuous time). That is exactly the skill L07's model-selection
      node is testing, and it is the part a formula sheet cannot give you. The moments are stated without derivation
      — if you want the E[X] and Var(X) proofs, use Blitzstein §§3.3-3.4 and §4.7 instead. The Zusammenfassung
      on pp. 283-284 is the single best one-page revision table for this lecture on the shelf.
  - unit_id: unit-m2-sad-l08
    title: Fahrmeir Chapters 6–7 — Normal distribution and limit theorems
    format: book
    angle: The only route here that also hands you the z-table you will actually use, in the layout the Klausur
      uses.
    covers:
    - knowledge-sad-l08-normal
    - knowledge-sad-l08-standardization
    - knowledge-sad-l08-transform-sum
    - knowledge-sad-l08-clt
    - knowledge-sad-l08-approximation
    depth: derivation
    scope: complementary
    locator: Ch 6 §6.3 Spezielle stetige Verteilungsmodelle, pdf pp. 310-322 (Normalverteilung); Ch 7 §7.1 Grenzwertsätze,
      pdf pp. 330-336; §7.2 Approximation von Verteilungen, pdf pp. 337-338; Tabelle A Standardnormalverteilung,
      pdf p. 631
    angle_detail: '§6.3 defines the Normal family and standardisation in German notation; §7.1 separates the Gesetz
      der großen Zahlen from the Zentraler Grenzwertsatz, which is the single most confused pair in this lecture;
      §7.2 states the approximation rules with the Stetigkeitskorrektur that English texts often omit. Then p.
      631 is the Standardnormalverteilung table itself — practising lookups against the table you will be given
      matters more than it sounds, because reading Φ backwards for a quantile is a distinct skill from reading
      it forwards. Contains no likelihood or MLE: for the L08 likelihood half use Dekking Ch 21.'
  - unit_id: unit-m2-sad-l09
    title: Fahrmeir Chapter 9 — parameter estimation
    format: book
    angle: 'Estimator quality before estimator recipes: bias, consistency and efficiency are defined and compared
      in §9.2 before any interval formula appears.'
    covers:
    - knowledge-sad-l09-estimator
    - knowledge-sad-l09-properties
    - knowledge-sad-l09-standard-error
    - knowledge-sad-l09-z-interval
    - knowledge-sad-l09-t-interval
    depth: derivation
    scope: complementary
    locator: Ch 9 §9.1 Punktschätzung, pdf pp. 383-385; §9.2 Eigenschaften von Schätzstatistiken, pdf pp. 386-393;
      §9.3 Konstruktion von Schätzfunktionen, pdf pp. 394-402; §9.4 Intervallschätzung, pdf pp. 403-410; Aufgaben
      pdf pp. 413-415
    angle_detail: L09 introduces estimator properties and confidence intervals in the same pass, which makes it
      easy to learn the interval formulas as rituals. Fahrmeir spends eight pages on Erwartungstreue, Konsistenz,
      Effizienz and MSE with worked comparisons of competing estimators BEFORE §9.4 derives an interval, so the
      interval arrives as a consequence of a sampling distribution rather than as a boxed formula. §9.3 covers
      the Maximum-Likelihood and Momenten construction methods, which is the bridge back to L08's MLE node. Use
      the German property names from here — the Klausur asks for 'erwartungstreu', not 'unbiased'.
  - unit_id: unit-m2-sad-l10
    title: Fahrmeir Chapters 10–11 — hypothesis tests
    format: book
    angle: Teaches one concrete test end to end first, then generalises the principle — the reverse of the lecture's
      order, and the better order when the logic will not click.
    covers:
    - knowledge-sad-l10-test-model
    - knowledge-sad-l10-tails-pvalue
    - knowledge-sad-l10-errors-power
    - knowledge-sad-l10-z-t
    - knowledge-sad-l10-chi-square
    - knowledge-sad-l10-nonparametric
    depth: derivation
    scope: complementary
    locator: Ch 10 §10.1 Der Binomial- und der Gauß-Test, pdf pp. 417-429; §10.2 Prinzipien des Testens, pdf pp.
      430-444; §10.3 Multiple Testprobleme, pdf pp. 445-446; Ch 11 §11.2 Ein-Stichproben-Fall, pdf pp. 452-469;
      §11.5 Zusammenhangsanalyse, pdf pp. 482-485
    angle_detail: 'L10 opens with the abstract null-model/statistic/reference-distribution machinery and then
      instantiates it. Fahrmeir §10.1 does the opposite: it runs the Gauß-Test completely — hypotheses, statistic,
      critical region, decision — and only then does §10.2 extract Fehler 1./2. Art, Güte and the p-Wert as principles
      from the worked case. If the abstract version did not land in the lecture, this inversion is the reason
      to come here rather than to OpenIntro. §11.5 supplies the χ²-Unabhängigkeitstest and the correlation test;
      §10.3 is two pages on multiple testing, enough for the exam but thinner than ISLP Ch 13.'
  - unit_id: unit-m2-sad-exam-prep
    title: Fahrmeir — German Statistics derivation spine
    format: book
