- source_id: source-statquest
  role: intuition
  why: Exact short refreshers for distributions, CLT, MLE, intervals, tests, trees, Naive Bayes, and neural nets.
  priority: 18
  unit_routes:
  - unit_id: unit-m2-sad-l01
    title: StatQuest — confusion matrix, sensitivity, and specificity
    format: video
    angle: Twenty minutes that fix the confusion matrix orientation problem — which axis is truth, which is prediction
      — for good.
    covers:
    - knowledge-sad-l01-classification
    depth: orientation
    scope: complementary
    locator: '''The Confusion Matrix, Clearly Explained'' and ''Sensitivity and Specificity, Clearly Explained''
      (≈10 min each)'
    angle_detail: Nearly every mistake with precision, recall, sensitivity and specificity is a transposition
      error made under time pressure, not a conceptual failure. StatQuest's fix is a colour-coded table built
      up cell by cell, repeated until the layout is memorable. That is worth more for L01 than any written treatment,
      because the written ones assume you will not transpose it. Stop after these two; the channel's ROC video
      belongs to L11.
  - unit_id: unit-m2-sad-l03
    title: StatQuest — Pearson correlation, least squares, and gradient descent
    format: video
    angle: Steps a gradient-descent run through by hand, one iteration at a time, with the numbers on screen.
    covers:
    - knowledge-sad-l03-covariance
    - knowledge-sad-l03-simple-regression
    - knowledge-sad-l03-gradient-descent
    depth: orientation
    scope: complementary
    locator: '''Pearson''s Correlation, Clearly Explained''; ''Linear Regression, Clearly Explained'' (least squares);
      ''Gradient Descent, Step-by-Step'' (≈20 min)'
    angle_detail: L03 introduces gradient descent as an alternative optimiser and shows the update rule. The step-by-step
      video actually performs the iterations on a two-parameter regression, so the abstract rule becomes a visible
      sequence of numbers converging. It also shows what a learning rate that is too large does, which is the
      intuition behind every later discussion of step size. The correlation video is the one to watch if the difference
      between covariance and correlation is what is unclear.
  - unit_id: unit-m2-sad-l04
    title: StatQuest — Naive Bayes
    format: video
    angle: Builds the spam classifier from counted word frequencies before writing any probability notation.
    covers:
    - knowledge-sad-l04-naive-bayes
    depth: orientation
    scope: complementary
    locator: '''Naive Bayes, Clearly Explained'' (≈15 min)'
    angle_detail: 'The video''s order is the reverse of the lecture''s: it counts words in example messages, forms
      the products, and only then names what it has been doing as Naive Bayes with a conditional independence
      assumption. For a construction that looks arbitrary on slides, seeing the counting first makes the independence
      assumption''s role obvious — it is what lets the counts be multiplied. Pairs with the deck rather than replacing
      it; the deck''s notation is what the exam uses.'
  - unit_id: unit-m2-sad-l05
    title: StatQuest — Hypergeometric distribution
    format: video
    angle: The one video here that treats the counting problem behind sampling without replacement rather than
      the formula.
    covers:
    - knowledge-sad-l05-counting-probability
    depth: orientation
    scope: complementary
    locator: '''The Hypergeometric Distribution, Clearly Explained'' (≈12 min)'
    angle_detail: Hypergeometric counting is where L05's grid meets L07's distributions, and it is the cell students
      most often get wrong because the numerator and denominator involve different populations. The video draws
      the urn, marks the two groups, and builds the ratio of combinations from the picture. Short, and worth watching
      before attempting the L05 counting exercises that involve defective items or committee selection.
  - unit_id: unit-m2-sad-l06
    title: StatQuest — expected values and probability distributions
    format: video
    angle: Handles the discrete-to-continuous transition visually — the histogram narrowing into a density — which
      is where L06's PMF/PDF distinction is usually lost.
    covers:
    - knowledge-sad-l06-distribution-functions
    - knowledge-sad-l06-expectation
    depth: orientation
    scope: complementary
    locator: '''Expected Values, Main Ideas''; ''Expected Values for Continuous Variables''; ''The Main Ideas
      behind Probability Distributions'' (≈10-15 min each)'
    angle_detail: 'The two expected-value videos are deliberately a pair: the same quantity computed as a weighted
      sum, then as an integral, with the bars of the histogram shrinking on screen between them. That animation
      is the single most useful thing here, because it makes the sum-to-integral move a continuous change rather
      than two unrelated formulas. Watch them in order.'
  - unit_id: unit-m2-sad-l07
    title: StatQuest — Binomial distribution and sampling
    format: video
    angle: Very short — use as a recall check between practice sets rather than as a first explanation.
    covers:
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-model-selection
    depth: orientation
    scope: complementary
    locator: '''The Binomial Distribution in 30 Seconds''; ''Sampling from a Distribution, Clearly Explained'''
    angle_detail: 'The 30-second binomial video is exactly what it says and is best used as a spaced-repetition
      prompt: watch it cold and see whether you could have said the same thing. The sampling video is more substantial
      and explains what ''drawing from a distribution'' means operationally, which matters for L11''s resampling
      material later.'
  - unit_id: unit-m2-sad-l08
    title: StatQuest — CLT, likelihood, and maximum likelihood
    format: video
    angle: '''Probability is not Likelihood'' isolates L08''s hardest distinction into a single dedicated video.'
    covers:
    - knowledge-sad-l08-clt
    - knowledge-sad-l08-likelihood
    - knowledge-sad-l08-mle
    depth: orientation
    scope: complementary
    locator: '''The Central Limit Theorem, Clearly Explained''; ''Probability is not Likelihood''; ''Maximum Likelihood,
      Clearly Explained'' (≈12 min each)'
    angle_detail: 'The likelihood-versus-probability confusion is the reason L08''s second half is hard, and it
      is a distinction about which quantity is held fixed, not about any formula. This video does nothing else
      for eight minutes: same curve, same expression, read twice. Watch it before reading Dekking Ch 21 and the
      chapter becomes straightforward. The CLT video uses the same repeated-sampling animation OpenIntro describes
      in text.'
  - unit_id: unit-m2-sad-l09
    title: StatQuest — standard error, confidence intervals, and bootstrap
    format: video
    angle: Distinguishes the standard deviation from the standard error explicitly, which the lecture's notation
      blurs.
    covers:
    - knowledge-sad-l09-standard-error
    - knowledge-sad-l09-z-interval
    - knowledge-sad-l09-bootstrap
    depth: orientation
    scope: complementary
    locator: '''Standard Error, Clearly Explained''; ''Confidence Intervals, Clearly Explained''; ''Bootstrapping,
      Clearly Explained'''
    angle_detail: sigma and sigma/sqrt(n) look similar on a slide and mean entirely different things — the spread
      of the data versus the spread of an estimate. The video separates them with two visibly different histograms,
      and once separated the confidence-interval formula stops looking arbitrary. The bootstrapping video then
      shows the resampling loop being run, which is the procedural half of L09's bootstrap node.
  - unit_id: unit-m2-sad-l10
    title: StatQuest — hypothesis tests and p-values
    format: video
    angle: A four-video sequence that separates what a p-value is from how it is computed and from how many tails
      to use.
    covers:
    - knowledge-sad-l10-test-model
    - knowledge-sad-l10-tails-pvalue
    depth: orientation
    scope: complementary
    locator: '''Hypothesis Testing and the Null Hypothesis''; ''p-values, Clearly Explained''; ''How to Calculate
      p-values''; ''One- or Two-Tailed p-values'''
    angle_detail: 'Those three questions get conflated in a single lecture and each is a separate source of lost
      marks. Splitting them across four short videos means each can be checked independently: do I know what the
      number means, can I produce it, and did I choose the right tail count for this alternative. The one-or-two-tailed
      video in particular addresses the decision the exam most often penalises.'
  - unit_id: unit-m2-sad-l12
    title: StatQuest — decision trees and random forests
    format: video
    angle: Builds a tree split by split with the impurity numbers on screen, then shows exactly what a forest
      changes.
    covers:
    - knowledge-sad-l12-tree-model
    - knowledge-sad-l12-pruning
    - knowledge-sad-l12-bagging-forest
    depth: orientation
    scope: complementary
    locator: '''Decision Trees, Clearly Explained''; ''Regression Trees, Clearly Explained''; ''Random Forests
      Part 1 — Building, Using and Evaluating''; ''AdaBoost, Clearly Explained'' (≈15-20 min each)'
    angle_detail: The tree video computes the impurity of each candidate split and picks the winner, on screen,
      which is the L12 exam calculation. The random-forest video then isolates the two changes from a single tree
      — bootstrap the rows, restrict the columns at each split — and shows out-of-bag evaluation falling out for
      free. Separating those two changes is what stops 'random forest' from being a black box. The AdaBoost video
      handles the reweighting visually.
  - unit_id: unit-m2-sad-l14
    title: StatQuest — Naive Bayes and Gaussian Naive Bayes
    format: video
    angle: The Gaussian video shows why a density replaces a count for numeric features, which is L14's least
      intuitive step.
    covers:
    - knowledge-sad-l14-nb-recap
    - knowledge-sad-l14-gaussian
    depth: orientation
    scope: complementary
    locator: '''Naive Bayes, Clearly Explained''; ''Gaussian Naive Bayes, Clearly Explained'' (≈15 min each);
      ''Logistic Regression'' only as a contrast'
    angle_detail: Moving from multinomial to Gaussian Naive Bayes means the likelihood stops being a proportion
      and becomes a density evaluation, and the resulting number is no longer a probability. That shift is where
      L14's numeric-attribute node loses people. The video draws the fitted Normal per class per feature and reads
      values off it, which makes the substitution concrete. Watch the categorical video first even if you have
      seen it for L04.
  - unit_id: unit-m2-sad-l15
    title: StatQuest — neural networks and backpropagation
    format: video
    angle: Shows activation functions being scaled and summed into an arbitrary curve — the mechanical basis of
      universal approximation.
    covers:
    - knowledge-sad-l15-neuron
    - knowledge-sad-l15-forward
    - knowledge-sad-l15-backprop
    depth: orientation
    scope: complementary
    locator: '''Neural Networks Part 1 — Inside the Black Box''; ''Backpropagation Main Ideas''; ''Stochastic
      Gradient Descent, Clearly Explained'' (≈15-20 min each)'
    angle_detail: Part 1's central demonstration is that two hidden units with a soft activation can be weighted
      and added to produce a bent curve fitting the data, built up piece by piece on screen. That is L15's universality
      node made visible without any theorem. The backpropagation video then updates one weight at a time with
      the numbers shown, and the SGD video explains why the gradient is estimated on a batch rather than the full
      data — a practical point L15 lists without motivating.
  - unit_id: unit-m2-sad-exam-prep
    title: StatQuest — one short L08 intuition repair
    format: video
    angle: Clarifies CLT, probability versus likelihood, or MLE only when the current deck diagnostic shows that
      exact gap.
    covers:
    - knowledge-sad-exam-random-variables
    depth: intuition
    scope: complementary
    locator: Central Limit Theorem; Probability is not Likelihood; Maximum Likelihood
- source_id: source-jbstatistics
  role: intuition
  why: Short calculation-exact probability and inference refreshers.
  priority: 19
  unit_routes:
  - unit_id: unit-m2-sad-l02
    title: jbstatistics — data types, histograms, center, and spread
    format: video
    angle: Chalk-talk pace with every calculation written out — closest in style to a German Vorlesung of the
      same material.
    covers:
    - knowledge-sad-l02-scales
    - knowledge-sad-l02-frequencies
    - knowledge-sad-l02-location
    - knowledge-sad-l02-dispersion
    depth: orientation
    scope: complementary
    locator: '''Types of Data''; ''Frequency Distributions and Histograms''; ''Mean, Median and Mode''; ''Variance
      and Standard Deviation'' (≈8 min each)'
    angle_detail: 'Where StatQuest is animated and mnemonic, jbstatistics is a lecturer working through definitions
      and examples at writing speed. For L02, where the content is definitional and the risk is convention rather
      than intuition, that register is the better fit: the divisor question and the grouped-data mean are both
      worked explicitly. Playlists are ordered to be watched in sequence.'
  - unit_id: unit-m2-sad-l05
    title: jbstatistics — permutations and combinations
    format: video
    angle: Derives the combination formula from the permutation formula on screen, rather than presenting both
      as given.
    covers:
    - knowledge-sad-l05-decision-grid
    - knowledge-sad-l05-permutations
    - knowledge-sad-l05-variations
    - knowledge-sad-l05-combinations
    depth: orientation
    scope: complementary
    locator: The 'Permutations and Combinations' video series (3 videos, ≈10 min each)
    angle_detail: nCr = nPr / r! is the relationship that makes the two halves of L05's grid one idea rather than
      two formulas, and seeing the division performed — dividing out the orderings you decided not to distinguish
      — is what makes it stick. Short series, appropriate as a first exposure before the Schaum's drill.
  - unit_id: unit-m2-sad-l06
    title: jbstatistics — expected value and variance calculations
    format: video
    angle: Computes E[X] and Var(X) from a probability table step by step, in the layout an exam answer uses.
    covers:
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    depth: orientation
    scope: complementary
    locator: '''Expected Value and Variance of a Discrete Random Variable'' and the companion variance video (≈10
      min each)'
    angle_detail: The videos build the working column by column — x, P(x), x·P(x), x²·P(x) — which is exactly
      the table you should be drawing under exam conditions. Copying that layout is a small procedural habit that
      reliably prevents arithmetic slips, and no book on the shelf shows it as clearly.
  - unit_id: unit-m2-sad-l07
    title: jbstatistics — discrete distributions
    format: video
    angle: One video per distribution, each opening with the conditions that must hold before the formula appears.
    covers:
    - knowledge-sad-l07-model-selection
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-hypergeometric
    - knowledge-sad-l07-geometric
    - knowledge-sad-l07-poisson
    depth: orientation
    scope: complementary
    locator: 'The discrete-distribution playlist: ''The Binomial Distribution'', ''The Geometric Distribution'',
      ''The Hypergeometric Distribution'', ''The Poisson Distribution'''
    angle_detail: The consistent structure across the series — conditions, then PMF, then a worked example, then
      the moments — makes the four distributions directly comparable, which is what L07's model-selection node
      requires. Watching them back to back is more useful than watching any one of them, because the differences
      between the condition lists are the actual content.
  - unit_id: unit-m2-sad-l08
    title: jbstatistics — Normal, z-scores, and CLT
    format: video
    angle: Drills the standard-normal table in both directions, including finding a value from a given probability.
    covers:
    - knowledge-sad-l08-standardization
    - knowledge-sad-l08-clt
    - knowledge-sad-l08-approximation
    depth: orientation
    scope: complementary
    locator: '''The Normal Distribution'', ''Standardizing Normally Distributed Random Variables'', ''Introduction
      to the Central Limit Theorem'''
    angle_detail: Reading the table backwards — given a tail probability, find z — is a distinct skill and the
      one L09's confidence intervals will immediately depend on. The videos work several of each direction, which
      is more repetition than any text here provides in that specific operation.
  - unit_id: unit-m2-sad-l09
    title: jbstatistics — t distribution and confidence intervals
    format: video
    angle: Explains why the t-distribution has heavier tails as a consequence of estimating sigma, not as a property
      to accept.
    covers:
    - knowledge-sad-l09-standard-error
    - knowledge-sad-l09-z-interval
    - knowledge-sad-l09-t-interval
    depth: orientation
    scope: complementary
    locator: '''Introduction to Confidence Intervals'' and ''Introduction to the t Distribution'', with the interval-construction
      videos that follow them'
    angle_detail: The t-distribution is usually introduced as 'use this when sigma is unknown', which gives no
      reason for its shape. The videos connect the extra uncertainty of estimating sigma to the heavier tails
      and thus to the wider interval, which makes the z-versus-t decision a reasoned one and much harder to get
      wrong under pressure.
  - unit_id: unit-m2-sad-l10
    title: jbstatistics — hypothesis-testing calculations
    format: video
    angle: Insists on stating H0 and H1 before anything else, every single time, which is the marking-scheme habit.
    covers:
    - knowledge-sad-l10-test-model
    - knowledge-sad-l10-tails-pvalue
    - knowledge-sad-l10-z-t
    depth: orientation
    scope: complementary
    locator: '''Introduction to Hypothesis Testing'', ''What is a p-value?'', and the Type I / Type II error videos
      in the same playlist'
    angle_detail: 'The repetition is the pedagogy here: every example in the series begins by writing the hypotheses
      formally, in symbols, before touching the data. German exam marking awards points for that step independently
      of the arithmetic, so the habit converts directly into marks.'
