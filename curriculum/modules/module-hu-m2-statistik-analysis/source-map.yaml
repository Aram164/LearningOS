      the bullseye diagram and the derivation appendix
    covers:
    - knowledge-sad-l11-generalization
    angle: The bullseye diagram — four targets showing high/low bias against high/low variance — which is the
      fastest way to fix the distinction.
    angle_detail: 'Bias and variance are easy to confuse because both are described as ''error''. The four-panel
      target picture separates them physically: bias is where the cluster of shots sits relative to the centre,
      variance is how spread the cluster is. Fifteen minutes, and it makes the L11 curves interpretable. The appendix
      gives the algebraic decomposition for readers who want it after the picture.'
