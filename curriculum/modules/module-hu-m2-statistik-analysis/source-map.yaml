    locator: Ch 1 pdf pp. 18-61 (§1.3 naive definition of probability p. 23; §1.4 how to count p. 25; §1.5 story
      proofs p. 37; §1.6 non-naive definition p. 38; exercises §1.9 p. 50)
    angle_detail: §1.5 is the reason to come here for L05 rather than to any German text. A story proof establishes
      an identity — the symmetry of binomial coefficients, Vandermonde, the hockey stick — by naming a set and
      counting it twice, and once seen the identities stop being things to memorise. That directly serves L05's
      identities node, which the deck states without justification. §1.4 also makes the sampling table (ordered/unordered
      × with/without replacement) explicit, which is the same four-way grid the lecture draws. The strongest exercise
      set on the shelf for this material.
  - unit_id: unit-m2-sad-l06
    title: Blitzstein Chapters 3–4 and 10 — RVs and expectation
    format: book
    angle: Insists on the distinction between a random variable and its distribution, and proves linearity of
      expectation without independence.
    covers:
    - knowledge-sad-l06-random-variable
    - knowledge-sad-l06-transformations
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    depth: intuition
    scope: complementary
    locator: Ch 3 pdf pp. 120-165 (§3.2 distributions and PMFs p. 123; §3.6 CDFs p. 137; §3.7 functions of random
      variables p. 140; §3.8 independence of r.v.s p. 146); Ch 4 pdf pp. 166-229 (§4.1 definition of expectation
      p. 166; §4.2 linearity p. 169; §4.5 LOTUS p. 187; §4.6 variance p. 188); Ch 7 §7.3 covariance and correlation,
      pdf pp. 343-348
    angle_detail: Two things here are worth the reading time. First, §3.1-3.2 hammer that a random variable is
      a function on the sample space while its distribution is a separate object — the confusion behind most wrong
      answers about transformations, and something L06 states once. Second, §4.2 proves that E[X+Y] = E[X] + E[Y]
      holds whether or not X and Y are independent, and shows why that is surprising; the lecture asserts linearity,
      and knowing it needs no independence is what makes it a tool. §4.5 (LOTUS) is the rule for E[g(X)] that
      the transformations node depends on. Skip the MGF sections in Ch 6 — out of scope.
  - unit_id: unit-m2-sad-l07
    title: Blitzstein Chapters 3–4 — distribution-generating stories
    format: book
    angle: Gives each distribution a story first, then derives its moments — and devotes whole sections to the
      relationships between them.
    covers:
    - knowledge-sad-l07-model-selection
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-hypergeometric
    - knowledge-sad-l07-geometric
    - knowledge-sad-l07-poisson
    depth: intuition
    scope: complementary
    locator: Ch 3 §3.3 Bernoulli and Binomial, pdf pp. 129-131; §3.4 Hypergeometric, pdf pp. 132-134; §3.9 connections
      between Binomial and Hypergeometric, pdf pp. 150-152; Ch 4 §4.3 Geometric and Negative Binomial, pdf pp.
      174-180; §4.7 Poisson, pdf pp. 191-197; §4.8 connections between Poisson and Binomial, pdf pp. 198-200
    angle_detail: L07's relationships node — Binomial to Poisson in the rare-event limit, Hypergeometric to Binomial
      as the population grows — is stated on a slide as a fact. §3.9 and §4.8 are entire sections that prove those
      limits and say when the approximation is safe, which is the difference between reciting the relationship
      and being able to justify an approximation in an exam. The story-first presentation ('a Binomial counts
      successes in n independent trials with the same p') is also the most reliable way to get the model-selection
      node right under time pressure.
  - unit_id: unit-m2-sad-l08
    title: Blitzstein Chapters 5 and 10 — continuous variables and CLT
    format: book
    angle: Puts the LLN and the CLT in one chapter with the inequalities that bound them, so the two limit theorems
      are compared rather than met separately.
    covers:
    - knowledge-sad-l08-normal
    - knowledge-sad-l08-transform-sum
    - knowledge-sad-l08-clt
    depth: intuition
    scope: complementary
    locator: Ch 5 §5.1 probability density functions, pdf pp. 230-236; §5.4 Normal, pdf pp. 248-254; Ch 10 §10.1
      inequalities, pdf pp. 475-483; §10.2 law of large numbers, pdf pp. 484-487; §10.3 central limit theorem,
      pdf pp. 488-493; exercises §10.7 pdf pp. 503-513
    angle_detail: 'The single most common L08 misconception is that the CLT is a stronger version of the LLN.
      Ch 10 makes them adjacent sections making visibly different claims — the LLN about where the sample mean
      goes, the CLT about the shape of its fluctuation around that point — and the proximity does the teaching.
      §10.1 supplies Markov, Chebyshev and Jensen with proofs, which is where L06''s concentration node also points.
      §5.4 derives the standardisation identity rather than asserting it. No likelihood content: for L08''s MLE
      half use Dekking Ch 21.'
  - unit_id: unit-m2-sad-exam-prep
    title: Blitzstein — conditioning and strategic counting
    format: book
    angle: Supplies story-based intuition for Bayes and the order/repetition counting decisions without becoming
      a second probability course.
    covers:
    - knowledge-sad-exam-probability
    depth: intuition
    scope: complementary
    locator: Chapters 1-2 only after a failed cold gate
  - unit_id: unit-m2-sad-l10
    title: Blitzstein §10.4 — where the t and chi-square distributions come from
    format: book
    depth: derivation
    scope: complementary
    locator: Ch 10 §10.4 Chi-Square and Student-t, pdf pp. 494-496
    covers:
    - knowledge-sad-l10-z-t
    - knowledge-sad-l10-chi-square
    angle: Defines the t and chi-square distributions constructively out of Normals, instead of introducing them
      as table lookups.
    angle_detail: L10 uses both as reference distributions and never says what they are. Three pages here define
      chi-square as a sum of squared standard Normals and t as a standard Normal divided by the root of an independent
      chi-square over its degrees of freedom. That is what makes 'degrees of freedom' a quantity rather than a
      column heading, and it explains why the t approaches the Normal as n grows. Background, not exam-bearing
      — read it once.
- source_id: source-fortmann-roe-bias-variance
