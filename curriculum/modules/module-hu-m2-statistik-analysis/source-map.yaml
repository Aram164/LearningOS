- source_id: source-pitman-probability
  role: optional-depth
  why: Intermediate alternative when Blitzstein is too terse or deep; use only for L04–L08.
  priority: 11
  unit_routes:
  - unit_id: unit-m2-sad-l04
    title: Pitman — conditional probability selections
    format: book
    angle: Everything through tree diagrams and partitions drawn on the page — the most visual derivation of Bayes
      on the shelf.
    covers:
    - knowledge-sad-l04-axioms
    - knowledge-sad-l04-conditional
    - knowledge-sad-l04-bayes
    - knowledge-sad-l04-independence
    depth: advanced-reference
    scope: complementary
    locator: Ch 1 §1.4 Conditional Probability and Independence, pdf pp. 44-57; §1.5 Bayes' Rule, pdf pp. 58-66;
      §1.6 Sequences of Events, pdf pp. 67-89
    angle_detail: Pitman's method is to draw the partition and the tree, label every branch, and read the answer
      off the picture before writing any algebra; §1.5 derives Bayes' rule as a relabelling of a tree you have
      already drawn. That makes the role of the partition — the thing L04's slide 46 leaves implicit when it states
      Bayes with the denominator pre-expanded — impossible to miss. §1.6 then does sequences of events and the
      multiplication rule, which is the machinery behind the chain of conditional independence assumptions Naive
      Bayes rests on. Hundreds of worked examples; the exercises are harder than SaD needs, so pick rather than
      sweep.
  - unit_id: unit-m2-sad-l05
    title: Pitman — counting foundations
    format: book
    angle: Counting introduced only as the way to compute equally-likely probabilities, never as an independent
      topic.
    covers:
    - knowledge-sad-l05-combinations
    - knowledge-sad-l05-counting-probability
    depth: advanced-reference
    scope: complementary
    locator: Ch 1 §1.1 Equally Likely Outcomes, pdf pp. 14-32; Ch 2 §2.1 The Binomial Distribution, pdf pp. 90-102
    angle_detail: §1.1 sets up the Laplace model first — probability as a ratio of counts — so every counting
      technique that follows arrives as an answer to 'how do I get that numerator'. That is the same motivation
      L05 uses when it moves from the decision grid to Laplace probability, and it is a better frame than treating
      combinatorics as prerequisite algebra. Thin on stars-and-bars and repetition cases; Blitzstein §1.4 covers
      those properly.
  - unit_id: unit-m2-sad-l06
    title: Pitman — random variables and expectation
    format: book
    angle: Introduces expectation as the long-run average of repeated draws, with the frequency picture kept alongside
      the formula throughout.
    covers:
    - knowledge-sad-l06-distribution-functions
    - knowledge-sad-l06-transformations
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    depth: advanced-reference
    scope: complementary
    locator: Ch 3 Random Variables, pdf pp. 148-268 (§3.2 Expectation p. 171; §3.3 Standard Deviation and Normal
      Approximation p. 194; §3.6 Symmetry p. 246)
    angle_detail: Pitman consistently draws the distribution as a bar chart and marks the mean as a balance point
      and the standard deviation as a width, then computes. Keeping the picture attached to the symbol is why
      this is a good route when E[X] and Var(X) feel like formulas to memorise rather than properties of a shape.
      §3.3 also introduces the Normal approximation right after standard deviation, so the reason anyone cares
      about sigma is visible immediately. Long chapter — for L06 read §3.2 and §3.3 and stop.
  - unit_id: unit-m2-sad-l07
    title: Pitman Chapters 2–3 — discrete distributions
    format: book
    angle: Reaches the Poisson twice — once as a limit of the Binomial, once as a distribution in its own right
      — several chapters apart.
    covers:
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-hypergeometric
    - knowledge-sad-l07-geometric
    - knowledge-sad-l07-poisson
    depth: advanced-reference
    scope: complementary
    locator: Ch 2 §2.1 The Binomial Distribution, pdf pp. 90-102; §2.4 Poisson Approximation, pdf pp. 127-147;
      Ch 3 §3.4 Discrete Distributions, pdf pp. 217-230; §3.5 The Poisson Distribution, pdf pp. 231-245
    angle_detail: §2.4 derives the Poisson as what the Binomial becomes when n grows and p shrinks with np fixed,
      with the error of the approximation discussed; §3.5, much later, treats the Poisson as a first-class distribution
      with its own moments. Meeting it in both roles is the clearest way to hold L07's relationships node, which
      asserts the limit on one slide. §3.4 collects the discrete families with a comparison of their shapes.
  - unit_id: unit-m2-sad-l08
    title: Pitman — Normal and limit-theorem selections
    format: book
    angle: Splits the Normal approximation into a 'method' section and an optional 'derivation' section, so the
      mechanics and the proof are cleanly separable.
    covers:
    - knowledge-sad-l08-normal
    - knowledge-sad-l08-standardization
    - knowledge-sad-l08-clt
    depth: advanced-reference
    scope: complementary
    locator: 'Ch 2 §2.2 Normal Approximation: Method, pdf pp. 103-118; §2.3 Normal Approximation: Derivation (optional),
      pdf pp. 119-126; Ch 4 Continuous Distributions, pdf pp. 269-330'
    angle_detail: '§2.2 gives the recipe with the continuity correction and worked lookups — exactly what the
      exam needs — and §2.3 then derives it, marked optional by the author. That division lets you take only the
      first half now and come back for the second if the CLT''s origin nags. Pitman also introduces the Normal
      before continuous random variables in general, which is unusual and works well here: the shape is motivated
      by the approximation problem instead of appearing as one density among many.'
