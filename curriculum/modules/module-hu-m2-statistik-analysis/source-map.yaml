- source_id: source-cs229-notes
  role: derivation
  why: Selected derivations for trees/boosting, Naive Bayes, and neural networks; advanced material remains optional.
  priority: 23
  unit_routes:
  - unit_id: unit-m2-sad-l04
    title: CS229 §4.2 — Naive Bayes event models
    format: course-material
    angle: The compact mathematical statement of the classifier L04 builds informally, in about four pages.
    covers:
    - knowledge-sad-l04-naive-bayes
    depth: advanced-reference
    scope: complementary
    locator: Main notes §4 Generative Learning algorithms — §4.2 Naive Bayes and §4.2.1 Laplace smoothing
    angle_detail: Where the deck constructs the spam classifier by counting, CS229 writes the generative model,
      states the conditional-independence assumption formally, and derives the maximum-likelihood parameter estimates.
      Reading both gives the construction and its justification. The notes are terse and assume comfort with likelihood
      notation, so this is better after L08 than before it.
  - unit_id: unit-m2-sad-l12
    title: CS229 — decision-tree and boosting derivations
    format: course-material
    angle: Derives boosting as a greedy stagewise fit to a loss function, which is where AdaBoost's exponential
      weights come from.
    covers:
    - knowledge-sad-l12-entropy-id3
    - knowledge-sad-l12-boosting
    depth: advanced-reference
    scope: complementary
    locator: The decision-trees and boosting notes (the separate 'Decision Trees' and 'Boosting' note PDFs on
      the course site)
    angle_detail: L12 presents AdaBoost's reweighting rule as a procedure. These notes show it falling out of
      minimising exponential loss one weak learner at a time, which explains both the specific weight formula
      and why boosting can overfit. Above exam level and worth reading only if the reweighting rule looked arbitrary.
  - unit_id: unit-m2-sad-l14
    title: CS229 §4.2 — Naive Bayes derivation
    format: course-material
    angle: Distinguishes the multinomial from the Bernoulli event model explicitly, which L14 blurs.
    covers:
    - knowledge-sad-l14-nb-recap
    - knowledge-sad-l14-smoothing
    - knowledge-sad-l14-multinomial
    depth: advanced-reference
    scope: complementary
    locator: Main notes §4.2 Naive Bayes, §4.2.1 Laplace smoothing, and §4.2.2 event models for text classification
      (multinomial vs Bernoulli)
    angle_detail: These are two genuinely different models — one counts occurrences, one records presence — and
      they give different answers on the same documents. L14 introduces multinomial Naive Bayes without naming
      the alternative, which makes it easy to apply the wrong likelihood. §4.2.2 is two pages and settles it.
      Also gives the maximum-likelihood derivation of the smoothed estimates rather than presenting smoothing
      as a hack.
  - unit_id: unit-m2-sad-l15
    title: CS229 §7 — compact neural-network derivation
    format: course-material
    angle: Backpropagation written out as matrix derivative bookkeeping, in the most compact correct form available
      here.
    covers:
    - knowledge-sad-l15-forward
    - knowledge-sad-l15-backprop
    depth: advanced-reference
    scope: complementary
    locator: Main notes §7 Deep Learning (the neural-network and backpropagation sections)
    angle_detail: Six pages that state the forward pass, define the loss, and derive the layer-by-layer gradients
      with explicit shapes. If you already understand the chain rule and want the algorithm precisely, this is
      faster than any book on the shelf. If you do not yet have the picture, it will be opaque — start with 3Blue1Brown
      episodes 3-4 and return here.
