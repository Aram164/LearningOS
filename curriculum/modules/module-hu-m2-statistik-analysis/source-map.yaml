- source_id: source-3b1b-essence-of-calculus
  role: intuition
  why: Short visual previews for limits, derivatives, Taylor, and integration when the cold diagnostic exposes
    a missing mental picture.
  priority: 2
  unit_routes:
  - unit_id: unit-m2-analysis-exam-prep
    title: 3Blue1Brown — Essence of Calculus
    format: video
    angle: Geometric intuition, not technique. Shows why the limit, the derivative, the integral and the Taylor
      approximation are the shapes they are — useless for producing an epsilon-N argument. Watch, then return
      to the script.
    covers:
    - knowledge-an-limits-continuity
    - knowledge-an-differentiation
    - knowledge-an-taylor
    - knowledge-an-integration
    depth: intuition
    scope: complementary
    locator: 'Essence of Calculus episodes: derivative and chain rule, limits (with l''Hôpital), integration and
      the fundamental theorem, Taylor series'
  - unit_id: unit-m2-sad-l03
    title: 3Blue1Brown — what a derivative is, before gradient descent uses one
    format: video
    depth: intuition
    scope: prerequisite
    locator: Essence of Calculus episodes 2 ('The paradox of the derivative') and 3 ('Derivative formulas through
      geometry')
    covers:
    - knowledge-sad-l03-gradient-descent
    angle: Restores the derivative as a slope you can see, which gradient descent's update rule silently assumes
      you still hold.
    angle_detail: 'L03''s optimiser takes a step proportional to the negative derivative, and that rule is only
      obvious if the derivative is still a slope in your mind rather than a differentiation rule you once memorised.
      Two episodes restore the picture. Routed as a prerequisite rather than a supplement: if the derivative is
      solid, skip it entirely.'
  - unit_id: unit-m2-sad-l15
    title: 3Blue1Brown — the chain rule, which is all backpropagation is
    format: video
    depth: intuition
    scope: prerequisite
    locator: Essence of Calculus episode 4 ('Visualizing the chain rule and product rule')
    covers:
    - knowledge-sad-l15-backprop
    angle: Makes the chain rule a statement about how one small nudge propagates, which is exactly the quantity
      backpropagation computes.
    angle_detail: Backpropagation is the chain rule applied repeatedly, so if the chain rule is a symbolic manipulation
      rather than a claim about how a change in one quantity affects another downstream, the derivation cannot
      mean anything. This episode fixes that in fifteen minutes, and it is the natural companion to the neural-network
      playlist's episode 4, which assumes it.
