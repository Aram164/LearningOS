- source_id: source-brandon-foltz
  role: intuition
  why: Calm step-by-step alternative for Poisson, confidence intervals, and tests when a short explainer is too
    fast.
  priority: 21
  unit_routes:
  - unit_id: unit-m2-sad-l07
    title: Brandon Foltz — Poisson distribution walkthrough
    format: video
    angle: A slow, single-topic walkthrough for when the shorter explanations have not worked.
    covers:
    - knowledge-sad-l07-poisson
    depth: orientation
    scope: complementary
    locator: '''Introduction to the Poisson Distribution'' (≈25 min)'
    angle_detail: 'Foltz''s videos are two to three times longer than StatQuest''s on the same topic, and that
      is their purpose: he restates each step several ways and works a full example without skipping arithmetic.
      Routed here as the fallback route for L07''s hardest single distribution — if the short explanations have
      already landed, skip it, because the length is real.'
  - unit_id: unit-m2-sad-l09
    title: Brandon Foltz — confidence-interval walkthroughs
    format: video
    angle: Spends most of a video on interpretation — what a 95% interval does and does not claim — before any
      computation.
    covers:
    - knowledge-sad-l09-standard-error
    - knowledge-sad-l09-z-interval
    - knowledge-sad-l09-t-interval
    depth: orientation
    scope: complementary
    locator: '''Confidence Intervals'' parts 1-3 (≈25-30 min each)'
    angle_detail: The standard misinterpretation ('there is a 95% probability the parameter is in this interval')
      is the most commonly examined conceptual point in L09, and it survives most brief treatments. Foltz attacks
      it directly and at length, with the repeated-sampling picture. Worth the time once.
  - unit_id: unit-m2-sad-l10
    title: Brandon Foltz — hypothesis-testing walkthroughs
    format: video
    angle: Walks a complete test end to end without cuts, including the parts other explanations skip as obvious.
    covers:
    - knowledge-sad-l10-test-model
    - knowledge-sad-l10-tails-pvalue
    - knowledge-sad-l10-z-t
    depth: orientation
    scope: complementary
    locator: '''Hypothesis Testing'' parts 1-3 and the ''Statistical Power'' videos (≈25-30 min each)'
    angle_detail: Useful specifically when a worked solution loses you at a step everyone else treats as trivial
      — choosing the critical value, deciding the direction, writing the conclusion. Foltz does not skip those.
      Long; use as a repair route rather than a first pass.
