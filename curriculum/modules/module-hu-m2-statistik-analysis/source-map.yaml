    angle_detail: 'The useful part is the framing: where trees sit relative to everything else in the course,
      what they are good at (heterogeneous tabular features, interpretability) and what they are bad at. That
      judgment is hard to get from a textbook and is the kind of thing a conceptual exam question rewards. The
      technical content is above SaD''s level in places; watch for the framing.'
  - unit_id: unit-m2-sad-l14
    title: Stanford CS229 — generative-classifier lecture
    format: course
    angle: Sets up the generative-versus-discriminative distinction, which is the category Naive Bayes belongs
      to and which L14 never names.
    covers:
