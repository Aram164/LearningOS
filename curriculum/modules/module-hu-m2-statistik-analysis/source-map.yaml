    locator: Complete article, 9 pages (CACM 55(10), 2012)
    angle_detail: 'This is the single best-value item on the L11 stage: it takes half an hour and it supplies
      the ''why does this matter'' layer for almost every node in the lecture. Its central points — learning is
      induction and therefore needs assumptions, more data usually beats a better algorithm, feature engineering
      is where the work is — are exactly what L11''s pipeline slides assert without argument. Also the best available
      preparation for a conceptual exam question, because it is written as argument rather than as definition.'
- source_id: source-esl
  role: optional-depth
  why: 'Advanced-reference layer for the ML half: the resampling, stacking, nearest-neighbour and cluster-analysis
    chapters that ISLP compresses; used only when a recorded error needs the deeper treatment.'
  priority: 33
  unit_routes:
  - unit_id: unit-m2-sad-l11
    title: ESL Ch 7 - what cross-validation and the bootstrap actually estimate
    format: book
    angle: L11 presents cross-validation and bootstrapping as confidence-raising procedures; this chapter separates
      the bias-variance decomposition from the estimator of test error, which is the distinction the deck's 'which
      k?' slide leaves open. Open only when a recorded error needs it.
    covers:
    - knowledge-sad-l11-resampling
    - knowledge-sad-l11-generalization
    depth: advanced-reference
    scope: optional
    locator: Sections 7.2-7.3, pp. 238-247; section 7.10 cross-validation, p. 260; section 7.11 bootstrap methods,
      p. 268
    angle_detail: The reference statement of what resampling actually estimates. §§7.2-7.3 (pp. 238-247) distinguish
      test error from expected test error and derive the optimism of the training error, which is the precise
      version of L11's claim that training error is not a fair estimate. §7.10 (p. 260) then explains what cross-validation
      estimates and why the number of folds is a bias-variance trade-off in its own right. Graduate level; read
      the specific sections rather than the chapter.
  - unit_id: unit-m2-sad-l12
    title: ESL - the ensemble chapters behind the L12 summary slide
    format: book
    angle: 'Supplies the derivations the deck summarises in four bullets: why AdaBoost fits an additive model
      under exponential loss, what random forests do to variance, and the model-averaging view that stacking belongs
      to.'
    covers:
    - knowledge-sad-l12-tree-model
    - knowledge-sad-l12-bagging-forest
    - knowledge-sad-l12-boosting
    - knowledge-sad-l12-stacking
    depth: advanced-reference
    scope: optional
    locator: Section 9.2 tree-based methods, p. 324; section 8.8 model averaging and stacking, p. 307; Chapter
      10 boosting and additive trees, pp. 356-407; Chapter 15 random forests, pp. 606-623
    angle_detail: The research-level accounts behind L12's summary slides. §9.2 (p. 324) is CART stated properly;
      Ch 10 (pp. 356-407) develops boosting as forward stagewise additive modelling, which is where the algorithm
      actually comes from; Ch 15 (pp. 606-623) is the random-forest analysis including why decorrelation reduces
      variance. §8.8 (p. 307) covers stacking. Use it to settle a specific question — this is not a first-pass
      reading and each section assumes the ones before it.
  - unit_id: unit-m2-sad-l13
    title: ESL Ch 13 - nearest neighbours and the cost of searching them
    format: book
    angle: 'Section 13.5 is the closest registered treatment of the L13 indexing problem: it states the computational
      cost of exact nearest-neighbour search and the editing/condensing responses, though it does not cover kd-trees,
      M-trees or LSH.'
    covers:
    - knowledge-sad-l13-neighbors
    - knowledge-sad-l13-exact-indexing
    depth: advanced-reference
    scope: optional
    locator: Section 13.3 k-nearest-neighbor classifiers, p. 482; section 13.5 computational considerations, p.
      499 (editing and condensing)
    angle_detail: §13.3 (p. 482) is the theoretical treatment of nearest neighbours, including the asymptotic
      error-rate result that bounds 1-NN's error by twice the Bayes rate — a striking fact L13 does not mention.
      §13.5 (p. 499) covers editing and condensing the training set to make search cheaper, which is the classical
      counterpart to the deck's indexing material and the closest any book here comes to it. Reference-only, but
      the L13 indexing half is otherwise unsupported.
  - unit_id: unit-m2-sad-clustering
    title: ESL 14.3 - cluster analysis as an objective, not an algorithm
    format: book
    angle: Frames clustering by its loss function and dissimilarity choice before any algorithm, which is the
      'no single true clustering' point the UE7 slides make rhetorically.
    covers:
    - knowledge-sad-clustering-families
    - knowledge-sad-clustering-evaluation
    depth: advanced-reference
    scope: optional
    locator: Section 14.3 cluster analysis, pp. 520-546
- source_id: source-3b1b-linear-algebra
  role: intuition
  why: Targeted visual support for vector, matrix, and covariance geometry already selected by L01 and L03.
  priority: 34
  unit_routes:
  - unit_id: unit-m2-sad-l03
    title: 3Blue1Brown — vectors, dot products, and matrix transformations
    format: video
    angle: Makes the design matrix a transformation rather than a table, which is what L03's multivariate notation
      assumes.
    covers:
    - knowledge-sad-l03-multivariate
    - knowledge-sad-l03-gradient-descent
    depth: orientation
    scope: complementary
    locator: Essence of Linear Algebra, episodes 1-4 (vectors, linear combinations, linear transformations, matrix
      multiplication) and episode 9 (dot products)
    angle_detail: L03 moves from a single predictor to a design matrix and a normal equation in a few slides,
      and that jump silently assumes matrix-vector multiplication is a familiar operation with a geometric meaning.
      These episodes supply exactly that meaning — a matrix as a transformation, multiplication as composition,
      the dot product as projection. The projection reading of the dot product in episode 9 is what later makes
      least squares recognisable as an orthogonal projection.
