- source_id: source-grinstead-snell
  role: first-exposure
  why: Open-access probability text whose chapter boundaries line up almost exactly with SaD L04-L08, so one free
    book covers the probability spine end to end.
  priority: 4
  unit_routes:
  - unit_id: unit-m2-sad-l04
    title: Grinstead & Snell Ch 4 — conditional probability
    format: book
    depth: course-aligned
    scope: complementary
    locator: Ch 4 Conditional Probability §§4.1-4.3 (discrete conditional probability, continuous conditional
      probability, paradoxes), with the chapter exercises
    covers:
    - knowledge-sad-l04-conditional
    - knowledge-sad-l04-bayes
    - knowledge-sad-l04-independence
    angle: Open-access and legally free to keep, with a paradoxes section that attacks the intuition failures
      L04 opens on.
    angle_detail: The AMS releases this under a licence that lets you keep and print it, which matters for a text
      you will return to across three lectures. §4.3 collects the classic conditional-probability paradoxes —
      Monty Hall, the two-child problem, the prisoner's dilemma — and resolves each by making the conditioning
      event explicit. That is the same diagnosis L04's framing slides make, worked out at length rather than asserted.
      The exercises are plentiful and answers to odd-numbered ones are published.
  - unit_id: unit-m2-sad-l05
    title: Grinstead & Snell Ch 3 — combinatorics
    format: book
    depth: course-aligned
    scope: complementary
    locator: Ch 3 Combinatorics §3.1 permutations, §3.2 combinations, §3.3 card shuffling, with the chapter exercises
    covers:
    - knowledge-sad-l05-permutations
    - knowledge-sad-l05-variations
    - knowledge-sad-l05-combinations
    - knowledge-sad-l05-identities
    - knowledge-sad-l05-counting-probability
    angle: Proves the binomial identities L05 lists, and uses card shuffling as a running example that makes the
      counting concrete.
    angle_detail: '§3.2 does not merely state Pascal''s identity and the binomial theorem — it proves them and
      then uses them, which is what L05''s identities node needs and does not supply. The card-shuffling section
      is unusual and useful: it applies the counting machinery to a physical process, so the abstractions acquire
      a referent. Free and open-access, with a large exercise set.'
  - unit_id: unit-m2-sad-l06
    title: Grinstead & Snell Ch 6 — expected value and variance
    format: book
    depth: course-aligned
    scope: complementary
    locator: Ch 6 Expected Value and Variance §6.1 expected value of discrete random variables, §6.2 variance
      of discrete random variables, §6.3 continuous random variables
    covers:
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    - knowledge-sad-l06-transformations
    angle: Separates the discrete and continuous cases into their own sections while keeping one chapter, so the
      parallel between sum and integral stays visible.
    angle_detail: Splitting by chapter (as Fahrmeir does) makes the PMF/PDF distinction unmissable but hides the
      analogy; merging them (as L06 does) shows the analogy but blurs the distinction. This chapter's three-section
      structure gets both — the definitions are stated separately and then compared directly. Good middle route
      if Fahrmeir felt slow and the deck felt fast.
  - unit_id: unit-m2-sad-l07
    title: Grinstead & Snell Ch 5 — important distributions
    format: book
    depth: course-aligned
    scope: complementary
    locator: Ch 5 Distributions and Densities §5.1 important distributions (discrete), §5.2 important densities,
      with the chapter exercises
    covers:
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-hypergeometric
    - knowledge-sad-l07-geometric
    - knowledge-sad-l07-poisson
    - knowledge-sad-l07-model-selection
    angle: Catalogues the discrete families with a simulation for each, so the shape of every distribution is
      seen before its formula is used.
    angle_detail: The book's approach throughout is to simulate first and derive second, and for L07 that means
      each distribution appears as a histogram from a generating process before its PMF is written. Seeing the
      geometric's decay and the Poisson's shape as outputs of a described experiment is a good defence against
      choosing the wrong model, which is the actual exam risk here.
  - unit_id: unit-m2-sad-l08
    title: Grinstead & Snell Ch 8-9 — law of large numbers and the central limit theorem
    format: book
    depth: derivation
    scope: complementary
    locator: Ch 8 Law of Large Numbers §§8.1-8.2 and Ch 9 Central Limit Theorem §§9.1-9.3, with the chapter exercises
    covers:
    - knowledge-sad-l08-clt
    - knowledge-sad-l08-approximation
    - knowledge-sad-l08-normal
    angle: Gives the LLN and the CLT a chapter each, so the two limit theorems can never be read as one.
    angle_detail: Conflating the law of large numbers with the central limit theorem is the standard L08 error,
      and a chapter boundary is the strongest structural defence against it. Ch 8 proves the weak law from Chebyshev;
      Ch 9 states the CLT for the Bernoulli case first, where it can be checked numerically, then generalises.
      Ch 9's discrete-case treatment includes the continuity correction with its justification, which most texts
      state as a rule.
- source_id: source-islp
  role: reference
  why: Ch 2 for workflow/evaluation, Ch 8 for trees/ensembles, Ch 4 for Naive Bayes, Ch 10 for neural nets.
  priority: 4
  unit_routes:
  - unit_id: unit-m2-sad-l03
    title: ISLP Chapter 3 — statistical regression bridge
    format: book
    angle: 'Adds the inferential layer L03 omits: standard errors, t-statistics and confidence intervals for the
      fitted coefficients.'
    covers:
    - knowledge-sad-l03-simple-regression
    - knowledge-sad-l03-multivariate
    - knowledge-sad-l03-scaling-weights
    depth: derivation
    scope: complementary
    locator: Ch 3 Linear Regression, pdf pp. 78-143 (§3.1 simple linear regression p. 79; §3.2 multiple linear
      regression p. 87; §3.3 other considerations p. 98); read alongside the repository's Regression Bridge note
      §§2, 4 and 7
    angle_detail: L03 fits a line and stops; ISLP fits the same line and then asks whether the slope is distinguishable
      from zero. That question is not examinable in L03 — it belongs to L10 — but knowing it exists changes how
      you read a regression output, and it is the bridge between the module's two halves. §3.3 covers the practical
      issues (collinearity, non-linearity, outliers) that L03's model-limits node names without elaborating. The
      Regression Bridge note in this repository already maps which ISLP sections correspond to which SaD slides.
  - unit_id: unit-m2-sad-l11
    title: ISLP Chapter 2 — statistical-learning workflow
    format: book
    angle: Derives the bias-variance decomposition algebraically, which L11 states as a picture of two curves
      crossing.
    covers:
    - knowledge-sad-l11-tasks
    - knowledge-sad-l11-resampling
    - knowledge-sad-l11-objectives
    - knowledge-sad-l11-generalization
    depth: derivation
    scope: complementary
    locator: Ch 2 Statistical Learning, pdf pp. 25-77 (§2.1 what is statistical learning p. 26; §2.2 assessing
      model accuracy, with the bias-variance decomposition, p. 37; §2.3 lab p. 48)
    angle_detail: §2.2 shows the expected test error splitting into three named terms — squared bias, variance
      and irreducible error — and the derivation is short enough to follow at first reading. That is the content
      behind L11's U-shaped test-error curve, and having the algebra makes the trade-off a consequence rather
      than an empirical observation. The chapter also draws the distinction between prediction and inference as
      two different reasons to fit a model, which reframes what the pipeline is for.
  - unit_id: unit-m2-sad-l12
    title: ISLP §§8.1–8.2 — trees and ensembles
    format: book
    angle: Separates the two reasons ensembles help — variance reduction by averaging, bias reduction by sequential
      fitting — instead of listing methods.
    covers:
    - knowledge-sad-l12-tree-model
    - knowledge-sad-l12-regression
    - knowledge-sad-l12-pruning
    - knowledge-sad-l12-bagging-forest
    - knowledge-sad-l12-boosting
    depth: derivation
    scope: complementary
    locator: Ch 8 Tree-Based Methods, pdf pp. 338-372 (§8.1 the basics of decision trees p. 339; §8.2 bagging,
      random forests, boosting and BART p. 351; Ch 8 lab p. 361)
    angle_detail: 'L12 presents bagging, random forests, boosting and stacking as a family of techniques. ISLP
      organises the same material around the mechanism: bagging and forests reduce variance by averaging decorrelated
      trees, boosting reduces bias by fitting each tree to the residual of the last. Once that split is clear,
      the differences between the methods stop being arbitrary details. §8.2 also explains why random forests
      decorrelate by restricting the feature subset, which the deck asserts.'
  - unit_id: unit-m2-sad-l14
    title: ISLP §4.4.4 and lab — Naive Bayes in application
    format: book
    angle: Places Naive Bayes beside LDA and QDA, so its assumption is visible as one point on a spectrum of covariance
      assumptions.
    covers:
    - knowledge-sad-l14-nb-recap
    - knowledge-sad-l14-gaussian
    depth: derivation
    scope: complementary
    locator: Ch 4 Classification, pdf pp. 144-208 — §4.4.4 Naive Bayes and the Ch 4 lab (Naive Bayes on the Smarket
      data)
    angle_detail: '§4.4 develops LDA (shared covariance), QDA (per-class covariance) and then Naive Bayes (diagonal
      covariance — features conditionally independent) as three points on the same spectrum. That framing answers
      the question L14 leaves open: what is actually being given up by the naive assumption, and when does giving
      it up pay. The lab then runs all three on the same data so the trade-off is observed rather than argued.'
  - unit_id: unit-m2-sad-l15
    title: ISLP §§10.1–10.2 — gentle neural-network introduction
    format: book
    angle: Written for readers who already know linear regression, so every neural-network idea is introduced
      as a modification of something familiar.
    covers:
    - knowledge-sad-l15-neuron
    - knowledge-sad-l15-activation
    - knowledge-sad-l15-output
    - knowledge-sad-l15-forward
    - knowledge-sad-l15-training
    depth: derivation
    scope: complementary
    locator: Ch 10 Deep Learning, pdf pp. 406-462 (§10.1 single layer neural networks p. 407; §10.2 multilayer
      neural networks p. 409; Ch 10 lab p. 439)
    angle_detail: '§10.1 literally begins by writing a single-layer network as a linear model with a nonlinear
      transformation of derived features, which is L15''s own opening claim made precise. For a reader coming
      from L03 rather than from a deep-learning course, this is the least disorienting introduction on the shelf.
      It is also the shallowest: no backpropagation derivation, and the training discussion is brief. Pair with
      Marsland Ch 4 or Nielsen Ch 2 for the gradient work.'
  - unit_id: unit-m2-sad-clustering
    title: ISLP §12.2 — clustering algorithms and validation
    format: book
    angle: Optional depth on k-means, hierarchical clustering, practical choices, and validation after the UE7
      scope; it broadens rather than defines the exam topic.
    covers:
    - knowledge-sad-clustering-families
    - knowledge-sad-clustering-kmeans
    - knowledge-sad-clustering-initialization
    - knowledge-sad-clustering-evaluation
    depth: advanced-reference
    scope: complementary
    locator: §12.2
  - unit_id: unit-m2-sad-l10
    title: ISLP Ch 13 - the multiple-testing slide worked out with labs and exercises
    format: book
    angle: L10's closing slides name family-wise error and false discoveries and stop; this chapter separates
      the two error-management questions, gives Bonferroni and Holm for FWER and Benjamini-Hochberg for FDR, and
      ends with a lab and exercise set - the only registered practice for the node.
    covers:
    - knowledge-sad-l10-multiple
    depth: practice
    scope: complementary
    locator: Chapter 13, pp. 563-602 (false discovery rate p. 564; family-wise error rate p. 571; Bonferroni and
      Holm p. 573; Benjamini-Hochberg p. 581; lab section 13.6 p. 589; exercises section 13.7 p. 599)
    angle_detail: 'The most complete multiple-testing treatment on the shelf, and L10''s multiplicity node is
      one slide. The page map matters: family-wise error rate (p. 571) and Bonferroni/Holm (p. 573) are the conservative
      classical corrections; false discovery rate (p. 564) and Benjamini-Hochberg (p. 581) are the modern alternative
      that controls a different quantity entirely. Understanding that FWER and FDR are different targets — not
      competing approximations of one target — is the conceptual point, and it is the kind of distinction a written
      exam question can turn on. Lab at p. 589, exercises at p. 599.'
  - unit_id: unit-m2-sad-l09
    title: ISLP 5.2 - the bootstrap as a resampling estimate of standard error
    format: book
    angle: L09 introduces the bootstrap as a way to quantify uncertainty without a formula; this section builds
      the resampled standard error on a concrete estimator and then repeats it in a lab, which is the arithmetic
      the deck asserts.
    covers:
    - knowledge-sad-l09-bootstrap
    depth: practice
    scope: complementary
    locator: Section 5.2 the bootstrap, pp. 220-223; lab section 5.3, pp. 223-231; exercises section 5.4, p. 232
    angle_detail: §5.2 (pp. 220-223) states the bootstrap in three pages with the resampling diagram, then the
      lab (pp. 223-231) runs it in code on a real estimator so the sampling distribution is produced rather than
      described. L09 presents the bootstrap as a procedure; seeing the resampled estimates accumulate into a histogram
      is what makes the standard-error claim believable. Exercises at p. 232. Read Dekking Ch 18 first for the
      principle, then this for the execution.
