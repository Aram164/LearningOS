- source_id: source-swanson-principles-probability
  role: reference
  why: Despite its title, this is a formal-logic/measure-theory text and is not selected for the SaD probability
    syllabus.
  priority: 99
  unit_routes:
  - unit_id: unit-m2-sad-l06
    title: Swanson — the measure-theoretic definition behind the random-variable language
    format: book
    depth: advanced-reference
    scope: out-of-scope
    locator: The Principles of Probability (LNM 2384), the chapters defining sigma-algebras, measurable functions
      and the abstract expectation integral
    covers:
    - knowledge-sad-l06-random-variable
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-distribution-functions
    angle: Says what a random variable formally is — a measurable function — which every course-level source deliberately
      avoids.
    angle_detail: Routed here as a deliberate boundary marker, not as study material. L06 defines a random variable
      as 'a variable whose value depends on chance', which is a description rather than a definition, and some
      readers find that unsatisfying enough to be distracting. This is where the actual definition lives, along
      with the reason discrete and continuous cases can be treated by one integral. Reading it will cost days
      and will not help the exam. Open it to see that the answer exists, then close it.
