- source_id: source-bendersky-normal-equation
  role: derivation
  why: A short technical article deriving the normal equation from scratch, filling the one derivation gap in
    L03's regression sequence.
  priority: 5
  unit_routes:
  - unit_id: unit-m2-sad-l03
    title: Bendersky — derivation of the normal equation
    format: website
    depth: derivation
    scope: complementary
    locator: The complete article 'Derivation of the Normal Equation for linear regression' (eli.thegreenplace.net),
      both the calculus and the linear-algebra derivations
    covers:
    - knowledge-sad-l03-multivariate
    - knowledge-sad-l03-simple-regression
    angle: Derives the same closed-form solution twice — once by calculus, once by projection — which is the connection
      L03 leaves implicit.
    angle_detail: 'L03 states the normal equation and moves to gradient descent. This article shows where it comes
      from: set the gradient of the squared-error objective to zero and solve, then separately, project the target
      vector onto the column space of the design matrix and get the identical result. Seeing both is what turns
      the formula from something to memorise into something with two independent justifications. Assumes matrix
      notation, so read 3Blue1Brown''s episodes 1-4 and 9 first if that is shaky.'
- source_id: source-blitzstein-hwang
  role: derivation
