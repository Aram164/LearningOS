- source_id: source-tijms-understanding-probability
  role: optional-depth
  why: Simulation-first escape hatch and particularly useful LLN/CLT intuition; use only for L04–L08.
  priority: 12
  unit_routes:
  - unit_id: unit-m2-sad-l04
    title: Tijms — simulation-first probability intuition
    format: book
    angle: 'Two passes over Bayes, deliberately separated: an informal chance-tree chapter in Part One, a formal
      one in Part Two.'
    covers:
    - knowledge-sad-l04-conditional
    - knowledge-sad-l04-bayes
    depth: advanced-reference
    scope: complementary
    locator: Ch 6 Chance trees and Bayes' rule, pdf pp. 218-234; Ch 8 Conditional probability and Bayes, pdf pp.
      255-274
    angle_detail: The book is split into 'Probability in action' and 'Essentials of probability', and Bayes appears
      in both. Ch 6 argues entirely with chance trees and real cases — medical screening, the notorious court
      cases — with no formal apparatus; Ch 8 restates the same results with the definitions in place. If L04's
      formal treatment did not land, reading Ch 6 alone and returning to the deck often fixes it, which is a cheaper
      repair than a full probability chapter. Tijms is also the best source here on why intuition fails on these
      problems, which is what L04's framing node is about.
  - unit_id: unit-m2-sad-l05
    title: Tijms — counting through probability models
    format: book
    angle: Counting kept subordinate to the sample-space model, with birthday- and lottery-style problems as the
      worked cases.
    covers:
    - knowledge-sad-l05-decision-grid
    - knowledge-sad-l05-counting-probability
    depth: advanced-reference
    scope: complementary
    locator: Ch 7 Foundations of probability theory, pdf pp. 235-254 (finite sample spaces and the Laplace model)
    angle_detail: Tijms treats combinatorial questions as questions about the size of a well-chosen sample space,
      and his worked cases — coincidences, lotteries, matching problems — are the ones whose answers are counterintuitive
      enough to be memorable. Useful as a second pass after the mechanics are in place from L05's grid, less useful
      as a first exposure because he does not tabulate the cases.
  - unit_id: unit-m2-sad-l06
    title: Tijms — random variables by experiment and simulation
    format: book
    angle: States each rule for expectation and variance as a numbered 'basic rule' and then immediately tests
      it against a simulation.
    covers:
    - knowledge-sad-l06-distribution-functions
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    - knowledge-sad-l06-concentration
    depth: advanced-reference
    scope: complementary
    locator: Ch 9 Basic rules for discrete random variables, pdf pp. 275-295; Ch 10 §§10.1-10.3 Continuous random
      variables, pdf pp. 296-324; Ch 11 §11.4 Covariance and correlation coefficient, pdf pp. 325-342
    angle_detail: 'The chapter title is literal: the rules are enumerated and each is checked by a simulation
      whose code and output are shown. For a lecture whose content is a small set of algebraic identities (linearity,
      variance of a scaled variable, variance of a sum under independence), seeing each one confirmed numerically
      is a strong antidote to misremembering which of them needs independence. §11.4 gives covariance with the
      correlation coefficient bounded in [-1,1] and proved.'
  - unit_id: unit-m2-sad-l07
    title: Tijms — discrete-distribution modeling examples
    format: book
    angle: Ch 4 is an entire chapter of rare-event modelling — the Poisson's natural habitat — before the distribution
      is ever defined formally.
    covers:
    - knowledge-sad-l07-model-selection
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-hypergeometric
    - knowledge-sad-l07-geometric
    - knowledge-sad-l07-poisson
    depth: advanced-reference
    scope: complementary
    locator: Ch 9 Basic rules for discrete random variables, pdf pp. 275-295; Ch 4 Rare events and lotteries,
      pdf pp. 115-152
    angle_detail: Lottery coincidences, near-misses and clusters, worked out with counts and simulations. It is
      the most convincing answer available to why the Poisson deserves its own model rather than being a Binomial
      special case, which is what L07's model-selection node needs you to have internalised. Read it for the modelling
      judgment, not for formulas — the formal statements are in Ch 9.
  - unit_id: unit-m2-sad-l08
    title: Tijms — LLN and CLT intuition
    format: book
    angle: Demonstrates the CLT by simulation across several different starting distributions, so the universality
      claim is seen rather than asserted.
    covers:
    - knowledge-sad-l08-clt
    - knowledge-sad-l08-approximation
    depth: advanced-reference
    scope: complementary
    locator: Ch 5 Probability and statistics, pdf pp. 153-217 (§5.8 the central limit theorem and random walks);
      Ch 10 §10.2 Important probability densities, pdf pp. 296-324
    angle_detail: The striking part of the CLT is that the starting distribution does not matter, and that is
      exactly the part a formula cannot convey. Tijms runs the same averaging experiment on visibly different
      distributions and shows the same Normal shape emerging each time. §5.9 on Benford's law and §5.10 are outside
      SaD scope but are short and make the point that a limit theorem is a claim about the world. No likelihood
      content.
