      vocabulary from this section. §2.2 is also the only treatment here that takes categorical data seriously
      as its own case with contingency tables, which is where Simpson's paradox lives.
  - unit_id: unit-m2-sad-l03
    title: OpenIntro — correlation and linear regression
    format: book
    angle: Makes residual plots a first-class diagnostic, so a fitted line is something you check rather than
      something you report.
    covers:
    - knowledge-sad-l03-paired-data
    - knowledge-sad-l03-covariance
    - knowledge-sad-l03-interpretation
    - knowledge-sad-l03-simple-regression
    depth: orientation
    scope: complementary
    locator: Ch 8 introduction to linear regression, pdf pp. 303-340 (§8.1 fitting a line, residuals, and correlation
      p. 305; §8.2 least squares regression p. 317; §8.3 types of outliers p. 328; §8.4 inference for linear regression
      p. 331)
    angle_detail: §8.1 introduces residuals before it introduces the least-squares criterion, and §8.3 catalogues
      the ways a single point can dominate a fit — leverage, influence, outliers — with pictures. L03 derives
      the line and stops; the model-limits node at the end of the lecture is exactly this material, unelaborated.
      Reading §8.3 is the cheapest protection against the exam question that shows a scatterplot and asks whether
      the reported r is trustworthy. §8.4's inference is L10 material — leave it until then.
  - unit_id: unit-m2-sad-l04
    title: OpenIntro — probability foundations
    format: book
    angle: Runs conditional probability entirely through tree diagrams and contingency tables, so Bayes is arithmetic
      on a table before it is an equation.
    covers:
    - knowledge-sad-l04-events
    - knowledge-sad-l04-conditional
    - knowledge-sad-l04-bayes
    - knowledge-sad-l04-independence
    depth: orientation
    scope: complementary
    locator: Ch 3 §3.1 defining probability, pdf pp. 81-94; §3.2 conditional probability, pdf pp. 95-111 (tree
      diagrams and Bayes' theorem); §3.3 sampling from a small population, pdf pp. 112-114
    angle_detail: '§3.2 develops the whole of conditioning pictorially: a two-way table, then a tree with branch
      probabilities, then Bayes as a ratio read off the tree. Only at the end does the algebraic form appear.
      For a first pass this is the lowest-friction route available, and it matches how German exams pose the question
      (Vierfeldertafel). It does not cover Naive Bayes and does not do conditional independence carefully — for
      those parts of L04 use the deck and Kelleher Ch 6.'
  - unit_id: unit-m2-sad-l05
    title: OpenIntro — finite counting inside probability
    format: book
    angle: 'Almost no combinatorics on purpose: it shows which L05 results survive when counting is replaced by
      simulation and tables.'
    covers:
    - knowledge-sad-l05-counting-probability
    depth: orientation
    scope: complementary
    locator: Ch 3 §3.3 sampling from a small population, pdf pp. 112-114; Ch 4 §4.3 binomial distribution, pdf
      pp. 149-157
    angle_detail: 'OpenIntro reaches the binomial coefficient in a single paragraph inside §4.3 and never builds
      a counting apparatus. Routed here as an honest boundary marker rather than as study material: it tells you
      which of L05''s machinery an applied statistics course considers optional. If the aim is to pass L05''s
      counting questions, this is the wrong source — use Blitzstein Ch 1 or Schaum''s Ch 2. Kept on the menu so
      the absence is visible rather than an accidental gap.'
  - unit_id: unit-m2-sad-l06
    title: OpenIntro Chapter 4 — distribution bridge
    format: book
    angle: Ten pages on random variables with expectation and variance introduced through an expected-profit calculation
      rather than through a definition.
    covers:
    - knowledge-sad-l06-random-variable
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    - knowledge-sad-l06-sample-mean
    depth: orientation
    scope: complementary
    locator: Ch 3 §3.4 random variables, pdf pp. 115-124; §3.5 continuous distributions, pdf pp. 125-130
    angle_detail: '§3.4 defines E[X] by working out the expected revenue of a lottery-like setup and then naming
      the computation, which makes the linearity property feel like an accounting fact. That is a lighter entry
      than Blitzstein''s Ch 4 and enough for L06''s expectation node, but it stops well short: no LOTUS, no covariance,
      no Chebyshev. Use it to get started and switch to Blitzstein or Dekking for the transformation and concentration
      nodes.'
  - unit_id: unit-m2-sad-l07
    title: OpenIntro Chapter 4 — common distributions
    format: book
    angle: Each distribution gets a stated checklist of conditions before its formula, which is the exact form
      of L07's model-selection question.
    covers:
    - knowledge-sad-l07-model-selection
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-poisson
    depth: orientation
    scope: complementary
    locator: Ch 4 §4.2 geometric distribution, pdf pp. 144-148; §4.3 binomial distribution, pdf pp. 149-157; §4.4
      negative binomial, pdf pp. 158-162; §4.5 Poisson distribution, pdf pp. 163-167
    angle_detail: §4.3 opens with four numbered conditions a situation must satisfy for a binomial model to apply,
      and the later sections follow the same pattern. L07's model-selection node is asking precisely for that
      checklist, and having it in list form is more usable under exam pressure than a prose description. Hypergeometric
      is thin here (it lives in §3.3 as 'sampling from a small population') — Fahrmeir §5.3 or Blitzstein §3.4
      covers it properly.
  - unit_id: unit-m2-sad-l08
    title: OpenIntro Chapter 4 — Normal and sampling distributions
    format: book
    angle: Builds the CLT out of a simulation the reader can picture — repeated samples, one histogram of their
      means — before any statement of the theorem.
    covers:
    - knowledge-sad-l08-normal
    - knowledge-sad-l08-standardization
    - knowledge-sad-l08-clt
    - knowledge-sad-l08-approximation
    depth: orientation
    scope: complementary
    locator: Ch 4 §4.1 normal distribution, pdf pp. 133-143 (Z-scores, percentiles, 68-95-99.7 rule); Ch 5 §5.1
      point estimates and sampling variability, pdf pp. 170-180 (the sampling distribution of the mean and the
      CLT statement)
    angle_detail: §5.1 shows the sampling distribution being constructed by repetition, so 'the distribution of
      the sample mean' becomes a concrete object rather than a phrase. That picture is what makes the standard
      error formula in L09 obviously about a distribution of means rather than of data. §4.1 drills z-score conversion
      in both directions with a table, which is the mechanical L08 skill. No likelihood content and no proof of
      the CLT — deliberately, since the course does not need one.
  - unit_id: unit-m2-sad-l09
    title: OpenIntro Chapter 5 — confidence intervals
    format: book
    angle: Introduces confidence intervals on a proportion first, where the standard error has no nuisance parameter
      to estimate.
    covers:
    - knowledge-sad-l09-standard-error
    - knowledge-sad-l09-z-interval
    - knowledge-sad-l09-t-interval
    depth: orientation
    scope: complementary
    locator: Ch 5 §5.1 point estimates and sampling variability, pdf pp. 170-180; §5.2 confidence intervals for
      a proportion, pdf pp. 181-188; Ch 7 §7.1 one-sample means with the t-distribution, pdf pp. 251-261
    angle_detail: By starting with a proportion, §5.2 gets to a complete interval before the reader has to deal
      with an unknown sigma, so the interpretation of 'confident' can be discussed on its own. Then §7.1 introduces
      the t-distribution specifically as the correction needed once sigma is estimated — which is exactly the
      z-versus-t decision L09 asks you to make, presented as a consequence rather than a rule. The repeated-interval
      simulation picture in §5.2 is also the standard defence against the classic misinterpretation the exam likes
      to test.
  - unit_id: unit-m2-sad-l10
    title: OpenIntro Chapters 5–7 — tests by data type
    format: book
    angle: Teaches the p-value through randomisation before any reference distribution appears, and has the only
      real power section on the shelf.
    covers:
    - knowledge-sad-l10-test-model
    - knowledge-sad-l10-tails-pvalue
    - knowledge-sad-l10-z-t
    - knowledge-sad-l10-chi-square
    depth: orientation
    scope: complementary
    locator: Ch 5 §5.3 hypothesis testing for a proportion, pdf pp. 189-205; Ch 6 §6.3 testing for goodness of
      fit using chi-square, pdf pp. 229-239; §6.4 testing for independence in two-way tables, pdf pp. 240-248;
      Ch 7 §7.1 one-sample means with the t-distribution, pdf pp. 251-261; §7.4 power calculations, pdf pp. 278-284
    angle_detail: '§5.3 builds the null distribution by shuffling the data — the malaria-vaccine simulation from
      Ch 2 — so a p-value is first seen as a proportion of shuffles at least as extreme as the observed result.
      Once that is concrete, the z and t reference distributions are recognisable as shortcuts for the same quantity.
      §7.4 then does what almost nothing else here does: computes power and required sample size explicitly, rather
      than defining power and moving on. §§6.3-6.4 cover both chi-square variants that L10 names.'
- source_id: source-sklearn-user-guide
  role: implementation
  why: The scikit-learn user guide — the reference that names, in code, every algorithm SaD L11-L15 teaches.
  priority: 6
  unit_routes:
  - unit_id: unit-m2-sad-l11
    title: scikit-learn user guide §3.1 — cross-validation
    format: documentation
    depth: implementation
    scope: complementary
    locator: 'User guide §3.1 ''Cross-validation: evaluating estimator performance'' and §3.4 ''Metrics and scoring'',
      with the linked examples'
    covers:
    - knowledge-sad-l11-resampling
    - knowledge-sad-l11-evaluation
    angle: Enumerates the resampling schemes as named, runnable splitters — KFold, StratifiedKFold, GroupKFold
      — with the situation each exists for.
    angle_detail: 'L11 names cross-validation as one idea. The user guide shows it is a family, and each member
      exists because of a specific failure: stratified splits for class imbalance, group splits when observations
      are not independent, time-series splits when order matters. Knowing that the plain version has failure modes
      is the conceptual content; the diagrams in §3.1 make the differences immediate.'
  - unit_id: unit-m2-sad-l12
    title: scikit-learn user guide §1.10 and §1.11 — trees and ensembles
    format: documentation
    depth: implementation
    scope: complementary
    locator: 'User guide §1.10 ''Decision Trees'' (including §1.10.7 mathematical formulation of the impurity
      criteria) and §1.11 ''Ensembles: Gradient boosting, random forests, bagging, voting, stacking'''
    covers:
    - knowledge-sad-l12-tree-model
    - knowledge-sad-l12-entropy-id3
    - knowledge-sad-l12-pruning
    - knowledge-sad-l12-bagging-forest
    - knowledge-sad-l12-boosting
    - knowledge-sad-l12-stacking
    angle: States the impurity criteria as formulas beside the parameter that selects them, tying L12's theory
      directly to a knob.
    angle_detail: §1.10.7 writes out the Gini and entropy criteria and the regression variance criterion, and
      the surrounding text explains what each pruning parameter (max_depth, min_samples_leaf, ccp_alpha) does
      to the resulting tree. That mapping from concept to parameter is a strong memory aid, and §1.11 does the
      same for all four ensemble families L12 names — including stacking, which most books skip.
  - unit_id: unit-m2-sad-l13
    title: scikit-learn user guide §1.6 — nearest neighbours and search structures
    format: documentation
    depth: implementation
    scope: complementary
    locator: User guide §1.6 'Nearest Neighbors', especially §1.6.4 K-D Tree, §1.6.5 Ball Tree and §1.6.6 'Choice
      of nearest neighbors algorithm'
    covers:
    - knowledge-sad-l13-neighbors
    - knowledge-sad-l13-aggregation
    - knowledge-sad-l13-metrics
    - knowledge-sad-l13-exact-indexing
    angle: One of the very few accessible treatments of exact search structures — K-D trees and ball trees — which
      L13 teaches and almost no ML book covers.
    angle_detail: 'L13''s exact-indexing node is genuinely underserved by this shelf: the ML textbooks treat k-NN
      as a brute-force scan and move on. §1.6.4-1.6.6 describe how K-D trees and ball trees prune the search,
      and — more valuably — §1.6.6 states when each stops helping, including the dimensionality at which brute
      force wins again. That is the practical form of the curse of dimensionality and directly supports the deck''s
      argument for approximate search.'
  - unit_id: unit-m2-sad-l14
    title: scikit-learn user guide §1.9 — naive Bayes variants
    format: documentation
    depth: implementation
    scope: complementary
    locator: 'User guide §1.9 ''Naive Bayes'': §1.9.1 Gaussian, §1.9.2 Multinomial, §1.9.3 Complement, §1.9.4
      Bernoulli, §1.9.5 Categorical'
    covers:
    - knowledge-sad-l14-nb-recap
    - knowledge-sad-l14-smoothing
    - knowledge-sad-l14-numeric
    - knowledge-sad-l14-gaussian
    - knowledge-sad-l14-multinomial
    angle: Lists all five variants side by side with the data type each assumes — the cleanest statement of what
      changes between them.
    angle_detail: 'L14 covers the Gaussian and multinomial variants and mentions that others exist. Seeing all
      five in one table makes the pattern explicit: the classifier is fixed and only the likelihood term changes
      with the feature type. Once that is clear, the variants stop being separate algorithms to memorise. The
      smoothing parameter alpha is documented alongside, with the default and its effect.'
- source_id: source-strang-calculus
  role: intuition
  why: Local gentle calculus chapters support Taylor and Riemann-integral intuition when video is unnecessary.
  priority: 6
  unit_routes:
  - unit_id: unit-m2-analysis-exam-prep
    title: Strang — Calculus
    format: book
    angle: 'Applied-first: integration and Taylor introduced through what they compute rather than how they are
      constructed. Complements 3B1B — Strang gives worked mechanics where 3B1B gives the picture. Chapters 2-4
      hold the same treatment of derivatives and their applications if the differentiation stage needs a second
      voice; Chapters 8-9 and 11-16 are multivariable and stay closed.'
    covers:
    - knowledge-an-limits-continuity
    - knowledge-an-differentiation
    - knowledge-an-taylor
    - knowledge-an-integration
    depth: intuition
    scope: complementary
    locator: mitres_18_001_f17_ch05.pdf (integrals), ch07.pdf (techniques of integration), ch10.pdf (infinite
      series and Taylor) are the selected chapters; ch02-ch04 (derivatives, applications) are reserve intuition;
      matching guide_chNN.pdf files are secondary
- source_id: source-cs229-problem-sets
  role: practice
  why: Stanford CS229 problem sets and practice midterms with solutions.
  priority: 7
  unit_routes:
  - unit_id: unit-m2-sad-l14
    title: CS229 problem sets — the Naive Bayes and generative-model problems
    format: exercise
    depth: practice
    scope: complementary
    locator: The problem set containing the Naive Bayes spam-classification problem, plus the generative-model
      questions on the practice midterms, with their published solutions
    covers:
    - knowledge-sad-l14-nb-recap
    - knowledge-sad-l14-smoothing
    - knowledge-sad-l14-multinomial
    angle: Asks for the maximum-likelihood estimates to be derived, not just applied — the step L14 states as
      a result.
    angle_detail: The classic CS229 problem has you write the likelihood of the training corpus under the naive
      model, differentiate, and obtain the counting formulas the lecture simply hands you. Doing that once explains
      why the parameter estimates are ratios of counts, and it makes the smoothing correction visible as a modification
      of the estimator rather than an arbitrary +1. Solutions published.
- source_id: source-dekking-mips
  role: practice
  why: Broad bank of answer-backed probability and statistics exercises.
  priority: 7
  unit_routes:
  - unit_id: unit-m2-sad-l01
    title: Dekking — descriptive review and answer-backed exercises
    format: exercise
    angle: Descriptive statistics presented after probability, so mean and variance arrive as estimates of distribution
      features rather than as summary formulas.
    covers:
    - knowledge-sad-l01-location
    - knowledge-sad-l01-distributions
    - knowledge-sad-l01-sampling-context
    depth: practice
    scope: complementary
    locator: 'Ch 16 Exploratory data analysis: numerical summaries, pdf pp. 238-250 (centre p. 238; variability
      p. 240; empirical quantiles and IQR p. 241; boxplot p. 243; exercises p. 247); Ch 15 histograms pdf pp.
      216-218; full solutions App D pdf pp. 443-471'
    angle_detail: 'Dekking deliberately places EDA in Ch 15-16, two thirds of the way through the book, and the
      consequence is a different reading of the same formulas L01 shows on slide one: the sample mean is introduced
      as an estimator of E[X], the sample variance as an estimator of Var(X). Coming back to this after L09 is
      one of the most useful re-reads in the module, because it retroactively explains why L01''s descriptive
      tools were worth defining. On a first pass through L01, use it only for the exercises — the framing will
      not land yet.'
  - unit_id: unit-m2-sad-l02
    title: Dekking — descriptive-statistics exercise bank
    format: exercise
    angle: Adds the empirical distribution function, which is the object that makes 'the histogram approximates
      the distribution' precise.
    covers:
    - knowledge-sad-l02-frequencies
    - knowledge-sad-l02-location
    - knowledge-sad-l02-dispersion
    - knowledge-sad-l02-sampling
    depth: practice
    scope: complementary
    locator: Ch 15 §§15.2-15.5 histograms, kernel density, empirical distribution function, scatterplot, pdf pp.
      216-231; Ch 16 §§16.1-16.4, pdf pp. 238-244; exercises pdf pp. 233-237 and pp. 247-250
    angle_detail: L02 draws histograms and moves on. §15.4 introduces the empirical distribution function Fn and
      states that it converges to the true F — the formal content of the intuition that a bigger sample gives
      a better picture. That single idea is what later makes the bootstrap in L09 comprehensible rather than magical,
      so reading it now pays twice. §15.3 on kernel density estimates is outside SaD scope; skim it as context
      for why smoothed histograms exist.
  - unit_id: unit-m2-sad-l03
    title: Dekking — correlation and regression exercises
    format: exercise
    angle: 'Contains the derivation L03 does not do: least squares is exactly maximum likelihood when the errors
      are Normal.'
    covers:
    - knowledge-sad-l03-covariance
    - knowledge-sad-l03-interpretation
    - knowledge-sad-l03-simple-regression
    depth: practice
    scope: complementary
    locator: Ch 10 covariance and correlation, pdf pp. 144-159 (covariance p. 147; correlation coefficient p.
      150; exercises p. 153); Ch 22 the method of least squares, pdf pp. 332-343 (§22.3 relation with maximum
      likelihood p. 338; exercises p. 340); Ch 17 §17.4 the linear regression model, pdf pp. 262-264
    angle_detail: §22.3 is a two-page proof that minimising the sum of squared residuals and maximising the likelihood
      under Normal errors are the same optimisation. L03 presents least squares as a reasonable choice and L08
      presents MLE separately; this is the join between them, and it answers the question the lecture invites
      but never asks — why squares and not absolute deviations. Requires L08's likelihood material to read, so
      this is a return visit, not a first pass. Ch 10 is the probabilistic covariance to set beside L03's descriptive
      one.
  - unit_id: unit-m2-sad-l04
    title: Dekking — probability exercise bank
    format: exercise
    angle: Quick exercises embedded mid-section with solutions at the chapter end — a self-check every few pages
      rather than only at the end.
    covers:
    - knowledge-sad-l04-axioms
    - knowledge-sad-l04-conditional
    - knowledge-sad-l04-bayes
    - knowledge-sad-l04-independence
    depth: practice
    scope: complementary
    locator: Ch 2 outcomes, events, and probability, pdf pp. 24-35; Ch 3 conditional probability and independence,
      pdf pp. 36-51 (§3.3 law of total probability and Bayes' rule p. 41; §3.4 independence p. 43; exercises p.
      48); answers App C pdf pp. 434-442
    angle_detail: 'The structural feature that distinguishes this book: each section plants short ''quick exercises''
      in the flow and answers them at §x.5 before the real exercise set. For probability rules, where the failure
      mode is silent misunderstanding rather than difficulty, that rhythm catches errors within a page instead
      of after a chapter. The treatment itself is compact and modern; Ch 2 is twelve pages for material Fahrmeir
      spends twenty on. Ch 1''s Monty Hall opening (p. 16) is the same framing puzzle L04 uses.'
  - unit_id: unit-m2-sad-l05
    title: Dekking — counting and finite-probability exercises
    format: exercise
    angle: Deliberately thin on counting — read it to see how far you can get with product sample spaces instead
      of combinatorial formulas.
    covers:
    - knowledge-sad-l05-decision-grid
    - knowledge-sad-l05-combinations
    - knowledge-sad-l05-counting-probability
    depth: practice
    scope: complementary
    locator: Ch 4 §4.3 the Bernoulli and binomial distributions, pdf pp. 56-58; Ch 2 §2.4 products of sample spaces,
      pdf pp. 29-30; exercises pdf pp. 62-66
    angle_detail: 'This book barely has a combinatorics section, and knowing that is useful: it builds the binomial
      coefficient where it is needed, out of the product sample space in §2.4, rather than teaching counting as
      a prerequisite subject. If L05''s grid feels like arbitrary memorisation, seeing a serious book do without
      most of it reframes the grid as a shortcut rather than as the content. For actual counting practice go to
      Blitzstein §1.4 or Schaum''s Ch 2 — this route is orientation.'
  - unit_id: unit-m2-sad-l06
    title: Dekking — random-variable exercises
    format: exercise
    angle: States the change-of-variable formula as its own numbered result, which is the rule L06's transformation
      node needs and states only in passing.
    covers:
    - knowledge-sad-l06-distribution-functions
    - knowledge-sad-l06-transformations
    - knowledge-sad-l06-expectation
    - knowledge-sad-l06-variance-covariance
    depth: practice
    scope: complementary
    locator: Ch 4 discrete random variables, pdf pp. 52-66; Ch 5 continuous random variables, pdf pp. 67-80; Ch
      7 expectation and variance, pdf pp. 98-111 (change-of-variable formula p. 103; variance p. 105; exercises
      p. 108); Ch 9 joint distributions, pdf pp. 124-143; Ch 13 §13.2 Chebyshev's inequality, pdf pp. 191-192
    angle_detail: §7.3 gives E[g(X)] = Σ g(x)p(x) the status of a named theorem with a proof sketch, and every
      later expectation computation in the book cites it. L06 uses the same rule when it computes moments of transformed
      variables but never isolates it, so it is easy to treat each computation as a new trick. Ch 13's Chebyshev
      section is three pages and directly serves the concentration node, with the LLN following immediately in
      §13.3 so the connection is visible.
  - unit_id: unit-m2-sad-l07
    title: Dekking — discrete-distribution exercises
    format: exercise
    angle: Derives the Poisson distribution from the arrival process rather than defining it by its PMF.
    covers:
    - knowledge-sad-l07-model-selection
    - knowledge-sad-l07-bernoulli-binomial
    - knowledge-sad-l07-hypergeometric
    - knowledge-sad-l07-poisson
    depth: practice
    scope: complementary
    locator: Ch 4 §4.3 Bernoulli and binomial, pdf pp. 56-58; §4.4 the geometric distribution, pdf pp. 59-61;
      Ch 12 the Poisson process, pdf pp. 176-188 (taking a closer look at random arrivals p. 177; the one-dimensional
      Poisson process p. 180)
    angle_detail: Everywhere else on this shelf the Poisson distribution is defined by its formula and then motivated.
      Ch 12 starts from random points on a line, asks what the count in an interval must look like if arrivals
      are memoryless and non-simultaneous, and the PMF falls out. That is the answer to 'why is this the right
      model for rare events', which L07's model-selection node assumes. Longer than the alternatives and beyond
      exam scope in its later sections — read §12.2 and §12.3 and stop.
  - unit_id: unit-m2-sad-l08
    title: Dekking — Normal and CLT exercises
    format: exercise
    angle: The one route that covers both halves of L08 — the limit theorems and maximum likelihood — in the same
      book and notation.
    covers:
    - knowledge-sad-l08-standardization
    - knowledge-sad-l08-transform-sum
    - knowledge-sad-l08-clt
    - knowledge-sad-l08-approximation
    depth: practice
    scope: complementary
    locator: Ch 5 §5.5 the normal distribution, pdf pp. 74-75; Ch 13 the law of large numbers, pdf pp. 189-202
      (Chebyshev p. 191; LLN p. 193; consequences p. 196; exercises p. 199); Ch 14 the central limit theorem,
      pdf pp. 203-213 (standardizing averages p. 203; applications p. 207; exercises p. 211); Ch 21 maximum likelihood,
      pdf pp. 317-331 (likelihood and loglikelihood p. 320; properties p. 325; exercises p. 327)
    angle_detail: 'L08 is really two lectures: Normal/CLT, and likelihood/MLE. Almost every other source covers
      one or the other. Dekking has consecutive chapters for the first (13 and 14, deliberately separated so the
      LLN and CLT are never conflated) and a dedicated chapter for the second, using one notation throughout.
      Ch 21 also does what the deck skips — works the loglikelihood transformation explicitly and explains why
      maximising the log is legitimate, which is the step where students lose the thread when they meet the Gaussian-error
      derivation.'
  - unit_id: unit-m2-sad-l09
    title: Dekking — estimation exercises
    format: exercise
    angle: The only source here that gives the bootstrap its own chapter with a stated principle, instead of one
      slide of procedure.
    covers:
    - knowledge-sad-l09-properties
    - knowledge-sad-l09-standard-error
    - knowledge-sad-l09-z-interval
    - knowledge-sad-l09-t-interval
    depth: practice
    scope: complementary
    locator: Ch 19 unbiased estimators, pdf pp. 291-303; Ch 20 efficiency and mean squared error, pdf pp. 304-316
      (variance of an estimator p. 307; MSE p. 310; exercises p. 312); Ch 18 the bootstrap, pdf pp. 275-290 (bootstrap
      principle p. 275; empirical bootstrap p. 278; exercises p. 286); Ch 23 confidence intervals for the mean,
      pdf pp. 344-363 (normal data p. 348; bootstrap confidence intervals p. 353); Ch 24 §24.1 the probability
      of success, pdf pp. 364-366
    angle_detail: L09 shows the bootstrap as a resampling recipe. Ch 18 states the bootstrap principle first —
      replace the unknown true distribution by the empirical one, then do exactly what you would have done — and
      only then gives the algorithm, which is what makes it transferable to a situation the recipe does not cover.
      §23.3 then builds a bootstrap confidence interval, closing the loop to the z/t intervals in §23.2 so the
      three interval methods sit side by side. Chapters 19 and 20 separate unbiasedness from efficiency, which
      the lecture presents together.
  - unit_id: unit-m2-sad-l10
    title: Dekking — hypothesis-testing exercises
    format: exercise
    angle: Splits testing across two chapters — essentials, then elaboration — so the vocabulary is not all introduced
      at once.
    covers:
    - knowledge-sad-l10-test-model
    - knowledge-sad-l10-tails-pvalue
    - knowledge-sad-l10-z-t
    - knowledge-sad-l10-chi-square
    depth: practice
    scope: complementary
    locator: 'Ch 25 testing hypotheses: essentials, pdf pp. 375-384 (null hypothesis and test statistic p. 375;
      tail probabilities p. 378; type I and II errors p. 379; exercises p. 382); Ch 26 testing hypotheses: elaboration,
      pdf pp. 385-399 (significance level p. 385; critical region p. 388; type II error p. 392; relation with
      confidence intervals p. 394); Ch 27 the t-test, pdf pp. 400-414'
    angle_detail: L10 introduces null model, statistic, tails, p-value, both error types, power, and duality inside
      one lecture, and the vocabulary load is the real difficulty. Dekking's split means Ch 25 gets you to a decision
      with only three of those ideas, and Ch 26 revisits the same example to add significance level, critical
      region, type II error and the confidence-interval duality one at a time. §26.4 on duality is the clearest
      statement of that equivalence on the shelf, and duality is a recurring exam question. Ch 27 works the t-test
      in a regression setting as well as the one-sample case.
