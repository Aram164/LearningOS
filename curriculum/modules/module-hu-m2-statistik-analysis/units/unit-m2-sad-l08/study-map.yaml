  - kind: practise
    label: Dekking — Normal and CLT exercises
    source_id: source-dekking-mips
    locator: Ch 5 §5.5 the normal distribution, pdf pp. 74-75; Ch 13 the law of large numbers, pdf pp. 189-202
      (Chebyshev p. 191; LLN p. 193; consequences p. 196; exercises p. 199); Ch 14 the central limit theorem,
      pdf pp. 203-213 (standardizing averages p. 203; applications p. 207; exercises p. 211); Ch 21 maximum likelihood,
      pdf pp. 317-331 (likelihood and loglikelihood p. 320; properties p. 325; exercises p. 327)
    scope_triage: helpful-now
    angle: The one route that covers both halves of L08 — the limit theorems and maximum likelihood — in the same
      book and notation.
    angle_detail: 'L08 is really two lectures: Normal/CLT, and likelihood/MLE. Almost every other source covers
      one or the other. Dekking has consecutive chapters for the first (13 and 14, deliberately separated so the
      LLN and CLT are never conflated) and a dedicated chapter for the second, using one notation throughout.
      Ch 21 also does what the deck skips — works the loglikelihood transformation explicitly and explains why
      maximising the log is legitimate, which is the step where students lose the thread when they meet the Gaussian-error
      derivation.'
