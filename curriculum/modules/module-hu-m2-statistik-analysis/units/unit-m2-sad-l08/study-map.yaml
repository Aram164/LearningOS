stages:
- id: stage-sad-l08-normal
  number: 1
  title: The Normal family and its parameters
  status: pending
  objective: Mean locates the bell curve and variance controls spread; symmetry, density, and the 68-95-99.7 rule
    support qualitative checks before calculation.
  done_when:
  - 'Reproduce without notes: Mean locates the bell curve and variance controls spread; symmetry, density, and
    the 68-95-99.7 rule support qualitative checks before calculation.'
  exam_critical: true
  concepts:
  - concept-normal-distribution
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L08 Normal, CLT, and likelihood deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/08_normal_distribution.pdf, 38 slides
    scope_triage: required-now
    angle: 'Two lectures in one deck: Normal calculations and the CLT, then likelihood and the derivation that
      turns maximum likelihood into least squares.'
    angle_detail: The Gaussian-error derivation at the end is the intellectual centre of the statistics half —
      it is where L03's least-squares choice is finally justified — and it arrives after the CLT material when
      attention is lowest. Budget a separate session for the likelihood slides. The LLN-versus-CLT slides are
      the other high-risk part; they are correct but terse. Dekking Ch 13-14 and Ch 21 cover both halves in the
      same notation.
  - kind: reference
    label: 2025 Normal-distribution deck
    source_id: source-sad-2025-recordings
    locator: sad-2025-recordings/08_normal_distribution_no_notes.pdf
    vault_path: material://source-sad-2025-recordings/08_normal_distribution_no_notes.pdf
    scope_triage: reference-only
    angle: Prior-year Normal/CLT deck, without the annotation layer.
    angle_detail: No spoken notes in this file, so its value is limited to the alternative worked examples and
      the different ordering. Lower priority than the annotated 2025 files.
  - kind: read
    label: Fahrmeir Chapters 6–7 — Normal distribution and limit theorems
    source_id: source-fahrmeir-statistik
    locator: Ch 6 §6.3 Spezielle stetige Verteilungsmodelle, pdf pp. 310-322 (Normalverteilung); Ch 7 §7.1 Grenzwertsätze,
      pdf pp. 330-336; §7.2 Approximation von Verteilungen, pdf pp. 337-338; Tabelle A Standardnormalverteilung,
      pdf p. 631
    scope_triage: helpful-now
    angle: The only route here that also hands you the z-table you will actually use, in the layout the Klausur
      uses.
    angle_detail: '§6.3 defines the Normal family and standardisation in German notation; §7.1 separates the Gesetz
      der großen Zahlen from the Zentraler Grenzwertsatz, which is the single most confused pair in this lecture;
      §7.2 states the approximation rules with the Stetigkeitskorrektur that English texts often omit. Then p.
      631 is the Standardnormalverteilung table itself — practising lookups against the table you will be given
      matters more than it sounds, because reading Φ backwards for a quantile is a distinct skill from reading
      it forwards. Contains no likelihood or MLE: for the L08 likelihood half use Dekking Ch 21.'
  - kind: read
    label: Blitzstein Chapters 5 and 10 — continuous variables and CLT
    source_id: source-blitzstein-hwang
    locator: Ch 5 §5.1 probability density functions, pdf pp. 230-236; §5.4 Normal, pdf pp. 248-254; Ch 10 §10.1
      inequalities, pdf pp. 475-483; §10.2 law of large numbers, pdf pp. 484-487; §10.3 central limit theorem,
      pdf pp. 488-493; exercises §10.7 pdf pp. 503-513
    scope_triage: helpful-now
    angle: Puts the LLN and the CLT in one chapter with the inequalities that bound them, so the two limit theorems
      are compared rather than met separately.
    angle_detail: 'The single most common L08 misconception is that the CLT is a stronger version of the LLN.
      Ch 10 makes them adjacent sections making visibly different claims — the LLN about where the sample mean
      goes, the CLT about the shape of its fluctuation around that point — and the proximity does the teaching.
      §10.1 supplies Markov, Chebyshev and Jensen with proofs, which is where L06''s concentration node also points.
      §5.4 derives the standardisation identity rather than asserting it. No likelihood content: for L08''s MLE
      half use Dekking Ch 21.'
  - kind: reference
    label: Pitman — Normal and limit-theorem selections
    source_id: source-pitman-probability
    locator: 'Ch 2 §2.2 Normal Approximation: Method, pdf pp. 103-118; §2.3 Normal Approximation: Derivation (optional),
      pdf pp. 119-126; Ch 4 Continuous Distributions, pdf pp. 269-330'
    scope_triage: reference-only
    angle: Splits the Normal approximation into a 'method' section and an optional 'derivation' section, so the
      mechanics and the proof are cleanly separable.
    angle_detail: '§2.2 gives the recipe with the continuity correction and worked lookups — exactly what the
      exam needs — and §2.3 then derives it, marked optional by the author. That division lets you take only the
      first half now and come back for the second if the CLT''s origin nags. Pitman also introduces the Normal
      before continuous random variables in general, which is unusual and works well here: the shape is motivated
      by the approximation problem instead of appearing as one density among many.'
  - kind: reference
    label: Ross — Normal distribution and limit theorems
    source_id: source-ross-first-course
    locator: Ch 5 Continuous Random Variables, pdf pp. 306-378 (§5.4 normal random variables; §5.7 the distribution
      of a function of a random variable); Ch 8 Limit Theorems, pdf pp. 617-660 (§8.2 Chebyshev's inequality and
      the weak law; §8.3 the central limit theorem)
    scope_triage: reference-only
    angle: Proves the CLT, and states Chebyshev, the weak law and the CLT as a single graded sequence of limit
      theorems.
    angle_detail: 'Ch 8 is the only route here that gives a proof of the central limit theorem, and more usefully
      it arranges the results as an escalation: Chebyshev bounds the deviation crudely, the weak law turns that
      bound into convergence in probability, and the CLT then describes the exact limiting shape. That ordering
      is the answer to ''why do we need the CLT when we already have Chebyshev'', which the lecture does not address.
      Above SaD''s required level — read it if the LLN/CLT distinction is still unstable after Dekking Ch 13-14.'
  - kind: read
    label: OpenIntro Chapter 4 — Normal and sampling distributions
    source_id: source-openintro-statistics
    locator: Ch 4 §4.1 normal distribution, pdf pp. 133-143 (Z-scores, percentiles, 68-95-99.7 rule); Ch 5 §5.1
      point estimates and sampling variability, pdf pp. 170-180 (the sampling distribution of the mean and the
      CLT statement)
    scope_triage: helpful-now
    angle: Builds the CLT out of a simulation the reader can picture — repeated samples, one histogram of their
      means — before any statement of the theorem.
    angle_detail: §5.1 shows the sampling distribution being constructed by repetition, so 'the distribution of
      the sample mean' becomes a concrete object rather than a phrase. That picture is what makes the standard
      error formula in L09 obviously about a distribution of means rather than of data. §4.1 drills z-score conversion
      in both directions with a table, which is the mechanical L08 skill. No likelihood content and no proof of
      the CLT — deliberately, since the course does not need one.
  - kind: read
    label: MIT 18.05 — Normal and CLT notes/exams
    source_id: source-mit-1805
    locator: 'Classes: Reading and In-class Materials: the ''Central Limit Theorem and the Law of Large Numbers''
      reading and the ''Maximum Likelihood Estimates'' reading; the published exam questions and solutions on
      the Exams page'
    scope_triage: helpful-now
    angle: The only route here whose likelihood reading is written specifically to separate likelihood from probability,
      in one page.
    angle_detail: L08's likelihood node turns on one distinction — the same expression read as a function of the
      data versus as a function of the parameter — and 18.05's MLE reading opens with exactly that before any
      optimisation. Combined with the CLT/LLN reading, this covers both halves of L08 with the same notation.
      The Exams page then supplies solved questions of both kinds under timed conditions, which is the closest
      thing on the shelf to an English-language SaD mock.
  - kind: reference
    label: Harvard Stat 110 Units 5–6 — Normal and CLT
    source_id: source-stat110
    locator: Lectures 14-16 (continuous distributions and the Normal) and Lectures 19-20 (law of large numbers,
      central limit theorem)
    scope_triage: reference-only
    angle: Derives the Normal's normalising constant and standardisation rather than asserting them.
    angle_detail: The Gaussian integral trick and the change of variables that turns any Normal into a standard
      Normal are both done on the board. Neither is examinable in SaD, but the second one is the reason the z-table
      works for every Normal, and knowing that removes the temptation to memorise separate procedures. The LLN/CLT
      lectures compare the two theorems explicitly, in the same framing the book uses in Ch 10.
  - kind: watch
    label: Kurzes Tutorium Statistik — Normalverteilung and ZGS
    source_id: source-kurzes-tutorium-statistik
    locator: '''Normalverteilung''; ''Standardnormalverteilung''; ''Zentraler Grenzwertsatz'''
    scope_triage: helpful-now
    angle: Reads the German z-table layout, which is arranged differently from the tables in the English texts.
    angle_detail: The Standardnormalverteilung table you will be given is the German layout, and practising lookups
      against an American table is a small but real mismatch. These videos use the German one and read it in both
      directions. Fahrmeir p. 631 is the same table in print.
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l08/stages/stage-sad-l08-normal/notes.md
  attachments: []
  source_feedback: []
