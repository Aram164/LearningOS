    source_id: source-sad-2025-recordings
    locator: sad-2025-recordings/08_normal_distribution_no_notes.pdf
    vault_path: material://source-sad-2025-recordings/08_normal_distribution_no_notes.pdf
    scope_triage: reference-only
    angle: Prior-year Normal/CLT deck, without the annotation layer.
    angle_detail: No spoken notes in this file, so its value is limited to the alternative worked examples and
