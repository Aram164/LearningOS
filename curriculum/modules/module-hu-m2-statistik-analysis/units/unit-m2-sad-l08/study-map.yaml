  - kind: watch
    label: jbstatistics — Normal, z-scores, and CLT
    source_id: source-jbstatistics
    locator: '''The Normal Distribution'', ''Standardizing Normally Distributed Random Variables'', ''Introduction
      to the Central Limit Theorem'''
    scope_triage: helpful-now
    angle: Drills the standard-normal table in both directions, including finding a value from a given probability.
    angle_detail: Reading the table backwards — given a tail probability, find z — is a distinct skill and the
      one L09's confidence intervals will immediately depend on. The videos work several of each direction, which
      is more repetition than any text here provides in that specific operation.
