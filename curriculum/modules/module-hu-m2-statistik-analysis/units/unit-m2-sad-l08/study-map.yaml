    label: Schaum — Normal and CLT drills
    source_id: source-schaums-probability
    locator: Ch 6 Binomial, Normal and Poisson Distributions, pdf pp. 107-127 (the Normal approximation problems)
    scope_triage: helpful-now
    angle: Normal-table drill with the approximation conditions and the continuity correction applied problem
      by problem.
    angle_detail: The mechanical half of L08 — convert to z, read the table, apply the ±0.5 correction, check
      that np and n(1−p) are large enough — is trained here at volume and nowhere else on the shelf as cheaply.
      No CLT theory and no likelihood; this route is calculation practice only, and should be paired with Dekking
      Ch 13-14 for the reasoning.
  - kind: read
    label: OpenIntro Chapter 4 — Normal and sampling distributions
    source_id: source-openintro-statistics
    locator: Ch 4 §4.1 normal distribution, pdf pp. 133-143 (Z-scores, percentiles, 68-95-99.7 rule); Ch 5 §5.1
      point estimates and sampling variability, pdf pp. 170-180 (the sampling distribution of the mean and the
