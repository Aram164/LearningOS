    scope_triage: reference-only
    angle: 'The formal estimation-theory framing of likelihood: identifiability, the Fisher information, asymptotic
      normality of the MLE.'
    angle_detail: 'This is a mathematical-statistics course and sits well above SaD. It is routed here for one
      situation only: the L08 slides derive the MLE for a specific model and you want to know what the general
      theory guarantees — that the estimator is consistent and asymptotically Normal, and under what conditions.
      Reading it will not help with the exam, and it will cost hours. Reference-only by design.'
