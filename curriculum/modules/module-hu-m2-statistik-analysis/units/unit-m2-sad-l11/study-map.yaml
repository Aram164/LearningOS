  number: 4
  title: Train, validation, test, cross-validation, and bootstrap
  status: pending
  objective: Separate data roles prevent evaluation leakage; repeated splits, cross-validation, and bootstrap
    estimate different aspects of out-of-sample uncertainty.
  done_when:
  - 'Reproduce without notes: Separate data roles prevent evaluation leakage; repeated splits, cross-validation,
