- id: stage-sad-l11-generalization
  number: 7
  title: Underfitting, overfitting, and bias-variance
  status: pending
  objective: Model complexity trades approximation bias against sensitivity to samples; data volume, regularization,
    validation, and compute shape the attainable generalization performance.
  done_when:
  - 'Reproduce without notes: Model complexity trades approximation bias against sensitivity to samples; data
    volume, regularization, validation, and compute shape the attainable generalization performance.'
  - Work Geron Ch 1 exercises - the L11 vocabulary tested back, and record every miss with the step it failed
    at.
  exam_critical: true
  concepts:
  - concept-bias-variance-tradeoff
  - concept-variance
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L11 data-science introduction deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/11_datascience_intro.pdf, 49 slides
    scope_triage: required-now
    angle: Defines the pipeline vocabulary — task, resampling, objective, metric, generalization — that L12 to
      L15 all assume.
    angle_detail: 'This deck is the hinge of the module: everything before it is statistics, everything after
      is learning algorithms, and it supplies the shared frame. Its concepts are individually simple and collectively
      easy to hold vaguely, which is why the exercise-level routes on this stage (Géron Ch 2-3, ESL §7.10) matter
      more here than usual. Note that the deck''s evaluation metrics extend L01''s confusion matrix rather than
      re-deriving it.'
  - kind: read
    label: ISLP Chapter 2 — statistical-learning workflow
    source_id: source-islp
    locator: Ch 2 Statistical Learning, pdf pp. 25-77 (§2.1 what is statistical learning p. 26; §2.2 assessing
      model accuracy, with the bias-variance decomposition, p. 37; §2.3 lab p. 48)
    scope_triage: helpful-now
    angle: Derives the bias-variance decomposition algebraically, which L11 states as a picture of two curves
      crossing.
    angle_detail: §2.2 shows the expected test error splitting into three named terms — squared bias, variance
      and irreducible error — and the derivation is short enough to follow at first reading. That is the content
      behind L11's U-shaped test-error curve, and having the algebra makes the trade-off a consequence rather
      than an empirical observation. The chapter also draws the distinction between prediction and inference as
      two different reasons to fit a model, which reframes what the pipeline is for.
  - kind: read
    label: Kroese — data-science workflow and evaluation
    source_id: source-kroese-dsml
    locator: Ch 2 Statistical Learning, pdf pp. 37-84 (risk, loss and the training/test split); Ch 1 Importing,
      Summarizing and Visualizing Data, pdf pp. 19-36
    scope_triage: helpful-now
    angle: States the whole supervised problem as risk minimisation first, so loss functions and generalization
      are one framework rather than two topics.
    angle_detail: Kroese defines the learner's goal as minimising expected loss over an unknown distribution,
      then derives training error, test error and the need for a held-out set as consequences of not knowing that
      distribution. L11 introduces objectives and resampling as separate pipeline stages; this route shows they
      answer the same question. More mathematical than the other L11 options — expect measure-free but real probability
      notation.
  - kind: read
    label: Domingos — A Few Useful Things to Know About Machine Learning
    source_id: source-domingos-useful-things
    locator: Complete article, 9 pages (CACM 55(10), 2012)
    scope_triage: helpful-now
    angle: Nine pages of practitioner judgment — that generalization is the goal, that data beats cleverness,
      that overfitting has many faces.
    angle_detail: 'This is the single best-value item on the L11 stage: it takes half an hour and it supplies
      the ''why does this matter'' layer for almost every node in the lecture. Its central points — learning is
      induction and therefore needs assumptions, more data usually beats a better algorithm, feature engineering
      is where the work is — are exactly what L11''s pipeline slides assert without argument. Also the best available
      preparation for a conceptual exam question, because it is written as argument rather than as definition.'
  - kind: read
    label: Geron Ch 1 - the ML vocabulary with failure cases attached
    source_id: source-geron-handson
    locator: Chapter 1, pp. 29-61 (supervised/unsupervised pp. 34-41; overfitting p. 54; underfitting p. 56; testing
      and validating pp. 57-59; exercises p. 60)
    scope_triage: helpful-now
    angle: L11 states supervised/unsupervised, over- and underfitting and the train/test split in single bullets;
      Geron spends thirty pages on that same vocabulary with concrete data-quality and sampling failures, so each
      term Leser asserts arrives with a worked counterexample.
    angle_detail: The vocabulary chapter, with the failure cases attached to the definitions rather than deferred.
      Overfitting (p. 54) and underfitting (p. 56) arrive with the diagnosis and the standard remedies, and testing/validating
      (pp. 57-59) explains why the split exists before L11's resampling node formalises it. Written for practitioners,
      so every term is introduced with the situation that made it necessary. The chapter exercises on pp. 60-61
      are a fast check of whether the vocabulary has actually landed.
  - kind: practise
    label: Geron Ch 1 exercises - the L11 vocabulary tested back
    source_id: source-geron-handson
    locator: Chapter 1 exercises, pp. 60-61
    scope_triage: helpful-now
    angle: 'Nineteen short questions on labelled data, supervised versus unsupervised tasks, overfitting, the
      validation set and why tuning on the test set breaks - the retrieval check for the framing half of L11,
      which otherwise has no practice asset at all. Note: this copy is an early-release ebook and its solutions
      cross-reference on p. 61 is unresolved, so answers must be checked against the chapter body.'
    angle_detail: Two pages of exercises testing exactly the L11 vocabulary, phrased as questions rather than
      definitions. Because L11 has almost no computation, self-testing is otherwise hard to arrange, and these
      are the closest available proxy for the short conceptual questions the exam will use. Answers are in the
      book's appendix.
  - kind: reference
    label: ESL Ch 7 - what cross-validation and the bootstrap actually estimate
    source_id: source-esl
    locator: Sections 7.2-7.3, pp. 238-247; section 7.10 cross-validation, p. 260; section 7.11 bootstrap methods,
      p. 268
    scope_triage: reference-only
    angle: L11 presents cross-validation and bootstrapping as confidence-raising procedures; this chapter separates
      the bias-variance decomposition from the estimator of test error, which is the distinction the deck's 'which
      k?' slide leaves open. Open only when a recorded error needs it.
    angle_detail: The reference statement of what resampling actually estimates. §§7.2-7.3 (pp. 238-247) distinguish
      test error from expected test error and derive the optimism of the training error, which is the precise
      version of L11's claim that training error is not a fair estimate. §7.10 (p. 260) then explains what cross-validation
      estimates and why the number of folds is a bias-variance trade-off in its own right. Graduate level; read
      the specific sections rather than the chapter.
