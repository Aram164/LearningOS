- id: stage-sad-l11-pipeline
  number: 1
  title: The data-science pipeline
  status: pending
  objective: Data acquisition, cleaning, integration, exploration, feature construction, modeling, validation,
    communication, and action are coupled steps; modeling is only one part of the work.
  done_when:
  - 'Reproduce without notes: Data acquisition, cleaning, integration, exploration, feature construction,
    modeling, validation, communication, and action are coupled steps; modeling is only one part of the
    work.'
