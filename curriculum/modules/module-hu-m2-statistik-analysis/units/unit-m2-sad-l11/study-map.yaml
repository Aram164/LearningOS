    scope_triage: helpful-now
  - kind: read
    label: Ng — bias, variance and the evaluation workflow lectures
    source_id: source-ng-coursera
    locator: 'Week 6: the ''Advice for applying machine learning'' lectures (train/validation/test split,
      learning curves, diagnosing bias vs variance)'
    angle: Turns bias and variance into a diagnostic procedure — read the learning curves, then decide
      what to change.
    angle_detail: 'L11 defines underfitting, overfitting and the bias-variance trade-off. Ng''s week 6
      makes them actionable: if training and validation error are both high you have bias and more data
      will not help; if they diverge you have variance and more data will. That if-then structure is the
      most retainable form of this material and is exactly what a conceptual exam question about the trade-off
      is testing.'
    scope_triage: helpful-now
  - kind: read
    label: ISLP community solutions — Ch 2 and Ch 5 exercises
    source_id: source-islp-community-solutions
    locator: The Ch 2 (statistical learning) and Ch 5 (resampling methods) solution notebooks in the botlnec
      / a-martyn / applied-on-ISLP repositories
    angle: Makes the ISLP exercises checkable, which is the difference between reading the chapter and
      knowing it.
    angle_detail: 'ISLP publishes no official solutions, so its exercises are unusable for self-testing
      on their own. These community repositories work them in full, usually with the code and the reasoning.
      Treat them as an answer key rather than as authority: they are unreviewed, and on a disagreement
      the book wins. The Ch 5 notebooks are the most useful here — cross-validation and bootstrap worked
      end to end.'
    scope_triage: helpful-now
