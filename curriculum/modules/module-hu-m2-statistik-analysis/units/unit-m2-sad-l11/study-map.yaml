  - kind: read
    label: Kroese — data-science workflow and evaluation
    source_id: source-kroese-dsml
    locator: Workflow selections and §7.2 — Independent, broader reference for pipelines, model evaluation,
      and data-science practice; §7.2 is the compact metric layer.
    scope_triage: helpful-now
  - kind: read
    label: Geron Ch 2 - the pipeline executed end to end
    source_id: source-geron-handson
    locator: 'Chapter 2, pp. 63-111 (create a test set p. 80; feature scaling p. 98; transformation pipelines
      p. 99; better evaluation using cross-validation p. 102) — Turns the L11 pipeline slide into an executed
      sequence: building the test set before looking at the data, scaling features, composing transformation
      pipelines, and scoring with cross-validation - the leakage-avoidance ordering the deck asserts but
      never demonstrates.'
    scope_triage: helpful-now
