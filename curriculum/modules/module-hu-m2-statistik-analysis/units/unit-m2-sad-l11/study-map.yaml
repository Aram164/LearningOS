stages:
- id: stage-sad-l11-pipeline
  number: 1
  title: The data-science pipeline
  status: pending
  objective: Data acquisition, cleaning, integration, exploration, feature construction, modeling, validation,
    communication, and action are coupled steps; modeling is only one part of the work.
  done_when:
  - 'Reproduce without notes: Data acquisition, cleaning, integration, exploration, feature construction,
    modeling, validation, communication, and action are coupled steps; modeling is only one part of the
    work.'
  exam_critical: true
  concepts:
  - concept-ml-lifecycle
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L11 data-science introduction deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/11_datascience_intro.pdf, 49 slides
    angle: Defines the pipeline vocabulary — task, resampling, objective, metric, generalization — that
      L12 to L15 all assume.
    angle_detail: 'This deck is the hinge of the module: everything before it is statistics, everything
      after is learning algorithms, and it supplies the shared frame. Its concepts are individually simple
      and collectively easy to hold vaguely, which is why the exercise-level routes on this stage (Géron
      Ch 2-3, ESL §7.10) matter more here than usual. Note that the deck''s evaluation metrics extend
      L01''s confusion matrix rather than re-deriving it.'
    vault_path: material://source-sad-ss26-lectures/lecture-slides/11_datascience_intro.pdf
    scope_triage: required-now
  - kind: read
    label: Kelleher — predictive-analytics workflow framing
    source_id: source-kelleher-fmlpda
    locator: Ch 1 Machine Learning for Predictive Data Analytics, pdf pp. 36-56; Ch 2 Data to Insights
      to Decisions, pdf pp. 57-91; Ch 8 Evaluation, pdf pp. 425-490
    angle: Frames the whole pipeline as a business problem being converted into an analytics problem —
      the step before L11's pipeline starts.
    angle_detail: 'Ch 2 is about deciding what to predict at all: converting a stated goal into a target
      feature, choosing the analytics base table, and confronting the fact that the available data may
      not support the question. L11 begins one step later, with the data already framed. That earlier
      step is where most real projects fail and it is the part of the pipeline the lecture treats as given.
      Ch 8 then covers evaluation designs — hold-out, cross-validation, the choice of metric per task
      — at more length than the deck.'
    vault_path: material://source-kelleher-fmlpda/kelleher.pdf
    scope_triage: helpful-now
  - kind: read
    label: Kroese — data-science workflow and evaluation
    source_id: source-kroese-dsml
    locator: Ch 2 Statistical Learning, pdf pp. 37-84 (risk, loss and the training/test split); Ch 1 Importing,
      Summarizing and Visualizing Data, pdf pp. 19-36
    angle: States the whole supervised problem as risk minimisation first, so loss functions and generalization
      are one framework rather than two topics.
    angle_detail: Kroese defines the learner's goal as minimising expected loss over an unknown distribution,
      then derives training error, test error and the need for a held-out set as consequences of not knowing
      that distribution. L11 introduces objectives and resampling as separate pipeline stages; this route
      shows they answer the same question. More mathematical than the other L11 options — expect measure-free
      but real probability notation.
    vault_path: material://source-kroese-dsml/kroese.pdf
    scope_triage: helpful-now
  - kind: read
    label: Geron Ch 2 - the pipeline executed end to end
    source_id: source-geron-handson
    locator: Chapter 2, pp. 63-111 (create a test set p. 80; feature scaling p. 98; transformation pipelines
      p. 99; better evaluation using cross-validation p. 102)
    angle: 'Turns the L11 pipeline slide into an executed sequence: building the test set before looking
      at the data, scaling features, composing transformation pipelines, and scoring with cross-validation
      - the leakage-avoidance ordering the deck asserts but never demonstrates.'
    angle_detail: 'The whole L11 pipeline executed once, end to end, on real housing data — the only route
      on this stage where the stages are performed rather than described. The specific pages matter: creating
      a test set (p. 80) shows the leakage trap L11 warns about, transformation pipelines (p. 99) shows
      why preprocessing must be fitted on training data only, and cross-validation (p. 102) shows the
      resampling node in code. Doing this chapter once makes the deck''s pipeline diagram concrete in
      a way no amount of re-reading will.'
    vault_path: material://source-geron-handson/geron.pdf
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l11/stages/stage-sad-l11-pipeline/notes.md
  attachments: []
  source_feedback: []
