    vault_path: material://source-islp/islp.pdf
    scope_triage: helpful-now
  - kind: read
    label: Berkeley CS189 — past exam questions on evaluation and generalization
    source_id: source-berkeley-cs189
    locator: The published midterm and final papers with solutions — the bias-variance, cross-validation
      and evaluation-metric questions
    angle: Written exam questions on conceptual ML material, which is otherwise almost impossible to practise.
    angle_detail: 'L11 will be examined in writing, and the shelf is full of coding exercises and textbook
      problems but nearly empty of written conceptual questions with model answers. These papers fill
      that gap: short-answer and multiple-choice items about when cross-validation is appropriate, what
      a learning curve implies, why a metric is inappropriate for imbalanced data. Filter by topic — the
      course covers much that SaD does not.'
    scope_triage: helpful-now
  - kind: read
    label: Caltech LFD — the bias-variance decomposition and generalization lectures
    source_id: source-caltech-lfd
    locator: Lecture 8 'Bias-Variance Tradeoff' and Lecture 11 'Overfitting', with the corresponding homework
      sets and solutions
    angle: Asks whether learning is possible at all before asking how to do it, which is the question
      L11's inductive-bias node gestures at.
    angle_detail: The course's organising question is whether fitting the training data tells you anything
      about unseen data, and its answer is that it does only under conditions that can be stated precisely.
      L11 asserts that inductive bias is necessary; this is where that assertion gets an argument. Lecture
      8 derives the bias-variance decomposition on the board with the averaging-over-datasets picture,
      which is more illuminating than the algebra alone. Homework with solutions; genuinely above SaD
      level.
    scope_triage: helpful-now
  - kind: reference
    label: scikit-learn user guide §3.1 — cross-validation
    source_id: source-sklearn-user-guide
    locator: 'User guide §3.1 ''Cross-validation: evaluating estimator performance'' and §3.4 ''Metrics
      and scoring'', with the linked examples'
    angle: Enumerates the resampling schemes as named, runnable splitters — KFold, StratifiedKFold, GroupKFold
      — with the situation each exists for.
    angle_detail: 'L11 names cross-validation as one idea. The user guide shows it is a family, and each
      member exists because of a specific failure: stratified splits for class imbalance, group splits
      when observations are not independent, time-series splits when order matters. Knowing that the plain
      version has failure modes is the conceptual content; the diagrams in §3.1 make the differences immediate.'
    scope_triage: helpful-now
  - kind: read
    label: Google ML Crash Course — framing, generalization and validation modules
    source_id: source-google-ml-crash-course
    locator: The 'Framing', 'Generalization', 'Training and Test Sets', 'Validation Set' and 'Classification'
      modules, each ≈15 min with in-page exercises
    angle: Each concept arrives with an immediate in-page check question, so the vocabulary is tested
      as it is introduced.
    angle_detail: L11 is a vocabulary lecture, and vocabulary decays unless it is used. The crash course's
      format — a short explanation followed at once by a question you must answer to continue — is well
      suited to that, and the whole relevant sequence takes about ninety minutes. The validation-set module
