    scope_triage: helpful-now
  - kind: read
    label: ISLP Chapter 2 — statistical-learning workflow
    source_id: source-islp
    locator: Ch 2 Statistical Learning, pdf pp. 25-77 (§2.1 what is statistical learning p. 26; §2.2 assessing
      model accuracy, with the bias-variance decomposition, p. 37; §2.3 lab p. 48)
    angle: Derives the bias-variance decomposition algebraically, which L11 states as a picture of two
      curves crossing.
    angle_detail: §2.2 shows the expected test error splitting into three named terms — squared bias,
      variance and irreducible error — and the derivation is short enough to follow at first reading.
      That is the content behind L11's U-shaped test-error curve, and having the algebra makes the trade-off
      a consequence rather than an empirical observation. The chapter also draws the distinction between
      prediction and inference as two different reasons to fit a model, which reframes what the pipeline
      is for.
    vault_path: material://source-islp/islp.pdf
    scope_triage: helpful-now
  - kind: read
    label: Google ML Crash Course — framing, generalization and validation modules
    source_id: source-google-ml-crash-course
    locator: The 'Framing', 'Generalization', 'Training and Test Sets', 'Validation Set' and 'Classification'
      modules, each ≈15 min with in-page exercises
    angle: Each concept arrives with an immediate in-page check question, so the vocabulary is tested
      as it is introduced.
    angle_detail: L11 is a vocabulary lecture, and vocabulary decays unless it is used. The crash course's
      format — a short explanation followed at once by a question you must answer to continue — is well
      suited to that, and the whole relevant sequence takes about ninety minutes. The validation-set module
      in particular explains why a third split is needed once you start tuning, which the deck states
      without motivating. Shallow by design; it is orientation, not depth.
    scope_triage: helpful-now
  - kind: read
    label: Geron Ch 1 - the ML vocabulary with failure cases attached
    source_id: source-geron-handson
    locator: Chapter 1, pp. 29-61 (supervised/unsupervised pp. 34-41; overfitting p. 54; underfitting
      p. 56; testing and validating pp. 57-59; exercises p. 60)
    angle: L11 states supervised/unsupervised, over- and underfitting and the train/test split in single
      bullets; Geron spends thirty pages on that same vocabulary with concrete data-quality and sampling
      failures, so each term Leser asserts arrives with a worked counterexample.
    angle_detail: The vocabulary chapter, with the failure cases attached to the definitions rather than
      deferred. Overfitting (p. 54) and underfitting (p. 56) arrive with the diagnosis and the standard
      remedies, and testing/validating (pp. 57-59) explains why the split exists before L11's resampling
      node formalises it. Written for practitioners, so every term is introduced with the situation that
      made it necessary. The chapter exercises on pp. 60-61 are a fast check of whether the vocabulary
      has actually landed.
    vault_path: material://source-geron-handson/geron.pdf
    scope_triage: helpful-now
  - kind: practise
    label: Geron Ch 1 exercises - the L11 vocabulary tested back
    source_id: source-geron-handson
    locator: Chapter 1 exercises, pp. 60-61
    angle: 'Nineteen short questions on labelled data, supervised versus unsupervised tasks, overfitting,
      the validation set and why tuning on the test set breaks - the retrieval check for the framing half
      of L11, which otherwise has no practice asset at all. Note: this copy is an early-release ebook
      and its solutions cross-reference on p. 61 is unresolved, so answers must be checked against the
      chapter body.'
    angle_detail: Two pages of exercises testing exactly the L11 vocabulary, phrased as questions rather
      than definitions. Because L11 has almost no computation, self-testing is otherwise hard to arrange,
      and these are the closest available proxy for the short conceptual questions the exam will use.
      Answers are in the book's appendix.
    vault_path: material://source-geron-handson/geron.pdf
    scope_triage: helpful-now
