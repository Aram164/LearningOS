  - kind: read
    label: Zacharski Ch 5 - evaluating a classifier by hand
    source_id: source-zacharski-data-mining
    locator: Chapter 5, pp. 184-225 (10-fold cross-validation p. 187; confusion matrix p. 193; Kappa p. 203)
    scope_triage: helpful-now
    angle: Walks 10-fold cross-validation, the confusion matrix and the Kappa statistic on a small worked data
      set, which is the arithmetic L11 asserts on its cross-validation and evaluation slides without ever running
      it.
    angle_detail: 'Evaluation carried out with a pen: 10-fold cross-validation (p. 187) explained as a procedure
      you could run manually, the confusion matrix (p. 193) built by hand, and Kappa (p. 203) — a metric L11 does
      not cover but which answers the ''is this better than guessing the majority class'' question that class
      imbalance raises. Zacharski writes at the lowest technical level of any book on this stage, which makes
      it the fastest route when the concept rather than the mathematics is the obstacle.'
  - kind: reference
    label: ESL Ch 7 - what cross-validation and the bootstrap actually estimate
    source_id: source-esl
    locator: Sections 7.2-7.3, pp. 238-247; section 7.10 cross-validation, p. 260; section 7.11 bootstrap methods,
      p. 268
    scope_triage: reference-only
    angle: L11 presents cross-validation and bootstrapping as confidence-raising procedures; this chapter separates
      the bias-variance decomposition from the estimator of test error, which is the distinction the deck's 'which
      k?' slide leaves open. Open only when a recorded error needs it.
    angle_detail: The reference statement of what resampling actually estimates. §§7.2-7.3 (pp. 238-247) distinguish
      test error from expected test error and derive the optimism of the training error, which is the precise
      version of L11's claim that training error is not a fair estimate. §7.10 (p. 260) then explains what cross-validation
      estimates and why the number of folds is a bias-variance trade-off in its own right. Graduate level; read
      the specific sections rather than the chapter.
