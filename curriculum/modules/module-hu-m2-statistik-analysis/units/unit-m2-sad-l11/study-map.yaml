  resources:
  - kind: read
    label: Current L11 data-science introduction deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/11_datascience_intro.pdf (49 pages) — Places learning algorithms inside a
      data pipeline and defines the task, resampling, objective, evaluation, generalization, and compute
      concepts used by L12-L15.
    scope_triage: required-now
  - kind: read
    label: Kelleher — predictive-analytics workflow framing
    source_id: source-kelleher-fmlpda
    locator: Introductory and workflow chapters — Course-named introductory text for how data, features,
      models, evaluation, and deployment fit together across the four learning families used in L12–L15.
