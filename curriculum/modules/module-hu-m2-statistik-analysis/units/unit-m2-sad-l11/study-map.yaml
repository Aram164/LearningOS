    source_id: source-sad-uebungen
    locator: exercise-slides/blatt-05.pdf Aufgabe 3; exercise-slides/UE7.pdf slides 22-30
    scope_triage: required-now
    angle: Shows how the pipeline vocabulary is examined — usually as short conceptual questions, not computations.
    angle_detail: L11 has almost no arithmetic, which makes the form of its exam questions genuinely uncertain
      from the deck alone. These exercises settle it and are therefore worth reading even if you do not work them.
  - kind: read
    label: Kelleher — predictive-analytics workflow framing
    source_id: source-kelleher-fmlpda
    locator: Ch 1 Machine Learning for Predictive Data Analytics, pdf pp. 36-56; Ch 2 Data to Insights to Decisions,
      pdf pp. 57-91; Ch 8 Evaluation, pdf pp. 425-490
    scope_triage: helpful-now
    angle: Frames the whole pipeline as a business problem being converted into an analytics problem — the step
      before L11's pipeline starts.
    angle_detail: 'Ch 2 is about deciding what to predict at all: converting a stated goal into a target feature,
      choosing the analytics base table, and confronting the fact that the available data may not support the
      question. L11 begins one step later, with the data already framed. That earlier step is where most real
      projects fail and it is the part of the pipeline the lecture treats as given. Ch 8 then covers evaluation
      designs — hold-out, cross-validation, the choice of metric per task — at more length than the deck.'
  - kind: read
    label: Kroese — data-science workflow and evaluation
    source_id: source-kroese-dsml
    locator: Ch 2 Statistical Learning, pdf pp. 37-84 (risk, loss and the training/test split); Ch 1 Importing,
      Summarizing and Visualizing Data, pdf pp. 19-36
    scope_triage: helpful-now
    angle: States the whole supervised problem as risk minimisation first, so loss functions and generalization
      are one framework rather than two topics.
    angle_detail: Kroese defines the learner's goal as minimising expected loss over an unknown distribution,
      then derives training error, test error and the need for a held-out set as consequences of not knowing that
      distribution. L11 introduces objectives and resampling as separate pipeline stages; this route shows they
      answer the same question. More mathematical than the other L11 options — expect measure-free but real probability
      notation.
  - kind: read
    label: Geron Ch 3 - the evaluation metrics of L11 as drills
    source_id: source-geron-handson
    locator: Chapter 3, pp. 113-137 (ROC p. 117; confusion matrix p. 118; precision/recall trade-off p. 121; AUC
      p. 126; multiclass p. 128; multilabel p. 134)
    scope_triage: helpful-now
    angle: The deck's ROC/AUC pair (slides 38-39) had no practice source in the module at all; this chapter builds
      the confusion matrix, the precision/recall trade-off, the ROC curve and AUC, then extends to multiclass
      and multilabel, each with exercises.
    angle_detail: 'The evaluation chapter as a drill: confusion matrix (p. 118), precision/recall trade-off (p.
      121), ROC and AUC (pp. 117, 126), and then the multiclass and multilabel extensions (pp. 128, 134) that
      L11 names but does not work through. The precision-recall trade-off curve is the part worth the most attention
      — it makes the threshold an explicit decision rather than a hidden default, which is the conceptual content
      behind class-imbalance questions.'
  - kind: read
    label: Zacharski Ch 5 - evaluating a classifier by hand
    source_id: source-zacharski-data-mining
    locator: Chapter 5, pp. 184-225 (10-fold cross-validation p. 187; confusion matrix p. 193; Kappa p. 203)
    scope_triage: helpful-now
    angle: Walks 10-fold cross-validation, the confusion matrix and the Kappa statistic on a small worked data
      set, which is the arithmetic L11 asserts on its cross-validation and evaluation slides without ever running
      it.
    angle_detail: 'Evaluation carried out with a pen: 10-fold cross-validation (p. 187) explained as a procedure
      you could run manually, the confusion matrix (p. 193) built by hand, and Kappa (p. 203) — a metric L11 does
      not cover but which answers the ''is this better than guessing the majority class'' question that class
      imbalance raises. Zacharski writes at the lowest technical level of any book on this stage, which makes
      it the fastest route when the concept rather than the mathematics is the obstacle.'
