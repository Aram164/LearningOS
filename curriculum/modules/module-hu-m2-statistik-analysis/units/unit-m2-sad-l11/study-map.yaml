    angle_detail: Two pages of exercises testing exactly the L11 vocabulary, phrased as questions rather
      than definitions. Because L11 has almost no computation, self-testing is otherwise hard to arrange,
      and these are the closest available proxy for the short conceptual questions the exam will use.
      Answers are in the book's appendix.
    vault_path: material://source-geron-handson/geron.pdf
    scope_triage: helpful-now
  - kind: read
    label: Domingos — A Few Useful Things to Know About Machine Learning
    source_id: source-domingos-useful-things
    locator: Complete article, 9 pages (CACM 55(10), 2012)
    angle: Nine pages of practitioner judgment — that generalization is the goal, that data beats cleverness,
      that overfitting has many faces.
    angle_detail: 'This is the single best-value item on the L11 stage: it takes half an hour and it supplies
      the ''why does this matter'' layer for almost every node in the lecture. Its central points — learning
      is induction and therefore needs assumptions, more data usually beats a better algorithm, feature
      engineering is where the work is — are exactly what L11''s pipeline slides assert without argument.
      Also the best available preparation for a conceptual exam question, because it is written as argument
      rather than as definition.'
    scope_triage: helpful-now
  - kind: reference
    label: ESL Ch 7 - what cross-validation and the bootstrap actually estimate
    source_id: source-esl
    locator: Sections 7.2-7.3, pp. 238-247; section 7.10 cross-validation, p. 260; section 7.11 bootstrap
      methods, p. 268
    angle: L11 presents cross-validation and bootstrapping as confidence-raising procedures; this chapter
      separates the bias-variance decomposition from the estimator of test error, which is the distinction
      the deck's 'which k?' slide leaves open. Open only when a recorded error needs it.
    angle_detail: The reference statement of what resampling actually estimates. §§7.2-7.3 (pp. 238-247)
      distinguish test error from expected test error and derive the optimism of the training error, which
      is the precise version of L11's claim that training error is not a fair estimate. §7.10 (p. 260)
      then explains what cross-validation estimates and why the number of folds is a bias-variance trade-off
      in its own right. Graduate level; read the specific sections rather than the chapter.
    vault_path: material://source-esl/esl.pdf
    scope_triage: reference-only
