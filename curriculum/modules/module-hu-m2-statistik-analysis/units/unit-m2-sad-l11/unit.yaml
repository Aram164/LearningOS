id: unit-m2-sad-l11
type: unit
module_id: module-hu-m2-statistik-analysis
component_id: component-m2-sad
kind: lecture
title: SaD Lecture 11 — Data Science & Machine Learning Workflow
order: 11
scope: Current 2026 L11 deck; data-science framing and pipelines, structured/unstructured data, supervised
  and unsupervised learning, classification and regression, feature construction, train/validation/test
  splits, cross-validation and bootstrap, losses and inductive bias, evaluation metrics, overfitting,
  bias-variance tradeoffs, and data/compute considerations.
status: ready
knowledge_map:
  summary: The lecture situates models inside an end-to-end data-science process and defines the evaluation
    discipline needed to distinguish a useful system from a model that merely fits available data.
  nodes:
  - id: knowledge-sad-l11-pipeline
    title: The data-science pipeline
    summary: Data acquisition, cleaning, integration, exploration, feature construction, modeling, validation,
      communication, and action are coupled steps; modeling is only one part of the work.
  - id: knowledge-sad-l11-tasks
    title: Supervised and unsupervised tasks
    summary: Classification predicts categories, regression predicts quantities, and unsupervised methods
      seek structure without labels; the learning setup must match the target and available supervision.
    builds_on:
    - knowledge-sad-l11-pipeline
  - id: knowledge-sad-l11-representation
    title: Data types, features, and representation
    summary: Structured, text, image, graph, and temporal data require different preprocessing and representations;
      domain knowledge determines which transformations preserve useful information.
    builds_on:
    - knowledge-sad-l11-pipeline
  - id: knowledge-sad-l11-resampling
    title: Train, validation, test, cross-validation, and bootstrap
    summary: Separate data roles prevent evaluation leakage; repeated splits, cross-validation, and bootstrap
      estimate different aspects of out-of-sample uncertainty.
    builds_on:
    - knowledge-sad-l11-tasks
  - id: knowledge-sad-l11-objectives
    title: Loss functions, hypotheses, and inductive bias
    summary: A learner searches a hypothesis space using an objective; architecture, regularization, features,
      and optimization encode assumptions about which solutions should generalize.
    builds_on:
    - knowledge-sad-l11-tasks
  - id: knowledge-sad-l11-evaluation
    title: Evaluation metrics and class imbalance
    summary: Accuracy, precision, recall, F1, macro/micro/weighted aggregation, and regression losses
      answer different questions; metric choice follows costs, prevalence, and deployment context. Compare
      threshold curves and distinguish ROC-AUC from precision-recall AUC.
    builds_on:
    - knowledge-sad-l11-resampling
  - id: knowledge-sad-l11-generalization
    title: Underfitting, overfitting, and bias-variance
    summary: Model complexity trades approximation bias against sensitivity to samples; data volume, regularization,
      validation, and compute shape the attainable generalization performance.
    builds_on:
    - knowledge-sad-l11-objectives
    - knowledge-sad-l11-evaluation
