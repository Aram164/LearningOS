id: unit-m2-sad-l12
type: unit
module_id: module-hu-m2-statistik-analysis
component_id: component-m2-sad
kind: lecture
title: SaD Lecture 12 — Tree-Based Learning & Ensembles
order: 12
scope: Current 2026 L12 deck; decision-tree representation and preference bias, classification and regression
  trees, entropy and information gain, ID3 induction, variance reduction, overfitting, stopping and pruning,
  bagging, random forests, boosting, stacking, and ensemble tradeoffs.
status: ready
knowledge_map:
  summary: The lecture constructs interpretable partition models from information criteria and then reduces
    their instability by combining many trees in deliberately different ways.
  nodes:
  - id: knowledge-sad-l12-tree-model
    title: Decision trees, rules, and preference bias
    summary: Internal nodes test features, branches partition the instance space, and leaves predict;
      simpler rules encode a generalization preference rather than merely memorizing IDs.
  - id: knowledge-sad-l12-entropy-id3
    title: Entropy, information gain, and ID3
    summary: Entropy measures class impurity, information gain measures the reduction after a split, and
      ID3 greedily chooses the feature that produces the largest gain.
    builds_on:
    - knowledge-sad-l12-tree-model
  - id: knowledge-sad-l12-regression
    title: Regression trees and variance reduction
    summary: Numeric targets replace class impurity with within-node squared-error or variance reduction
      while retaining the same recursive partition structure.
    builds_on:
    - knowledge-sad-l12-tree-model
  - id: knowledge-sad-l12-pruning
    title: Tree growth, stopping, and pruning
    summary: Depth, minimum samples, purity thresholds, and post-pruning control complexity; an unpruned
      tree can fit noise and generalize poorly.
    builds_on:
    - knowledge-sad-l12-entropy-id3
  - id: knowledge-sad-l12-bagging-forest
    title: Bagging and random forests
    summary: Bootstrap aggregation averages unstable learners, while random forests add feature subsampling
      to decorrelate trees and reduce ensemble variance.
    builds_on:
    - knowledge-sad-l12-pruning
  - id: knowledge-sad-l12-boosting
    title: Boosting
    summary: Sequential weak learners focus on residuals or misclassified examples, trading a coordinated
      bias reduction against sensitivity to noise and tuning.
    builds_on:
    - knowledge-sad-l12-tree-model
  - id: knowledge-sad-l12-stacking
    title: Stacking and ensemble tradeoffs
    summary: A meta-learner combines diverse base predictions; leakage-safe out-of-fold construction,
      diversity, interpretability, compute, and calibration decide whether an ensemble is worthwhile.
    builds_on:
    - knowledge-sad-l12-bagging-forest
    - knowledge-sad-l12-boosting
