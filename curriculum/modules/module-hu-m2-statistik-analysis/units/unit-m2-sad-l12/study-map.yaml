  - kind: reference
    label: CS229 — decision-tree and boosting derivations
    locator: The decision-trees and boosting notes (the separate 'Decision Trees' and 'Boosting' note
      PDFs on the course site)
    angle: Derives boosting as a greedy stagewise fit to a loss function, which is where AdaBoost's exponential
      weights come from.
    angle_detail: L12 presents AdaBoost's reweighting rule as a procedure. These notes show it falling
      out of minimising exponential loss one weak learner at a time, which explains both the specific
      weight formula and why boosting can overfit. Above exam level and worth reading only if the reweighting
      rule looked arbitrary.
    vault_path: material://source-cs229-notes/cs229-notes.pdf
    scope_triage: reference-only
    source_id: source-cs229-notes
