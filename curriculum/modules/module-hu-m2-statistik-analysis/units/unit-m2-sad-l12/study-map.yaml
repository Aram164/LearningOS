    vault_path: material://source-geron-handson/geron.pdf
    scope_triage: helpful-now
  - kind: read
    label: Marsland Ch 12-13 - ID3 and the ensembles as algorithms
    locator: Chapter 12, pp. 270-287 (ID3 p. 271; entropy, information gain and Gini p. 272; pruning p.
      278; classification and regression trees p. 281) and Chapter 13, pp. 288-301 (boosting and AdaBoost
      p. 289; bagging p. 294; random forests p. 296)
    angle: Presents ID3 as code with entropy, information gain and Gini side by side, then boosting, bagging
      and random forests as procedures, which is the algorithmic reading of L12 that the slide pseudocode
      compresses.
    angle_detail: Marsland's discipline is that every method appears as runnable code, so ID3 (p. 271)
      is a function you could execute and the entropy/information-gain/Gini comparison (p. 272) is three
      lines you could swap. For L12's algorithmic nodes that is the most direct possible representation.
      Ch 13 then does the same for boosting/AdaBoost (p. 289), bagging (p. 294) and random forests (p.
      296), so the ensembles are also code rather than description. Pruning at p. 278 and the CART variant
      at p. 281 complete the deck's tree scope.
    scope_triage: helpful-now
