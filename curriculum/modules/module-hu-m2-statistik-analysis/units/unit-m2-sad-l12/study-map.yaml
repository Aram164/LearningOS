stages:
- id: stage-sad-l12-tree-model
  number: 1
  title: Decision trees, rules, and preference bias
  status: pending
  objective: Internal nodes test features, branches partition the instance space, and leaves predict;
    simpler rules encode a generalization preference rather than merely memorizing IDs.
  done_when:
  - 'Reproduce without notes: Internal nodes test features, branches partition the instance space, and
    leaves predict; simpler rules encode a generalization preference rather than merely memorizing IDs.'
  - Using L12 PDF pp. 5-12, trace one instance from root to leaf and write the corresponding rule. Defer
    tree induction, pruning and AdaBoost until their stages.
  exam_critical: true
  concepts:
  - concept-decision-trees
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L12 tree-based learning deck
    locator: lecture-slides/12_tree_based.pdf, PDF pp. 5-14
    angle: The current lecture's focused reading for decision trees, rules, and preference bias.
    angle_detail: Read physical PDF pages 5-14 for this stage. Printed slide labels may differ. This slice
      focuses the existing deck route; the complete lecture remains accessible through the unit material
      menu.
    scope_triage: required-now
    route_id: route-2dae8c065ede0f1bff7b14d7
    source_id: source-sad-ss26-lectures
  - kind: read
    label: Kelleher Chapter 4 — information-based learning
    locator: Ch 4 Information-based Learning, pdf pp. 156-214 (§4.2.3 the ID3 algorithm; the entropy and
      information-gain worked example)
    angle: Runs one ID3 example completely, computing every entropy and every gain by hand across all
      splits.
    angle_detail: L12 states the information-gain formula and shows a resulting tree. Kelleher computes
      the entropy of the target, then the remainder for each candidate feature, then the gain, then recurses
      — with the arithmetic printed at every node. That is exactly the calculation an exam will ask for
      on a small table, and doing it once with a fully worked reference is worth more than reading the
      formula ten times. The chapter also covers the gain-ratio correction for many-valued features, which
      the deck mentions in passing.
    vault_path: material://source-kelleher-fmlpda/kelleher.pdf
    scope_triage: helpful-now
    source_id: source-kelleher-fmlpda
    route_id: route-9892260cc9d0dbf2da2b165c
  - kind: read
    label: ISLP §§8.1–8.2 — trees and ensembles
    locator: Ch 8 Tree-Based Methods, pdf pp. 338-372 (§8.1 the basics of decision trees p. 339; §8.2
      bagging, random forests, boosting and BART p. 351; Ch 8 lab p. 361)
    angle: Separates the two reasons ensembles help — variance reduction by averaging, bias reduction
      by sequential fitting — instead of listing methods.
    angle_detail: 'L12 presents bagging, random forests, boosting and stacking as a family of techniques.
      ISLP organises the same material around the mechanism: bagging and forests reduce variance by averaging
      decorrelated trees, boosting reduces bias by fitting each tree to the residual of the last. Once
      that split is clear, the differences between the methods stop being arbitrary details. §8.2 also
      explains why random forests decorrelate by restricting the feature subset, which the deck asserts.'
    vault_path: material://source-islp/islp.pdf
    scope_triage: helpful-now
    source_id: source-islp
    route_id: route-6b5698803acbdbd638a146b6
  - kind: reference
    label: scikit-learn user guide §1.10 and §1.11 — trees and ensembles
    locator: 'User guide §1.10 ''Decision Trees'' (including §1.10.7 mathematical formulation of the impurity
      criteria) and §1.11 ''Ensembles: Gradient boosting, random forests, bagging, voting, stacking'''
    angle: States the impurity criteria as formulas beside the parameter that selects them, tying L12's
      theory directly to a knob.
    angle_detail: §1.10.7 writes out the Gini and entropy criteria and the regression variance criterion,
      and the surrounding text explains what each pruning parameter (max_depth, min_samples_leaf, ccp_alpha)
      does to the resulting tree. That mapping from concept to parameter is a strong memory aid, and §1.11
      does the same for all four ensemble families L12 names — including stacking, which most books skip.
    scope_triage: helpful-now
    source_id: source-sklearn-user-guide
    route_id: route-0f00ed6b65da6c9fdd94757f
  - kind: watch
    label: StatQuest — decision trees and random forests
    locator: '''Decision Trees, Clearly Explained''; ''Regression Trees, Clearly Explained''; ''Random
      Forests Part 1 — Building, Using and Evaluating''; ''AdaBoost, Clearly Explained'' (≈15-20 min each)'
    angle: Builds a tree split by split with the impurity numbers on screen, then shows exactly what a
      forest changes.
    angle_detail: The tree video computes the impurity of each candidate split and picks the winner, on
      screen, which is the L12 exam calculation. The random-forest video then isolates the two changes
      from a single tree — bootstrap the rows, restrict the columns at each split — and shows out-of-bag
      evaluation falling out for free. Separating those two changes is what stops 'random forest' from
      being a black box. The AdaBoost video handles the reweighting visually.
    scope_triage: helpful-now
    source_id: source-statquest
    route_id: route-f13a1bb3e87f67e51c110dad
  - kind: read
    label: Kroese Chapter 8 — tree methods
    locator: Ch 8 Decision Trees and Ensemble Methods, pdf pp. 305-340
    angle: Gives the splitting criteria as impurity functions in a single framework, so entropy and Gini
      are two choices of one object.
    angle_detail: Presenting information gain and the Gini index as different impurity measures plugged
      into the same greedy algorithm is more economical than learning them separately, and it makes clear
      that the algorithm does not depend on which is chosen. The ensemble half is compact and mathematical
      — it gives the variance-reduction argument for bagging in algebra rather than in words.
    vault_path: material://source-kroese-dsml/kroese.pdf
    scope_triage: helpful-now
    source_id: source-kroese-dsml
    route_id: route-8b4580c36cbf51ee7807a23e
  - kind: reference
    label: Stanford CS229 — tree/ensemble lecture selections
    locator: Spring 2022 playlist, Lecture 11 'Decision Trees' and Lecture 12 'Boosting'
    angle: A research-level lecturer explaining why trees are still used, which is context the deck does
      not attempt.
    angle_detail: 'The useful part is the framing: where trees sit relative to everything else in the
      course, what they are good at (heterogeneous tabular features, interpretability) and what they are
      bad at. That judgment is hard to get from a textbook and is the kind of thing a conceptual exam
      question rewards. The technical content is above SaD''s level in places; watch for the framing.'
    scope_triage: reference-only
    source_id: source-cs229-2022-videos
    route_id: route-0f4dd7d42e4f26f7e9730a91
  - kind: reference
    label: Cornell Fall 2018 HW8 — regression trees and AdaBoost normalization
    locator: '2018Fall/HW8/hw8.pdf: Problem 1(a), PDF p. 1; Problem 1(b), pp. 1-3; Problem 2, p. 3'
    angle: Deferred to regression trees and boosting; this PDF is not a categorical-entropy introduction.
    angle_detail: Fall 2018 HW8 PDF Problem 1(a) builds a regression tree, 1(b) concerns pruning, and
      Problem 2 proves normalization of AdaBoost weights; it is not a numerical multi-round AdaBoost trace.
      Spring 2018 HW8 covers ridge regression, perceptrons and kernels and is excluded from this L12 assignment.
      The Fall PDF and TeX differ in Problem 1(b), so solution correspondence for that part is unresolved.
    scope_triage: reference-only
    source_id: source-cs4780-homeworks
    route_id: route-5a43ff2dd96c3c7e6aee61a4
    vault_path: material://source-cs4780-homeworks/2018Fall/HW8/hw8.pdf
  - kind: practise
    label: MIT 6.034 quizzes — ID3/tree tracing
    locator: MIT6_034F10_quiz3_2010.pdf, Fall 2010 Quiz 3, Problem 1 Part B 'ID Trees', PDF pp. 4-5
    angle: 'Exam-format tracing questions with solutions: build the tree from a small table under time
      pressure.'
    angle_detail: MIT 6.034's quizzes are unusually procedural — they ask you to execute the algorithm
      and show the intermediate state, which is precisely the L12 exam form. Because the solutions are
      official and complete, a wrong answer can be diagnosed to the exact split. The archive spans many
      years, so there is enough material to practise repeatedly.
    scope_triage: helpful-now
    source_id: source-mit-6034-quizzes
    route_id: route-8fec57420f21e471d11c0a87
  - kind: read
    label: Geron Ch 6 - trees you can grow and prune
    locator: Chapter 6, pp. 203-216
    angle: 'Executes the L12 induction story: impurity-driven splits, the regression criterion, and the
      regularisation hyperparameters that stand in for the deck''s pre-pruning discussion, so the ID3
      trace has a machine-checked counterpart.'
    angle_detail: Fourteen pages that grow a tree, visualise it, and then prune it by constraining depth
      and leaf size — the practical form of L12's pruning node, which the deck states as a principle.
      Because the trees are drawn at each stage, the effect of each constraint on the decision boundary
      is visible rather than described. Also demonstrates the instability of trees to small data changes,
      which is the motivation for the ensembles in the next chapter.
    vault_path: material://source-geron-handson/geron.pdf
    scope_triage: helpful-now
    source_id: source-geron-handson
    route_id: route-f9377aee01af8b15edbf8705
  - kind: read
    label: Brandon Rohrer — friendly decision-tree explanation
    locator: The 'How decision trees work' article and its companion video on e2eml.school
    angle: A no-notation explanation for unblocking, when the formal treatment has stalled.
    angle_detail: 'Rohrer writes for readers who want the mechanism without the mathematics, using pictures
      and plain sentences. Routed here as a repair path rather than a study path: if the entropy computation
      has become an obstacle to seeing what a tree does, twenty minutes here restores the picture and
      the formal treatment becomes readable again. Not sufficient for the exam on its own.'
    scope_triage: helpful-now
    source_id: source-rohrer-e2eml
    route_id: route-fcd3c263bfe17bebb07f49c3
  - kind: reference
    label: ESL - the ensemble chapters behind the L12 summary slide
    locator: Section 9.2 tree-based methods, p. 324; section 8.8 model averaging and stacking, p. 307;
      Chapter 10 boosting and additive trees, pp. 356-407; Chapter 15 random forests, pp. 606-623
    angle: 'Supplies the derivations the deck summarises in four bullets: why AdaBoost fits an additive
      model under exponential loss, what random forests do to variance, and the model-averaging view that
      stacking belongs to.'
    angle_detail: The research-level accounts behind L12's summary slides. §9.2 (p. 324) is CART stated
      properly; Ch 10 (pp. 356-407) develops boosting as forward stagewise additive modelling, which is
      where the algorithm actually comes from; Ch 15 (pp. 606-623) is the random-forest analysis including
      why decorrelation reduces variance. §8.8 (p. 307) covers stacking. Use it to settle a specific question
      — this is not a first-pass reading and each section assumes the ones before it.
    vault_path: material://source-esl/esl.pdf
    scope_triage: reference-only
    source_id: source-esl
    route_id: route-1f6f29865621dc40da790e50
