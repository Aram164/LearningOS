  number: 2
  title: Entropy, information gain, and ID3
  status: pending
  objective: Entropy measures class impurity, information gain measures the reduction after a split, and
    ID3 greedily chooses the feature that produces the largest gain.
  done_when:
  - 'Reproduce without notes: Entropy measures class impurity, information gain measures the reduction
    after a split, and ID3 greedily chooses the feature that produces the largest gain.'
  - Compute entropy and information gain for the L12 PDF pp. 21-24 dataset, then check the shown split.
    Use the existing MIT ID-tree question for additional practice; reserve Cornell Fall HW8 for regression
    trees.
