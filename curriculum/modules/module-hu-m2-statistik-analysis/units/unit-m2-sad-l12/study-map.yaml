    label: Berkeley CS189 — past exam questions on trees and ensembles
    locator: Fall 2024 Final Solutions, decision-tree and random-forest problem, PDF p. 9
    angle: Exam-form questions that ask why an ensemble helps, not only how to run one.
    angle_detail: 'The ''compute the information gain'' question is well covered by MIT 6.034''s quizzes.
