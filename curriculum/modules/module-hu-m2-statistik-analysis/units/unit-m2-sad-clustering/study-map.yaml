    scope_triage: required-now
    route_id: route-448bd2b33e64225d557d6c85
  - kind: reference
    label: 2025 L12 clustering deck
    source_id: source-sad-2025-recordings
    locator: 12_clustering.pdf (157 slides), prior-year full lecture on clustering
    angle: A verified same-topic full lecture that deepens UE7's clustering treatment. It is not a source
      for current L12 trees despite sharing the number 12.
    angle_detail: 'A verified same-topic full lecture from the 2025 run, and the only place clustering
      gets lecture-length treatment rather than a tutorial''s. Use it to deepen UE7 after the trace is
      understood. Two cautions: it is prior-year material, so it is practice and reference and never scope
      evidence (the current course covers clustering only through UE7); and its number collides with the
      current L12, which is trees — this deck is not a source for the current L12 despite sharing a number.'
    scope_triage: reference-only
    route_id: route-0d244a0a83df84591c6685a2
  - kind: reference
    label: ISLP §12.4 — clustering algorithms and validation
    source_id: source-islp
    locator: 'islp.pdf §12.4 Clustering Methods p. 526: §12.4.1 K-Means Clustering p. 527, §12.4.2 Hierarchical
      Clustering p. 531, §12.4.3 Practical Issues in Clustering p. 538; §12.5 Lab: Unsupervised Learning
      p. 541. (Corrected 2026-08-29: the route previously read ''§12.2'', which is Principal Components
      Analysis p. 510, not clustering.)'
    angle: Optional depth on k-means, hierarchical clustering, practical choices, and validation after
      the UE7 scope; it broadens rather than defines the exam topic.
    angle_detail: '§12.4.3 is the section that earns this route a place: ''Practical Issues in Clustering''
      is a short, honest list of the decisions that change the answer — standardisation, the choice of
      dissimilarity, how many clusters, and whether the clusters mean anything at all. UE7 raises these
      implicitly by tracing one configuration; ISLP states them. §12.4.1 and §12.4.2 are the algorithms
      at a gentler level than ESL, and the lab at p. 541 runs them.'
    scope_triage: reference-only
    route_id: route-1cd59e8e870b504eacfc60a2
  - kind: reference
    label: Kroese — clustering reference
    source_id: source-kroese-dsml
    locator: 'kroese.pdf Ch 4 ''Unsupervised Learning'' p. 139: Risk and Loss in Unsupervised Learning
      p. 140, Clustering via Mixture Models p. 153, Clustering via Vector Quantization p. 160, Hierarchical
      Clustering p. 165; the supervised/unsupervised distinction is set up at p. 38'
    angle: Independent data-science treatment of clustering families, objectives, and practical evaluation;
      optional after the UE7 trace.
    angle_detail: An independent data-science treatment that arrives at clustering from the risk/loss
      framing (p. 140) rather than from an algorithm, then splits the families the way UE7 names them.
      Its mixture-model section (p. 153) is the one genuinely extra idea on this stage — clustering as
      density estimation rather than as partitioning — and is optional after the UE7 trace. Mathematically
      heavier than Géron, lighter than ESL.
    scope_triage: reference-only
    route_id: route-883509bbad7e137305f77039
  - kind: read
    label: Geron Ch 9 - k-means plus the density family and cluster evaluation
    source_id: source-geron-handson
    locator: Chapter 9, pp. 263-300 (k-means and DBSCAN p. 264; hierarchical p. 266; inertia p. 270; silhouette
      score and elbow p. 274)
    angle: The UE7 topic names hierarchical, partitioning and density families and asks how clustering
      results are compared; this chapter supplies DBSCAN for the density family and silhouette/elbow for
      the comparison question, neither of which any other registered source covers at working depth.
    angle_detail: The chapter answers UE7's two open questions directly. UE7 names the hierarchical, partitioning
      and density families but only traces k-means; Géron gives DBSCAN (p. 264) and hierarchical (p. 266)
      working code beside it. UE7 asks how clustering results are compared without saying how; Géron gives
      inertia (p. 270) and then the silhouette score and the elbow method (p. 274) as the two standard
      answers, with the plots that make the difference between them visible. It is Python-first and assumes
      scikit-learn, so read it for the concepts and the comparison criteria rather than as a derivation.
    scope_triage: helpful-now
    route_id: route-5c2a22799618a90354f2cdec
  - kind: read
    label: Zacharski Ch 8 - k-means and hierarchical clustering traced step by step
    source_id: source-zacharski-data-mining
    locator: Chapter 8, pp. 334-395 (k-means and hierarchical clustering from p. 335)
    angle: The UE7 slides define the clustering topic but supply no worked convergence trace; this chapter
      iterates assignment and update on a small data set and shows the hierarchical alternative on the
      same points.
    angle_detail: 'The gap this fills is specific: UE7''s slides define the topic and state the algorithm,
      but a definition of k-means does not show you that the assignment and update steps alternate until
      nothing moves. Zacharski iterates both on a small worked table from p. 335 and prints the intermediate
      state each round, which is what makes the convergence argument concrete and what an exam tracing
      question would expect you to reproduce. Informal in tone and light on theory — take the trace, not
      the framing.'
    scope_triage: helpful-now
    route_id: route-3bcffbb0094d3c764dd01e18
  - kind: reference
    label: ESL 14.3 - cluster analysis as an objective, not an algorithm
    source_id: source-esl
    locator: Section 14.3 cluster analysis, pp. 520-546
    angle: Frames clustering by its loss function and dissimilarity choice before any algorithm, which
      is the 'no single true clustering' point the UE7 slides make rhetorically.
    angle_detail: Read this before any algorithm, not after. ESL §14.3 defines clustering by its loss
      function and by the dissimilarity measure chosen, and only then derives the algorithms as ways of
      minimising that loss — which is the argument behind UE7's 'there is no single true clustering'.
      It is the most demanding route on this stage and assumes comfort with the notation; twenty-six pages,
      of which the first six carry the framing that matters here.
    scope_triage: reference-only
    route_id: route-98f4476be143898c5a500b3f
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-clustering/stages/stage-sad-clustering-families/notes.md
  attachments: []
  source_feedback: []
