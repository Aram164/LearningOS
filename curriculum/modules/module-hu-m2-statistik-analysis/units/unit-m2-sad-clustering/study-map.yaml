id: study-map-m2-sad-clustering
type: study-map
plan_template_version: 1
unit_id: unit-m2-sad-clustering
status: not-started
current_stage: stage-sad-clustering-unsupervised
source_plan:
  path: curriculum/modules/module-hu-m2-statistik-analysis/source-map.yaml
  provenance: operator
detours: []
shelving:
  state: none
stages:
- id: stage-sad-clustering-unsupervised
  number: 1
  title: Exploratory unsupervised learning
  status: pending
  objective: Clustering seeks useful groups without labels; the result depends on representation, similarity,
    objective, and chosen algorithm rather than revealing a unique ground truth automatically.
  done_when:
  - 'Reproduce without notes: Clustering seeks useful groups without labels; the result depends on representation,
    similarity, objective, and chosen algorithm rather than revealing a unique ground truth automatically.'
  - Work UE7 — clustering families and complete k-means trace, and record every miss with the step it
    failed at.
  exam_critical: true
  concepts:
  - concept-clustering
  - concept-supervised-learning
  scope_triage: required-now
  resources:
  - kind: read
    label: L11 supervised/unsupervised framing
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/11_datascience_intro.pdf (49 slides), the supervised/unsupervised framing
      section
    angle: Supplies the current lecture definition of unsupervised learning that UE7's clustering topic
      instantiates; it is a framing bridge, not a missing clustering lecture.
    angle_detail: 'This is a framing bridge, not the clustering material: L11 defines what unsupervised
      learning is and where it sits against the supervised tasks the rest of the course teaches, and then
      the course moves on. The clustering content itself is UE7''s. Read the section to fix the vocabulary
      — what is being learned when there are no labels, and what ''correct'' can even mean — then work
      UE7. Nothing here is a method.'
    scope_triage: helpful-now
    route_id: route-56679bcd3c703dc9d18a9cd9
  - kind: practise
    label: UE7 — clustering families and complete k-means trace
    source_id: source-sad-uebungen
    locator: exercise-slides/UE7.pdf slides 32–87
    angle: The current authority for this auxiliary topic, including method families, a full assignment/
      centroid-update walkthrough, local-optimum caveats, and final exam questions.
    angle_detail: 'UE7 is the whole current scope for this topic: 88 slides, of which 32-87 are the clustering
      block, and there is no lecture deck behind it. That makes it the scope authority and the only course-aligned
      trace available — the assignment step and the centroid-update step are walked through in full, including
      a local optimum reached from a bad initialisation. Everything else on this stage deepens or re-explains
      what is on these slides; none of it extends the examinable boundary.'
    scope_triage: required-now
    route_id: route-448bd2b33e64225d557d6c85
  - kind: reference
    label: 2025 L12 clustering deck
    source_id: source-sad-2025-recordings
    locator: 12_clustering.pdf (157 slides), prior-year full lecture on clustering
    angle: A verified same-topic full lecture that deepens UE7's clustering treatment. It is not a source
      for current L12 trees despite sharing the number 12.
    angle_detail: 'A verified same-topic full lecture from the 2025 run, and the only place clustering
      gets lecture-length treatment rather than a tutorial''s. Use it to deepen UE7 after the trace is
      understood. Two cautions: it is prior-year material, so it is practice and reference and never scope
      evidence (the current course covers clustering only through UE7); and its number collides with the
      current L12, which is trees — this deck is not a source for the current L12 despite sharing a number.'
    scope_triage: reference-only
    route_id: route-0d244a0a83df84591c6685a2
  - kind: read
    label: Zacharski Ch 8 - k-means and hierarchical clustering traced step by step
    source_id: source-zacharski-data-mining
    locator: Chapter 8, pp. 334-395 (k-means and hierarchical clustering from p. 335)
    angle: The UE7 slides define the clustering topic but supply no worked convergence trace; this chapter
      iterates assignment and update on a small data set and shows the hierarchical alternative on the
      same points.
    angle_detail: 'The gap this fills is specific: UE7''s slides define the topic and state the algorithm,
      but a definition of k-means does not show you that the assignment and update steps alternate until
      nothing moves. Zacharski iterates both on a small worked table from p. 335 and prints the intermediate
      state each round, which is what makes the convergence argument concrete and what an exam tracing
      question would expect you to reproduce. Informal in tone and light on theory — take the trace, not
      the framing.'
    scope_triage: helpful-now
    route_id: route-3bcffbb0094d3c764dd01e18
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-clustering/stages/stage-sad-clustering-unsupervised/notes.md
  attachments: []
  source_feedback: []
