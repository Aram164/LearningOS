  number: 2
  title: Hierarchical, partitioning, and density families
  status: pending
  objective: The main families express different assumptions about cluster nesting, number, compactness,
    shape, density, noise, and outliers.
  done_when:
  - 'Reproduce without notes: The main families express different assumptions about cluster nesting, number,
