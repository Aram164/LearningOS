- id: stage-sad-clustering-unsupervised
  number: 1
  title: Exploratory unsupervised learning
  status: pending
  objective: Clustering seeks useful groups without labels; the result depends on representation, similarity,
    objective, and chosen algorithm rather than revealing a unique ground truth automatically.
  done_when:
  - 'Reproduce without notes: Clustering seeks useful groups without labels; the result depends on representation,
    similarity, objective, and chosen algorithm rather than revealing a unique ground truth automatically.'
  - Work UE7 — clustering families and complete k-means trace, and record every miss with the step it
    failed at.
  exam_critical: true
  concepts:
  - concept-clustering
  - concept-supervised-learning
  scope_triage: required-now
  resources:
  - kind: read
    label: L11 supervised/unsupervised framing
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/11_datascience_intro.pdf supervised/unsupervised section — Supplies the current
      lecture definition of unsupervised learning that UE7's clustering topic instantiates; it is a framing
      bridge, not a missing clustering lecture.
    scope_triage: helpful-now
  - kind: practise
    label: UE7 — clustering families and complete k-means trace
    source_id: source-sad-uebungen
    locator: exercise-slides/UE7.pdf slides 32–87 — The current authority for this auxiliary topic, including
      method families, a full assignment/ centroid-update walkthrough, local-optimum caveats, and final
      exam questions.
    scope_triage: required-now
  - kind: reference
    label: 2025 L12 clustering deck
    source_id: source-sad-2025-recordings
    locator: 12_clustering.pdf — A verified same-topic full lecture that deepens UE7's clustering treatment.
      It is not a source for current L12 trees despite sharing the number 12.
    vault_path: material://source-sad-2025-recordings/12_clustering.pdf
    scope_triage: reference-only
  - kind: read
    label: Zacharski Ch 8 - k-means and hierarchical clustering traced step by step
    source_id: source-zacharski-data-mining
    locator: Chapter 8, pp. 334-395 (k-means and hierarchical clustering from p. 335) — The UE7 slides
      define the clustering topic but supply no worked convergence trace; this chapter iterates assignment
      and update on a small data set and shows the hierarchical alternative on the same points.
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-clustering/stages/stage-sad-clustering-unsupervised/notes.md
  attachments: []
  source_feedback: []
