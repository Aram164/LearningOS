- id: stage-sad-l10-multiple
  number: 8
  title: Multiple testing and Bonferroni correction
  status: pending
  objective: Repeated tests inflate the chance of at least one false rejection; choose alpha before looking
    and apply the Bonferroni per-test threshold alpha/m when controlling this family-wise risk.
  done_when:
  - Explain why 100 true-null tests at alpha=0.05 yield five expected false rejections, not twenty. Apply
    alpha/m to a specified family and distinguish the raw p-value from an adjusted p-value.
  - Explain the current deck’s p-hacking and preregistration warnings. Treat FDR/BH as optional extension.
  exam_critical: true
  concepts:
  - concept-hypothesis-testing
  - concept-multiple-testing
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L10 hypothesis-testing deck
    locator: lecture-slides/10_testing.pdf, PDF pp. 60-65
    angle: Warns against repeated-testing false positives, changing alpha after seeing data, selective
      reporting and p-hacking; it only sketches correction and does not teach FDR.
    angle_detail: Read physical PDF pp. 60–65 for repeated-testing pitfalls and prespecified alpha. Physical
      p. 62 wrongly gives 20 expected false positives for 100 true-null tests at alpha=0.05; the expectation
      is 5. Use alpha/m as the per-test Bonferroni threshold, or min(1,m·p_raw) as an adjusted p-value.
      The current deck does not teach FDR.
    scope_triage: required-now
    route_id: route-37b273e6be586546e32355cb
    source_id: source-sad-ss26-lectures
  - material_ref:
      route_id: route-b51a9ce76538f13c02e94238
      inherit:
      - label
      - source_id
    route_id: route-b51a9ce76538f13c02e94238
    kind: read
    scope_triage: helpful-now
    locator: 10_statistical_significance.pdf, physical PDF pp. 43–45
    angle: The prior-year course deck states the prespecified-alpha rule and the correct Bonferroni threshold
      α/m.
    angle_detail: Pages 43–45 connect choosing alpha before testing, many drug variants and false-positive
      accumulation, then explicitly divide alpha by the number of tests. This repairs the current deck
      p. 62 wording but does not add FDR to core scope.
  - material_ref:
      route_id: route-sad-l10-fahrmeir-bonferroni
      inherit:
      - label
      - source_id
      - vault_path
    route_id: route-sad-l10-fahrmeir-bonferroni
    kind: read
    scope_triage: helpful-now
    locator: Chapter 10 §10.3 Multiple Testprobleme, physical PDF pp. 445–446
    angle: Quantifies family-wise false-rejection inflation before applying Bonferroni at α/k.
    angle_detail: The German worked table reaches 0.994 for 100 independent 5% tests; the page then states
      the per-test α/k threshold. This numerical derivation corrects the current deck p. 62 count and
      notation. It is Chapter 10, not Chapter 12.
  - material_ref:
      route_id: route-sad-l10-islp-multiple-testing
      inherit:
      - label
      - source_id
      - vault_path
    route_id: route-sad-l10-islp-multiple-testing
    kind: read
    scope_triage: reference-only
    locator: ISLP Chapter 13, physical PDF pp. 571–581
    angle: 'Optional extension: separates family-wise error from false-discovery rate and gives Holm/BH
      procedures.'
    angle_detail: Pages 571–575 develop FWER, Bonferroni and Holm; pp. 576–581 develop FDR and Benjamini–Hochberg.
      The current SaD deck does not teach FDR, so this resource is optional reference only.
