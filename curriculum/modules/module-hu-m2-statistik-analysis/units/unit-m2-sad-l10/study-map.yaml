- id: stage-sad-l10-tails-pvalue
  number: 2
  title: Tails, critical regions, and p-values
  status: pending
  objective: 'The alternative determines one- versus two-sided evidence; a p-value is the null probability
    of a result at least as extreme, not the probability that the null is true. Note: printed slide 28
    contains an explicit z-statistic erratum — the z formula is missing a √n factor. The correct statistic
    for the stated values (n=10, σ²=4, x̄=98.9, μ₀=100) is approximately −1.74, not the printed −0.55.'
  done_when:
  - 'Reproduce without notes: The alternative determines one- versus two-sided evidence; a p-value is
    the null probability of a result at least as extreme, not the probability that the null is true.'
  - Work Blatt 5, Aufgabe 1 — permutation test and t-test comparison, then the remaining 6, and record
    every miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-hypothesis-testing
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L10 hypothesis-testing deck
    locator: lecture-slides/10_testing.pdf, PDF pp. 25-27
    angle: Read the testing example with its corrected standard error.
    angle_detail: 'Read physical PDF pages 25-27 for this stage. Printed slide labels may differ. This
      slice focuses the existing deck route; the complete lecture remains accessible through the unit
      material menu. Source correction: L10 PDF p. 27 (printed 28) omits sqrt(n). With n=10, sigma=2,
      xbar=98.9 and mu0=100, z=(98.9-100)/(2/sqrt(10))=-1.73925; the lower-tail p-value is 0.040995, not
