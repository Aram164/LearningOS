    angle: The largest deck in the module and the complete course logic of testing, from null models to
      multiple testing.
    angle_detail: Sixty-five slides introducing the entire testing vocabulary at once — null model, statistic,
      reference distribution, tails, p-value, both error types, power, z/t, chi-square, nonparametric
      alternatives, confidence-interval duality and multiplicity. The volume is the difficulty. Dekking's
      two-chapter split (Ch 25 essentials, Ch 26 elaboration) is the standard way to take the same content
      in two passes. Duality and multiple testing are both exam-favoured and both sit at the end of the
      deck.
    scope_triage: required-now
    route_id: route-37b273e6be586546e32355cb
    source_id: source-sad-ss26-lectures
  - kind: read
    label: Fahrmeir Chapters 10–11 — hypothesis tests
    locator: Ch 10 §10.1 Der Binomial- und der Gauß-Test, pdf pp. 417-429; §10.2 Prinzipien des Testens,
      pdf pp. 430-444; §10.3 Multiple Testprobleme, pdf pp. 445-446; Ch 11 §11.2 Ein-Stichproben-Fall,
      pdf pp. 452-469; §11.5 Zusammenhangsanalyse, pdf pp. 482-485
    angle: Teaches one concrete test end to end first, then generalises the principle — the reverse of
      the lecture's order, and the better order when the logic will not click.
    angle_detail: 'L10 opens with the abstract null-model/statistic/reference-distribution machinery and
      then instantiates it. Fahrmeir §10.1 does the opposite: it runs the Gauß-Test completely — hypotheses,
      statistic, critical region, decision — and only then does §10.2 extract Fehler 1./2. Art, Güte and
      the p-Wert as principles from the worked case. If the abstract version did not land in the lecture,
      this inversion is the reason to come here rather than to OpenIntro. §11.5 supplies the χ²-Unabhängigkeitstest
      and the correlation test; §10.3 is two pages on multiple testing, enough for the exam but thinner
      than ISLP Ch 13.'
    vault_path: material://source-fahrmeir-statistik/statistik.pdf
    scope_triage: helpful-now
  - kind: practise
    label: Arbeitsbuch Chapters 10–11 — testing drills
    locator: Ch 10 Aufgaben pdf pp. 200-205, Lösungen pdf pp. 206-218; Ch 11 Aufgaben pdf pp. 219-226,
      Lösungen pdf pp. 227-242
    angle: 'Complete test write-ups in German exam form: hypotheses, statistic, critical value, decision,
      sentence.'
    angle_detail: A German statistics exam awards marks for the shape of the answer, not only the number
      — stating H0 and H1 formally, naming the test, giving the critical value, and closing with a sentence
      that answers the question in context. These solutions are written in exactly that form, which makes
      them a template as much as an answer key. Ch 11 extends to the two-sample and χ² cases; do Ch 10
      first and only reach Ch 11 if the exercises show those tests are in scope.
    vault_path: material://source-fahrmeir-arbeitsbuch/arbeitsbuch.pdf
    scope_triage: helpful-now
  - kind: read
    label: Blitzstein §10.4 — where the t and chi-square distributions come from
    locator: Ch 10 §10.4 Chi-Square and Student-t, pdf pp. 494-496
    angle: Defines the t and chi-square distributions constructively out of Normals, instead of introducing
      them as table lookups.
    angle_detail: L10 uses both as reference distributions and never says what they are. Three pages here
      define chi-square as a sum of squared standard Normals and t as a standard Normal divided by the
      root of an independent chi-square over its degrees of freedom. That is what makes 'degrees of freedom'
      a quantity rather than a column heading, and it explains why the t approaches the Normal as n grows.
      Background, not exam-bearing — read it once.
    vault_path: material://source-blitzstein-hwang/blitzstein.pdf
    scope_triage: helpful-now
  - kind: read
    label: OpenIntro Chapters 5–7 — tests by data type
    locator: Ch 5 §5.3 hypothesis testing for a proportion, pdf pp. 189-205; Ch 6 §6.3 testing for goodness
      of fit using chi-square, pdf pp. 229-239; §6.4 testing for independence in two-way tables, pdf pp.
      240-248; Ch 7 §7.1 one-sample means with the t-distribution, pdf pp. 251-261; §7.4 power calculations,
      pdf pp. 278-284
    angle: Teaches the p-value through randomisation before any reference distribution appears, and has
      the only real power section on the shelf.
    angle_detail: '§5.3 builds the null distribution by shuffling the data — the malaria-vaccine simulation
      from Ch 2 — so a p-value is first seen as a proportion of shuffles at least as extreme as the observed
      result. Once that is concrete, the z and t reference distributions are recognisable as shortcuts
      for the same quantity. §7.4 then does what almost nothing else here does: computes power and required
      sample size explicitly, rather than defining power and moving on. §§6.3-6.4 cover both chi-square
      variants that L10 names.'
    vault_path: material://source-openintro-statistics/openintro.pdf
    scope_triage: helpful-now
  - kind: practise
    label: Dekking — hypothesis-testing exercises
    locator: 'Ch 25 testing hypotheses: essentials, pdf pp. 375-384 (null hypothesis and test statistic
      p. 375; tail probabilities p. 378; type I and II errors p. 379; exercises p. 382); Ch 26 testing
      hypotheses: elaboration, pdf pp. 385-399 (significance level p. 385; critical region p. 388; type
      II error p. 392; relation with confidence intervals p. 394); Ch 27 the t-test, pdf pp. 400-414'
    angle: Splits testing across two chapters — essentials, then elaboration — so the vocabulary is not
      all introduced at once.
    angle_detail: L10 introduces null model, statistic, tails, p-value, both error types, power, and duality
      inside one lecture, and the vocabulary load is the real difficulty. Dekking's split means Ch 25
      gets you to a decision with only three of those ideas, and Ch 26 revisits the same example to add
      significance level, critical region, type II error and the confidence-interval duality one at a
      time. §26.4 on duality is the clearest statement of that equivalence on the shelf, and duality is
      a recurring exam question. Ch 27 works the t-test in a regression setting as well as the one-sample
      case.
    vault_path: material://source-dekking-mips/dekking.pdf
    scope_triage: helpful-now
  - kind: read
    label: MIT 18.05 — hypothesis-testing notes and solved exams
    locator: 'Classes: Reading and In-class Materials: the ''Null Hypothesis Significance Testing'' readings
      (I, II, III) and the chi-square reading; the Exams page for solved test questions'
    angle: Splits NHST across three consecutive readings, and closes with an explicit critique of p-values
      that the lecture only gestures at.
    angle_detail: Reading I sets up the machinery, II adds the error types and power, III covers the multiple-test
      and replication problems including a frank discussion of what a p-value does not tell you. That
      third part is the intellectual content behind L10's multiple-testing node, and it is what makes
      the difference between reciting the false-discovery definition and understanding why the topic is
      in the lecture at all. Solved timed questions on the Exams page.
    scope_triage: helpful-now
  - kind: reference
    label: MIT 18.650 Lectures 7–12 — tests and goodness-of-fit
    locator: Lectures 7-12 (hypothesis testing, the Neyman-Pearson framework, chi-square and goodness-of-fit
      tests); graduate-level, reference only
    angle: Derives why the standard tests take the form they do, via the Neyman-Pearson lemma that no
      SaD material mentions.
    angle_detail: SaD hands you a catalogue of tests and their statistics. Neyman-Pearson answers the
      question the catalogue provokes — where did these particular statistics come from, and in what sense
      are they the best available — by showing that the likelihood ratio is the optimal test statistic
      for a simple hypothesis pair. Genuinely interesting and genuinely out of scope; six lectures.
    scope_triage: reference-only
  - kind: practise
    label: Leuphana-Merz pp. 28-40 — parametric, two-sample and goodness-of-fit tests
    locator: Leuphana-Merz_Statistik-2_Uebungsbuch-mit-Klausur.pdf, pp. 28-40, Aufgabenblätter 5-6
    angle: Supplies full German test write-ups across several test families, with solutions.
    angle_detail: 'This is the widest local testing bank: one- and two-sample tests plus goodness-of-fit/chi-square
      work. Use the problems to practise test selection and complete written decisions; skip procedures
      not named in the 2026 L10 deck.'
    vault_path: material://source-sad-klausuren-extern/Leuphana-Merz_Statistik-2_Uebungsbuch-mit-Klausur.pdf
    scope_triage: helpful-now
