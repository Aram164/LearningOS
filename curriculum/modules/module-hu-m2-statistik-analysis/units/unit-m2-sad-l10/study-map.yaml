- id: stage-sad-l10-errors-power
  number: 3
  title: Type I error, Type II error, and power
  status: pending
  objective: Alpha controls false rejection under the null, beta describes missed effects under an alternative,
    and power depends on effect size, noise, sample size, and the decision threshold.
  done_when:
  - Draw the truth-by-decision table and state alpha, beta and power=1−beta without notes.
  - Use OpenIntro §7.4 or Dekking Ch. 26 to calculate power at a specified alternative; record which assumptions
    and effect size the answer depends on.
  exam_critical: true
  concepts:
  - concept-hypothesis-testing
  scope_triage: required-now
  resources:
