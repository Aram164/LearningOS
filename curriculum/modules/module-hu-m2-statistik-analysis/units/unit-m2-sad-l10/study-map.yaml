- id: stage-sad-l10-multiple
  number: 8
  title: Multiple testing and false discoveries
  status: pending
  objective: Repeating tests inflates the chance of at least one false positive; family-wise and false-discovery
    controls answer different error-management questions.
  done_when:
  - 'Reproduce without notes: Repeating tests inflates the chance of at least one false positive; family-wise
    and false-discovery controls answer different error-management questions.'
  exam_critical: true
  concepts:
  - concept-hypothesis-testing
  - concept-multiple-testing
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L10 hypothesis-testing deck
    locator: lecture-slides/10_testing.pdf, 65 slides
    angle: The largest deck in the module and the complete course logic of testing, from null models to
      multiple testing.
    angle_detail: Sixty-five slides introducing the entire testing vocabulary at once — null model, statistic,
      reference distribution, tails, p-value, both error types, power, z/t, chi-square, nonparametric
      alternatives, confidence-interval duality and multiplicity. The volume is the difficulty. Dekking's
      two-chapter split (Ch 25 essentials, Ch 26 elaboration) is the standard way to take the same content
      in two passes. Duality and multiple testing are both exam-favoured and both sit at the end of the
      deck.
    scope_triage: required-now
    route_id: route-37b273e6be586546e32355cb
    source_id: source-sad-ss26-lectures
  - kind: read
    label: ISLP Ch 13 - the multiple-testing slide worked out with labs and exercises
    locator: Chapter 13, pp. 563-602 (false discovery rate p. 564; family-wise error rate p. 571; Bonferroni
      and Holm p. 573; Benjamini-Hochberg p. 581; lab section 13.6 p. 589; exercises section 13.7 p. 599)
    angle: L10's closing slides name family-wise error and false discoveries and stop; this chapter separates
      the two error-management questions, gives Bonferroni and Holm for FWER and Benjamini-Hochberg for
      FDR, and ends with a lab and exercise set - the only registered practice for the node.
    angle_detail: 'The most complete multiple-testing treatment on the shelf, and L10''s multiplicity
      node is one slide. The page map matters: family-wise error rate (p. 571) and Bonferroni/Holm (p.
      573) are the conservative classical corrections; false discovery rate (p. 564) and Benjamini-Hochberg
      (p. 581) are the modern alternative that controls a different quantity entirely. Understanding that
      FWER and FDR are different targets — not competing approximations of one target — is the conceptual
      point, and it is the kind of distinction a written exam question can turn on. Lab at p. 589, exercises
      at p. 599.'
    vault_path: material://source-islp/islp.pdf
    scope_triage: helpful-now
