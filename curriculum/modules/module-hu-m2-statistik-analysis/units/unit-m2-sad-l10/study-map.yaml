    label: Current L10 hypothesis-testing deck
    locator: lecture-slides/10_testing.pdf, PDF pp. 10-16,24
    angle: Introduces both error types and the decision tradeoff; the later p. 56 sentence reverses the
      definition of power and needs correction.
