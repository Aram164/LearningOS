    scope_triage: helpful-now
  - kind: watch
    label: StatQuest — hypothesis tests and p-values
    source_id: source-statquest
    locator: Hypothesis Testing; Null Hypothesis; p-values; Calculating p-values; One- or Two-Tailed p-values
