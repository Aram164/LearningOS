- id: stage-sad-l10-test-model
  number: 1
  title: Null model, alternative, statistic, and reference distribution
  status: pending
  objective: A test specifies a falsifiable null, an alternative, a statistic computed from the sample,
    and the statistic's distribution if the null were true.
  done_when:
  - 'Reproduce without notes: A test specifies a falsifiable null, an alternative, a statistic computed
    from the sample, and the statistic''s distribution if the null were true.'
  - Work Blatt 5, UE6, and UE7 — testing and permutation test, then the remaining 4, and record every
    miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-hypothesis-testing
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L10 hypothesis-testing deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/10_testing.pdf (65 pages) — The complete course logic from null models and
      p-values through errors/power, z/t and categorical tests, nonparametric alternatives, confidence-interval
      duality, and multiple testing.
    scope_triage: required-now
  - kind: practise
    label: Blatt 5, UE6, and UE7 — testing and permutation test
    source_id: source-sad-uebungen
    locator: exercise-slides/UE6.pdf; exercise-slides/blatt-05.pdf Aufgabe 1; exercise-slides/UE7.pdf
      slides 12–16 — Full current test setups plus the Blatt-5 permutation-test solution; useful for checking
      tails, p-value interpretation, decision wording, and nonparametric logic.
    scope_triage: required-now
  - kind: reference
    label: 2025 statistical-significance deck
    source_id: source-sad-2025-recordings
    locator: 10_statistical_significance.pdf — Same-course alternate explanation of test logic, p-values,
      and statistical significance; use after the current deck for a blocked interpretation, not as a
      separate syllabus.
    vault_path: material://source-sad-2025-recordings/10_statistical_significance.pdf
    scope_triage: reference-only
  - kind: read
    label: Fahrmeir Chapters 10–11 — hypothesis tests
    source_id: source-fahrmeir-statistik
    locator: Chapters 10–11 — The German logic/formula reference for classical tests, errors, p-values,
      categorical tests, nonparametric alternatives, and test selection.
    scope_triage: helpful-now
  - kind: practise
    label: Arbeitsbuch Chapters 10–11 — testing drills
    source_id: source-fahrmeir-arbeitsbuch
    locator: Chapters 10–11 — Fully worked German tests for building the complete H0/statistic/reference-distribution/
      rejection/p-value argument without skipping interpretation.
    scope_triage: helpful-now
  - kind: read
    label: OpenIntro Chapters 5–7 — tests by data type
    source_id: source-openintro-statistics
    locator: Chapters 5–7 selected tests — Gentle test selection and interpretation for means, proportions,
      categorical counts, and numerical comparisons, with assumptions visible alongside calculations.
    scope_triage: helpful-now
  - kind: practise
    label: Dekking — hypothesis-testing exercises
    source_id: source-dekking-mips
    locator: Hypothesis-testing selections — Broad answer-backed testing problems for independent repetition
      after the course and German exam banks.
    scope_triage: helpful-now
  - kind: read
    label: MIT 18.05 — hypothesis-testing notes and solved exams
    source_id: source-mit-1805
    locator: Hypothesis-testing notes, problem sets, and solved exams — Official test-logic notes plus
      solved exam questions for p-values, errors, mean tests, categorical tests, and interpretation.
    scope_triage: helpful-now
  - kind: reference
    label: MIT 18.650 Lectures 7–12 — tests and goodness-of-fit
    source_id: source-mit-18650
    locator: Lectures 7–12 — Rigorous testing, asymptotic, and goodness-of-fit depth after the course
