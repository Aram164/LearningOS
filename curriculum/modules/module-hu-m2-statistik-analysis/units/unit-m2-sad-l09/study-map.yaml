- id: stage-sad-l09-properties
  number: 2
  title: Bias, consistency, efficiency, and mean squared error
  status: pending
  objective: Good estimators trade systematic error and variability; MSE decomposes into variance plus
    squared bias, while consistency describes large-sample convergence.
  done_when:
