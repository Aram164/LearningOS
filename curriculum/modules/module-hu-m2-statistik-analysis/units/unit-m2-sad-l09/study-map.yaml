      — the textbooks either drill mechanically or theorise. This deck sits at the right level. Confirm
      the interval formulas and notation against the 2026 deck first.
    scope_triage: reference-only
    route_id: route-b2d9fca6647fba5c03976147
    source_id: source-sad-2025-recordings
  - kind: read
    label: Fahrmeir Chapter 9 — parameter estimation
    locator: Ch 9 §9.1 Punktschätzung, pdf pp. 383-385; §9.2 Eigenschaften von Schätzstatistiken, pdf
      pp. 386-393; §9.3 Konstruktion von Schätzfunktionen, pdf pp. 394-402; §9.4 Intervallschätzung, pdf
      pp. 403-410; Aufgaben pdf pp. 413-415
    angle: 'Estimator quality before estimator recipes: bias, consistency and efficiency are defined and
      compared in §9.2 before any interval formula appears.'
    angle_detail: L09 introduces estimator properties and confidence intervals in the same pass, which
      makes it easy to learn the interval formulas as rituals. Fahrmeir spends eight pages on Erwartungstreue,
      Konsistenz, Effizienz and MSE with worked comparisons of competing estimators BEFORE §9.4 derives
      an interval, so the interval arrives as a consequence of a sampling distribution rather than as
      a boxed formula. §9.3 covers the Maximum-Likelihood and Momenten construction methods, which is
      the bridge back to L08's MLE node. Use the German property names from here — the Klausur asks for
      'erwartungstreu', not 'unbiased'.
    vault_path: material://source-fahrmeir-statistik/statistik.pdf
    scope_triage: helpful-now
    source_id: source-fahrmeir-statistik
    route_id: route-7847d85f81696a1bf1a87cf2
  - kind: read
    label: MIT 18.05 — estimation and confidence intervals
    locator: 'Classes: Reading and In-class Materials, the ''Bootstrapping'' reading and the ''Confidence
      Intervals'' readings I-III; the corresponding problem sets with solutions'
    angle: Teaches bootstrap confidence intervals as a first-class method beside the analytic ones, with
      runnable code.
    angle_detail: Most courses mention the bootstrap; this one builds intervals with it and compares them
      against the z and t intervals on the same data. Seeing the three agree — and seeing where they disagree
      — is what turns L09's bootstrap node from a curiosity into a method with a place. The reading also
      separates the frequentist confidence interval from the Bayesian probability interval explicitly,
      which prevents the most common interpretation error.
    scope_triage: helpful-now
    source_id: source-mit-1805
    route_id: route-b574283601c1e7562e4f5071
  - kind: reference
    label: MIT 18.650 Lectures 3–5 — parametric inference
    locator: Lectures 3-5 (parametric estimation, confidence intervals, the delta method); graduate-level,
      reference only
    angle: Says what 'efficient' means precisely, via the Cramér-Rao bound that SaD's efficiency node
      alludes to without naming.
    angle_detail: 'L09 says one estimator can be more efficient than another and leaves efficiency comparative.
      18.650 gives the absolute version: there is a variance floor for unbiased estimators, and an estimator
      attaining it is efficient in a precise sense. That is satisfying and entirely optional — nothing
      in the M2 exam requires it. Come here only if the comparative statement bothered you.'
    scope_triage: reference-only
    source_id: source-mit-18650
    route_id: route-5a05efab3330c3386d0d3498
  - kind: practise
    label: Leuphana-Merz pp. 17-27 — estimation and confidence intervals
    locator: Leuphana-Merz_Statistik-2_Uebungsbuch-mit-Klausur.pdf, pp. 17-27, Aufgabenblätter 3-4
    angle: A full progression from sample functions and point estimates to mean, variance and proportion
      intervals.
    angle_detail: Page 23 begins Aufgabenblatt 4 on interval estimation and visibly distinguishes known-sigma,
      estimated-sigma and proportion regimes. This is the strongest local external practice for selecting
      the correct interval, but it does not cover the bootstrap.
    vault_path: material://source-sad-klausuren-extern/Leuphana-Merz_Statistik-2_Uebungsbuch-mit-Klausur.pdf
    scope_triage: helpful-now
    source_id: source-sad-klausuren-extern
    route_id: route-7e7b3a34bfd217be831561d1
