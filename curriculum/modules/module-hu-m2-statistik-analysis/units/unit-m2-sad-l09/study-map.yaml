- id: stage-sad-l09-standard-error
  number: 3
  title: Sampling distributions and standard errors
  status: pending
  objective: The standard error is the standard deviation of an estimator's sampling distribution and
    usually shrinks with sample size; it is not the spread of the raw data.
  done_when:
  - 'Reproduce without notes: The standard error is the standard deviation of an estimator''s sampling
    distribution and usually shrinks with sample size; it is not the spread of the raw data.'
  - 'Work Blatt 4 Aufgabe 2(c): distinguish spread of raw measurements from spread of the estimator. Defer
    bootstrap calculation in (a) to the bootstrap stage.'
