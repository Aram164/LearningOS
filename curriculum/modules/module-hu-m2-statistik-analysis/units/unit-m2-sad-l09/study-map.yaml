      — is what turns L09's bootstrap node from a curiosity into a method with a place. The reading also
      separates the frequentist confidence interval from the Bayesian probability interval explicitly,
      which prevents the most common interpretation error.
    scope_triage: helpful-now
    source_id: source-mit-1805
    route_id: route-b574283601c1e7562e4f5071
  - kind: practise
    label: Leuphana-Merz pp. 17-27 — estimation and confidence intervals
    locator: Leuphana-Merz_Statistik-2_Uebungsbuch-mit-Klausur.pdf, pp. 17-27, Aufgabenblätter 3-4
    angle: A full progression from sample functions and point estimates to mean, variance and proportion
      intervals.
    angle_detail: Page 23 begins Aufgabenblatt 4 on interval estimation and visibly distinguishes known-sigma,
      estimated-sigma and proportion regimes. This is the strongest local external practice for selecting
      the correct interval, but it does not cover the bootstrap.
    vault_path: material://source-sad-klausuren-extern/Leuphana-Merz_Statistik-2_Uebungsbuch-mit-Klausur.pdf
    scope_triage: helpful-now
    source_id: source-sad-klausuren-extern
    route_id: route-7e7b3a34bfd217be831561d1
  - kind: watch
    label: jbstatistics — t distribution and confidence intervals
    locator: '''Introduction to Confidence Intervals'' and ''Introduction to the t Distribution'', with
      the interval-construction videos that follow them'
    angle: Explains why the t-distribution has heavier tails as a consequence of estimating sigma, not
      as a property to accept.
    angle_detail: The t-distribution is usually introduced as 'use this when sigma is unknown', which
      gives no reason for its shape. The videos connect the extra uncertainty of estimating sigma to the
      heavier tails and thus to the wider interval, which makes the z-versus-t decision a reasoned one
      and much harder to get wrong under pressure.
    scope_triage: helpful-now
    source_id: source-jbstatistics
    route_id: route-d2abb9562b9f63820e94a1a4
  - kind: watch
    label: Kurzes Tutorium Statistik — Konfidenzintervalle
    locator: Die Videos 'Konfidenzintervall' und 'Konfidenzintervall berechnen'
    angle: German terminology for interval estimation — Konfidenzniveau, Vertrauensbereich, Schätzfunktion.
    angle_detail: 'L09''s German vocabulary is denser than most: erwartungstreu, konsistent, effizient,
      Stichprobenumfang, Konfidenzniveau. Having heard the words used in a worked calculation makes the
      exam phrasing readable at speed. Fahrmeir §9.4 is the print equivalent with more depth.'
    scope_triage: helpful-now
    source_id: source-kurzes-tutorium-statistik
    route_id: route-8d77189ca8ae8b94e0702afa
  - kind: watch
    label: Brandon Foltz — confidence-interval walkthroughs
    locator: '''Confidence Intervals'' parts 1-3 (≈25-30 min each)'
    angle: Spends most of a video on interpretation — what a 95% interval does and does not claim — before
      any computation.
    angle_detail: The standard misinterpretation ('there is a 95% probability the parameter is in this
      interval') is the most commonly examined conceptual point in L09, and it survives most brief treatments.
      Foltz attacks it directly and at length, with the repeated-sampling picture. Worth the time once.
    scope_triage: helpful-now
    source_id: source-brandon-foltz
    route_id: route-747ea93b061275149005b318
