- id: stage-sad-l09-data-bias
  number: 7
  title: Statistical uncertainty versus data bias
  status: pending
  objective: Narrow intervals cannot repair selection bias, measurement error, dependence, or population
    drift; the inferential model is only as credible as its sampling assumptions.
  done_when:
  - 'Reproduce without notes: Narrow intervals cannot repair selection bias, measurement error, dependence,
    or population drift; the inferential model is only as credible as its sampling assumptions.'
