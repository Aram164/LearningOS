      leaving it to inference. §2.3 (Lorenzkurve, Gini) is beyond SaD scope — skip it unless a concentration
      measure appears in an exercise. §2.4 previews the Normal density as a smoothed histogram, which
      is the picture L08 later assumes you already have.'
