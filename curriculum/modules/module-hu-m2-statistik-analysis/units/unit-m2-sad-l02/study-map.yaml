  - kind: watch
    label: zedstatistics — descriptive statistics and data types
    locator: 'Z Statistics ''Descriptive Statistics'': ''The Mean'', ''The Median'', ''The Mode'', ''Range
      and IQR (Interquartile Range)'', and ''Variance and Standard deviation'''
    angle: Explains what each summary measure hides, not only what it reports — the reason a lecture needs
      more than one of them.
    angle_detail: 'Zeltzer''s recurring move is to show two visibly different datasets with the same mean,
      or the same standard deviation, and ask what the summary failed to capture. That framing answers
      the question L02 provokes but does not address: why so many measures for one dataset. Useful before
      the Fahrmeir drill, because it gives the definitions a purpose.'
    scope_triage: helpful-now
    source_id: source-zedstatistics
    route_id: route-024e86952ae27f3fe2fd451d
  - kind: watch
    label: jbstatistics — data types, histograms, center, and spread
    locator: '''Types of Data''; ''Frequency Distributions and Histograms''; ''Mean, Median and Mode'';
      ''Variance and Standard Deviation'' (≈8 min each)'
    angle: Chalk-talk pace with every calculation written out — closest in style to a German Vorlesung
      of the same material.
    angle_detail: 'Where StatQuest is animated and mnemonic, jbstatistics is a lecturer working through
      definitions and examples at writing speed. For L02, where the content is definitional and the risk
      is convention rather than intuition, that register is the better fit: the divisor question and the
      grouped-data mean are both worked explicitly. Playlists are ordered to be watched in sequence.'
