    locator: Ch 2 complete, pdf pp. 46-125 (§2.1 Darstellungen p. 47; §2.2 Lage und Streuung p. 67; §2.3 Konzentrationsmaße
      p. 91; §2.4 Dichtekurven und Normalverteilung p. 101; Aufgaben p. 123)
    scope_triage: helpful-now
    angle: 'The definitional authority for L02: every scale, frequency, location and dispersion measure defined
      once, in German, with the divisor conventions spelled out.'
    angle_detail: 'This is the chapter L02 is compressing. It settles the two things the deck leaves implicit:
      which measures are admissible on which Skalenniveau (nominal/ordinal/metrisch, §2.1-2.2), and the n versus
      n-1 divisor question for the variance, which Fahrmeir states as a definition rather than leaving it to inference.
      §2.3 (Lorenzkurve, Gini) is beyond SaD scope — skip it unless a concentration measure appears in an exercise.
      §2.4 previews the Normal density as a smoothed histogram, which is the picture L08 later assumes you already
      have.'
  - kind: practise
    label: Arbeitsbuch Chapter 2 — descriptive-statistics drills
    source_id: source-fahrmeir-arbeitsbuch
    locator: Ch 2 Aufgaben pdf pp. 12-30, Lösungen pdf pp. 31-56
    scope_triage: helpful-now
    angle: The largest solved bank on the shelf for scales, frequencies, location and dispersion — roughly 45
      worked items.
    angle_detail: 'L02 is the lecture where the exam risk is arithmetic and convention rather than understanding:
      which measure is defined on which scale, how a class-grouped mean is computed, whether the variance divides
      by n or n-1 in this course. Volume is what fixes those, and this chapter has more solved items on exactly
      that material than anything else available. Work them with the solutions covered; the value is in the many
      small conventions, not in any single problem.'
  - kind: read
    label: OpenIntro Chapters 1–2 — descriptive foundations
    source_id: source-openintro-statistics
    locator: Ch 1 §1.2 data basics, pdf pp. 14-21; §1.3 sampling principles and strategies, pdf pp. 21-30; Ch
      2 §2.1 examining numerical data, pdf pp. 40-59; §2.2 considering categorical data, pdf pp. 60-69
    scope_triage: helpful-now
    angle: Spends ten pages on sampling design and bias, which L02 compresses into two slides and the exam still
      asks about.
    angle_detail: §1.3 names and distinguishes the sampling schemes — simple random, stratified, cluster, convenience
      — and works through what each does to representativeness, plus non-response and voluntary-response bias.
      L02's sampling node is one slide; the exam question 'why is this sample not representative' expects the
      vocabulary from this section. §2.2 is also the only treatment here that takes categorical data seriously
      as its own case with contingency tables, which is where Simpson's paradox lives.
  - kind: practise
    label: Dekking — descriptive-statistics exercise bank
    source_id: source-dekking-mips
    locator: Ch 15 §§15.2-15.5 histograms, kernel density, empirical distribution function, scatterplot, pdf pp.
      216-231; Ch 16 §§16.1-16.4, pdf pp. 238-244; exercises pdf pp. 233-237 and pp. 247-250
    scope_triage: helpful-now
    angle: Adds the empirical distribution function, which is the object that makes 'the histogram approximates
      the distribution' precise.
    angle_detail: L02 draws histograms and moves on. §15.4 introduces the empirical distribution function Fn and
      states that it converges to the true F — the formal content of the intuition that a bigger sample gives
      a better picture. That single idea is what later makes the bootstrap in L09 comprehensible rather than magical,
      so reading it now pays twice. §15.3 on kernel density estimates is outside SaD scope; skim it as context
      for why smoothed histograms exist.
  - kind: practise
    label: FAU solved exam — descriptive-statistics block
    source_id: source-fau-klausur-ws1415
    locator: FAU-Erlangen_Statistik-Klausur_WS14-15_mit-Loesungen.pdf — the descriptive-statistics questions and
      solutions
    scope_triage: helpful-now
    angle: Shows how much working a German examiner expects for a descriptive computation — usually less than
      you would write.
    angle_detail: Overwriting is a real time cost in a three-hour combined Klausur. The published solutions here
      show the expected level of detail for mean, median, quantile and variance computations, which is worth seeing
      once so that exam time is spent on the questions that need it.
  - kind: practise
    label: External German solved exams — descriptive block
    source_id: source-sad-klausuren-extern
    locator: 'materials/.../sad-klausuren-extern/: the descriptive-statistics questions in the solved papers'
    scope_triage: helpful-now
    angle: Timed practice on the most mechanical part of the syllabus, where speed is worth marks.
    angle_detail: L02's questions are the ones you should be able to answer without thinking, freeing time for
      the harder half of the paper. Bank items are the right way to measure whether that is true.
  - kind: watch
    label: jbstatistics — data types, histograms, center, and spread
    source_id: source-jbstatistics
    locator: '''Types of Data''; ''Frequency Distributions and Histograms''; ''Mean, Median and Mode''; ''Variance
      and Standard Deviation'' (≈8 min each)'
    scope_triage: helpful-now
    angle: Chalk-talk pace with every calculation written out — closest in style to a German Vorlesung of the
      same material.
    angle_detail: 'Where StatQuest is animated and mnemonic, jbstatistics is a lecturer working through definitions
      and examples at writing speed. For L02, where the content is definitional and the risk is convention rather
      than intuition, that register is the better fit: the divisor question and the grouped-data mean are both
      worked explicitly. Playlists are ordered to be watched in sequence.'
  - kind: watch
    label: Kurzes Tutorium Statistik — Grundbegriffe and Skalenniveaus
    source_id: source-kurzes-tutorium-statistik
    locator: '''Statistische Grundbegriffe''; ''Skalenniveaus''; ''Lagemaße'' und ''Streuungsmaße'''
    scope_triage: helpful-now
    angle: The Skalenniveau hierarchy in German, with the admissible-operations rule stated for each level.
    angle_detail: Which statistics are permissible on nominal, ordinal, intervall- and verhältnisskalierte data
      is a standard German exam question and is a vocabulary question as much as a conceptual one. These videos
      give the hierarchy and the rule in the exact terms used, in under half an hour total.
