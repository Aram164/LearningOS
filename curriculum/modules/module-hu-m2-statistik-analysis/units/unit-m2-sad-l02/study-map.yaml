- id: stage-sad-l02-vocabulary
  number: 1
  title: Population, sample, object, feature, and realization
  status: pending
  objective: Statistics observes feature values on sampled objects to learn about a larger population;
    each term identifies a different part of that inference problem.
  done_when:
  - 'Reproduce without notes: Statistics observes feature values on sampled objects to learn about a larger
    population; each term identifies a different part of that inference problem.'
  - Work UE2, slides 5-18 — feature types and descriptive conventions, and record every miss with the
    step it failed at.
  exam_critical: true
  concepts:
  - concept-descriptive-statistics
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L02 basic-concepts deck
    locator: lecture-slides/02_basics.pdf, PDF pp. 10-13
    angle: The current lecture's focused reading for population, sample, object, feature, and realization.
    angle_detail: Read physical PDF pages 10-13 for this stage. Printed slide labels may differ. This
      slice focuses the existing deck route; the complete lecture remains accessible through the unit
      material menu.
    scope_triage: required-now
    route_id: route-0f03e63079982eab2c3f883b
    source_id: source-sad-ss26-lectures
  - kind: practise
    label: UE2, slides 5-18 — feature types and descriptive conventions
    locator: exercise-slides/UE2.pdf, slides 5-18
    angle: Supplies the lecturer's worked distinctions between feature types and the summaries allowed
      for each scale.
    angle_detail: 'This is the current worked tutorial for the named task. Use it after an unaided attempt:
      its value is the course''s calculation order and notation, while reading it first would turn an
      exam-relevant retrieval task into passive recognition.'
    vault_path: material://source-sad-ss26-lectures/exercise-slides/UE2.pdf
    scope_triage: required-now
    source_id: source-sad-uebungen
    route_id: route-a3f76afb1ab8903d3a0a046d
  - kind: read
    label: OpenIntro Chapters 1–2 — descriptive foundations
    locator: Ch 1 §1.2 data basics, pdf pp. 14-21; §1.3 sampling principles and strategies, pdf pp. 21-30;
      Ch 2 §2.1 examining numerical data, pdf pp. 40-59; §2.2 considering categorical data, pdf pp. 60-69
    angle: Spends ten pages on sampling design and bias, which L02 compresses into two slides and the
      exam still asks about.
    angle_detail: §1.3 names and distinguishes the sampling schemes — simple random, stratified, cluster,
      convenience — and works through what each does to representativeness, plus non-response and voluntary-response
      bias. L02's sampling node is one slide; the exam question 'why is this sample not representative'
      expects the vocabulary from this section. §2.2 is also the only treatment here that takes categorical
      data seriously as its own case with contingency tables, which is where Simpson's paradox lives.
    vault_path: material://source-openintro-statistics/openintro.pdf
    scope_triage: helpful-now
    source_id: source-openintro-statistics
    route_id: route-a225112e34dbc25aa40a9926
  - kind: watch
    label: Kurzes Tutorium Statistik — Grundbegriffe and Skalenniveaus
    locator: '''Statistische Grundbegriffe''; ''Skalenniveaus''; ''Lagemaße'' und ''Streuungsmaße'''
    angle: The Skalenniveau hierarchy in German, with the admissible-operations rule stated for each level.
    angle_detail: Which statistics are permissible on nominal, ordinal, intervall- and verhältnisskalierte
      data is a standard German exam question and is a vocabulary question as much as a conceptual one.
      These videos give the hierarchy and the rule in the exact terms used, in under half an hour total.
    scope_triage: helpful-now
    source_id: source-kurzes-tutorium-statistik
    route_id: route-dd0f2161d7222612485d9b10
