      after L03.
  - kind: practise
    label: Blatt 1 and UE2 — descriptive-statistics calculations
    source_id: source-sad-uebungen
    locator: exercise-slides/Blatt1.pdf; exercise-slides/UE2.pdf
    scope_triage: required-now
    angle: Descriptive-statistics questions in the chair's own phrasing, with the tutorial's worked solutions.
    angle_detail: 'The value is calibration rather than volume: these show how much working is expected and which
      conventions the chair applies (rounding, divisor, how a boxplot is to be drawn). Fahrmeir''s Arbeitsbuch
      supplies the volume once the conventions are known.'
  - kind: read
    label: Fahrmeir Chapter 2 — univariate descriptive statistics
    source_id: source-fahrmeir-statistik
    locator: Ch 2 complete, pdf pp. 46-125 (§2.1 Darstellungen p. 47; §2.2 Lage und Streuung p. 67; §2.3 Konzentrationsmaße
      p. 91; §2.4 Dichtekurven und Normalverteilung p. 101; Aufgaben p. 123)
    scope_triage: helpful-now
    angle: 'The definitional authority for L02: every scale, frequency, location and dispersion measure defined
