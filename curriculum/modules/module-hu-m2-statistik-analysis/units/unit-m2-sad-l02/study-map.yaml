    averaging, and arithmetic operations are legitimate.'
  - Work Blatt 1 and UE2 — descriptive-statistics calculations, then the remaining 1, and record every miss with
    the step it failed at.
  exam_critical: true
  concepts:
  - concept-descriptive-statistics
  scope_triage: required-now
