  path: curriculum/modules/module-hu-m2-statistik-analysis/source-map.yaml
  provenance: operator
detours: []
shelving:
  state: none
stages:
- id: stage-sad-l02-vocabulary
  number: 1
  title: Population, sample, object, feature, and realization
  status: pending
  objective: Statistics observes feature values on sampled objects to learn about a larger population; each term
    identifies a different part of that inference problem.
  done_when:
  - 'Reproduce without notes: Statistics observes feature values on sampled objects to learn about a larger population;
    each term identifies a different part of that inference problem.'
  exam_critical: true
  concepts:
  - concept-descriptive-statistics
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L02 basic-concepts deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/02_basics.pdf, 39 slides
    scope_triage: required-now
    angle: Fixes the exact vocabulary and calculation conventions the rest of the course and the exam use.
    angle_detail: This is the deck to check whenever a definition is in dispute — including the variance divisor,
      which differs between textbooks and is settled here for this course. The Simpson's-paradox and sampling-bias
      slides at the end are conceptually the most demanding part and get the least time; OpenIntro §1.3 and §2.2
      are the elaboration. Nothing in L02 requires probability, so it can be revised independently of everything
      after L03.
  - kind: read
    label: OpenIntro Chapters 1–2 — descriptive foundations
    source_id: source-openintro-statistics
    locator: Ch 1 §1.2 data basics, pdf pp. 14-21; §1.3 sampling principles and strategies, pdf pp. 21-30; Ch
      2 §2.1 examining numerical data, pdf pp. 40-59; §2.2 considering categorical data, pdf pp. 60-69
    scope_triage: helpful-now
    angle: Spends ten pages on sampling design and bias, which L02 compresses into two slides and the exam still
      asks about.
    angle_detail: §1.3 names and distinguishes the sampling schemes — simple random, stratified, cluster, convenience
      — and works through what each does to representativeness, plus non-response and voluntary-response bias.
      L02's sampling node is one slide; the exam question 'why is this sample not representative' expects the
      vocabulary from this section. §2.2 is also the only treatment here that takes categorical data seriously
      as its own case with contingency tables, which is where Simpson's paradox lives.
  - kind: watch
    label: Kurzes Tutorium Statistik — Grundbegriffe and Skalenniveaus
    source_id: source-kurzes-tutorium-statistik
    locator: '''Statistische Grundbegriffe''; ''Skalenniveaus''; ''Lagemaße'' und ''Streuungsmaße'''
    scope_triage: helpful-now
    angle: The Skalenniveau hierarchy in German, with the admissible-operations rule stated for each level.
    angle_detail: Which statistics are permissible on nominal, ordinal, intervall- and verhältnisskalierte data
      is a standard German exam question and is a vocabulary question as much as a conceptual one. These videos
      give the hierarchy and the rule in the exact terms used, in under half an hour total.
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l02/stages/stage-sad-l02-vocabulary/notes.md
  attachments: []
  source_feedback: []
