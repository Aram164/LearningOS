id: unit-m2-sad-l03
type: unit
module_id: module-hu-m2-statistik-analysis
component_id: component-m2-sad
kind: lecture
title: SaD Lecture 03 — Correlation & Regression
order: 3
scope: Current 2026 L03 deck; paired observations and scatterplots, covariance and Pearson correlation,
  interpretation versus causation, simple least-squares regression, residuals and squared error,
  multivariate linear regression and the normal equation, gradient descent, scaling, and weight interpretation.
status: not-started
knowledge_map:
  summary: The lecture moves from describing paired variation to fitting a predictive linear relationship,
    while separating computational association from causal explanation.
  nodes:
  - id: knowledge-sad-l03-paired-data
    title: Paired data and scatterplots
    summary: Correlation is defined on corresponding measurements; scatterplots reveal direction, form,
      outliers, and nonlinearity before any coefficient is calculated.
  - id: knowledge-sad-l03-covariance
    title: Covariance and Pearson correlation
    summary: Covariance measures joint signed deviation, while Pearson normalization produces a scale-free
      coefficient in [-1,1] for linear association.
    builds_on: [knowledge-sad-l03-paired-data]
  - id: knowledge-sad-l03-interpretation
    title: Correlation is not causation
    summary: A numerical association can reflect confounding, reverse causality, selection, coincidence, or
      a real mechanism; computation alone cannot choose among these explanations.
    builds_on: [knowledge-sad-l03-covariance]
  - id: knowledge-sad-l03-simple-regression
    title: Simple linear regression and least squares
    summary: A line predicts one variable from another; residuals measure errors, and minimizing squared error
      determines slope and intercept.
    builds_on: [knowledge-sad-l03-covariance]
  - id: knowledge-sad-l03-multivariate
    title: Multivariate linear regression and the design matrix
    summary: Several predictors become columns of a matrix, one parameter vector produces predictions, and
      the normal equation expresses the closed-form least-squares solution.
    builds_on: [knowledge-sad-l03-simple-regression]
  - id: knowledge-sad-l03-gradient-descent
    title: Gradient descent as an alternative optimizer
    summary: Iterative updates follow the negative loss gradient; learning rate, initialization, scaling, and
      convergence determine whether the fitted parameters are reached reliably.
    builds_on: [knowledge-sad-l03-simple-regression]
  - id: knowledge-sad-l03-scaling-weights
    title: Scaling, coefficient interpretation, and model limits
    summary: Feature units change coefficient magnitudes and optimization geometry; weights require context,
      and linear fit quality does not by itself establish generalization or causality.
    builds_on: [knowledge-sad-l03-multivariate, knowledge-sad-l03-gradient-descent]
