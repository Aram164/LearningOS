- id: stage-sad-l03-covariance
  number: 2
  title: Covariance and Pearson correlation
  status: pending
  objective: Covariance measures joint signed deviation, while Pearson normalization produces a scale-free
    coefficient in [-1,1] for linear association.
  done_when:
  - 'Reproduce without notes: Covariance measures joint signed deviation, while Pearson normalization
    produces a scale-free coefficient in [-1,1] for linear association.'
  - Work Blatt 1, Aufgabe 2 — correlation and simple regression, then the remaining 5, and record every
    miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-correlation
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L03 correlation and regression deck
    locator: lecture-slides/03_correlation_regression.pdf, PDF pp. 5-9
    angle: Moves from a football covariance calculation to Pearson normalization and a Cauchy–Schwarz
      bound.
    angle_detail: Use the corrected divisor n−1 on p. 6 consistently. On p. 9, track the centered vectors
      and their normalization; the essential bound is |a·b| ≤ ||a|| ||b||. Pearson r requires nonzero
      standard deviations.
    scope_triage: required-now
    route_id: route-915c0c30301715706f857321
    source_id: source-sad-ss26-lectures
