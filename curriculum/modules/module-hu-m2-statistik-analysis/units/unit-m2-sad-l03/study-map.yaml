    angle_detail: Kelleher's treatment of least squares is unusual in starting from the shape of the error
      function over the parameter space — a bowl, with the fitted line at its bottom — before any update
      rule. Once that surface is in view, gradient descent is obviously a descent and the learning rate
      is obviously a step size, which is the intuition L03 states in words. The chapter also covers multivariable
      weights consistently with the deck's notation.
