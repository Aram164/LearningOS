    angle: Makes the design matrix a transformation rather than a table, which is what L03's multivariate
      notation assumes.
    angle_detail: L03 moves from a single predictor to a design matrix and a normal equation in a few
      slides, and that jump silently assumes matrix-vector multiplication is a familiar operation with
      a geometric meaning. These episodes supply exactly that meaning — a matrix as a transformation,
      multiplication as composition, the dot product as projection. The projection reading of the dot
      product in episode 9 is what later makes least squares recognisable as an orthogonal projection.
    scope_triage: helpful-now
