    angle: 'Adds the inferential layer L03 omits: standard errors, t-statistics and confidence intervals
      for the fitted coefficients.'
    angle_detail: L03 fits a line and stops; ISLP fits the same line and then asks whether the slope is
      distinguishable from zero. That question is not examinable in L03 — it belongs to L10 — but knowing
      it exists changes how you read a regression output, and it is the bridge between the module's two
      halves. §3.3 covers the practical issues (collinearity, non-linearity, outliers) that L03's model-limits
      node names without elaborating. The Regression Bridge note in this repository already maps which
