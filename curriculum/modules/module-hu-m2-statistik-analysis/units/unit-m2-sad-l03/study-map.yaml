    route_id: route-e958371305abdd06a667a4e2
    angle_detail: The current sheet’s Tabelle 2 starts at gold 1885 and silver 21.80. In (b), Y is silver
      and X is gold, so the requested prediction is X=f(Y); reversing the regression is not the same as
