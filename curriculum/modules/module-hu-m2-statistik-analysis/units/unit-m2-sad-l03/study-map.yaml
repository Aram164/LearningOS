    label: Geron Ch 4 - the normal equation and gradient descent side by side
    locator: Chapter 4, pp. 139-180 (closed-form solution p. 139; gradient descent p. 140; normal equation
      p. 142; learning rate p. 146; feature scaling p. 148)
    angle: L03 presents the closed-form normal equation and gradient descent as two routes to the same
      fit; this chapter runs both on the same data, shows what the learning rate does to convergence and
      why unscaled features distort the descent path - the two claims the deck makes without demonstration.
    angle_detail: 'Ch 4 is where L03''s two optimisation routes stop being abstract. The closed-form normal
      equation and gradient descent are implemented on the same data, and the chapter then shows what
      actually differs between them in practice: the normal equation''s cubic cost in the number of features
      against gradient descent''s sensitivity to feature scaling and learning rate. The scaling demonstration
      on p. 148 is the concrete version of L03''s scaling-weights node — two elongated and two circular
