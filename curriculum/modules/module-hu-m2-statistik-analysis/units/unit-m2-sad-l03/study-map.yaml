    angle: Correlation and least squares derived from the descriptive side only — no random variables,
      no inference, which is exactly L03's standpoint.
    angle_detail: Most books introduce regression after probability and immediately talk about errors
      as random variables. Fahrmeir Ch 3 is still in the descriptive half of the book, so the Kleinste-Quadrate
      line is derived as a purely geometric fit to a scatterplot — the same standpoint as L03, which also
      has no probability yet. §3.5 is the short, sharp treatment of Scheinkorrelation and confounding
      that the lecture states in one slide. It does NOT cover multivariate regression in matrix form or
      gradient descent; for those parts of L03 use ISLP §3.2 and Géron Ch 4.
    vault_path: material://source-fahrmeir-statistik/statistik.pdf
    scope_triage: helpful-now
  - kind: practise
    label: Arbeitsbuch Chapter 3 — correlation and regression drills
    locator: Ch 3 Aufgaben pdf pp. 57-66, Lösungen pdf pp. 67-82
    angle: Correlation and regression by hand, including the contingency-table measures the lecture mentions
      but never drills.
    angle_detail: Computing r and a least-squares line from a small table by hand is a distinct skill
      from understanding them, and it is the one the Klausur can test under time pressure. These items
      are sized for that. The chapter also drills the Kontingenztafel association measures from Fahrmeir
      §3.2, which L03 does not cover but the exam's descriptive half occasionally reaches — treat those
      as optional unless a past paper shows otherwise.
    vault_path: material://source-fahrmeir-arbeitsbuch/arbeitsbuch.pdf
    scope_triage: helpful-now
  - kind: read
    label: ISLP Chapter 3 — statistical regression bridge
    locator: Ch 3 Linear Regression, pdf pp. 78-143 (§3.1 simple linear regression p. 79; §3.2 multiple
      linear regression p. 87; §3.3 other considerations p. 98); read alongside the repository's Regression
      Bridge note §§2, 4 and 7
    angle: 'Adds the inferential layer L03 omits: standard errors, t-statistics and confidence intervals
      for the fitted coefficients.'
    angle_detail: L03 fits a line and stops; ISLP fits the same line and then asks whether the slope is
      distinguishable from zero. That question is not examinable in L03 — it belongs to L10 — but knowing
      it exists changes how you read a regression output, and it is the bridge between the module's two
      halves. §3.3 covers the practical issues (collinearity, non-linearity, outliers) that L03's model-limits
      node names without elaborating. The Regression Bridge note in this repository already maps which
      ISLP sections correspond to which SaD slides.
    vault_path: material://source-islp/islp.pdf
    scope_triage: helpful-now
  - kind: read
    label: Bendersky — derivation of the normal equation
    locator: The complete article 'Derivation of the Normal Equation for linear regression' (eli.thegreenplace.net),
      both the calculus and the linear-algebra derivations
    angle: Derives the same closed-form solution twice — once by calculus, once by projection — which
      is the connection L03 leaves implicit.
    angle_detail: 'L03 states the normal equation and moves to gradient descent. This article shows where
      it comes from: set the gradient of the squared-error objective to zero and solve, then separately,
      project the target vector onto the column space of the design matrix and get the identical result.
      Seeing both is what turns the formula from something to memorise into something with two independent
      justifications. Assumes matrix notation, so read 3Blue1Brown''s episodes 1-4 and 9 first if that
      is shaky.'
    scope_triage: helpful-now
  - kind: read
    label: Setosa — ordinary least squares, interactive
    locator: 'The single interactive page ''Ordinary Least Squares Regression: explained visually'' (setosa.io)
      — the residual-square and leverage widgets'
    angle: Lets you move a point and watch the fitted line respond, which shows leverage and influence
      in seconds rather than in prose.
    angle_detail: The page draws the squared residuals as actual squares and totals their area, so 'least
      squares' becomes a visible minimisation rather than a name. Dragging an outlier then shows the line
      swinging — the leverage effect that OpenIntro §8.3 describes in text and that L03's model-limits
      node states abstractly. Ten minutes, no installation, and it makes the criterion memorable in a
      way no derivation does.
    scope_triage: helpful-now
  - kind: read
    label: MML Ch 9 — linear regression from the mathematical side
    locator: 'mml-book.pdf Ch 9 Linear Regression p. 295: §9.1 Problem Formulation p. 297, §9.2 Parameter
      Estimation p. 298 (maximum likelihood and MAP); read with Ch 5 Vector Calculus p. 145, §5.2 Partial
      Differentiation and Gradients p. 152, for the notation'
    angle: Derives least squares as maximum likelihood under Gaussian noise from the start, so L03 and
      L08 are one derivation rather than two lectures.
    angle_detail: 'Derives least squares as maximum likelihood under Gaussian noise from the first page
      of §9.2, rather than presenting the squared-error objective and justifying it later. That matters
      across two lectures: L03 introduces the objective and L08 introduces the Gaussian likelihood, and
      this makes them one derivation instead of two facts. It is the most mathematically demanding route
      on this stage and assumes the linear algebra of Ch 2-3; §5.2 is the minimum notation to read it
      with.'
    scope_triage: helpful-now
  - kind: read
    label: OpenIntro — correlation and linear regression
    locator: Ch 8 introduction to linear regression, pdf pp. 303-340 (§8.1 fitting a line, residuals,
      and correlation p. 305; §8.2 least squares regression p. 317; §8.3 types of outliers p. 328; §8.4
      inference for linear regression p. 331)
    angle: Makes residual plots a first-class diagnostic, so a fitted line is something you check rather
      than something you report.
    angle_detail: §8.1 introduces residuals before it introduces the least-squares criterion, and §8.3
      catalogues the ways a single point can dominate a fit — leverage, influence, outliers — with pictures.
      L03 derives the line and stops; the model-limits node at the end of the lecture is exactly this
      material, unelaborated. Reading §8.3 is the cheapest protection against the exam question that shows
      a scatterplot and asks whether the reported r is trustworthy. §8.4's inference is L10 material —
      leave it until then.
    vault_path: material://source-openintro-statistics/openintro.pdf
    scope_triage: helpful-now
  - kind: practise
    label: Dekking — correlation and regression exercises
    locator: Ch 10 covariance and correlation, pdf pp. 144-159 (covariance p. 147; correlation coefficient
      p. 150; exercises p. 153); Ch 22 the method of least squares, pdf pp. 332-343 (§22.3 relation with
      maximum likelihood p. 338; exercises p. 340); Ch 17 §17.4 the linear regression model, pdf pp. 262-264
    angle: 'Contains the derivation L03 does not do: least squares is exactly maximum likelihood when
      the errors are Normal.'
    angle_detail: §22.3 is a two-page proof that minimising the sum of squared residuals and maximising
      the likelihood under Normal errors are the same optimisation. L03 presents least squares as a reasonable
      choice and L08 presents MLE separately; this is the join between them, and it answers the question
      the lecture invites but never asks — why squares and not absolute deviations. Requires L08's likelihood
      material to read, so this is a return visit, not a first pass. Ch 10 is the probabilistic covariance
      to set beside L03's descriptive one.
    vault_path: material://source-dekking-mips/dekking.pdf
    scope_triage: helpful-now
  - kind: read
    label: Ng — linear regression and gradient descent lectures
    locator: 'Machine Learning Specialization, Course 1 ''Supervised Machine Learning: Regression and
      Classification'', Week 1 ''Linear regression model'' and Week 2 ''Multiple linear regression'',
      ''Feature scaling'', and ''Choosing the learning rate'''
    angle: Spends a whole lecture on the learning rate alone — too large, too small, and how to tell which
      you have.
    angle_detail: L03 introduces gradient descent with the update rule and a remark that the step size
      matters. Ng devotes separate segments to diagnosing a bad learning rate from the cost curve, and
      to why feature scaling changes how many steps are needed. Those are the two practical facts that
      make gradient descent usable rather than merely definable, and they are the content of L03's scaling-weights
      node.
    scope_triage: helpful-now
  - kind: practise
    label: HS Harz pp. 6-7 — Kendall association and linear regression
    locator: HS-Harz_Statistik-I_Probeklausur_mit-Loesungen.pdf, pp. 6-7, Aufgabenteile IV-V
    angle: Pairs an association measure with a fitted line and R² interpretation on one dataset.
    angle_detail: This is the strongest external L03 item because the prompt, computation and interpretation
      are visible together and the solution is printed immediately below. Kendall's tau itself is outside
      the current lecture; use that part only as an association contrast, then work the linear-regression
      section in full.
    vault_path: material://source-sad-klausuren-extern/HS-Harz_Statistik-I_Probeklausur_mit-Loesungen.pdf
    scope_triage: helpful-now
  - kind: watch
    label: StatQuest — Pearson correlation, least squares, and gradient descent
    locator: '''Pearson''s Correlation, Clearly Explained''; ''Linear Regression, Clearly Explained''
      (least squares); ''Gradient Descent, Step-by-Step'' (≈20 min)'
    angle: Steps a gradient-descent run through by hand, one iteration at a time, with the numbers on
      screen.
    angle_detail: L03 introduces gradient descent as an alternative optimiser and shows the update rule.
      The step-by-step video actually performs the iterations on a two-parameter regression, so the abstract
      rule becomes a visible sequence of numbers converging. It also shows what a learning rate that is
      too large does, which is the intuition behind every later discussion of step size. The correlation
      video is the one to watch if the difference between covariance and correlation is what is unclear.
    scope_triage: helpful-now
