id: study-map-m2-sad-l03
type: study-map
plan_template_version: 1
unit_id: unit-m2-sad-l03
status: not-started
current_stage: stage-sad-l03-paired-data
source_plan:
  path: curriculum/modules/module-hu-m2-statistik-analysis/source-map.yaml
  provenance: operator
detours: []
shelving:
  state: none
stages:
- id: stage-sad-l03-paired-data
  number: 1
  title: Paired data and scatterplots
  status: pending
  objective: Correlation is defined on corresponding measurements; scatterplots reveal direction, form, outliers,
    and nonlinearity before any coefficient is calculated.
  done_when:
  - 'Reproduce without notes: Correlation is defined on corresponding measurements; scatterplots reveal direction,
    form, outliers, and nonlinearity before any coefficient is calculated.'
  - Work UE2 and Blatt 2 — correlation and regression practice, and record every miss with the step it failed
    at.
  exam_critical: true
  concepts:
  - concept-correlation
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L03 correlation and regression deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/03_correlation_regression.pdf, 48 slides
    scope_triage: required-now
    angle: The course's own path from a scatterplot to the normal equation and gradient descent, in one sitting.
    angle_detail: 'The deck covers an unusual amount of ground for one lecture: descriptive correlation, simple
      least squares, the multivariate design matrix, the closed-form normal equation and an iterative optimiser.
      The compression is real, and the two places it shows are the matrix notation (assumed) and gradient descent
      (stated, not run). Géron Ch 4 and 3Blue1Brown''s linear-algebra episodes are the routes that repair those
      two specifically. Everything here is examinable.'
  - kind: practise
    label: UE2 and Blatt 2 — correlation and regression practice
    source_id: source-sad-uebungen
    locator: exercise-slides/UE2.pdf, correlation and regression section; exercise-slides/blatt-02.pdf
    scope_triage: required-now
    angle: Shows whether regression is examined by hand computation or by interpretation — which the deck alone
      does not reveal.
    angle_detail: L03 covers far more than can be examined by hand in a combined three-hour paper, so the exercises
      are the evidence of where the emphasis actually falls. Read them before deciding how much time to spend
      on the matrix and gradient-descent material.
  - kind: read
    label: Fahrmeir Chapter 3 — multivariate description and regression
    source_id: source-fahrmeir-statistik
    locator: Ch 3 §3.4 Zusammenhangsmaße bei metrischen Merkmalen, pdf pp. 151-163; §3.5 Korrelation und Kausalität,
      pdf pp. 164-167; §3.6 Regression, pdf pp. 168-182; Aufgaben pdf pp. 189-192
    scope_triage: helpful-now
    angle: Correlation and least squares derived from the descriptive side only — no random variables, no inference,
      which is exactly L03's standpoint.
    angle_detail: Most books introduce regression after probability and immediately talk about errors as random
      variables. Fahrmeir Ch 3 is still in the descriptive half of the book, so the Kleinste-Quadrate line is
      derived as a purely geometric fit to a scatterplot — the same standpoint as L03, which also has no probability
      yet. §3.5 is the short, sharp treatment of Scheinkorrelation and confounding that the lecture states in
      one slide. It does NOT cover multivariate regression in matrix form or gradient descent; for those parts
      of L03 use ISLP §3.2 and Géron Ch 4.
  - kind: read
    label: OpenIntro — correlation and linear regression
    source_id: source-openintro-statistics
    locator: Ch 8 introduction to linear regression, pdf pp. 303-340 (§8.1 fitting a line, residuals, and correlation
      p. 305; §8.2 least squares regression p. 317; §8.3 types of outliers p. 328; §8.4 inference for linear regression
      p. 331)
    scope_triage: helpful-now
    angle: Makes residual plots a first-class diagnostic, so a fitted line is something you check rather than
      something you report.
    angle_detail: §8.1 introduces residuals before it introduces the least-squares criterion, and §8.3 catalogues
      the ways a single point can dominate a fit — leverage, influence, outliers — with pictures. L03 derives
      the line and stops; the model-limits node at the end of the lecture is exactly this material, unelaborated.
      Reading §8.3 is the cheapest protection against the exam question that shows a scatterplot and asks whether
      the reported r is trustworthy. §8.4's inference is L10 material — leave it until then.
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l03/stages/stage-sad-l03-paired-data/notes.md
  attachments: []
  source_feedback: []
