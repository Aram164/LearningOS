    label: Arbeitsbuch Chapter 3 — correlation and regression drills
    source_id: source-fahrmeir-arbeitsbuch
    locator: Ch 3 Aufgaben pdf pp. 57-66, Lösungen pdf pp. 67-82
    scope_triage: helpful-now
    angle: Correlation and regression by hand, including the contingency-table measures the lecture mentions but
      never drills.
    angle_detail: Computing r and a least-squares line from a small table by hand is a distinct skill from understanding
      them, and it is the one the Klausur can test under time pressure. These items are sized for that. The chapter
      also drills the Kontingenztafel association measures from Fahrmeir §3.2, which L03 does not cover but the
      exam's descriptive half occasionally reaches — treat those as optional unless a past paper shows otherwise.
  - kind: read
    label: OpenIntro — correlation and linear regression
    source_id: source-openintro-statistics
    locator: Ch 8 introduction to linear regression, pdf pp. 303-340 (§8.1 fitting a line, residuals, and correlation
      p. 305; §8.2 least squares regression p. 317; §8.3 types of outliers p. 328; §8.4 inference for linear regression
      p. 331)
    scope_triage: helpful-now
    angle: Makes residual plots a first-class diagnostic, so a fitted line is something you check rather than
      something you report.
    angle_detail: §8.1 introduces residuals before it introduces the least-squares criterion, and §8.3 catalogues
      the ways a single point can dominate a fit — leverage, influence, outliers — with pictures. L03 derives
      the line and stops; the model-limits node at the end of the lecture is exactly this material, unelaborated.
      Reading §8.3 is the cheapest protection against the exam question that shows a scatterplot and asks whether
      the reported r is trustworthy. §8.4's inference is L10 material — leave it until then.
  - kind: practise
    label: Dekking — correlation and regression exercises
    source_id: source-dekking-mips
    locator: Ch 10 covariance and correlation, pdf pp. 144-159 (covariance p. 147; correlation coefficient p.
      150; exercises p. 153); Ch 22 the method of least squares, pdf pp. 332-343 (§22.3 relation with maximum
      likelihood p. 338; exercises p. 340); Ch 17 §17.4 the linear regression model, pdf pp. 262-264
    scope_triage: helpful-now
    angle: 'Contains the derivation L03 does not do: least squares is exactly maximum likelihood when the errors
      are Normal.'
    angle_detail: §22.3 is a two-page proof that minimising the sum of squared residuals and maximising the likelihood
      under Normal errors are the same optimisation. L03 presents least squares as a reasonable choice and L08
      presents MLE separately; this is the join between them, and it answers the question the lecture invites
      but never asks — why squares and not absolute deviations. Requires L08's likelihood material to read, so
      this is a return visit, not a first pass. Ch 10 is the probabilistic covariance to set beside L03's descriptive
      one.
  - kind: practise
    label: FAU solved exam — correlation item
    source_id: source-fau-klausur-ws1415
    locator: FAU-Erlangen_Statistik-Klausur_WS14-15_mit-Loesungen.pdf — the correlation question with solution
    scope_triage: helpful-now
    angle: 'Correlation asked as an exam item: compute, then interpret in one sentence.'
    angle_detail: The two-part shape — a number and a sentence — is standard and the sentence carries marks. The
      published solution shows what an acceptable interpretation sentence looks like, which is more useful than
      another computation drill.
  - kind: practise
    label: External German solved exams — correlation/regression block
    source_id: source-sad-klausuren-extern
    locator: 'materials/.../sad-klausuren-extern/: the correlation and regression questions in the solved papers'
    scope_triage: helpful-now
    angle: External correlation and regression items, useful for spotting the interpretation questions that follow
      the computation.
    angle_detail: Most external papers pair a correlation computation with an interpretation sentence, which matches
      this course's likely form. Watch for items that assume inference on the regression slope — that is L10 material
      and out of scope for L03.
  - kind: watch
    label: StatQuest — Pearson correlation, least squares, and gradient descent
    source_id: source-statquest
    locator: '''Pearson''s Correlation, Clearly Explained''; ''Linear Regression, Clearly Explained'' (least squares);
      ''Gradient Descent, Step-by-Step'' (≈20 min)'
    scope_triage: helpful-now
    angle: Steps a gradient-descent run through by hand, one iteration at a time, with the numbers on screen.
    angle_detail: L03 introduces gradient descent as an alternative optimiser and shows the update rule. The step-by-step
      video actually performs the iterations on a two-parameter regression, so the abstract rule becomes a visible
      sequence of numbers converging. It also shows what a learning rate that is too large does, which is the
      intuition behind every later discussion of step size. The correlation video is the one to watch if the difference
      between covariance and correlation is what is unclear.
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l03/stages/stage-sad-l03-covariance/notes.md
  attachments: []
  source_feedback: []
