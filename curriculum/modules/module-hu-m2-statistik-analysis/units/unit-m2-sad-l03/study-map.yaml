  title: Covariance and Pearson correlation
  status: pending
  objective: Covariance measures joint signed deviation, while Pearson normalization produces a scale-free
    coefficient in [-1,1] for linear association.
  done_when:
  - 'Reproduce without notes: Covariance measures joint signed deviation, while Pearson normalization
    produces a scale-free coefficient in [-1,1] for linear association.'
  - Work Blatt 1, Aufgabe 2 — correlation and simple regression, then the remaining 5, and record every
    miss with the step it failed at.
