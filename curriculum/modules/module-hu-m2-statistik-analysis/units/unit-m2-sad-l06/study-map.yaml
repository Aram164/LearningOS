- id: stage-sad-l06-concentration
  number: 7
  title: Chebyshev bounds and the law of large numbers
  status: pending
  objective: Chebyshev gives a distribution-free tail bound, and the law of large numbers explains why
    sample averages stabilize as data accumulate.
  done_when:
  - 'Reproduce without notes: Chebyshev gives a distribution-free tail bound, and the law of large numbers
    explains why sample averages stabilize as data accumulate.'
  - Work Übungsblatt 3, Aufgabe 3 — mixture moments and the LLN, then the remaining 3, and record every
    miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-law-of-large-numbers
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L06 random-variables deck
    locator: lecture-slides/06_random_variables.pdf, PDF pp. 44-50,57-60
    angle: Derives a finite-variance probability bound and then convergence in probability.
    angle_detail: 'Read physical PDF pages 44-50,57-60. Use c>0 and finite variance: P(|X-μ|≥c)≤min(1,σ²/c²).
      For the mean substitute σ²/n. The bound concerns a tail event under a model, not the probability
      that a model generated one observed value. Stabilization need not be monotone along one sample path.
      Page 60 states pointwise empirical-CDF convergence; do not silently read it as the stronger uniform
      Glivenko–Cantelli theorem.'
    scope_triage: required-now
    route_id: route-a2e6fc0559d93d22efbe732a
