- id: stage-sad-l06-transformations
  number: 3
  title: Functions and transformations of random variables
  status: pending
  objective: A transformation g(X) changes the possible values and distribution; probabilities and moments
    must be recomputed from the mapping rather than by treating X as a fixed number.
  done_when:
  - 'Reproduce without notes: A transformation g(X) changes the possible values and distribution; probabilities
    and moments must be recomputed from the mapping rather than by treating X as a fixed number.'
  - Work Übungsblatt 3, Aufgabe 1 — PMF, transformation, expectation and variance, then the remaining
    4, and record every miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-random-variable
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L06 random-variables deck
    locator: lecture-slides/06_random_variables.pdf, PDF pp. 28-30,39
    angle: Computes moments of a function directly from the original distribution.
    angle_detail: Read physical PDF pages 28-30,39. Page 28 explicitly states LOTUS. Pages 29–30 call
      g a per-error cost but compute E[g(X)]; a total daily cost under that wording is Xg(X). With the
      displayed table E[g(X)]=3.0467 and E[Xg(X)]=4.6733. Decide which quantity the model represents before
      calculating. For many-to-one transformations such as |X|, combine all original outcomes mapping
      to the same value; use Blatt 3 Aufgabe 1(c).
    scope_triage: required-now
    route_id: route-a2e6fc0559d93d22efbe732a
    source_id: source-sad-ss26-lectures
    vault_path: material://source-sad-ss26-lectures/lecture-slides/06_random_variables.pdf
