- id: stage-sad-l06-variance-covariance
  number: 5
  title: Variance, standard deviation, and covariance
  status: pending
  objective: Variance measures squared deviation from expectation, affine scaling squares the multiplier,
    and covariance records joint variation needed for sums and sample means.
  done_when:
  - 'Reproduce without notes: Variance measures squared deviation from expectation, affine scaling squares
    the multiplier, and covariance records joint variation needed for sums and sample means.'
  - Work Übungsblatt 3, Aufgabe 1 — PMF, transformation, expectation and variance, then the remaining
    7, and record every miss with the step it failed at.
