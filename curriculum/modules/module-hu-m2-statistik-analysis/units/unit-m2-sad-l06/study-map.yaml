  id: stage-sad-l06-scope
  title: Build the random-variable language from the current deck
  objective: Follow L06 in deck order and distinguish outcome, random variable, realization, PMF/PDF,
    and CDF before calculating moments.
  done_when:
  - Define every object in words and notation; convert a finite probability table into its CDF.
  - Compute and interpret one transformed random variable without confusing values with probabilities.
  estimate_minutes: 75
  exam_critical: true
  scope_triage: required-now
