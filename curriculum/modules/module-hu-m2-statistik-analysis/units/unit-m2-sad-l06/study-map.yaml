- id: stage-sad-l06-expectation
  number: 4
  title: Expected value and linearity
  status: pending
  objective: Expectation is a probability-weighted long-run average; linearity holds without independence
    and extends from X to functions and sums of random variables.
  done_when:
  - 'Reproduce without notes: Expectation is a probability-weighted long-run average; linearity holds
    without independence and extends from X to functions and sums of random variables.'
  - Work Übungsblatt 3, Aufgabe 1 — PMF, transformation, expectation and variance, then the remaining
    7, and record every miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-expected-value
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L06 random-variables deck
    locator: lecture-slides/06_random_variables.pdf, PDF pp. 26-32
    angle: Proves linearity by summing the joint probabilities, without assuming independence.
    angle_detail: Read physical PDF pages 26-32. The dice mean 3.5 need not be a possible realization.
      Page 28 already gives E[g(X)], and p. 31 proves linearity; p. 32 separately uses independence for
      E[XY]=E[X]E[Y]. Keep finite/existing expectations in view. The repair-cost caveat is given at the
      transformations stage.
    scope_triage: required-now
    route_id: route-a2e6fc0559d93d22efbe732a
