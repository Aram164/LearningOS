    label: Harvard Stat 110 Units 3–4 — RVs and expectation
    source_id: source-stat110
    locator: Units 3–4 — Full lecture treatment of random variables, expectation, indicators, and variance
      for derivational depth beyond L06.
    scope_triage: reference-only
