- id: stage-sad-l06-random-variable
  number: 1
  title: Random variables and realizations
  status: pending
  objective: A random variable maps outcomes to numbers; the variable, a realized value, and the underlying
    random experiment are distinct objects.
  done_when:
  - 'Reproduce without notes: A random variable maps outcomes to numbers; the variable, a realized value,
    and the underlying random experiment are distinct objects.'
  exam_critical: true
  concepts:
  - concept-random-variable
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L06 random-variables deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/06_random_variables.pdf (60 pages) — The scope authority for random-variable
      language, PMF/PDF/CDF, moments, covariance, sample-mean variance, Chebyshev, and the law of large
      numbers.
    scope_triage: required-now
  - kind: reference
    label: 2025 random-variables and expected-values pair
    source_id: source-sad-2025-recordings
    locator: 05_random_variables.pdf; 06_expected_values.pptx-1.pdf — Splits random-variable definitions
      and expectation/moment calculations across two older decks, providing more same-course examples
      than the combined current treatment.
    scope_triage: reference-only
  - kind: read
    label: Fahrmeir Chapters 5–7 — random variables and moments
    source_id: source-fahrmeir-statistik
    locator: Chapters 5–7 selected sections — The German rigor home for discrete/continuous RVs, distribution
      functions, expectation, variance, covariance, Chebyshev, and large-sample behavior.
    scope_triage: helpful-now
  - kind: read
    label: Blitzstein Chapters 3–4 and 10 — RVs and expectation
    source_id: source-blitzstein-hwang
    locator: Chapters 3–4; selected Chapter 10 sections — The strongest story/proof explanation of random
      variables, expectation, indicator methods, and transformations; Ch 10 is used only for matching
      moment depth.
    scope_triage: helpful-now
  - kind: reference
    label: Ross — random-variable theory
    source_id: source-ross-first-course
    locator: Random variables and expectation chapters — Formal discrete/continuous variable, distribution-function,
      expectation, variance, and joint-variable depth beyond the course requirements.
    scope_triage: reference-only
  - kind: read
    label: OpenIntro Chapter 4 — distribution bridge
    source_id: source-openintro-statistics
    locator: Chapter 4 selections — Gentle transition from probability to random variables, expectation,
      variability, and sampling distributions without the full formal depth of Fahrmeir.
    scope_triage: helpful-now
