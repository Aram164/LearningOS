- id: stage-sad-l06-sample-mean
  number: 6
  title: IID samples and the random sample mean
  status: pending
  objective: The sample mean is itself random; under IID sampling its expectation is the population mean
    and its variance shrinks as sigma squared divided by n.
  done_when:
  - 'Reproduce without notes: The sample mean is itself random; under IID sampling its expectation is
    the population mean and its variance shrinks as sigma squared divided by n.'
  - Work Übungsblatt 3, Aufgabe 3 — mixture moments and the LLN, then the remaining 1, and record every
    miss with the step it failed at.
  exam_critical: true
