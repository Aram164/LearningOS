- id: stage-sad-l06-distribution-functions
  number: 2
  title: PMF, density, and CDF
  status: pending
  objective: Discrete mass and continuous density assign probability differently, while the cumulative
    distribution function uniformly represents P(X less than or equal to x).
  done_when:
  - 'Reproduce without notes: Discrete mass and continuous density assign probability differently, while
    the cumulative distribution function uniformly represents P(X less than or equal to x).'
  - Work Übungsblatt 3, Aufgabe 1 — PMF, transformation, expectation and variance, then the remaining
    6, and record every miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-random-variable
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L06 random-variables deck
    locator: lecture-slides/06_random_variables.pdf, PDF pp. 9-23
    angle: Relates PMF jumps and density integrals through the same CDF.
    angle_detail: Read physical PDF pages 9-23. Use F(x)=P(X≤x), including equality for discrete variables.
      On p. 15 the CDF integral must end at x, not +∞; p. 17 gives the correct limit. On p. 20 the uniform
      CDF is 1 above b, and the exponential expression is a density only when λ=k>0; its CDF is 1-exp(-kx).
      On p. 21 continuous U(0,10) gives F(x)=x/10 on [0,10], hence P(X≤3)=0.3 and P(X>4)=0.6. The displayed
      0.1(x+1) mixes a discrete model with a continuous one. Density need not be continuous for point
      probabilities to vanish.
    scope_triage: required-now
    route_id: route-a2e6fc0559d93d22efbe732a
    source_id: source-sad-ss26-lectures
    vault_path: material://source-sad-ss26-lectures/lecture-slides/06_random_variables.pdf
