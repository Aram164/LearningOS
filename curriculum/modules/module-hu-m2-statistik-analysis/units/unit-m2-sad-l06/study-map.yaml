  id: stage-sad-l06-moments
  title: Derive expectation, variance, covariance, sample-mean variance, and Chebyshev
  objective: Calculate E[X], E[g(X)], Var(X), Cov(X,Y), E[aX+b], Var(aX+b), and Var of a sample mean from
    definitions.
  done_when:
  - Solve a five-row probability-table problem for E, Var, and standard deviation by hand.
  - Explain why Var(X-bar)=Var(X)/n under IID assumptions and apply one Chebyshev bound.
  estimate_minutes: 100
  exam_critical: true
  scope_triage: required-now
