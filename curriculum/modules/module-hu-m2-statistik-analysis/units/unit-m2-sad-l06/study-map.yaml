    label: Kurzes Tutorium Statistik — Zufallsvariablen and Erwartungswert
    source_id: source-kurzes-tutorium-statistik
    locator: Zufallsvariablen; Erwartungswert; Varianz — German terminology-first refresh for random variables,
      expectation, and variance.
    scope_triage: helpful-now
