- id: stage-m2-sad-s08-testing
  title: SaD.8 — hypothesis tests, p-values, errors, and power (L10)
  status: pending
  objective: Run the entire test workflow with correct assumptions and language, including z/t/chi-square
    and permutation logic, error types, power, multiple testing, and CI-test duality.
  done_when:
  - Translate a claim into one- or two-sided H0/H1 and choose z, t, chi-square, or permutation reasoning
    with justification.
  - 'Complete one z or t test end-to-end: statistic, reference distribution, rejection rule or p-value,
    decision, and contextual conclusion.'
  - Interpret a p-value without treating it as P(H0 true) and distinguish Type I, Type II, alpha, beta,
    and power.
  - Run one 2x2 chi-square calculation and explain expected counts and independence.
  - Demonstrate CI-test duality on one two-sided mean example and explain the multiple-testing trap.
  estimate_minutes: 210
  exam_critical: true
