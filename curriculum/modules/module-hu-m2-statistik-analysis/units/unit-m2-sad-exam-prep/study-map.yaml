- id: stage-m2-sad-s06-normal-clt-likelihood
  title: SaD.6 — Normal distribution, CLT, approximations, and likelihood (L08)
  status: pending
  objective: Connect standardization and Normal calculations to the CLT, sampling distributions, approximations,
    and the probability-versus-likelihood distinction.
  done_when:
  - Standardize and calculate two one- or two-sided Normal probabilities using symmetry and quantiles.
  - State the LLN and CLT in the course's scope and distinguish what each guarantees.
  - Use a Normal approximation with continuity correction and check whether the approximation conditions
    are plausible.
  - Explain probability versus likelihood and write the Gaussian likelihood-to-squared-error chain in
    five steps.
  - Pass a 30-minute gate mixing z-scores, CLT, approximation, and likelihood interpretation.
  estimate_minutes: 180
  exam_critical: true
