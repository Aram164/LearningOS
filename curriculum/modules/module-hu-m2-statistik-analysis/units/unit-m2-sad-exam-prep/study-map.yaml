- id: stage-m2-sad-s02-regression
  title: SaD.2 — correlation, regression, and optimization (L03)
  status: pending
  objective: 'Close the L03 chain independently: paired data to covariance/Pearson, least squares, multivariate
    form, the normal equation, gradient descent, and interpretation.'
  done_when:
  - Calculate covariance, Pearson r, and a simple least-squares line from a small dataset and interpret
    sign, strength, units, and outliers.
  - State at least three reasons why correlation need not be causation.
  - Set up the design matrix and normal equation with correct shapes and state the rank/invertibility
    caveat.
  - Perform one gradient-descent update by hand and explain the effects of learning rate and feature scaling.
  - Pass a 30-minute mixed L03 gate without using the Regression Bridge until correction.
  estimate_minutes: 180
  exam_critical: true
