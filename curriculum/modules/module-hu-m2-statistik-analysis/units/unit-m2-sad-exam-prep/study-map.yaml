- id: stage-m2-sad-s03-probability-counting
  number: 4
  title: SaD.3 — probability, Bayes, independence, and counting (L04–L05)
  status: pending
  objective: 'Make method recognition automatic: event algebra and axioms, conditional probability/Bayes,
    independence versus conditional independence, Naive Bayes, and the order/repetition counting grid.'
  done_when:
  - Solve one inclusion-exclusion and one complement-counting problem and state the probability axioms
    used.
  - Complete a 4-Feldertafel/Bayes problem and an independence check without formula hunting.
  - Classify at least ten counting scenarios by order, repetition, and all-n versus choose-k before calculating.
  - Compute one permutation, variation, combination, stars-and-bars, and hypergeometric application.
  - Run a small Naive Bayes classification by hand, expose the zero-frequency failure, and show how smoothing
    changes it.
  estimate_minutes: 240
  exam_critical: true
  concepts:
