- id: stage-m2-sad-s04-random-variables
  title: SaD.4 — random variables, expectation, variance, and CDFs (L06)
  status: pending
  objective: Begin the probability-to-inference chain with PMF/PDF/CDF, expectation, variance, transformation
    rules, independence, Chebyshev, and the sample mean as a random variable.
  done_when:
  - Move correctly between PMF/PDF and CDF and explain why a continuous point has probability zero.
  - From a probability table compute E[X], E[X²], Var(X), and standard deviation without notes.
  - Apply expectation/variance rules to aX+b and to an independent sum.
  - Compute E[X-bar] and Var(X-bar) and explain why the latter shrinks with n.
  - Apply Chebyshev to one tail bound and state what makes it distribution-free.
  estimate_minutes: 150
  exam_critical: true
