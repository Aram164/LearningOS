- id: stage-m2-sad-s01-descriptive
  number: 2
  title: SaD.1 — descriptive statistics, data quality, and base rates (L01–L02)
  status: pending
  objective: Use the current L01-L02 decks as authority, then repair only the cold failures in scales,
    summaries, sampling, confusion matrices, and base-rate reasoning.
  done_when:
  - Classify at least eight features by scale and state which ordering, distance, averaging, or ratio
    operations are legal.
  - Compute and interpret mean, median, quantiles, IQR, variance, standard deviation, and a boxplot; explain
    one outlier and one n-versus-n-1 choice.
  - Work one Simpson's-paradox or sampling-bias case and state why aggregation or selection changes the
    claim.
  - Build a confusion matrix from counts and compute accuracy, precision, recall/sensitivity, and specificity;
    explain why accuracy can fail under imbalance.
  - Solve one medical-test/base-rate problem by a frequency table and by Bayes, obtaining the same posterior.
  estimate_minutes: 180
  exam_critical: true
  concepts:
  - concept-descriptive-statistics
  - concept-probability
  scope_triage: required-now
