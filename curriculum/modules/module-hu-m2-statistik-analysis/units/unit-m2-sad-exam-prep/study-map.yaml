- id: stage-m2-sad-calibrate
  title: SaD.0 — cold diagnostic and scope calibration
  status: pending
  objective: Treat Statistics & Data Analysis as its own module. Attempt one representative task from
    each of the five clusters before studying; record evidence, and skip explanatory material for any
    cluster whose cold gate is already clean.
  done_when:
  - 'Attempt without notes: one descriptive/scale item, one Bayes/counting item, one distribution/inference
    item, one model-tracing item, and one interpretation item.'
  - 'Create the five-class SaD error ledger: definition, model-or-method choice, calculation, interpretation,
    and time.'
  - Mark every later SaD stage full-pass, repair-only, or cold-skip from recorded evidence; absence of
    errors is evidence for skipping material, not a claim of mastery.
  - Confirm that no Analysis task is placed in this map and that combined rehearsal starts only in the
    joint unit.
  estimate_minutes: 90
  exam_critical: true
  concepts:
  - concept-descriptive-statistics
  - concept-probability
  scope_triage: required-now
  resources:
  - kind: read
