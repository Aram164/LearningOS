    source_id: source-fau-klausur-ws1415
    locator: FAU-Erlangen_Statistik-Klausur_WS14-15_mit-Loesungen.pdf — the 4-Feldertafel/Bayes item with its
      published solution
    scope_triage: helpful-now
    angle: A real German exam question on base rates, with the marking-relevant working shown.
    angle_detail: 'One item, but it is an authentic exam item rather than a textbook exercise, and the difference
      shows in the phrasing and in how much working the solution considers necessary. Use it as a calibration
      check after L01 rather than as practice: if the phrasing is readable and the expected working is obvious,
      the lecture has landed.'
  - kind: practise
    label: External German solved exams — introduction transfer
    source_id: source-sad-klausuren-extern
    locator: 'materials/.../sad-klausuren-extern/: the solved papers, filtered to the descriptive and contingency-table
      items'
    scope_triage: helpful-now
    angle: External German exam questions with solutions, filtered to what L01 actually covers.
    angle_detail: A bank of real papers from other universities. Its strength is authentic phrasing and marking
      expectations; its weakness is that the syllabi differ, so unfiltered use wastes time on topics SaD does
      not teach. Always select by topic against the 2026 deck first. Use it late, under timed conditions, after
      the textbook drill.
  - kind: watch
    label: StatQuest — confusion matrix, sensitivity, and specificity
    source_id: source-statquest
    locator: '''The Confusion Matrix, Clearly Explained'' and ''Sensitivity and Specificity, Clearly Explained''
      (≈10 min each)'
    scope_triage: helpful-now
    angle: Twenty minutes that fix the confusion matrix orientation problem — which axis is truth, which is prediction
      — for good.
    angle_detail: Nearly every mistake with precision, recall, sensitivity and specificity is a transposition
      error made under time pressure, not a conceptual failure. StatQuest's fix is a colour-coded table built
      up cell by cell, repeated until the layout is memorable. That is worth more for L01 than any written treatment,
      because the written ones assume you will not transpose it. Stop after these two; the channel's ROC video
      belongs to L11.
  - kind: watch
    label: 3Blue1Brown — Bayes' theorem and the medical-test paradox
    source_id: source-3b1b-bayes-theorem
    locator: '''Bayes theorem, the geometry of changing beliefs'' (≈15 min); ''The medical test paradox, and redesigning
      Bayes'' rule'' (≈21 min)'
    scope_triage: helpful-now
    angle: Turns the base-rate problem into an area picture, so the answer is seen before it is computed.
    angle_detail: L01 introduces base rates through a medical-test example and asserts the counterintuitive answer.
      The first video builds a rectangle whose areas are the four cells of the joint distribution, and the posterior
      becomes a visible ratio of two areas — at which point the answer stops being surprising. The second video
      is the medical-test case itself and argues for thinking in odds and Bayes factors, which is a genuinely
      different representation from the lecture's. Watch before the algebra in L04, not after.
