    scope_triage: required-now
  - kind: read
    label: Fahrmeir Chapter 2 — descriptive-statistics reference
    source_id: source-fahrmeir-statistik
    locator: Ch 2 §2.1 Verteilungen und ihre Darstellungen, pdf pp. 47-66; §2.2 Beschreibung von Verteilungen,
      pdf pp. 67-90
    angle: The German textbook vocabulary for exactly the descriptive tools L01 demonstrates, so the exam
      words and the lecture words match.
    angle_detail: 'L01 shows mean/median/mode and a histogram on one study-duration dataset and moves
      on; Fahrmeir gives the same objects their examinable German names and definitions — Häufigkeitsverteilung,
