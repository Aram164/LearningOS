- id: stage-02-the-confusion-matrix-precision-recall
  title: The confusion matrix + precision/recall
  status: pending
  objective: TP/FP/FN/TN; precision vs recall; specificity/sensitivity; why accuracy misleads on rare
    classes. **Exam-relevant.**
  done_when:
  - Explain and apply The confusion matrix + precision/recall without relying on the study map.
  exam_critical: true
  scope_triage: required-now
  resources:
  - kind: watch
    label: 🎥 ⭐ **StatQuest — "The Confusion Matrix"** then **"Sensitivity and Specificity"** (Starmer)
      — the crosswalk L01 🎥 primary; short and exact.
    source_id: source-statquest
  - kind: read
    label: 📖 **Kroese §7.2 (p.253)** — the metrics, compactly (in the AML/ML shelf) · or OpenIntro's classification-metrics
