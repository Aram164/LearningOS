- id: stage-sad-l01-classification
  number: 5
  title: Confusion matrices and classification metrics
  status: pending
  objective: True/false positives and negatives support accuracy, precision, recall, sensitivity, and
    specificity; the useful metric depends on the error costs and class prevalence.
  done_when:
  - 'Reproduce without notes: True/false positives and negatives support accuracy, precision, recall,
    sensitivity, and specificity; the useful metric depends on the error costs and class prevalence.'
  - Work FAU pp. 4 and 22 — origin/base-rate table with solution, and record every miss with the step
    it failed at.
  exam_critical: true
  concepts:
  - concept-classification-metrics
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L01 introduction deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/01_introduction.pdf, 42 slides
    angle: The scope authority for L01 and the only place the course's own framing of the module appears.
    angle_detail: 'Everything in L01 is demonstrated on a single study-duration dataset, which is the
      deck''s pedagogical device and also its limitation: each idea appears once, in one context, and
      is not revisited. Treat it as the definition of what is in scope and the source of the notation,
      and use the supporting routes on this stage for the second and third encounters the deck does not
      provide. The classification-metrics and base-rate slides at the end preview L04 and L11 rather than
      belonging to L01''s own material.'
    vault_path: material://source-sad-ss26-lectures/lecture-slides/01_introduction.pdf
    scope_triage: required-now
  - kind: practise
    label: FAU pp. 4 and 22 — origin/base-rate table with solution
    source_id: source-fau-klausur-ws1415
    locator: FAU-Erlangen_Statistik-Klausur_WS14-15_mit-Loesungen.pdf, p. 4 Aufgabe 1(3)-(4), solution
      p. 22
    angle: An authentic German base-rate item showing the amount of working that receives marks.
    angle_detail: The orange-origin table asks for posterior/origin reasoning in the form that makes sensitivity-versus-posterior
      mistakes visible. It is a calibration item after L01, not a new explanation of Bayes.
    vault_path: material://source-fau-klausur-ws1415/FAU-Erlangen_Statistik-Klausur_WS14-15_mit-Loesungen.pdf
    scope_triage: helpful-now
  - kind: watch
    label: StatQuest — confusion matrix, sensitivity, and specificity
    source_id: source-statquest
    locator: '''The Confusion Matrix, Clearly Explained'' and ''Sensitivity and Specificity, Clearly Explained''
      (≈10 min each)'
    angle: Twenty minutes that fix the confusion matrix orientation problem — which axis is truth, which
      is prediction — for good.
    angle_detail: Nearly every mistake with precision, recall, sensitivity and specificity is a transposition
      error made under time pressure, not a conceptual failure. StatQuest's fix is a colour-coded table
      built up cell by cell, repeated until the layout is memorable. That is worth more for L01 than any
      written treatment, because the written ones assume you will not transpose it. Stop after these two;
      the channel's ROC video belongs to L11.
