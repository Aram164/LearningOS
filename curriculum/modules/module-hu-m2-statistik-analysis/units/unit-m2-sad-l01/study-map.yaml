      and notation, not for new ideas: everything here is L01 content stated more slowly and in the language
      the Klausur is written in. It assumes no probability at all, so it is safe this early.'
    vault_path: material://source-fahrmeir-statistik/statistik.pdf
    scope_triage: helpful-now
  - kind: practise
    label: Arbeitsbuch Chapter 2 — descriptive warm-ups
    source_id: source-fahrmeir-arbeitsbuch
    locator: Ch 2 Aufgaben pdf pp. 12-30, Lösungen pdf pp. 31-56 (start with the Häufigkeits- and Lagemaß
      items)
    angle: Solved German drill for the descriptive measures L01 introduces, with every step written out
      rather than a final answer.
    angle_detail: The Arbeitsbuch is the companion to the Fahrmeir textbook and shares its numbering exactly,
      so an exercise here always has a chapter of theory behind it at the same number. Its solutions are
      full derivations, which makes it the right place to check calculation habits — divisor choice, rounding,
      how a median is reported for even n — rather than to test yourself. For untimed self-testing prefer
      the SaD Übungen; for timed self-testing use the Klausur bank.
    vault_path: material://source-fahrmeir-arbeitsbuch/arbeitsbuch.pdf
    scope_triage: helpful-now
  - kind: read
    label: OpenIntro Chapters 1–2 — accessible data summaries
    source_id: source-openintro-statistics
    locator: 'Ch 1 introduction to data, pdf pp. 7-38 (case study: stents to prevent strokes p. 9); Ch
      2 §2.1 examining numerical data, pdf pp. 40-59; §2.3 case study: malaria vaccine, pdf pp. 70-78'
    angle: Opens with a real study whose result reverses on closer reading — the argument for why descriptive
      statistics is not decoration.
    angle_detail: 'The stent case study runs through the whole first chapter: a treatment that looks beneficial
      at 30 days and harmful at 365, with the data shown both ways. It is the most persuasive answer available
      to ''why does L01 spend a lecture on summaries'', and it costs twenty minutes. The writing is aimed
      at first-year undergraduates with no calculus, so this is the gentlest route on the shelf; that
      is a feature at L01 and a limitation later. Free, open licence, and the same book carries L02-L10,
      so the notation stays constant across the whole statistics half of the course.'
    vault_path: material://source-openintro-statistics/openintro.pdf
    scope_triage: helpful-now
  - kind: practise
    label: Dekking — descriptive review and answer-backed exercises
    source_id: source-dekking-mips
    locator: 'Ch 16 Exploratory data analysis: numerical summaries, pdf pp. 238-250 (centre p. 238; variability
      p. 240; empirical quantiles and IQR p. 241; boxplot p. 243; exercises p. 247); Ch 15 histograms
      pdf pp. 216-218; full solutions App D pdf pp. 443-471'
    angle: Descriptive statistics presented after probability, so mean and variance arrive as estimates
      of distribution features rather than as summary formulas.
    angle_detail: 'Dekking deliberately places EDA in Ch 15-16, two thirds of the way through the book,
      and the consequence is a different reading of the same formulas L01 shows on slide one: the sample
      mean is introduced as an estimator of E[X], the sample variance as an estimator of Var(X). Coming
      back to this after L09 is one of the most useful re-reads in the module, because it retroactively
      explains why L01''s descriptive tools were worth defining. On a first pass through L01, use it only
      for the exercises — the framing will not land yet.'
    vault_path: material://source-dekking-mips/dekking.pdf
    scope_triage: helpful-now
  - kind: watch
    label: Kurzes Tutorium Statistik — Lagemaße und Streuung
    source_id: source-kurzes-tutorium-statistik
    locator: Die Videos 'Lagemaße' und 'Streuungsmaße' (je ≈10 Min)
    angle: German-language vocabulary for L01's descriptive measures — the words the Klausur will actually
      use.
    angle_detail: The lecture is delivered in English but examined in a German programme, and the exam
      vocabulary (Lagemaß, Streuungsmaß, Merkmalsausprägung, Häufigkeit) is not always introduced on the
      slides. These videos are short and use the terms consistently, which is the cheapest way to close
      that gap. Content is at Abitur/first-semester level — use it for language, not for depth.
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l01/stages/stage-sad-l01-location/notes.md
  attachments: []
  source_feedback: []
