    label: Fahrmeir Chapter 2 — descriptive-statistics reference
    source_id: source-fahrmeir-statistik
    locator: Ch 2 §2.1 Verteilungen und ihre Darstellungen, pdf pp. 47-66; §2.2 Beschreibung von Verteilungen,
      pdf pp. 67-90
    scope_triage: helpful-now
    angle: The German textbook vocabulary for exactly the descriptive tools L01 demonstrates, so the exam words
      and the lecture words match.
    angle_detail: 'L01 shows mean/median/mode and a histogram on one study-duration dataset and moves on; Fahrmeir
      gives the same objects their examinable German names and definitions — Häufigkeitsverteilung, Lagemaße,
      Streuungsmaße, Quantil, Boxplot — with a worked example per definition. Read it for naming and notation,
      not for new ideas: everything here is L01 content stated more slowly and in the language the Klausur is
      written in. It assumes no probability at all, so it is safe this early.'
  - kind: practise
    label: Arbeitsbuch Chapter 2 — descriptive warm-ups
    source_id: source-fahrmeir-arbeitsbuch
    locator: Ch 2 Aufgaben pdf pp. 12-30, Lösungen pdf pp. 31-56 (start with the Häufigkeits- and Lagemaß items)
    scope_triage: helpful-now
    angle: Solved German drill for the descriptive measures L01 introduces, with every step written out rather
      than a final answer.
    angle_detail: The Arbeitsbuch is the companion to the Fahrmeir textbook and shares its numbering exactly,
      so an exercise here always has a chapter of theory behind it at the same number. Its solutions are full
      derivations, which makes it the right place to check calculation habits — divisor choice, rounding, how
      a median is reported for even n — rather than to test yourself. For untimed self-testing prefer the SaD
      Übungen; for timed self-testing use the Klausur bank.
  - kind: read
    label: OpenIntro Chapters 1–2 — accessible data summaries
    source_id: source-openintro-statistics
    locator: 'Ch 1 introduction to data, pdf pp. 7-38 (case study: stents to prevent strokes p. 9); Ch 2 §2.1
      examining numerical data, pdf pp. 40-59; §2.3 case study: malaria vaccine, pdf pp. 70-78'
    scope_triage: helpful-now
    angle: Opens with a real study whose result reverses on closer reading — the argument for why descriptive
      statistics is not decoration.
    angle_detail: 'The stent case study runs through the whole first chapter: a treatment that looks beneficial
      at 30 days and harmful at 365, with the data shown both ways. It is the most persuasive answer available
      to ''why does L01 spend a lecture on summaries'', and it costs twenty minutes. The writing is aimed at first-year
      undergraduates with no calculus, so this is the gentlest route on the shelf; that is a feature at L01 and
      a limitation later. Free, open licence, and the same book carries L02-L10, so the notation stays constant
      across the whole statistics half of the course.'
  - kind: practise
    label: Dekking — descriptive review and answer-backed exercises
    source_id: source-dekking-mips
    locator: 'Ch 16 Exploratory data analysis: numerical summaries, pdf pp. 238-250 (centre p. 238; variability
      p. 240; empirical quantiles and IQR p. 241; boxplot p. 243; exercises p. 247); Ch 15 histograms pdf pp.
      216-218; full solutions App D pdf pp. 443-471'
    scope_triage: helpful-now
    angle: Descriptive statistics presented after probability, so mean and variance arrive as estimates of distribution
      features rather than as summary formulas.
    angle_detail: 'Dekking deliberately places EDA in Ch 15-16, two thirds of the way through the book, and the
      consequence is a different reading of the same formulas L01 shows on slide one: the sample mean is introduced
      as an estimator of E[X], the sample variance as an estimator of Var(X). Coming back to this after L09 is
      one of the most useful re-reads in the module, because it retroactively explains why L01''s descriptive
      tools were worth defining. On a first pass through L01, use it only for the exercises — the framing will
      not land yet.'
  - kind: practise
    label: External German solved exams — introduction transfer
    source_id: source-sad-klausuren-extern
    locator: 'materials/.../sad-klausuren-extern/: the solved papers, filtered to the descriptive and contingency-table
      items'
    scope_triage: helpful-now
    angle: External German exam questions with solutions, filtered to what L01 actually covers.
    angle_detail: A bank of real papers from other universities. Its strength is authentic phrasing and marking
      expectations; its weakness is that the syllabi differ, so unfiltered use wastes time on topics SaD does
      not teach. Always select by topic against the 2026 deck first. Use it late, under timed conditions, after
      the textbook drill.
  - kind: watch
    label: Kurzes Tutorium Statistik — Lagemaße und Streuung
    source_id: source-kurzes-tutorium-statistik
    locator: Die Videos 'Lagemaße' und 'Streuungsmaße' (je ≈10 Min)
    scope_triage: helpful-now
    angle: German-language vocabulary for L01's descriptive measures — the words the Klausur will actually use.
    angle_detail: The lecture is delivered in English but examined in a German programme, and the exam vocabulary
      (Lagemaß, Streuungsmaß, Merkmalsausprägung, Häufigkeit) is not always introduced on the slides. These videos
      are short and use the terms consistently, which is the cheapest way to close that gap. Content is at Abitur/first-semester
      level — use it for language, not for depth.
