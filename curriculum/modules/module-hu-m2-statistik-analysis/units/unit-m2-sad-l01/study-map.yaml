- id: stage-sad-l01-data-questions
  number: 1
  title: One dataset, several legitimate questions
  status: pending
  objective: A statistic is useful only relative to a question; totals, typical cases, likely cases, and
    decisions can require different summaries of the same observations.
  done_when:
  - 'Reproduce without notes: A statistic is useful only relative to a question; totals, typical cases,
    likely cases, and decisions can require different summaries of the same observations.'
  - Work Blatt 1, Aufgabe 1 — data summaries in the opening dataset, then the remaining 1, and record
    every miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-descriptive-statistics
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L01 introduction deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/01_introduction.pdf, 42 slides
    angle: The scope authority for L01 and the only place the course's own framing of the module appears.
    angle_detail: 'Everything in L01 is demonstrated on a single study-duration dataset, which is the
      deck''s pedagogical device and also its limitation: each idea appears once, in one context, and
      is not revisited. Treat it as the definition of what is in scope and the source of the notation,
      and use the supporting routes on this stage for the second and third encounters the deck does not
      provide. The classification-metrics and base-rate slides at the end preview L04 and L11 rather than
      belonging to L01''s own material.'
    vault_path: material://source-sad-ss26-lectures/lecture-slides/01_introduction.pdf
    scope_triage: required-now
  - kind: practise
    label: Blatt 1, Aufgabe 1 — data summaries in the opening dataset
    source_id: source-sad-uebungen
    locator: exercise-slides/Blatt1.pdf, pp. 1-2, Aufgabe 1
    angle: Turns the introductory dataset into an unaided frequency, location and interpretation task.
    angle_detail: 'This is a current assessed sheet: attempt it before opening the tutorial solution.
      It is scope evidence because it shows the chair''s own wording, data size and expected amount of
      working; it is not a replacement for the lecture derivation.'
    vault_path: material://source-sad-ss26-lectures/exercise-slides/Blatt1.pdf
    scope_triage: required-now
  - kind: practise
    label: UE2, slides 5-18 — feature and data-type walkthrough
    source_id: source-sad-uebungen
    locator: exercise-slides/UE2.pdf, slides 5-18
    angle: Shows how the course translates a raw table into features before any model is chosen.
    angle_detail: 'This is the current worked tutorial for the named task. Use it after an unaided attempt:
      its value is the course''s calculation order and notation, while reading it first would turn an
      exam-relevant retrieval task into passive recognition.'
    vault_path: material://source-sad-ss26-lectures/exercise-slides/UE2.pdf
    scope_triage: required-now
  - kind: read
    label: OpenIntro Chapters 1–2 — accessible data summaries
    source_id: source-openintro-statistics
    locator: 'Ch 1 introduction to data, pdf pp. 7-38 (case study: stents to prevent strokes p. 9); Ch
      2 §2.1 examining numerical data, pdf pp. 40-59; §2.3 case study: malaria vaccine, pdf pp. 70-78'
    angle: Opens with a real study whose result reverses on closer reading — the argument for why descriptive
      statistics is not decoration.
    angle_detail: 'The stent case study runs through the whole first chapter: a treatment that looks beneficial
      at 30 days and harmful at 365, with the data shown both ways. It is the most persuasive answer available
      to ''why does L01 spend a lecture on summaries'', and it costs twenty minutes. The writing is aimed
      at first-year undergraduates with no calculus, so this is the gentlest route on the shelf; that
      is a feature at L01 and a limitation later. Free, open licence, and the same book carries L02-L10,
      so the notation stays constant across the whole statistics half of the course.'
    vault_path: material://source-openintro-statistics/openintro.pdf
    scope_triage: helpful-now
