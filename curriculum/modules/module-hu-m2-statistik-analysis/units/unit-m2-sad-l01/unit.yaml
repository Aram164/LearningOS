id: unit-m2-sad-l01
type: unit
module_id: module-hu-m2-statistik-analysis
component_id: component-m2-sad
kind: lecture
title: SaD Lecture 01 — Introduction
order: 1
scope: Current 2026 L01 deck; competing descriptions of the same data, mean/median/mode and robustness,
  empirical distributions, sample dependence, classification tables and metrics, base-rate effects,
  Bayes reasoning, and the course's descriptive-to-inferential-to-ML roadmap.
status: not-started
knowledge_map:
  summary: The lecture begins with one data question and shows why every numerical answer depends on the
    population, sample, representation, loss, and decision being asked for.
  nodes:
  - id: knowledge-sad-l01-data-questions
    title: One dataset, several legitimate questions
    summary: A statistic is useful only relative to a question; totals, typical cases, likely cases, and
      decisions can require different summaries of the same observations.
  - id: knowledge-sad-l01-location
    title: Mean, median, mode, and robustness
    summary: Central-tendency summaries answer different questions, while outliers move the mean much more
      strongly than the median or mode.
    builds_on: [knowledge-sad-l01-data-questions]
  - id: knowledge-sad-l01-distributions
    title: Frequencies, histograms, and empirical distributions
    summary: Counts become relative frequencies and distributions, making samples of different sizes and
      ranges comparable without pretending that the sample is the population.
    builds_on: [knowledge-sad-l01-location]
  - id: knowledge-sad-l01-sampling-context
    title: Samples, populations, and context
    summary: A result changes with the sampled group; the same-looking numbers can describe different
      populations, and comparison requires attention to selection and context.
    builds_on: [knowledge-sad-l01-distributions]
  - id: knowledge-sad-l01-classification
    title: Confusion matrices and classification metrics
    summary: True/false positives and negatives support accuracy, precision, recall, sensitivity, and
      specificity; the useful metric depends on the error costs and class prevalence.
    builds_on: [knowledge-sad-l01-data-questions]
  - id: knowledge-sad-l01-base-rates
    title: Base rates and Bayes by counting
    summary: Medical-test and classification examples expose why a high sensitivity need not imply a high
      posterior probability when the positive class is rare.
    builds_on: [knowledge-sad-l01-classification]
  - id: knowledge-sad-l01-course-map
    title: From description to inference and prediction
    summary: Descriptive statistics summarize observed data; probability models uncertainty; inference
      reasons about populations; data science and machine learning use the resulting structure to predict.
    builds_on: [knowledge-sad-l01-sampling-context, knowledge-sad-l01-base-rates]
