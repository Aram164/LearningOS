  - Assign every content error to exactly one SaD or Analysis stage and record the smallest repair source.
  - 'For each red error: explain the cause, solve one near transfer, wait at least one sleep cycle, then
    solve a different cold transfer.'
  - Repair context-switch/time errors with a revised order, stop-loss rule, or review buffer rather than
    rereading content.
  - Freeze the second-mock strategy before seeing its questions.
  estimate_minutes: 180
  exam_critical: true
