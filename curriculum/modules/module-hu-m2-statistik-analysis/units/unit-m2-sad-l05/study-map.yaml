status: not-started
current_stage: stage-sad-l05-decision-grid
source_plan:
  path: curriculum/modules/module-hu-m2-statistik-analysis/source-map.yaml
  provenance: operator
detours: []
shelving:
  state: none
stages:
- id: stage-sad-l05-decision-grid
  number: 1
  title: The combinatorics decision grid
  status: pending
  objective: First decide whether order matters, whether replacement/repetition is allowed, and whether all n
    objects or only k are used; the formula follows from those choices.
  done_when:
  - 'Reproduce without notes: First decide whether order matters, whether replacement/repetition is allowed, and
    whether all n objects or only k are used; the formula follows from those choices.'
  - Work Blatt 2 and UE3 — combinatorics decisions, then the remaining 5, and record every miss with the step
    it failed at.
  exam_critical: true
  concepts:
  - concept-combinatorics
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L05 combinatorics deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/05_combinatorics.pdf, 34 slides
    scope_triage: required-now
    angle: The decision grid — order × replacement × selection size — which is the organising device the exam
      expects you to apply.
    angle_detail: 'The deck''s contribution is the grid itself rather than the individual formulas, which are
      standard. Read it as a classification procedure: identify the cell, then apply the formula that cell names.
      The identities and Stirling slides at the end are stated without justification; Blitzstein §1.5''s story
      proofs are where they become memorable rather than memorised.'
  - kind: practise
    label: Blatt 2 and UE3 — combinatorics decisions
    source_id: source-sad-uebungen
    locator: exercise-slides/blatt-02.pdf, the counting tasks; exercise-slides/UE3.pdf, the counting walkthrough
    scope_triage: required-now
    angle: Counting as the chair asks it, which is consistently inside a probability question rather than alone.
    angle_detail: Confirms the pattern the external banks also show, and shows which grid cells actually appear.
      Use it to prioritise the Schaum's Ch 2 drill rather than working that chapter uniformly.
  - kind: read
    label: Fahrmeir Chapter 4 — combinatorics and finite probability
    source_id: source-fahrmeir-statistik
    locator: Ch 4 §4.3 Zufallsstichproben und Kombinatorik, pdf pp. 214-220; Aufgaben pdf pp. 239-241
    scope_triage: helpful-now
    angle: Six pages that put counting where SaD puts it — inside sampling — instead of treating combinatorics
      as its own subject.
    angle_detail: 'This is deliberately the shortest combinatorics treatment on the shelf, and that is its value:
      Fahrmeir introduces the counting cases only as the sizes of sample spaces for Ziehen mit/ohne Zurücklegen
      and mit/ohne Berücksichtigung der Reihenfolge, which is precisely how L05''s decision grid is organised.
      If the grid is what will not stick, read this rather than a full combinatorics chapter, because it never
      leaves the sampling frame. For volume of drill and the harder identity questions go to Blitzstein Ch 1 or
      Schaum''s Ch 2 instead.'
  - kind: practise
    label: Arbeitsbuch Chapter 4 — combinatorics applications
    source_id: source-fahrmeir-arbeitsbuch
    locator: Ch 4 Aufgaben pdf pp. 83-88, Lösungen pdf pp. 89-95 (the Ziehen mit/ohne Zurücklegen items)
    scope_triage: helpful-now
    angle: Counting embedded in probability questions rather than as pure counting exercises — which is how L05
      is examined.
    angle_detail: 'The exam rarely asks ''how many arrangements'' on its own; it asks for a probability whose
      computation happens to require a count. These items are all of that second kind, so they train the step
      students actually lose marks on: deciding whether order and replacement matter before reaching for a formula.
      Thin on pure identities and Stirling — Blitzstein §1.4 covers those.'
  - kind: read
    label: Blitzstein Chapter 1 — strategic counting
    source_id: source-blitzstein-hwang
    locator: Ch 1 pdf pp. 18-61 (§1.3 naive definition of probability p. 23; §1.4 how to count p. 25; §1.5 story
      proofs p. 37; §1.6 non-naive definition p. 38; exercises §1.9 p. 50)
    scope_triage: helpful-now
    angle: 'Story proofs: counting identities argued by describing two ways to count the same set, with no algebra
      at all.'
    angle_detail: §1.5 is the reason to come here for L05 rather than to any German text. A story proof establishes
      an identity — the symmetry of binomial coefficients, Vandermonde, the hockey stick — by naming a set and
      counting it twice, and once seen the identities stop being things to memorise. That directly serves L05's
      identities node, which the deck states without justification. §1.4 also makes the sampling table (ordered/unordered
      × with/without replacement) explicit, which is the same four-way grid the lecture draws. The strongest exercise
      set on the shelf for this material.
  - kind: reference
    label: Tijms — counting through probability models
    source_id: source-tijms-understanding-probability
    locator: Ch 7 Foundations of probability theory, pdf pp. 235-254 (finite sample spaces and the Laplace model)
    scope_triage: reference-only
    angle: Counting kept subordinate to the sample-space model, with birthday- and lottery-style problems as the
      worked cases.
    angle_detail: Tijms treats combinatorial questions as questions about the size of a well-chosen sample space,
      and his worked cases — coincidences, lotteries, matching problems — are the ones whose answers are counterintuitive
      enough to be memorable. Useful as a second pass after the mechanics are in place from L05's grid, less useful
      as a first exposure because he does not tabulate the cases.
  - kind: practise
    label: Schaum — combinatorics drills
    source_id: source-schaums-probability
    locator: Ch 2 Techniques of Counting, pdf pp. 18-39
    scope_triage: helpful-now
    angle: Twenty-two pages that are almost entirely solved counting problems — the highest drill density for
      L05 on the shelf.
    angle_detail: L05 is the lecture where practice volume beats explanation, because the difficulty is pattern
      recognition across many superficially different word problems. This chapter supplies that volume and nothing
      else. Work them in mixed order and force yourself to name the grid cell (ordered/unordered, with/without
      replacement) before computing — the chapter is organised by technique, which otherwise gives the answer
      away.
  - kind: practise
    label: Dekking — counting and finite-probability exercises
    source_id: source-dekking-mips
    locator: Ch 4 §4.3 the Bernoulli and binomial distributions, pdf pp. 56-58; Ch 2 §2.4 products of sample spaces,
      pdf pp. 29-30; exercises pdf pp. 62-66
    scope_triage: helpful-now
    angle: Deliberately thin on counting — read it to see how far you can get with product sample spaces instead
      of combinatorial formulas.
    angle_detail: 'This book barely has a combinatorics section, and knowing that is useful: it builds the binomial
      coefficient where it is needed, out of the product sample space in §2.4, rather than teaching counting as
      a prerequisite subject. If L05''s grid feels like arbitrary memorisation, seeing a serious book do without
      most of it reframes the grid as a shortcut rather than as the content. For actual counting practice go to
      Blitzstein §1.4 or Schaum''s Ch 2 — this route is orientation.'
  - kind: read
    label: MIT 18.05 — counting and finite probability
    source_id: source-mit-1805
    locator: 'Classes: Reading and In-class Materials, Class 1 ''Counting and Sets'' reading and slides; Problem
      Set 1 with solutions'
    scope_triage: helpful-now
    angle: Treats counting as one week of prerequisite technique, which is a useful calibration of how much of
      L05 is genuinely hard.
    angle_detail: 18.05 spends a single class on counting before moving to probability, and its problem set is
      correspondingly compact. Reading it tells you which parts of L05's grid a strong applied course considers
      routine and which it considers worth practising — helpful when deciding how much time this lecture deserves.
      Not a substitute for Blitzstein Ch 1 if the grid itself is the problem.
  - kind: reference
    label: Harvard Stat 110 — strategic counting
    source_id: source-stat110
    locator: Lecture 1 (sample spaces, naive definition, counting) and Lecture 2 (story proofs, non-naive definition);
      Strategic Practice 1 with solutions
    scope_triage: reference-only
    angle: Contains the story-proof demonstrations performed live, which is where that technique is easiest to
      pick up.
    angle_detail: A story proof is a way of arguing, and watching one being constructed is more instructive than
      reading a finished one — the moment where he chooses what set to count twice is the whole method. Two lectures
      cover all of L05's counting content at a level above the lecture's own, with the identities node handled
      properly.
  - kind: practise
    label: FAU solved exam — finite counting inside probability
    source_id: source-fau-klausur-ws1415
    locator: 'FAU-Erlangen_Statistik-Klausur_WS14-15_mit-Loesungen.pdf: the counting and Binomial questions with
      their solutions'
    scope_triage: helpful-now
    angle: Counting appearing inside a larger probability question, which is the only way L05 is examined.
    angle_detail: 'Confirms what the textbook exercises suggest: the exam does not ask for counts in isolation.
      The count is a step in a probability calculation, and marks are lost at the identification step, not the
      arithmetic.'
  - kind: practise
    label: External German solved exams — counting block
    source_id: source-sad-klausuren-extern
    locator: 'materials/.../sad-klausuren-extern/: the combinatorics questions in the solved papers'
    scope_triage: helpful-now
    angle: Counting items from real papers, which are consistently harder than textbook exercises.
    angle_detail: External exam counting questions tend to disguise the grid cell more thoroughly than textbook
      problems do, which is good practice for the identification step. Check each against SaD's scope before working
      it — some papers examine counting techniques this course does not teach.
  - kind: watch
    label: jbstatistics — permutations and combinations
    source_id: source-jbstatistics
    locator: The 'Permutations and Combinations' video series (3 videos, ≈10 min each)
    scope_triage: helpful-now
    angle: Derives the combination formula from the permutation formula on screen, rather than presenting both
      as given.
    angle_detail: nCr = nPr / r! is the relationship that makes the two halves of L05's grid one idea rather than
      two formulas, and seeing the division performed — dividing out the orderings you decided not to distinguish
      — is what makes it stick. Short series, appropriate as a first exposure before the Schaum's drill.
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l05/stages/stage-sad-l05-decision-grid/notes.md
  attachments: []
  source_feedback: []
