  state: none
stages:
- id: stage-sad-l05-decision-grid
  number: 1
  title: The combinatorics decision grid
  status: pending
  objective: First decide whether order matters, whether replacement/repetition is allowed, and whether
    all n objects or only k are used; the formula follows from those choices.
  done_when:
  - 'Reproduce without notes: First decide whether order matters, whether replacement/repetition is allowed,
    and whether all n objects or only k are used; the formula follows from those choices.'
  - Work Blatt 2 and UE3 — combinatorics decisions, then the remaining 5, and record every miss with the
    step it failed at.
  exam_critical: true
  concepts:
  - concept-combinatorics
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L05 combinatorics deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/05_combinatorics.pdf (34 pages) — Organizes the six classical counting cases
      by order, replacement, and selection size, then connects them to finite probability and hypergeometric
      sampling.
    scope_triage: required-now
  - kind: practise
    label: Blatt 2 and UE3 — combinatorics decisions
    source_id: source-sad-uebungen
    locator: exercise-slides/blatt-02.pdf counting tasks; exercise-slides/UE3.pdf matching walkthrough
      — Counting problems whose main difficulty is selecting the correct order/replacement case before
      evaluating a formula, plus finite-probability applications.
    scope_triage: required-now
  - kind: read
    label: Fahrmeir Chapter 4 — combinatorics and finite probability
    source_id: source-fahrmeir-statistik
    locator: Chapter 4 combinatorics sections — Places counting formulas inside probability models, useful
      when a formula is known but the event/sample-space construction is unclear.
    scope_triage: helpful-now
  - kind: practise
    label: Arbeitsbuch Chapter 4 — combinatorics applications
    source_id: source-fahrmeir-arbeitsbuch
    locator: Chapter 4 counting selections — Solved finite-counting and probability problems that force
      the order/replacement decision before computation.
    scope_triage: helpful-now
  - kind: read
    label: Blitzstein Chapter 1 — strategic counting
    source_id: source-blitzstein-hwang
    locator: Chapter 1 — Builds permutation/combination formulas from sampling stories and emphasizes
      choosing a counting strategy over memorizing an isolated formula.
    scope_triage: helpful-now
  - kind: reference
    label: Tijms — counting through probability models
    source_id: source-tijms-understanding-probability
    locator: Finite probability and counting selections — Concrete sampling and chance examples show how
      combinatorial counts become event probabilities; useful when abstract cases do not yet feel motivated.
    scope_triage: reference-only
  - kind: practise
    label: Schaum — combinatorics drills
    source_id: source-schaums-probability
    locator: Combinatorics problem sets — Terse theory plus many solved counting problems for making the
      order/replacement decision automatic.
    scope_triage: helpful-now
  - kind: practise
    label: Dekking — counting and finite-probability exercises
    source_id: source-dekking-mips
    locator: Counting selections — Additional answer-backed problems for combinatorial classification
      and probability by counting.
    scope_triage: helpful-now
  - kind: read
    label: MIT 18.05 — counting and finite probability
    source_id: source-mit-1805
    locator: Counting and finite-probability notes/problem sets — Selected problem sets that connect combinatorial
      counts to probability; strongest as independent solution-backed practice rather than a replacement
      theory source.
    scope_triage: helpful-now
  - kind: reference
    label: Harvard Stat 110 — strategic counting
    source_id: source-stat110
    locator: Counting and story-proof lectures/problem sets — Lecture-level counting strategy and probability
      applications; richer than the SaD exam requires, but valuable when formula selection remains brittle.
    scope_triage: reference-only
  - kind: practise
    label: FAU solved exam — finite counting inside probability
    source_id: source-fau-klausur-ws1415
    locator: Counting and Binomial-related questions — Timed counting/probability transfer where the event
      model must be chosen before a Binomial or finite count can be evaluated.
    scope_triage: helpful-now
  - kind: practise
    label: External German solved exams — counting block
    source_id: source-sad-klausuren-extern
    locator: Local solved bank; combinatorics questions — Gap-targeted combinatorics and finite-probability
      items for testing formula selection under German exam wording.
    scope_triage: helpful-now
  - kind: watch
    label: jbstatistics — permutations and combinations
    source_id: source-jbstatistics
    locator: Permutations and Combinations series — Slow worked distinction between permutations, variations,
      and combinations, including the role of order and replacement.
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l05/stages/stage-sad-l05-decision-grid/notes.md
  attachments: []
  source_feedback: []
