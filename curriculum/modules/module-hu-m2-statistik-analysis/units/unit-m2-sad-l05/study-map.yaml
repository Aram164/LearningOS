- id: stage-sad-l05-combinations
  number: 4
  title: Unordered selections and binomial coefficients
  status: pending
  objective: Choosing k objects without order gives n choose k, whose symmetry and recursive identities
    recur throughout probability and algorithms.
  done_when:
  - 'Reproduce without notes: Choosing k objects without order gives n choose k, whose symmetry and recursive
    identities recur throughout probability and algorithms.'
  - Work Blatt 2, Aufgabe 1 — counting inside finite probability, then the remaining 5, and record every
    miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-combinatorics
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L05 combinatorics deck
    locator: lecture-slides/05_combinatorics.pdf, PDF pp. 20-22
    angle: Derives unordered selections by dividing ordered selections by the k! orders of each chosen
      set.
    angle_detail: Read physical pp. 20–22. The division works because each set of distinct selected objects
      has exactly k! orderings.
