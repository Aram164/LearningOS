      the problem of choosing among them. Build the decision tree from §4.2 with the script''s own theorem
      numbers on it — the hypotheses are what the exam checks, and §4.3''s absolute-versus-conditional
      distinction is the hypothesis that §4.4''s rearrangement result turns on. §4.5 is an Exkurs and
      out of scope.'
