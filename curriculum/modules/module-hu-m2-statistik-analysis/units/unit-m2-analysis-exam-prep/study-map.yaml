    subsequences, Cauchy sequences, monotone convergence, divergent sequences, and recursion applications.
  done_when:
  - State each Chapter 3 convergence criterion with all assumptions and select the right criterion for
    a new sequence.
  - Produce two correct epsilon-N arguments and calculate at least eight limits, including a root/rationalization,
    a recursive sequence, and a subsequence-based divergence argument.
  - Complete the current HU Serie 05-07 core tasks before opening external solutions.
  - Use kleine_beweise only to repair a failed theorem application, then explain the proof idea in three
    to five sentences rather than memorizing it.
  - Pass a 30-minute closed-book mixed sequence test and update the error ledger.
