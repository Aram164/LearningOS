- id: stage-m2-analysis-anx
  title: AN.X — Analysis retrieval and timed half-mocks
  status: pending
  objective: Convert the completed Analysis blocks into independent subject performance using definitions/results
    from the script, HU-style tasks, gap-targeted external questions, and two timed Analysis half-mocks.
    Combined switching and the full three-hour simulation belong only to the joint unit.
  done_when:
  - Produce a closed-book theorem ledger containing each exam-relevant definition/result, all assumptions,
    its trigger, and one application; do not copy full proofs.
  - Complete ana_inf_serieWV.pdf under its stated 30-45-minute-per-problem conditions and correct it against
    the script.
  - Use kleine_beweise only on proof or logic gaps already present in the error ledger, preserving its
    no-exam-prediction disclaimer.
  - Complete and grade one 90-minute Analysis-only mixed mock, repair every red error, then complete a
    fresh second 90-minute Analysis-only mock at least one day later.
  - Enter the joint unit only when every Analysis block has a passed cold gate or an explicit remaining
    repair item; do not add new sources in the final 72 hours.
  estimate_minutes: 540
  exam_critical: true
