- id: stage-m2-analysis-calibrate
  number: 1
  title: Calibrate the script-led method and exam boundary
  status: pending
  objective: 'Keep Analysis independent from Statistics. Calibrate the script-led loop: 10-minute cold
    diagnostic; intuition support from the stage menu only when the diagnostic shows a block; active pass
    through unser skript; current HU tasks before external drills; proof repair only when it explains
    a failed application; closed-book retrieval to finish.'
  done_when:
  - 'Explain from memory how Wiederholung, Ausflug, and Exkurs change study priority: Wiederholung is
    required, Ausflug is exam-light application context, and Exkurs is not exam-relevant.'
  - Record that the script prioritizes definitions, theorem assumptions/results, and application; proofs
    are used for understanding and are not memorized as a default.
  - Read the disclaimer in kleine_beweise.pdf and treat it as a repair list, not an exam prediction.
  - Complete one 20-minute cold sample from ana_inf_serieWV.pdf and start an error ledger classified as
    definition, theorem-condition, method-choice, algebra, or time error.
  exam_critical: true
  concepts:
  - concept-proof-technique
  scope_triage: required-now
  resources:
  - kind: read
    label: Course contract, notation, and chapter map
    source_id: source-analysis-skript
    locator: 'unser skript.pdf: printed pp. iv-x and contents pp. ii-iii (PDF pp. 2-10)'
    scope_triage: required-now
  - kind: read
    label: Tutor proof-list disclaimer and repair candidates
    source_id: source-analysis-skript
    locator: 'kleine_beweise.pdf: both pages'
    scope_triage: required-now
  - kind: practise
    label: Cold exam-style sample before studying
    source_id: source-analysis-skript
    locator: 'ana_inf_serieWV.pdf: choose one subproblem from WV1.1-WV1.4'
    scope_triage: required-now
  - kind: read
    label: Maths220 — Proofs in Calculus — how a limit or series proof is actually written on paper
    source_id: source-analysis-grundlagen-handouts
    locator: Maths220_Proofs-in-Calculus.pdf (17 pp) — read alongside kleine_beweise to see the same arguments
      written out
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-analysis-exam-prep/stages/stage-m2-analysis-calibrate/notes.md
  attachments: []
  source_feedback: []
- id: stage-m2-analysis-an0
  number: 2
  title: AN.0 - foundations and the real numbers
  status: pending
  objective: Rebuild only the prerequisites the script assumes, then make the real-number axioms, order,
    completeness, intervals, suprema/infima, powers, roots, and the computer-number excursion usable.
  done_when:
  - Define and use induction, intervals, absolute value, supremum, infimum, maximum, minimum, completeness,
    and the Archimedean consequence in the script's notation.
  - Solve the script examples and Serie 05 Aufgabe 5.4 without copying a proof; check boundary cases and
    distinguish supremum from maximum.
  - Summarize the Maschinenzahlen/Rundungsfehler Ausflug in five applied statements, without spending
    proof-drill time on it.
  - Pass a 15-minute closed-book gate containing one induction item, one sup/inf item, and one interval/absolute-value
    item.
  exam_critical: true
  concepts:
  - concept-real-numbers
  - concept-proof-technique
  scope_triage: required-now
