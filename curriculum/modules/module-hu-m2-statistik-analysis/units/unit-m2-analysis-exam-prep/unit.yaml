id: unit-m2-analysis-exam-prep
type: unit
module_id: module-hu-m2-statistik-analysis
component_id: component-m2-analysis
kind: exam-block
title: Analysis - script-led exam preparation
order: 100
scope: 'Learner-selected authority: Hella Rabus, unser skript.pdf (Stand 4 February 2025), introduction
  and Chapters 1-7. Wiederholung sections are required; Ausflug sections are exam-light application context;
  Exkurs sections and Chapter 8 are deferred as non-exam material. Current local HU series 05-09 and WV
  define the closest available exercise evidence. The script itself says proofs need not be memorized:
  definitions, theorem conditions/results, and application control the plan.'
status: ready
knowledge_map:
  summary: The script builds analysis in one dependency chain — the real numbers and completeness
    make limits of sequences meaningful; sequences underwrite series and function limits; continuity
    and differentiation follow from function limits; Taylor and Riemann integration are the two
    payoffs. Proof presentation runs alongside as a skill rather than a topic, because the script
    states proofs need not be memorized — definitions, theorem conditions and application carry the
    exam. Chapter 8 and the Exkurs sections are deliberately outside exam scope.
  nodes:
  - id: knowledge-an-foundations
    title: Foundations and the real numbers
    summary: Assumed prerequisites, real-number axioms, order, completeness, intervals, suprema and
      infima, powers and roots. Completeness is the load-bearing idea everything later rests on.
  - id: knowledge-an-proof-presentation
    title: Proof reading and presentation
    summary: Reading theorem conditions precisely and writing a correct, presentable argument. A
      cross-cutting skill, not a chapter — the script's kleine_beweise disclaimer sets the depth.
    builds_on:
    - knowledge-an-foundations
  - id: knowledge-an-sequences
    title: Sequences and convergence
    summary: Sequence definitions, epsilon-N arguments, accumulation points, subsequences, Cauchy
      sequences, monotone convergence and divergence criteria. Chapter 3 is the spine.
    builds_on:
    - knowledge-an-foundations
  - id: knowledge-an-series
    title: Series and convergence criteria
    summary: Necessary conditions, geometric and telescoping series, comparison, ratio, root and
      Leibniz criteria, absolute convergence. Chapter 4, best held as a decision process.
    builds_on:
    - knowledge-an-sequences
  - id: knowledge-an-limits-continuity
    title: Function limits and continuity
    summary: Sequence criteria for limits, one-sided and improper limits, continuity, the
      intermediate value theorem, inverse functions, extrema and the compact-interval theorems.
      Sections 5.1-5.5.
    builds_on:
    - knowledge-an-sequences
  - id: knowledge-an-exp-log-uniform
    title: Exponential, logarithm and uniform convergence
    summary: Exponential and logarithm laws kept computational, and the distinction between
      pointwise and uniform convergence at script depth. Sections 5.6-5.7.
    builds_on:
    - knowledge-an-limits-continuity
    - knowledge-an-series
  - id: knowledge-an-differentiation
    title: Differentiation and the mean-value theorems
    summary: The derivative definition and theorem chain — calculating derivatives, justifying
      extrema and monotonicity, Rolle and the mean-value theorem, l'Hospital.
    builds_on:
    - knowledge-an-limits-continuity
  - id: knowledge-an-taylor
    title: Taylor approximation
    summary: Taylor polynomials, the remainder and error bound, and approximation as a usable tool.
      Section 6.8; 6.9 excluded, 6.10 at Ausflug overview depth only.
    builds_on:
    - knowledge-an-differentiation
  - id: knowledge-an-integration
    title: Riemann integration and the fundamental theorem
    summary: Riemann sums, integrability, the fundamental theorem, substitution, integration by
      parts and improper integrals. Sections 7.1-7.3.
    builds_on:
    - knowledge-an-limits-continuity
    - knowledge-an-differentiation
  - id: knowledge-an-exam-transfer
    title: Retrieval, mixed practice and combined-M2 performance
    summary: Converting the blocks into exam performance — mixed retrieval across topics, HU
      exam-style tasks, timing, and combined M2 mocks alongside the SaD half.
    builds_on:
    - knowledge-an-series
    - knowledge-an-exp-log-uniform
    - knowledge-an-taylor
    - knowledge-an-integration
    - knowledge-an-proof-presentation
