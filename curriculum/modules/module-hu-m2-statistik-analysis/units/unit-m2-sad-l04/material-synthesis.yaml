  - concept-conditional-probability
  - concept-bayes-theorem
  - concept-conditional-independence
  - concept-naive-bayes
  contribution: 'Konzeptionelle Schiene der VL4: Framing-Quiz; SPAM-Setup mit 8 Mails; Ereignisraeume
    und Mengenoperationen; Laplace; finite Kolmogorov-Axiome mit teilbewiesenen Folgerungen (Vereinigungsskizze;
    Komplement genannt); Birthday-Beispiel mit expliziter Uniformitaet; bedingte Wahrscheinlichkeit mit
    E-Mail-Likelihoods; drei Unabhaengigkeitsbedingungen; Total/Bayes-Lemma ohne Beweis; Diagnostik-Beispiel;
    Secretary-Beispiel; bedingte Unabhaengigkeit in beide Richtungen; kategoriales Naive-Bayes-Modell
    mit Mengen-BoW, unnormiertem Argmax, demonstriertem Zero-Count, benannter Glaettung, Log-Raum, Komplexitaet
    und generativ/diskriminativ-Schluss.'
