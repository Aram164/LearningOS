route_assessments:
- assumptions: Endliche Ereignisraeume im Deck; Gleichwahrscheinlichkeit nur als Laplace-Sonderfall; Stationaritaet
    bei Haeufigkeitsschaetzung; Urnenmodell mit Zuruecklegen im Birthday-Beispiel; bedingte Unabhaengigkeit
    als NB-Modellannahme.
  best_for: Konzeptionelles Rueckgrat, Herleitungen, Annahmen und Modelldeutung inklusive Naive-Bayes-Formulierung.
  concept_ids:
