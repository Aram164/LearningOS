    scope_triage: required-now
    angle: The chair's own conditional-probability and Bayes questions, including how the Naive Bayes construction
      is asked.
    angle_detail: Naive Bayes has no textbook equivalent that matches this deck, so these exercises are the only
      reliable guide to what a classifier question looks like here — whether it asks for a computation over a
      small table or for the assumption to be stated and justified.
  - kind: watch
    label: StatQuest — Naive Bayes
    source_id: source-statquest
    locator: '''Naive Bayes, Clearly Explained'' (≈15 min)'
    scope_triage: helpful-now
    angle: Builds the spam classifier from counted word frequencies before writing any probability notation.
    angle_detail: 'The video''s order is the reverse of the lecture''s: it counts words in example messages, forms
      the products, and only then names what it has been doing as Naive Bayes with a conditional independence
      assumption. For a construction that looks arbitrary on slides, seeing the counting first makes the independence
      assumption''s role obvious — it is what lets the counts be multiplied. Pairs with the deck rather than replacing
      it; the deck''s notation is what the exam uses.'
  - kind: reference
    label: CS229 §4.2 — Naive Bayes event models
    source_id: source-cs229-notes
    locator: Main notes §4 Generative Learning algorithms — §4.2 Naive Bayes and §4.2.1 Laplace smoothing
    scope_triage: reference-only
    angle: The compact mathematical statement of the classifier L04 builds informally, in about four pages.
    angle_detail: Where the deck constructs the spam classifier by counting, CS229 writes the generative model,
      states the conditional-independence assumption formally, and derives the maximum-likelihood parameter estimates.
      Reading both gives the construction and its justification. The notes are terse and assume comfort with likelihood
      notation, so this is better after L08 than before it.
