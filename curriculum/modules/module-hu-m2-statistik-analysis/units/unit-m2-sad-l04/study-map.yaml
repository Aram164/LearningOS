    angle: Splits total probability and Bayes into two separately numbered sections, which is the derivation order
      L04's slide 46 skips.
    angle_detail: 'The 2026 deck states Bayes with the total-probability expansion already substituted into the
      denominator, so the step where the partition enters is invisible. Fahrmeir gives §4.6 (Satz von der totalen
      Wahrscheinlichkeit) its own statement and proof, then derives §4.7 (Bayes) from it, which is the missing
      half. It also gives the German phrasing of Unabhängigkeit as a product rule rather than as a conditional
      statement — worth reading because the Klausur can ask for either. Stops before Naive Bayes: the classifier
      construction is L04''s own, and no book on this shelf matches it exactly.'
  - kind: practise
    label: Arbeitsbuch Chapter 4 — conditional probability and Bayes
    source_id: source-fahrmeir-arbeitsbuch
    locator: Ch 4 Aufgaben pdf pp. 83-88, Lösungen pdf pp. 89-95
    scope_triage: helpful-now
    angle: Bayes and total probability in Vierfeldertafel form — the exact presentation German exams use.
    angle_detail: German statistics exams overwhelmingly pose conditional-probability questions as a four-field
      table or a tree, not as an algebraic identity, and grading follows the table. These solutions show the table
      being filled and read, which is the mechanical skill worth having automatic before the Klausur. Six pages
      of problems, seven of solutions — small enough to finish in one sitting.
  - kind: read
    label: Blitzstein Chapter 2 — conditioning and Bayes
    source_id: source-blitzstein-hwang
    locator: Ch 2 pdf pp. 62-119 (§2.2 definition and intuition p. 63; §2.3 Bayes' rule and the law of total probability
      p. 69; §2.5 independence of events p. 80; §2.7 conditioning as a problem-solving tool p. 85; §2.8 pitfalls
      and paradoxes p. 91; exercises §2.11 p. 100)
    scope_triage: helpful-now
    angle: Treats conditioning as the primary object — 'conditioning is the soul of statistics' — so Bayes arrives
      as a way of thinking rather than a formula to memorise.
    angle_detail: 'The one book here that opens the chapter by arguing conditional probability is the fundamental
      notion and unconditional probability the special case. That reframing is why §2.7 exists: a section on conditioning
      as a deliberate problem-solving move, which no other source on this shelf has. §2.8 catalogues the confusion
      of the inverse and the prosecutor''s fallacy — the same base-rate error L04''s framing slides open with,
      but named and dissected. Notation is measure-free and the register is conversational; it is slower than
      Fahrmeir but far more likely to make the idea stick. 60 exercises, many with published solutions on the
      book''s site.'
  - kind: reference
    label: Pitman — conditional probability selections
    source_id: source-pitman-probability
    locator: Ch 1 §1.4 Conditional Probability and Independence, pdf pp. 44-57; §1.5 Bayes' Rule, pdf pp. 58-66;
      §1.6 Sequences of Events, pdf pp. 67-89
    scope_triage: reference-only
    angle: Everything through tree diagrams and partitions drawn on the page — the most visual derivation of Bayes
      on the shelf.
    angle_detail: Pitman's method is to draw the partition and the tree, label every branch, and read the answer
      off the picture before writing any algebra; §1.5 derives Bayes' rule as a relabelling of a tree you have
      already drawn. That makes the role of the partition — the thing L04's slide 46 leaves implicit when it states
      Bayes with the denominator pre-expanded — impossible to miss. §1.6 then does sequences of events and the
      multiplication rule, which is the machinery behind the chain of conditional independence assumptions Naive
      Bayes rests on. Hundreds of worked examples; the exercises are harder than SaD needs, so pick rather than
      sweep.
  - kind: reference
    label: Ross — formal probability foundations
    source_id: source-ross-first-course
    locator: Ch 2 Axioms of Probability, pdf pp. 46-99 (§2.3 axioms; §2.5 sample spaces having equally likely
      outcomes); Ch 3 Conditional Probability and Independence, pdf pp. 100-197 (§3.3 Bayes's Formula; §3.4 Independent
      Events; §3.5 P(·|F) is a Probability)
    scope_triage: reference-only
    angle: 'The reference treatment: axioms stated formally, every derived rule proved from them, and independence
      given a full section with counterexamples.'
    angle_detail: 'Ross is the standard rigorous first course, and its value here is completeness rather than
      gentleness. Two things it has that the softer sources do not: §3.4 works through why pairwise independence
      does not imply mutual independence, with an explicit counterexample — the distinction L04''s independence
      node states and the exam can probe; and §3.5 proves that conditioning on a fixed event yields a genuine
      probability measure, which is the formal fact behind every ''just condition and continue'' move. Use it
      to settle a question, not to learn the topic from cold.'
  - kind: practise
    label: Schaum — probability and Bayes worked problems
    source_id: source-schaums-probability
    locator: Ch 3 Introduction to Probability, pdf pp. 40-55; Ch 4 Conditional Probability and Independence, pdf
      pp. 56-75 (every problem carries a full worked solution)
    scope_triage: helpful-now
    angle: 'Pure volume: dozens of short solved problems per chapter, sorted by difficulty, with no exposition
      to read around them.'
    angle_detail: Schaum's is a problem book with the theory compressed into a two-page summary at each chapter
      head. That makes it the wrong first exposure and the right thing to open when the concept is understood
      and the calculation is not yet automatic — the state most students are in a week before the Klausur. The
      problems are short enough to do in batches of ten, and every one is solved in full. This is a scanned older
      edition, so notation occasionally differs from the lecture's; treat the deck as authoritative where they
      disagree.
  - kind: read
    label: OpenIntro — probability foundations
    source_id: source-openintro-statistics
    locator: Ch 3 §3.1 defining probability, pdf pp. 81-94; §3.2 conditional probability, pdf pp. 95-111 (tree
      diagrams and Bayes' theorem); §3.3 sampling from a small population, pdf pp. 112-114
    scope_triage: helpful-now
    angle: Runs conditional probability entirely through tree diagrams and contingency tables, so Bayes is arithmetic
      on a table before it is an equation.
    angle_detail: '§3.2 develops the whole of conditioning pictorially: a two-way table, then a tree with branch
      probabilities, then Bayes as a ratio read off the tree. Only at the end does the algebraic form appear.
      For a first pass this is the lowest-friction route available, and it matches how German exams pose the question
      (Vierfeldertafel). It does not cover Naive Bayes and does not do conditional independence carefully — for
      those parts of L04 use the deck and Kelleher Ch 6.'
  - kind: practise
    label: Dekking — probability exercise bank
    source_id: source-dekking-mips
    locator: Ch 2 outcomes, events, and probability, pdf pp. 24-35; Ch 3 conditional probability and independence,
      pdf pp. 36-51 (§3.3 law of total probability and Bayes' rule p. 41; §3.4 independence p. 43; exercises p.
      48); answers App C pdf pp. 434-442
    scope_triage: helpful-now
    angle: Quick exercises embedded mid-section with solutions at the chapter end — a self-check every few pages
      rather than only at the end.
    angle_detail: 'The structural feature that distinguishes this book: each section plants short ''quick exercises''
      in the flow and answers them at §x.5 before the real exercise set. For probability rules, where the failure
      mode is silent misunderstanding rather than difficulty, that rhythm catches errors within a page instead
      of after a chapter. The treatment itself is compact and modern; Ch 2 is twelve pages for material Fahrmeir
      spends twenty on. Ch 1''s Monty Hall opening (p. 16) is the same framing puzzle L04 uses.'
  - kind: read
    label: MIT 18.05 — probability notes and solved problems
    source_id: source-mit-1805
    locator: 'Classes: Reading and In-class Materials: ''Conditional Probability, Independence and Bayes'' Theorem''
      reading and slides; Problem Set 2 with its published solutions'
    scope_triage: helpful-now
    angle: Reading, in-class problems and solved problem set for the same topic, published together — a complete
      study loop rather than one artifact.
    angle_detail: 18.05 publishes, per class, a reading, the slides used on it, the in-class problems and the
      solutions, plus a problem set with worked answers. That means one topic can be learned, practised and checked
      without leaving the page — the thing a lecture deck alone cannot give you. Its treatment of the base-rate
      fallacy is unusually direct and matches L04's opening framing slides. Written for students who have had
      multivariable calculus, so the register sits above OpenIntro and below Ross.
  - kind: reference
    label: Harvard Stat 110 — conditioning and Bayes lectures
    source_id: source-stat110
    locator: Lectures 2-4 (conditional probability, Bayes' rule, independence) with the matching sections of the
      Stat 110 strategic-practice sheets and their solutions
    scope_triage: reference-only
    angle: Blitzstein lecturing his own book — the same argument delivered twice, in print and on video.
    angle_detail: 'This is the video companion to Blitzstein & Hwang, so choosing between them is a format decision
      rather than a content decision: the definitions, notation and examples line up section by section. The lectures
      add the thing the book cannot — hearing which step he considers the difficult one, and watching him refuse
      to write the algebra until the story is clear. The strategic-practice sheets are graded from routine to
      hard with full solutions.'
  - kind: practise
    label: FAU solved exam — independence and Bayes
    source_id: source-fau-klausur-ws1415
    locator: FAU-Erlangen_Statistik-Klausur_WS14-15_mit-Loesungen.pdf — the Unabhängigkeit, 4-Feldertafel and
      Bayes questions with solutions
    scope_triage: helpful-now
    angle: Independence tested as a computation (does P(A∩B) = P(A)P(B)?) rather than as a definition to recite.
    angle_detail: German exams typically test independence by giving a table and asking whether two events are
      independent, which requires the product check rather than the definition. Seeing that form once before the
      exam is worth several textbook exercises on the same topic.
  - kind: practise
    label: External German solved exams — probability and Bayes block
    source_id: source-sad-klausuren-extern
    locator: 'materials/.../sad-klausuren-extern/: the probability and Bayes questions in the solved papers'
    scope_triage: helpful-now
    angle: The largest supply of authentic Vierfeldertafel and tree-based Bayes items available.
    angle_detail: This is the topic where external banks align best with SaD, because conditional probability
      is taught almost identically everywhere in German programmes. Highest-yield section of the bank.
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l04/stages/stage-sad-l04-independence/notes.md
