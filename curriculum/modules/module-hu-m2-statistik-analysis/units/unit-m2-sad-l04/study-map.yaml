    vault_path: material://source-sad-ss26-lectures/lecture-slides/04_probability.pdf
    scope_triage: required-now
    angle: Controls the probability notation for the whole module, and builds the categorical Naive Bayes classifier
      that L14 later extends.
    angle_detail: 'The largest deck in the statistics half and the one with the widest span: framing puzzles,
      axioms, conditioning, Bayes, independence, then a full classifier. Its one known gap is slide 46, which
      states Bayes with the total-probability expansion already substituted into the denominator, so the partition
      step is invisible — Fahrmeir §4.6 supplies it and a repository note records the proof. The Naive Bayes construction
      at the end has no exact equivalent in any book here; the deck is authoritative for it.'
  - kind: practise
    label: Blatt 2 and UE3 — probability and Bayes tasks
    source_id: source-sad-uebungen
