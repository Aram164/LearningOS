      branch probabilities, then Bayes as a ratio read off the tree. Only at the end does the algebraic
      form appear. For a first pass this is the lowest-friction route available, and it matches how German
      exams pose the question (Vierfeldertafel). It does not cover Naive Bayes and does not do conditional
      independence carefully — for those parts of L04 use the deck and Kelleher Ch 6.'
