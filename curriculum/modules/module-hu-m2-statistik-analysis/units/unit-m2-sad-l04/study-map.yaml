      p. 48); answers App C pdf pp. 434-442
    angle: Quick exercises embedded mid-section with solutions at the chapter end — a self-check every
      few pages rather than only at the end.
    angle_detail: 'The structural feature that distinguishes this book: each section plants short ''quick
      exercises'' in the flow and answers them at §x.5 before the real exercise set. For probability rules,
      where the failure mode is silent misunderstanding rather than difficulty, that rhythm catches errors
      within a page instead of after a chapter. The treatment itself is compact and modern; Ch 2 is twelve
      pages for material Fahrmeir spends twenty on. Ch 1''s Monty Hall opening (p. 16) is the same framing
      puzzle L04 uses.'
    vault_path: material://source-dekking-mips/dekking.pdf
    scope_triage: helpful-now
    source_id: source-dekking-mips
    route_id: route-fa96784fa40036436bf1b2cc
  - kind: reference
    label: Pitman — conditional probability selections
    locator: Ch 1 §1.4 Conditional Probability and Independence, pdf pp. 44-57; §1.5 Bayes' Rule, pdf
      pp. 58-66; §1.6 Sequences of Events, pdf pp. 67-89
    angle: Everything through tree diagrams and partitions drawn on the page — the most visual derivation
      of Bayes on the shelf.
    angle_detail: Pitman's method is to draw the partition and the tree, label every branch, and read
      the answer off the picture before writing any algebra; §1.5 derives Bayes' rule as a relabelling
      of a tree you have already drawn. That makes the role of the partition — the thing L04's slide 46
      leaves implicit when it states Bayes with the denominator pre-expanded — impossible to miss. §1.6
      then does sequences of events and the multiplication rule, which is the machinery behind the chain
      of conditional independence assumptions Naive Bayes rests on. Hundreds of worked examples; the exercises
      are harder than SaD needs, so pick rather than sweep.
    vault_path: material://source-pitman-probability/pitman.pdf
    scope_triage: reference-only
    source_id: source-pitman-probability
    route_id: route-510e0c869360f72413e11c13
  - kind: reference
    label: Ross — formal probability foundations
    locator: Ch 2 Axioms of Probability, pdf pp. 46-99 (§2.3 axioms; §2.5 sample spaces having equally
      likely outcomes); Ch 3 Conditional Probability and Independence, pdf pp. 100-197 (§3.3 Bayes's Formula;
      §3.4 Independent Events; §3.5 P(·|F) is a Probability)
    angle: 'The reference treatment: axioms stated formally, every derived rule proved from them, and
      independence given a full section with counterexamples.'
    angle_detail: 'Ross is the standard rigorous first course, and its value here is completeness rather
      than gentleness. Two things it has that the softer sources do not: §3.4 works through why pairwise
      independence does not imply mutual independence, with an explicit counterexample — the distinction
      L04''s independence node states and the exam can probe; and §3.5 proves that conditioning on a fixed
      event yields a genuine probability measure, which is the formal fact behind every ''just condition
      and continue'' move. Use it to settle a question, not to learn the topic from cold.'
    vault_path: material://source-ross-first-course/ross.pdf
    scope_triage: reference-only
    source_id: source-ross-first-course
    route_id: route-8de21f881a829cb3dec1d55d
  - kind: practise
    label: Schaum — probability and Bayes worked problems
    locator: Ch 3 Introduction to Probability, pdf pp. 40-55; Ch 4 Conditional Probability and Independence,
      pdf pp. 56-75 (every problem carries a full worked solution)
    angle: 'Pure volume: dozens of short solved problems per chapter, sorted by difficulty, with no exposition
      to read around them.'
    angle_detail: Schaum's is a problem book with the theory compressed into a two-page summary at each
      chapter head. That makes it the wrong first exposure and the right thing to open when the concept
      is understood and the calculation is not yet automatic — the state most students are in a week before
      the Klausur. The problems are short enough to do in batches of ten, and every one is solved in full.
      This is a scanned older edition, so notation occasionally differs from the lecture's; treat the
      deck as authoritative where they disagree.
    vault_path: material://source-schaums-probability/schaums-probability.pdf
    scope_triage: helpful-now
    source_id: source-schaums-probability
    route_id: route-f99c92614d78638f193ab4d3
