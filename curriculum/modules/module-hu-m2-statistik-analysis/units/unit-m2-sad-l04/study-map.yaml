  - kind: read
    label: Blitzstein Chapter 2 — conditioning and Bayes
    source_id: source-blitzstein-hwang
    locator: Ch 2 pdf pp. 62-119 (§2.2 definition and intuition p. 63; §2.3 Bayes' rule and the law of total probability
      p. 69; §2.5 independence of events p. 80; §2.7 conditioning as a problem-solving tool p. 85; §2.8 pitfalls
      and paradoxes p. 91; exercises §2.11 p. 100)
    scope_triage: helpful-now
    angle: Treats conditioning as the primary object — 'conditioning is the soul of statistics' — so Bayes arrives
      as a way of thinking rather than a formula to memorise.
    angle_detail: 'The one book here that opens the chapter by arguing conditional probability is the fundamental
      notion and unconditional probability the special case. That reframing is why §2.7 exists: a section on conditioning
      as a deliberate problem-solving move, which no other source on this shelf has. §2.8 catalogues the confusion
      of the inverse and the prosecutor''s fallacy — the same base-rate error L04''s framing slides open with,
      but named and dissected. Notation is measure-free and the register is conversational; it is slower than
      Fahrmeir but far more likely to make the idea stick. 60 exercises, many with published solutions on the
      book''s site.'
  - kind: reference
    label: Pitman — conditional probability selections
    source_id: source-pitman-probability
    locator: Ch 1 §1.4 Conditional Probability and Independence, pdf pp. 44-57; §1.5 Bayes' Rule, pdf pp. 58-66;
      §1.6 Sequences of Events, pdf pp. 67-89
    scope_triage: reference-only
    angle: Everything through tree diagrams and partitions drawn on the page — the most visual derivation of Bayes
