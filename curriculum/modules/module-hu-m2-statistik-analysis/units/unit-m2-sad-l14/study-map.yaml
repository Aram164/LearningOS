  state: none
stages:
- id: stage-sad-l14-nb-recap
  number: 1
  title: Naive Bayes decision rule
  status: pending
  objective: Class priors multiply with feature likelihoods under conditional independence, and the largest
    posterior score determines the class without needing the shared evidence denominator.
  done_when:
  - 'Reproduce without notes: Class priors multiply with feature likelihoods under conditional independence,
    and the largest posterior score determines the class without needing the shared evidence denominator.'
  - Work UE6 — probability-based classification tasks, then the remaining 1, and record every miss with
    the step it failed at.
  exam_critical: true
  concepts:
  - concept-naive-bayes
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L14 probability-based learning deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/14_probability_based.pdf (29 pages) — Extends L04's categorical classifier
      through smoothing, numerical and count likelihoods, stable log computation, and Bayesian-network
      dependence structure.
    scope_triage: required-now
  - kind: practise
    label: UE6 — probability-based classification tasks
    source_id: source-sad-uebungen
    locator: exercise-slides/UE6.pdf probability-based learning section — Course-native Naive Bayes classification
      and probability calculations, connecting the L04 base model to L14's smoothing and numeric-feature
      extensions.
    scope_triage: required-now
  - kind: reference
    label: MIT 18.650 Bayesian-statistics lectures — context only
    source_id: source-mit-18650
    locator: Lectures 17–18 — Optional Bayesian inference context. It is not a Bayesian-network tutorial
      and does not replace L14's graph/factorization material.
    scope_triage: reference-only
  - kind: watch
    label: StatQuest — Naive Bayes and Gaussian Naive Bayes
    source_id: source-statquest
    locator: Naive Bayes; Gaussian Naive Bayes; Logistic Regression as contrast only — Visual refresh
      of the base classifier and the Normal-density extension; Logistic Regression is only a discriminative
      contrast, not part of the L14 model family.
    scope_triage: helpful-now
  - kind: read
    label: Kelleher Chapter 6 — probability-based learning
    source_id: source-kelleher-fmlpda
    locator: Chapter 6, especially §6.4.2 — Primary course-aligned Naive Bayes source with worked categorical
      and continuous-feature examples, supporting smoothing and Gaussian likelihoods.
    scope_triage: helpful-now
  - kind: read
    label: ISLP §4.4.4 and lab — Naive Bayes in application
    source_id: source-islp
    locator: §4.4.4 and relevant lab — Compact Gaussian Naive Bayes definition plus Python lab context;
      useful for application, not for the Bayesian-network section.
    scope_triage: helpful-now
  - kind: read
    label: Kroese — probability-based classifier selections
    source_id: source-kroese-dsml
    locator: Probabilistic classification selections — Broader DS/ML reference for probabilistic classification
      and density modeling; the lecture remains the authority for Laplace and Bayesian-network details.
    scope_triage: helpful-now
  - kind: reference
    label: CS229 §4.2 — Naive Bayes derivation
    source_id: source-cs229-notes
    locator: §4.2 selections — Formal categorical/multinomial event-model treatment and log-likelihood
      perspective beyond Kelleher; no Bayesian-network coverage.
    scope_triage: reference-only
  - kind: reference
    label: Stanford CS229 — generative-classifier lecture
    source_id: source-cs229-2022-videos
    locator: Topic-matched generative learning/Naive Bayes lecture — Advanced lecture treatment of Naive
      Bayes/event models for derivational depth beyond the current course examples.
    scope_triage: reference-only
  - kind: reference
    label: CSC411 notes — compact Naive Bayes reference
    source_id: source-csc411-notes
    locator: Naive Bayes selections — Independent concise classifier treatment when Kelleher and CS229
      wording do not resolve a derivation gap.
    scope_triage: reference-only
  - kind: practise
    label: Cornell CS4780 HW4 - solution-backed Naive Bayes problems
    source_id: source-cs4780-homeworks
    locator: 2018Fall/HW4 Problem 1 'Intuition for Naive Bayes' (hw4.pdf with hw4_solution.pdf); 2018Spring/HW4
      Naive Bayes with smoothing (hw4.pdf, solutions in hw4_solutions.tex) — L14's only current practice
      asset is the UE6 probability-based section; HW4 adds a solution-backed Naive Bayes intuition problem
      and a smoothing exercise, which is the written-exam format the smoothing slides otherwise never
      get tested in.
    scope_triage: helpful-now
  - kind: read
    label: Zacharski Ch 6 - Naive Bayes with the zero-frequency failure exposed
    source_id: source-zacharski-data-mining
    locator: Chapter 6, pp. 226-296 — Builds the classifier on counts, hits the zero-probability case,
      and applies smoothing - the same sequence as L14 slides 8-12, but with the intermediate tables visible
      so the smoothed denominator can be checked.
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l14/stages/stage-sad-l14-nb-recap/notes.md
  attachments: []
  source_feedback: []
