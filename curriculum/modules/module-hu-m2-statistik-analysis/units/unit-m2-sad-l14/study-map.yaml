- id: stage-sad-l14-bayes-net
  number: 6
  title: Bayesian networks and factorization
  status: pending
  objective: A directed acyclic graph encodes local conditional dependencies, factorizing a joint distribution
    without assuming that all features are independent given the class.
  done_when:
  - 'Reproduce without notes: A directed acyclic graph encodes local conditional dependencies, factorizing a joint
    distribution without assuming that all features are independent given the class.'
  exam_critical: true
  concepts:
  - concept-bayesian-network
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L14 probability-based learning deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/14_probability_based.pdf, 29 slides
    scope_triage: required-now
    angle: Extends L04's categorical classifier to smoothing, numeric attributes and Gaussian/multinomial variants,
      then opens Bayesian networks.
    angle_detail: The shortest deck in the second half, and its last third — Bayesian networks, factorization,
      Markov blankets — is genuinely different material introduced quickly. The Naive Bayes extensions are examinable
      computations; the network material is more likely to be examined conceptually. Marsland Ch 16 is the only
      route here that treats the network half at comparable length.
  - kind: read
    label: Marsland Ch 16 - Bayesian networks and the Markov blanket
    source_id: source-marsland-ml-algorithmic
    locator: Chapter 16, pp. 342-379 (conditional independence p. 342; Bayesian networks p. 343; Markov blanket
      p. 349)
    scope_triage: helpful-now
    angle: L14 slides 25-29 are the only place the module taught Bayesian networks, factorisation and the Markov
      blanket, and no other registered source covered them; this chapter derives the factorisation from the graph
      and defines the blanket as the locally sufficient set.
    angle_detail: The only route on this stage that treats L14's last third — Bayesian networks — at real length.
      Conditional independence (p. 342) is developed as a graph property, networks (p. 343) as factorisations
      of a joint distribution, and the Markov blanket (p. 349) as the set that renders a node independent of everything
      else. The deck introduces all three in a handful of slides. Read this if the network material is examined
      conceptually, which the exercises suggest.
