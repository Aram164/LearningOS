- id: stage-sad-l14-bayes-net
  number: 6
  title: Bayesian networks and factorization
  status: pending
  objective: A directed acyclic graph encodes local conditional dependencies, factorizing a joint distribution
    without assuming that all features are independent given the class.
  done_when:
  - 'Reproduce without notes: A directed acyclic graph encodes local conditional dependencies, factorizing
    a joint distribution without assuming that all features are independent given the class.'
  exam_critical: true
  concepts:
  - concept-bayesian-network
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L14 probability-based learning deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/14_probability_based.pdf, 29 slides
    angle: Extends L04's categorical classifier to smoothing, numeric attributes and Gaussian/multinomial
      variants, then opens Bayesian networks.
    angle_detail: The shortest deck in the second half, and its last third — Bayesian networks, factorization,
      Markov blankets — is genuinely different material introduced quickly. The Naive Bayes extensions
      are examinable computations; the network material is more likely to be examined conceptually. Marsland
      Ch 16 is the only route here that treats the network half at comparable length.
    vault_path: material://source-sad-ss26-lectures/lecture-slides/14_probability_based.pdf
    scope_triage: required-now
  - kind: reference
    label: Bishop Ch 8 — graphical models and conditional independence
    source_id: source-bishop-prml
    locator: Ch 8 'Graphical Models' §8.1 Bayesian networks, §8.2 conditional independence (including
      d-separation), §8.3.6 the Markov blanket
    angle: Gives the graphical criterion (d-separation) for reading conditional independence off a network,
      which L14 states only for the naive case.
    angle_detail: L14 introduces Bayesian networks and asserts that the graph encodes conditional independence.
      §8.2 supplies the actual rule for reading it — which paths block information and which do not —
      with the three canonical three-node cases worked through. That is the difference between recognising
      a network and being able to use one. §8.3.6 defines the Markov blanket precisely, which L14's last
      slides name. Free PDF from Microsoft Research; reference-level and demanding.
    scope_triage: reference-only
  - kind: read
    label: Marsland Ch 16 - Bayesian networks and the Markov blanket
    source_id: source-marsland-ml-algorithmic
    locator: Chapter 16, pp. 342-379 (conditional independence p. 342; Bayesian networks p. 343; Markov
      blanket p. 349)
    angle: L14 slides 25-29 are the only place the module taught Bayesian networks, factorisation and
      the Markov blanket, and no other registered source covered them; this chapter derives the factorisation
      from the graph and defines the blanket as the locally sufficient set.
    angle_detail: The only route on this stage that treats L14's last third — Bayesian networks — at real
      length. Conditional independence (p. 342) is developed as a graph property, networks (p. 343) as
      factorisations of a joint distribution, and the Markov blanket (p. 349) as the set that renders
      a node independent of everything else. The deck introduces all three in a handful of slides. Read
      this if the network material is examined conceptually, which the exercises suggest.
    scope_triage: helpful-now
