    label: Zacharski Ch 7 - the bag-of-words model behind Multinomial Bayes
    source_id: source-zacharski-data-mining
    locator: Chapter 7, pp. 297-333
    angle: L14 slides 20-23 introduce the multinomial model through documents as bags of words; this chapter
      is that model implemented on text, including the log-space handling the deck mentions only in passing.
    angle_detail: The bag-of-words representation built explicitly — tokenising documents, counting, and
