    source_id: source-cs229-problem-sets
    locator: The problem set containing the Naive Bayes spam-classification problem, plus the generative-model
      questions on the practice midterms, with their published solutions
    angle: Asks for the maximum-likelihood estimates to be derived, not just applied — the step L14 states
      as a result.
    angle_detail: The classic CS229 problem has you write the likelihood of the training corpus under
      the naive model, differentiate, and obtain the counting formulas the lecture simply hands you. Doing
      that once explains why the parameter estimates are ratios of counts, and it makes the smoothing
      correction visible as a modification of the estimator rather than an arbitrary +1. Solutions published.
    scope_triage: helpful-now
  - kind: reference
    label: CS229 §4.2 — Naive Bayes derivation
    source_id: source-cs229-notes
    locator: cs229-notes.pdf §4.2 Naive Bayes p. 43, §4.2.1 Laplace smoothing p. 46, §4.2.2 Event models
      for text classification p. 48
    angle: Distinguishes the multinomial from the Bernoulli event model explicitly, which L14 blurs.
    angle_detail: '§4.2.2 is why this route exists on L14 rather than only on L04: it separates the multinomial
      event model from the Bernoulli one explicitly, and shows that they give different likelihoods for
      the same document. L14 extends the categorical classifier without naming which event model it is
      using, so this is the section that makes the distinction sayable — and it is the kind of distinction
      an exam question can turn on.'
    vault_path: material://source-cs229-notes/cs229-notes.pdf
    scope_triage: reference-only
  - kind: reference
    label: Stanford CS229 — generative-classifier lecture
    source_id: source-cs229-2022-videos
    locator: The 2022 lecture on generative learning algorithms (GDA and Naive Bayes)
    angle: Sets up the generative-versus-discriminative distinction, which is the category Naive Bayes
      belongs to and which L14 never names.
    angle_detail: Modelling P(x|y) and P(y) and inverting with Bayes, versus modelling P(y|x) directly,
      is the single most clarifying distinction in classification — it explains why Naive Bayes needs
      smoothing and logistic regression does not, and why Naive Bayes can be trained on less data. L14
      works entirely inside the generative branch without saying so. One lecture, high return.
