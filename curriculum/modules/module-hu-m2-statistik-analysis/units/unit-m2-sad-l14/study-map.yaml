source_plan:
  path: curriculum/modules/module-hu-m2-statistik-analysis/source-map.yaml
  provenance: operator
detours: []
shelving:
  state: none
stages:
- id: stage-sad-l14-nb-recap
  number: 1
  title: Naive Bayes decision rule
  status: pending
  objective: Class priors multiply with feature likelihoods under conditional independence, and the largest
    posterior score determines the class without needing the shared evidence denominator.
  done_when:
  - 'Reproduce without notes: Class priors multiply with feature likelihoods under conditional independence,
    and the largest posterior score determines the class without needing the shared evidence denominator.'
  - Work UE4, slides 9-12 — categorical Naive Bayes worked example, then the remaining 2, and record every
    miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-conditional-independence
  - concept-naive-bayes
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L14 probability-based learning deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/14_probability_based.pdf, 29 slides
    angle: Extends L04's categorical classifier to smoothing, numeric attributes and Gaussian/multinomial
      variants, then opens Bayesian networks.
    angle_detail: The shortest deck in the second half, and its last third — Bayesian networks, factorization,
      Markov blankets — is genuinely different material introduced quickly. The Naive Bayes extensions
      are examinable computations; the network material is more likely to be examined conceptually. Marsland
      Ch 16 is the only route here that treats the network half at comparable length.
    vault_path: material://source-sad-ss26-lectures/lecture-slides/14_probability_based.pdf
    scope_triage: required-now
  - kind: practise
    label: UE4, slides 9-12 — categorical Naive Bayes worked example
    source_id: source-sad-uebungen
    locator: exercise-slides/UE4.pdf, slides 9-12
    angle: Rebuilds the two-feature categorical classifier and exposes the conditional-independence assumption
      before L14 extends it.
    angle_detail: 'This is the current worked tutorial for the named task. Use it after an unaided attempt:
      its value is the course''s calculation order and notation, while reading it first would turn an
      exam-relevant retrieval task into passive recognition. It is a recap bridge: it does not cover Gaussian/count
      likelihoods or Bayesian networks.'
    vault_path: material://source-sad-ss26-lectures/exercise-slides/UE4.pdf
    scope_triage: required-now
  - kind: read
    label: Kelleher Chapter 6 — probability-based learning
    source_id: source-kelleher-fmlpda
    locator: Ch 6 Probability-based Learning, pdf pp. 282-350 (§6.4.2 the Naive Bayes model; the smoothing
      and continuous-feature sections)
    angle: Covers Naive Bayes and Bayesian networks in one chapter, so the classifier is visibly the simplest
      network rather than a separate method.
    angle_detail: L14 introduces Naive Bayes and then, separately, Bayesian networks, and the connection
      between them is asserted late. Kelleher builds the network formalism first and derives Naive Bayes
      as the network in which every feature depends only on the class — at which point the 'naive' assumption
      is a graph statement rather than an algebraic convenience. That is the cleanest available account
      of L14's structure. Smoothing and the continuous-feature handling are worked with numbers.
    vault_path: material://source-kelleher-fmlpda/kelleher.pdf
    scope_triage: helpful-now
  - kind: read
    label: ISLP §4.4.4 and lab — Naive Bayes in application
    source_id: source-islp
    locator: Ch 4 Classification, pdf pp. 144-208 — §4.4.4 Naive Bayes and the Ch 4 lab (Naive Bayes on
      the Smarket data)
    angle: Places Naive Bayes beside LDA and QDA, so its assumption is visible as one point on a spectrum
      of covariance assumptions.
    angle_detail: '§4.4 develops LDA (shared covariance), QDA (per-class covariance) and then Naive Bayes
      (diagonal covariance — features conditionally independent) as three points on the same spectrum.
      That framing answers the question L14 leaves open: what is actually being given up by the naive
      assumption, and when does giving it up pay. The lab then runs all three on the same data so the
      trade-off is observed rather than argued.'
    vault_path: material://source-islp/islp.pdf
    scope_triage: helpful-now
  - kind: read
    label: Jurafsky & Martin Ch 4 §§4.4-4.7 — smoothing, unknown words and evaluation
    source_id: source-jurafsky-slp3
    locator: Ch 4 §4.4 optimizing for sentiment analysis, §4.5 naive Bayes as a language model, §4.7 evaluation
      (precision, recall, F-measure), plus the add-one smoothing treatment in §4.2
    angle: Derives add-one smoothing as a response to the unknown-word problem, and shows the log-space
      computation that makes it numerically usable.
    angle_detail: 'Two L14 details are handled better here than anywhere else on the shelf. First, smoothing
      arrives because a single unseen word zeroes the entire product — the failure is shown before the
      fix. Second, §4.2 explains why the computation is done by summing logs rather than multiplying probabilities:
      with a few hundred words the product underflows to zero in floating point. L14''s multinomial node
      mentions log space; this says why it is not optional.'
    scope_triage: helpful-now
  - kind: reference
    label: scikit-learn user guide §1.9 — naive Bayes variants
    source_id: source-sklearn-user-guide
    locator: 'User guide §1.9 ''Naive Bayes'': §1.9.1 Gaussian, §1.9.2 Multinomial, §1.9.3 Complement,
      §1.9.4 Bernoulli, §1.9.5 Categorical'
    angle: Lists all five variants side by side with the data type each assumes — the cleanest statement
      of what changes between them.
    angle_detail: 'L14 covers the Gaussian and multinomial variants and mentions that others exist. Seeing
      all five in one table makes the pattern explicit: the classifier is fixed and only the likelihood
      term changes with the feature type. Once that is clear, the variants stop being separate algorithms
      to memorise. The smoothing parameter alpha is documented alongside, with the default and its effect.'
    scope_triage: helpful-now
  - kind: practise
    label: CS229 problem sets — the Naive Bayes and generative-model problems
    source_id: source-cs229-problem-sets
    locator: The problem set containing the Naive Bayes spam-classification problem, plus the generative-model
      questions on the practice midterms, with their published solutions
    angle: Asks for the maximum-likelihood estimates to be derived, not just applied — the step L14 states
      as a result.
    angle_detail: The classic CS229 problem has you write the likelihood of the training corpus under
      the naive model, differentiate, and obtain the counting formulas the lecture simply hands you. Doing
      that once explains why the parameter estimates are ratios of counts, and it makes the smoothing
      correction visible as a modification of the estimator rather than an arbitrary +1. Solutions published.
    scope_triage: helpful-now
  - kind: reference
    label: Bishop Ch 8 — graphical models and conditional independence
    source_id: source-bishop-prml
    locator: Ch 8 'Graphical Models' §8.1 Bayesian networks, §8.2 conditional independence (including
      d-separation), §8.3.6 the Markov blanket
    angle: Gives the graphical criterion (d-separation) for reading conditional independence off a network,
      which L14 states only for the naive case.
    angle_detail: L14 introduces Bayesian networks and asserts that the graph encodes conditional independence.
      §8.2 supplies the actual rule for reading it — which paths block information and which do not —
      with the three canonical three-node cases worked through. That is the difference between recognising
      a network and being able to use one. §8.3.6 defines the Markov blanket precisely, which L14's last
      slides name. Free PDF from Microsoft Research; reference-level and demanding.
    scope_triage: reference-only
  - kind: reference
    label: MIT 18.650 Bayesian-statistics lectures — context only
    source_id: source-mit-18650
    locator: 'Lectures 17-18 (Bayesian inference: priors, posteriors, and the Bayesian-frequentist contrast);
      reference only'
    angle: Places Naive Bayes inside the Bayesian inference framework it borrows its name from.
    angle_detail: L14's classifier applies Bayes' rule to features but is otherwise a frequentist procedure
      with plug-in estimates. These lectures set out what a genuinely Bayesian treatment would be — a
      prior over parameters, a posterior, and prediction by integration — which clarifies exactly how
      much of 'Bayes' the classifier actually uses. Useful for conceptual hygiene, not for the exam.
    scope_triage: reference-only
  - kind: watch
    label: StatQuest — Naive Bayes and Gaussian Naive Bayes
    source_id: source-statquest
    locator: '''Naive Bayes, Clearly Explained''; ''Gaussian Naive Bayes, Clearly Explained'' (≈15 min
      each); ''Logistic Regression'' only as a contrast'
    angle: The Gaussian video shows why a density replaces a count for numeric features, which is L14's
      least intuitive step.
    angle_detail: Moving from multinomial to Gaussian Naive Bayes means the likelihood stops being a proportion
      and becomes a density evaluation, and the resulting number is no longer a probability. That shift
      is where L14's numeric-attribute node loses people. The video draws the fitted Normal per class
      per feature and reads values off it, which makes the substitution concrete. Watch the categorical
      video first even if you have seen it for L04.
    scope_triage: helpful-now
  - kind: read
    label: Kroese — probability-based classifier selections
    source_id: source-kroese-dsml
    locator: Ch 7 Classification, pdf pp. 269-304 (the Bayes classifier and generative classifiers)
    angle: Derives the Bayes-optimal classifier first, so Naive Bayes is visibly an approximation to a
      known ideal.
    angle_detail: The Bayes classifier — assign to the class with the highest true posterior — is the
      best possible classifier and is unavailable because the posterior is unknown. Kroese establishes
      that baseline before any practical method, which turns Naive Bayes into a specific, understandable
      approximation of it rather than a standalone algorithm. That framing is missing from L14 and makes
      the smoothing and independence assumptions easier to reason about.
    vault_path: material://source-kroese-dsml/kroese.pdf
    scope_triage: helpful-now
  - kind: reference
    label: CS229 §4.2 — Naive Bayes derivation
    source_id: source-cs229-notes
    locator: cs229-notes.pdf §4.2 Naive Bayes p. 43, §4.2.1 Laplace smoothing p. 46, §4.2.2 Event models
      for text classification p. 48
    angle: Distinguishes the multinomial from the Bernoulli event model explicitly, which L14 blurs.
    angle_detail: '§4.2.2 is why this route exists on L14 rather than only on L04: it separates the multinomial
      event model from the Bernoulli one explicitly, and shows that they give different likelihoods for
      the same document. L14 extends the categorical classifier without naming which event model it is
      using, so this is the section that makes the distinction sayable — and it is the kind of distinction
      an exam question can turn on.'
    vault_path: material://source-cs229-notes/cs229-notes.pdf
    scope_triage: reference-only
  - kind: reference
    label: Stanford CS229 — generative-classifier lecture
    source_id: source-cs229-2022-videos
    locator: The 2022 lecture on generative learning algorithms (GDA and Naive Bayes)
    angle: Sets up the generative-versus-discriminative distinction, which is the category Naive Bayes
      belongs to and which L14 never names.
    angle_detail: Modelling P(x|y) and P(y) and inverting with Bayes, versus modelling P(y|x) directly,
      is the single most clarifying distinction in classification — it explains why Naive Bayes needs
      smoothing and logistic regression does not, and why Naive Bayes can be trained on less data. L14
      works entirely inside the generative branch without saying so. One lecture, high return.
    scope_triage: reference-only
  - kind: reference
    label: CSC411 notes — compact Naive Bayes reference
    source_id: source-csc411-notes
    locator: 'csc411.pdf Ch 8 Classification (printed p. 42): §8.1 Class Conditionals, §8.5 Generative
      vs. Discriminative models, §8.7 Naïve Bayes; §7.2 Bayes'' Rule and §7.3 Parameter estimation (printed
      p. 35 onward) for the estimation step'
    angle: A two-to-three page summary with the full derivation and no prose — the fastest revision reference
      for L14.
    angle_detail: 'Two to three pages of pure derivation with no worked example and no prose, which is
      exactly what makes it the fastest revision reference for L14 — everything is symbols and the structure
      is visible at a glance. §8.5 is the part worth reading even if the classifier is already solid:
      it names the generative/discriminative distinction that L14 never states, and that distinction is
      what explains why Naive Bayes models the features at all.'
    vault_path: material://source-csc411-notes/csc411.pdf
    scope_triage: reference-only
  - kind: practise
    label: Cornell CS4780 HW4 - solution-backed Naive Bayes problems
    source_id: source-cs4780-homeworks
    locator: 2018Fall/HW4 Problem 1 'Intuition for Naive Bayes' (hw4.pdf with hw4_solution.pdf); 2018Spring/HW4
      Naive Bayes with smoothing (hw4.pdf, solutions in hw4_solutions.tex)
    angle: One problem set explicitly built to test the intuition behind the independence assumption rather
      than the arithmetic.
    angle_detail: The problem's title is literal — it asks what goes wrong when the assumption fails and
      what smoothing is compensating for. Those are exactly the short-answer questions L14 could pose,
      and they are hard to practise from a textbook. Both terms' versions have published solutions; the
      Spring set adds the smoothing computation.
    scope_triage: helpful-now
  - kind: read
    label: Zacharski Ch 6 - Naive Bayes with the zero-frequency failure exposed
    source_id: source-zacharski-data-mining
    locator: Chapter 6, pp. 226-296
    angle: Builds the classifier on counts, hits the zero-probability case, and applies smoothing - the
      same sequence as L14 slides 8-12, but with the intermediate tables visible so the smoothed denominator
      can be checked.
    angle_detail: Naive Bayes with the zero-frequency problem hit deliberately before smoothing is introduced,
      so the fix arrives as a response to a failure you have already seen. That ordering is why this is
      worth reading even though the level is elementary — L14 introduces smoothing as a rule, and the
      rule is much easier to remember when you have watched a single unseen word drive the whole product
      to zero.
    vault_path: material://source-zacharski-data-mining/Zacharski_Programmers-Guide-to-Data-Mining.pdf
    scope_triage: helpful-now
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l14/stages/stage-sad-l14-nb-recap/notes.md
  attachments: []
  source_feedback: []
