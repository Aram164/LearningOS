    vault_path: material://source-ross-elementary-analysis/Ross_Elementary-Analysis_2ed.pdf
    scope_triage: helpful-now
  - kind: read
    label: Thomas Ch 5, §§8.1-8.2, §8.5 and §8.8 — integrals and techniques
    source_id: source-thomas-calculus
    locator: Thomas-Calculus_Early-Transcendentals.pdf §5.2 Sigma Notation and Limits of Finite Sums p.
