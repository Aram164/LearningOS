    vault_path: material://source-thomas-calculus/Thomas-Calculus_Early-Transcendentals.pdf
    scope_triage: helpful-now
  - kind: read
    label: Stewart Ch 5, §7.1, §7.4 and §7.8 — integrals and techniques
    source_id: source-stewart-calculus
    locator: Stewart.pdf §5.2 The Definite Integral p. 410, §5.3 The Fundamental Theorem of Calculus p.
      424, §5.5 The Substitution Rule p. 444; §7.1 Integration by Parts p. 504, §7.4 Integration of Rational
