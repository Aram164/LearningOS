    angle_detail: The section list is close to the script's own order, and the presence of a dedicated
      Mittelwertsatz-für-Integrale section matters because that is kleine_beweise's Satz 7.24 and is otherwise
      easy to lose between §7.1 and §7.2. It stops before improper integrals, so §7.3 needs another route.
      Unassessed against this exam.
    vault_path: material://source-mfnf-analysis1/MfNF_Analysis-1.pdf
    scope_triage: helpful-now
  - kind: read
    label: Ross §§32-34 and §36 — the Riemann integral, its properties, the fundamental theorem
    source_id: source-ross-elementary-analysis
    locator: Ross_Elementary-Analysis_2ed.pdf §32 The Riemann Integral p. 278, §33 Properties of the Riemann
