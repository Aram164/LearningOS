id: unit-m2-sad-l13
type: unit
module_id: module-hu-m2-statistik-analysis
component_id: component-m2-sad
kind: lecture
title: SaD Lecture 13 — Similarity-Based Learning
order: 13
scope: Current 2026 L13 deck; 1-NN and k-NN classification/regression, aggregation and class imbalance,
  distance weighting, metric axioms, Minkowski/Manhattan/Euclidean, cosine, Jaccard and Mahalanobis measures,
  normalization, exact similarity-search indexes including kd/k-means/M-trees, and locality-sensitive
  hashing.
status: ready
knowledge_map:
  summary: 'The lecture treats similarity as both a modeling assumption and a systems problem: predictions
    depend on a representation and metric, while practical use depends on finding neighbors efficiently.'
  nodes:
  - id: knowledge-sad-l13-neighbors
    title: 1-NN and k-NN as lazy learners
    summary: Neighbor methods store the training data and defer computation until prediction; k controls
      the local smoothness and bias-variance tradeoff.
  - id: knowledge-sad-l13-aggregation
    title: Classification, regression, voting, and weighting
    summary: Nominal labels use majority or weighted voting, numeric targets use local averages, and ties,
      imbalance, and distance weighting alter the decision.
    builds_on:
    - knowledge-sad-l13-neighbors
  - id: knowledge-sad-l13-metrics
    title: Similarities, distances, and metric axioms
    summary: Non-negativity, identity, symmetry, and triangle inequality define a metric; not every useful
      similarity is a metric, which affects algorithms and indexes.
    builds_on:
    - knowledge-sad-l13-neighbors
  - id: knowledge-sad-l13-minkowski
    title: Minkowski distances and feature scaling
    summary: Manhattan and Euclidean distance are Lp cases; units and high-dimensional irrelevant features
      can dominate neighborhoods unless representation and normalization are chosen deliberately.
    builds_on:
    - knowledge-sad-l13-metrics
  - id: knowledge-sad-l13-special-measures
    title: Cosine, Jaccard, and Mahalanobis measures
    summary: Directional, set-valued, and covariance-aware data require different measures; each encodes
      a distinct invariance and assumption about what “similar” should mean.
    builds_on:
    - knowledge-sad-l13-metrics
  - id: knowledge-sad-l13-exact-indexing
    title: Exact similarity-search indexes
    summary: kd-trees, k-means-style partitions, and metric trees prune search using geometric or metric
      structure, but effectiveness degrades with dimension and data geometry.
    builds_on:
    - knowledge-sad-l13-minkowski
  - id: knowledge-sad-l13-lsh
    title: Approximate search and locality-sensitive hashing
    summary: LSH trades guaranteed exact neighbors for sublinear candidate retrieval by making collision
      probability track similarity.
    builds_on:
    - knowledge-sad-l13-special-measures
    - knowledge-sad-l13-exact-indexing
