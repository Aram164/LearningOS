    locator: lecture-slides/VL 02-nearest-neighbor.pdf (the AML deck on nearest-neighbour methods)
    angle: The same k-NN material from the parallel AML module, at greater depth and with the curse of
      dimensionality treated properly.
    angle_detail: Two modules in the same semester cover k-NN, and AML's version goes further — distance
      concentration in high dimensions, the effect on neighbourhood meaningfulness, and the consequences
      for choosing k. Reading it serves both modules at once, which is why it is routed here despite belonging
      to another course. Note the notation differs slightly; SaD's deck is authoritative for the SaD exam.
