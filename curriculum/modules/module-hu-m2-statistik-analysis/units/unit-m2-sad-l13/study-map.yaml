      23), Euclidean (p. 24), Pearson (p. 42), cosine (p. 51), then k-NN itself (p. 62). Using one running example
      across all of them is what makes the comparison meaningful — you see the same pair of items being close
      under one measure and far under another, which is the entire point of L13''s metrics node and is invisible
      when each measure is defined separately.'
