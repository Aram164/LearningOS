    angle: 'Section 13.5 is the closest registered treatment of the L13 indexing problem: it states the
      computational cost of exact nearest-neighbour search and the editing/condensing responses, though
      it does not cover kd-trees, M-trees or LSH.'
    angle_detail: §13.3 (p. 482) is the theoretical treatment of nearest neighbours, including the asymptotic
      error-rate result that bounds 1-NN's error by twice the Bayes rate — a striking fact L13 does not
      mention. §13.5 (p. 499) covers editing and condensing the training set to make search cheaper, which
      is the classical counterpart to the deck's indexing material and the closest any book here comes
      to it. Reference-only, but the L13 indexing half is otherwise unsupported.
