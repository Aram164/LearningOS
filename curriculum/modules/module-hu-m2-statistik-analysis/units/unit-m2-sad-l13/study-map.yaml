      treat k-NN as a brute-force scan and move on. §1.6.4-1.6.6 describe how K-D trees and ball trees
      prune the search, and — more valuably — §1.6.6 states when each stops helping, including the dimensionality
      at which brute force wins again. That is the practical form of the curse of dimensionality and directly
      supports the deck''s argument for approximate search.'
