- id: stage-sad-l13-metrics
  number: 3
  title: Similarities, distances, and metric axioms
  status: pending
  objective: Non-negativity, identity, symmetry, and triangle inequality define a metric; not every useful
    similarity is a metric, which affects algorithms and indexes.
  done_when:
  - 'Reproduce without notes: Non-negativity, identity, symmetry, and triangle inequality define a metric;
    not every useful similarity is a metric, which affects algorithms and indexes.'
  - Work UE7, slides 32-75 — similarity, distance and clustering bridge, and record every miss with the
    step it failed at.
  exam_critical: true
  concepts:
  - concept-distance-metrics
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L13 similarity-based learning deck
    locator: lecture-slides/13_similarity_based.pdf, PDF pp. 15-18,31
    angle: Check metric axioms rather than assuming every similarity is a metric.
    angle_detail: 'Read physical PDF pages 15-18,31 for this stage. Printed slide labels may differ. This
      slice focuses the existing deck route; the complete lecture remains accessible through the unit
      material menu. Source correction: the blanket claim on PDF p. 31 that all discussed distances are
      metrics is too broad. Cosine similarity is not a distance; even 1-cosine violates the triangle inequality
      for unit vectors at angles 0, 60 and 120 degrees (1.5 > 0.5+0.5).'
    scope_triage: required-now
