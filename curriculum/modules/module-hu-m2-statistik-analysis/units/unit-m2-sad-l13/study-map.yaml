id: study-map-m2-sad-l13
type: study-map
plan_template_version: 1
unit_id: unit-m2-sad-l13
status: not-started
current_stage: stage-sad-l13-neighbors
source_plan:
  path: curriculum/modules/module-hu-m2-statistik-analysis/source-map.yaml
  provenance: operator
detours: []
shelving:
  state: none
stages:
- id: stage-sad-l13-neighbors
  number: 1
  title: 1-NN and k-NN as lazy learners
  status: pending
  objective: Neighbor methods store the training data and defer computation until prediction; k controls the local
    smoothness and bias-variance tradeoff.
  done_when:
  - 'Reproduce without notes: Neighbor methods store the training data and defer computation until prediction;
    k controls the local smoothness and bias-variance tradeoff.'
  - Work Cornell CS4780 HW1 — k-NN, then the remaining 1, and record every miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-bias-variance-tradeoff
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L13 similarity-based learning deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/13_similarity_based.pdf, 32 slides
    scope_triage: required-now
    angle: Scope authority for k-NN and, unusually for an introductory course, for exact and approximate similarity
      indexes.
    angle_detail: 'The distance-measure and k-NN half is standard and well covered elsewhere. The indexing half
      — exact search structures and locality-sensitive hashing — is not: it is a database-systems topic that appears
      here because the chair teaches it, and almost no ML textbook on this shelf covers LSH at all. For that part
      the deck is effectively the only source, which makes it unusually important to read closely rather than
      supplement.'
  - kind: reference
    label: 2025 instance- and similarity-based pair
    source_id: source-sad-2025-recordings
    locator: sad-2025-recordings/13_similarity_based_part3.pdf
    scope_triage: reference-only
    angle: A prior-year similarity-based deck, part 3 — evidence that 2025 spread this topic over more sessions.
    angle_detail: Since almost no book covers L13's indexing material, prior-year decks are a real supplement
      here rather than a redundancy. Note it is 'part 3' of a longer 2025 treatment; the earlier parts cover the
      distance-measure material that 2026 compresses.
  - kind: read
    label: Kelleher Chapter 5 — similarity-based learning
    source_id: source-kelleher-fmlpda
    locator: Ch 5 Similarity-based Learning, pdf pp. 215-281 (§5.2.2 the nearest-neighbour algorithm; the feature-space
      and normalisation sections)
    scope_triage: helpful-now
    angle: Shows the decision boundary of a nearest-neighbour classifier as a Voronoi tessellation, which explains
      k's role geometrically.
    angle_detail: 'The Voronoi picture makes two L13 facts visible at once: why 1-NN produces jagged boundaries
      that follow noise, and why increasing k smooths them. Kelleher also treats feature normalisation as part
      of the algorithm rather than as preprocessing, which matches L13''s insistence that distance is meaningless
      across unscaled features. Does not cover indexing or LSH — for that half of L13 the deck is effectively
      alone.'
  - kind: reference
    label: AML L02 — k-NN deepening
    source_id: source-aml-ss26-lectures
    locator: lecture-slides/VL 02-nearest-neighbor.pdf (the AML deck on nearest-neighbour methods)
    vault_path: material://source-aml-ss26-lectures/lecture-slides/VL 02-nearest-neighbor.pdf
    scope_triage: reference-only
    angle: The same k-NN material from the parallel AML module, at greater depth and with the curse of dimensionality
      treated properly.
    angle_detail: Two modules in the same semester cover k-NN, and AML's version goes further — distance concentration
      in high dimensions, the effect on neighbourhood meaningfulness, and the consequences for choosing k. Reading
      it serves both modules at once, which is why it is routed here despite belonging to another course. Note
      the notation differs slightly; SaD's deck is authoritative for the SaD exam.
  - kind: practise
    label: Cornell CS4780 HW1 — k-NN
    source_id: source-cs4780-homeworks
    locator: 2017Spring/hw1, 2018Fall/HW1 and 2018Spring/HW1 (k-NN), with the published solutions
    scope_triage: helpful-now
    angle: Asks about k-NN's behaviour in the limit and in high dimensions, not just about computing neighbours.
    angle_detail: Cornell opens its ML course with k-NN and uses it to introduce the curse of dimensionality quantitatively
      — how far the nearest neighbour actually is when dimensions grow. That is a conceptual result L13 mentions
      and never quantifies, and these problems make it concrete. Solutions available for all three variants.
  - kind: practise
    label: MIT 6.034 quizzes — nearest-neighbor tracing
    source_id: source-mit-6034-quizzes
    locator: The published 6.034 quizzes and finals — the nearest-neighbour and decision-boundary questions, with
      solutions
    scope_triage: helpful-now
    angle: Asks you to draw the decision boundary a k-NN classifier induces, which tests the geometry rather than
      the formula.
    angle_detail: Sketching the boundary for k=1 and k=3 on a small labelled scatter is a compact test of whether
      the algorithm is understood spatially, and it is a plausible exam item. These quizzes have many such questions
      with drawn solutions, which is not available anywhere else on the shelf.
  - kind: read
    label: Zacharski Ch 5 - k-NN aggregation and imbalance in practice
    source_id: source-zacharski-data-mining
    locator: Chapter 5, pp. 184-225
    scope_triage: helpful-now
    angle: Runs k-NN with different k and different aggregation on a data set where class imbalance actually bites,
      which is the case L13 slide 14 raises and no current exercise sheet exercises.
    angle_detail: 'The evaluation chapter revisited for the k-NN case: how to choose k by cross-validation and
      what class imbalance does to a neighbour vote. L13''s aggregation node covers weighting and voting; this
      shows the failure mode those mechanisms exist to fix, with numbers.'
  - kind: reference
    label: ESL Ch 13 - nearest neighbours and the cost of searching them
    source_id: source-esl
    locator: Section 13.3 k-nearest-neighbor classifiers, p. 482; section 13.5 computational considerations, p.
      499 (editing and condensing)
    scope_triage: reference-only
    angle: 'Section 13.5 is the closest registered treatment of the L13 indexing problem: it states the computational
      cost of exact nearest-neighbour search and the editing/condensing responses, though it does not cover kd-trees,
      M-trees or LSH.'
    angle_detail: §13.3 (p. 482) is the theoretical treatment of nearest neighbours, including the asymptotic
      error-rate result that bounds 1-NN's error by twice the Bayes rate — a striking fact L13 does not mention.
      §13.5 (p. 499) covers editing and condensing the training set to make search cheaper, which is the classical
      counterpart to the deck's indexing material and the closest any book here comes to it. Reference-only, but
      the L13 indexing half is otherwise unsupported.
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l13/stages/stage-sad-l13-neighbors/notes.md
  attachments: []
  source_feedback: []
