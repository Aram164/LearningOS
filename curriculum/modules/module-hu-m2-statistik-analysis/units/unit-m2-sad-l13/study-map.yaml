      metric choice and normalization, and Leser's systems-oriented exact/approximate similarity-indexing
      section.
    scope_triage: required-now
  - kind: reference
    label: 2025 instance- and similarity-based pair
    source_id: source-sad-2025-recordings
    locator: '11_instance-based.pdf; 13_similarity_based_part3.pdf — The verified older match for current
      L13: one full instance-based deck plus a later similarity-depth deck. Numbering differs, so content—not
      lecture number—controls the route.'
    scope_triage: reference-only
  - kind: read
    label: Kelleher Chapter 5 — similarity-based learning
    source_id: source-kelleher-fmlpda
