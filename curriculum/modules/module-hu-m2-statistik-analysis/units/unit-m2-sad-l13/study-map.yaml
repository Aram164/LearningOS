source_plan:
  path: curriculum/modules/module-hu-m2-statistik-analysis/source-map.yaml
  provenance: operator
detours: []
shelving:
  state: none
stages:
- id: stage-sad-l13-neighbors
  number: 1
  title: 1-NN and k-NN as lazy learners
  status: pending
  objective: Neighbor methods store the training data and defer computation until prediction; k controls
    the local smoothness and bias-variance tradeoff.
  done_when:
  - 'Reproduce without notes: Neighbor methods store the training data and defer computation until prediction;
    k controls the local smoothness and bias-variance tradeoff.'
  - Work Cornell CS4780 HW1 — k-NN, then the remaining 1, and record every miss with the step it failed
    at.
  exam_critical: true
  concepts:
  - concept-bias-variance-tradeoff
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L13 similarity-based learning deck
    locator: lecture-slides/13_similarity_based.pdf, 32 slides
    angle: Scope authority for k-NN and, unusually for an introductory course, for exact and approximate
      similarity indexes.
    angle_detail: 'The distance-measure and k-NN half is standard and well covered elsewhere. The indexing
      half — exact search structures and locality-sensitive hashing — is not: it is a database-systems
      topic that appears here because the chair teaches it, and almost no ML textbook on this shelf covers
      LSH at all. For that part the deck is effectively the only source, which makes it unusually important
      to read closely rather than supplement. Unresolved: specific page slice not yet reviewed, keeping
      whole-deck route for now.'
    scope_triage: required-now
    route_id: route-a4bd194a5656658f42243df6
    source_id: source-sad-ss26-lectures
  - kind: reference
    label: 2025 instance- and similarity-based pair
    locator: 13_similarity_based_part3.pdf
    angle: A prior-year similarity-based deck, part 3 — evidence that 2025 spread this topic over more
      sessions.
    angle_detail: Since almost no book covers L13's indexing material, prior-year decks are a real supplement
      here rather than a redundancy. Note it is 'part 3' of a longer 2025 treatment; the earlier parts
      cover the distance-measure material that 2026 compresses.
    scope_triage: reference-only
    route_id: route-29f9b98724b103877b374b0c
    source_id: source-sad-2025-recordings
  - kind: read
    label: Kelleher Chapter 5 — similarity-based learning
    locator: Ch 5 Similarity-based Learning, pdf pp. 215-281 (§5.2.2 the nearest-neighbour algorithm;
      the feature-space and normalisation sections)
    angle: Shows the decision boundary of a nearest-neighbour classifier as a Voronoi tessellation, which
      explains k's role geometrically.
    angle_detail: 'The Voronoi picture makes two L13 facts visible at once: why 1-NN produces jagged boundaries
      that follow noise, and why increasing k smooths them. Kelleher also treats feature normalisation
      as part of the algorithm rather than as preprocessing, which matches L13''s insistence that distance
      is meaningless across unscaled features. Does not cover indexing or LSH — for that half of L13 the
      deck is effectively alone.'
    vault_path: material://source-kelleher-fmlpda/kelleher.pdf
    scope_triage: helpful-now
    source_id: source-kelleher-fmlpda
    route_id: route-64afd8476744172ae2a50ebd
  - kind: read
    label: Cornell CS4780 — k-NN and the curse of dimensionality lectures
    locator: Lectures 2-3 (k-nearest neighbours; the curse of dimensionality) with the corresponding lecture
      notes on the course site
    angle: Quantifies the curse of dimensionality — how far away the nearest neighbour actually is as
      dimensions grow — instead of describing it.
    angle_detail: Weinberger computes the expected distance to the nearest of n points in a d-dimensional
      unit cube and shows it approaching the cube's diameter as d grows, which means 'nearest' stops meaning
      'near'. L13 mentions the curse; this is the calculation that makes it alarming, and it is the reason
      the deck then spends time on approximate search. The lecture notes are written out and free.
    scope_triage: helpful-now
    source_id: source-cs4780
    route_id: route-96611a9728939c38b2bfef1f
  - kind: reference
    label: scikit-learn user guide §1.6 — nearest neighbours and search structures
    locator: User guide §1.6 'Nearest Neighbors', especially §1.6.4 K-D Tree, §1.6.5 Ball Tree and §1.6.6
      'Choice of nearest neighbors algorithm'
    angle: One of the very few accessible treatments of exact search structures — K-D trees and ball trees
      — which L13 teaches and almost no ML book covers.
    angle_detail: 'L13''s exact-indexing node is genuinely underserved by this shelf: the ML textbooks
      treat k-NN as a brute-force scan and move on. §1.6.4-1.6.6 describe how K-D trees and ball trees
      prune the search, and — more valuably — §1.6.6 states when each stops helping, including the dimensionality
      at which brute force wins again. That is the practical form of the curse of dimensionality and directly
      supports the deck''s argument for approximate search.'
    scope_triage: helpful-now
    source_id: source-sklearn-user-guide
    route_id: route-147346e35bd5be019bdccd69
  - kind: read
    label: MIT 6.036 — nearest-neighbour and feature-representation units
    locator: MIT 6.036 Fall 2020 OCW, Unit 2 'Nearest Neighbors' and its exercises; Notes Ch 14 'Non-parametric
      methods'
    angle: Auto-graded exercises give immediate right/wrong feedback, which is rare for this material.
    angle_detail: Most L13 practice on this shelf is either unchecked or comes with a written solution
      you read after giving up. The Open Learning Library grades your answer instantly, which changes
      how many attempts you make. Particularly useful for the feature-scaling questions, where the effect
      on a distance is easy to reason about wrongly and easy to check numerically.
    scope_triage: helpful-now
    source_id: source-mit-6036
    route_id: route-63f597ce7e7321c8ee2355d3
  - kind: reference
    label: AML L02 — k-NN deepening
    locator: lecture-slides/VL 02-nearest-neighbor.pdf (the AML deck on nearest-neighbour methods)
    angle: The same k-NN material from the parallel AML module, at greater depth and with the curse of
      dimensionality treated properly.
    angle_detail: Two modules in the same semester cover k-NN, and AML's version goes further — distance
      concentration in high dimensions, the effect on neighbourhood meaningfulness, and the consequences
      for choosing k. Reading it serves both modules at once, which is why it is routed here despite belonging
      to another course. Note the notation differs slightly; SaD's deck is authoritative for the SaD exam.
    scope_triage: reference-only
    source_id: source-aml-ss26-lectures
    route_id: route-d9fc8caf218fc1915ae30149
  - kind: practise
    label: Cornell CS4780 HW1 — k-NN
    locator: 2017Spring/hw1, 2018Fall/HW1 and 2018Spring/HW1 (k-NN), with the published solutions
    angle: Asks about k-NN's behaviour in the limit and in high dimensions, not just about computing neighbours.
    angle_detail: Cornell opens its ML course with k-NN and uses it to introduce the curse of dimensionality
      quantitatively — how far the nearest neighbour actually is when dimensions grow. That is a conceptual
      result L13 mentions and never quantifies, and these problems make it concrete. Solutions available
      for all three variants.
    scope_triage: helpful-now
    source_id: source-cs4780-homeworks
    route_id: route-b4b753b2641048dcc267ddc9
  - kind: practise
    label: MIT 6.034 quizzes — nearest-neighbor tracing
    locator: MIT6_034F10_quiz3_2010.pdf, Fall 2010 Quiz 3, Problem 1 Part A 'Nearest Neighbors', PDF pp.
      2-3
    angle: Asks you to draw the decision boundary a k-NN classifier induces, which tests the geometry
      rather than the formula.
    angle_detail: Sketching the boundary for k=1 and k=3 on a small labelled scatter is a compact test
      of whether the algorithm is understood spatially, and it is a plausible exam item. These quizzes
      have many such questions with drawn solutions, which is not available anywhere else on the shelf.
    scope_triage: helpful-now
    source_id: source-mit-6034-quizzes
    route_id: route-eee4f9463982afe90b504b65
  - kind: read
    label: Zacharski Ch 5 - k-NN aggregation and imbalance in practice
    locator: Chapter 5, pp. 184-225
    angle: Runs k-NN with different k and different aggregation on a data set where class imbalance actually
      bites, which is the case L13 slide 14 raises and no current exercise sheet exercises.
    angle_detail: 'The evaluation chapter revisited for the k-NN case: how to choose k by cross-validation
      and what class imbalance does to a neighbour vote. L13''s aggregation node covers weighting and
      voting; this shows the failure mode those mechanisms exist to fix, with numbers.'
    vault_path: material://source-zacharski-data-mining/Zacharski_Programmers-Guide-to-Data-Mining.pdf
    scope_triage: helpful-now
    source_id: source-zacharski-data-mining
    route_id: route-2323018660a94b94e5a0453b
  - kind: reference
    label: ESL Ch 13 - nearest neighbours and the cost of searching them
    locator: Section 13.3 k-nearest-neighbor classifiers, p. 482; section 13.5 computational considerations,
      p. 499 (editing and condensing)
    angle: 'Section 13.5 is the closest registered treatment of the L13 indexing problem: it states the
      computational cost of exact nearest-neighbour search and the editing/condensing responses, though
      it does not cover kd-trees, M-trees or LSH.'
    angle_detail: §13.3 (p. 482) is the theoretical treatment of nearest neighbours, including the asymptotic
      error-rate result that bounds 1-NN's error by twice the Bayes rate — a striking fact L13 does not
      mention. §13.5 (p. 499) covers editing and condensing the training set to make search cheaper, which
      is the classical counterpart to the deck's indexing material and the closest any book here comes
      to it. Reference-only, but the L13 indexing half is otherwise unsupported.
    vault_path: material://source-esl/esl.pdf
    scope_triage: reference-only
    source_id: source-esl
    route_id: route-c3f8a132a0b3033a3af33c8d
