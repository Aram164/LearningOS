    locator: MIT6_034F10_quiz3_2010.pdf, Fall 2010 Quiz 3, Problem 1 Part A 'Nearest Neighbors', PDF pp.
      2-3
    angle: Asks you to draw the decision boundary a k-NN classifier induces, which tests the geometry
      rather than the formula.
    angle_detail: Sketching the boundary for k=1 and k=3 on a small labelled scatter is a compact test
      of whether the algorithm is understood spatially, and it is a plausible exam item. These quizzes
      have many such questions with drawn solutions, which is not available anywhere else on the shelf.
    scope_triage: helpful-now
    source_id: source-mit-6034-quizzes
    route_id: route-eee4f9463982afe90b504b65
  - kind: read
    label: Zacharski Ch 2 - the distance measures of L13 computed on real vectors
    locator: Chapter 2, pp. 20-75 (Manhattan p. 23; Euclidean p. 24; Pearson p. 42; cosine p. 51; k-nearest
      neighbours p. 62)
    angle: L13 introduces Manhattan, Euclidean and cosine as definitions; this chapter implements each
      in Python over one recommender data set, so the difference between the measures and the effect of
      unscaled features becomes something you run rather than something you are told. It does not treat
      the metric axioms of slide 32.
    angle_detail: 'Every distance measure L13 names, computed by hand on the same small dataset: Manhattan
      (p. 23), Euclidean (p. 24), Pearson (p. 42), cosine (p. 51), then k-NN itself (p. 62). Using one
      running example across all of them is what makes the comparison meaningful — you see the same pair
      of items being close under one measure and far under another, which is the entire point of L13''s
      metrics node and is invisible when each measure is defined separately.'
    vault_path: material://source-zacharski-data-mining/Zacharski_Programmers-Guide-to-Data-Mining.pdf
    scope_triage: helpful-now
    source_id: source-zacharski-data-mining
