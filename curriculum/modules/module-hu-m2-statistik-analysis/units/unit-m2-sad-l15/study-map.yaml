      neural-network regularization material and does not cover batch normalization — a distinction already recorded
      in this repository's wiring notes.
  - kind: practise
    label: Cornell CS4780 HW9 — neural networks and ReLU
    source_id: source-cs4780-homeworks
    locator: 2018Fall/HW9 and 2018Spring/HW9 (neural networks and ReLU), with the published solutions
    scope_triage: helpful-now
    angle: Forward and backward passes computed by hand on small networks, with the answers to check against.
    angle_detail: Hand computation is the only reliable test of whether backpropagation is understood, and these
      sets provide it at the right scale — networks small enough to finish, large enough to require the bookkeeping.
      The ReLU problems also make the non-differentiability at zero explicit, which the deck passes over.
  - kind: practise
    label: MIT 6.034 quizzes — neural-network tracing
    source_id: source-mit-6034-quizzes
    locator: The published 6.034 quizzes and finals — the neural-network forward/backward tracing questions, with
      solutions
    scope_triage: helpful-now
    angle: Small networks traced numerically under exam conditions, including weight updates.
    angle_detail: 'The same procedural virtue as the tree questions: execute the computation, show the state.
      For L15 that means a forward pass with given weights, a loss, and one update step — which is the realistic
      scope of a neural-network exam question in a combined three-hour paper.'
  - kind: watch
    label: 3Blue1Brown — Neural Networks playlist
    source_id: source-3b1b-neural-networks
    locator: 'Episodes 1-4: ''But what is a neural network?'', ''Gradient descent, how neural networks learn'',
      ''What is backpropagation really doing?'', ''Backpropagation calculus'' (≈15-20 min each)'
    scope_triage: helpful-now
    angle: Episode 3 shows backpropagation as each training example 'voting' on how every weight should change
      — the intuition before the calculus.
    angle_detail: 'The four episodes are deliberately staged: what the network computes, what the loss surface
      looks like, what backpropagation is doing conceptually, and only then the chain-rule algebra in episode
      4. Watching 1-3 before reading any derivation is the highest-return hour available for L15, because the
      derivation is bookkeeping once the picture exists. Episode 4 maps directly onto the deck''s gradient slides.'
  - kind: reference
    label: UMich EECS 498 — fully connected and architecture depth
    source_id: source-eecs498
    locator: Lectures on fully connected networks and backpropagation (roughly lectures 4-6 of the Michigan Deep
      Learning for Computer Vision playlist)
    scope_triage: reference-only
    angle: Draws the computation graph and propagates gradients through it node by node, on the board.
    angle_detail: 'The computational-graph presentation is the one that generalises: instead of deriving gradients
      for a specific architecture, you learn a local rule that composes. Watching it applied to a concrete graph
      is the step between L15''s hand derivation and understanding what a framework does. Beyond SaD scope, and
      directly useful for AML and the thesis workstream.'
  - kind: read
    label: Brandon Rohrer — friendly neural-network explanation
    source_id: source-rohrer-e2eml
    locator: The 'How neural networks work' article and companion video on e2eml.school
    scope_triage: helpful-now
    angle: Builds a tiny network out of explicit arithmetic with no calculus at all.
    angle_detail: Every quantity is a small number and every step is an addition or a multiplication, which removes
      the notation barrier entirely. Useful as a first contact or as a reset if the gradients have become symbol-pushing.
      The trade-off is that it stops well before anything examinable — follow it with 3Blue1Brown episode 4 or
      Marsland Ch 4.
  - kind: read
    label: Geron Ch 10 - MLP shapes and outputs made concrete
    source_id: source-geron-handson
    locator: Chapter 10, pp. 303-350
    scope_triage: helpful-now
    angle: 'Gives the L15 forward pass an executable form: layer widths, parameter counts, activation choice and
      the output/loss pairing for regression, binary and multiclass targets that the deck states as a table.'
    angle_detail: 'Forty-eight pages that make network shapes concrete: how many parameters a given architecture
      has, what the output layer must look like for binary, multiclass and regression targets, and how the loss
      must match the output. That is precisely what L15''s forward-pass and output nodes cover, and precisely
      what the SaD Übungen ask you to compute. Working through the shapes here is direct exam preparation.'
  - kind: read
    label: Marsland Ch 3-4 - from the single neuron to backprop and universality
    source_id: source-marsland-ml-algorithmic
    locator: Chapter 3, pp. 60-91 and Chapter 4, pp. 92-131 (XOR p. 92; hidden layer p. 94; back-propagation p.
      95; universal approximation p. 107)
    scope_triage: helpful-now
    angle: Follows the exact L15 arc - perceptron, the XOR show-stopper, hidden layers, back-propagation - and
      is the only registered source that states the universal-approximation result the deck asserts on slide 36.
    angle_detail: 'Chapters 3 and 4 are the classical route into neural networks and they earn their place through
      the XOR example on p. 92: a problem a single layer provably cannot solve, followed immediately by the hidden
      layer that solves it (p. 94). That is L15''s activation node argued rather than asserted. Backpropagation
      (p. 95) is then derived and implemented, and universal approximation (p. 107) is stated with its caveats.
      Together this is the most complete L15 coverage on the shelf at course level.'
