- id: stage-sad-l15-neuron
  number: 1
  title: Artificial neurons and linear-model equivalence
  status: pending
  objective: A neuron computes an affine weighted sum followed by an activation; with the identity activation,
    a one-layer network is multivariate linear regression.
  done_when:
  - 'Reproduce without notes: A neuron computes an affine weighted sum followed by an activation; with
    the identity activation, a one-layer network is multivariate linear regression.'
  - Work MIT 6.034 quizzes — neural-network tracing, and record every miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-linear-regression
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L15 neural-networks deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/15_neural_networks.pdf (38 pages) — Builds the SaD neural-network model from
      MLR equivalence through activations, softmax, MLP shapes/parameter counts, backpropagation, training,
      universality, and an architecture outlook.
    scope_triage: required-now
  - kind: reference
    label: 2025 neural-networks Part 1 and Part 2
    source_id: source-sad-2025-recordings
    locator: '14_neural_nets_part1.pdf; 15_neural_nets_part2.pdf — The strongest local same-course NN
      depth: the two-deck sequence expands the current lecture''s forward, training, gradient, and backpropagation
      overview.'
    scope_triage: reference-only
  - kind: watch
    label: StatQuest — neural networks and backpropagation
    source_id: source-statquest
    locator: Neural Networks Part 1; Backpropagation Main Ideas; Stochastic Gradient Descent — Surgical
      intuition for neuron computation, gradient descent, and backpropagation when the algebraic graph
      is hard to visualize.
    scope_triage: helpful-now
  - kind: read
    label: Kelleher Chapter 7 — error-based learning and neural networks
    source_id: source-kelleher-fmlpda
    locator: Chapter 7 — Primary course-aligned route from error surfaces and gradient updates to network
      learning, with worked examples closer to SaD's level than advanced deep-learning texts.
    scope_triage: helpful-now
  - kind: read
    label: ISLP §§10.1–10.2 — gentle neural-network introduction
    source_id: source-islp
    locator: §§10.1–10.2 — Readable MLP and forward-pass explanation with statistical-learning context;
