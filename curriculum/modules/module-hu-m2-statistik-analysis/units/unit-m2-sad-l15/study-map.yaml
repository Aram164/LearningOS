    scope_triage: helpful-now
  - kind: practise
    label: MIT 6.034 quizzes — neural-network tracing
    source_id: source-mit-6034-quizzes
    locator: Neural-network quiz selections — Solution-backed forward/activation/weight reasoning on compact
      networks, useful for parameter and computation checks.
    scope_triage: helpful-now
