      transformation of derived features, which is L15''s own opening claim made precise. For a reader coming
      from L03 rather than from a deep-learning course, this is the least disorienting introduction on the shelf.
      It is also the shallowest: no backpropagation derivation, and the training discussion is brief. Pair with
      Marsland Ch 4 or Nielsen Ch 2 for the gradient work.'
  - kind: read
    label: Kroese — neural-network reference
    source_id: source-kroese-dsml
    locator: Ch 9 Deep Learning, pdf pp. 341-372; App B Multivariate Differentiation and Optimization, pdf pp.
      415-438
    scope_triage: helpful-now
    angle: Keeps the matrix calculus needed for backpropagation in an appendix you can consult while reading the
      chapter.
    angle_detail: Backpropagation is chain-rule bookkeeping over matrices, and the usual obstacle is not the idea
      but the notation for derivatives of vector-valued functions. Having App B in the same book, in the same
      notation, means the gradient steps in Ch 9 can be checked rather than accepted. Denser than the deck requires;
      useful if the derivation is what you want.
  - kind: reference
    label: CS229 §7 — compact neural-network derivation
    source_id: source-cs229-notes
    locator: Main notes §7 Deep Learning (the neural-network and backpropagation sections)
    scope_triage: reference-only
    angle: Backpropagation written out as matrix derivative bookkeeping, in the most compact correct form available
      here.
    angle_detail: Six pages that state the forward pass, define the loss, and derive the layer-by-layer gradients
      with explicit shapes. If you already understand the chain rule and want the algorithm precisely, this is
      faster than any book on the shelf. If you do not yet have the picture, it will be opaque — start with 3Blue1Brown
      episodes 3-4 and return here.
  - kind: reference
    label: Stanford CS229 — neural-network lecture
    source_id: source-cs229-2022-videos
    locator: The 2022 neural-networks lecture (the first of the deep-learning lectures on the playlist)
    scope_triage: reference-only
    angle: Motivates depth by showing what a single layer cannot represent, before showing what more layers buy.
    angle_detail: The lecture spends real time on the representational question — what functions are and are not
      reachable — which is L15's universality node treated as a question rather than a stated theorem. Also useful
      for hearing how a practitioner describes the training loop, which the deck lists as practical choices.
  - kind: reference
    label: Murphy §§13.2–13.3 — neural-network depth
    source_id: source-murphy-pml1
    locator: §§13.2-13.3 multilayer perceptrons and backpropagation (Part III Deep Neural Networks, pdf pp. 453-574)
    scope_triage: reference-only
    angle: Presents backpropagation as reverse-mode automatic differentiation on a computation graph, which is
      what frameworks actually implement.
