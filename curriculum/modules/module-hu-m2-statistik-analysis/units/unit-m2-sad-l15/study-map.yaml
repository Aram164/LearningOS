id: study-map-m2-sad-l15
type: study-map
plan_template_version: 1
unit_id: unit-m2-sad-l15
status: not-started
current_stage: stage-sad-l15-neuron
source_plan:
  path: curriculum/modules/module-hu-m2-statistik-analysis/source-map.yaml
  provenance: operator
detours: []
shelving:
  state: none
stages:
- id: stage-sad-l15-neuron
  number: 1
  title: Artificial neurons and linear-model equivalence
  status: pending
  objective: A neuron computes an affine weighted sum followed by an activation; with the identity activation,
    a one-layer network is multivariate linear regression.
  done_when:
  - 'Reproduce without notes: A neuron computes an affine weighted sum followed by an activation; with the identity
    activation, a one-layer network is multivariate linear regression.'
  - Work MIT 6.034 quizzes — neural-network tracing, and record every miss with the step it failed at.
  exam_critical: true
  concepts:
  - concept-linear-regression
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L15 neural-networks deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/15_neural_networks.pdf, 38 slides
    scope_triage: required-now
    angle: Builds from a single neuron to backpropagation and closes with the CNN/RNN/Transformer outlook that
      connects SaD to AML.
    angle_detail: The deck's most useful move is starting from the observation that a single neuron with no activation
      is a linear model — which ties L15 back to L03 rather than presenting neural networks as a new subject.
      Backpropagation is stated as the chain rule applied layer by layer; the deck does not run a numeric example,
      which is the gap Karpathy's micrograd and 3Blue1Brown's episode 3 fill. The closing outlook slides are context,
      not exam material.
  - kind: reference
    label: 2025 neural-networks Part 1 and Part 2
    source_id: source-sad-2025-recordings
    locator: sad-2025-recordings/14_neural_nets_part1.pdf and 15_neural_nets_part2.pdf
    scope_triage: reference-only
    angle: Two prior-year decks for what 2026 delivers as one — the most detailed neural-network treatment the
      course has produced.
    angle_detail: 2025 spent two sessions on neural networks and 2026 spends one, so these two files together
      contain material the current deck had to cut. That makes them the best course-level elaboration of L15 available,
      particularly for the backpropagation steps the 2026 deck states compactly. Scope still comes from the 2026
      deck.
  - kind: watch
    label: StatQuest — neural networks and backpropagation
    source_id: source-statquest
    locator: '''Neural Networks Part 1 — Inside the Black Box''; ''Backpropagation Main Ideas''; ''Stochastic
      Gradient Descent, Clearly Explained'' (≈15-20 min each)'
    scope_triage: helpful-now
    angle: Shows activation functions being scaled and summed into an arbitrary curve — the mechanical basis of
      universal approximation.
    angle_detail: Part 1's central demonstration is that two hidden units with a soft activation can be weighted
      and added to produce a bent curve fitting the data, built up piece by piece on screen. That is L15's universality
      node made visible without any theorem. The backpropagation video then updates one weight at a time with
      the numbers shown, and the SGD video explains why the gradient is estimated on a batch rather than the full
      data — a practical point L15 lists without motivating.
  - kind: read
    label: Kelleher Chapter 7 — error-based learning and neural networks
    source_id: source-kelleher-fmlpda
    locator: Ch 7 Error-based Learning, pdf pp. 351-424 (the multi-layer network and backpropagation sections)
    scope_triage: helpful-now
    angle: Arrives at neural networks by extending the linear model of L03 rather than by starting over — the
      same route L15's first slides take.
    angle_detail: Because Kelleher's Ch 7 is one continuous argument from simple linear regression to multi-layer
      networks, the continuity L15 asserts on its opening slide (a neuron without an activation is a linear model)
      is the chapter's actual structure. Reading it in order makes backpropagation feel like the same gradient
      descent applied through more layers, which is the correct impression and not the one a standalone treatment
      gives.
  - kind: read
    label: ISLP §§10.1–10.2 — gentle neural-network introduction
    source_id: source-islp
    locator: Ch 10 Deep Learning, pdf pp. 406-462 (§10.1 single layer neural networks p. 407; §10.2 multilayer
      neural networks p. 409; Ch 10 lab p. 439)
    scope_triage: helpful-now
    angle: Written for readers who already know linear regression, so every neural-network idea is introduced
      as a modification of something familiar.
    angle_detail: '§10.1 literally begins by writing a single-layer network as a linear model with a nonlinear
      transformation of derived features, which is L15''s own opening claim made precise. For a reader coming
      from L03 rather than from a deep-learning course, this is the least disorienting introduction on the shelf.
      It is also the shallowest: no backpropagation derivation, and the training discussion is brief. Pair with
      Marsland Ch 4 or Nielsen Ch 2 for the gradient work.'
  - kind: practise
    label: MIT 6.034 quizzes — neural-network tracing
    source_id: source-mit-6034-quizzes
    locator: The published 6.034 quizzes and finals — the neural-network forward/backward tracing questions, with
      solutions
    scope_triage: helpful-now
    angle: Small networks traced numerically under exam conditions, including weight updates.
    angle_detail: 'The same procedural virtue as the tree questions: execute the computation, show the state.
      For L15 that means a forward pass with given weights, a loss, and one update step — which is the realistic
      scope of a neural-network exam question in a combined three-hour paper.'
  - kind: watch
    label: 3Blue1Brown — Neural Networks playlist
    source_id: source-3b1b-neural-networks
    locator: 'Episodes 1-4: ''But what is a neural network?'', ''Gradient descent, how neural networks learn'',
      ''What is backpropagation really doing?'', ''Backpropagation calculus'' (≈15-20 min each)'
    scope_triage: helpful-now
    angle: Episode 3 shows backpropagation as each training example 'voting' on how every weight should change
      — the intuition before the calculus.
    angle_detail: 'The four episodes are deliberately staged: what the network computes, what the loss surface
      looks like, what backpropagation is doing conceptually, and only then the chain-rule algebra in episode
      4. Watching 1-3 before reading any derivation is the highest-return hour available for L15, because the
      derivation is bookkeeping once the picture exists. Episode 4 maps directly onto the deck''s gradient slides.'
  - kind: read
    label: Brandon Rohrer — friendly neural-network explanation
    source_id: source-rohrer-e2eml
    locator: The 'How neural networks work' article and companion video on e2eml.school
    scope_triage: helpful-now
    angle: Builds a tiny network out of explicit arithmetic with no calculus at all.
    angle_detail: Every quantity is a small number and every step is an addition or a multiplication, which removes
      the notation barrier entirely. Useful as a first contact or as a reset if the gradients have become symbol-pushing.
      The trade-off is that it stops well before anything examinable — follow it with 3Blue1Brown episode 4 or
      Marsland Ch 4.
  - kind: read
    label: Geron Ch 10 - MLP shapes and outputs made concrete
    source_id: source-geron-handson
    locator: Chapter 10, pp. 303-350
    scope_triage: helpful-now
    angle: 'Gives the L15 forward pass an executable form: layer widths, parameter counts, activation choice and
      the output/loss pairing for regression, binary and multiclass targets that the deck states as a table.'
    angle_detail: 'Forty-eight pages that make network shapes concrete: how many parameters a given architecture
      has, what the output layer must look like for binary, multiclass and regression targets, and how the loss
      must match the output. That is precisely what L15''s forward-pass and output nodes cover, and precisely
      what the SaD Übungen ask you to compute. Working through the shapes here is direct exam preparation.'
  - kind: read
    label: Marsland Ch 3-4 - from the single neuron to backprop and universality
    source_id: source-marsland-ml-algorithmic
    locator: Chapter 3, pp. 60-91 and Chapter 4, pp. 92-131 (XOR p. 92; hidden layer p. 94; back-propagation p.
      95; universal approximation p. 107)
    scope_triage: helpful-now
    angle: Follows the exact L15 arc - perceptron, the XOR show-stopper, hidden layers, back-propagation - and
      is the only registered source that states the universal-approximation result the deck asserts on slide 36.
    angle_detail: 'Chapters 3 and 4 are the classical route into neural networks and they earn their place through
      the XOR example on p. 92: a problem a single layer provably cannot solve, followed immediately by the hidden
      layer that solves it (p. 94). That is L15''s activation node argued rather than asserted. Backpropagation
      (p. 95) is then derived and implemented, and universal approximation (p. 107) is stated with its caveats.
      Together this is the most complete L15 coverage on the shelf at course level.'
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l15/stages/stage-sad-l15-neuron/notes.md
  attachments: []
  source_feedback: []
