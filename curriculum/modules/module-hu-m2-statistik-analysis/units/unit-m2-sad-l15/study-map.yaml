    source_id: source-aml-ss26-lectures
    locator: lecture-slides/VL 08-feedforward-neural-network.pdf and VL 09-training-neural-networks.pdf
    scope_triage: reference-only
    angle: The AML treatment of the same networks, with a whole deck devoted to training rather than a summary
