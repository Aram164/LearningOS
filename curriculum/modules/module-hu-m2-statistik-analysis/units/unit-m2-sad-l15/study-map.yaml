      regularization — presented as things practitioners do. Ch 11 explains what each is solving: vanishing gradients,
      dead units, slow convergence, overfitting. Turning a list of tricks into a list of problems-and-solutions
      is what makes it retainable and is the difference between recognising the terms and being able to justify
      a choice.'
