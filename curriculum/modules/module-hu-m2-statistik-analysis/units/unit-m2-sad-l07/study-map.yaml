- id: stage-sad-l07-geometric
  number: 4
  title: Geometric waiting times
  status: pending
  objective: 'The Geometric model counts trials until first success and has the memoryless property. Geometric
    waiting times are complementary preparation here: L07 has no dedicated section and Übungsblatt 3 Aufgabe
    2 tests other distributions. The registered Blatt 4 later uses Geometric(p=0.02) in Aufgabe 3(a)(4),
    PDF p. 3; establish whether counts include the successful trial.'
  done_when:
  - Derive P(T=k)=(1-p)^(k-1)*p for T starting at 1; distinguish T from failures-before-success T-1.
  - Explain why the fixed-sample questions in Übungsblatt 3 Aufgabe 2 are not Geometric waiting-time tasks.
  exam_critical: false
  concepts:
  - concept-discrete-distributions
  scope_triage: helpful-now
  resources:
  - kind: read
    label: Current L07 discrete-distributions deck
    locator: lecture-slides/07_discrete_distributions.pdf, PDF pp. 14
    angle: Related negative-binomial sketch; no dedicated Geometric lesson in this deck.
    angle_detail: Read physical PDF pages 14 for this stage. Printed slide labels may differ. This slice
      focuses the existing deck route; the complete lecture remains accessible through the unit material
      menu. PDF p. 14 is related context only. The Geometric model is supplied by complementary readings;
      Übungsblatt 3 Aufgabe 2 and UE4 pp. 36-49 do not teach it. Blatt 4 Aufgabe 3(a)(4) later uses it
      in a CLT simulation.
    scope_triage: reference-only
    route_id: route-66b70c94de7bc040921d186c
    node_scaffold_note: Closest related material, a negative-binomial sketch; the deck has no dedicated
      Geometric lesson — reference contrast only.
    source_id: source-sad-ss26-lectures
  - material_ref:
      route_id: route-6ffaf5d7ec9d500ff4c5286e
      inherit:
      - label
      - source_id
    route_id: route-6ffaf5d7ec9d500ff4c5286e
    kind: read
    scope_triage: helpful-now
    locator: 07_discrete_distributions.pptx (1).pdf, physical PDF pp. 38–44
    angle: The prior-year course deck derives trials-until-first-success Geometric probabilities, including
      the successful trial.
    angle_detail: Read pp. 38–42 for the stopping-rule contrast, PMF, CDF and die-roll question. Page
      43 accidentally says E(X)=0.5 for p=0.5; under its convention E(X)=1/p=2. Page 44 contrasts fixed
