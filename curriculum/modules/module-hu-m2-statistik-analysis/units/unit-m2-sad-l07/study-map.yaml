  state: none
stages:
- id: stage-sad-l07-model-selection
  number: 1
  title: Distribution choice from assumptions
  status: pending
  objective: Number of trials, independence, replacement, changing versus fixed success probability, stopping
    rule, and count interval determine which discrete model is valid.
  done_when:
  - 'Reproduce without notes: Number of trials, independence, replacement, changing versus fixed success probability,
    stopping rule, and count interval determine which discrete model is valid.'
  - Work Übungsblatt 3 and UE4 — discrete-distribution selection, then the remaining 5, and record every miss
    with the step it failed at.
  exam_critical: true
  concepts:
  - concept-discrete-distributions
  scope_triage: required-now
  resources:
  - kind: read
    label: Current L07 discrete-distributions deck
    source_id: source-sad-ss26-lectures
    locator: lecture-slides/07_discrete_distributions.pdf, 33 slides
    scope_triage: required-now
    angle: Defines the identification conditions for the four discrete families, which is what the exam tests
      rather than the formulas.
    angle_detail: Short deck, high exam density. Each distribution gets its conditions, PMF, moments and a worked
      example, and the final slides state the limit relationships between them. The relationships are asserted;
      Blitzstein §3.9 and §4.8 prove them. If time is short before the exam, the conditions slides are the ones
      to know cold — the formulas are recoverable, the identification is not.
  - kind: practise
    label: Übungsblatt 3 and UE4 — discrete-distribution selection
    source_id: source-sad-uebungen
    locator: exercise-slides/Übung-3.pdf; exercise-slides/UE4.pdf
    scope_triage: required-now
    angle: Distribution-identification questions in the chair's phrasing — the trigger words that signal each
      model.
    angle_detail: The identification skill is only transferable if you have seen the phrasing that will be used.
      These are the authoritative examples of it; the German-language videos supply the same triggers in German
      for the terms the deck leaves in English.
  - kind: reference
    label: 2025 discrete-distributions deck
    source_id: source-sad-2025-recordings
    locator: sad-2025-recordings/07_discrete_distributions.pptx (1).pdf
    vault_path: material://source-sad-2025-recordings/07_discrete_distributions.pptx (1).pdf
    scope_triage: reference-only
    angle: Same-topic prior-year deck with a different set of worked examples.
    angle_detail: The examples differ from 2026's even where the content matches, which makes this a source of
      extra worked cases at exactly the right level — closer to the course than any textbook. Verify the formulas
      against the current deck; notation drifts year to year.
  - kind: read
    label: Fahrmeir Chapter 5 — discrete distributions
    source_id: source-fahrmeir-statistik
    locator: Ch 5 §5.3 Spezielle diskrete Verteilungsmodelle, pdf pp. 270-282; Zusammenfassung pdf pp. 283-284;
      Aufgaben pdf pp. 286-287
    scope_triage: helpful-now
    angle: Presents each discrete model as a modelling decision — what generating situation forces this distribution
      — rather than as a formula sheet.
    angle_detail: Thirteen pages covering Binomial, Hypergeometrisch, Geometrisch and Poisson, each opened with
      the Situation that produces it (fixed n and independence; drawing without replacement from a finite urn;
      waiting for the first success; rare events in continuous time). That is exactly the skill L07's model-selection
      node is testing, and it is the part a formula sheet cannot give you. The moments are stated without derivation
      — if you want the E[X] and Var(X) proofs, use Blitzstein §§3.3-3.4 and §4.7 instead. The Zusammenfassung
      on pp. 283-284 is the single best one-page revision table for this lecture on the shelf.
  - kind: practise
    label: Arbeitsbuch Chapter 5 — distribution drills
    source_id: source-fahrmeir-arbeitsbuch
    locator: Ch 5 Aufgaben pdf pp. 96-104, Lösungen pdf pp. 105-123 (the Verteilungsmodell items)
    scope_triage: helpful-now
    angle: 'Model-identification drill: each item describes a situation and leaves you to name the distribution
      before computing anything.'
    angle_detail: The examinable difficulty in L07 is choosing between Binomial, Hypergeometrisch, Geometrisch
      and Poisson from a word problem — once chosen, the arithmetic is a formula lookup. These items are written
      so that the choice is the work, and the solutions justify the choice rather than jumping to the formula.
      Do them mixed rather than in blocks; solving ten Binomial questions in a row trains nothing about identification.
  - kind: read
    label: Blitzstein Chapters 3–4 — distribution-generating stories
    source_id: source-blitzstein-hwang
    locator: Ch 3 §3.3 Bernoulli and Binomial, pdf pp. 129-131; §3.4 Hypergeometric, pdf pp. 132-134; §3.9 connections
      between Binomial and Hypergeometric, pdf pp. 150-152; Ch 4 §4.3 Geometric and Negative Binomial, pdf pp.
      174-180; §4.7 Poisson, pdf pp. 191-197; §4.8 connections between Poisson and Binomial, pdf pp. 198-200
    scope_triage: helpful-now
    angle: Gives each distribution a story first, then derives its moments — and devotes whole sections to the
      relationships between them.
    angle_detail: L07's relationships node — Binomial to Poisson in the rare-event limit, Hypergeometric to Binomial
      as the population grows — is stated on a slide as a fact. §3.9 and §4.8 are entire sections that prove those
      limits and say when the approximation is safe, which is the difference between reciting the relationship
      and being able to justify an approximation in an exam. The story-first presentation ('a Binomial counts
      successes in n independent trials with the same p') is also the most reliable way to get the model-selection
      node right under time pressure.
  - kind: reference
    label: Tijms — discrete-distribution modeling examples
    source_id: source-tijms-understanding-probability
    locator: Ch 9 Basic rules for discrete random variables, pdf pp. 275-295; Ch 4 Rare events and lotteries,
      pdf pp. 115-152
    scope_triage: reference-only
    angle: Ch 4 is an entire chapter of rare-event modelling — the Poisson's natural habitat — before the distribution
      is ever defined formally.
    angle_detail: Lottery coincidences, near-misses and clusters, worked out with counts and simulations. It is
      the most convincing answer available to why the Poisson deserves its own model rather than being a Binomial
      special case, which is what L07's model-selection node needs you to have internalised. Read it for the modelling
      judgment, not for formulas — the formal statements are in Ch 9.
  - kind: practise
    label: Schaum — discrete-distribution drills
    source_id: source-schaums-probability
    locator: Ch 6 Binomial, Normal and Poisson Distributions, pdf pp. 107-127
    scope_triage: helpful-now
    angle: Puts the three named distributions in one chapter with mixed problems, so identification is forced
      rather than given away by the section heading.
    angle_detail: Because the binomial, Normal and Poisson share a chapter here, the end-of-chapter problems are
      mixed, and mixed problems are the only ones that actually train L07's model-selection node — a block of
      ten binomial questions trains substitution, not choice. Includes the binomial-to-Normal and binomial-to-Poisson
      approximation problems that L08 also needs.
  - kind: read
    label: OpenIntro Chapter 4 — common distributions
    source_id: source-openintro-statistics
    locator: Ch 4 §4.2 geometric distribution, pdf pp. 144-148; §4.3 binomial distribution, pdf pp. 149-157; §4.4
      negative binomial, pdf pp. 158-162; §4.5 Poisson distribution, pdf pp. 163-167
    scope_triage: helpful-now
    angle: Each distribution gets a stated checklist of conditions before its formula, which is the exact form
      of L07's model-selection question.
    angle_detail: §4.3 opens with four numbered conditions a situation must satisfy for a binomial model to apply,
      and the later sections follow the same pattern. L07's model-selection node is asking precisely for that
      checklist, and having it in list form is more usable under exam pressure than a prose description. Hypergeometric
      is thin here (it lives in §3.3 as 'sampling from a small population') — Fahrmeir §5.3 or Blitzstein §3.4
      covers it properly.
  - kind: practise
    label: Dekking — discrete-distribution exercises
    source_id: source-dekking-mips
    locator: Ch 4 §4.3 Bernoulli and binomial, pdf pp. 56-58; §4.4 the geometric distribution, pdf pp. 59-61;
      Ch 12 the Poisson process, pdf pp. 176-188 (taking a closer look at random arrivals p. 177; the one-dimensional
      Poisson process p. 180)
    scope_triage: helpful-now
    angle: Derives the Poisson distribution from the arrival process rather than defining it by its PMF.
    angle_detail: Everywhere else on this shelf the Poisson distribution is defined by its formula and then motivated.
      Ch 12 starts from random points on a line, asks what the count in an interval must look like if arrivals
      are memoryless and non-simultaneous, and the PMF falls out. That is the answer to 'why is this the right
      model for rare events', which L07's model-selection node assumes. Longer than the alternatives and beyond
      exam scope in its later sections — read §12.2 and §12.3 and stop.
  - kind: read
    label: MIT 18.05 — discrete-distribution problems
    source_id: source-mit-1805
    locator: 'Classes: Reading and In-class Materials, the ''Discrete Random Variables'' readings covering Bernoulli,
      binomial, geometric and Poisson; Problem Set 2 with solutions'
    scope_triage: helpful-now
    angle: Introduces each discrete family with an explicit R function name beside its formula, tying the mathematics
      to a computation you can run.
    angle_detail: 'Every distribution arrives with its dbinom/pbinom-style counterpart, so a hand computation
      can be checked immediately. That is a small thing that removes a large class of silent errors when practising,
      and it also means the model-selection question can be tested empirically: simulate the described situation,
      compare the histogram with the candidate PMF.'
  - kind: reference
    label: Harvard Stat 110 Units 3–4 — discrete distributions
    source_id: source-stat110
    locator: Lectures 6-8 (Bernoulli, binomial, hypergeometric, geometric, Poisson) plus the published 'Table
      of Distributions' handout
    scope_triage: reference-only
    angle: Each distribution is given a one-sentence 'story' that determines when it applies — the compressed
      form of the model-selection skill.
    angle_detail: Blitzstein's stories ('a hypergeometric counts the successes when you sample without replacement
      from a finite population containing a known number of successes') are short enough to memorise and complete
      enough to decide a modelling question. Learning the five stories is a far better use of an hour than learning
      the five PMFs, because the PMF follows from the story and the identification does not. The published distribution-summary
      sheet tabulates all of them with moments.
  - kind: practise
    label: FAU solved exam — Binomial modeling
    source_id: source-fau-klausur-ws1415
    locator: FAU-Erlangen_Statistik-Klausur_WS14-15_mit-Loesungen.pdf — the Binomial question with solution
    scope_triage: helpful-now
    angle: Shows the expected justification for choosing the binomial model, which is the part worth marks.
    angle_detail: The solution names the conditions before substituting, which confirms that the model-selection
      reasoning is examined and not merely assumed. Short item; read the solution as a template.
  - kind: practise
    label: External German solved exams — distributions block
    source_id: source-sad-klausuren-extern
    locator: 'materials/.../sad-klausuren-extern/: the discrete-distribution questions in the solved papers'
    scope_triage: helpful-now
    angle: Mixed distribution questions where the model is not named in the stem.
    angle_detail: External papers rarely name the distribution, which makes this bank better identification practice
      than any single-topic exercise set. The highest-value use of the bank for L07.
  - kind: watch
    label: StatQuest — Binomial distribution and sampling
    source_id: source-statquest
    locator: '''The Binomial Distribution in 30 Seconds''; ''Sampling from a Distribution, Clearly Explained'''
    scope_triage: helpful-now
    angle: Very short — use as a recall check between practice sets rather than as a first explanation.
    angle_detail: 'The 30-second binomial video is exactly what it says and is best used as a spaced-repetition
      prompt: watch it cold and see whether you could have said the same thing. The sampling video is more substantial
      and explains what ''drawing from a distribution'' means operationally, which matters for L11''s resampling
      material later.'
  - kind: watch
    label: jbstatistics — discrete distributions
    source_id: source-jbstatistics
    locator: 'The discrete-distribution playlist: ''The Binomial Distribution'', ''The Geometric Distribution'',
      ''The Hypergeometric Distribution'', ''The Poisson Distribution'''
    scope_triage: helpful-now
    angle: One video per distribution, each opening with the conditions that must hold before the formula appears.
    angle_detail: The consistent structure across the series — conditions, then PMF, then a worked example, then
      the moments — makes the four distributions directly comparable, which is what L07's model-selection node
      requires. Watching them back to back is more useful than watching any one of them, because the differences
      between the condition lists are the actual content.
  - kind: watch
    label: Kurzes Tutorium Statistik — discrete distributions
    source_id: source-kurzes-tutorium-statistik
    locator: '''Binomialverteilung''; ''Hypergeometrische Verteilung''; ''Poissonverteilung'''
    scope_triage: helpful-now
    angle: Names the German distribution vocabulary and the Ziehen-mit/ohne-Zurücklegen phrasing that identifies
      each model in an exam question.
    angle_detail: German exam questions signal the intended distribution through fixed phrases — 'mit Zurücklegen',
      'ohne Zurücklegen', 'in einem festen Zeitintervall'. These videos use exactly those phrases while deriving
      each model, which turns the phrase into a reliable trigger. That mapping is not available in any of the
      English sources.
  working_note: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l07/stages/stage-sad-l07-model-selection/notes.md
  attachments: []
  source_feedback: []
