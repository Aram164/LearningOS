- id: stage-rust-18-capstone-own-a-python-to-rust-feature-end-to-end
  number: 18
  title: Capstone — own a Python-to-Rust feature end to end
  status: pending
  objective: Independently design, implement, test, package, profile, document, and review a small native-backed
    Python feature without copying Stratum code.
  done_when:
  - Before code, a no-AI brief defines users, non-goals, Python API, Rust API, data invariants, errors,
    copies, GIL/thread behavior, test oracle, and performance threshold.
  - A pure-Python implementation and a Rust implementation pass the same adversarial and property-oriented
    tests from an installed wheel.
  - The package includes documentation, type-facing API notes, clean build instructions, error behavior,
    repeated benchmarks, and a self-review of every dependency and unsafe assumption.
  - Only after the working baseline, an AI review may be requested; every suggestion is accepted or rejected
    with a reason and validated independently.
  - Seven days later, the core boundary and kernel are rebuilt or explained closed-book without AI.
