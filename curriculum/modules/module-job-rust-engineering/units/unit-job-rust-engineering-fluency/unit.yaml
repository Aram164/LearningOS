knowledge_map:
  summary: Given an unfamiliar Rust or PyO3 path, independently explain ownership, borrowing, lifetime,
    trait, error, concurrency, and FFI behavior; design a small crate with explicit invariants; follow
    compiler diagnostics rather than guessing; test, document, profile, and package it; and review a Python-to-Rust
    boundary for copies, errors, GIL behavior, and thread safety. Evidence is a no-AI Rust/Python extension
    capstone and a read-only architectural comparison with Stratum, not completion of readings.
  nodes:
  - id: knowledge-job-rust-stage-01
    title: Tooling, Cargo, and the compiler feedback loop
    summary: Build the smallest complete Rust crate and learn to treat cargo, rustc diagnostics, rustfmt,
      clippy, tests, and documentation as one engineering feedback loop.
  - id: knowledge-job-rust-stage-02
    title: Bindings, types, expressions, and control flow
    summary: Write idiomatic Rust syntax from memory and reason about mutability, shadowing, expressions,
      numeric conversions, loops, matches, and function signatures.
  - id: knowledge-job-rust-stage-03
    title: Ownership, moves, Clone, and Drop
    summary: Predict ownership transfers and design APIs that make allocation and copying visible.
  - id: knowledge-job-rust-stage-04
    title: Borrowing, slices, and reborrowing
    summary: Design borrowed APIs with shared and exclusive access, slices, and scopes that satisfy invariants
      without unnecessary allocation.
  - id: knowledge-job-rust-stage-05
    title: Structs, enums, pattern matching, and domain models
    summary: Model valid states with structs and enums so impossible or unhandled cases become compiler-visible.
  - id: knowledge-job-rust-stage-06
    title: Collections, Result, and iterator fundamentals
    summary: Choose collections by access pattern, propagate typed failures, and replace index-heavy loops
      with clear iterator code where it improves correctness.
  - id: knowledge-job-rust-stage-07
    title: Traits, generics, and interface design
    summary: Express capability-based interfaces with trait bounds and choose static or dynamic dispatch
      deliberately.
  - id: knowledge-job-rust-stage-08
    title: Lifetimes and borrowed API contracts
    summary: Annotate lifetime relationships by reasoning about which output borrows from which input,
      and redesign APIs when borrowing would make ownership unclear.
  - id: knowledge-job-rust-stage-09
    title: Modules, crates, workspaces, and public boundaries
    summary: Organize a multi-module crate with a small public API, private implementation details, feature-aware
      dependencies, and reproducible metadata.
  - id: knowledge-job-rust-stage-10
    title: Closures, iterators, and zero-cost pipelines
    summary: Reason about Fn/FnMut/FnOnce capture, iterator ownership, laziness, and allocation while
      building expressive data pipelines.
  - id: knowledge-job-rust-stage-11
    title: Smart pointers, shared ownership, and interior mutability
    summary: Select Box, Rc, Arc, Cell, RefCell, Mutex, or ordinary ownership from the actual sharing
      and mutation requirements.
  - id: knowledge-job-rust-stage-12
    title: Testing, documentation, clippy, and API quality
    summary: Treat examples, unit tests, integration tests, property checks, compiler lints, and documentation
      as parts of the public contract.
  - id: knowledge-job-rust-stage-13
    title: Concurrency, Send, Sync, channels, and Rayon
    summary: Design concurrent work with explicit ownership, deterministic results, bounded resources,
      and measured benefit.
  - id: knowledge-job-rust-stage-14
    title: Async Rust, cancellation, and blocking boundaries
    summary: Understand Future polling, executors, cancellation, pinning at a conceptual level, and when
      async is inappropriate for CPU-bound kernels.
  - id: knowledge-job-rust-stage-15
    title: Production errors, serialization, and ecosystem choices
    summary: Design stable error categories and adopt ecosystem crates only after understanding their
      contract, maintenance cost, and boundary behavior.
  - id: knowledge-job-rust-stage-16
    title: PyO3, maturin, the GIL, and Python boundary design
    summary: Build and reason about a small Python extension whose types, ownership, errors, copies, ABI,
      and threading behavior are explicit.
  - id: knowledge-job-rust-stage-17
    title: Sparse buffers, NumPy interop, and performance evidence
    summary: Reason about contiguous and sparse layouts, dtype and index contracts, copies, parallel kernels,
      and benchmark validity across Python and Rust.
  - id: knowledge-job-rust-stage-18
    title: Capstone — own a Python-to-Rust feature end to end
    summary: Independently design, implement, test, package, profile, document, and review a small native-backed
      Python feature without copying Stratum code.
  - id: knowledge-job-rust-stage-19
    title: Pull-based advanced clinic — unsafe, macros, and type-level techniques
    summary: Approach advanced Rust only when a concrete problem demands it, with explicit safety invariants,
      expansion inspection, and simpler alternatives documented first.
