knowledge_map:
  summary: Routing topics transcribed from the existing stage objectives; study order and scope retained.
  nodes:
  - id: knowledge-python-roadmap-01
    title: 'Step 1 — Baseline: syntax & core mechanics'
    summary: You're past this. Listed for gap-fills only.
  - id: knowledge-python-roadmap-02
    title: Step 2 — Names, objects, references, mutability
    summary: 'The single most important mental-model fix from C++. Everything else builds on it. Symptoms
      it repairs: aliasing surprises, mutable default arguments, shallow vs deep copy confusion, "is `=`
      a copy?"'
  - id: knowledge-python-roadmap-03
    title: Step 3 — Scope, namespaces, functions as objects
    summary: 'Repair the symptoms this step names: `UnboundLocalError`, confusion about what a function
      "sees", `global`/`nonlocal`, passing functions around.'
  - id: knowledge-python-roadmap-04
    title: Step 4 — The data model & dunder methods
    summary: 'The "grand unified theory" of Python: `len()`, operators, `for` loops, `with` — all just
      call dunders. Symptoms it repairs: dunders feel magic; you don''t know which to implement; `print(obj)`
      shows `<object at 0x...>`.'
  - id: knowledge-python-roadmap-05
    title: Step 5 — Built-in containers & comprehensions
    summary: 'Repair the symptoms this step names: misusing lists where sets/dicts fit, slice confusion,
      sort vs sorted, clunky loops that should be comprehensions.'
  - id: knowledge-python-roadmap-06
    title: Step 6 — Strings, bytes, and formatting
    summary: 'Repair the symptoms this step names: `UnicodeDecodeError`, `b''...''` confusion, ugly string
      building.'
  - id: knowledge-python-roadmap-07
    title: 'Step 7 — Classes I: mechanics'
    summary: 'Repair the symptoms this step names: `self` feels magic, instance vs class attributes blur,
      `@classmethod` vs `@staticmethod` unclear.'
  - id: knowledge-python-roadmap-08
    title: 'Step 8 — Classes II: inheritance, super(), MRO, mixins'
    summary: 'Your named headache. The repair plan''s Sessions 3–4 are the drill version of this step.
      Symptoms it repairs: super() confusion, mixin `__init__` chains, subclassing pandas/numpy/sklearn,
      diamond inheritance.'
  - id: knowledge-python-roadmap-09
    title: Step 9 — Data class builders
    summary: 'Repair the symptoms this step names: writing boilerplate `__init__`/`__repr__`/`__eq__`
      by hand.'
  - id: knowledge-python-roadmap-10
    title: Step 10 — Duck typing, ABCs, protocols
    summary: 'Repair the symptoms this step names: "what type does this function accept?", `isinstance`
      overuse, designing interfaces.'
  - id: knowledge-python-roadmap-11
    title: Step 11 — Closures & decorators
    summary: 'Repair the symptoms this step names: `@something` syntax feels magic, can''t write a decorator
      with arguments, losing function metadata.'
  - id: knowledge-python-roadmap-12
    title: Step 12 — Iterators, generators, lazy pipelines
    summary: 'Repair the symptoms this step names: `yield` confusion, iterator-exhausted-once surprises,
      memory blowups from loading whole files.'
  - id: knowledge-python-roadmap-13
    title: Step 13 — Context managers, with / else / match
    summary: 'Repair the symptoms this step names: `with` feels like ritual, can''t write your own, `try/else`
      semantics unclear.'
  - id: knowledge-python-roadmap-14
    title: Step 14 — Exceptions & error handling
    summary: 'Repair the symptoms this step names: bare `except:`, unsure what to catch, when to define
      custom exceptions.'
  - id: knowledge-python-roadmap-15
    title: Step 15 — Type hints
    summary: 'Repair the symptoms this step names: reading hinted signatures in skrub/sklearn/Stratum,
      `Optional`, generics, mypy errors.'
  - id: knowledge-python-roadmap-16
    title: Step 16 — Modules, imports, packages, environments
    summary: 'Repair the symptoms this step names: `ModuleNotFoundError`, `__init__.py` mystery, circular
      imports, "works in IDE not terminal."'
  - id: knowledge-python-roadmap-17
    title: Step 17 — Standard library power tools
    summary: 'Repair the symptoms this step names: writing 10 lines for what stdlib does in 1; manual
      path surgery; nested loops that should be `itertools`.'
  - id: knowledge-python-roadmap-18
    title: Step 18 — Pythonic style & idioms
    summary: 'Repair the symptoms this step names: code works but reads like translated C++.'
  - id: knowledge-python-roadmap-19
    title: Step 19 — Concurrency & the GIL
    summary: Relevant for AMLS parallelism + job perf work.
  - id: knowledge-python-roadmap-20
    title: Step 20 — Interpreter internals
    summary: The "how does it actually work" itch. Your C++ background is an asset here.
  - id: knowledge-python-roadmap-21
    title: 'Step 21 — Attribute magic: properties, descriptors, metaclasses, module `__getattr__`'
    summary: Read to understand libraries; you will write `@property` often, descriptors occasionally,
      metaclasses almost never.
  - id: knowledge-python-roadmap-22
    title: Step 22 — Runtime introspection & reflection
    summary: 'Used pervasively in Stratum: `isinstance`, `getattr`, `hasattr`, `type`, `vars`, `inspect`.
      Symptoms it repairs: confused by code that reads/modifies objects without knowing their type at
      write-time; `isinstance` chains; `getattr(obj, name, default)` calls.'
  - id: knowledge-python-roadmap-23
    title: Step 23 — Import machinery & monkey-patching
    summary: 'Stratum''s `patching/_patching.py` is a full monkey-patching system. Understanding it requires
      knowing how Python''s import system works. Symptoms it repairs: `importlib.import_module` looks
      foreign; `setattr(module, "ClassName", MyClass)` seems wrong; "why would you replace a class inside
      another module?"'
  - id: knowledge-python-roadmap-24
    title: 'Step 24 — Generator coroutines: `send()`, `throw()`, `StopIteration.value`'
    summary: 'Used in `ImplOp.process()` in Stratum to fuse a generator-based evaluation protocol with
      regular function calls. Symptoms it repairs: `gen.send(value)` looks wrong; confused by `StopIteration
      as e: return e.value`; difference between a generator and a coroutine is unclear.'
  - id: knowledge-python-roadmap-25
    title: 'Step 25 — Python ↔ Rust/C FFI: PyO3, maturin, C extensions'
    summary: 'Stratum has a Rust backend (`_rust_backend_native`) compiled with PyO3/maturin. This is
      what "developing microkernels underneath Python" means. Symptoms it repairs: `.so`/`.pyd` import
      fails or succeeds mysteriously; `from . import _rust_backend_native` looks like magic; unsure how
      to write and build a Rust function callable from Python.'
  - id: knowledge-python-roadmap-26
    title: Step 26 — DAG / IR patterns in Python
    summary: 'Stratum''s entire optimizer is a DAG transformation pipeline in Python. These patterns come
      from compiler design — PL theory applied in Python. Symptoms it repairs: code that builds and transforms
      graph structures feels ad-hoc; unclear how to visit all nodes, replace nodes, maintain input/output
      edges consistently.'
  - id: knowledge-python-roadmap-27
    title: Step 27 — `__slots__`, `weakref`, memory layout
    summary: 'For performance-sensitive code; relevant when Op DAGs get large. Symptoms it repairs: high
      memory usage from many small objects; `weakref` appearing in buffer pool code; `__slots__` in scikit-learn
      internals.'
  - id: knowledge-python-roadmap-28
    title: Step 28 — CPU & timing profiling ("making Python faster")
    summary: 'Step 27 covers memory; this is its time counterpart. A cost-based optimizer only pays off
      if you can measure where time actually goes — this is the profiling half the roadmap was missing.
      Symptoms it repairs: "it feels slow" with no numbers; guessing at hot spots; optimizing the wrong
      loop; no baseline before/after a rewrite.'
