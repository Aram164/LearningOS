    label: 'Going deeper: `sys.getrefcount(obj)` — see CPython''s reference count live; `id(obj)` — the
      memory address, which is what `is` compares. weakref module — references that don''t prevent garbage
      collection; important for cache / buffer pool patterns like Stratum''s `BufferPool`.'
    url: https://docs.python.org/3/library/weakref.html
  - kind: reference
    label: 'Stratum anchor: `BufferPool.live_variable_map` holds `(size, data)` tuples keyed by `Op` objects.
      The `pin`/`unpin`/`remove` pattern is a manual reference-counting cache. Understanding object identity
      (`is` vs `==`) is essential to see why `Op` objects can safely be dict keys.'
