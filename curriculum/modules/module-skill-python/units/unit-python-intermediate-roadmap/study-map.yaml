  - kind: reference
    label: '`sys.modules`: a plain dict mapping module names to module objects. First `import foo` executes
      `foo.py` and stores the result in `sys.modules["foo"]`. Every subsequent `import foo` just returns
      `sys.modules["foo"]`. Monkey-patching works because ALL code that does `from foo import Bar` later
      gets…'
    id: resource-python-roadmap-23-03
  - kind: reference
    label: '`importlib.import_module(name)`: programmatic equivalent of `import name`; returns the module
      object. If the module is already in `sys.modules`, returns the cached object without re-executing.
      Used in `_patching.py`''s `_import_module()`.'
    id: resource-python-roadmap-23-04
  - kind: reference
    label: '`setattr(module, "ClassName", ReplacementClass)`: replaces the name `ClassName` in `module.__dict__`.
      Any code in that module that uses `ClassName` after the patch sees the new class. Code that already
      did `from module import ClassName` and stored a local binding is NOT affected — order matters.'
    id: resource-python-roadmap-23-05
