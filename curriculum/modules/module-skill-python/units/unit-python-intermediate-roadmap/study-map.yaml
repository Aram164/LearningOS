- id: stage-python-step-26-dag-ir-patterns-in-python
  number: 26
  title: Step 26 — DAG / IR patterns in Python
  status: pending
  objective: 'Stratum''s entire optimizer is a DAG transformation pipeline in Python. These patterns come
    from compiler design — PL theory applied in Python. Symptoms it repairs: code that builds and transforms
    graph structures feels ad-hoc; unclear how to visit all nodes, replace nodes, maintain input/output
    edges consistently.'
  done_when:
  - You can read an optimizer pass in `_algebraic_rewrites.py` and explain what invariant it maintains
    and what it transforms.
  exam_critical: false
  concepts:
  - concept-python
  scope_triage: helpful-now
  resources:
  - kind: reference
    label: Roadmap Step 26 in full — symptoms, materials, drills, done-when.
    locator: '## Step 26 — DAG / IR patterns in Python'
    vault_path: knowledge/notes/programming/note-python-intermediate-roadmap.md
  - kind: reference
    label: 'Core graph representation · Node + edge list: `Op` in Stratum uses explicit `inputs: list[Op]`
      and `outputs: list[Op]` on each node — a doubly-linked representation. Enables O(1) parent and child
      lookup at the cost of keeping both sides in sync.'
  - kind: reference
    label: 'Core graph representation · Topological sort: Kahn''s algorithm (`deque` + indegree dict)
      in `_optimize.py`''s `topological_traverse`. DFS-based in `_linearization.py`''s `linearize_dag`.
      Know both.'
  - kind: read
    label: 'Core graph representation · Article: Python.org — Implementing Graphs — adjacency lists
      and graph traversal in Python.'
    url: https://www.python.org/doc/essays/graphs/
  - kind: read
    label: 'Core graph representation · Book: CLRS §22 (Graph algorithms, already in your Algo2 plan)
      — the formal version; the Stratum code is direct applied CLRS.'
  - kind: reference
    label: 'Node replacement (rewrite rules) · Pattern: find a node matching a pattern → create a new
      node → rewire inputs/outputs of neighbors. `replace_op_in_outputs(op, replacement)` and `op.replace_input(old,
      new)` in `_op_utils.py` are the two primitives. Every optimizer pass uses these.'
  - kind: reference
    label: 'Node replacement (rewrite rules) · Visitor pattern: iterating `topological_iterator(root)`
      and applying a transform to each node — this is the visitor design pattern. Python''s `singledispatch`
      makes it clean: dispatch by node type.'
  - kind: reference
    label: 'Node replacement (rewrite rules) · Three ways to dispatch by node type — and when to pick
      each: an `elif node.type == …` chain (closed, small, hot — e.g. `NumericOp.process` in `_numeric_ops.py`);
      subclass polymorphism (each type overrides a method — e.g. `ColumnExpr.to_pandas`/`to_polars`, open
      to…'
  - kind: reference
    label: 'Node replacement (rewrite rules) · Reference: python-patterns.guide — Visitor — Brandon Rhodes''
      treatment; read after Step 21.'
    source_id: source-rhodes-python-patterns
    url: https://python-patterns.guide/
  - kind: reference
    label: 'CSE (Common Subexpression Elimination) · Concept: if two subtrees are identical (same op type
      + same inputs), compute once, reuse the result. Stratum''s `_cse.py` implements this.'
  - kind: reference
    label: 'CSE (Common Subexpression Elimination) · Python implementation: hash-cons — assign each node
      a hash based on its type + the hashes of its inputs; equal hashes → candidate for merging. Requires
      `__hash__` and `__eq__` on node types (or an external hash table keyed on structural equality).'
  - kind: read
    label: 'CSE (Common Subexpression Elimination) · Article: Wikipedia — Common subexpression elimination
      — concept overview; then read `_cse.py`.'
    url: https://en.wikipedia.org/wiki/Common_subexpression_elimination
  - kind: reference
    label: Linearization / scheduling · Topological order = valid execution order. Post-order DFS on a
      DAG = reverse topological order (output last).
  - kind: reference
    label: 'Linearization / scheduling · Stratum''s split invariant: all ops before `split_pos` are pre-split
      (fit phase), all after are post-split (predict phase). The deferred-pop logic in `linearize_dag`
      enforces this.'
  - kind: reference
    label: 'Linearization / scheduling · Buffer pool / liveness analysis: after linearization, for each
      op compute the last point where each of its inputs is needed (`remove_after` list in `_input_removal_planning.py`).
      This is register allocation / liveness analysis from compiler theory.'
  - kind: reference
    label: 'Immutable IR vs mutable IR · Stratum uses mutable IR (nodes have mutable `inputs`/`outputs`
      lists, in-place rewriting). This is simpler but requires careful bookkeeping. Alternative: immutable
      IR where rewrites return new nodes (functional style, easier to debug). Know the trade-off.'
  - kind: read
    label: 'Resources · Book: Crafting Interpreters (Nystrom, free online) — the best accessible intro
      to IR design, AST walking, and optimization passes. Not Python-specific but your C++ background
      makes Part II very readable.'
    url: https://craftinginterpreters.com/index.html
  - kind: read
    label: 'Resources · Book: Engineering a Compiler (Cooper & Torczon, 3rd ed.) — the textbook for compiler
      middle-end (IR, optimization, register allocation). Graduate-level; dip in when you hit a specific
      Stratum concept.'
  - kind: reference
    label: 'Resources · Python AST as a worked example: `import ast; tree = ast.parse("x + 1"); ast.dump(tree)`
      — Python''s own IR for source code. `ast.NodeVisitor` and `ast.NodeTransformer` are the visitor
      and rewriter patterns in stdlib form. Green Tree Snakes — the missing Python AST docs.'
    url: https://greentreesnakes.readthedocs.io/
  - kind: reference
    label: 'Resources · Stratum anchor: read `_optimize.py` top-to-bottom as a complete compiler middle-end
      pipeline: parse (skrub → Op IR), optimize (CSE, rewrites, choice unrolling), legalize (algebraic
      rewrites), lower (linearize), schedule.'
  - kind: practise
    label: 'Resources · Drill: build a minimal expression DAG in Python: nodes are `Add(left, right)`,
      `Mul(left, right)`, `Const(value)`. Write a topological sort, a simple constant-folding pass (replace
      `Add(Const(1), Const(2))` with `Const(3)`), and an evaluator that walks the DAG.'
  - kind: practise
    label: 'Resources · Done when: you can read an optimizer pass in `_algebraic_rewrites.py` and explain
      what invariant it maintains and what it transforms.'
