    vault_path: knowledge/notes/programming/note-python-oop-scope-repair-plan.md
  - kind: reference
    label: 'Light version now (~30 min) · the "interpreter" mystery mostly dissolves with three facts:'
  - kind: reference
    label: Everything is an object created at runtime — `def` and `class` are statements that execute,
      not declarations.
  - kind: reference
    label: Every function call creates a frame; local scope IS the frame. When the frame dies, locals
      die.
  - kind: reference
    label: 'See it physically: `import dis; dis.dis(your_function)` — `LOAD_FAST` = local lookup, `LOAD_GLOBAL`
      = global lookup. Scope made visible.'
  - kind: read
    label: 'Deep version (post-Jul 15, ~1.5h) · Allison Kaptur — A Python Interpreter Written in Python.
      Your C++ background is an asset here. Optional after: Philip Guo''s CPython lectures L1/L3/L8 (see
      LEARNING-RESOURCES.md §8 Tier 3).'
    source_id: source-kaptur-byterun
