- id: stage-python-repair-session-3-inheritance-plus-super-the-headache-session
  number: 3
  title: Session 3 — Inheritance + super() (the headache session)
  status: pending
  objective: '`super()` does NOT mean "my parent." It means "the next class after me in this object''s
    MRO (method resolution order)." In single inheritance the next class IS the parent, so the simple
    intuition usually works — until multiple inheritance (mixins, like `PandasProvenanceMixin`), where
    the MRO is a single linear sequence through ALL classes and `super()` just moves one step along it.
    Print it: `ClassName.__mro__`.'
  done_when:
  - Drill 2's output stops surprising you.
  estimate_minutes: 90
  exam_critical: false
  concepts:
  - concept-python
  scope_triage: helpful-now
  resources:
  - kind: reference
    label: Session 3 in full — reading, drill snippets, and the plan's own timings.
    locator: '## Session 3 — Inheritance + super() (the headache session)'
