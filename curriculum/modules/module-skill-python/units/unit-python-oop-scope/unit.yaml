knowledge_map:
  summary: Routing topics transcribed from the existing stage objectives; study order and scope retained.
  nodes:
  - id: knowledge-python-oop-01
    title: Session 1 — Names, values, scope (the root of everything)
    summary: Your C++ intuition (variables are boxes holding values) is the bug. In Python, variables
      are labels pointing at objects.
  - id: knowledge-python-oop-02
    title: 'Session 2 — Class mechanics: self, instance vs class attributes'
    summary: '`obj.method(x)` is just `Class.method(obj, x)`. `self` is not magic — it''s an ordinary
      first argument. A class is a dict of names; attribute lookup goes instance `__dict__` → class →
      parent classes.'
  - id: knowledge-python-oop-03
    title: Session 3 — Inheritance + super() (the headache session)
    summary: '`super()` does NOT mean "my parent." It means "the next class after me in this object''s
      MRO (method resolution order)." In single inheritance the next class IS the parent, so the simple
      intuition usually works — until multiple inheritance (mixins, like `PandasProvenanceMixin`), where
      the MRO is a single linear sequence through ALL classes and `super()` just moves one step along
      it. Print it: `ClassName.__mro__`.'
  - id: knowledge-python-oop-04
    title: Session 4 — Subclassing real libraries (mlprov-shaped)
    summary: TU Python-for-ML Sheet 2 — the inheritance/NumPy exercises. Real exercises with code, already
      mapped to mlprov/job in HANDOFF.
  - id: knowledge-python-oop-05
    title: Session 5 — The interpreter, demystified
    summary: 'Allison Kaptur — A Python Interpreter Written in Python. Your C++ background is an asset
      here. Optional after: Philip Guo''s CPython lectures L1/L3/L8 (see LEARNING-RESOURCES.md §8 Tier
      3).'
