- id: stage-python-optimizer-theory-and-rewrite-soundness
  number: 19
  title: Optional - Phase 2 - logical plans, rewrite soundness, and cost
  status: pending
  objective: 'Optimizer theory is optional background, outside the Python-language goal. Learn why a system
    like Stratum has the shape it has: a declarative abstraction, a logical plan, rewrite rules, lowering
    to physical operators, and cost-based implementation selection. The output is a rule table you could
    defend in a design discussion, not code. Without this, a rewrite proposal can only imitate the shape
    of the rewrites already in the tree.'
  done_when:
  - The Stratum paper read closely enough to state in your own words what it claims, what it actually
    measures, and which of its stated open directions are still open.
  - Six rewrites written up, each with its precondition, the invariant it preserves, and a concrete counterexample
    that breaks it when the precondition is dropped.
  - 'The logical and physical split explained: what a logical operator may assume, what lowering decides,
    and why implementation selection is a separate cost question.'
  - Common subexpression elimination explained as a semantic argument about when two nodes are interchangeable,
    not as a hash-key trick.
  - At least two claims in the write-up marked as uncertain and carried to the paper or a maintainer rather
    than resolved by guessing.
  estimate_minutes: 240
  exam_critical: false
  concepts:
  - concept-python
  scope_triage: deferred
