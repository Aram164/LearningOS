    - id: route-an-exam-prep-analysisskript
      unit_id: unit-m2-analysis-exam-prep
      title: unser skript.pdf — the course contract and the chapter map
      format: course-material
      angle: The document that decides what counts as in scope, at what depth, and
        therefore what every other route on every other session is for.
      angle_detail: 'Read pp. iv-vii once, deliberately, before Chapter 1. Three claims
        there govern the whole plan: Wiederholung sections are assumed known and are
        not re-taught; Ausflug sections should be understood and applied but are not
        an exam focus; Exkurs sections are explicitly outside the exam. And the sentence
        that shapes everything else — ''Die Beweise müssen Sie nicht können'' — with
        the positive form beside it: definitions, results and their application in
        concrete problems are what the exam asks for. Every ''reference-only'' label
        in this module traces back to that page.'
      covers:
      - knowledge-m2-analysis-calibrate
      - knowledge-m2-analysis-anx
      - knowledge-m2-analysis-exkurse
      depth: course-aligned
      scope: current
      locator: 'unser skript.pdf: Vorwort and the three-label contract pp. iv-vii;
