      title: unser skript.pdf Kapitel 2 — the scope authority
      format: course-material
      angle: The chapter that installs the one axiom the rest of the script cannot
        do without, in the form this examiner states it.
      angle_detail: 'Read what the task actually asks: not ''compute the supremum''
        but ''determine it and prove your answer'', with maximum and minimum asked
        separately so the sup-versus-max distinction has to be argued rather than
        assumed. Its own Tipp routes the solution through monotonicity and convergence
        of two auxiliary sequences — that is, it answers a Chapter 2 question with
        Chapter 3 machinery, which is the dependency this session should leave in
        place. Beyond this one Hausaufgabe there is no current HU practice for Chapter
        2; that gap has been open and unowned since the 2026-08-03 audit.'
      covers:
