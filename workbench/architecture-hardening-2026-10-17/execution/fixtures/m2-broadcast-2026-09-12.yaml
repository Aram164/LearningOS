    - id: route-an-exam-prep-analysisskripthu
      unit_id: unit-m2-analysis-exam-prep
      title: HU Aufgaben zur Wiederholung und Vertiefung — the exam-format set, held
        for timed sittings
      format: exercise
      angle: The only current HU material that states its own exam conditions — the
        closest available simulation of the Analysis half of the paper.
      angle_detail: 'This is the set to protect. It is named on the Chapter 3, 4 and
        5 sessions so those sessions know what they are preparing for, but it is worked
        here, cold and timed, not there. Its own framing is unusually explicit: exam-format
        questions, 30-45 minutes each, covering Chapters 1 to 5 only. That coverage
        boundary is also the honest limit of this rehearsal — there is no HU-format
        material for Chapters 6 and 7 at all, so a full Analysis mock has to be assembled
        from external papers and labelled as an assembly.'
      covers:
      - knowledge-m2-analysis-anx
      depth: practice
      scope: current
      locator: 'ana_inf_serieWV.pdf: WV1.1 Folgen, WV1.2 Stetigkeit, WV1.3 Konvergenzkriterien,
        WV1.4 Bisektionsverfahren — 20 points each, and the sheet''s own instruction:
        these cover Kapitel 1 to 5 (up to §5.5), ''die so auch in einer Klausur enthalten
        sein könnten'', to be attempted first under exam conditions at about 30-45
        minutes per task'
      vault_path: material://source-analysis-skript/ana_inf_serieWV.pdf
