      title: unser skript.pdf Kapitel 2 — the scope authority
      format: course-material
      angle: The chapter that installs the one axiom the rest of the script cannot
        do without, in the form this examiner states it.
      angle_detail: Read §2.3 as the chapter and the rest as its setting. Completeness
        is stated here in the supremum form, and every convergence theorem from Chapter
        3 onward is either a direct consequence or reaches it through Bolzano-Weierstraß
        — so the exact statement, including which sets it applies to, is worth more
        than any amount of practice on §2.1. The §2.4 Ausflug on machine numbers is
        the chapter's Informatik payoff; the contract puts it at overview depth, and
        no other source on this menu covers it at all.
      covers:
