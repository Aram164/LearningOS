      format: course-material
      angle: One page that answers the question the course contract leaves open —
        if proofs need not be reproduced, which ones are still worth understanding.
      angle_detail: 'Read once at calibration to see the shape of the answer: twenty
        results for a 225-page script, concentrated in Chapters 3 and 6. Then use
        it per chapter, where it is routed individually, to repair a failed application.
        The disclaimer is real and is why this is a calibration input rather than
        an authority — it is an experienced reader''s shortlist, not exam intelligence,
        and the plan treats it as the former.'
