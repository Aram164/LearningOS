module_id: module-job-polars
plan_contract:
  version: 2
  plan_template_version: 1
  coverage_audit: work/active/workspace-job-modules-l2-17-2026-10-24/outputs/coverage-audit-l2-17.md
  intentional_reorders: []
  checks:
    local_inventory_complete: true
    linked_inventory_complete: true
    materials_opened_and_content_checked: true
    current_and_prior_scope_reconciled: true
    duplicates_and_numbering_checked: true
    exclusions_and_unresolved_gaps_recorded: true
unit_revisions:
- unit_id: unit-job-polars-pandas-fluency
  route_changes:
    add: []
    update: []
    remove: []
  stage_patches:
  - stage_id: stage-polars-01-two-data-models-and-the-eight-divergence-axes
    fields:
      resources:
      - id: resource-polars-version-lock
        kind: practise
        label: Freeze the Stratum backend environment
        locator: Stratum/pyproject.toml (pandas pin) and Stratum/uv.lock (resolved
          polars version)
        angle: The one task that must pass before any other observation on this module
          means anything.
        angle_detail: pandas is pinned in pyproject.toml; polars is not, so its version
          comes from the lockfile and can move under you on the next resolve. Write
          the probe that prints both and fails loudly on a mismatch, and import it
          from the harness in Stage 2 — a parity suite that runs against unknown versions
          produces confident nonsense.
        scope_triage: required-now
      - id: resource-polars-01-sheet
        kind: practise
        label: Stage exercise sheet - six tasks with fixtures, prediction slots and
          a verified key
        locator: attachments/s01-exercises.md - Fixture F1, then Tasks 1-6 in order
        angle: 'The stage''s actual work: concrete frames, the exact calls, and the
          observation table each task owes.'
        angle_detail: Task 1 constructor inference, Task 2 the NaN/null/three-valued
          truth table, Task 3 alignment in three sub-cases (including the one where
          the two libraries agree for the wrong reason), Task 4 the cold derivation
          of the axes, Task 5 the fifteen-difference table with an evidence rule,
          Task 6 the backfill into Stage 2's harness. Each task states its trap, so
          a task that feels easy can be checked rather than assumed. Predict before
          running; the sheet has a slot for it because a prediction you did not record
          teaches nothing.
        scope_triage: required-now
        vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-pandas-fluency/stages/stage-polars-01-two-data-models-and-the-eight-divergence-axes/attachments/s01-exercises.md
      - id: resource-polars-01-sheet-check
        kind: practise
        label: Answer-key self-check - 22 assertions against the pinned pair
        locator: attachments/s01-check.py - run after attempting Tasks 1-3
        angle: Confirms the sheet's key in your environment, so a disagreement is
          a finding rather than self-doubt.
        angle_detail: 'Every expected value on the sheet was executed against pandas
          3.0.2 / polars 1.36.0 and is re-asserted here. It exits non-zero if the
          versions differ, because a pass under other builds would prove nothing.
          Run it after attempting, never before: it is a check on the sheet as much
          as on you, and reading it first spends Task 4, which is unrepeatable.'
        scope_triage: required-now
        vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-pandas-fluency/stages/stage-polars-01-two-data-models-and-the-eight-divergence-axes/attachments/s01-check.py
      - kind: read
        label: Required core — python-polars-the-definitive-guide.pdf
        id: resource-polars-01-01-required-core-python-polars-the-defini
        locator: Ch 3 'Moving from Pandas to Polars' §Concepts to Unlearn pp. 83-92
          and §Syntax to Forget pp. 93-98
        vault_path: material://source-polars-definitive-guide/python-polars-the-definitive-guide.pdf
        scope_triage: required-now
        source_id: source-polars-definitive-guide
        angle: The only source here written specifically for someone who already thinks
          in pandas.
        angle_detail: '§Concepts to Unlearn takes the index, axes, slicing, eagerness
          and ''relaxedness'' one at a time — the five assumptions that generate most
          of the eight axes. §Syntax to Forget pp. 94-98 is a side-by-side operation
          table, which is the fastest way to build the Task 5 list. Its limit: it
          argues for Polars rather than specifying pandas, so it will not tell you
          what pandas *promises* — and it is an early-release edition, so confirm
          every callable against 1.36.0.'
      - kind: read
        label: Required core — docs.pola.rs — pandas
        id: resource-polars-01-02-required-core-docs-pola-rs-pandas
        locator: Whole page, and specifically the sections on index, 'no multi-indexes',
          and column assignment
        url: https://docs.pola.rs/user-guide/migration/pandas/
        scope_triage: required-now
        angle: The maintainers' own account of which pandas habits do not transfer
          — shorter and blunter than the book.
        angle_detail: Read it after the book chapter, as a checklist against your
          Task 4 derivation rather than as a first exposure. It is written to persuade
          a migrating user, so it names the differences it considers improvements
          and is silent about the ones that are merely different — the silences are
          where your own axes have to do the work.
      - kind: reference
        label: Official reference — pandas.pydata.org — dsintro.html
        id: resource-polars-01-06-official-reference-pandas-pydata-org-d
        locator: §'DataFrame' → 'From dict of ndarrays / lists', and the dtype-inference
          notes
        url: https://pandas.pydata.org/docs/user_guide/dsintro.html
        scope_triage: reference-only
        angle: 'The pandas side of Task 1: what the constructor promises about inferred
          dtypes.'
        angle_detail: 'Read it to establish whether the float promotion you observe
          in Task 1 is documented behaviour or an implementation detail. That distinction
          decides whether the Stratum contract may rely on it. Note the page is version-current:
          read the pandas 3.0 string-dtype note, because a pre-3.0 tutorial will tell
          you the opposite.'
      - kind: reference
        label: Official reference — pandas.pydata.org — copy_on_write.html
        id: resource-polars-01-07-official-reference-pandas-pydata-org-c
        locator: §'Copy-on-Write optimization' and §'Chained assignment'
        url: https://pandas.pydata.org/docs/user_guide/copy_on_write.html
        scope_triage: reference-only
        angle: Explains why pandas 3.0 no longer returns views, which removes one
          axis from your list.
        angle_detail: 'Worth reading precisely to *cross something off*: mutation-through-a-view
          divergences that dominate older pandas/Polars comparisons are gone under
          CoW, so a note written against pandas 1.x will send you hunting for a class
          of bug that no longer exists here. Record it as a resolved axis rather than
          an open one.'
      - kind: reference
        label: Official reference — docs.pola.rs — data types and structures
        id: resource-polars-01-05-official-reference-docs-pola-rs-data-t
        locator: §'Data types' table and §'Series'/'DataFrame' construction examples
        url: https://docs.pola.rs/user-guide/concepts/data-types-and-structures/
        scope_triage: reference-only
        angle: The dtype vocabulary you need to read a Polars schema out loud, including
          the sized integer types.
        angle_detail: 'Its value for this stage is the enumerated type list: it tells
          you that `UInt32` on a counter is a deliberate index type rather than an
          accident, which is a question Task 1 raises. It says nothing about the pandas
          side.'
      - kind: read
        label: Local material — 03.01-Introducing-Pandas-Objects.ipynb
        id: resource-polars-01-03-local-material-03-01-introducing-panda
        source_id: source-pydata-handbook
        locator: §'The Pandas Index Object' (notebook 03.01)
        vault_path: material://source-pydata-handbook/PythonDataScienceHandbook/notebooks/03.01-Introducing-Pandas-Objects.ipynb
        scope_triage: reference-only
        angle: A pandas-native explanation of the index as a first-class object, which
          is the premise Polars drops.
        angle_detail: 'Useful for one thing: seeing the index treated as an aligned,
          set-like object rather than as row numbers, because that is what makes Task
          3 surprising. Demoted to reference-only — the notebook predates pandas 3.0
          (its string columns are `object`, yours are `str`), so it generates questions
          for the oracle and never answers them.'
      - kind: read
        label: Local material — Pandas_cheatsheet.pdf
        id: resource-polars-01-04-local-material-pandas-cheatsheet-pdf
        source_id: source-python-cheatsheets
        locator: Both pages; the reshaping and 'combine data sets' panels
        vault_path: material://source-python-cheatsheets/Pandas_cheatsheet.pdf
        scope_triage: reference-only
        angle: Operation-name recall only — the fastest way to remember what a pandas
          call is called.
        angle_detail: Dated 2017. Use it to *find* the name of an operation you half-remember
          for the Task 5 table, then verify every signature against pandas 3.0.2 before
          writing it down. It cannot establish current semantics and several of its
          defaults have since changed.
      - kind: reference
        label: Optional depth — arrow.apache.org — Columnar.html
        id: resource-polars-01-09-optional-depth-arrow-apache-org-column
        locator: §'Validity bitmaps' and §'Physical memory layout'
        url: https://arrow.apache.org/docs/format/Columnar.html
        scope_triage: deferred
        angle: 'The mechanism under Task 2: why null and NaN can be orthogonal at
          all.'
        angle_detail: Deferred because you can complete the stage without it. Read
          it when the three-valued `is_nan()` result stops feeling arbitrary and you
          want to see why a separate validity buffer makes it inevitable. Session
          8 returns here for chunk and conversion costs.
      - id: resource-polars-01-polars-first
        kind: practise
        label: Polars-first drill set - five drills, no pandas anywhere
        locator: attachments/u1-polars-first.md - Drills 1-5; Drill 4 is the one to
          take away
        angle: 'The half of Session 1 that is not about pandas: what Polars is, learned
          from Polars.'
        angle_detail: 'Session 1''s two stages are about the contract, which teaches
          Polars as ''the thing that is not pandas''. This is the other half. Drill
          3 learns the API by its namespaces rather than its functions — given an
          unfamiliar task you should be able to name the namespace before searching,
          which is what actually makes a large API usable. Drill 4 is the deep one:
          an expression is a value, so it can be stored in a variable, returned by
          a function and built by a comprehension. Every later capability — selectors,
          `over`, lazy optimization, the meta namespace — follows from it.'
        scope_triage: required-now
        vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-pandas-fluency/stages/stage-polars-01-two-data-models-and-the-eight-divergence-axes/attachments/u1-polars-first.md
      - id: resource-polars-01-polars-first-check
        kind: practise
        label: Polars-first drill self-check - 25 assertions
        locator: attachments/u1-polars-first-check.py
        angle: Pins the namespace shapes and the chunk behaviour, both of which are
          version-sensitive.
        angle_detail: It asserts the exact membership of the `struct` and `meta` namespaces
          and that concatenation produces two chunks while `rechunk` produces one.
          Those are the two facts in the drill set most likely to move between releases,
          which makes them the two worth having a test for.
        scope_triage: required-now
        vault_path: curriculum/modules/module-job-polars/units/unit-job-polars-pandas-fluency/stages/stage-polars-01-two-data-models-and-the-eight-divergence-axes/attachments/u1-polars-first-check.py
      - kind: practise
        label: Book companion repository - runnable notebooks and the book's own datasets
        locator: github.com/jeroenjanssens/python-polars-the-definitive-guide - ch01.ipynb
          through ch18.ipynb, plus data/
        url: https://github.com/jeroenjanssens/python-polars-the-definitive-guide
        angle: 'Turns the local PDF spine into executable material: the same examples,
          as notebooks, with the datasets.'
        angle_detail: The PDF you own is read-only and an early-release edition; this
          is its official companion, MIT-licensed, with one notebook per chapter and
          the `data/` directory the book's examples assume. Two uses. First, run a
          chapter's notebook against the pinned 1.36.0 and record every cell that
          has drifted from the book's text — that is a free, high-yield source of
          harness cases and it tells you exactly how far the early-release edition
          has moved. Second, it gives you realistic frames to work on, so exercises
          stop being three-row toys. Pin its environment to Stratum's versions rather
          than its own pyproject, or the drift you measure is the repo's, not the
          book's.
        scope_triage: helpful-now
        source_id: source-polars-definitive-guide
        id: resource-polars-01-book-repo
