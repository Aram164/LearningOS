  # ---- transformers (AML L11, added 2026-08-15 with the current 2026 deck)
  - from: concept-embedding
    type: requires
    to: concept-tokenization
    context: "the embedding matrix E ∈ ℝ^{|V|×d} is indexed by the vocabulary tokenization produces (L11 sl. 36)"
    source: note-aml-l11-transformers
  - from: concept-contextual-embedding
    type: builds-on
    to: concept-embedding
    context: "static embeddings map a token to one fixed vector regardless of context; contextual ones do not (L11 sl. 21–22)"
    source: note-aml-l11-transformers
  - from: concept-attention
    type: derives
    to: concept-contextual-embedding
    context: "attention IS the mechanism producing contextual representations: a_t = Σ_{j≤t} α_tj v_j (L11 sl. 24, 44)"
    source: note-aml-l11-transformers
  - from: concept-attention
    type: requires
    to: concept-softmax
    context: "attention weights are softmax-normalized similarity scores; the same softmax as L08's output layer (L11 sl. 30)"
    source: note-aml-l11-transformers
  - from: concept-transformer
    type: builds-on
    to: concept-attention
    context: "a transformer block is multi-head self-attention + FFN + residual + LayerNorm (L11 sl. 52)"
    source: note-aml-l11-transformers
  - from: concept-transformer
    type: requires
    to: concept-layer-normalization
    context: "LayerNorm is applied twice per block (L11 sl. 54–55)"
    source: note-aml-l11-transformers
  - from: concept-transformer
    type: requires
    to: concept-residual-connection
    context: "residual connections preserve the token stream across blocks (L11 sl. 52, 55)"
    source: note-aml-l11-transformers
  - from: concept-transformer
    type: requires
    to: concept-positional-encoding
    context: "attention is permutation-invariant, so position must be added: x_t = x_t + p_t (L11 sl. 48)"
    source: note-aml-l11-transformers
  - from: concept-transformer
    type: requires
    to: concept-neural-network
    context: "the per-block feedforward layer is the L08 two-layer MLP, weights shared across positions (L11 sl. 53)"
    source: note-aml-l11-transformers
  - from: concept-transformer
    type: contrasts-with
    to: concept-recurrent-networks
    context: "both model sequences; the 2026 deck replaced the prior-year RNN lecture — transformers parallelize over the sequence, RNNs cannot (L11 sl. 74)"
    source: note-aml-l11-transformers
  - from: concept-language-modelling
    type: applies-in
    to: concept-transformer
    context: "next-token prediction is the training objective the architecture is fitted to (L11 sl. 60)"
    source: note-aml-l11-transformers
  - from: concept-language-modelling
    type: requires
    to: concept-cross-entropy
    context: "the LM training loss is cross-entropy over the vocabulary — the same loss derived in L05 (L11 sl. 64)"
    source: note-aml-l11-transformers
  - from: concept-residual-connection
    type: applies-in
    to: concept-convolutional-networks
    context: "L10 closes on residual connections (ResNet) before L11 reuses them in the transformer block"
    source: note-aml-l11-transformers

