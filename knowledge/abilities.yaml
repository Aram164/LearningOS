  source: curriculum/modules/module-hu-aml/units/unit-aml-l09/study-map.yaml#stage-aml-l09-backprop
  conditions: [specified network activation loss parameters and input, no worked solution shown]
  evidence_spec: [forward values and shapes, dz dW db and da for every layer, correct explanation of a parameter update]
  concept_ids: [concept-backpropagation, concept-chain-rule]
  module_ids: [module-hu-aml]
  preparation_routes:
  - all_of: [ability-chain-rule-graph, ability-mlp-forward-shapes, ability-aml-backprop-local]
    reason: Full layerwise derivation extends a correct local backward step through every layer.
    source: curriculum/modules/module-hu-aml/units/unit-aml-l09/unit.yaml
  - all_of: [ability-chain-rule-graph, ability-mlp-forward-shapes, ability-sad-backprop-local]
    reason: Local transfer from SaD can prepare the shared derivative mechanism, while AML's full pass still needs its own work.
    source: knowledge/notes/cross-domain/note-aml-sad-master-wiring.md
  review: {state: reviewed, reviewed_by: codex-ability-review-agent, reviewed_on: '2026-09-23'}
