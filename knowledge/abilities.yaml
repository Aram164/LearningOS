    reason: A correct local backward step uses the chain rule and a known forward computation.
    source: curriculum/modules/module-hu-aml/units/unit-aml-l09/unit.yaml
  review: {state: reviewed, reviewed_by: codex-ability-review-agent, reviewed_on: '2026-09-23'}
