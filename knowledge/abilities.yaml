  source: curriculum/modules/module-hu-m2-statistik-analysis/units/unit-m2-sad-l15/study-map.yaml#stage-sad-l15-forward
  conditions: [specified network input parameters and activations, no worked solution shown]
  evidence_spec: [each affine and activation output, compatible dimensions throughout]
  concept_ids: [concept-backpropagation]
  module_ids: [module-hu-aml, module-hu-m2-statistik-analysis]
  preparation_routes: []
  review: {state: reviewed, reviewed_by: codex-ability-review-agent, reviewed_on: '2026-09-23'}
- id: ability-aml-backprop-local
  title: Calculate local backpropagation gradients in AML
  claim: Given a specified graph and loss, propagate one output derivative backward through local operations and show the resulting parameter gradient.
  source: curriculum/modules/module-hu-aml/units/unit-aml-l09/study-map.yaml#stage-aml-l09-backprop
  conditions: [specified differentiable graph and loss, no worked solution shown]
  evidence_spec: [correct local derivative chain, correct parameter gradient and shape]
  concept_ids: [concept-backpropagation, concept-chain-rule]
  module_ids: [module-hu-aml]
  preparation_routes:
