# Independently reviewed ability identities. These do not attest learner work.
abilities:
- id: ability-chain-rule-graph
  title: Apply the chain rule on a computation graph
  claim: Calculate loss derivatives along each path of a small differentiable graph, sum branch contributions, and show intermediate values and shapes.
  source: curriculum/modules/module-hu-aml/units/unit-aml-l09/study-map.yaml#stage-aml-l09-chain-rule
  conditions: [specified differentiable graph and loss, no worked solution shown]
  evidence_spec: [derivative for each local operation, branch contributions summed correctly, intermediate values and shapes shown]
  concept_ids: [concept-chain-rule]
  module_ids: [module-hu-aml, module-hu-m2-statistik-analysis]
  preparation_routes: []
  review: {state: reviewed, reviewed_by: codex-ability-review-agent, reviewed_on: '2026-09-23'}
- id: ability-mlp-forward-shapes
  title: Calculate a specified network's forward pass and shapes
