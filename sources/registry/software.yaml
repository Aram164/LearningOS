  # Authored ladder + the books it added to the shelf. Built 2026-08-02 from the
  # Level-Up competency map, the Intermediate Roadmap and the OOP/Scope Repair Plan;
  # the job-specific anchors deliberately stay in Job/ (CLAUDE.md §13).
  - id: source-python-depth-drills
    thematic_group_ids: [thematic-group-software]
    title: Python Depth Drills — nine stages (guides + notebooks, authored)
    type: other
    authors: [Aram Aljanadi]
    year: 2026
    material: material://source-python-depth-drills
    evaluations:
      - concepts: [concept-python]
        roles: [exercise, first-learning, reference]
        level: intermediate
        strengths:
          - "⭐ The ladder form of the Python middle band: 9 stages × ~20 predict-then-run questions (165 total), each stage = one guide (claim → ranked reading → drills → done-when → traps checklist) + one notebook with folded solutions. Every code cell verified to execute; claimed outputs diffed against real output"
          - "Stages 0/6/7/8 exist to close the four gaps the Level-Up competency map rated needs 4–5 / currently 2–3 and the original five-stage plan didn't reach: identity+mutation (rated the widest gap), the data model, generators, and interfaces/dispatch"
          - "Complements rather than duplicates the other two Python docs: the Roadmap is symptom→step lookup, the Repair Plan is five drill sessions, this is the ordered gated ladder. Guides cite Roadmap steps and Repair Plan sessions instead of restating them"
        weaknesses:
          - "Questions tagged [Stratum] are anchored to a query-optimizer codebase (renamed and re-shaped, answerable without access to it). The file-level anchors live outside this tree in Job/python-drills/STRATUM-ANCHORS.md"
        useful_sections:
          - "Stage 0 — names, identity & mutation": "the prerequisite the older plans skipped; Stages 2/4/5 are this same rule in three costumes"
          - "Stage 8 — interfaces & dispatch": "tag-dispatch vs subclass polymorphism (the expression problem), the one stage that is mostly judgement"
          - "SHELF.md": "cross-cutting sources no stage owns — testing (pytest/Hypothesis), debugging (pdb, PDSH 01.06), performance (PDSH 01.07, cProfile, tracemalloc), style"

