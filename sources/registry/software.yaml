- id: source-hypothesis-docs
  title: Hypothesis — property-based testing for Python
  type: documentation
  thematic_group_ids:
  - thematic-group-software
  organization: Hypothesis
  url: https://hypothesis.readthedocs.io/en/latest/quickstart.html
  evaluations:
  - concepts:
    - concept-python
    roles:
    - implementation
    level: intermediate
    strengths:
    - 'Turns invariants into tests: ''a == b implies hash(a) == hash(b)'' and ''copying then mutating
      the copy never changes the original'' are properties a fuzzer can falsify. ~30 min to the basics;
      pairs with depth-drills Stages 0 and 6'
