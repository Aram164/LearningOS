- id: source-slatkin-effective-python
  title: Slatkin - Effective Python (2nd edition full text; 3rd edition contents sample)
  type: book
  thematic_group_ids:
  - thematic-group-software
  authors:
  - Brett Slatkin
  year: 2020
  material: material://source-slatkin-effective-python/effective-python.pdf
  evaluations:
  - concepts:
    - concept-python
    roles:
    - review
    - reference
    level: intermediate
    strengths:
    - '⭐ The best complement to Fluent Python at the intermediate band: 125 short items, four minutes
      each, telling you what to DO where FP explains how the language works. Per-stage item mapping is
      in the depth-drills SHELF.md §1a'
    - 3e Item 21 'Be Defensive when Iterating over Arguments' is the one-shot-iterator hazard stated as
      an API-design rule — the single best four pages on it anywhere
    - 3e Item 49 'Prefer Object-Oriented Polymorphism over functools.singledispatch' is depth-drills Stage
      8's expression-problem judgement stated outright — the 3rd ed. is the only edition that has it
    - 3e Items 92–96, 99, 108–115 are the only local coverage of the three cross-cutting topics no depth-drills
      stage owns (testing, debugging, performance) — SHELF.md §3a/3b/3c. Items 94–96 (replacing Python
      with C, ctypes, extension modules) also feed the Rust/PyO3 track, Roadmap Step 25
    weaknesses:
    - ⚠️ TWO FILES, ONE RECORD. Citations throughout the depth drills use 3rd-ed numbering, taken from
      effective-python-3e-toc-sample.pdf — an 80-page publisher sample that carries the complete 125-item
      table of contents but NO item body text. The readable full text on the shelf (effective-python.pdf,
      the `material:` path above) is the 2nd ed., 90 items, Python 3.8-era. To read a cited item in the
      2e copy, use the 3e→2e crosswalk in SHELF.md §1a
    - ~35 items are 3rd-ed-only and have no 2e text on the shelf at all — including 3e 20, 22, 30, 39,
      46, 49, 50, 51, 65, 89, 93. SHELF.md §1a marks which stage citations fall in that set
    - Concurrency (3e Items 67–79) and asyncio are deliberately out of scope for the depth ladder — Roadmap
      Step 19
