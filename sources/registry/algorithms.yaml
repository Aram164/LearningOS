# Algorithms & Computation — algorithms and data structures, complexity, approximation.
#
# Filed by SUBJECT (ADR-007). A record's home says what it is, never when it
# arrived — the previous partitions were named after migration batches
# (stage2, stage2b-unsorted-intake, external-shelf, external-supplements,
# degree-anchors), which are archived verbatim under
# migration/adr-007/originals/.
#
# Partitioning does not change semantics: this is the same registry as
# sources/sources.yaml, and source ids are unchanged, so no reference moved.
sources:
  - id: source-algo2-frankfurt-klausuren
    thematic_group_ids: [thematic-group-algorithms]
    title: Frankfurt Algo-2 Klausuren with solutions (2021-2024, local)
    type: other
    material: material://source-algo2-frankfurt-klausuren
    evaluations:
      - concepts: [concept-amortized-analysis, concept-shortest-paths, concept-max-flow,
                   concept-fibonacci-heaps, concept-b-trees]
        roles: [mock-exam, exercise]
        audience: [German readers]
        strengths:
          - "Eight solved Frankfurt ALGO2 exams (2021-2024, two sittings/year) — written format, but the worked solutions double as explain-aloud drill for the oral exam"
  - id: source-arora-barak
    thematic_group_ids: [thematic-group-algorithms]
    title: "Arora & Barak — Computational Complexity: A Modern Approach"
    type: book
    authors: [Sanjeev Arora, Boaz Barak]
    url: https://theory.cs.princeton.edu/complexity/
    evaluations:
      - roles: [first-learning, reference]
        strengths:
          - "Free draft PDF; carries the Computational Complexity module AND ADM III's PCP/hardness block AND the RP/BPP/ZPP material in Randomized Algorithmics"

  - id: source-clrs
    thematic_group_ids: [thematic-group-algorithms]
    title: "Cormen/Leiserson/Rivest/Stein — Algorithmen (4. Aufl. DE = EN 3rd ed)"
    type: book
    authors: [Thomas Cormen, Charles Leiserson, Ronald Rivest, Clifford Stein]
    material: material://source-clrs/clrs-de.pdf
    evaluations:
      - concepts: [concept-amortized-analysis, concept-b-trees, concept-fibonacci-heaps,
                   concept-shortest-paths, concept-max-flow, concept-fft,
                   concept-computational-geometry]
        roles: [first-learning, review]
        level: intermediate
        audience: [German readers]
        strengths:
          - "'Das Buch' of the Moodle-verified Algo-2 literature: Kap 17 amortisierte Analyse, 18 B-Bäume, 19 Fibonacci-Heaps, 24–25 kürzeste Wege, 26.1–26.2 max flow; Kap 30 FFT + 33 Geometrie expected for the unposted topics"

  - id: source-cmu-15451-splay-notes
