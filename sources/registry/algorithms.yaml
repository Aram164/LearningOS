        audience: [German readers]
        strengths:
          - "Short German flipped-classroom topic videos (8–25 min) — the splay-tree video + the 4-part flow series are the highest-value pulls; Übungsblätter (APSP, Netzwerkfluss I+II, Amortisiert+Splay) add German exam-language drill (unsolved; the weekly videos walk solutions). Pairs with the solved Frankfurt Klausuren record"

