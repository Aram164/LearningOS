    type: documentation
    organization: CMU
    url: https://www.cs.cmu.edu/~15451-f23/lectures/lecture08-splay-trees.pdf
    evaluations:
      - roles: [derivation]
        strengths:
          - "The inventor's home-course telling of the access-lemma potential argument — cleaner than Ottmann/Widmayer for the proof part of AL.E2"

  - id: source-cygan-parameterized
