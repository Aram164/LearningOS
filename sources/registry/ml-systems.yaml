# ML Systems — training and serving at scale, ML compilation, performance, data for ML.
#
# Filed by SUBJECT (ADR-007). A record's home says what it is, never when it
# arrived — the previous partitions were named after migration batches
# (stage2, stage2b-unsorted-intake, external-shelf, external-supplements,
# degree-anchors), which are archived verbatim under
# migration/adr-007/originals/.
#
# Partitioning does not change semantics: this is the same registry as
# sources/sources.yaml, and source ids are unchanged, so no reference moved.
sources:
  - id: source-amls-prior-archives
    thematic_group_ids: [thematic-group-ml-systems]
    title: AMLS prior-year archives — SS2023 (TU Berlin) + SS2021 (TU Graz), Boehm
    type: website
    authors: [Matthias Boehm]
    url: https://mboehm7.github.io/teaching/ss23_amls/index.htm
    identifiers:
      ss21: https://mboehm7.github.io/teaching/ss21_amls/index.htm
    evaluations:
      - roles: [review]
        strengths:
          - "Same professor, same course, one year prior; the SS23 page DOES link mp4 recordings for all 12 lectures (tubcloud links next to each deck — verified Jun 13). SS23 grading was oral exam 100% with project prerequisite"
        weaknesses:
          - "Superseded by the SS26 course page (source-amls-ss26-lectures) for lecture processing — keep as fallback/extra pass"

  - id: source-amls-ss26-lectures
    thematic_group_ids: [thematic-group-ml-systems]
    title: AMLS — Architecture of ML Systems, slides, recordings, and source papers (SS26)
    type: lecture
    authors:
    - Matthias Boehm
    organization: TU Berlin
    year: 2026
    url: https://mboehm7.github.io/teaching/ss26_amls/index.htm
    material: material://source-amls-ss26-lectures
    evaluations:
    - roles:
      - first-learning
      strengths:
      - The course scope authority; all 13 SS26 decks are local and reachable, verified 2026-08-03.
      weaknesses:
      - 'Lecture 12''s title page says ''Last update: Jul 09, 2025'' while the SS26 course sequence places
        it on 2026-07-09; treat the year as an unresolved deck-stamp anomaly.'
    - concepts:
      - concept-ml-systems
      roles:
      - first-learning
      useful_sections:
      - 01 — Introduction and Overview: ML-system definitions, lifecycle, SystemDS and DAPHNE overview
      - 02 — Languages, Architectures, and System Landscape: language abstractions, system stack and landscape
    - concepts:
      - concept-program-rewrites
      roles:
      - first-learning
      useful_sections:
      - 03 — Compilation – Size Inference and Rewrites: size and sparsity inference, rewrite rules, CSE and
          matrix-chain optimization
    - concepts:
      - concept-operator-fusion
      roles:
      - first-learning
      useful_sections:
      - 04 — Compilation – Adaptation, Fusion, and JIT: dynamic recompilation, fusion/code generation, XLA
          and MLIR
    - concepts:
      - concept-data-parallelism
      roles:
      - first-learning
      useful_sections:
      - 05 — Data- and Task-Parallel Execution: MapReduce/Spark, distributed matrix operations and parfor
    - concepts:
      - concept-parameter-servers
      roles:
      - first-learning
      useful_sections:
      - 06 — Parameter Servers: data/model parallelism, BSP/ASP/SSP and federated learning
    - concepts:
      - concept-llm-systems
      roles:
      - first-learning
      useful_sections:
      - 07 — LLM Training and Inference: scaling, distributed training, post-training and inference systems
    - concepts:
      - concept-hardware-accelerators
      roles:
      - first-learning
      useful_sections:
      - 08 — Hardware Accelerators: GPUs, Tensor Cores, interconnects, FPGAs, ASICs and TPUs
    - concepts:
      - concept-data-access-optimization
      roles:
      - first-learning
      useful_sections:
      - 09 — Data Access Methods: caching, partitioning, indexing, compression and quantization
    - concepts:
      - concept-ml-lifecycle
      - concept-data-provenance
      roles:
      - first-learning
      useful_sections:
      - 10 — Data Acquisition and Preparation: acquisition, cleaning, transformation and encoding
      - 11 — Model Selection and Management: search strategies, AutoML/NAS and model lineage
    - concepts:
      - concept-ml-fairness-explainability
      roles:
      - first-learning
      useful_sections:
      - 12 — Model Debugging, Fairness, and Explainability: SliceLine, LIME/SHAP and fairness constraints
    - concepts:
      - concept-model-serving
      roles:
      - first-learning
      useful_sections:
      - 13 — Model Deployment and Serving: exchange, serving optimization, monitoring, drift and updates
    identifiers:
      paper-reading-list: material://source-amls-ss26-lectures/AMLS-Source-Papers-Reading-List.md

  - id: source-cmu-10414
