  # ============================================ §8b Python depth drills (Aug 2026)
  # Authored ladder + the books it added to the shelf. Built 2026-08-02 from the
  # Level-Up competency map, the Intermediate Roadmap and the OOP/Scope Repair Plan;
  # the job-specific anchors deliberately stay in Job/ (CLAUDE.md §13).
  - id: source-python-depth-drills
    title: Python Depth Drills — nine stages (guides + notebooks, authored)
    type: other
    authors: [Aram Aljanadi]
    year: 2026
    material: material://source-python-depth-drills
    evaluations:
      - concepts: [concept-python]
        roles: [exercise, first-learning, reference]
        level: intermediate
        strengths:
          - "⭐ The ladder form of the Python middle band: 9 stages × ~20 predict-then-run questions (165 total), each stage = one guide (claim → ranked reading → drills → done-when → traps checklist) + one notebook with folded solutions. Every code cell verified to execute; claimed outputs diffed against real output"
          - "Stages 0/6/7/8 exist to close the four gaps the Level-Up competency map rated needs 4–5 / currently 2–3 and the original five-stage plan didn't reach: identity+mutation (rated the widest gap), the data model, generators, and interfaces/dispatch"
          - "Complements rather than duplicates the other two Python docs: the Roadmap is symptom→step lookup, the Repair Plan is five drill sessions, this is the ordered gated ladder. Guides cite Roadmap steps and Repair Plan sessions instead of restating them"
        weaknesses:
          - "Questions tagged [Stratum] are anchored to a query-optimizer codebase (renamed and re-shaped, answerable without access to it). The file-level anchors live outside this tree in Job/python-drills/STRATUM-ANCHORS.md"
        useful_sections:
          - "Stage 0 — names, identity & mutation": "the prerequisite the older plans skipped; Stages 2/4/5 are this same rule in three costumes"
          - "Stage 8 — interfaces & dispatch": "tag-dispatch vs subclass polymorphism (the expression problem), the one stage that is mostly judgement"
          - "SHELF.md": "cross-cutting sources no stage owns — testing (pytest/Hypothesis), debugging (pdb, PDSH 01.06), performance (PDSH 01.07, cProfile, tracemalloc), style"

  - id: source-slatkin-effective-python
    title: Slatkin — Effective Python
    type: book
    thematic_group_ids: [thematic-group-programming-languages]
    authors: [Brett Slatkin]
    year: 2024
    material: material://source-slatkin-effective-python/effective-python.pdf
    evaluations:
      - concepts: [concept-python]
        roles: [review, reference]
        level: intermediate
        strengths:
          - "⭐ The best complement to Fluent Python at the intermediate band: 125 short items, four minutes each, telling you what to DO where FP explains how the language works. Per-stage item mapping is in the depth-drills SHELF.md §1a"
          - "3e Item 21 'Be Defensive when Iterating over Arguments' is the one-shot-iterator hazard stated as an API-design rule — the single best four pages on it anywhere"
          - "3e Item 49 'Prefer Object-Oriented Polymorphism over functools.singledispatch' is depth-drills Stage 8's expression-problem judgement stated outright — the 3rd ed. is the only edition that has it"
          - "3e Items 92–96, 99, 108–115 are the only local coverage of the three cross-cutting topics no depth-drills stage owns (testing, debugging, performance) — SHELF.md §3a/3b/3c. Items 94–96 (replacing Python with C, ctypes, extension modules) also feed the Rust/PyO3 track, Roadmap Step 25"
        weaknesses:
          - "⚠️ TWO FILES, ONE RECORD. Citations throughout the depth drills use 3rd-ed numbering, taken from effective-python-3e-toc-sample.pdf — an 80-page publisher sample that carries the complete 125-item table of contents but NO item body text. The readable full text on the shelf (effective-python.pdf, the `material:` path above) is the 2nd ed., 90 items, Python 3.8-era. To read a cited item in the 2e copy, use the 3e→2e crosswalk in SHELF.md §1a"
          - "~35 items are 3rd-ed-only and have no 2e text on the shelf at all — including 3e 20, 22, 30, 39, 46, 49, 50, 51, 65, 89, 93. SHELF.md §1a marks which stage citations fall in that set"
          - "Concurrency (3e Items 67–79) and asyncio are deliberately out of scope for the depth ladder — Roadmap Step 19"

  - id: source-cosmicpython-architecture-patterns
    title: Percival & Gregory — Architecture Patterns with Python
    type: book
    thematic_group_ids: [thematic-group-programming-languages, thematic-group-data-systems]
    authors: [Harry Percival, Bob Gregory]
    url: https://www.cosmicpython.com/
    evaluations:
      - concepts: [concept-python]
        roles: [reference]
