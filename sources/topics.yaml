# The topic facet (ADR-009).
#
# Topics are the ONE genuinely new Library facet. The other four already exist:
# domain = thematic_group_ids (ADR-007), form = a source's `type`, purpose =
# evaluations[].roles, current use = module source-maps and stage resources.
#
# WHY A CLOSED VOCABULARY. Free tags decay — deep-learning / DL / neural-networks
# / NN / advanced / advanced-reference all arrive within a year and the
# organization goes with them. Adding a topic here is a deliberate act; adding
# one on a source is not possible unless it is listed here (the validator
# enforces it).
#
# WHY FLAT. Each topic declares a `domain`, but ONLY so the Library can group
# them for display. It is not a constraint: a source whose domain is
# machine-learning may carry the `optimization` topic freely. Nesting topics
# under domains would reintroduce exactly the single-placement problem this
# facet exists to remove — Goodfellow is deep learning AND optimization AND
# generative modelling, and no tree survives that.
#
# WHERE THE LINE IS. Topics are for *navigation* — 20–40 of them, medium-grained.
# Fine intellectual granularity belongs to the concept graph, which already has
# hundreds of entries. "Deep Learning" is a topic; "batch normalization",
# "cross-entropy" and "gradient clipping" are concepts. If you find yourself
# wanting a topic for something a concept already names, use the concept.
#
# POPULATION IS ON USE, NEVER BULK (ADR-005). A source gains topics the first
# time it is actually used, cited or recommended in a session — the same rule as
# concept-linked evaluations. A one-shot pass over all 239 sources would invent
# judgments about ~200 sources nobody has opened, which is precisely the failure
# mode that rule exists to prevent. The Library therefore starts sparse and
# fills in honestly; sparse is not a bug to be fixed by a backfill script.

