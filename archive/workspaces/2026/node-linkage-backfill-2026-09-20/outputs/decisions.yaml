notes:
  # M2 exam-prep: 15 stages share 12 nodes; s04/s05/s06 share the
  # random-variables node (L06/L07/L08 are all distributions-side),
  # s07/s08 share inference. s06 stays distributions-side despite the
  # likelihood shade: the stage is L08 Normal/CLT, not estimation.
  # AML mocks sit under integration (timed retrieval papers), repairs
  # under error-control. Taper joins error-control: its operative
  # content is the error ledger + A4 retrieval discipline.
  # Rehearsal repair joins switching: its objective keeps only
  # switching/time errors joint, returning the rest to subject maps.
  # Polars-01 joins divergence-axes: the version pin is setup, the
  # taught outcome is the axes-as-checklist. Nodes with no stage
  # (aml scope/logistics, polars version-contract) are map-level
  # context, not warnings; the check is per-stage only.
