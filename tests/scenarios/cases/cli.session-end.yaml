  - {site: cli.session-end.ownership-conflict, where: "tools/learning_os/ops/handlers/session.py:63", reason: fixture-inexpressible, proof: _prove_session_ownership_conflict}
  - {site: cli.session-end.head-changed, where: "tools/learning_os/ops/handlers/session.py:75", reason: fixture-inexpressible, proof: _prove_session_head_changed}
