  destinations: ["<TMPDIR>/learningos-plan-check-*/**"]
  reason: "Populates ephemeral shadow copies in TMPDIR during --check preflights."

"tools/learning_os/app/handlers/note_analysis.py":
  effect: operational
  destinations: ["<EXPLICIT_OUT_DIR>/**"]
  reason: "Stages reviewed note-analysis bodies and envelope in an explicit caller staging directory outside the repository."

"tools/learning_os/app/handlers/platform.py":
  effect: operational
  destinations: ["<EXPLICIT_OUT_FILE>"]
  reason: "Writes backup-manifest JSON to explicit --out path validated outside every backed-up root."

"tools/learning_os/app/handlers/plan.py":
  effect: operational
  destinations: ["<EXPLICIT_REPORT_OUT>"]
  reason: "Saves create-only --check --report-out files outside canonical data roots."

"tools/learning_os/app/lock.py":
  effect: operational
  destinations: ["<STATE>/operator.lock", "<STATE>/learningos-*.lock"]
  reason: "Manages repository advisory flock files in the session state directory."

"tools/learning_os/app/session.py":
  effect: operational
  destinations: ["<GIT_INDEX_AND_COMMIT>"]
  reason: "Commits session-touched paths via an isolated temporary GIT_INDEX_FILE."

"tools/learning_os/app/validation.py":
  effect: cache
  destinations: ["generated/reports/validation-report.md"]
  reason: "Writes the rendered validation report alongside the validation cache under generated/reports/."

"tools/learning_os/derive/projection/outputs.py":
