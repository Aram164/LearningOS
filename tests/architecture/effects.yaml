"tools/learning_os/store/ai_actions/storage.py":
  effect: operational
  destinations: ["operations/ai-actions/**"]
  reason: "Manages non-canonical AI action requests, slice bundles, and delivery staging under operations/ai-actions/."

"tools/learning_os/store/contracts/data_contract.py":
