# Effect classification for the A2 static writer census (SPEC §3.2d, CL-06).
# Exact repository-relative paths only; wildcards, stale zero-write entries,
# and uncontracted DATA_ROOTS claims fail tests/test_arch_writes.py.

"tools/agent_run.py":
  effect: operational
  destinations: ["<TMPDIR>/**"]
  reason: "Stages immutable session-bound envelope temp copies in TemporaryDirectory; delegates report files to agent_reporting.py."

"tools/assemble_lecture_study_maps.py":
  effect: operational
  destinations: ["<EXPLICIT_OUT_DIR>/**"]
  reason: "Writes assembled study-map drafts into an explicit caller-specified --out directory."

"tools/build_material_search_index.py":
  effect: cache
  destinations: ["generated/material-search/**"]
  reason: "Builds and swaps the disposable SQLite FTS5 material search index cache under generated/."

"tools/build_materials_tree.py":
  effect: operational
  destinations: ["../materials/**"]
  reason: "Maintains the external sibling materials/ topic tree and .flat compatibility symlinks under --apply."

"tools/capture_world.py":
  effect: tooling
  destinations: ["<OUT_DIR>/**"]
  reason: "Captures a read-only world snapshot bundle into an explicit --out directory for comparison gates."

"tools/check_shard_completeness.py":
  effect: tooling
  destinations: ["<OUT_DIR>/**"]
  reason: "Merges CI witness audit logs into a scratch verification directory."

"tools/compare_world.py":
  effect: tooling
  destinations: ["../scratch/world-runs/**", "<TMPDIR>/**"]
  reason: "Overlays captured-world fixtures in disposable scratch worktrees during release comparison checks."

"tools/contract_bundle.py":
  effect: tooling
  destinations: ["<OUT_DIR>/**"]
  reason: "Emits bundled JSON Schema artifacts into an explicit --out build directory."

"tools/diagnostics_prune.py":
  effect: cache
  destinations: ["operations/diagnostics/**", "generated/derived-state/**", "generated/reports/validation-report.cache.json", "generated/reports/validation-report-receipts.cache.json"]
  reason: "Prunes the disposable diagnostics trace store, unreferenced derived-state blobs, and retired report cache sidecars."

"tools/evaluate_operator_questions.py":
  effect: tooling
  destinations: ["<EXPLICIT_OUT_FILE>"]
  reason: "Writes offline evaluation packages/reports to the explicit --out path."

"tools/generate_capability_schemas.py":
  effect: projection
  destinations: ["system/schema/capabilities/**", "system/schema/capability-envelope.schema.json", "system/schema/envelope-error-details.fragment.json"]
  reason: "Generates capability payload schemas and the envelope error-details fragment from request schemas and the CLI parser (CONTRACT_ROOTS)."

"tools/ingest_transcript.py":
  effect: operational
  destinations: ["../materials/**"]
  reason: "Saves fetched caption transcripts into the external sibling materials/ tree."

"tools/library_reconciliation.py":
  effect: tooling
  destinations:
    - "<EXPLICIT_OUT_DIR>/**"
    - "archive/workspaces/**/outputs/dispositions.yaml"
    - "archive/workspaces/**/outputs/reconciliation-report.md"
    - "archive/workspaces/**/outputs/applied-check.json"
    - "work/active/*/outputs/dispositions.yaml"
    - "work/active/*/outputs/reconciliation-report.md"
    - "work/active/*/outputs/applied-check.json"
  reason: "Maintains three reconciliation artifacts in an active or archived reconciliation workspace, plus guarded explicit drafts."
  contract: "tree-contract.yaml (workspace output bundles); tools/README.md (library reconciliation)"

"tools/material_outline.py":
  effect: cache
  destinations: ["generated/material-outlines/**", "<EXPLICIT_OUT_DIR>/**"]
  reason: "Caches extracted PDF outline structures under generated/material-outlines/ or an explicit guarded --outline-dir."

"tools/material_summarize.py":
  effect: cache
  destinations: ["knowledge/summaries/**", "<EXPLICIT_OUT_DIR>/**"]
  reason: "Publishes source-bound digest-keyed chapter summaries into knowledge/summaries/ (or a guarded test --cache-dir) only via --promote."
  contract: "system/contracts/tree-contract.yaml#knowledge/summaries (tools/material_summarize.py --promote)"

"tools/material_text.py":
  effect: cache
  destinations: ["generated/.text-cache/**", "<EXPLICIT_OUT_DIR>/**"]
  reason: "Digest-keyed PDF page-text extraction cache under generated/.text-cache/ or an explicit guarded --cache-dir."

"tools/materials_index/cli.py":
  effect: projection
  destinations: ["../materials/README.md", "../materials/FILES.txt", "../materials/INDEX.html"]
  reason: "Regenerates browsable indexes inside the external sibling materials/ tree."

"tools/migrations/curriculum_v2.py":
  effect: migration
  destinations: ["curriculum/**", "work/active/*/CONTEXT.md", "work/active/workspace-degree-planning", "sources/collections/degree-module-anchors.yaml", "migration/curriculum-v2/**"]
  reason: "Retired idempotent v1->v2 curriculum migration preserving originals in migration/curriculum-v2/."
  contract: "tools/migrations/README.md (retired v1->v2 curriculum migration)"

"tools/move_map.py":
  effect: tooling
  destinations: ["tools/**", "tests/**", "tests/architecture/moves.yaml", "system/**", "pyproject.toml", "Makefile"]
  reason: "Mechanical module/path move tool updating imports/references across tools/, tests/, system/, pyproject.toml, Makefile via git mv (--apply only; leaves all DATA_ROOTS forbidden)."
  contract: "tools/README.md (OD9 maintenance move tool; --apply only)"

"tools/refresh_amls_fixture.py":
  effect: tooling
  destinations: ["tests/fixtures/amls-paper-inventory.yaml"]
  reason: "Refreshes checked-in test fixture YAML from external AMLS list."

"tools/release_pair_receipt.py":
  effect: tooling
  destinations: ["<EXPLICIT_OUT_FILE>"]
  reason: "Emits exact-pair release receipt JSON to the explicit --out path."

"tools/seal_envelope.py":
  effect: tooling
  destinations: ["<EXPLICIT_OUT_FILE>", "<STATE>/sealed-requests/**"]
  reason: "Writes caller-requested sealed GatewayEnvelopeV2 files and local submit retry state."

"tools/study_hooks.py":
  effect: operational
  destinations: ["<EXPLICIT_OUT_DIR>/.claude/settings.json", "<EXPLICIT_OUT_DIR>/.gemini/config/hooks.json"]
  reason: "Generates opt-in IDE/agent hook profiles in an explicit target directory."

"tools/study_launch.py":
  effect: operational
  destinations: ["$LOS_SCRATCH_DIR/**", "~/.local/state/learningos/study-runtimes/**", "<TMPDIR>/**"]
  reason: "Prepares confined study runtime homes and scratch directories under explicit confinement markers."

"tools/system_map.py":
  effect: projection
  destinations: ["system/developer/**"]
  reason: "Regenerates generated ownership/architecture blocks inside system/developer/ docs."

"tools/validate.py":
  effect: cache
  destinations: ["generated/reports/validation-report.md"]
  reason: "Writes the human-readable validation report cache under generated/reports/."

"tools/learning_os/adapters/study_broker.py":
  effect: operational
  destinations: ["$LOS_SCRATCH_DIR/**", "<TMPDIR>/**", "<EXPLICIT_REPORT_OUT>"]
  reason: "Stages bounded broker payloads/inputs in temporary scratch and writes explicit --report-out files outside DATA_ROOTS."

"tools/learning_os/app/agent_reporting.py":
  effect: operational
  destinations: ["<PRIVATE_REPORT_DIR>/**"]
  reason: "Writes incremental full-report recovery logs in private non-canonical report dirs."

"tools/learning_os/app/ai_actions/service.py":
  effect: operational
  destinations: ["operations/ai-actions/**"]
  reason: "Stages slice continuation records and bundle indexes inside operational request directories."

"tools/learning_os/app/backup_manifest.py":
