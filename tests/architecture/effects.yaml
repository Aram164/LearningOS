  destinations: ["knowledge/**", "sources/**", "records/**", "work/**", "curriculum/**", "projects/**", "operations/transactions/**", "operations/legacy/**", "operations/goal-ledger.yaml", "operations/ai-actions/**", "operations/migrations/**"]
