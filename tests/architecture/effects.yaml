  destinations: ["system/contracts/data-contract.yaml"]
  reason: "Updates the schema fingerprint contract file on explicit --bump (CONTRACT_ROOTS, never DATA_ROOTS)."

"tools/learning_os/store/contracts/doc_blocks.py":
