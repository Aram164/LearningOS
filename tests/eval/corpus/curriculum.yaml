# Curriculum of the synthetic world: modules, units, optional study maps and
# the resume pointer. The builder adds `type`, `unit_order`, `source_map`,
# stage numbers, working-note paths and plan_template_version.
#
# `history:` on a study map replays earlier progress states into Git so the
# timeline shows when stages moved.

modules:
  # ------------------------------------------------------ Statistical Learning
  - id: module-tuh-statlearn
    date: 2026-04-13
    record:
      kind: academic
      area_id: program-bachelors
      title: Statistical Learning
      institution: TU Havelberg
      code: INF-SL-4
      credits: 8
      semester: sose-2026
      status: enrolled
      examination:
        type: klausur
        sittings:
          - {termin: 1, date: 2026-07-21, time: "09:00-11:00", label: 1. Termin}
          - {termin: 2, date: 2026-10-06, time: "10:00-12:00", label: 2. Termin}
        registration_windows:
          - {opens: 2026-08-24, closes: 2026-09-11, label: Anmeldung 2. Termin, action: Register in the exam portal., termins: [2]}
      attempts:
        - {termin: 1, date: 2026-07-21, result: withdrawn, notes: Withdrew on 2026-07-14 to prepare properly.}
        - {termin: 2, date: 2026-10-06, result: registered}
    source_map:
      - source_id: source-tuh-statlearn-slides
        role: course-material
        why: Defines exam scope and notation.
        priority: 0
        unit_routes: [unit-statlearn-l03, unit-statlearn-l05, unit-statlearn-l07, unit-statlearn-l09, unit-statlearn-l11]
      - source_id: source-murphy-pml1
        role: derivation
        why: Probabilistic derivations the slides skip.
        priority: 1
        unit_routes: [unit-statlearn-l03, unit-statlearn-l05, unit-statlearn-l07]
      - source_id: source-esl
        role: optional-depth
        why: Regularization geometry and cross-validation pitfalls.
        priority: 2
        unit_routes: [unit-statlearn-l07]
      - source_id: source-bishop-prml
        role: reference
        why: Full PCA derivation.
        priority: 3
        unit_routes: [unit-statlearn-l09]
      - source_id: source-goodfellow-dl
        role: first-exposure
        why: Training neural networks.
        priority: 1
        unit_routes: [unit-statlearn-l11]
    units:
      - id: unit-statlearn-l03
        date: 2026-04-27
        record:
          kind: lecture
          title: Maximum likelihood and least squares
          order: 1
          scope: Likelihood, log-likelihood, MLE for Bernoulli and Gaussian models; least squares as MLE.
          status: complete
          artifacts: {ultimate_reference: note-gaussian-noise-least-squares}
          workspace_ids: [workspace-statlearn-retake]
      - id: unit-statlearn-l05
        date: 2026-05-07
        record:
          kind: lecture
          title: Naive Bayes and generative classifiers
          order: 2
          scope: Bayes classifier, the naive factorization, Laplace smoothing, generative versus discriminative models.
          status: active
          artifacts: {ultimate_reference: note-naive-bayes-spam-filter}
          workspace_ids: [workspace-statlearn-retake]
        study_map:
          id: study-map-statlearn-l05
          date: 2026-09-07
          status: active
          current_stage: stage-l05-02-generative-vs-discriminative
          source_plan: {path: work/active/workspace-statlearn-retake/CONTEXT.md, provenance: learner}
          detours: []
          shelving: {state: none}
          history:
            - date: 2026-07-27
              current_stage: stage-l05-01-derive-naive-bayes
              statuses: {stage-l05-01-derive-naive-bayes: active, stage-l05-02-generative-vs-discriminative: pending}
          stages:
            - id: stage-l05-01-derive-naive-bayes
              exam_critical: true
              concepts: [concept-naive-bayes, concept-bayes-theorem]
              title: Derive the Naive Bayes classifier
              status: complete
              objective: Derive the posterior for a Naive Bayes spam filter from Bayes' rule and state where the naive assumption enters.
              done_when: [Derivation written without the slides.]
              scope_triage: required-now
              resources:
                - {kind: read, label: Slides L05 §2, source_id: source-tuh-statlearn-slides, locator: L05 slides 8-19}
                - {kind: read, label: Murphy §9.3, source_id: source-murphy-pml1, locator: §9.3}
            - id: stage-l05-02-generative-vs-discriminative
              exam_critical: true
              concepts: [concept-generative-vs-discriminative, concept-logistic-regression]
              title: Generative versus discriminative
              status: active
              objective: Compare Naive Bayes with logistic regression on the same features and explain when each wins.
              done_when: [Two-paragraph comparison plus one exam-style question answered.]
              scope_triage: required-now
              resources:
                - {kind: read, label: Slides L05 §4, source_id: source-tuh-statlearn-slides, locator: L05 slides 27-35}
      - id: unit-statlearn-l07
        date: 2026-05-26
        record:
          kind: lecture
          title: Regularization and the bias–variance trade-off
          order: 3
          scope: Bias–variance decomposition, ridge and lasso, choosing lambda by cross-validation.
          status: active
          artifacts: {ultimate_reference: note-bias-variance-decomposition-lecture}
          workspace_ids: [workspace-statlearn-retake]
        study_map:
          id: study-map-statlearn-l07
          date: 2026-08-31
          status: active
          current_stage: stage-l07-01-ridge-lasso-geometry
          source_plan: {path: work/active/workspace-statlearn-retake/CONTEXT.md, provenance: learner}
          detours: []
          shelving: {state: none}
          stages:
            - id: stage-l07-01-ridge-lasso-geometry
              exam_critical: true
              concepts: [concept-regularization]
              title: Ridge and lasso, algebra and geometry
              status: active
              objective: Explain why lasso produces exact zeros and ridge does not, and give the ridge closed form.
              done_when: [Closed form derived; constraint-region sketch explained in words.]
              scope_triage: required-now
              resources:
                - {kind: read, label: ESL §3.4, source_id: source-esl, locator: §3.4 figure 3.11}
                - {kind: read, label: Slides L07, source_id: source-tuh-statlearn-slides, locator: L07 slides 12-30}
            - id: stage-l07-02-choose-lambda
              exam_critical: true
              concepts: [concept-cross-validation]
              title: Choose lambda by cross-validation
              status: pending
              objective: Run k-fold cross-validation for lambda without leaking the test fold.
              done_when: [Notebook with a validation curve.]
              scope_triage: required-now
              resources:
                - {kind: practise, label: Exercise sheet 7, source_id: source-tuh-statlearn-slides, locator: Sheet 7}
      - id: unit-statlearn-l09
        date: 2026-06-08
        record:
          kind: lecture
          title: PCA and the SVD
          order: 4
          scope: Covariance, principal components as eigenvectors, the SVD of the centred data matrix, explained variance.
          status: paused
          artifacts: {ultimate_reference: note-pca-by-hand}
          workspace_ids: [workspace-statlearn-retake]
        study_map:
          id: study-map-statlearn-l09
          date: 2026-06-10
          status: paused
          current_stage: stage-l09-02-svd-connection
          source_plan: {path: work/active/workspace-statlearn-retake/CONTEXT.md, provenance: learner}
          detours: []
          shelving: {state: none}
          stages:
            - id: stage-l09-01-pca-from-covariance
              exam_critical: true
              concepts: [concept-pca, concept-covariance-matrix]
              title: PCA from the covariance matrix
              status: complete
              objective: Compute principal components of a 2-D toy dataset by hand.
              done_when: [Hand computation checked against numpy.]
              scope_triage: required-now
              resources:
                - {kind: read, label: Slides L09, source_id: source-tuh-statlearn-slides, locator: L09 slides 1-20}
            - id: stage-l09-02-svd-connection
              exam_critical: true
              concepts: [concept-svd, concept-pca]
              title: Connect PCA to the SVD
              status: paused
              objective: Show that the right singular vectors of the centred data matrix are the principal directions.
              done_when: [Short proof in own words.]
              scope_triage: required-now
              resources:
                - {kind: read, label: Bishop §12.1, source_id: source-bishop-prml, locator: §12.1}
      - id: unit-statlearn-l11
        date: 2026-07-06
        record:
          kind: lecture
          title: Training neural networks
          order: 5
          scope: Backpropagation, SGD with momentum, adaptive optimizers, batch normalization.
          status: not-started
          artifacts: {}
          workspace_ids: [workspace-statlearn-retake]
        study_map:
          id: study-map-statlearn-l11
          date: 2026-09-01
          status: not-started
          current_stage: stage-l11-01-backprop
          source_plan: {path: work/active/workspace-statlearn-retake/CONTEXT.md, provenance: learner}
          detours: []
          shelving: {state: none}
          stages:
            - id: stage-l11-01-backprop
              exam_critical: true
              concepts: [concept-backpropagation]
              title: Backpropagation by hand
              status: pending
              objective: Backpropagate through a two-layer network on paper.
              done_when: [Gradients match a finite-difference check.]
              scope_triage: required-now
              resources:
                - {kind: read, label: Goodfellow §6.5, source_id: source-goodfellow-dl, locator: §6.5}
            - id: stage-l11-02-optimizers-and-normalization
              exam_critical: true
              concepts: [concept-stochastic-gradient-descent, concept-adaptive-optimizers, concept-batch-normalization]
              title: Optimizers and normalization
              status: pending
              objective: Explain momentum, Adam and batch normalization in exam language.
              done_when: [One-page summary answered from memory.]
              scope_triage: required-now
              resources:
                - {kind: read, label: Slides L11, source_id: source-tuh-statlearn-slides, locator: L11 slides 1-40}

