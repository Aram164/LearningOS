# Canonical registries of the synthetic world (concepts, concept relations,
# sources, programs). `added:` is the date an entry entered the learner's
# repository; the world builder replays registry growth along the timeline.
# The relation registry is deliberately partial, like any real one.

programs:
  - id: program-bachelors
    type: program
    title: Bachelor's (Computer Science, TU Havelberg)
    kind: academic
    status: active
    default: true
    semester_bound: true
    semesters:
      - {id: semester-sose-2026, title: SoSe 2026, status: current, order: 1}
      - {id: semester-wise-2026, title: WiSe 2026/27, status: future, order: 2}
  - id: program-skills
    type: program
    title: Skills
    kind: skills
    status: active
    default: false
    semester_bound: false
    description: Long-running technical skills that are not semester-bound.
    semesters: []

