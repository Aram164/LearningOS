sources:
  # ------------------------------------------------------------ course material
  - id: source-tuh-statlearn-slides
    partition: course-material
    title: TU Havelberg — Statistical Learning lecture slides (SoSe 2026)
    type: lecture
    authors: [Prof. Imke Sørensen]
    material: material://source-tuh-statlearn-slides/L05-generative-classifiers.md
    evaluations:
      - concepts: [concept-maximum-likelihood, concept-naive-bayes, concept-regularization, concept-pca]
        roles: [first-learning]
        level: intermediate
        strengths: [defines the exam scope; notation matches the exam]
        weaknesses: [derivations skip steps; few worked examples]
  - id: source-tuh-dbsys-slides
    partition: course-material
    title: TU Havelberg — Database Systems lecture slides (SoSe 2026)
    type: lecture
    authors: [Dr. Jonas Vierling]
    material: material://source-tuh-dbsys-slides/L08-query-optimization.md
    evaluations:
      - concepts: [concept-relational-algebra, concept-query-optimization, concept-transactions-acid]
        roles: [first-learning]
        level: intermediate
        strengths: [exam-aligned; good worked plan-rewrite examples]
  - id: source-tuh-os-slides
    partition: course-material
    title: TU Havelberg — Operating Systems lecture slides (SoSe 2026)
    type: lecture
    authors: [Prof. Ada Lindqvist]
    material: material://source-tuh-os-slides/L02-scheduling.md
    evaluations:
      - concepts: [concept-cpu-scheduling, concept-virtual-memory, concept-deadlock]
        roles: [first-learning]
        level: introductory
        strengths: [clear diagrams of scheduling timelines]
        weaknesses: [CFS treated in two slides only]
  # --------------------------------------------------------------- mathematics
  - id: source-strang-linalg
    partition: mathematics
    title: Gilbert Strang — Introduction to Linear Algebra (5th ed.)
    type: book
    authors: [Gilbert Strang]
    evaluations:
      - concepts: [concept-eigendecomposition, concept-svd, concept-low-rank-approximation]
        roles: [first-learning, derivation]
        level: introductory
        strengths: [geometric intuition first, then algebra]
  - id: source-3b1b-linalg
    partition: mathematics
    title: 3Blue1Brown — Essence of Linear Algebra
    type: video
    authors: [Grant Sanderson]
    url: https://www.3blue1brown.com/topics/linear-algebra
    evaluations:
      - concepts: [concept-eigendecomposition]
        roles: [intuition]
        level: introductory
        strengths: [best picture of what an eigenvector is]
  - id: source-wasserstein-asa-2016
    partition: mathematics
    title: Wasserstein & Lazar — The ASA Statement on p-Values (2016)
    type: paper
    authors: [Ronald L. Wasserstein, Nicole A. Lazar]
    evaluations:
      - concepts: [concept-hypothesis-testing]
        roles: [review]
        level: intermediate
        strengths: [lists the six principles; corrects the common misreading]
  # ----------------------------------------------------------- machine learning
  - id: source-murphy-pml1
    partition: machine-learning
    title: "Kevin Murphy — Probabilistic Machine Learning: An Introduction"
    type: book
    authors: [Kevin P. Murphy]
    evaluations:
      - concepts: [concept-naive-bayes, concept-maximum-likelihood, concept-map-estimation, concept-bias-variance-tradeoff, concept-regularization]
        roles: [derivation, review]
        level: intermediate
        strengths: [probabilistic view throughout; ridge as MAP made explicit]
        weaknesses: [dense for a first pass]
  - id: source-bishop-prml
    partition: machine-learning
    title: Christopher Bishop — Pattern Recognition and Machine Learning
    type: book
    authors: [Christopher M. Bishop]
    evaluations:
      - concepts: [concept-pca, concept-logistic-regression, concept-hidden-markov-models]
        roles: [derivation]
        level: advanced
        strengths: [complete derivations]
  - id: source-esl
    partition: machine-learning
    title: Hastie, Tibshirani, Friedman — The Elements of Statistical Learning
    type: book
    authors: [Trevor Hastie, Robert Tibshirani, Jerome Friedman]
    evaluations:
      - concepts: [concept-regularization, concept-cross-validation, concept-bias-variance-tradeoff]
        roles: [reference]
        level: advanced
        strengths: [lasso geometry figure; honest about cross-validation pitfalls]
  - id: source-goodfellow-dl
    partition: machine-learning
    title: Goodfellow, Bengio, Courville — Deep Learning
    type: book
    authors: [Ian Goodfellow, Yoshua Bengio, Aaron Courville]
    evaluations:
      - concepts: [concept-backpropagation, concept-stochastic-gradient-descent, concept-convolutional-networks, concept-batch-normalization]
        roles: [first-learning, reference]
        level: intermediate
        strengths: [chapter 6 computational graphs; chapter 8 optimization]
  - id: source-ioffe-batchnorm-2015
    partition: machine-learning
    title: Ioffe & Szegedy — Batch Normalization (2015)
    type: paper
    authors: [Sergey Ioffe, Christian Szegedy]
    evaluations:
      - concepts: [concept-batch-normalization]
        roles: [first-learning]
        level: intermediate
        strengths: [original algorithm and the internal-covariate-shift motivation]
  - id: source-santurkar-batchnorm-2018
    partition: machine-learning
    title: Santurkar et al. — How Does Batch Normalization Help Optimization? (2018)
    type: paper
    authors: [Shibani Santurkar, Dimitris Tsipras, Andrew Ilyas, Aleksander Madry]
    evaluations:
      - concepts: [concept-batch-normalization]
        roles: [review]
        level: advanced
        strengths: [experiments that separate covariate shift from smoothing]
  - id: source-wilson-adaptive-2017
    partition: machine-learning
    title: Wilson et al. — The Marginal Value of Adaptive Gradient Methods (2017)
    type: paper
    authors: [Ashia C. Wilson, Rebecca Roelofs, Mitchell Stern, Nathan Srebro, Benjamin Recht]
    evaluations:
      - concepts: [concept-adaptive-optimizers, concept-stochastic-gradient-descent]
        roles: [review]
        level: advanced
        strengths: [generalization comparison that tempers the "Adam everywhere" habit]
  # ------------------------------------------------------------------- systems
  - id: source-ostep
    partition: systems
    title: "Arpaci-Dusseau — Operating Systems: Three Easy Pieces"
    type: book
    authors: [Remzi Arpaci-Dusseau, Andrea Arpaci-Dusseau]
    url: https://pages.cs.wisc.edu/~remzi/OSTEP/
    evaluations:
      - concepts: [concept-cpu-scheduling, concept-proportional-share, concept-virtual-memory, concept-page-replacement, concept-deadlock, concept-journaling-file-systems]
        roles: [first-learning, review]
        level: introductory
        strengths: [lottery and stride scheduling chapter; crash-consistency chapter]
  - id: source-silberschatz-os
    partition: systems
    title: Silberschatz, Galvin, Gagne — Operating System Concepts
    type: book
    authors: [Abraham Silberschatz, Peter B. Galvin, Greg Gagne]
