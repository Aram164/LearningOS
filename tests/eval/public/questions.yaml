# PUBLIC — retrieval questions, phrased the way the learner would ask them.
#
# Ask each one against a FRESH world (before any scenario has changed it),
# answer as the learner's operator would, and record the answer together with
# the evidence you used (record ids and paths; quote the line when it
# matters). Record format: schemas/answer-result.schema.json.
#
# "I don't know" and "the repository does not say" are valid answers when
# true. Never declare mastery; report evidence or its absence.

schema_version: 1

