objective: 'Scope, run and improve machine-learning-engineering (MLE) agents on medical tasks. Working
  title (Aram, 2026-07-20): *"Exploring and optimizing MLE agents for medical use cases."* The supervisor''s
  brief has four threads: (1) survey MLE-bench and its variants; (2) isolate the medical subset of those
  benchmarks and the openly available use-cases of MLE in medicine; (3) an exploration phase to adjust
  the agents to the specific medical use-case; (4) start testing the given baseline setup, "AID" = AIDE
  (the tree-search reference agent from MLE-bench). Study winning-solution write-ups to understand what
  strong solutions look like.'
